<script>
'use strict';
const LESSONS=[
  {
    "short": [
      "Servicio disponible",
      "Dienst verfügbar"
    ],
    "title": [
      "Que el trabajo pueda continuar",
      "Damit die Arbeit weitergehen kann"
    ],
    "body": [
      "Una tienda usa una aplicación para cobrar. El servidor puede estar encendido y aun así nadie puede cobrar: quizá falla la aplicación o el switch que conecta las cajas. Un servicio está disponible cuando los usuarios autorizados pueden utilizarlo correctamente cuando lo necesitan. Por eso medimos el servicio completo, desde la caja hasta los datos, y no solo el servidor.\n\nLa disponibilidad responde «¿puedo usarlo ahora?». La fiabilidad responde «¿funciona sin fallar durante un intervalo?». Un servicio que se reinicia muchas veces pero se recupera enseguida puede tener mucha disponibilidad y poca fiabilidad. Una operación también debe dar resultados correctos: una caja que calcula mal no cumple su función.\n\nRecuerda lo anterior solo para distinguir funciones: RAID permite continuar ante determinados fallos de discos; un backup permite recuperar datos anteriores; la restauración tarda. Ninguno garantiza por sí solo que el servicio siga disponible ante una avería del servidor, del switch o de la corriente. Antes de elegir equipo, pregunta qué trabajo se detiene y cuánto puede esperar la empresa.",
      "Ein Geschäft nutzt eine Kassenanwendung. Der Server kann eingeschaltet sein, obwohl niemand kassieren kann: Vielleicht ist die Anwendung oder der Switch zwischen Kassen und Server ausgefallen. Ein Dienst ist verfügbar, wenn berechtigte Benutzer ihn zum benötigten Zeitpunkt ordnungsgemäß nutzen können. Deshalb betrachten wir den gesamten Dienst von der Kasse bis zu den Daten, nicht nur den Server.\n\nVerfügbarkeit beantwortet „Kann ich den Dienst jetzt nutzen?“. Zuverlässigkeit beschreibt den störungsfreien Betrieb über einen Zeitraum. Ein Dienst mit vielen kurzen Neustarts kann eine hohe Verfügbarkeit, aber eine geringe Zuverlässigkeit haben. Auch fachlich korrekte Ergebnisse gehören zur ordnungsgemäßen Funktion: Eine falsch rechnende Kasse erfüllt ihre Aufgabe nicht.\n\nAktiviere das Vorwissen nur zur Abgrenzung: RAID ermöglicht den Weiterbetrieb bei bestimmten Festplattenausfällen. Ein Backup ermöglicht die Wiederherstellung früherer Daten; diese Wiederherstellung braucht Zeit. Beides allein hält den Dienst bei einem Server-, Switch- oder Stromausfall nicht verfügbar. Vor der Hardwareauswahl klären wir, welcher Geschäftsprozess ausfällt und wie lange das Unternehmen warten kann."
    ],
    "visual": "chain",
    "check": [
      "El servidor funciona, pero el switch falla. ¿La caja tiene un servicio disponible? Explica por qué.",
      "Der Server läuft, aber der Switch fällt aus. Ist der Kassendienst verfügbar? Begründe."
    ],
    "answer": [
      "No: la caja necesita también la conexión. Si confundiste servidor con servicio, vuelve a seguir la cadena antes de continuar.",
      "Nein: Die Kasse benötigt auch die Verbindung. Falls du Server und Dienst gleichgesetzt hast, gehe die Kette erneut durch."
    ]
  },
  {
    "short": [
      "Medir disponibilidad",
      "Verfügbarkeit messen"
    ],
    "title": [
      "De las horas al porcentaje",
      "Von den Stunden zum Prozentsatz"
    ],
    "body": [
      "Primero fijamos cuándo se necesita el servicio. Supón que debe funcionar durante 100 horas. Los registros muestran dos horas de caída dentro de ese período. Quedan 100 − 2 = 98 horas de funcionamiento. Por cada 100 horas requeridas funcionó 98: la disponibilidad es 98 %.\n\nSi el período es de 200 horas y hay dos de caída, funciona 198 horas. Dividir 198 entre 200 expresa qué parte del tiempo funcionó: 0,99. Multiplicar por 100 lo convierte en 99 %. Las dos horas de caída son iguales, pero representan una parte menor de un período mayor. No compares porcentajes sin conocer el período y qué fallos se cuentan.\n\nAhora podemos abreviar. T significa tiempo total requerido; D, tiempo de caída contado; U, tiempo disponible. Usa la misma unidad para los tres, por ejemplo horas. Primero U = T − D. A significa disponibilidad como fracción: A = U / T. En porcentaje: disponibilidad = A × 100 %. No dividas el tiempo total entre el tiempo disponible: obtendrías un valor mayor que 100 %.",
      "Zuerst legen wir fest, wann der Dienst benötigt wird. Er soll beispielsweise 100 Stunden funktionieren. Das Protokoll zeigt innerhalb dieses Zeitraums zwei Ausfallstunden. Es bleiben 100 − 2 = 98 Betriebsstunden. Von jeweils 100 erforderlichen Stunden war der Dienst 98 Stunden verfügbar: Die Verfügbarkeit beträgt 98 %.\n\nBei 200 erforderlichen Stunden und zwei Ausfallstunden funktioniert der Dienst 198 Stunden. Der Quotient 198 / 200 beschreibt den verfügbaren Anteil: 0,99. Die Multiplikation mit 100 ergibt 99 %. Die Ausfallzeit ist gleich, ihr Anteil am längeren Zeitraum jedoch kleiner. Vergleiche Prozentsätze nur mit bekanntem Bezugszeitraum und bekannten Ausfallregeln.\n\nNun die Kurzschreibweise: T ist die gesamte erforderliche Zeit, D die berücksichtigte Ausfallzeit und U die verfügbare Zeit. Alle drei brauchen dieselbe Einheit, beispielsweise Stunden. Zuerst gilt U = T − D. A bezeichnet die Verfügbarkeit als Anteil: A = U / T. In Prozent: Verfügbarkeit = A × 100 %. Teile nicht die Gesamtzeit durch die verfügbare Zeit; das würde mehr als 100 % ergeben."
    ],
    "visual": "uptime",
    "check": [
      "En 50 horas requeridas hay una hora de caída. ¿Cuántas funcionan y qué porcentaje es?",
      "In 50 erforderlichen Stunden fällt der Dienst eine Stunde aus. Wie viele Stunden läuft er und wie hoch ist die Verfügbarkeit?"
    ],
    "answer": [
      "49 h; 49 / 50 × 100 = 98 %. Si no coincide, calcula primero las horas que funcionan y después su parte del total.",
      "49 h; 49 / 50 × 100 = 98 %. Falls es nicht passt, berechne zuerst die Betriebsstunden, danach ihren Anteil."
    ]
  },
  {
    "short": [
      "Caída permitida",
      "Erlaubte Ausfallzeit"
    ],
    "title": [
      "Convertir una promesa en tiempo",
      "Eine Zusage in Zeit umrechnen"
    ],
    "body": [
      "Una disponibilidad exigida de 99,9 % deja 100 − 99,9 = 0,1 % para caídas. «Por ciento» significa por cada cien: 0,1 / 100 = 0,001 del tiempo. En un año de 365 días con servicio las 24 horas, hay 365 × 24 = 8 760 horas requeridas. Una milésima de ese año son 8 760 × 0,001 = 8,76 horas de caída permitida. Al multiplicar por 60, son 525,6 minutos. 8,76 h no significa 8 h y 76 min: son 8 h y 45,6 min.\n\nCon 99,99 % queda una diezmilésima: 0,0001 × 8 760 = 0,876 h = 52,56 min. Esa cifra exige recuperaciones mucho más breves. Es un presupuesto total del período; no autoriza una caída de esa duración cada día.\n\nLa fórmula abrevia esa idea: Dmáx = T × (1 − A), donde Dmáx es la caída máxima, T el tiempo requerido y A el porcentaje dividido entre 100. Si el servicio solo se exige 8 h al día durante 250 días, T = 2 000 h. Con 99,9 % permite 2 h. Lee siempre si el contrato incluye el mantenimiento programado; en nuestras tareas se declara explícitamente.",
      "Eine geforderte Verfügbarkeit von 99,9 % lässt 100 − 99,9 = 0,1 % für Ausfälle übrig. Prozent bedeutet je hundert: 0,1 / 100 = 0,001 der Zeit. Ein Jahr mit 365 Tagen und 24-Stunden-Betrieb umfasst 365 × 24 = 8 760 erforderliche Stunden. Ein Tausendstel davon sind 8 760 × 0,001 = 8,76 erlaubte Ausfallstunden. Mal 60 ergibt das 525,6 Minuten. 8,76 h sind nicht 8 h und 76 min, sondern 8 h und 45,6 min.\n\nBei 99,99 % bleibt ein Zehntausendstel: 0,0001 × 8 760 = 0,876 h = 52,56 min. Dafür muss die Wiederherstellung erheblich kürzer sein. Es handelt sich um das gesamte Ausfallbudget des Zeitraums, nicht um eine täglich erlaubte Ausfallzeit.\n\nDie Formel kürzt diesen Gedanken ab: Dmax = T × (1 − A). Dmax ist die maximale Ausfallzeit, T die erforderliche Zeit und A der Prozentsatz geteilt durch 100. Wird ein Dienst nur 8 h täglich an 250 Tagen benötigt, gilt T = 2 000 h. Bei 99,9 % sind dann 2 h Ausfall erlaubt. Prüfe stets, ob geplante Wartung mitzählt. Unsere Aufgaben nennen diese Regel ausdrücklich."
    ],
    "visual": "budget",
    "check": [
      "Un mes tiene 30 días de servicio 24/7. Con 99 % de disponibilidad, ¿se permiten 7,2 h o 72 h?",
      "Ein Monat hat 30 Tage im 24/7-Betrieb. Sind bei 99 % Verfügbarkeit 7,2 h oder 72 h erlaubt?"
    ],
    "answer": [
      "7,2 h: 30 × 24 = 720 h y el 1 % es 720 / 100. Si elegiste 72, revisa qué significa por ciento.",
      "7,2 h: 30 × 24 = 720 h; ein Prozent davon ist 720 / 100. Prüfe bei 72 h die Bedeutung von Prozent."
    ]
  },
  {
    "short": [
      "Punto único de fallo",
      "Einzelner Ausfallpunkt"
    ],
    "title": [
      "Duplicar donde el fallo detiene el servicio",
      "Dort verdoppeln, wo ein Ausfall den Dienst stoppt"
    ],
    "body": [
      "Un punto único de fallo es una pieza cuya avería por sí sola interrumpe el servicio. Su término habitual es Single Point of Failure, abreviado SPOF. En una cadena caja → switch → servidor → almacenamiento, cada pieza necesaria puede ser uno. Tener muchos servidores no ayuda si todos dependen del mismo switch averiado.\n\nRedundancia significa disponer de otra pieza o ruta capaz de asumir la función. Dos fuentes de alimentación permiten seguir funcionando cuando una falla, si una sola soporta toda la carga. Dos interfaces de red necesitan también rutas y switches útiles: conectar ambas al mismo switch no cubre la avería de ese switch. El RAID cubre ciertos fallos de discos; para cubrir el fallo del controlador o del NAS hace falta otra solución.\n\nHay que mirar las causas comunes. Dos fuentes conectadas a la misma regleta pierden ambas la corriente si falla esa regleta. Rutas de alimentación separadas y correctamente diseñadas reducen esa dependencia. Dos equipos en el mismo local siguen expuestos al incendio del local. Duplica según el fallo que debes soportar, no según cuántos componentes puedes comprar.",
      "Ein Single Point of Failure, kurz SPOF, ist eine einzelne Komponente, deren Ausfall allein den Dienst unterbricht. In der Kette Kasse → Switch → Server → Speicher kann jede notwendige Komponente ein SPOF sein. Viele Server helfen nicht, wenn sie alle denselben ausgefallenen Switch benötigen.\n\nRedundanz bedeutet, eine weitere Komponente oder einen weiteren Pfad zu haben, der die Funktion übernehmen kann. Zwei Netzteile ermöglichen den Weiterbetrieb bei Ausfall eines Netzteils, sofern ein einzelnes die gesamte Last tragen kann. Zwei Netzwerkkarten benötigen ebenfalls funktionsfähige Wege und Switches. Beide am selben Switch schützen nicht vor dessen Ausfall. RAID deckt bestimmte Festplattenausfälle ab; gegen einen Controller- oder NAS-Ausfall ist eine andere Lösung nötig.\n\nBeachte gemeinsame Ursachen. Zwei Netzteile an derselben Steckdosenleiste verlieren beide die Versorgung, wenn diese Leiste ausfällt. Getrennte, fachgerecht geplante Versorgungspfade reduzieren diese Abhängigkeit. Zwei Geräte im selben Raum bleiben einem Brand in diesem Raum ausgesetzt. Verdopple Komponenten passend zum abzudeckenden Fehler, nicht nach der Zahl möglicher Anschaffungen."

    "body": [
      "Una pieza de reserva guardada en una caja reduce el tiempo de reparación, pero alguien debe instalarla. Una reserva preparada puede asumir el servicio mediante conmutación por fallo, llamada failover. Un clúster coordina varios equipos para ofrecer el servicio; debe detectar el fallo y decidir quién continúa. No basta con comprar dos equipos.\n\nEn un clúster de virtualización, una máquina virtual es un ordenador lógico con su propio sistema operativo. El host físico ejecuta esas máquinas mediante un hipervisor. Si se rompe el host, otro puede reiniciarlas con sus datos accesibles. Ese reinicio tarda; alta disponibilidad no significa ausencia de toda interrupción. Una aplicación con réplicas activas puede reducir más la pausa, pero exige coordinación y datos coherentes. La migración de una máquina todavía funcionando sirve para mantenimiento; no rescata por sí sola un host que ya está apagado.\n\nTambién hace falta capacidad de reserva. La memoria se expresa aquí en GiB (gibibytes), una unidad binaria: 1 GiB = 2³⁰ bytes = 1 073 741 824 bytes. No equivale a 1 GB = 10⁹ bytes (unidad decimal, solo como contraste). Como todas las cantidades siguientes usan GiB, se pueden comparar y restar directamente. Dos hosts con 96 GiB de memoria utilizable cada uno pueden alojar en total 120 GiB mientras ambos funcionan. Al perder uno solo quedan 96 GiB: faltan 24 GiB. Para tolerar esa avería, la carga protegida debe caber en los supervivientes; comprueba memoria, CPU, almacenamiento y red. N+1 significa añadir una unidad de reserva a las N necesarias para la carga.",
      "Ein Ersatzteil im Schrank verkürzt die Reparatur, muss aber erst eingebaut werden. Eine betriebsbereite Reserve kann den Dienst durch Failover übernehmen. Ein Cluster koordiniert mehrere Rechner für einen Dienst. Er muss den Ausfall erkennen und festlegen, wer übernimmt. Zwei gekaufte Rechner allein bilden noch keine Hochverfügbarkeitslösung.\n\nEine virtuelle Maschine ist ein logischer Rechner mit eigenem Betriebssystem. Der physische Host führt diese Maschinen über einen Hypervisor aus. Fällt der Host aus, kann ein anderer Host die VMs neu starten, sofern ihre Daten erreichbar sind. Dieser Neustart dauert: Hochverfügbarkeit bedeutet nicht völlige Unterbrechungsfreiheit. Aktive Anwendungsreplikate können die Pause weiter verkürzen, benötigen aber Koordination und konsistente Daten. Live-Migration einer noch laufenden VM hilft bei Wartung; sie rettet allein keinen bereits ausgefallenen Host.\n\nAußerdem braucht die Reserve genügend Kapazität. RAM wird hier in GiB (Gibibyte), einer binären Einheit, angegeben: 1 GiB = 2³⁰ Byte = 1 073 741 824 Byte. Das ist nicht 1 GB = 10⁹ Byte (dezimal, nur zum Vergleich). Alle folgenden Angaben verwenden GiB und können daher direkt verglichen und subtrahiert werden. Zwei Hosts mit jeweils 96 GiB nutzbarem RAM können gemeinsam 120 GiB Last aufnehmen. Nach Ausfall eines Hosts bleiben nur 96 GiB: Es fehlen 24 GiB. Die geschützte Last muss in die verbleibenden Systeme passen. Prüfe RAM, CPU, Speicher und Netzwerk. N+1 bedeutet eine zusätzliche Reserveeinheit zu den N für die Last erforderlichen Einheiten."

    "body": [
      "Una USV es un sistema de alimentación ininterrumpida; las siglas alemanas significan Unterbrechungsfreie Stromversorgung. Se coloca entre la red eléctrica y los equipos. Contiene una batería: almacena energía mientras hay corriente y la entrega durante un corte. El inversor convierte la corriente continua de la batería en corriente alterna para los equipos. El rectificador hace la conversión contraria para el circuito de carga.\n\nLa USV puede salvar un corte breve o dar tiempo para apagar de forma ordenada. No crea energía ilimitada. Si el corte dura más que la batería, el servidor debe haber terminado de cerrar aplicaciones y guardar datos antes de agotarla. Para ello necesita comunicación con la USV, por ejemplo mediante USB o una interfaz de red, y un agente o servicio de apagado configurado.\n\nIncluye también el almacenamiento y los componentes de red que el servicio necesita. Alimentar solo el servidor no mantiene accesible la aplicación si se apaga su switch. Define una secuencia: detectar el corte, esperar solo si hay margen, cerrar aplicaciones, apagar máquinas y hosts, manteniendo almacenamiento y red hasta que ya no hagan falta. Un generador puede sostener un corte largo; la USV cubre el intervalo de arranque. Verifica la secuencia con un ensayo controlado y monitoriza el estado de las baterías.",
      "USV bedeutet Unterbrechungsfreie Stromversorgung. Das Gerät liegt zwischen Stromnetz und Verbrauchern. Eine Batterie speichert Energie bei vorhandener Netzversorgung und stellt sie bei einem Ausfall bereit. Der Wechselrichter wandelt Batterie-Gleichstrom in Wechselstrom für die Geräte um. Der Gleichrichter übernimmt die umgekehrte Wandlung für den Ladekreis.\n\nDie USV kann einen kurzen Ausfall überbrücken oder Zeit für ein geordnetes Herunterfahren schaffen. Sie liefert keine unbegrenzte Energie. Dauert der Ausfall länger als die Batterie reicht, müssen Anwendungen und Server vorher ordnungsgemäß beendet sein. Dafür braucht der Server eine Kommunikation mit der USV, etwa per USB oder Netzwerkschnittstelle, und einen konfigurierten Abschaltagenten oder Dienst.\n\nBerücksichtige auch Speicher und erforderliche Netzwerkkomponenten. Nur den Server zu versorgen hält die Anwendung nicht erreichbar, wenn der Switch abschaltet. Plane die Reihenfolge: Ausfall erkennen, nur mit ausreichender Reserve warten, Anwendungen beenden, VMs und Hosts herunterfahren; Speicher und Netzwerk bleiben bis zum Ende ihrer benötigten Funktion versorgt. Ein Generator kann längere Ausfälle abdecken; die USV überbrückt dessen Anlaufzeit. Prüfe die Abschaltkette in einem kontrollierten Test und überwache den Batteriezustand."

    "body": [
      "Offline o standby (VFD): normalmente la red eléctrica alimenta la carga mediante un filtro. Durante un corte, un conmutador conecta la salida al inversor alimentado por la batería. Esa conmutación tarda un intervalo breve que el equipo debe tolerar. VFD significa Voltage and Frequency Dependent: tensión y frecuencia de salida dependen de la red durante el funcionamiento normal.\n\nLine-interactive (VI): añade regulación de tensión, llamada AVR. Corrige ciertas subidas y bajadas sin descargar la batería. En un corte utiliza batería e inversor y también necesita conmutar. VI significa Voltage Independent: regula la tensión; la frecuencia sigue dependiendo de la red. Frente a una offline sencilla ofrece mejor tratamiento de esas fluctuaciones y evita algunas descargas, a cambio de mayor coste y complejidad.\n\nOnline de doble conversión (VFI): en modo normal, el rectificador convierte la corriente de red a continua y el inversor produce la alterna de salida. La batería se conecta al circuito de continua: al faltar la red, el inversor ya estaba alimentando la carga. No hay interrupción por conmutación a batería en ese modo. VFI significa Voltage and Frequency Independent. Un bypass permite rodear la doble conversión en condiciones previstas; en bypass ya no hay el mismo acondicionamiento. La conversión continua suele añadir pérdidas y coste. Elige según calidad de red, tolerancia de la carga y datos del fabricante.",
      "Offline oder Standby (VFD): Im Normalbetrieb versorgt das Netz die Last über einen Filter. Bei Netzausfall verbindet ein Umschalter den Ausgang mit dem batteriegespeisten Wechselrichter. Diese kurze Umschaltzeit muss die Last vertragen. VFD bedeutet Voltage and Frequency Dependent: Ausgangsspannung und -frequenz hängen im Normalbetrieb vom Netz ab.\n\nLine-Interactive (VI): Eine automatische Spannungsregelung, AVR, gleicht bestimmte Unter- und Überspannungen ohne Batterieentladung aus. Bei Netzausfall versorgen Batterie und Wechselrichter die Last; auch hier wird umgeschaltet. VI bedeutet Voltage Independent: Die Spannung wird geregelt, die Frequenz bleibt netzabhängig. Gegenüber einer einfachen Offline-USV werden solche Schwankungen besser ausgeglichen und manche Batterieentladungen vermieden. Dafür steigen Kosten und Komplexität.\n\nOnline mit Doppelwandlung (VFI): Im Normalbetrieb wandelt der Gleichrichter Netzwechselstrom in Gleichstrom und der Wechselrichter erzeugt den Ausgangswechselstrom. Die Batterie ist am Gleichstromkreis angeschlossen. Beim Netzausfall versorgt der Wechselrichter die Last bereits; in diesem Betriebsmodus entsteht keine Unterbrechung beim Wechsel auf Batterie. VFI bedeutet Voltage and Frequency Independent. Ein Bypass kann die Doppelwandlung unter vorgesehenen Bedingungen umgehen; dort besteht nicht derselbe Schutz. Die dauernde Wandlung verursacht meist zusätzliche Verluste und Kosten. Entscheidend sind Netzqualität, Toleranz der Last und Herstellerdaten."

    "body": [
      "La tensión es la diferencia de potencial eléctrico entre dos puntos: indica cuánta energía se transfiere por unidad de carga. La representamos con U y la medimos en voltios (V). La corriente indica cuánta carga eléctrica pasa por segundo; la representamos con I y la medimos en amperios (A). Para alimentar un equipo hacen falta ambas. En corriente alterna, U e I serán sus valores efectivos, es decir, valores equivalentes para comparar su efecto térmico, no los picos instantáneos.\n\nLa potencia expresa energía por tiempo. La potencia activa P, en vatios (W), es la transferencia media de energía que el equipo consume: se convierte en procesamiento, luz o calor, incluidas sus pérdidas. En corriente alterna, tensión y corriente pueden estar desfasadas o la corriente puede tener una forma no sinusoidal. Parte de la energía puede ir y volver en cada ciclo. Por eso el producto de los valores efectivos no siempre coincide con la transferencia media de energía. La potencia aparente S es ese producto: S = U × I, en voltamperios (VA). Aunque P sea menor, la USV y sus conductores tienen que soportar toda la corriente I. S puede ser mayor que P; con factor de potencia uno son iguales.\n\nEjemplo: una carga a 230 V toma 1 A efectivo. Exige 230 × 1 = 230 VA. Si el medidor registra 184 W, su factor de potencia FP es la relación P / S: 184 / 230 = 0,8, sin unidad. De cada 230 VA de exigencia resultan 184 W de consumo activo; los 46 de diferencia no son 46 W de pérdida. Con FP conocido, P = S × FP. Si necesitamos S, buscamos qué número multiplicado por 0,8 da P: S = P / FP. Para 184 W: 184 / 0,8 = 230 VA. FP no es rendimiento: el rendimiento compara energía de entrada y salida; FP relaciona dos magnitudes eléctricas de una misma carga.\n\nDos servidores de 220 W, un NAS de 40 W y un switch de 20 W necesitan 500 W. Todas las cargas del ejemplo tienen FP 0,8; su exigencia aparente es 500 / 0,8 = 625 VA. Un margen de dimensionamiento del 25 % sobre la carga exige 500 × 1,25 = 625 W y 625 × 1,25 = 781,25 VA. Debemos comprobar cada límite del fabricante por separado: 600 W / 1 000 VA falla por W; 675 W / 750 VA falla por VA; 900 W / 1 000 VA supera ambos. La potencia nominal de una fuente no es automáticamente el consumo de su equipo.\n\nEse margen deja capacidad para crecimiento o variaciones de carga; no indica minutos de batería. La autonomía se comprueba aparte en la tabla del fabricante para la carga real prevista. Tampoco es igual añadir 20 % a la carga que dejar 20 % de la capacidad libre. Si 480 W pueden ocupar como máximo el 80 % de la capacidad, hay que encontrar la capacidad cuyo 80 % es 480 W: 480 / 0,8 = 600 W.",
      "Spannung ist die elektrische Potenzialdifferenz zwischen zwei Punkten: Sie beschreibt die übertragene Energie je Ladungseinheit. Wir bezeichnen sie mit U und messen sie in Volt (V). Stromstärke beschreibt die Ladungsmenge je Sekunde; ihr Zeichen ist I, ihre Einheit Ampere (A). Zur Versorgung eines Geräts werden beide benötigt. Bei Wechselstrom verwenden wir für U und I Effektivwerte: Vergleichswerte für die Wärmewirkung, keine momentanen Spitzenwerte.\n\nLeistung beschreibt Energie je Zeit. Die Wirkleistung P in Watt (W) ist die mittlere Energieübertragung, die das Gerät aufnimmt: Sie wird in Verarbeitung, Licht oder Wärme umgesetzt, einschließlich der Verluste des Geräts. Bei Wechselstrom können Strom und Spannung zeitlich verschoben sein oder der Strom kann von der Sinusform abweichen. Energie kann innerhalb eines Zyklus auch hin- und zurückfließen. Deshalb entspricht das Produkt der Effektivwerte nicht immer der mittleren Energieübertragung. Die Scheinleistung S ist dieses Produkt: S = U × I, in Voltampere (VA). Auch bei kleinerem P müssen USV und Leitungen die gesamte Stromstärke I tragen. S kann größer als P sein; bei Leistungsfaktor eins sind sie gleich.\n\nBeispiel: Eine Last nimmt bei 230 V einen Effektivstrom von 1 A auf. Sie beansprucht 230 × 1 = 230 VA. Misst das Messgerät 184 W, ist ihr Leistungsfaktor FP das Verhältnis P / S: 184 / 230 = 0,8, ohne Einheit. 230 VA Beanspruchung entsprechen hier 184 W Wirkleistungsaufnahme; die Differenz von 46 bedeutet nicht 46 W Verlust. Bei bekanntem FP gilt P = S × FP. Für S suchen wir die Zahl, die mit 0,8 multipliziert P ergibt: S = P / FP. Für 184 W gilt 184 / 0,8 = 230 VA. FP ist kein Wirkungsgrad: Wirkungsgrad vergleicht Eingangs- und Ausgangsenergie; FP vergleicht zwei elektrische Größen derselben Last.\n\nZwei Server mit je 220 W, ein NAS mit 40 W und ein Switch mit 20 W benötigen 500 W. Alle Lasten im Beispiel haben FP 0,8; die Scheinlast beträgt 500 / 0,8 = 625 VA. 25 % Auslegungsreserve als Lastzuschlag verlangen 500 × 1,25 = 625 W und 625 × 1,25 = 781,25 VA. Beide Herstellergrenzen werden einzeln geprüft: 600 W / 1 000 VA scheitern an W; 675 W / 750 VA an VA; 900 W / 1 000 VA erfüllen beide. Die Nennleistung eines Netzteils ist nicht automatisch die Leistungsaufnahme des Geräts.\n\nDiese Reserve schafft Kapazität für Wachstum oder Lastschwankungen; sie gibt keine Batterieminuten an. Die Laufzeit wird gesondert anhand der Herstellertabelle bei der tatsächlich vorgesehenen Last geprüft. 20 % Lastzuschlag sind auch nicht dasselbe wie 20 % freie Nennkapazität. Dürfen 480 W höchstens 80 % der Kapazität belegen, suchen wir die Kapazität, deren 80 % gleich 480 W sind: 480 / 0,8 = 600 W."

    "body": [
      "Una batería guarda energía, pero Ah no es una unidad de energía. Ah significa amperios hora y mide capacidad de carga eléctrica: corriente por tiempo bajo las condiciones nominales de ensayo. Por ejemplo, 7 Ah corresponden a 1 A durante 7 h en un modelo ideal; A indica la corriente en ese momento y Ah la carga acumulada. Una batería real no entrega necesariamente 7 Ah a cualquier corriente o temperatura.\n\nLa tensión indica energía por carga. Por eso, al multiplicar la tensión nominal por la capacidad de carga obtenemos energía nominal aproximada: una batería de 12 V y 7 Ah contiene 12 × 7 = 84 Wh. Wh significa vatios hora. Un equipo de 100 W usa 100 Wh por hora. Si tenemos 200 Wh útiles, caben dos consumos de una hora: 200 Wh / 100 W = 2 h. Energía es el depósito; potencia es la rapidez con que lo vaciamos.\n\nEn una conexión en serie hay un único camino cerrado. La misma corriente atraviesa cada batería: si salen 1 A durante una hora, cada una entrega 1 Ah, no una cuarta parte. Cuatro baterías iguales de 12 V y 7 Ah suman sus tensiones porque cada una aporta energía a la misma carga que pasa: 12 + 12 + 12 + 12 = 48 V. Todas se agotan al entregar sus 7 Ah en el modelo; la cadena sigue teniendo 7 Ah. Su energía es 48 × 7 = 336 Wh, igual a cuatro veces 84 Wh. Sumar también los Ah contaría las baterías dos veces. El dibujo es conceptual, no una instrucción de instalación.\n\nPara pasar de energía nominal a útil hay que considerar las pérdidas. Un bloque de 24 V y 9 Ah tiene aproximadamente 216 Wh nominales. Si el rendimiento global de descarga e inversor es 85 %, salen 216 × 0,85 = 183,6 Wh útiles. Con carga constante de 306 W caben 183,6 / 306 = 0,6 consumos de una hora: 0,6 h × 60 = 36 min. Ahora abreviamos: E es energía nominal en Wh; η (eta), rendimiento como fracción; P, potencia activa de la carga en W; t, tiempo en horas. El modelo es t = E × η / P. Si E ya se midió como energía útil a la salida, no aplicamos η otra vez.\n\nEste modelo idealizado supone baterías iguales y cargadas, tensión nominal aproximada, carga constante y rendimiento dado. No garantiza autonomía real. La descarga rápida, temperatura, envejecimiento y límite de corte reducen la energía disponible. Para decidir una compra o un apagado usa la curva o tabla del fabricante a la carga real de todos los equipos protegidos. El margen de potencia y el tiempo reservado para apagar son comprobaciones distintas.",
      "Eine Batterie speichert Energie, aber Ah ist keine Energieeinheit. Ah bedeutet Amperestunden und bezeichnet elektrische Ladungskapazität: Stromstärke mal Zeit unter den Nennbedingungen des Tests. Beispielsweise entsprechen 7 Ah im idealen Modell 1 A während 7 h. A bezeichnet den momentanen Strom, Ah die insgesamt abgegebene Ladung. Eine reale Batterie liefert nicht bei beliebigem Strom oder beliebiger Temperatur stets 7 Ah.\n\nSpannung beschreibt Energie je Ladung. Nennspannung mal Ladungskapazität ergibt deshalb näherungsweise die Nennenergie: Eine Batterie mit 12 V und 7 Ah enthält 12 × 7 = 84 Wh. Wh bedeutet Wattstunden. Ein Gerät mit 100 W braucht stündlich 100 Wh. In 200 Wh nutzbarer Energie passen zwei Stundenbedarfe: 200 Wh / 100 W = 2 h. Energie ist der Vorrat; Leistung beschreibt, wie schnell wir ihn verbrauchen.\n\nEine Reihenschaltung hat einen einzigen geschlossenen Strompfad. Derselbe Strom fließt durch jede Batterie: Bei 1 A während einer Stunde gibt jede 1 Ah ab, nicht ein Viertel davon. Vier gleiche Batterien mit je 12 V und 7 Ah addieren ihre Spannungen, weil jede derselben durchfließenden Ladung Energie zuführt: 12 + 12 + 12 + 12 = 48 V. Jede erreicht nach Abgabe ihrer 7 Ah im Modell ihre Grenze; die Kette hat weiterhin 7 Ah. Ihre Energie ist 48 × 7 = 336 Wh, also viermal 84 Wh. Zusätzliches Addieren der Ah würde die Batterien doppelt zählen. Die Abbildung erklärt den Zusammenhang, sie ist keine Installationsanleitung.\n\nVon der Nennenergie zur nutzbaren Energie berücksichtigen wir Verluste. Ein Block mit 24 V und 9 Ah enthält näherungsweise 216 Wh. Bei 85 % Gesamtwirkungsgrad für Entladung und Wechselrichter kommen 216 × 0,85 = 183,6 Wh nutzbar an. Bei konstanter Last von 306 W sind das 183,6 / 306 = 0,6 Stundenbedarfe: 0,6 h × 60 = 36 min. Nun die Kurzform: E ist Nennenergie in Wh; η (Eta) der Wirkungsgrad als Anteil; P die Wirkleistung der Last in W; t die Zeit in Stunden. Das Modell lautet t = E × η / P. Ist E bereits nutzbare Ausgangsenergie, wird η nicht nochmals angewendet.\n\nDieses idealisierte Modell setzt gleiche, geladene Batterien, angenäherte Nennspannung, konstante Last und den vorgegebenen Wirkungsgrad voraus. Es garantiert keine reale Laufzeit. Schnelle Entladung, Temperatur, Alterung und Abschaltgrenze beeinflussen die verfügbare Energie. Verwenden Sie für Beschaffung oder Abschaltung die Herstellerkennlinie oder -tabelle bei der tatsächlichen Last aller geschützten Geräte. Leistungsreserve und Zeitreserve zum Herunterfahren werden getrennt geprüft."

case 'platform':return vcard(['Tres VMs, un host físico','Drei VMs, ein physischer Host'],'<div class="split"><div class="node">VM 1</div><div class="node">VM 2 + VM 3</div></div><div class="node" style="margin-top:12px">'+tr(['Hipervisor','Hypervisor'])+'</div><div class="node" style="margin-top:12px">'+tr(['Un host físico','Ein physischer Host'])+'</div>', ['Si la base física falla, las tres VMs comparten la caída.','Fällt die physische Grundlage aus, teilen alle drei VMs den Ausfall.']);
case 'decision':return vcard(['Requisito → prueba → decisión','Anforderung → Nachweis → Entscheidung'],flow([['Máximo 10 min de caída','Höchstens 10 min Ausfall'],['Clúster: reinicio probado 4 min','Cluster: Neustart geprüft 4 min'],['Cumple ante fallo de un host','Erfüllt bei einem Hostausfall']]),['La conclusión vale para el fallo ensayado y las condiciones indicadas.','Die Aussage gilt für den geprüften Ausfall und die genannten Bedingungen.']);
case 'operators':return vcard(['Del operador a tu respuesta','Vom Operator zur Antwort'],flow([['nennen · nombrar','nennen · benennen'],['erläutern · explicar función','erläutern · Funktion erklären'],['begründen · unir al requisito','begründen · Anforderungsbezug'],['berechnen · mostrar cálculo','berechnen · Rechenweg zeigen']]),['Escribe primero tu respuesta; abre después el modelo.','Schreiben Sie zuerst Ihre Antwort, öffnen Sie danach das Muster.']);

function renderLesson(){const l=LESSONS[state.page];$('page').innerHTML=`<div class="eyebrow">${tx('lesson')} ${String(state.page+1).padStart(2,'0')}</div><h1>${esc(tr(l.title))}</h1><div class="lesson-layout ${l.visual==='ups'?'wide-diagrams':''}"><div><section class="reading">${tr(l.body).split('\n\n').map((p,i)=>`<p>${esc(p)}</p>${l.visual==='ups'?`<figure style="margin:12px 0 26px;padding:16px;background:#e2edea;border-radius:9px"><figcaption class="visual-title">${['Offline · VFD','Line-interactive · VI','Online · VFI'][i]}</figcaption>${upsCircuit(['offline','vi','online'][i])}</figure>`:''}`).join('')}${l.visual==='ups'?`<p class="small">${tr(['Verde continuo: red normal. Marrón discontinuo: batería. Bypass omitido en el dibujo; explicado arriba.','Grün durchgezogen: Netzbetrieb. Braun gestrichelt: Batterie. Bypass im Bild weggelassen; oben erklärt.'])}</p>`:''}</section><section class="check"><div class="check-head">${tx('checkHead')}</div><label for="checkAnswer">${esc(tr(l.check))}</label><textarea id="checkAnswer">${esc(state.checks[state.page]||'')}</textarea><button id="compareCheck" class="primary">${tx('compare')}</button><p class="model" id="checkModel" hidden>${esc(tr(l.answer))}</p></section></div><section>${l.visual==='ups'?'':visual(l.visual)}</section></div>`;$('checkAnswer').addEventListener('input',e=>{state.checks[state.page]=e.target.value;save();});$('compareCheck').addEventListener('click',()=>{$('checkModel').hidden=false;});}
function table(t){return `<table><caption>${tx('material')}</caption><thead><tr>${tr(t.headers).map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>'<tr>'+row.map(c=>`<td>${esc(tr(c))}</td>`).join('')+'</tr>').join('')}</tbody></table>`;}

function freeField(t,i){const f=t.fields[i],id='answer-'+i,val=state.answers[akey(t.id,i)]||'';return `<textarea id="${id}" data-field="${i}" maxlength="10000">${esc(val)}</textarea><div class="field-msg" id="msg-${i}"></div>`;}
function answerSurface(t){
 if(t.layout==='hypervisor-table')return `<table class="answer-table matrix"><caption>${tr(['a) Comparación completa · 8 puntos','a) Vollständiger Vergleich · 8 Punkte'])}</caption><thead><tr><th scope="col">${tx('field')}</th><th scope="col">Hypervisor Typ 1</th><th scope="col">Hypervisor Typ 2</th></tr></thead><tbody>${[['Arquitectura (4 puntos)','Architektur (4 Punkte)'],['Uso (2 puntos)','Einsatz (2 Punkte)'],['Producto (2 puntos)','Produkt (2 Punkte)']].map((row,j)=>`<tr><th scope="row">${tr(row)}</th>${[0,1].map(k=>`<td><label for="answer-${j*2+k}" class="small">${tr(t.fields[j*2+k].label)} · ${t.fields[j*2+k].points} ${tx('points')}</label>${freeField(t,j*2+k)}</td>`).join('')}</tr>`).join('')}</tbody></table>`+freeParts(t,[6]);
 if(t.layout==='ups-table')return `<table class="answer-table matrix"><caption>${tx('answers')}</caption><thead><tr><th scope="col">${tr(['Tipo','Typ'])}</th><th scope="col">${tr(['Abreviatura (1 punto)','Abkürzung (1 Punkt)'])}</th><th scope="col">${tr(['Significado (1 punto)','Bedeutung (1 Punkt)'])}</th></tr></thead><tbody>${['Online','Offline','Line-interactive'].map((x,j)=>`<tr><th scope="row">${x}</th>${[0,1].map(k=>`<td><label for="answer-${j*2+k}" class="small">${tr(t.fields[j*2+k].label)}</label>${freeField(t,j*2+k)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 if(t.id>=11)return freeParts(t,t.fields.map((_,i)=>i));
 return `<table class="answer-table"><caption>${tx('answers')}</caption><thead><tr><th scope="col">${tx('field')}</th><th scope="col">${tx('answer')}</th><th scope="col">P</th></tr></thead><tbody>${t.fields.map((f,i)=>control(t,f,i)).join('')}</tbody></table>`;
}
function freeParts(t,ids){return `<div class="free-answers">${ids.map(i=>`<section class="part"><div class="part-head"><label for="answer-${i}">${esc(tr(t.fields[i].label))}</label><span>${t.fields[i].points} ${tx('points')}</span></div>${freeField(t,i)}</section>`).join('')}</div>`;}

function control(t,f,i){const val=state.answers[akey(t.id,i)]||'',id='answer-'+i;let c=f.type==='written'?`<textarea id="${id}" data-field="${i}" maxlength="10000">${esc(val)}</textarea>`:f.type==='choice'?`<select id="${id}" data-field="${i}"><option value="">${tx('choose')}</option>${f.options.map(o=>`<option value="${esc(o[0])}" ${val===o[0]?'selected':''}>${esc(tr(o))}</option>`).join('')}</select>`:`<input id="${id}" data-field="${i}" inputmode="decimal" autocomplete="off" value="${esc(val)}" maxlength="80">`;return `<tr><td><label for="${id}">${esc(tr(f.label))}</label></td><td>${c}<div class="field-msg" id="msg-${i}"></div></td><td>${f.points}</td></tr>`;}
function renderTask(){const t=TASKS[state.page-12],s=taskState(t.id);$('page').innerHTML=`<div class="exam-head"><div><div class="eyebrow">${tx('exercise')} ${String(t.id).padStart(2,'0')} · ${tx(t.core?'core':'extra')}</div><h1>${esc(tr(t.title))}</h1></div><div class="points">${t.points} ${tx('points')}</div></div><span class="badge">eigene Aufgabe, nicht offiziell IHK</span><span class="badge">${t.id<=10?tr(['Calentamiento guiado','Angeleitete Vorübung']):tr(['Desarrollo libre · puntos orientativos','Freie Ausarbeitung · orientierende Punkte'])}</span><div class="exam-layout ${t.visual?'wide-diagrams':''}"><section class="material"><p class="case">${esc(tr(t.case))}</p><p class="instructions">${esc(tr(t.instruction))}</p>${t.visual==='spof'?spof():t.visual==='circuits'?'<div class="circuit-title">A</div>'+upsCircuit('online')+'<div class="circuit-title">B</div>'+upsCircuit('offline'):''}${table(t)}<p class="source-note">${esc(tr(t.ref))}</p></section><section>${answerSurface(t)}<p class="small" style="margin:12px 0">${t.fields.some(f=>f.type==='number')?tx('numericGuide'):(t.id>=12&&t.id<=16?tr(['Escribe el desarrollo y las unidades en cada apartado. Responde en alemán al practicar el examen. Puntos orientativos propios; revisión manual por significado.','Schreiben Sie Rechenweg und Einheiten in jede Teilaufgabe. Üben Sie die Prüfungsantwort auf Deutsch. Eigene orientierende Punkte; manuelle Bewertung nach Bedeutung.']):tr(['Responde con tus palabras; al practicar el examen, escribe en alemán. Abre criterios y modelo cuando quieras comparar tu respuesta. Los textos requieren revisión manual por significado.','Antworten Sie in eigenen Worten; üben Sie die Prüfungsantwort auf Deutsch. Öffnen Sie Kriterien und Muster zum Vergleichen. Texte benötigen eine manuelle Bewertung nach Bedeutung.']))}</p><div class="actions"><button id="checkTask" class="primary">${tx('check')}</button><button id="reviewTask">${tx('openReview')}</button><button id="hintTask" aria-expanded="${s.hint}" aria-controls="hintBox">${tx('hint')}</button><button id="solutionTask" aria-expanded="${s.solution}" aria-controls="solutionBox">${tx(s.solution?'hideSolution':'solution')}</button></div><p id="hintBox" class="feedback" ${s.hint?'':'hidden'}>${esc(tr(t.hint))}</p><div id="feedback" class="feedback" role="status" hidden></div></section><section id="reviewBox" class="review" hidden></section><section id="solutionBox" class="solution" ${s.solution?'':'hidden'}>${solutionHTML(t)}</section></div>`;
document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{state.answers[akey(t.id,Number(e.target.dataset.field))]=e.target.value;if(s.reviewSeen)s.helped=true;s.reviewOpen=false;s.checked=false;s.review={};s.feedback=null;delete s.score;$('reviewBox').hidden=true;$('feedback').hidden=true;clearFields(t);save();}));$('checkTask').addEventListener('click',()=>checkTask(t));$('reviewTask').addEventListener('click',()=>{s.feedback=evaluate(t);s.checked=true;showFeedback(t);if(!s.feedback.blank){s.reviewOpen=true;s.helped=true;renderReview(t);}save();});$('hintTask').addEventListener('click',()=>{s.hint=!s.hint;if(s.hint)s.helped=true;$('hintBox').hidden=!s.hint;$('hintTask').setAttribute('aria-expanded',String(s.hint));save();});$('solutionTask').addEventListener('click',()=>{s.solution=!s.solution;if(s.solution)s.helped=true;$('solutionBox').hidden=!s.solution;$('solutionTask').textContent=tx(s.solution?'hideSolution':'solution');$('solutionTask').setAttribute('aria-expanded',String(s.solution));save();});if(s.checked){showFeedback(t);if(s.reviewOpen)renderReview(t);} }
function parseNumber(v){const n=String(v).trim().replace(/\s/g,'').replace(',','.');return /^[-+]?\d+(\.\d+)?$/.test(n)?Number(n):NaN;}
function evaluate(t){let blank=0,automatic=0;const results=[];t.fields.forEach((f,i)=>{const v=state.answers[akey(t.id,i)]||'';if(!v.trim()){blank++;results.push({blank:true,ok:false});return;}const ok=f.type==='number'?Math.abs(parseNumber(v)-f.answer)<=f.tol:f.type==='choice'?v===f.answer:null;if(ok)automatic+=f.points;results.push({ok});});return {blank,automatic,results};}
function clearFields(t){t.fields.forEach((f,i)=>{$('answer-'+i).classList.remove('good','bad');$('answer-'+i).removeAttribute('aria-invalid');$('msg-'+i).textContent='';});}
function checkTask(t){const s=taskState(t.id);s.feedback=evaluate(t);s.checked=true;showFeedback(t);$('reviewBox').hidden=true;s.reviewOpen=false;save();}
function showFeedback(t){const s=taskState(t.id),r=s.feedback;if(!r)return;clearFields(t);r.results.forEach((r,i)=>{const f=t.fields[i],el=$('answer-'+i);if(f.type!=='written'&&!r.blank){el.classList.add(r.ok?'good':'bad');el.setAttribute('aria-invalid',String(!r.ok));}$('msg-'+i).textContent=r.blank?tr(['Vacío','Leer']):tx(f.type==='written'?'written':r.ok?'correct':'wrong');});$('feedback').hidden=false;$('feedback').innerHTML=r.blank?tx('blank'):`${t.fields.some(f=>f.type!=='written')?`${tx('auto')}: <b>${r.automatic} / ${t.fields.filter(f=>f.type!=='written').reduce((a,f)=>a+f.points,0)}</b><br>`:''}${tx(s.score===undefined?'pending':'reviewDone')}`;}
function renderReview(t){const s=taskState(t.id);if(!s.feedback||s.feedback.blank){$('reviewBox').hidden=true;return;}$('reviewBox').hidden=false;s.reviewSeen=true;$('reviewBox').innerHTML=`<h2>${tx('review')}</h2><p class="small">${tx('reviewNotice')}</p>${t.fields.map((f,i)=>f.type==='written'?`<div class="review-block"><h3>${esc(tr(f.label))}</h3><p class="model"><b>${tx('model')}:</b> ${esc(tr(f.model))}</p>${f.criteria.map((c,j)=>`<div class="criterion"><label for="review-${i}-${j}">${esc(tr(c))}</label><select id="review-${i}-${j}" data-review="${i}:${j}"><option value="">${tx('choose')}</option><option value="1" ${s.review[i+':'+j]==='1'?'selected':''}>${tx('yes')}</option><option value="0" ${s.review[i+':'+j]==='0'?'selected':''}>${tx('no')}</option></select></div>`).join('')}</div>`:'').join('')}<button id="finishReview">${tx('finishReview')}</button><p id="reviewScore" class="feedback" role="status" ${s.score===undefined?'hidden':''}>${s.score===undefined?'':scoreHTML(t,s)}</p>`;document.querySelectorAll('[data-review]').forEach(el=>el.addEventListener('change',e=>{s.review[e.target.dataset.review]=e.target.value;delete s.score;$('reviewScore').hidden=true;save();}));$('finishReview').addEventListener('click',()=>{const keys=t.fields.flatMap((f,i)=>f.type==='written'?f.criteria.map((_,j)=>i+':'+j):[]);$('reviewScore').hidden=false;if(keys.some(k=>!['0','1'].includes(s.review[k]))){$('reviewScore').textContent=tx('rubricMissing');return;}s.score=s.feedback.automatic+keys.reduce((a,k)=>a+Number(s.review[k]),0);$('reviewScore').innerHTML=scoreHTML(t,s);showFeedback(t);save();});}
function scoreHTML(t,s){const self=s.score-s.feedback.automatic;return `<span class="score">${tx('total')}: ${s.score} / ${t.points}</span><br>${tx('auto')}: ${s.feedback.automatic} · ${tx('self')}: ${self}<br>${tx(s.helped?'assisted':'unaided')}`;}
function solutionHTML(t){return `<h2>${tx('model')}</h2>${t.fields.map(f=>`<p><b>${esc(tr(f.label))}:</b> ${esc(f.type==='written'?tr(f.model):f.type==='choice'?tr(f.options.find(o=>o[0]===f.answer)):String(f.answer).replace('.',','))}</p>`).join('')}<p class="small">${tr(['Los puntos de redacción dependen de cumplir los criterios, no de copiar las palabras.','Schreibpunkte hängen von der Erfüllung der Kriterien ab, nicht vom Kopieren der Wörter.'])}</p>`;}

$('sourcesButton').addEventListener('click',()=>{$('sourcesContent').innerHTML=state.lang==='es'?`<p><b>Libros locales:</b> Grundstufe LF3–5 (03b), §3.8.4, pp. 371–372; §3.9.1, pp. 373–385. Fachstufe LF8–9 (04b), §§4.3.3–4.3.5, pp. 345–358; §4.8, pp. 420–427. Zisler, capítulo 10.1, páginas PDF 461–471: requisitos, rutas y fallos.</p><p><b>Exámenes:</b> KAIT Sommer 2022 4c (solución oficial); Sommer 2023 2aa–ac/2b (pregunta anotada PDF pp. 4–5; solución oficial original local PDF p. 3); Sommer 2024 1aa–ab/4c (soluciones oficiales). Todas las tareas del taller son propias. T17 a), T18 b) y T19 cubren las variantes completas cotejadas. Solución original Sommer 2023 cotejada después de generar. T09–11/T20 conservan modelos y puntos propios; no se acredita equivalencia. Lista de exámenes cotejados en esta revisión.</p><p><b>Didáctica:</b> Rosenshine (2012), pp. 12–19; IES (2007), recomendaciones 2–4, pp. 9–16; Nation (2007), pp. 1–12; contrato didáctico, §§5–8. Mayer y Fiorella, Principles for Reducing Extraneous Processing in Multimedia Learning (Cambridge Handbook): solo resumen público, no capítulo completo. Coherencia, señalización y proximidad de texto/gráfico.</p><p><b>Contraste externo:</b> Eaton, UPS sizing guide; Microsoft Learn, Hyper-V architecture; Oracle, First Steps (VirtualBox User Manual 7.0). Contraste documentado de W/VA, hipervisor tipo 1 y plataforma hosted/tipo 2. Referencias y alcance en REPORTE-bibliografia.md; no se afirma una nueva consulta externa.</p>`:`<p><b>Lokale Bücher:</b> Grundstufe LF3–5 (03b), §3.8.4, S. 371–372; §3.9.1, S. 373–385. Fachstufe LF8–9 (04b), §§4.3.3–4.3.5, S. 345–358; §4.8, S. 420–427. Zisler, Kapitel 10.1, PDF-Seiten 461–471: Anforderungen, Pfade und Ausfälle.</p><p><b>Prüfungen:</b> KAIT Sommer 2022 4c (offizielle Lösung); Sommer 2023 2aa–ac/2b (annotierte Frage PDF S. 4–5; lokale offizielle Originallösung PDF S. 3); Sommer 2024 1aa–ab/4c (offizielle Lösungen). Alle Aufgaben sind selbst erstellt. T17 a), T18 b) und T19 decken die vollständig abgeglichenen Varianten ab. Originallösung Sommer 2023 nach Erstellung abgeglichen. T09–11/T20 behalten eigene Musterlösungen und Punkte; keine Gleichwertigkeit behauptet. Liste der in dieser Revision abgeglichenen Prüfungen.</p><p><b>Didaktik:</b> Rosenshine (2012), S. 12–19; IES (2007), Empfehlungen 2–4, S. 9–16; Nation (2007), S. 1–12; Didaktikvertrag, §§5–8. Mayer und Fiorella, Principles for Reducing Extraneous Processing in Multimedia Learning (Cambridge Handbook): nur öffentliches Abstract, nicht das vollständige Kapitel. Kohärenz, Signalisierung und Nähe von Text/Grafik.</p><p><b>Externer Abgleich:</b> Eaton, UPS sizing guide; Microsoft Learn, Hyper-V architecture; Oracle, First Steps (VirtualBox User Manual 7.0). Dokumentierter Abgleich von W/VA, Typ-1-Hypervisor und Hosted-/Typ-2-Plattform. Nachweise und Umfang in REPORTE-bibliografia.md; keine neue externe Konsultation behauptet.</p>`;$('sourcesDialog').showModal();});
