cells{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.cell{flex:1;min-width:67px;background:#f8fbed;color:var(--ink);border-radius:9px;text-align:center;padding:10px 6px}.cell small{display:block;color:#455f5d;font:12px var(--mono);margin-bottom:5px}.cell strong{display:block;font:700 29px var(--mono)}.cell.sel{background:var(--lime);outline:3px solid #b8dc73}.figure table{color:#f4f8ed;margin-top:12px}.figure th,.figure td{border-color:#739087}.figure th{background:#315e5d;color:#f5faec}.figure .number{font:700 48px var(--mono);color:var(--lime)}.formula{font:19px/1.8 var(--mono);padding:14px;border:1px solid #648780;border-radius:8px;margin-bottom:12px}.flow{display:grid;gap:9px;margin:15px 0}.flow div{background:#2e595b;border-left:4px solid var(--lime);padding:11px 14px;border-radius:6px}.flow b{display:block;color:var(--lime)}.figure .step-actions{display:flex;gap:8px}.figure button{background:var(--lime);color:var(--nav);font-size:13px;margin-top:8px}.figure .step-copy{min-height:53px}.mini{background:#fff8e8;border:1px solid #c4a56e;border-radius:12px;padding:17px;margin-top:18px}.mini h3{color:#774805;margin-bottom:7px}.mini label{display:block;font-size:14px;margin-bottom:9px}.mini input{width:96px;padding:7px;border:1px solid #8c9f99;border-radius:5px}.mini button{margin-left:8px;font-size:13px}.mini .feedback{font-size:14px;margin:12px 0 0}.sheet{border:1px solid #b7c5bf;border-radius:13px;background:var(--paper);box-shadow:0 12px 25px #2841390c;overflow:hidden}.sheet-head{background:#f4ead6;border-bottom:1px solid #cabda3;padding:16px 23px;display:flex;align-items:start;justify-content:space-between;gap:20px}.sheet-head p{margin:0;font-size:13px}.points{font:700 16px var(--mono);white-space:nowrap;color:#614313}.sheet-body{padding:22px 24px}.context{margin-bottom:12px;font-size:16px}.ask{font-weight:600;margin-bottom:16px}.material{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}.material.single{display:block}.codebox{background:#173840;color:#f1f6eb;border-radius:9px;padding:16px}.code-row{display:flex;gap:12px;font:15px/1.9 var(--mono)}.code-num{color:#d1e899;width:22px;flex:none;text-align:right}.code-text{white-space:pre-wrap;overflow-wrap:anywhere}.code-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;color:#cfe1c5}table{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}caption{text-align:left;font-weight:600;margin:0 0 8px}th,td{border:1px solid #acbbb5;padding:8px 9px;text-align:left;overflow-wrap:anywhere}th{background:#e4eee7;font-weight:600}td input,td select{width:100%;min-width:0;padding:6px;border:1px solid #68857a;border-radius:4px;background:#fff;color:#17313b;font:15px var(--mono)}td input.good{border:2px solid #08734c}td input.bad,td select.bad{border:2px solid #a63a25}.array-material{margin-bottom:16px}textarea{display:block;resize:vertical;width:100%;min-height:120px;border:1px solid #68857a;border-radius:7px;padding:12px}.written-label{display:block;font-weight:600;margin:15px 0 7px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.primary:hover:enabled{background:#065346}.help{padding:15px 18px;border:1px solid #baa773;background:#fff8df;margin-top:14px;border-radius:8px}.solution{background:#e8f2e9;border-color:#94b69b}.help h3{margin-bottom:8px}.help p:last-child{margin-bottom:0}.result{background:#f0f3ed;border-left:4px solid #476c5c;padding:14px 17px;margin-top:17px}.result p{margin:0 0 8px;font-size:14px}.result ul{margin:8px 0;padding-left:20px;font-size:14px}.result .score{font-size:19px;font-weight:700;margin-bottom:8px}.criteria{margin-top:18px}.criterion{border-top:1px solid #bacbc0;padding:12px 0}.criterion label{display:block}.criterion select{display:block;padding:5px;margin-top:7px;max-width:100%}.bottom{height:69px;flex:none;background:#fffdf8;border-top:1px solid var(--line);display:flex;justify-cont <script>
'use strict';
const LESSONS=[{"title": ["Un programa recuerda datos", "Ein Programm merkt sich Daten"], "body": ["Un programa de administración puede leer una medición, trabajar con ella y mostrar un resultado. Por ejemplo, recibe la carga de un servidor: 42 %. Para utilizar ese dato después, necesita guardarlo con un nombre. Ese nombre permite reconocer qué significa el dato; una cifra aislada no explica si se trata de carga, temperatura o espacio libre.<br><br>Una <b>variable<\/b> es un nombre mediante el cual el programa accede a un valor almacenado. Piensa en una casilla rotulada <b>carga<\/b>: el rótulo permanece, pero el contenido puede cambiar cuando llegue otra medición. Es un modelo para entender el comportamiento, no un dibujo físico de la memoria.<br><br>El <b>nombre<\/b> y el <b>valor<\/b> son cosas distintas. Si la casilla se llama <code>load<\/code> y contiene 42, usar <code>load<\/code> en un cálculo significa utilizar el número 42. Los programas suelen usar nombres en inglés; aquí <code>load<\/code> significa carga. Primero trabajaremos con números enteros: números sin decimales.", "Ein Verwaltungsprogramm kann einen Messwert einlesen, damit arbeiten und ein Ergebnis ausgeben. Es erhält zum Beispiel die Serverauslastung: 42 %. Damit es diesen Wert später verwenden kann, speichert es ihn unter einem Namen. Der Name macht die Bedeutung erkennbar; eine einzelne Zahl könnte auch eine Temperatur oder freien Speicher bezeichnen.<br><br>Eine <b>Variable<\/b> ist ein Name, über den das Programm auf einen gespeicherten Wert zugreift. Stellen Sie sich ein beschriftetes Fach vor: Die Beschriftung bleibt, der Inhalt kann sich bei einer neuen Messung ändern. Das ist ein Verhaltensmodell, keine physische Darstellung des Arbeitsspeichers.<br><br><b>Name<\/b> und <b>Wert<\/b> sind verschieden. Wenn die Variable <code>load<\/code> den Wert 42 enthält, wird in einer Berechnung mit <code>load<\/code> die Zahl 42 verwendet. Englische Namen sind üblich; <code>load<\/code> bedeutet Auslastung. Zunächst verwenden wir ganze Zahlen, also Zahlen ohne Nachkommastellen."], "fig": "variable", "check": ["Una variable llamada load contiene 42. ¿Qué número se utiliza al leer load?", "Die Variable load enthält 42. Welche Zahl wird beim Lesen von load verwendet?"], "answer": 42, "repair": ["El nombre identifica la casilla; al leerla se toma su contenido actual: 42.", "Der Name bezeichnet das Fach; gelesen wird sein aktueller Inhalt: 42."]}, {"title": ["Asignar: guardar a la izquierda", "Zuweisen: links speichern"], "body": ["Para guardar un valor usamos una <b>asignación<\/b>. Aquí el signo <code>=<\/code> significa «guarda el resultado de la derecha en el destino de la izquierda». No afirma que ambos lados sean iguales para siempre. En <code>load = 42;<\/code>, el destino es <code>load<\/code> y el valor que se guarda es 42. El punto y coma termina una instrucción; no es parte del valor.<br><br>En los fragmentos de examen aparecen declaraciones como <code>int load = 42;<\/code>. <code>int<\/code> indica un número entero, <code>load<\/code> es el nombre y 42 es el valor inicial. <b>Declarar<\/b> presenta la variable; <b>inicializar<\/b> le da su primer valor. En las líneas posteriores basta escribir <code>load = 57;<\/code>: se guarda 57 en la variable existente y se reemplaza el 42.<br><br>El programa no conserva automáticamente una lista de los valores anteriores. Si después se lee <code>load<\/code>, se obtiene 57. En este taller cada fragmento es independiente y empieza con los valores que muestra. La notación está basada en los fragmentos C# de los exámenes; no necesitas instalar ni ejecutar un lenguaje para seguirlos.", "Eine <b>Zuweisung<\/b> speichert einen Wert. Das Zeichen <code>=<\/code> bedeutet hier: Das Ergebnis rechts wird im Ziel links gespeichert. Es behauptet keine dauerhafte mathematische Gleichheit. Bei <code>load = 42;<\/code> ist <code>load<\/code> das Ziel und 42 der gespeicherte Wert. Das Semikolon beendet eine Anweisung; es gehört nicht zum Wert.<br><br>In Prüfungsfragmenten stehen Deklarationen wie <code>int load = 42;<\/code>. <code>int<\/code> bezeichnet eine ganze Zahl, <code>load<\/code> ist der Name und 42 der Anfangswert. <b>Deklarieren<\/b> führt die Variable ein; <b>Initialisieren<\/b> gibt ihr den ersten Wert. Danach genügt <code>load = 57;<\/code>: Der neue Wert ersetzt 42 in der vorhandenen Variablen.<br><br>Das Programm führt nicht automatisch eine Liste früherer Werte. Beim anschließenden Lesen von <code>load<\/code> ergibt sich 57. Jedes Fragment in diesem Workshop beginnt unabhängig mit den angegebenen Anfangswerten. Die Schreibweise orientiert sich an den C#-Fragmenten der Prüfungen; zum Nachvollziehen müssen Sie keine Sprache installieren oder ausführen."], "fig": "assign", "check": ["Después de load = 42; y luego load = 57; ¿qué valor contiene load?", "Nach load = 42; und anschließend load = 57; welchen Wert enthält load?"], "answer": 57, "repair": ["La segunda asignación reemplaza la primera; vuelve a mirar el destino de la izquierda.", "Die zweite Zuweisung ersetzt den ersten Wert; beachten Sie das Ziel links."]}, {"title": ["Leer, calcular, reemplazar", "Lesen, rechnen, ersetzen"], "body": ["Una asignación también puede guardar el resultado de un cálculo. El signo <code>+<\/code> suma y <code>-<\/code> resta. Una <b>expresión<\/b> es una combinación que produce un valor, como <code>tickets + 2<\/code>. Primero se evalúa la expresión de la derecha con los valores que existen en ese momento. Después se guarda su resultado a la izquierda.<br><br>El servicio técnico tiene 5 tickets abiertos y recibe 2 más. La instrucción <code>tickets = tickets + 2;<\/code> tiene dos usos del mismo nombre. A la derecha <code>tickets<\/code> se <b>lee<\/b>: vale 5. Se calcula 5 + 2 = 7. A la izquierda <code>tickets<\/code> es el <b>destino<\/b>: allí se guarda 7 y se reemplaza el 5. Por eso la instrucción tiene sentido aunque como igualdad matemática «5 = 5 + 2» sería falsa.<br><br>No ejecutes la instrucción varias veces mentalmente: una línea se ejecuta una vez, salvo que el material diga otra cosa. En la figura puedes recorrer una sola asignación. Cada paso muestra una acción distinta, sin cambiar de ejemplo.", "Eine Zuweisung kann auch ein berechnetes Ergebnis speichern. <code>+<\/code> addiert und <code>-<\/code> subtrahiert. Ein <b>Ausdruck<\/b> liefert einen Wert, etwa <code>tickets + 2<\/code>. Zuerst wird die rechte Seite mit den zu diesem Zeitpunkt vorhandenen Werten ausgewertet. Erst danach wird das Ergebnis links gespeichert.<br><br>Der Support hat 5 offene Tickets und erhält 2 weitere. In <code>tickets = tickets + 2;<\/code> wird derselbe Name zweimal unterschiedlich verwendet. Rechts wird <code>tickets<\/code> <b>gelesen<\/b>: Der Wert ist 5. Die Rechnung 5 + 2 ergibt 7. Links ist <code>tickets<\/code> das <b>Ziel<\/b>: 7 wird gespeichert und ersetzt 5. Die Anweisung ist daher sinnvoll, obwohl die mathematische Gleichung „5 = 5 + 2“ falsch wäre.<br><br>Führen Sie eine Anweisung gedanklich nicht mehrfach aus: Jede Zeile wird einmal ausgeführt, sofern das Material nichts anderes vorgibt. In der Abbildung können Sie eine einzelne Zuweisung verfolgen. Jeder Schritt zeigt eine andere Aktion desselben Beispiels."], "fig": "increment", "check": ["tickets contiene 8. Se ejecuta tickets = tickets - 3; una vez. ¿Nuevo valor?", "tickets enthält 8. tickets = tickets - 3; wird einmal ausgeführt. Neuer Wert?"], "answer": 5, "repair": ["Lee 8, resta 3 y guarda 5. El nuevo valor sustituye al anterior.", "Lesen Sie 8, ziehen Sie 3 ab und speichern Sie 5 anstelle des alten Werts."]}, {"title": ["Seguir el orden de las líneas", "Die Reihenfolge verfolgen"], "body": ["Un fragmento sin decisiones ni repeticiones se ejecuta de arriba hacia abajo. Cada línea ve los cambios que ya hicieron las anteriores. Para no perderte, anota el estado <b>después<\/b> de cada línea. Una tabla de seguimiento tiene una columna por variable: cambia solo la que recibe la asignación y conserva las demás.<br><br>Supón <code>int a = 4;<\/code> y <code>int b = 0;<\/code>. Con <code>b = a;<\/code> se lee el 4 de <code>a<\/code> y se guarda en <code>b<\/code>. Luego <code>a = 9;<\/code> reemplaza el valor de <code>a<\/code>. <code>b<\/code> sigue siendo 4: en estas variables numéricas, la asignación copió el valor de aquel momento, no creó una fórmula que se actualice sola.<br><br>Si después se ejecuta <code>b = a + 1;<\/code>, se lee el valor actual de <code>a<\/code>, que ya es 9. Se guarda 10 en <code>b<\/code>. Por eso importa el orden. Una tabla describe lo que el código <b>hace<\/b>, incluso si no coincide con lo que su autor quería. No corrijas el código mientras rellenas un seguimiento.", "Ein Fragment ohne Verzweigungen und Wiederholungen läuft von oben nach unten. Jede Zeile sieht die Änderungen der vorherigen Zeilen. Notieren Sie den Zustand <b>nach<\/b> jeder Zeile. Eine Ablaufverfolgung hat eine Spalte je Variable: Ändern Sie nur das Zuweisungsziel und übernehmen Sie die übrigen Werte.<br><br>Gegeben seien <code>int a = 4;<\/code> und <code>int b = 0;<\/code>. Bei <code>b = a;<\/code> wird 4 aus <code>a<\/code> gelesen und in <code>b<\/code> gespeichert. Danach ersetzt <code>a = 9;<\/code> den Wert von <code>a<\/code>. <code>b<\/code> bleibt 4: Bei diesen Zahlenvariablen wurde der damalige Wert kopiert, keine sich selbst aktualisierende Formel eingerichtet.<br><br>Wird anschließend <code>b = a + 1;<\/code> ausgeführt, ist der aktuelle Wert von <code>a<\/code> bereits 9. In <code>b<\/code> wird 10 gespeichert. Deshalb ist die Reihenfolge entscheidend. Eine Tabelle zeigt, was der Code tatsächlich <b>tut<\/b>, auch wenn sein Autor etwas anderes beabsichtigt hat. Korrigieren Sie den Code während der Ablaufverfolgung nicht."], "fig": "trace", "check": ["a = 6; b = a; a = 2; ¿cuánto vale b al final?", "a = 6; b = a; a = 2; Welchen Wert hat b am Ende?"], "answer": 6, "repair": ["b recibió 6 en la segunda línea. La tercera solo cambia a.", "b erhielt in der zweiten Zeile 6. Die dritte Zeile ändert nur a."]}, {"title": ["Arrays: varios valores ordenados", "Arrays: mehrere geordnete Werte"], "body": ["Una variable permite guardar una medición. Para conservar varias mediciones relacionadas, resulta útil una colección ordenada. Un <b>array<\/b> agrupa varios elementos bajo un mismo nombre. Aquí cada elemento almacena un entero y la cantidad de elementos permanece fija.<br><br>La declaración <code>int[] load = {18, 42, 67, 31};<\/code> crea un array llamado <code>load<\/code> con cuatro valores. <code>int[]<\/code> significa array de enteros; las llaves contienen los valores iniciales y las comas los separan. El orden escrito se conserva: el array no ordena automáticamente los números de menor a mayor.<br><br>Para distinguir los elementos, cada posición tiene un <b>índice<\/b>. En esta notación el primero tiene índice 0, el segundo 1, el tercero 2 y el cuarto 3. El índice responde «¿en qué posición?», mientras que el valor responde «¿qué dato hay allí?». En el índice 2 hay 67; 2 no es la carga del servidor. La <b>longitud<\/b> es la cantidad de elementos: aquí 4. No la confundas con el último índice, que es 3.", "Eine Variable kann einen Messwert speichern. Für mehrere zusammengehörige Messwerte ist eine geordnete Sammlung sinnvoll. Ein <b>Array<\/b> fasst mehrere Elemente unter einem Namen zusammen. Hier enthält jedes Element eine ganze Zahl, und die Anzahl der Elemente bleibt fest.<br><br><code>int[] load = {18, 42, 67, 31};<\/code> erzeugt das Array <code>load<\/code> mit vier Werten. <code>int[]<\/code> bedeutet Array von Ganzzahlen; die geschweiften Klammern enthalten die Anfangswerte, die Kommas trennen sie. Die angegebene Reihenfolge bleibt bestehen: Das Array sortiert Zahlen nicht automatisch aufsteigend.<br><br>Jede Position hat einen <b>Index<\/b>. In dieser Schreibweise hat das erste Element Index 0, das zweite 1, das dritte 2 und das vierte 3. Der Index beantwortet „an welcher Stelle?“, der Wert dagegen „welche Daten stehen dort?“. An Index 2 steht 67; 2 ist nicht die Serverauslastung. Die <b>Länge<\/b> ist die Anzahl der Elemente: hier 4. Der letzte Index ist dagegen 3."], "fig": "array", "check": ["Un array tiene cuatro elementos y empieza en índice 0. ¿Cuál es el último índice?", "Ein Array hat vier Elemente und beginnt bei Index 0. Wie lautet der letzte Index?"], "answer": 3, "repair": ["Numera los cuatro elementos: 0, 1, 2, 3. Hay cuatro números, pero el último es 3.", "Nummerieren Sie die vier Elemente: 0, 1, 2, 3. Das sind vier Stellen, der letzte Index ist 3."]}, {"title": ["Leer un elemento por su índice", "Ein Element über den Index lesen"], "body": ["Para leer un elemento escribimos el nombre del array y su índice entre <b>corchetes<\/b>. En <code>load[2]<\/code>, las letras identifican el array y el 2 elige su tercera posición. El resultado de esa lectura es el valor almacenado, 67. La lectura por sí sola no modifica el array.<br><br>También puede haber una variable dentro de los corchetes. Si <code>int i = 1;<\/code>, la expresión <code>load[i]<\/code> usa el valor actual de <code>i<\/code> como índice: lee <code>load[1]<\/code>, cuyo valor es 42. Si luego se ejecuta <code>i = i + 1;<\/code>, <code>i<\/code> pasa a 2. La siguiente lectura de <code>load[i]<\/code> obtiene 67. Cambió la posición elegida, no los datos del array.<br><br>En <code>int current = load[i];<\/code>, <code>current<\/code> recibe el número leído en ese momento. Cambiar <code>i<\/code> más tarde no actualiza automáticamente <code>current<\/code>. Haz dos pasos separados: resuelve primero el índice y después mira el valor en esa posición. Si los corchetes contienen <code>i + 1<\/code>, primero suma 1 al índice; no sumes 1 al valor almacenado.", "Zum Lesen schreiben Sie den Arraynamen und den Index in <b>eckige Klammern<\/b>. Bei <code>load[2]<\/code> bezeichnet der Name das Array und 2 wählt die dritte Stelle. Die Leseoperation liefert den gespeicherten Wert 67. Lesen verändert das Array nicht.<br><br>In den Klammern kann auch eine Variable stehen. Bei <code>int i = 1;<\/code> verwendet <code>load[i]<\/code> den aktuellen Wert von <code>i<\/code> als Index: <code>load[1]<\/code> liefert 42. Nach <code>i = i + 1;<\/code> enthält <code>i<\/code> den Wert 2. Die nächste Leseoperation <code>load[i]<\/code> liefert 67. Die gewählte Position hat sich geändert, die Arraydaten nicht.<br><br>Bei <code>int current = load[i];<\/code> erhält <code>current<\/code> die zu diesem Zeitpunkt gelesene Zahl. Eine spätere Änderung von <code>i<\/code> aktualisiert <code>current<\/code> nicht automatisch. Arbeiten Sie in zwei Schritten: zuerst den Index bestimmen, dann den Wert an dieser Stelle lesen. Bei <code>i + 1<\/code> innerhalb der Klammern wird der Index um 1 erhöht, nicht der gespeicherte Wert."], "fig": "read", "check": ["load = {18, 42, 67, 31}; i = 1; ¿qué número produce load[i + 1]?", "load = {18, 42, 67, 31}; i = 1; Welche Zahl liefert load[i + 1]?"], "answer": 67, "repair": ["Primero i + 1 = 2; después lee el índice 2: su valor es 67.", "Zuerst i + 1 = 2; danach Index 2 lesen: Dort steht 67."]}, {"title": ["Escribir en una posición", "An einer Stelle schreiben"], "body": ["Un elemento del array también puede ser el destino de una asignación. <code>load[1] = 50;<\/code> guarda 50 en el índice 1 y reemplaza el 42 que había allí. El índice 1 continúa identificando la segunda posición; los otros elementos no se mueven ni se modifican.<br><br>Es distinto cambiar <code>i<\/code> de cambiar <code>load[i]<\/code>. Con <code>i = 2;<\/code> cambias la variable que elige una posición. Con <code>load[i] = 50;<\/code> cambias el dato de la posición elegida. Para seguir una instrucción, señala siempre el destino completo que está a la izquierda.<br><br>También puedes combinar lectura y escritura: <code>load[1] = load[1] + 3;<\/code>. Primero se lee el contenido actual del índice 1. Si contiene 50, se calcula 50 + 3 = 53 y se escribe 53 en ese mismo elemento. Una variable numérica que hubiera recibido antes 50 sigue conteniendo 50; para obtener el nuevo dato habría que volver a leer el array. La longitud sigue siendo cuatro: reemplazar un valor no añade elementos.", "Ein Arrayelement kann das Ziel einer Zuweisung sein. <code>load[1] = 50;<\/code> speichert 50 an Index 1 und ersetzt den bisherigen Wert 42. Index 1 bezeichnet weiterhin die zweite Position; die anderen Elemente werden weder verschoben noch verändert.<br><br><code>i<\/code> zu ändern ist etwas anderes als <code>load[i]<\/code> zu ändern. <code>i = 2;<\/code> ändert die Variable zur Auswahl einer Position. <code>load[i] = 50;<\/code> ändert den Inhalt der gewählten Position. Markieren Sie deshalb immer das vollständige Ziel links.<br><br>Lesen und Schreiben lassen sich verbinden: <code>load[1] = load[1] + 3;<\/code>. Zuerst wird der aktuelle Inhalt an Index 1 gelesen. Steht dort 50, ergibt 50 + 3 den Wert 53, der an derselben Stelle gespeichert wird. Eine Zahlenvariable, die zuvor 50 übernommen hat, bleibt bei 50; für den neuen Wert müsste das Array erneut gelesen werden. Die Länge bleibt vier: Das Ersetzen eines Werts fügt kein Element hinzu."], "fig": "write", "check": ["i = 1; load[1] contiene 50. Después de load[i] = 53; ¿cuánto vale i?", "i = 1; load[1] enthält 50. Welchen Wert hat i nach load[i] = 53;?"], "answer": 1, "repair": ["El destino es load[i], no i. El índice permanece en 1.", "Das Ziel ist load[i], nicht i. Der Index bleibt 1."]}, {"title": ["Longitud y límites válidos", "Länge und gültige Grenzen"], "body": ["Antes de leer un elemento, comprueba que la posición existe. Con cuatro elementos los índices válidos son 0, 1, 2 y 3. <code>load[4]<\/code> intenta leer un quinto elemento que no existe. En los arrays C# de estos fragmentos se produce un error; no se devuelve cero ni el último dato.<br><br><code>load.Length<\/code> es la cantidad de elementos del array. El punto permite consultar esa propiedad y <code>Length<\/code> significa longitud. Si hay cuatro elementos, vale 4. Como el primero está numerado con 0, el último está numerado con <code>load.Length - 1<\/code>, aquí 4 - 1 = 3. No se resta un elemento: solo se convierte una cantidad en su último índice.<br><br>La numeración depende del lenguaje o del material. En estos ejercicios empieza siempre en cero y no se permiten índices negativos. Una tabla de mediciones puede añadir horas o nombres de equipos: esos rótulos explican qué representa cada posición, pero no sustituyen al índice. Por ejemplo, la medición de las 08:00 puede estar en índice 0. Lee el encabezado antes de decidir qué número escribir.", "Prüfen Sie vor dem Zugriff, ob die Position existiert. Bei vier Elementen sind 0, 1, 2 und 3 gültige Indizes. <code>load[4]<\/code> greift auf ein nicht vorhandenes fünftes Element zu. Bei den C#-Arrays dieser Fragmente entsteht ein Fehler; es wird weder null noch der letzte Wert geliefert.<br><br><code>load.Length<\/code> ist die Anzahl der Arrayelemente. Über den Punkt wird diese Eigenschaft abgefragt; <code>Length<\/code> bedeutet Länge. Bei vier Elementen ist sie 4. Weil die Nummerierung bei 0 beginnt, ist der letzte Index <code>load.Length - 1<\/code>, also 4 - 1 = 3. Es wird kein Element entfernt: Die Anzahl wird in den letzten Index umgerechnet.<br><br>Die Nummerierung hängt von Sprache und Vorgabe ab. Hier beginnt sie immer bei null, negative Indizes sind nicht zulässig. Eine Messwerttabelle kann zusätzlich Uhrzeiten oder Gerätenamen enthalten. Diese Beschriftungen erklären die Bedeutung einer Position, ersetzen aber den Index nicht. Die Messung um 08:00 Uhr kann etwa an Index 0 stehen. Lesen Sie zuerst die Überschriften."], "fig": "bounds", "check": ["Hay seis elementos, numerados desde cero. ¿Cuál es su último índice válido?", "Sechs Elemente sind ab null nummeriert. Wie lautet der letzte gültige Index?"], "answer": 5, "repair": ["Las seis posiciones son 0, 1, 2, 3, 4, 5. Longitud 6; último índice 5.", "Die sechs Stellen sind 0, 1, 2, 3, 4, 5. Länge 6; letzter Index 5."]}, {"title": ["Conservar un valor antes de reemplazarlo", "Vor dem Überschreiben sichern"], "body": ["A veces queremos intercambiar dos valores. Supón que <code>a<\/code> contiene 12 y <code>b<\/code> contiene 7. Si ejecutamos <code>a = b;<\/code>, ambas variables contienen 7. La instrucción siguiente <code>b = a;<\/code> vuelve a copiar 7. El 12 ya se perdió: dos asignaciones sucesivas no hacen un intercambio.<br><br>La solución es guardar el valor que va a desaparecer en una variable auxiliar: <code>int temp = a;<\/code> conserva 12. Luego <code>a = b;<\/code> deja 7 en <code>a<\/code>. Por último <code>b = temp;<\/code> recupera el 12 para <code>b<\/code>. <code>temp<\/code> significa temporal: permite conservar un dato mientras otro destino cambia.<br><br>El mismo mecanismo sirve para dos elementos de un array. Si <code>werte[0]<\/code> contiene 12 y <code>werte[1]<\/code> contiene 7, guarda primero <code>werte[0]<\/code> en <code>temp<\/code>, copia <code>werte[1]<\/code> a <code>werte[0]<\/code> y finalmente copia <code>temp<\/code> a <code>werte[1]<\/code>. Este intercambio aparece como parte de un apartado real de programación; aquí estudiamos solo las asignaciones, sin introducir el algoritmo de ordenación completo.", "Manchmal sollen zwei Werte getauscht werden. <code>a<\/code> enthält 12 und <code>b<\/code> enthält 7. Nach <code>a = b;<\/code> enthalten beide Variablen 7. Die folgende Anweisung <code>b = a;<\/code> kopiert erneut 7. Der Wert 12 ging verloren: Zwei aufeinanderfolgende Zuweisungen bewirken keinen Tausch.<br><br>Eine Hilfsvariable sichert den Wert vor dem Überschreiben: <code>int temp = a;<\/code> bewahrt 12. Danach speichert <code>a = b;<\/code> den Wert 7 in <code>a<\/code>. Schließlich übernimmt <code>b = temp;<\/code> die gesicherte 12. <code>temp<\/code> steht für temporär: Ein Wert bleibt erhalten, während ein anderes Ziel geändert wird.<br><br>Dasselbe funktioniert bei zwei Arrayelementen. Enthält <code>werte[0]<\/code> 12 und <code>werte[1]<\/code> 7, sichern Sie zuerst <code>werte[0]<\/code> in <code>temp<\/code>, kopieren dann <code>werte[1]<\/code> nach <code>werte[0]<\/code> und zuletzt <code>temp<\/code> nach <code>werte[1]<\/code>. Dieser Tausch ist Teil einer realen Programmieraufgabe. Hier untersuchen wir nur die Zuweisungen, nicht den vollständigen Sortieralgorithmus."], "fig": "swap", "check": ["a = 8; b = 3; temp = a; a = b; b = temp; ¿cuánto vale b al final?", "a = 8; b = 3; temp = a; a = b; b = temp; Welchen Wert hat b am Ende?"], "answer": 8, "repair": ["temp conserva el 8 inicial y la última instrucción lo copia a b.", "temp sichert die anfängliche 8; die letzte Anweisung kopiert sie nach b."]}, {"title": ["Del significado a la hoja de examen", "Vom Verständnis zum Prüfungsblatt"], "body": ["Ya puedes seguir una variable y localizar un dato en un array. En una hoja de examen debes respetar qué estado pide la tabla: <b>al final de la línea<\/b> significa después de ejecutar esa instrucción. <b>Determinar<\/b> pide un resultado; <b>completar<\/b> pide llenar el material dado; <b>explicar<\/b> pide expresar por qué sucede algo, no solo dar una cifra.<br><br>Lee primero la situación y los valores iniciales. Después ejecuta una línea a la vez, determina su lado derecho y actualiza únicamente el destino. Para un acceso al array, separa índice y valor. Si la tabla pide lo que hace un fragmento defectuoso, sigue ese fragmento tal como está; la corrección es otra tarea.<br><br>Para una sesión de una hora, dedica unos 25 minutos a la explicación y sus pequeñas comprobaciones, 25 a los ejercicios 01–08 y 10 a las tareas escritas 09–10. Es una propuesta de reparto, no una medición de tu velocidad. Los ejercicios 11–20 quedan como práctica extra de nivel examen. Puedes saltar libremente desde la barra lateral.<br><br>Las pistas y las soluciones están cerradas al entrar. Cada intento guarda si usaste una pista o viste la solución. Las respuestas escritas se revisan con criterios por punto y un modelo, mediante autoevaluación explícita. Un resultado correcto en este taller no declara dominio del tema.", "Sie können jetzt Variablen verfolgen und Arraywerte finden. Beachten Sie im Prüfungsblatt den verlangten Zeitpunkt: <b>am Ende der Zeile<\/b> heißt nach der Ausführung dieser Anweisung. <b>Ermitteln<\/b> verlangt ein Ergebnis, <b>vervollständigen<\/b> das Ergänzen des gegebenen Materials und <b>erläutern<\/b> eine Begründung, nicht nur eine Zahl.<br><br>Lesen Sie zuerst die Situation und Anfangswerte. Führen Sie danach eine Zeile nach der anderen aus: rechte Seite bestimmen, nur das Ziel aktualisieren. Trennen Sie beim Arrayzugriff Index und Wert. Wenn die Tabelle einen fehlerhaften Programmablauf verlangt, verfolgen Sie den vorhandenen Code; die Korrektur ist eine andere Aufgabe.<br><br>Vorschlag für eine Stunde: 25 Minuten Erklärung und Kurzchecks, 25 Minuten Aufgaben 01–08, 10 Minuten schriftliche Aufgaben 09–10. Aufgaben 11–20 bleiben als Zusatzpraxis. Die Seitenleiste erlaubt freie Navigation.<br><br>Hinweise und Lösungen sind zunächst geschlossen. Jeder Versuch dokumentiert die Hilfe. Schriftliche Antworten bewerten Sie anhand von Punktkriterien und Modell selbst. Ein richtiges Ergebnis belegt noch keine dauerhafte Beherrschung."], "fig": "glossary", "check": ["Una tabla dice «Bei Ende von Zeile 3». x era 9 y la línea 3 es x = 2; ¿qué se escribe?", "Eine Tabelle verlangt „Bei Ende von Zeile 3“. x war 9; Zeile 3 ist x = 2; Was tragen Sie ein?"], "answer": 2, "repair": ["El encabezado pide el estado posterior: escribe 2.", "Gefragt ist der Zustand nach der Anweisung: Tragen Sie 2 ein."]}], EXERCISES=[{"id": 1, "title": ["Medición actual", "Aktueller Messwert"], "context": ["Un centro de datos recibe dos mediciones de carga. Su pantalla debe mostrar la última que se guardó.", "Ein Rechenzentrum erhält zwei Auslastungsmessungen. Die Anzeige soll den zuletzt gespeicherten Wert verwenden."], "ask": ["Completa el valor de load después de cada línea. Un punto por casilla.", "Vervollständigen Sie load am Ende jeder Zeile. Ein Punkt je Feld."], "code": ["int load = 28;", "load = 61;"], "fields": [{"label": ["load tras línea 1", "load nach Zeile 1"], "answer": "28", "expr": "load", "line": 1, "kind": "number", "points": 1}, {"label": ["load tras línea 2", "load nach Zeile 2"], "answer": "61", "expr": "load", "line": 2, "kind": "number", "points": 1}], "rows": [[1, {"field": 0}], [2, {"field": 1}]], "heads": ["Zeile / línea", "load"], "hint": ["La segunda línea reemplaza el contenido de load.", "Die zweite Zeile ersetzt den Inhalt von load."], "why": ["Primero se almacena 28; la segunda asignación guarda 61 en el mismo destino.", "Zuerst wird 28 gespeichert; die zweite Zuweisung speichert 61 im selben Ziel."], "source": "KAIT Sommer 2024 · 3aa (Ablaufverfolgung)", "array": null, "free": null}, {"id": 2, "title": ["Tickets del soporte", "Supporttickets"], "context": ["Una empresa de soporte registra 7 tickets abiertos, recibe 3 y cierra 2.", "Ein Supportunternehmen hat 7 offene Tickets, erhält 3 neue und schließt 2."], "ask": ["Rellena la tabla con el estado posterior a cada instrucción.", "Tragen Sie den Zustand nach jeder Anweisung in die Tabelle ein."], "code": ["int tickets = 7;", "tickets = tickets + 3;", "tickets = tickets - 2;"], "fields": [{"label": ["tickets tras línea 1", "tickets nach Zeile 1"], "answer": "7", "expr": "tickets", "line": 1, "kind": "number", "points": 1}, {"label": ["tickets tras línea 2", "tickets nach Zeile 2"], "answer": "10", "expr": "tickets", "line": 2, "kind": "number", "points": 1}, {"label": ["tickets tras línea 3", "tickets nach Zeile 3"], "answer": "8", "expr": "tickets", "line": 3, "kind": "number", "points": 1}], "rows": [[1, {"field": 0}], [2, {"field": 1}], [3, {"field": 2}]], "heads": ["Zeile / línea", "tickets"], "hint": ["Lee el valor actual antes de calcular; luego reemplázalo.", "Lesen Sie den aktuellen Wert vor der Rechnung; ersetzen Sie ihn da if(kind==='write')body+=`<div class="flow"><div><b>load[1] = 50;</b><span>${tr('42 se reemplaza por 50','42 wird durch 50 ersetzt')}</span></div><div><b>load[1] = load[1] + 3;</b><span>50 + 3 → 53</span></div></div><p>${tr('Solo cambia la posición de índice 1.','Nur der Inhalt an Index 1 ändert sich.')}</p>`;
if(kind==='bounds')body+=`<div class="flow"><div><b>load.Length → 4</b><span>${tr('Cantidad de elementos','Anzahl der Elemente')}</span></div><div><b>load.Length - 1 → 3</b><span>${tr('Último índice válido','Letzter gültiger Index')}</span></div><div><b>load[4] → ${tr('error','Fehler')}</b><span>${tr('No existe una quinta posición','Eine fünfte Stelle existiert nicht')}</span></div></div>`}
if(kind==='swap'){title=tr('La auxiliar conserva el 12','Die Hilfsvariable sichert 12');body=`<table><thead><tr><th>${tr('Después de','Nach')}</th><th>a</th><th>b</th><th>temp</th></tr></thead><tbody><tr><td>${tr('Inicio','Start')}</td><td>12</td><td>7</td><td>—</td></tr><tr><td>temp = a;</td><td>12</td><td>7</td><td>12</td></tr><tr><td>a = b;</td><td>7</td><td>7</td><td>12</td></tr><tr><td>b = temp;</td><td>7</td><td>12</td><td>12</td></tr></tbody></table><p style="margin-top:14px">${tr('Antes de reemplazar, conserva lo que necesitarás después.','Sichern Sie vor dem Überschreiben, was später benötigt wird.')}</p>`}
if(kind==='glossary'){title=tr('Los verbos de la tarea','Die Aufgabenoperatoren');body=`<table><thead><tr><th>Deutsch</th><th>Español</th></tr></thead><tbody><tr><td>Ermitteln Sie …</td><td>Determina …</td></tr><tr><td>Vervollständigen Sie …</td><td>Completa …</td></tr><tr><td>Erläutern Sie …</td><td>Explica por qué …</td></tr><tr><td>Bei Ende von Zeile …</td><td>Al terminar la línea …</td></tr><tr><td>Index / Wert / Länge</td><td>Índice / valor / longitud</td></tr></tbody></table><p style="margin-top:14px">${tr('Consulta el significado antes de responder en alemán.','Klären Sie die Bedeutung vor Ihrer deutschen Antwort.')}</p>`}
return `<figure class="figure"><h2>${title}</h2>${body}</figure>`}
function stepRender(){const texts=[['Inicio: tickets contiene 5. La línea aún no se ha ejecutado.','Start: tickets enthält 5. Die Anweisung wurde noch nicht ausgeführt.'],['1 · Leer: a la derecha, tickets entrega su valor actual 5.','1 · Lesen: Rechts liefert tickets seinen aktuellen Wert 5.'],['2 · Calcular: 5 + 2 produce 7. tickets todavía contiene 5.','2 · Rechnen: 5 + 2 ergibt 7. tickets enthält noch 5.'],['3 · Guardar: se escribe 7 en tickets y se reemplaza el 5.','3 · Speichern: 7 wird in tickets gespeichert und ersetzt 5.']];$('frame').innerHTML=`<div class="cell"><small>tickets</small><strong>${frame===3?7:5}</strong></div><p class="step-copy" style="margin-top:14px" aria-live="polite">${bi(texts[frame])}</p>`;$('step-next').disabled=frame===3}
function lesson(l,i){$('page').innerHTML=`<p class="eyebrow">${tr('Comprender','Verstehen')} · ${String(i+1).padStart(2,'0')}</p><h1>${bi(l.title)}</h1><div class="lesson-grid"><div class="prose"><p>${bi(l.body).replaceAll("<br><br>","</p><p>")}</p></div><div>${figure(l.fig)}<section class="mini"><h3>${tr('Comprueba esta idea','Diese Idee prüfen')}</h3><label for="mini-answer">${bi(l.check)}</label><input id="mini-answer" inputmode="numeric" autocomplete="off" aria-label="${tr('Respuesta al control breve','Antwort auf den Kurzcheck')}" value="${esc(state.checks[i]?.answer||'')}"><button id="mini-check">${tr('Comprobar','Prüfen')}</button><p id="mini-result" class="feedback" role="status"></p></section></div></div>`;
$('mini-answer').oninput=e=>{state.checks[i]={answer:e.target.value};persist()};$('mini-check').onclick=()=>{let v=$('mini-answer').value.trim();let ok=validNumber(v,l.answer);$('mini-result').textContent=!v?tr('Escribe una respuesta antes de comprobar.','Tragen Sie vor der Prüfung eine Antwort ein.'):ok?tr('Correcto. Explica el paso con tus propias palabras antes de seguir.','Richtig. Erklären Sie den Schritt vor dem Weitergehen mit eigenen Worten.'):bi(l.repair);state.checks[i]={answer:v,correct:ok};persist()};
if(l.fig==='increment'){stepRender();$('step-next').onclick=()=>{frame++;stepRender()};$('step-reset').onclick=()=>{frame=0;stepRender()}}}
function input(q,k){const s=task(q),v=s.answers[k]||'',x=q.fields[k];let label=esc(bi(x.label));if(x.kind==='select')return `<select data-answer="${k}" aria-label="${label}"><option value="">${tr('Selecciona','Auswählen')}</option><option value="error" ${v==='error'?'selected':''}>${tr('Error de acceso','Zugriffsfehler')}</option><option value="zero" ${v==='zero'?'selected':''}>0</option><option value="last" ${v==='last'?'selected':''}>${tr('Último dato','Letzter Wert')}</option></select>`;return `<input data-answer="${k}" aria-label="${label}" value="${esc(v)}" ${x.kind==='number'?'inputmode="numeric"':''} autocomplete="off" spellcheck="false">`}
function materialArray(a){return `<table class="array-material"><caption>${esc(a.name)} · ${tr('Material dado','Vorgegebenes Material')}</caption><tbody><tr><th>${tr('Hora','Uhrzeit')}</th>${a.labels.map(v=>'<td>'+esc(v)+'</td>').join('')}</tr><tr><th>Index</th>${a.values.map((_,i)=>'<td>'+i+'</td>').join('')}</tr><tr><th>${tr('Valor','Wert')} (${a.unit})</th>${a.values.map(v=>'<td>'+esc(v)+'</td>').join('')}</tr></tbody></table>`}
function exercise(q){let s=task(q),max=q.free?q.free.criteria.length:q.fields.reduce((n,x)=>n+x.points,0);$('page').innerHTML=`<p class="eyebrow">${q.id<=10?tr('Práctica de la sesión','Sitzungspraxis'):tr('Práctica extra','Zusatzpraxis')} · ${tr('Ejercicio','Aufgabe')} ${String(q.id).padStart(2,'0')}</p><h1>${bi(q.title)}</h1><section class="sheet"><header class="sheet-head"><div><p><b>eigene Aufgabe, nicht offiziell IHK</b></p><p>${tr('Formato adaptado de','Format angelehnt an')} ${esc(q.source)}</p></div><div class="points">${max} ${tr('puntos','Punkte')}</div></header><div class="sheet-body"><p class="context">${bi(q.context)}</p><p class="ask">${bi(q.ask)}</p><div class="material ${q.free?'single':''}"><div>${q.array?materialArray(q.array):''}<div class="codebox"><div class="code-label">${tr('Fragmento dado · líneas numeradas','Vorgegebenes Fragment · Zeilennummern')}</div>${q.code.map((c,i)=>`<div class="code-row"><span class="code-num">${i+1}</span><span class="code-text">${esc(c)}</span></div>`).join('')}</div></div>${q.free?`<div><label class="written-label" for="written">${tr('Tu explicación en alemán','Ihre Erklärung auf Deutsch')}</label><textarea id="written" lang="de" spellcheck="true">${esc(s.text)}</textarea><p class="muted">${tr('Sin puntuación automática del texto. Después de escribir, compara cada criterio y el modelo.','Keine automatische Textbewertung. Vergleichen Sie nach dem Schreiben jedes Kriterium und das Modell.')}</p></div>`:`<div><table class="answer-table"><caption>${tr('Completa este material','Dieses Material vervollständigen')}</caption><thead><tr>${q.heads.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr></thead><tbody>${q.rows.map(row=>'<tr>'+row.map(c=>'<td>'+(typeof c==='object'?input(q,c.field):esc(c))+'</td>').join('')+'</tr>').join('')}</tbody></table><p class="muted" style="margin-top:10px">${q.fields.some(x=>x.kind==='code')?tr('Expresiones en la notación dada. Se ignoran espacios y paréntesis externos. Cada expresión: 2 puntos.','Ausdrücke in der vorgegebenen Schreibweise. Leerzeichen und äußere Klammern werden ignoriert. Je Ausdruck: 2 Punkte.'):tr('Un punto por casilla. Números enteros, sin unidades.','Ein Punkt je Feld. Ganze Zahlen ohne Einheiten.')}</p></div>`}</div><div class="actions"><button class="primary" id="check">${q.free?tr('Revisar con criterios','Anhand der Kriterien prüfen'):tr('Comprobar','Prüfen')}</button><button id="hint" aria-expanded="false">${tr('Pista','Hinweis')}</button><button id="solution" aria-expanded="false">${tr('Solución y modelo','Lösung und Modell')}</button></div><div class="status-text" id="support-status">${tr('Ayuda registrada','Dokumentierte Hilfe')}: ${supportLabel(support(s))} · ${tr('intentos','Versuche')}: ${s.attempts.length}</div><section class="help" id="hint-box" hidden><h3>${tr('Pista','Hinweis')}</h3><p>${bi(q.hint)}</p></section><section class="help solution" id="solution-box" hidden></section><section class="result" id="result" role="status" hidden></section><section class="criteria" id="rubric" hidden></section></div></section>`;
$('page').querySelectorAll('[data-answer]').forEach(el=>el.oninput=()=>{s.answers[el.dataset.answer]=el.value;el.classList.remove('good','bad');$('result').hidden=true;persist()});if(q.free)$('written').oninput=e=>{s.text=e.target.value;$('result').hidden=true;$('rubric').hidden=true;persist()};
$('check').onclick=()=>check(q);$('hint').onclick=()=>toggleHelp(q,'hint');$('solution').onclick=()=>toggleHelp(q,'solution')}
function updateSupport(q){let s=task(q);$('support-status').textContent=tr('Ayuda registrada','Dokumentierte Hilfe')+': '+supportLabel(support(s))+' · '+tr('intentos','Versuche')+': '+s.attempts.length;persist();menu()}
function toggleHelp(q,kind){let s=task(q),box=$(kind+'-box');box.hidden=!box.hidden;$(kind).setAttribute('aria-expanded',String(!box.hidden));if(!box.hidden){s[kind]=true;if(kind==='solution')box.innerHTML=`<h3>${tr('Solución y modelo','Lösung und Modell')}</h3>${q.free?'<p lang="'+state.lang+'">'+esc(bi(q.free.model))+'</p>':'<ul>'+q.fields.map(x=>'<li>'+esc(bi(x.label))+': <b>'+esc(x.answer)+'</b> ('+x.points+' '+tr('p.','P.')+')</li>').join('')+'</ul>'}<p>${bi(q.why)}</p><p class="muted">${tr('Criterios propios de práctica; no es una puntuación oficial de la IHK.','Eigene Übungskriterien; keine offizielle IHK-Bewertung.')}</p>`;updateSupport(q)}}
function validNumber(v,expected){return /^[+-]?\d+$/.test(v)&&Number(v)===Number(expected)}
function normCode(v){v=v.trim().replace(/;$/,'').replace(/\s+/g,'');while(v.startsWith('(')&&v.endsWith(')'))v=v.slice(1,-1);return v}
function check(q){let s=task(q),r=$('result');r.hidden=false;if(q.free){if(!s.text.trim()){r.innerHTML='<p>'+tr('Escribe primero tu explicación. Una respuesta vacía no recibe puntos.','Schreiben Sie zuerst Ihre Erklärung. Eine leere Antwort erhält keine Punkte.')+'</p>';return}let snapshot={at:new Date().toISOString(),text:s.text,support:support(s),points:null,max:q.free.criteria.length,method:'self-review'};s.attempts.push(snapshot);s.activeReview=s.attempts.length-1;s.rubric={};r.innerHTML='<p>'+tr('Texto registrado. Abre el modelo y compara cada criterio. La puntuación será una autoevaluación.','Text erfasst. Öffnen Sie das Modell und vergleichen Sie jedes Kriterium. Die Punktzahl ist eine Selbstbewertung.')+'</p>';$('rubric').hidden=false;$('rubric').innerHTML='<h2>'+tr('Criterios: 1 punto por relación correcta','Kriterien: 1 Punkt je zutreffender Beziehung')+'</h2>'+q.free.criteria.map((c,i)=>`<div class="criterion"><label for="criterion-${i}">${i+1}. ${esc(bi(c))}</label><select id="criterion-${i}" data-criterion="${i}"><option value="">${tr('Pendiente de revisión','Noch zu prüfen')}</option><option value="1">${tr('Mi texto cumple este criterio','Mein Text erfüllt dieses Kriterium')}</option><option value="0">${tr('Falta o es incorrecto','Fehlt oder ist falsch')}</option></select></div>`).join('')+`<button id="self-score">${tr('Guardar autoevaluación','Selbstbewertung speichern')}</button><p class="muted">${tr('Si no estás seguro, deja el criterio pendiente y revísalo con tu formador.','Bei Unsicherheit das Kriterium offen lassen und mit der Ausbildungskraft besprechen.')}</p>`;$('rubric').querySelectorAll('[data-criterion]').forEach(e=>e.onchange=()=>{s.rubric[e.dataset.criterion]=e.value;persist()});$('self-score').onclick=()=>{if(!s.solution){r.innerHTML='<p>'+tr('Consulta el modelo antes de cerrar la autoevaluación.','Sehen Sie vor Abschluss der Selbstbewertung das Modell an.')+'</p>';return}if(q.free.criteria.some((_,i)=>!['0','1'].includes(s.rubric[i]))){r.innerHTML='<p>'+tr('Quedan criterios pendientes; aún no hay puntuación completa.','Es sind Kriterien offen; die Punktzahl ist noch unvollständig.')+'</p>';return}snapshot.points=Object.values(s.rubric).reduce((n,v)=>n+Number(v),0);snapshot.criteria={...s.rubric};r.innerHTML=`<p class="score">${tr('Autoevaluación','Selbstbewertung')}: ${snapshot.points} / ${snapshot.max}</p><p>${tr('Apoyo al escribir','Hilfe beim Schreiben')}: ${supportLabel(snapshot.support)}. ${tr('Modelo consultado para revisar. No equivale a una evaluación externa.','Modell zur Überprüfung eingesehen. Keine externe Bewertung.')}</p>`;updateSupport(q)};updateSupport(q);return}
let flags=q.fields.map((x,k)=>{let v=(s.answers[k]||'').trim();return x.kind==='number'?validNumber(v,x.answer):x.kind==='code'?normCode(v)===normCode(x.answer):v===x.answer}),max=q.fields.reduce((n,x)=>n+x.points,0),score=q.fields.reduce((n,x,k)=>n+(flags[k]?x.points:0),0);let empty=q.fields.some((_,k)=>!(s.answers[k]||'').trim());s.attempts.push({at:new Date().toISOString(),answers:{...s.answers},points:score,max,support:support(s),method:'exact-fields',complete:!empty});r.innerHTML=`<p class="score">${score} / ${max} ${tr('puntos','Punkte')} · ${supportLabel(support(s))}</p><p>${empty?tr('Hay casillas vacías. Complétalas antes de revisar el conjunto.','Es sind Felder leer. Ergänzen Sie diese vor der Gesamtprüfung.'):score===max?tr('Todas las casillas son correctas. Explica qué se leyó y qué destino cambió.','Alle Felder sind richtig. Erläutern Sie, was gelesen und welches Ziel geändert wurde.'):bi(q.hint)}</p><ul>${q.fields.map((x,k)=>'<li>'+esc(bi(x.label))+': '+(!(s.answers[k]||'').trim()?tr('vacía','leer'):flags[k]?tr('correcta','richtig'):tr('revisar','prüfen'))+'</li>').join('')}</ul>`;q.fields.forEach((_,k)=>{let e=$('page').querySelector(`[data-answer="${k}"]`);e.classList.remove('good','bad');e.classList.add(flags[k]?'good':'bad');e.setAttribute('aria-invalid',String(!flags[k]))});updateSupport(q)}
function sources(){let de=state.lang==='de';$('page').innerHTML=`<p class="eyebrow">${tr('Consultar y volver a practicar','Nachschlagen und erneut üben')}</p><h1>${tr('Fuentes y repaso','Quellen und Wiederholung')}</h1><div class="source-grid"><div class="source-card"><h2>${tr('Para volver a practicar','Für die nächste Übung')}</h2><p>${tr('En tu próxima sesión, intenta de nuevo 03, 07 y 18 sin abrir pistas ni soluciones. Explica una asignación en alemán. Si necesitas ayuda, vuelve a la explicación correspondiente y registra su uso. Esta propuesta no programa recordatorios ni demuestra retención.','Versuchen Sie in der nächsten Sitzung 03, 07 und 18 erneut ohne Hinweise oder Lösungen. Erläutern Sie eine Zuweisung auf Deutsch. Bei Bedarf zur entsprechenden Erklärung zurückkehren und die Hilfe dokumentieren. Dieser Vorschlag plant keine Erinnerungen und belegt noch keine Behaltensleistung.')}</p></div><div class="source-card"><h2>${tr('Libros locales','Lokale Fachbücher')}</h2><p>Kersken · IT-Handbuch, 11. Auflage (2023) · 7.1.2, S. 438–486; Schwerpunkt S. 440–450, 460–462, 472; Deklaration S. 530.</p><p>Grundstufe LF3–5 (2020) · LF5, S. 535–540: ${tr('datos, variables, operaciones y asignación','Daten, Variablen, Operatoren und Zuweisung')}.</p></div><div class="source-card"><h2>${tr('Formatos de examen consultados','Verwendete Prüfungsformate')}</h2><p>KAIT Sommer 2022 · 2b; Sommer 2023 · 3a; Sommer 2024 · 3aa–3ac. ${tr('Todos los ejercicios de este taller son propios. Se adaptan fragmentos del mecanismo, con datos nuevos; no se reproduce una tarea oficial completa.','Alle Workshopaufgaben sind eigene Aufgaben. Teilmechanismen wurden mit neuen Daten angepasst; keine vollständige offizielle Aufgabe wird wiedergegeben.')}</p></div><div class="source-card"><h2>${tr('Investigación didáctica','Didaktische Forschung')}</h2><p>Rosenshine (2012), Principles of Instruction · IES (2007), Organizing Instruction and Study · Nation (2007), The Four Strands · ${tr('contrato local, secciones 5–8','lokaler Vertrag, Abschnitte 5–8')}.</p><p>Mayer (2017), Using multimedia for e-learning, DOI 10.1111/jcal.12197; Cambridge Handbook of Multimedia Learning, ${tr('capítulo sobre proximidad de palabras y gráficos','Kapitel zur räumlichen Nähe von Text und Grafik')}.</p><p>Open University, OpenLearn, Simple Coding: ${tr('secuencia de datos, asignación y colecciones','Reihenfolge Daten, Zuweisung und Sammlungen')}. ${tr('Referencias completas y pruebas en REPORTE-taller.md.','Vollständige Quellen und Prüfnachweise in REPORTE-taller.md.')}</p></div></div><p class="muted" style="margin-top:15px">${tr('La práctica y sus puntuaciones son orientativas. Las respuestas y notas pueden exportarse desde la barra lateral.','Übung und Punktzahlen dienen der Orientierung. Antworten und Notizen lassen sich über die Seitenleiste exportieren.')}</p>`}
function render(){document.documentElement.lang=state.lang;$('top-title').firstChild.textContent=tr('Variables y arrays','Variablen und Arrays');$('top-sub').textContent=tr('Paso a paso · Español y alemán · Offline','Schritt für Schritt · Spanisch und Deutsch · Offline');$('notes').textContent=tr('Notas','Notizen');$('export').textContent=tr('↓ Exportar respuestas y notas','↓ Antworten und Notizen exportieren');$('sources').textContent=tr('Fuentes y repaso','Quellen und Wiederholung');$('skip').textContent=tr('Saltar al contenido','Zum Inhalt springen');$('prev').textContent=tr('← Anterior','← Zurück');$('next').textContent=tr('Siguiente →','Weiter →');$('es').classList.toggle('selected',state.lang==='es');$('de').classList.toggle('selected',state.lang==='de');$('es').setAttribute('aria-pressed',state.lang==='es');$('de').setAttribute('aria-pressed',state.lang==='de');document.querySelector('aside').setAttribute('aria-label',tr('Navegación del taller','Workshopnavigation'));$('menu').setAttribute('aria-label',tr('Páginas','Seiten'));document.querySelector('[data-page-indicator]').textContent=`Seite ${state.page+1} / 31`;$('prev').disabled=state.page===0;$('next').disabled=state.page===30;menu();if(state.page<10)lesson(LESSONS[state.page],state.page);else if(state.page<30)exercise(EXERCISES[state.page-10]);else sources();persist()}
function go(n){if(n<0||n>30)return;state.page=n;frame=0;render();$('content').scrollTop=0;$('content').focus({preventScroll:true})}
$('prev').onclick=()=>go(state.page-1);$('next').onclick=()=>go(state.page+1);$('sources').onclick=()=>go(30);['es','de'].forEach(l=>$(l).onclick=()=>{state.lang=l;render()});
$('notes').onclick=()=>{$('notes-title').textContent=tr('Notas','Notizen');$('close-notes').textContent=tr('Cerrar','Schließen');$('note-label').textContent=tr('Notas de esta página','Notizen zu dieser Seite')+` · Seite ${state.page+1}`;$('note-info').textContent=tr('Se guardan en este navegador y se incluyen en la exportación. Escape cierra la ventana.','Sie werden im Browser gespeichert und mit exportiert. Escape schließt das Fenster.');$('note-text').value=state.notes[state.page]||'';$('notes-dialog').showModal();$('note-text').focus()};$('note-text').oninput=e=>{state.notes[state.page]=e.target.value;persist()};$('close-notes').onclick=()=>$('notes-dialog').close();
$('export').onclick=()=>{let payload={workshop:'Automatización I / Automation I',date:'2026-10-05',exportedAt:new Date().toISOString(),...state,notice:tr('Resultados de práctica; las puntuaciones de textos son autoevaluaciones. No demuestra dominio.','Übungsergebnisse; Textbewertungen sind Selbstbewertungen. Kein Nachweis der Beherrschung.')};let url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='automation-2026-10-05-respuestas-notas.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
