<style>

*{box-sizing:border-box}html{font-size:17px}body{margin:0;color:var(--ink);background:var(--bg);font-family:"Segoe UI Variable","Segoe UI",sans-serif;line-height:1.45;height:100vh;display:grid;grid-template-rows:64px 40px minmax(0,1fr) 72px;font-kerning:normal}button,input,select,textarea{font:inherit;color:inherit}button{background:var(--surface);border:1px solid var(--line);padding:8px 16px;border-radius:4px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--accent);background:var(--tint)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{cursor:default;background:var(--bg);color:var(--dim);border-color:var(--soft)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 12px;min-width:0}textarea{resize:none;width:100%}input{width:100%}header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--soft);background:white;gap:16px}.brand{display:flex;align-items:baseline;gap:16px}.brand strong{font-family:Cambria,serif;font-size:1.5rem}.brand span,.muted{color:var(--dim)}.tools{display:flex;gap:8px}.chapters{display:flex;align-items:center;gap:32px;padding:0 32px}.chapters button{border:0;padding:4px 0;background:transparent;border-radius:0;color:var(--dim)}.chapters button.active{color:var(--ink);box-shadow:0 3px 0 var(--accent)}main{padding:8px 32px 16px;min-height:0;max-width:1440px;width:100%;margin:auto;height:100%}section.page{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}h1{font:400 2.15rem/1.1 Cambria,serif;margin:0;letter-spacing:-.02em}h2{font:400 1.5rem/1.2 Cambria,serif;margin:0}h3{font-size:1rem;margin:0 0 8px}p{margin:0}.lead{max-width:100ch;color:var(--dim);min-height:28px}.body{min-height:0}.fullfigure{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}figure{margin:0;min-width:0;min-height:0}.stage{height:100%;min-height:0;background:var(--surface);border:1px solid var(--soft);border-radius:10px;padding:16px;display:flex;align-items:center;justify-content:center;position:relative}.stage svg{width:100%;height:100%;max-height:none}.stage.compact{padding:8px}.svgtext{font-size:16px;fill:var(--ink)}svg text{font-size:16px;fill:var(--ink);font-family:"Segoe UI Variable","Segoe UI",sans-serif}svg .minor{font-size:14px;fill:var(--dim)}svg .code{font-family:"Cascadia Mono",Consolas,monospace;font-size:16px}svg .heading{font-size:20px;font-weight:600}svg .shape{fill:white;stroke:var(--line);stroke-width:1.5}svg .hot{fill:var(--tint);stroke:var(--accent);stroke-width:2.5}svg .edge{fill:none;stroke:var(--dim);stroke-width:1.75;marker-end:url(#arrow)}svg .accentedge{stroke:var(--accent);stroke-width:2.5}svg .edgelabel{font-size:14px;fill:var(--dim);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}svg .faded{fill:var(--bg);stroke:var(--line)}svg .dash{stroke-dasharray:6 5}figcaption{color:var(--dim);font-size:1rem;min-height:24px}.figid{font-size:.875rem;margin-right:8px}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr);gap:24px;height:100%;min-height:0}.work{border-left:1px solid var(--soft);padding-left:24px;display:flex;flex-direction:column;gap:12px;min-height:0}.field{display:grid;gap:4px}.fieldrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.feedback{min-height:24px;font-size:.875rem;line-height:1.35;color:var(--dim)}.feedback.good{color:var(--accent)}.feedback.bad{color:var(--ink);font-weight:600}.helpbuttons{display:flex;gap:8px;flex-wrap:wrap}.helpbox{background:var(--tint);padding:12px 16px;border-radius:4px;line-height:1.4;font-size:1rem}.aid{font-size:.875rem;color:var(--dim)}.state{font-weight:600;color:var(--accent)}.stepfigure{height:100%;display:grid;grid-template-rows:minmax(0,1fr) 24px 44px;gap:8px}.stepbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.steptext{color:var(--dim)}footer{padding:8px 32px 16px;display:grid;grid-template-columns:160px 1fr 160px;gap:32px;align-items:center;background:white;border-top:1px solid var(--soft)}footer button{height:44px}.position{display:grid;text-align:center;gap:8px}.progress{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.sourcegrid{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;height:100%;padding:24px;background:white;border:1px solid var(--soft);border-radius:10px}.sourcegrid>div{display:flex;flex-direction:column;gap:16px}.sourcegrid a{color:var(--accent)}.notearea{height:200px}.writing{height:auto;flex:1;min-height:96px}.rubric{display:grid;gap:8px}.criterion{display:flex;gap:8px;align-items:start}.criterion input{width:auto;margin-top:6px}.rubric label{font-size:.875rem}.examlabel{display:flex;justify-content:space-between;border-bottom:1px solid var(--soft);padding-bottom:8px;gap:16px}.point{font-weight:600}.examquestion{font-size:1.15rem;line-height:1.5}.examleft{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:16px}.examleft .stage svg{min-height:0}.legend{display:flex;gap:24px;font-size:.875rem;color:var(--dim);flex-wrap:wrap}.pill{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-family:"Cascadia Mono",Consolas,monospace;font-size:.875rem}.sample{display:grid;gap:8px}.sample .stage{flex:1}.sample>p{font-size:.875rem}.comparison{height:100%;display:grid;grid-template-rows:1fr auto;gap:8px}dialog{border:1px solid var(--line);border-radius:10px;width:680px;max-height:90vh;padding:24px;background:white;color:var(--ink)}dialog::backdrop{background:rgba(24,42,59,.3)}dialog h2{margin-bottom:16px}dialog p{margin-bottom:16px}dialog textarea{height:200px}.dialogbuttons{display:flex;gap:8px;justify-content:end;margin-top:16px}.estext{font-size:1.15rem;line-height:1.6}a{color:var(--accent)}[hidden]{display:none!important}.savewarn{font-size:.875rem;color:var(--dim)}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}.empty{stroke-dasharray:6 5}.auditline{font-size:.875rem;color:var(--dim)}noscript{position:absolute;inset:0;background:white;padding:48px;z-index:5}

<header><div class="brand"><strong>Backupwerkstatt</strong><span id="persiststatus">FISI AP2 · mit Ausbilder</span></div><div class="tools"><button id="spanish">Español</button><button id="notes">Notizen</button><button id="export">Exportieren</button></div></header>
<nav class="chapters" aria-label="Kapitel"><button data-chapter="0">Verstehen</button><button data-chapter="1">Wiederherstellen</button><button data-chapter="2">Üben</button><button data-chapter="3">Prüfungsaufgabe</button></nav>

<dialog id="notedialog" aria-labelledby="notetitle"><h2 id="notetitle">Notizen mit Ausbilder</h2><label for="globalnotes">Eigene Merksätze und offene Fragen</label><textarea id="globalnotes"></textarea><p class="savewarn" id="saveinfo"></p><div class="dialogbuttons"><button data-close="notedialog">Schließen</button></div></dialog>
<dialog id="exportdialog" aria-labelledby="exporttitle"><h2 id="exporttitle">Export zum Kopieren</h2><p>Falls der Download blockiert wird: Text markieren, kopieren und als JSON speichern.</p><label class="sr" for="exporttext">Exportdaten</label><textarea id="exporttext" readonly></textarea><div class="dialogbuttons"><button id="downloadagain">Datei herunterladen</button><button data-close="exportdialog">Schließen</button></div></dialog>
<noscript>Bitte JavaScript aktivieren. Der Workshop berechnet Kopien und Wiederherstellungszustände lokal im Browser.</noscript>
<script>
'use strict';
// Ein Datenmodell: Aussagen, SVG-Inhalte, Sollantworten und Rücksicherung.
const DATA={days:['Mo','Di','Mi','Do','Fr'],names:{A:'plan.txt',B:'kunden.csv',C:'logo.svg',D:'angebot.pdf'},base:{A:1,B:1,C:1},events:[{}, {A:2}, {B:2,D:1}, {A:3}, {B:3}],sizes:{A:1,B:1,C:1,D:1}};
const clone=o=>JSON.parse(JSON.stringify(o));
const snapshots=[];let current=clone(DATA.base);DATA.events.forEach((e,i)=>{Object.assign(current,e);snapshots.push(clone(current));});
function changes(day,base){return Object.fromEntries(Object.entries(snapshots[day]).filter(([f,v])=>snapshots[base][f]!==v));}
const backups={};for(let i=0;i<5;i++)backups['F'+DATA.days[i]]={id:'F'+DATA.days[i],day:i,type:'voll',files:clone(snapshots[i]),base:null};
for(let i=1;i<4;i++){backups['I'+DATA.days[i]]={id:'I'+DATA.days[i],day:i,type:'inkrementell',files:changes(i,i-1),base:i===1?'FMo':'I'+DATA.days[i-1]};backups['D'+DATA.days[i]]={id:'D'+DATA.days[i],day:i,type:'differenziell',files:changes(i,0),base:'FMo'};}
backups.IFr={id:'IFr',day:4,type:'inkrementell',files:changes(4,3),base:'FDo'};
function restore(ids){const state={};ids.forEach(id=>{if(backups[id])Object.assign(state,backups[id].files);});return state;}
function seq(type,day,base=0){if(type==='voll')return ['F'+DATA.days[day]];if(type==='differenziell')return day===base?['F'+DATA.days[base]]:['F'+DATA.days[base],'D'+DATA.days[day]];return ['F'+DATA.days[base],...DATA.days.slice(base+1,day+1).map(d=>'I'+d)];}
const versions=files=>Object.entries(files).map(([f,v])=>f+v);const versionText=files=>versions(files).join(' · ');const volume=files=>Object.keys(files).reduce((n,f)=>n+DATA.sizes[f],0);
const KEY='backupwerkstatt-sol61-high-v7-v1';let storeOK=true;let state={page:0,notes:'',answers:{},aids:{},checked:{},written:{},criteria:{},steps:{}};
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(saved&&saved.version===1&&saved.state&&typeof saved.state==='object')state={...state,...saved.state};}}catch(e){storeOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,state}));storeOK=true;}catch(e){storeOK=false;}document.getElementById('persiststatus').textContent=storeOK?'Nur im Browser · Export empfohlen':'Speichern blockiert · bitte exportieren';document.getElementById('saveinfo').textContent=storeOK?'Lokal in diesem Browserprofil gespeichert. Kein Backup: Löschen der Browserdaten oder ein anderer Speicherort kann den Stand verlieren. Regelmäßig exportieren.':'Lokales Speichern ist nicht verfügbar. Antworten bleiben bis zum Schließen im Speicher. Jetzt exportieren; der Kopiertext ist die Alternative.';}
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function text(x,y,value,cls='',anchor='start'){return `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${E(value)}</text>`;}
function rect(x,y,w,h,cls='shape'){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="${cls}"/>`;}
function edge(d,label,x,y,hot=false){return `<path d="${d}" class="edge ${hot?'accentedge':''}"/>`+text(x,y,label,'edgelabel','middle');}
function svg(inner,w=1120,h=360,label='Backupdiagramm'){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${E(label)}"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536477"/></marker></defs>${inner}</svg>`;}
function cylinder(x,y,w,h,id,files,hot=false,missing=false){let inner=`<path d="M${x} ${y+16} V${y+h-16} C${x} ${y+h+4},${x+w} ${y+h+4},${x+w} ${y+h-16} V${y+16}" class="${hot?'hot':'shape'} ${missing?'dash':''}"/><ellipse cx="${x+w/2}" cy="${y+16}" rx="${w/2}" ry="16" class="${hot?'hot':'shape'} ${missing?'dash':''}"/>`;inner+=text(x+w/2,y-16,id,'code','middle');const vs=versions(files);if(missing)inner+=text(x+w/2,y+70,'fehlt','', 'middle');else if(vs.length===0)inner+=text(x+w/2,y+64,'?','','middle');else vs.forEach((v,i)=>inner+=text(x+w/2,y+64+i*24,v,'code','middle'));return inner;}
function timelineFigure(){let s='';const xs=[32,304,576,848];for(let i=0;i<3;i++)s+=edge(`M${xs[i]+208} 176 H${xs[i+1]-16}`,'ändert',xs[i]+232,152);xs.forEach((x,i)=>{s+=text(x,40,DATA.days[i]+' · 18 Uhr','heading');s+=rect(x,72,208,216,i===3?'hot':'shape');Object.entries(snapshots[i]).forEach(([f,v],k)=>{s+=text(x+16,112+k*40,DATA.names[f]);s+=text(x+184,112+k*40,'v'+v,'code','end');});});s+=text(32,328,'Ganze Dateien · keine Löschungen · jede Version 1 MB','minor');return svg(s,1120,360,'Vier Tageszustände mit konkreten Dateiversionen');}
function strategyFigure(type){let s='';const ids=type==='voll'?['FMo','FDi','FMi','FDo']:type==='inkrementell'?['FMo','IDi','IMi','IDo']:['FMo','DDi','DMi','DDo'];const xs=[40,312,584,856];if(type==='inkrementell'){for(let i=0;i<3;i++)s+=edge(`M${xs[i]+192} 264 H${xs[i+1]-16}`,'ergänzt',xs[i]+232,240);}if(type==='differenziell'){s+=edge('M232 232 H264 V376 H1080 V232 H1056','ergänzt',680,352,true);s+=text(40,48,'Alle Differenzen vergleichen mit FMo.','heading');}if(type==='voll')xs.forEach(x=>{s+=edge(`M${x+16} 48 V88`,'kopiert alles',x+112,64);s+=text(x+96,32,'Dateibestand','minor','middle');});ids.forEach((id,i)=>{s+=cylinder(xs[i],112,192,168,id,backups[id].files,i===3);s+=text(xs[i]+96,312,volume(backups[id].files)+' MB','minor','middle');});if(type==='differenziell')return svg(s,1120,408,'Jede differentielle Kopie bezieht sich auf FMo');return svg(s,1120,360,'Inhalt der '+type+'en Sicherungen von Montag bis Donnerstag');}
function relationsFigure(){let s='';const xs=[40,320,600,880];for(let i=0;i<3;i++)s+=edge(`M${xs[i]+160} 80 H${xs[i+1]-16}`,'ergänzt',xs[i]+232,56);xs.forEach((x,i)=>{s+=rect(x,48,160,64,i===3?'hot':'shape');s+=text(x+80,88,['FMo','IDi','IMi','IDo'][i],'code','middle');});s+=text(40,152,'Inkrementell: kein Glied auslassen.','heading');s+=edge('M200 264 H304','ergänzt',252,240);s+=rect(40,232,160,64);s+=text(120,272,'FMo','code','middle');s+=rect(320,232,160,64,'hot');s+=text(400,272,'DDo','code','middle');s+=text(600,264,'DDi und DMi werden nicht benötigt.');s+=text(40,344,'Differenziell: vollständige Basis + Zielkopie.','heading');return svg(s,1120,384,'Abhängigkeiten: Incrementalkette und differentialer Bezug auf Vollsicherung');}
function volumeFigure(){let s='';const types=['voll','inkrementell','differenziell'];types.forEach((type,r)=>{const y=40+r*112;s+=text(24,y+40,type,'heading');const ids=type==='voll'?['FMo','FDi','FMi','FDo']:type==='inkrementell'?['FMo','IDi','IMi','IDo']:['FMo','DDi','DMi','DDo'];ids.forEach((id,i)=>{const x=248+i*208,n=volume(backups[id].files);s+=rect(x,y,32*n,48,r===2?'hot':'shape');s+=text(x+32*n+16,y+32,n+' MB');s+=text(x,y+80,id,'code');});});return svg(s,1120,360,'Sicherungsvolumen je Tag: volle 3 3 4 4 MB, inkrementelle 3 1 2 1 MB, differentielle 3 1 3 3 MB');}
function restoreFigure(ids,k,w=1120){let s='';const size=w===1120?192:136,space=w===1120?272:176,x0=24;const nodes=ids.map((id,i)=>cylinder(x0+i*space,64,size,168,id,backups[id].files,i===k-1)).join('');const active=k?backups[ids[k-1]]:null;const result=restore(ids.slice(0,k));if(active){const x=x0+(k-1)*space+size/2;s+=edge(`M${x} 240 V280 H${w-48}`,'spielt ein',w-144,260,true);}s+=nodes;const filexs=[24,304,584,864];Object.keys(DATA.names).forEach((f,i)=>{const x=filexs[i];s+=rect(x,304,224,80,active&&active.files[f]?'hot':'shape');s+=text(x+16,336,DATA.names[f]);s+=text(x+16,368,result[f]?'Version '+result[f]:'noch nicht vorhanden',result[f]?'':'minor');});s+=text(24,424,k===0?'Ziel: leer. Wähle die erste Kopie.':k===ids.length?'Zielzustand vollständig wiederhergestellt.':'Unveränderte Dateien bleiben erhalten.','minor');return svg(s,w,448,'Rücksicherung: '+ids.slice(0,k).join(', ')+'; Ziel '+versionText(result));}
function simpleRestoreFigure(ids,result,label,unknown=false){let s='';for(let i=0;i<ids.length-1;i++)s+=edge(`M${200+i*240} 152 H${248+i*240}`,'folgt',224+i*240,24);ids.forEach((id,i)=>{s+=cylinder(24+i*240,64,176,176,id,backups[id].files,i===ids.length-1);});s+=text(24,312,label,'heading');Object.keys(DATA.names).forEach((f,i)=>{const x=24+(i%2)*352,y=344+Math.floor(i/2)*80;s+=rect(x,y,320,64,unknown||result[f]?'shape':'shape dash');s+=text(x+16,y+40,DATA.names[f]+' · '+(unknown?'?':result[f]?'v'+result[f]:'fehlt'));});return svg(s,744,528,unknown?'Kopierfolge; Ergebnis selbst bestimmen':'Gegebene Wiederherstellung und Ergebnis '+versionText(result));}
function exerciseScene(kind){let s='';if(kind==='contentsI'||kind==='contentsD'){const type=kind==='contentsI'?'I':'D',ref=type==='I'?1:0;s+=edge('M344 184 H376','vergleicht',360,56);s+=text(24,40,'Vergleich: '+DATA.days[ref]+' mit Mi','heading');const labels=[DATA.days[ref], 'Mi'];[snapshots[ref],snapshots[2]].forEach((files,j)=>{s+=rect(24+j*368,72,320,200);s+=text(40+j*368,104,labels[j],'heading');Object.entries(files).forEach(([f,v],i)=>s+=text(40+j*368,144+i*32,f+v+'   '+DATA.names[f],'code'));});s+=cylinder(240,328,224,128,type+'Mi',{},true);s+=text(24,312,'Welche Dateien kommen in die Kopie?');return svg(s,744,472,'Dateizustände zum Bestimmen der Mittwochssicherung');}if(kind==='gap'){return simpleRestoreFigure(['FMo','IDi','IDo'],restore(['FMo','IDi','IDo']),'IMi fehlt: Ergebnis selbst bestimmen',true);}if(kind==='order'){return simpleRestoreFigure(['DDo','FMo'],restore(['DDo','FMo']),'FMo zuletzt: Ergebnis selbst bestimmen',true);}const variant=kind==='newbase';if(variant)return simpleRestoreFigure(['FDo','IFr'],restore(['FDo','IFr']),'Ziel Fr: Welche Reihe ist nötig?',true);const ids=variant?['FDo','IFr']:kind==='seqD'?['FMo','DDi','DMi','DDo']:['FMo','IDi','IMi','IDo'];ids.forEach((id,i)=>{const x=24+(i%2)*368,y=48+Math.floor(i/2)*224;s+=cylinder(x,y,304,168,id,backups[id].files,false);});s+=text(24,488,variant?'Neue Vollsicherung Do · Fr ändert nur B.':'Vorhandene Kopien · Ziel: Do, 18 Uhr','minor');return svg(s,744,512,'Verfügbare Sicherungskopien für die Wiederherstellungsaufgabe');}

function normSeq(value){return value.trim().split(/[\s,;→>+\/\-]+/).filter(Boolean).map(t=>Object.keys(backups).find(id=>id.toLowerCase()===t.toLowerCase())||t);}
function normFiles(value){return value.trim().toUpperCase().split(/[\s,;·+\/]+/).filter(Boolean);}
function evaluate(ex,id,value){const f=exercises[ex].fields.find(f=>f.id===id),expected=f.expected();if(!value.trim())return {ok:false,text:'Noch leer. Trage zuerst eine Antwort ein.'};if(f.type==='files'){const got=normFiles(value),missing=expected.filter(v=>!got.includes(v)),extra=got.filter(v=>!expected.includes(v));const duplicates=new Set(got).size!==got.length;return {ok:!missing.length&&!extra.length&&!duplicates,text:missing.length||extra.length||duplicates?[missing.length?'Fehlt: '+missing.join(', ')+'.':'',extra.length?'Nicht enthalten: '+extra.join(', ')+'.':'',duplicates?'Versionen nicht doppelt angeben.':'',f.why].filter(Boolean).join(' '):'Richtig: genau die seit der Bezugskopie geänderten Dateien.'};}if(f.type==='sequence'){const got=normSeq(value),ok=JSON.stringify(got)===JSON.stringify(expected);if(ok)return {ok:true,text:'Richtig: vollständiger Zielzustand mit der kürzesten Kopierfolge.'};const result=restore(got),target=restore(expected),bad=Object.keys(target).filter(k=>target[k]!==result[k]).map(k=>k+': '+(result[k]?'v'+result[k]:'fehlt')+' statt v'+target[k]);const first=got.findIndex((v,i)=>v!==expected[i]);return {ok:false,text:bad.length?'Ziel verfehlt. '+bad.join('; ')+'. '+f.why:'Zielinhalt allein genügt nicht: Nutze die kürzeste Folge in Basisreihenfolge. '+(first>=0?'Prüfe Position '+(first+1)+'.':'')+' '+f.why};}return {ok:value===expected,text:value===expected?'Richtig. '+f.why:'Prüfe die Beziehung: '+f.why};}
function aidName(id){return state.aids[id]==='solution'?'Lösung gesehen':state.aids[id]==='hint'?'Hinweis genutzt':'ohne Hilfe';}
function fieldMarkup(ex,f){const key=ex+':'+f.id,v=state.answers[key]||'',chk=state.checked[key],feed=chk?evaluate(ex,f.id,v):null;const control=f.type==='select'?`<select id="${key}" data-answer="${key}"><option value="">Bitte wählen</option>${f.options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="${key}" data-answer="${key}" value="${E(v)}" autocomplete="off" spellcheck="false">`;return `<div class="field"><label for="${key}">${f.label}</label><div class="fieldrow">${control}<button data-check="${key}">Prüfen</button></div><p class="feedback ${feed?(feed.ok?'good':'bad'):''}" id="feedback-${key}">${feed?E(feed.text):'Noch nicht geprüft.'}</p></div>`;}

 {chapter:0,title:'Vollsicherung: Jeder Tag steht für sich',lead:'Eine Vollsicherung enthält den gesamten ausgewählten Datenbestand zu diesem Zeitpunkt. Für Donnerstag reicht FDo allein. Die vorhandenen Dateien werden auch dann kopiert, wenn sie unverändert sind.',html:()=>fig(strategyFigure('voll'),'FDo enthält den vollständigen Donnerstagstand, einschließlich des unveränderten Logos.'),es:'Una copia completa guarda todos los archivos seleccionados en ese momento. FDo basta para recuperar el jueves: A3, B2, C1 y D1. También vuelve a guardar el logo, aunque no cambie.'},
 {chapter:0,title:'Inkrementell: Bezug ist der vorherige gesicherte Zustand',lead:'Nach FMo enthält jede inkrementelle Kopie nur Änderungen seit der vorherigen Sicherung dieser Reihe. IMi enthält B2 und die neue Datei D1. IDo enthält nur A3.',html:()=>fig(strategyFigure('inkrementell'),'FMo bildet die Basis; jedes Inkrement ergänzt den vorherigen Stand.'),es:'En esta serie, el primer incremento se refiere a la completa. Los siguientes se refieren al incremento anterior. IMi guarda B2 y el archivo nuevo D1. IDo guarda solo A3: no vuelve a incluir las modificaciones del miércoles.'},
 {chapter:0,title:'Differenziell: Der Bezug bleibt die letzte Vollsicherung',lead:'Jede Differenz enthält Änderungen seit FMo. A2 erscheint deshalb auch in DMi. DDo enthält A3, B2 und D1. Das unveränderte C1 liegt weiterhin nur in FMo.',html:()=>fig(strategyFigure('differenziell'),'DDo ergänzt FMo; ältere Differenzen sind für diesen Zielzustand unnötig.'),es:'Todas las diferenciales comparan con la última completa de su serie. DMi vuelve a guardar A2, aunque el miércoles no cambie. DDo contiene A3, B2 y D1. El logo C1 se obtiene de FMo, por eso DDo sola no basta en un destino vacío.'},
 {chapter:0,title:'Die Bezugskopie bestimmt die Abhängigkeit',lead:'Verfolge die Ergänzungen vom Ziel zurück zur Basis. Inkrementell brauchst du die ganze Kette. Differenziell brauchst du die vollständige Basis und die zum Ziel passende Differenz. Die Pfeile zeigen die Ergänzungsrichtung.',html:()=>fig(relationsFigure(),'Zum Einspielen gilt: erst die Basis, dann ihre Ergänzungen.'),es:'La cadena incremental necesita la completa y todos los incrementos hasta el día deseado, en orden. La diferencial necesita la completa y la diferencial del día deseado. Las flechas muestran cómo las copias se complementan. Para leer dependencias, recorre la cadena desde el objetivo hacia la base.'},
 {chapter:0,title:'Wiederholte Änderungen vergrößern nicht immer die Differenz',lead:'Die Balken zählen ganze Dateiversionen. DMi und DDo sind gleich groß: A3 ersetzt A2 innerhalb der späteren Kopie. Differenzielle Datenmengen können wachsen; sie müssen nicht täglich größer werden.',html:()=>fig(volumeFigure(),'Gleiche Daten, gleicher Maßstab: 1 MB pro gesicherter Dateiversion.'),es:'Estas barras representan el volumen de cada copia, no el espacio total acumulado. La diferencial del miércoles y la del jueves tienen tres archivos cada una. A3 sustituye a A2 en DDo; no se guardan ambas versiones en esa copia. El tamaño diferencial puede crecer, pero no necesariamente crece cada día.'},
 {chapter:1,title:'Inkrementell wiederherstellen: Keine Kopie überspringen',lead:'Spiele jede Kopie bewusst ein. Beobachte, welche Dateien ersetzt werden und welche erhalten bleiben. Der letzte Schritt muss den Donnerstagstand ergeben.',html:()=>stepHTML('inkrementell'),es:'Empieza por FMo. IDi sustituye A1 por A2. IMi sustituye B1 por B2 y añade D1. IDo sustituye A2 por A3. C1 permanece desde la completa. Cada paso se activa manualmente.'},
 {chapter:1,title:'Differenziell wiederherstellen: Basis, dann Zielkopie',lead:'FMo liefert auch unveränderte Dateien. DDo ersetzt A und B und ergänzt D. Auf einem leeren Ziel braucht man FMo UND DDo, in dieser Reihenfolge.',html:()=>stepHTML('differenziell'),es:'Primero se restaura FMo; después DDo sustituye A y B y añade D. El logo C1 permanece desde FMo. La frase del libro que permite completa «o» diferencial es una errata para este caso: hacen falta ambas.'},
 {chapter:1,title:'Eine Lücke bleibt sichtbar, auch wenn die letzte Kopie intakt ist',lead:'Ohne IMi fehlen seine Änderungen. IDo kann sie nicht nachliefern. Nach FMo, IDi und IDo ist A aktuell, B veraltet und D fehlt. C bleibt korrekt.',html:()=>fig(brokenFigure(),'Gestrichelter Rand = fehlt oder stimmt nicht. Versionen machen den Fehler ohne Farbcodes sichtbar.'),es:'Si falta IMi, IDo no recupera sus datos porque contiene solo A3. Kunden.csv queda en B1 en vez de B2 y angebot.pdf falta por completo. El logo está correcto. Hay que conseguir IMi intacta o una serie alternativa completa y comprobar la recuperación.'},
 ...Object.keys(exercises).map(id=>({chapter:2,title:exercises[id].title,lead:exercises[id].lead,html:()=>exerciseHTML(id),exercise:id,es:{contentsI:'Compara martes con miércoles. El corrector comprueba por separado la copia de referencia y las versiones guardadas. El orden de las versiones no importa; no puede faltar ni sobrar ninguna.',contentsD:'Aquí cambia la referencia: compara miércoles con lunes. Escribe la referencia y las versiones guardadas. La ayuda y la solución se consultan por separado.',seqI:'Escribe la secuencia mínima de copias para el jueves en un destino vacío. Se aceptan IDs sin distinguir mayúsculas, separados por espacios, comas o flechas. El orden sí importa.',seqD:'Busca la secuencia mínima diferencial para recuperar el jueves. La copia que contiene las modificaciones necesita su base para los archivos sin cambios.',gap:'Indica el contenido real al omitir IMi. No se pregunta lo que debería haber, sino qué versiones quedan al aplicar esas tres copias.',order:'Se aplica primero DDo y luego FMo. Nuestra operación sustituye archivos presentes en la copia y conserva los demás. La completa aplicada al final puede devolver archivos a versiones antiguas.',newbase:'El jueves se crea una nueva completa. El incremento del viernes pertenece a esa base. La cadena del lunes ya no es necesaria para la secuencia mínima.'}[id]})),
 ...Object.keys(written).flatMap(id=>[{chapter:3,title:written[id].title,lead:written[id].context,html:()=>writtenHTML(id),written:id,es:'Escribe la explicación en alemán. La página siguiente permite compararla con criterios y con el modelo. Las respuestas abiertas no se puntúan automáticamente. La ayuda utilizada se registra.'},{chapter:3,title:'Vergleichen: '+written[id].title,lead:written[id].label+' · '+written[id].points,html:()=>writtenCompareHTML(id),compare:id,es:'Compara tu respuesta guardada con los criterios. Marca solo lo que realmente explicaste. Puedes consultar la pista y el modelo por separado. Para cambiar la respuesta, usa Antwort bearbeiten. No se calcula una nota.'}]),
 {chapter:3,title:'Die differentielle Wiederherstellung braucht beide Kopien',lead:'Lehrbuch und Hersteller stützen das Modell. Die Prüfungsaufgabe ist offiziell IHK.',html:()=>`<div class="split"><figure class="fullfigure"><div class="stage">${simpleRestoreFigure(['FMo','DDo'],restore(seq('differenziell',3)),'Basis zuerst, danach Zielkopie')}</div><figcaption>Errata: FMo UND DDo, Basis zuerst. C1 stammt aus FMo.</figcaption></figure><div class="work"><h2>Nachlesen</h2><p>Lehrbuch (nicht IHK): 03b_Grundstufe_LF3-5_2020.pdf, §3.8.2; PDF 89–92, Druck 365–368.</p><p><a href="https://www.acronis.com/de/support/documentation/ATI2024/13711.html" target="_blank" rel="noreferrer">Acronis: Methoden und Wiederherstellung</a></p><p>Offizielle Aufgabe: Sommer 2022, KAIT 4ea, 4 Punkte. Frage PDF 9; Lösung PDF 5.</p></div></div>`,es:'La referencia principal es un libro didáctico, no una fuente oficial IHK. Acronis confirma que se necesitan la completa y la diferencial correspondiente. La pregunta de Sommer 2022 KAIT 4ea y su solución sí proceden del examen oficial. Se ha corregido la errata del libro.'},
 {chapter:3,title:'Antworten mitnehmen, offene Fragen festhalten',lead:'Übungsergebnisse belegen noch keine Beherrschung. Besprecht eure Begründungen und prüft bei echten Backups die tatsächliche Wiederherstellung.',html:()=>`<div class="split"><figure class="fullfigure"><div class="stage">${summaryFigure()}</div><figcaption>Hilfe bleibt sichtbar, auch nach einer richtigen Antwort.</figcaption></figure><div class="work"><label for="endnotes">Was kann ich begründen? Was bleibt offen?</label><textarea class="notearea" id="endnotes" data-notes>${E(state.notes)}</textarea><p class="savewarn">${storeOK?'Nur lokal im Browserprofil; Browserdaten können gelöscht werden. Regelmäßig exportieren.':'Speichern blockiert. Vor dem Schließen exportieren.'}</p><button id="endexport" class="primary">Antworten und Notizen exportieren</button><p class="auditline">JSON-Download plus Text zum Kopieren.</p></div></div>`,es:'Exporta las respuestas y notas en JSON. Si se bloquea la descarga, copia el texto del cuadro de exportación. El almacenamiento local depende del perfil del navegador; al borrar sus datos se pierde el progreso. El registro de ayuda permanece aunque después respondas correctamente.'}

];
state.page=Math.max(0,Math.min(pages.length-1,Number(state.page)||0));
function render(){const p=pages[state.page];document.getElementById('main').innerHTML=`<section class="page" aria-labelledby="pagetitle"><h1 id="pagetitle">${p.title}</h1><p class="lead">${p.lead}</p><div class="body">${p.html()}</div></section>`;document.querySelector('[data-page-indicator]').textContent=`Seite ${state.page+1} / ${pages.length}`;document.getElementById('bar').style.width=(state.page+1)/pages.length*100+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuemax',pages.length);document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',state.page+1);document.querySelector('[data-nav="prev"]').disabled=state.page===0;document.querySelector('[data-nav="next"]').disabled=state.page===pages.length-1;document.querySelectorAll('[data-chapter]').forEach(b=>{b.classList.toggle('active',+b.dataset.chapter===p.chapter);b.setAttribute('aria-current',+b.dataset.chapter===p.chapter?'step':'false');});sizeSVGText();save();}
function sizeSVGText(){document.querySelectorAll('#main svg').forEach(s=>{const scale=s.getScreenCTM().a;s.querySelectorAll('text').forEach(t=>{const min=t.classList.contains('edgelabel')?12:14;const px=parseFloat(getComputedStyle(t).fontSize);if(px*scale<min)t.style.fontSize=(min/scale)+'px';});});}
window.addEventListener('resize',()=>{render();});
function go(delta){if(state.page+delta<0||state.page+delta>=pages.length)return;state.page+=delta;render();}
function setAid(id,type){if(type==='solution'||!state.aids[id])state.aids[id]=type;save();document.getElementById('aid-'+id).textContent=aidName(id);}
function exportData(){return {workshop:'Backupwerkstatt',version:1,exportedAt:new Date().toISOString(),state:clone(state),assumptions:'Ganze Dateien; keine Löschungen; getrennte Strategien; leeres Ziel; enthaltene Dateien ersetzen ältere Versionen.',exerciseResults:Object.entries(exercises).map(([id,ex])=>({id,aid:aidName(id),fields:ex.fields.map(f=>({field:f.id,answer:state.answers[id+':'+f.id]||'',checked:!!state.checked[id+':'+f.id],correct:state.checked[id+':'+f.id]?evaluate(id,f.id,state.answers[id+':'+f.id]||'').ok:null}))})),openAnswers:'Manueller Vergleich; keine automatische Punktevergabe.'};}
function download(){const str=JSON.stringify(exportData(),null,2),blob=new Blob([str],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-antworten.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openExport(){document.getElementById('exporttext').value=JSON.stringify(exportData(),null,2);document.getElementById('exportdialog').showModal();try{download();}catch(e){/* Der sichtbare Kopiertext bleibt verfügbar. */}}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav==='next'?1:-1);return;}if(b.dataset.chapter!==undefined){state.page=pages.findIndex(p=>p.chapter===+b.dataset.chapter);render();return;}if(b.dataset.close){document.getElementById(b.dataset.close).close();return;}if(b.id==='spanish'){document.getElementById('escontent').textContent=pages[state.page].es;document.getElementById('esdialog').showModal();return;}if(b.id==='notes'){document.getElementById('globalnotes').value=state.notes;save();document.getElementById('notedialog').showModal();return;}if(['export','endexport'].includes(b.id)){openExport();return;}if(b.id==='downloadagain'){download();return;}if(b.dataset.step){const key=b.dataset.stepkey,max=key.endsWith('inkrementell')?seq('inkrementell',3).length:seq('differenziell',3).length;state.steps[key]=Math.max(0,Math.min(max,(state.steps[key]||0)+(b.dataset.step==='next'?1:-1)));const direction=b.dataset.step;render();const focusStep=document.querySelector('[data-step="'+direction+'"]');if(focusStep&&!focusStep.disabled)focusStep.focus();else document.querySelector('[data-step="prev"]')?.focus();return;}if(b.dataset.check){const [ex,id]=b.dataset.check.split(':'),key=ex+':'+id;state.checked[key]=true;const result=evaluate(ex,id,state.answers[key]||'');const f=document.getElementById('feedback-'+key);f.textContent=result.text;f.className='feedback '+(result.ok?'good':'bad');save();return;}if(b.dataset.help){const id=b.dataset.help,ex=exercises[id]||written[id],box=document.getElementById('help-'+id);box.textContent=ex.hint;box.hidden=false;document.querySelector('[data-solution="'+id+'"]').textContent='Lösung anzeigen';setAid(id,'hint');return;}if(b.dataset.solution){const id=b.dataset.solution;if(pages[state.page].written===id){go(1);b=document.querySelector('[data-solution="'+id+'"]');}const ex=exercises[id]||written[id],box=document.getElementById('help-'+id),shown=b.textContent==='Lösung ausblenden';box.hidden=shown;if(shown){b.textContent='Lösung anzeigen';}else{box.textContent=ex.solution?ex.solution():ex.model();box.hidden=false;b.textContent='Lösung ausblenden';setAid(id,'solution');}return;}if(b.dataset.criteria){go(1);return;}if(b.dataset.edit){go(-1);return;}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.answer){state.answers[el.dataset.answer]=el.value;state.checked[el.dataset.answer]=false;const f=document.getElementById('feedback-'+el.dataset.answer);f.textContent='Antwort geändert; erneut prüfen.';f.className='feedback';}if(el.dataset.written)state.written[el.dataset.written]=el.value;if(el.id==='globalnotes'||el.dataset.notes!==undefined)state.notes=el.value;if(el.dataset.criterion)state.criteria[el.dataset.criterion]=el.checked;save();});
document.addEventListener('keydown',ev=>{if(document.querySelector('dialog[open]')||ev.altKey||ev.ctrlKey||ev.metaKey||ev.shiftKey||['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName))return;if(ev.key==='ArrowRight'){ev.preventDefault();go(1);}if(ev.key==='ArrowLeft'){ev.preventDefault();go(-1);}});
// Für nachvollziehbare Inhaltsprüfung; keine zweite Sollwertquelle im UI.
window.backupModel={DATA,snapshots,backups,restore,seq,volume};
render();
</script>
