<script>
'use strict';
const DATA=JSON.parse(document.getElementById('content-data').textContent), $=s=>document.querySelector(s), escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeName={F:'Voll',I:'Inkrementell',D:'Differenziell'};
// One model feeds materials, diagrams, the checker, and solutions.
function backup(s,type,day){const base=s.base||0, now=s.states[day],ref=type==='D'?s.states[base]:s.states[Math.max(base,day-1)];return Object.fromEntries(s.files.flatMap((f,i)=>type==='F'||day===base||now[i]!==ref[i]?[[f,now[i]]]:[]));}
function copyID(s,type,day){return day===(s.base||0)?'F'+day:type+day}
function sequence(s,type,day){const base=s.base||0;return type==='F'?['F'+day]:day===base?['F'+base]:type==='D'?['F'+base,'D'+day]:['F'+base,...Array.from({length:day-base},(_,i)=>'I'+(base+i+1))]}
function restore(s,type,order){const out={};for(const day of order){Object.assign(out,backup(s,day===(s.base||0)?'F':type,day))}return out}
function volume(s,type,day){const b=backup(s,type,day);return s.files.reduce((n,f,i)=>n+(f in b?s.sizes[i]:0),0)}
const list=b=>Object.entries(b).map(([f,v])=>f+' v'+v).join(', '),field=(label,expected,mode='text',reason='')=>({label,expected:String(expected),mode,reason});
function expected(t){const d=t.day,b=t.base||0,reason=typeName[t.type]+': '+(t.type==='D'?'Änderungen seit F'+b:t.type==='I'?'Änderungen seit der vorherigen Kopie':'alle Dateien dieses Tages');switch(t.kind){
case 'content':return[field('Dateien und Versionen',list(backup(t,t.type,d)),'set',reason)];
case 'refs':return[field('I1 bezieht sich auf','F0','id','Das erste Inkrement folgt auf F0.'),field('I3 bezieht sich auf','I2','id','I3 vergleicht mit der letzten inkrementellen Sicherung.'),field('D3 bezieht sich auf','F0','id','Differenziell bleibt der Bezug die Vollsicherung.')];
case 'versions':{let out=restore(t,'I',[0,1,2]);return t.files.map(f=>field(f+' · Version',out[f],'number','Nur F0, I1 und I2 wurden eingespielt.'))}
case 'order':return[field('Kopien in Einspielreihenfolge',sequence(t,t.type,d).join(', '),'order',t.type==='I'?'Die Basis und jede Folgesicherung bis zum Ziel sind nötig.':t.type==='D'?'Zuerst die passende Basis, dann genau das Ziel-Differenzial.':'Die vollständige Kopie des Zielzeitpunkts genügt.')];
case 'missing':{let copied=backup(t,'D',d),missing=Object.fromEntries(t.files.flatMap((f,i)=>f in copied?[]:[[f,t.states[d][i]]]));return[field('Fehlende Datei mit Version',list(missing),'set','Unveränderte Dateien fehlen auf dem leeren Ziel.'),field('Benötigte Basis','F'+b,'id','Die vollständige Basis muss zuerst eingespielt werden.')]}
case 'reachable':return[field('Letzter vollständiger Abend',DATA.days[t.missing-1],'day','Vor der verlorenen Kopie endet die lückenlose Kette.')];
case 'wrongorder':return[field(t.files[0]+' · Zielversion',restore(t,t.type,t.apply)[t.files[0]],'number','I1 überschreibt die neuere Version aus I3 mit v2.')];
case 'base':return[field('Basis für D3','F'+b,'id','Die neue Vollsicherung F2 startet den neuen Zyklus.')];
case 'size':return[field(t.type+d+' · MB',volume(t,t.type,d),'number',reason+'; jede enthaltene Datei genau einmal.')];
case 'compareSize':return[field('I3 · MB',volume(t,'I',d),'number','Nur die seit Dienstag geänderten Dateien.'),field('D3 · MB',volume(t,'D',d),'number','Alle seit F0 geänderten Dateien, jeweils aktuelle Version.')];
case 'cumulative':{let total=0;return t.volumes.map((v,i)=>field(DATA.days[i+1]+' · D'+(i+1)+' · MB',total+=v,'number','Die disjunkten Tagesmengen werden bis hier addiert.'))}
case 'total':return[field('F0 + I1 + I2 + I3 · MB',t.states.reduce((n,_,i)=>n+volume(t,i===0?'F':'I',i),0),'number','Basis plus die drei täglichen Änderungsmengen.'),field('F0 + F1 + F2 + F3 · MB',t.states.reduce((n,_,i)=>n+volume(t,'F',i),0),'number','Vier vollständige Kopien mit unveränderter Dateigröße.')];
case 'counts':return['F','I','D'].map(ty=>field(typeName[ty]+' · Kopien',sequence(t,ty,d).length,'number','Zählen Sie die minimal nötige Kopienfolge.'));
case 'examContent':return[field('I3 · Dateien und Versionen',list(backup(t,'I',d)),'set','I3 bezieht sich auf den Dienstagstand.'),field('D3 · Dateien und Versionen',list(backup(t,'D',d)),'set','D3 enthält Änderungen seit F0.')];
default:return[]}}
function tokens(v){return String(v).trim().toLowerCase().replace(/→|->|;|\n/g,',').split(',').map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean)}
function equivalent(v,f){if(!String(v).trim())return false;let a=String(v).trim(),b=f.expected;if(f.mode==='number'){return (f.label.includes('MB')?/^\d+(?:[.,]\d+)?(?:\s*MB)?$/i:/^\d+(?:[.,]\d+)?$/).test(a)&&Number(a.replace(/\s*MB$/i,'').replace(',','.'))===Number(b)}if(f.mode==='set'){let norm=x=>x.replace(/\s*(?:v|version)\s*(\d+)$/,' v$1');let aa=tokens(a).map(norm),bb=tokens(b).map(norm);return aa.length===bb.length&&new Set(aa).size===aa.length&&aa.sort().join('|')===bb.sort().join('|')}if(f.mode==='order'){return tokens(a).join('|')===tokens(b).join('|')}if(f.mode==='day'){const long={sonntag:'so',montag:'mo',dienstag:'di',mittwoch:'mi'};return(long[a.toLowerCase()]||a.toLowerCase())===b.toLowerCase()}return a.toLowerCase()===b.toLowerCase()}
const key='backupwerkstatt-v1';let state={page:0,answers:{},notes:''},storageOK=true;try{let saved=localStorage.getItem(key);if(saved){let data=JSON.parse(saved);if(data&&typeof data==='object'&&data.answers&&Number.isInteger(data.page)){state={...state,...data};state.page=Math.max(0,Math.min(33,state.page))}}}catch(e){storageOK=false}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){storageOK=false}$('#storage').textContent=storageOK?'Nur dieses Browserprofil; file:// kann flüchtig sein. Export als Datei.':'Speichern gesperrt: nur bis zum Schließen. Bitte exportieren.'}
function getAnswer(t){return state.answers[t.n]||(state.answers[t.n]={values:[],attempts:0,hint:!!t.guided,seen:false,resolved:false,first:false,reviewed:false})}
let lessonDay=3,step=0;const lessonInfo=[
 ['Einstieg','Start','Backup holt einen Datenstand zurück.'],['Verstehen','Modell','Ein eindeutiges Modell für alle Beispiele'],['Verstehen','Voll','Voll sichert den gesamten Tagesstand'],['Verstehen','Inkrement','Inkrementell schaut auf die letzte Kopie'],['Verstehen','Differenzial','Differenziell schaut immer auf die Basis'],['Verstehen','Volumen','Mehrfach ändern heißt nicht mehrfach zählen'],['Wiederherstellen','Kette','Inkrementell: die Kette nacheinander einspielen'],['Wiederherstellen','Zwei Kopien','Differenziell: Basis und Zielkopie einspielen'],['Wiederherstellen','Lücke','Eine fehlende Basis lässt Dateien fehlen']
];
function tsvg(inner,width=544,height=304,label='Backup-Material'){return `<svg class="${width>600?'wide-diagram':'compact-diagram'}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHTML(label)}"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#486070"/></marker></defs>${inner}</svg>`}
function mediaFigure(s,type,day,{broken=-1,highlight=-1}={}){
 const base=s.base||0;let edges='';
 if(type==='I')for(let i=base;i<3;i++)edges+=`<path class="edge" marker-end="url(#arrow)" d="M${72+i*136} 240V272H${72+(i+1)*136}V248"/><text class="edge-label" text-anchor="middle" x="${140+i*136}" y="304">folgt</text>`;
 if(type==='D'&&day>base){edges+=`<path class="edge" marker-end="url(#arrow)" d="M${72+base*136} 248V288H${72+day*136}V256"/><text class="edge-label" x="16" y="336">F${base} liefert die Basis für D${day}.</text>`}
 let nodes=[0,1,2,3].map(i=>{let old=i<base?{...s,base:0}:s,ty=i===base||i===0?'F':type,b=backup(old,ty,i),x=16+i*136;return `<g class="change"><text x="${x+56}" y="32" text-anchor="middle">${copyID(old,ty,i)} · ${DATA.days[i]}</text><rect x="${x}" y="72" width="112" height="176" rx="4" class="copy ${i===highlight?'hot':''}" ${i===broken?'stroke-dasharray="6 5"':''}/><ellipse cx="${x+56}" cy="72" rx="56" ry="12" fill="${i===highlight?'#b9e1d5':'#dce8f0'}" stroke="#567587" stroke-width="1.5"/>${i===broken?`<text x="${x+56}" y="152" text-anchor="middle">unlesbar</text>`:Object.entries(b).map(([f,v],j)=>`<text class="caption" x="${x+12}" y="${112+j*48}">${escapeHTML(f)}</text><text x="${x+96}" y="${136+j*48}" text-anchor="end">v${v}</text>`).join('')}</g>`}).join('');return tsvg(edges+nodes,544,type==='D'?352:320,`${typeName[type]}e Kopien: ${s.company}. Versionen je Tag.`)
}
function fileSizeFigure(t){const max=Math.max(...t.sizes);return tsvg(`<text x="24" y="24">Dateigröße und Änderungstage</text>`+t.files.map((f,i)=>{let y=72+i*80;return `<rect class="bar" x="184" y="${y-24}" width="${t.sizes[i]/max*208}" height="32" fill="#2156a5"/><text x="24" y="${y}">${escapeHTML(f)}</text><text x="416" y="${y}">${t.sizes[i]} MB</text><text class="caption" x="24" y="${y+32}">geändert: ${t.states.flatMap((v,d)=>d>0&&v[i]!==t.states[d-1][i]?[DATA.days[d]]:[]).join(', ')}</text>`}).join(''),544,280,'Dateigrößen und Änderungstage bei '+t.company)}
function assumptionFigure(day){const d=DATA.demo,items=d.files.map((f,i)=>[f,d.states[day][i]]);return tsvg(`<path class="edge" marker-end="url(#arrow)" d="M208 136H336"/><text class="edge-label" x="232" y="112">kopiert</text><rect class="copy" x="16" y="64" width="192" height="176"/><rect class="copy hot" x="336" y="64" width="192" height="176"/><text x="16" y="32">Abend ${DATA.days[day]}</text><text x="336" y="32">F${day} · Tagesstand</text>`+items.map(([f,v],i)=>`<text x="40" y="${104+i*56}">${f} v${v}</text><text class="change" x="360" y="${104+i*56}">${f} v${v}</text>`).join(''),544,272,'Dateistand am '+DATA.days[day]+' wird vollständig kopiert')}
function versionsTable(s){return `<table class="data-table"><caption>Dateistände am Abend</caption><thead><tr><th scope="col">Datei</th>${DATA.days.map(d=>`<th scope="col">${d}</th>`).join('')}</tr></thead><tbody>${s.files.map((f,i)=>`<tr><th scope="row">${escapeHTML(f)}</th>${s.states.map((v,d)=>`<td class="${d>0&&v[i]!==s.states[d-1][i]?'changed':''}">v${v[i]}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function bars(values,labels,title,unit='MB',width=544,height=280){let max=Math.max(...values),n=values.length,slot=(width-80)/n;return tsvg(`<text x="24" y="24">${escapeHTML(title)}</text><text class="caption" x="${width>600?width-352:24}" y="52">0 bis ${max} ${unit} · gemeinsame Skala</text><path class="edge" d="M32 72V232H${width-24}"/>`+values.map((v,i)=>{let x=64+slot*i,h=v/max*128;return `<rect class="bar" x="${x}" y="${224-h}" width="${Math.min(72,slot-32)}" height="${h}" fill="${i===n-1?'#006f67':'#2156a5'}"/><text x="${x}" y="${204-h}">${v} ${unit}</text><text x="${x}" y="264">${escapeHTML(labels[i])}</text>`}).join(''),width,height,title)}
function taskMaterial(t){if(t.kind==='cumulative')return `<figure class="task-figure">${bars(t.volumes,['Mo','Di','Mi'],'Neue Dateien pro Tag')}<figcaption>Fig. ${t.n+9}: Disjunkte Dateimengen; keine Datei wird erneut geändert.</figcaption></figure>`;if(t.kind==='written'&&t.official)return `<figure class="task-figure">${tsvg('<text x="24" y="32">Bezug der Tagessicherung</text><path class="edge" marker-end="url(#arrow)" d="M136 120H256"/><path class="edge" marker-end="url(#arrow)" d="M360 120H480"/><text class="edge-label" x="168" y="96">vergleicht</text><text class="edge-label" x="392" y="96">vergleicht</text><rect class="copy" x="24" y="104" width="112" height="128"/><rect class="copy" x="256" y="104" width="104" height="128"/><rect class="copy" x="480" y="104" width="48" height="128"/><text x="48" y="160">Vollbackup</text><text x="280" y="160">Tag 1</text><text x="488" y="160">…</text><text x="24" y="280">Welche Referenz bleibt fest, welche wandert?</text>')}<figcaption>Fig. 33: Erläutern Sie den Bezug, nicht nur die gespeicherte Menge.</figcaption></figure>`;
if(['order','reachable','missing','base'].includes(t.kind))return `<figure class="task-figure">${mediaFigure(t,t.type,t.day,{broken:t.kind==='reachable'?t.missing:-1})}<figcaption>Fig. ${t.n+9}: Verfügbare Kopien. ${t.base?'F2 startet den neuen Zyklus.':'F0 ist die Basis.'} Ziel: ${DATA.days[t.day]}.</figcaption></figure>`;
if(['size','compareSize','total'].includes(t.kind))return `<figure class="task-figure">${fileSizeFigure(t)}<figcaption>Fig. ${t.n+9}: Konstant große Dateien; Balken beginnen bei null. Jede enthaltene Datei einmal.</figcaption></figure>`;
if(t.kind==='counts')return `<figure class="task-figure">${mediaFigure(t,'I',t.day)}<figcaption>Fig. ${t.n+9}: Alternative F-, I- und D-Strategien nutzen denselben Tagesverlauf.</figcaption></figure>`;
return `<figure class="task-figure">${versionsTable(t)}${t.kind==='wrongorder'?`<div class="tag error">Einspielprotokoll: F0, I3, I1, I2</div>`:t.kind==='versions'?'<div class="tag restore">Einspielprotokoll: F0, I1, I2</div>':t.guided?'<div class="tag">Beispiel: F2 enthält katalog.pdf v2, lager.csv v2, preis.txt v1.</div>':'<p class="support">v = Version; hervorgehobene Zellen = an diesem Tag geändert.</p>'}<figcaption>Fig. ${t.n+9}: ${t.company} · ${t.base?'Neue Vollsicherung am Dienstag.':'Vollbasis am Sonntag.'}</figcaption></figure>`}
function heading(n,title,tags){return `<header class="heading"><span class="num">${n}</span><div class="title"><div class="tags">${tags}</div><h1 id="pageTitle">${escapeHTML(title)}</h1></div><button class="lang" id="spanishButton" lang="es">Español</button></header>`}

function refreshNav(){const letters=['E','M','V','I','D','Σ','K','Z','!'];$('#chapterNav').innerHTML=navGroups.map(([name,ids])=>`<section><h3>${name}</h3><div class="navgrid">${ids.map(i=>{let t=i>=9&&i<33?DATA.tasks[i-9]:null,a=t?getAnswer(t):null,symbol=a?(a.seen?'◇':a.hint?'△':a.resolved?'✓':'○'):'',cl=(a?.seen?'seen':a?.hint?'hinted':a?.resolved?'solved':'')+(i===state.page?' current':'');return `<button data-page="${i}" class="${cl}" ${i===state.page?'aria-current="page"':''} aria-label="${escapeHTML(t?'Aufgabe '+t.n+': '+t.title+' · '+statusText(a):i===33?'Quellen':lessonInfo[i][2])}">${t?t.n:i===33?'Q':letters[i]}${t?`<span class="state" aria-hidden="true">${symbol}</span>`:''}</button>`}).join('')}</div></section>`).join('');document.querySelectorAll('[data-page]').forEach(btn=>btn.onclick=()=>{state.page=Number(btn.dataset.page);render()})}
function refreshStats(){let vals=Object.values(state.answers),done=vals.filter(a=>a.resolved).length,first=vals.filter(a=>a.first).length;$('#resolved').textContent=done;$('#first').textContent=first;$('#pending').textContent=24-done;$('#resolvedMeter').value=done;$('#firstMeter').value=first;$('#pendingMeter').value=24-done;$('#sideBar').style.width=done/24*100+'%'}
$('[data-nav="prev"]').onclick=()=>{if(state.page>0){state.page--;render()}};$('[data-nav="next"]').onclick=()=>{if(state.page<33){state.page++;render()}};document.addEventListener('keydown',e=>{if($('#dialog').open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&state.page<33){state.page++;render();e.preventDefault()}if(e.key==='ArrowLeft'&&state.page>0){state.page--;render();e.preventDefault()}});$('#closeDialog').onclick=()=>$('#dialog').close();$('#notesButton').onclick=showNotes;$('#exportButton').onclick=()=>{let blob=new Blob([JSON.stringify({workshop:'Backupwerkstatt',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backupwerkstatt-antworten.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script>
