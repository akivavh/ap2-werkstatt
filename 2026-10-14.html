<script id="content-data" type="application/json">{
  "lessons": [
    {
      "short": {
        "es": "Para qué",
        "de": "Wozu?"
      },
      "title": {
        "es": "Guardar no basta: necesitas poder volver.",
        "de": "Speichern reicht nicht: Du musst zurückkommen können."
      },
      "lead": {
        "es": "Una copia de seguridad conserva datos para recuperarlos cuando los originales ya no sirven.",
        "de": "Eine Datensicherung bewahrt Daten auf, damit du sie wiederherstellen kannst, wenn die Originale nicht mehr nutzbar sind."
      },
      "paras": [
        {
          "es": "Guardar un archivo escribe su estado actual en el disco de trabajo. Si lo sobrescribes por error o ese disco falla, guardar no te devuelve la versión anterior. Un backup es una copia conservada por separado. Restaurar significa recuperar los datos desde esa copia.",
          "de": "Beim Speichern schreibst du den aktuellen Zustand auf das Arbeitslaufwerk. Wenn du eine Datei versehentlich überschreibst oder das Laufwerk ausfällt, bringt Speichern die alte Version nicht zurück. Ein Backup ist eine getrennt aufbewahrte Kopie. Wiederherstellen bedeutet, Daten aus dieser Kopie zurückzuholen."
        },
        {
          "es": "Ejemplo: el lunes guardas una oferta correcta y la copias a un soporte independiente. El martes sobrescribes el original con una oferta equivocada. La copia del lunes sigue teniendo la oferta correcta. Una sincronización que propaga el error no basta para conservar ese estado anterior.",
          "de": "Beispiel: Am Montag speicherst du ein richtiges Angebot und sicherst es auf einem unabhängigen Medium. Am Dienstag überschreibst du das Original mit einem falschen Angebot. Das Montagsbackup enthält weiterhin die richtige Version. Eine Synchronisation, die den Fehler übernimmt, erhält diesen alten Zustand nicht."
        },
        {
          "es": "Hoy aprenderás qué guarda cada método y cómo reconstruir un estado concreto. En la realidad también hay que probar la restauración: un mensaje de «backup correcto» por sí solo no demuestra que los datos se puedan usar.",
          "de": "Heute lernst du, was die einzelnen Verfahren sichern und wie du einen bestimmten Zustand rekonstruierst. In der Praxis musst du auch die Wiederherstellung testen: Eine Meldung „Backup erfolgreich“ allein beweist nicht, dass die Daten nutzbar sind."
        }
      ],
      "visual": "purpose",
      "caption": {
        "es": "Fig. 1 · La copia separada conserva la versión anterior al error.",
        "de": "Abb. 1 · Die getrennte Kopie erhält die Version vor dem Fehler."
      },
      "ask": {
        "es": "Antes de seguir: ¿por qué guardar de nuevo el archivo equivocado no recupera el correcto?",
        "de": "Vor dem Weitergehen: Warum stellt erneutes Speichern der falschen Datei die richtige Version nicht wieder her?"
      },
      "answer": {
        "es": "Porque guardas el estado equivocado actual. Para volver necesitas una versión anterior que se haya conservado.",
        "de": "Du speicherst den aktuellen falschen Zustand. Zum Zurückgehen brauchst du eine zuvor aufbewahrte Version."
      }
    },
    {
      "short": {
        "es": "Estados",
        "de": "Zustände"
      },
      "title": {
        "es": "El nombre sigue igual; el contenido cambia.",
        "de": "Der Name bleibt gleich; der Inhalt ändert sich."
      },
      "lead": {
        "es": "Un estado es el conjunto de archivos y versiones que existe en un momento.",
        "de": "Ein Zustand ist die Menge der Dateien und Versionen zu einem bestimmten Zeitpunkt."
      },
      "paras": [
        {
          "es": "Usaremos tres archivos: A = oferta, B = lista de productos y C = plano. A1 es la primera versión de A; A2 es su versión modificada. El número identifica contenido, no tamaño ni cantidad de archivos. El miércoles aparece D1, un archivo nuevo.",
          "de": "Wir verwenden drei Dateien: A = Angebot, B = Produktliste und C = Plan. A1 ist die erste Version von A; A2 ist die geänderte Version. Die Zahl bezeichnet den Inhalt, nicht die Größe oder die Anzahl der Dateien. Am Mittwoch kommt die neue Datei D1 hinzu."
        },

function tokens(v){return String(v).trim().toUpperCase().replace(/->|=>|→|⇒|\+|;|\|/g,',').split(/[\s,]+/).filter(Boolean)}
function evaluateField(f,value){
 const v=String(value??'').trim();if(!v)return 'blank';
 if(f.kind==='number'){const n=v.replace(',','.');return /^\d+(\.\d+)?$/.test(n)&&Number(n)===Number(f.answer)?'correct':'wrong'}
 if(f.kind==='boolean'){const n=v.toLowerCase();return ['no','nein','false'].includes(n)?'correct':'wrong'}
 if(f.kind==='sequence'){const a=tokens(v).map(x=>/^D\d+$/.test(x)?x.replace(/^D/,'Δ'):x),b=tokens(f.answer);return JSON.stringify(a)===JSON.stringify(b)?'correct':'wrong'}
 if(f.answer==='∅'){return ['∅','-','keine','leer','fehlt','ausente','ninguna','ninguno','none'].includes(v.toLowerCase())?'correct':'wrong'}

function relationFeedback(f,value){
 let message=tx(f.why);
 if(f.kind==='sequence'||f.kind==='set'&&f.answer!=='∅'){
  const seq=f.kind==='sequence',a=tokens(value).map(x=>seq&&/^D\d+$/.test(x)?x.replace(/^D/,'Δ'):x),b=tokens(f.answer);
  const missing=b.filter(x=>!a.includes(x)),extra=[...new Set(a.filter(x=>!b.includes(x)))],duplicate=a.some((x,i)=>a.indexOf(x)!==i),parts=[];
  if(missing.length)parts.push(tx(L('Falta','Es fehlt'))+': '+missing.join(', '));
  if(extra.length)parts.push(tx(L('No corresponde al objetivo','Gehört nicht zum Ziel'))+': '+extra.join(', '));
  if(duplicate)parts.push(tx(L('Hay un elemento repetido','Ein Element ist doppelt aufgeführt')));
  if(seq&&!missing.length&&!extra.length&&!duplicate){const k=a.findIndex((x,i)=>i>0&&b.indexOf(x)<b.indexOf(a[i-1]));if(k>0)parts.push(tx(L('Se invierte el orden de','Die Reihenfolge ist vertauscht bei'))+': '+a[k-1]+' / '+a[k]);}
  if(parts.length)message=parts.join(' · ')+'. '+message;
 }
 return message;
}

 if(q.id===13)return `<div class="chart-material"><h2>${E(tx(L('Copia diaria incremental · datos nuevos (GB)','Inkrementelle Tagessicherung · neue Daten (GB)')))}</h2><figure><div class="column-chart" role="group" aria-label="${E(tx(q.headers[1]))}"><div class="column-axis"><span>8</span><span>4</span><span>0 GB</span></div>${q.rows.map(r=>`<div class="column-slot"><span class="column-value">${r[1]}</span><div class="column-bar" style="height:${r[1]/8*128}px" aria-hidden="true"></div><span class="column-label">${E(dayValue(r[0]))}</span></div>`).join('')}</div><figcaption class="entry-instruction">${E(tx(L('Escala de 0 a 8 GB. Archivos nuevos distintos cada día.','Skala von 0 bis 8 GB. Täglich unterschiedliche neue Dateien.')))}</figcaption></figure></div>`;
 if(q.material==='bars')return `<div class="chart-material"><h2>${E(tx(q.headers[1]))}</h2>${bars(q.rows.map(r=>dayValue(r[0])),q.rows.map(r=>r[1]),Math.max(...q.rows.map(r=>r[1])))}<p class="entry-instruction">${E(tx(L('Escala común desde 0 GB; cada etiqueta da el valor exacto.','Gemeinsame Skala ab 0 GB; die Beschriftung zeigt den genauen Wert.')))}</p></div>`;
 if(q.material==='log')return `<div class="log-material" role="group" aria-label="${E(tx(UI.material))}">${q.rows.map(r=>r.map(v=>dayValue(v)).join('  |  ')).map(E).join('\n')}</div>`;
 return `<table><thead><tr>${q.headers.map(h=>`<th scope="col">${E(tx(h))}</th>`).join('')}</tr></thead><tbody>${q.rows.map(r=>`<tr>${r.map((v,i)=>`<${i===0?'th scope="row"':'td'}>${E(dayValue(v))}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function fieldInput(q,f,i){
 const v=answers(q)[i]||'',id='answer-'+i;
 if(f.kind==='written')return `<label for="${id}">${E(tx(f.label))}</label><textarea id="${id}" data-field="${i}" lang="de" spellcheck="true">${E(v)}</textarea>`;
 if(f.kind==='boolean')return `<select id="${id}" data-field="${i}" aria-labelledby="label-${i}"><option value="">${E(tx(UI.choose))}</option><option value="yes" ${v==='yes'?'selected':''}>${E(tx(UI.yes))}</option><option value="no" ${v==='no'?'selected':''}>${E(tx(UI.no))}</option></select>`;
 return `<input type="text" id="${id}" data-field="${i}" aria-labelledby="label-${i}" autocomplete="off" spellcheck="false" ${f.kind==='number'?'inputmode="decimal"':''} value="${E(v)}">`;
}
function renderTask(q){
 const m=meta(q),points=q.fields.reduce((a,f)=>a+f.points,0),written=q.fields[0].kind==='written',inSession=[1,2,5,9,11,13].includes(q.id);
 $('page').innerHTML=`<div class="page-head"><div class="kicker">${E(tx(UI.taskLabel))} ${String(q.id).padStart(2,'0')} · ${E(tx(inSession?UI.session:UI.extra))}</div><div class="exam-meta"><div><h1>${E(tx(q.title))}</h1><p style="margin-top:.5rem"><span class="badge">eigene Aufgabe, nicht offiziell IHK</span></p></div><p class="points">${points} ${E(tx(UI.points))}</p></div><p class="scenario"><strong>${E(q.company)}.</strong> ${E(tx(q.scenario))}</p></div><section class="sheet" aria-label="${E(tx(UI.material))}"><div class="sheet-title"><span>${E(tx(UI.material))}</span><span class="mono">${E(tx(L('Hoja de trabajo','Arbeitsblatt')))} ${String(q.id).padStart(2,'0')}</span></div>${material(q)}<table class="answer-table"><thead><tr><th scope="col">${E(tx(UI.answers))}</th>${written?'':`<th scope="col">${E(tx(UI.answer))}</th>`}<th scope="col" class="point-cell">${E(tx(UI.points))}</th></tr></thead><tbody>${q.fields.map((f,i)=>written?`<tr class="answers-row"><td class="writing-cell">${fieldInput(q,f,i)}</td><td class="point-cell">${f.points}</td></tr>`:`<tr class="answers-row"><th scope="row" id="label-${i}">${E(tx(f.label))}</th><td class="input-cell">${fieldInput(q,f,i)}<p class="field-result" id="result-${i}" hidden></p></td><td class="point-cell">${f.points}</td></tr>`).join('')}</tbody></table></section><p class="entry-instruction">${E(tx(written?UI.writtenWarn:UI.input))}</p><div class="task-toolbar"><button id="check" class="primary">${E(tx(written?UI.compare:UI.check))}</button><button id="hint-toggle" aria-expanded="${m.hintOpen}" aria-controls="hint-panel">${E(tx(m.hintOpen?UI.hideHint:UI.hint))}</button><button id="solution-toggle" aria-expanded="${m.solutionOpen}" aria-controls="solution-panel">${E(tx(m.solutionOpen?UI.hideSolution:UI.solution))}</button></div><p class="assist-state" id="assist-state">${E(statusText(q))}</p><section id="feedback" class="feedback" role="status" hidden></section><section id="hint-panel" class="help-panel" ${m.hintOpen?'':'hidden'}><h2>${E(tx(UI.hintUsed))}</h2><p>${E(tx(q.hint))}</p></section><section id="solution-panel" class="help-panel" ${m.solutionOpen?'':'hidden'}><h2>${E(tx(UI.model))}</h2>${written?`<p class="model-de" lang="de">${E(q.model.de)}</p>${state.lang==='es'?`<p lang="es">${E(q.model.es)}</p>`:''}`:`<p>${E(tx(q.model))}</p>`}</section>`;
 if(q.id===13){$('page').querySelector('.answer-table').outerHTML=`<div class="column-output-title"><strong>${E(tx(L('Plan semanal · copia diferencial (GB)','Wochenplan · differenzielle Sicherung (GB)')))}</strong></div><div class="column-output">${q.fields.map((f,i)=>`<div><label id="label-${i}" for="answer-${i}">${E(dayValue(q.rows[i][0]))} · GB</label>${fieldInput(q,f,i)}<p class="field-result" id="result-${i}" hidden></p><p class="point-note">1 ${E(tx(L('punto','Punkt')))}</p></div>`).join('')}</div>`;}
 document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{answers(q)[el.dataset.field]=el.value;m.checked=false;if(written)m.rubric=[];persist();clearFeedback();$('assist-state').textContent=statusText(q);nav();}));
 $('check').onclick=()=>{m.attempts++;m.checked=true;persist();showFeedback(q);$('assist-state').textContent=statusText(q);nav();};
 $('hint-toggle').onclick=()=>{m.hintOpen=!m.hintOpen;if(m.hintOpen)m.hint=true;persist();renderTask(q);nav();};
 $('solution-toggle').onclick=()=>{m.solutionOpen=!m.solutionOpen;if(m.solutionOpen)m.revealed=true;persist();renderTask(q);nav();};
 if(m.checked)showFeedback(q);
}
function clearFeedback(){$('feedback').hidden=true;document.querySelectorAll('.field-result').forEach(e=>e.hidden=true)}
function showFeedback(q){
 const res=results(q),written=q.fields[0].kind==='written',m=meta(q),f=$('feedback');f.hidden=false;
 if(written){
  f.className='feedback '+(res[0]==='blank'?'blank':'');
  if(res[0]==='blank'){f.innerHTML=`<h2>${E(tx(UI.empty))}</h2><p>${E(tx(UI.blank))}</p>`;return;}
  f.innerHTML=`<h2>${E(tx(UI.criterion))}</h2><p>${E(tx(UI.writtenWarn))}</p><div class="rubric">${q.fields[0].rubric.map((r,i)=>`<div class="criterion"><input type="checkbox" id="criterion-${i}" data-criterion="${i}" ${m.rubric[i]?'checked':''}><label for="criterion-${i}">${E(tx(r.text))} (${r.points} ${E(tx(UI.points))})</label></div>`).join('')}</div><p id="manual-score" class="manual-score"></p>`;
  document.querySelectorAll('[data-criterion]').forEach(el=>el.onchange=()=>{m.rubric[Number(el.dataset.criterion)]=el.checked;persist();manualScore(q);});manualScore(q);return;
 }
 const all=res.every(r=>r==='correct'),blank=res.includes('blank');f.className='feedback '+(all?'correct':blank?'blank':'wrong');
 const score=q.fields.reduce((sum,x,i)=>sum+(res[i]==='correct'?x.points:0),0),max=q.fields.reduce((sum,x)=>sum+x.points,0);
 f.innerHTML=`<h2>${E(tx(all?UI.correct:blank?UI.blank:UI.wrong))}</h2><p>${score} / ${max} ${E(tx(UI.points))} · ${E(tx(L('puntuación de práctica','Übungsbewertung')))} · ${E(tx(m.revealed?UI.seen:m.hint?UI.hintUsed:UI.noHelp))}</p>`;
 q.fields.forEach((field,i)=>{const el=$('result-'+i);el.hidden=false;el.className='field-result '+res[i];el.textContent=tx(res[i]==='correct'?UI.good:res[i]==='blank'?UI.empty:UI.bad)+(res[i]==='wrong'?' · '+relationFeedback(field,answers(q)[i]):'');});
}
function manualScore(q){const m=meta(q),r=q.fields[0].rubric,score=r.reduce((a,x,i)=>a+(m.rubric[i]?x.points:0),0);$('manual-score').textContent=tx(L('Autoevaluación','Selbsteinschätzung'))+`: ${score} / ${q.fields[0].points} `+tx(UI.points);}
const closingCriteria=[L('Identifico el último estado disponible.','Ich benenne den letzten verfügbaren Zustand.'),L('Indico F0 → Δ2 en ese orden.','Ich nenne F0 → Δ2 in dieser Reihenfolge.'),L('Justifico la base con archivos sin cambios y la diferencial con cambios desde F0.','Ich begründe die Basis mit unveränderten Dateien und das differenzielle Backup mit Änderungen seit F0.'),L('Explico qué cambios no están guardados y propongo una prueba de restauración.','Ich erkläre ungesicherte Änderungen und schlage einen Wiederherstellungstest vor.')];
function renderClosing(){
 const count=s=>TASKS.filter(q=>taskStatus(q)===s&&q.fields[0].kind!=='written'&&(s==='seen'||meta(q).checked&&results(q).every(r=>r==='correct'))).length;
 $('page').innerHTML=`<div class="page-head"><div class="kicker">${E(tx(L('Voluntario · sin nota automática','Freiwillig · ohne automatische Note')))}</div><h1>${E(tx(L('Explica por qué tu restauración funciona.','Erkläre, warum deine Wiederherstellung funktioniert.')))}</h1><p class="lead">${E(tx(L('Escribe en alemán, sin mirar la solución. Después compara tu razonamiento.','Schreiben Sie auf Deutsch, ohne die Lösung anzusehen. Vergleichen Sie danach Ihre Begründung.')))}</p></div><div class="closing"><div><div class="prompt-box"><p>${E(tx(L('Un servidor de documentos falla el miércoles a las 09:00. F0 es la completa válida del domingo a las 22:00. Δ1 y Δ2 son diferenciales válidas sobre F0, del lunes y martes a las 22:00. Un catálogo no cambió desde el domingo. No hay otros backups ni registros adicionales.','Ein Dokumentenserver fällt am Mittwoch um 09:00 Uhr aus. F0 ist das gültige Vollbackup vom Sonntag um 22:00 Uhr. Δ1 und Δ2 sind gültige differenzielle Backups auf Basis F0, Montag und Dienstag um 22:00 Uhr. Ein Katalog blieb seit Sonntag unverändert. Es gibt keine weiteren Backups oder Zusatzprotokolle.')))}</p><p lang="de"><strong>Beschreiben und begründen Sie die Wiederherstellung des letzten verfügbaren Zustands. Welche Daten fehlen? Wie prüfen Sie das Ergebnis?</strong></p>${state.lang==='es'?'<p lang="es">Describe y justifica la restauración del último estado disponible. ¿Qué datos faltan? ¿Cómo compruebas el resultado?</p>':''}</div><label for="closing-answer" style="display:block;margin:.75rem 0 .5rem">${E(tx(L('Tu explicación en alemán','Ihre Erläuterung auf Deutsch')))}</label><textarea id="closing-answer" lang="de">${E(state.closing)}</textarea></div><div><h2>${E(tx(UI.criterion))}</h2>${closingCriteria.map((r,i)=>`<div class="criterion"><input type="checkbox" id="closing-criterion-${i}" data-closing-criterion="${i}" ${state.closingRubric[i]?'checked':''}><label for="closing-criterion-${i}">${E(tx(r))}</label></div>`).join('')}<details class="comprehension"><summary>${E(tx(UI.model))}</summary><p class="model-de" lang="de">Der letzte verfügbare Zustand ist Dienstag 22:00 Uhr. Zuerst wird F0, danach Δ2 eingespielt. F0 liefert unter anderem den unveränderten Katalog; Δ2 liefert die Änderungen seit F0. Δ1 ist nicht nötig. Ungesicherte Änderungen nach Dienstag 22:00 Uhr fehlen. Vor der Freigabe prüfe ich Dateiversionen, Integrität und das Öffnen der Dateien.</p>${state.lang==='es'?'<p>El último estado es el martes a las 22:00. Primero F0, después Δ2. F0 aporta el catálogo sin cambios; Δ2 los cambios desde F0. Δ1 no hace falta. Faltan cambios posteriores al martes 22:00. Comprueba versiones, integridad y apertura antes de usar los datos.</p>':''}</details><div class="status-grid"><div><strong>${count('correct')}</strong>${E(tx(L('correctas sin ayuda','richtig ohne Hilfe')))}</div><div><strong>${count('help')}</strong>${E(tx(L('correctas con pista','richtig mit Hinweis')))}</div><div><strong>${count('seen')}</strong>${E(tx(UI.seen))}</div></div><p class="storage">${E(tx(L('Las cifras describen tus intentos en casillas cerradas, no dominio. Las respuestas abiertas solo tienen autoevaluación. La solución vista y la pista consultada se conservan como historial.','Die Zahlen beschreiben Versuche in geschlossenen Feldern, keine Beherrschung. Offene Antworten werden nur selbst eingeschätzt. Lösungseinsicht und Hinweise bleiben als Verlauf erhalten.')))}</p></div></div>`;
 $('closing-answer').oninput=e=>{state.closing=e.target.value;state.closingRubric=[];document.querySelectorAll('[data-closing-criterion]').forEach(el=>el.checked=false);persist();};document.querySelectorAll('[data-closing-criterion]').forEach(el=>el.onchange=()=>{state.closingRubric[Number(el.dataset.closingCriterion)]=el.checked;persist();});
}
function renderSources(){
 const items=[
 [L('Libro base','Grundlage aus dem Lehrbuch'),L('IT-Berufe · Grundstufe, Lernfelder 3–5 (2020), §3.8.2, páginas impresas 365–368 (PDF 89–92). Orden: riesgo de pérdida, copia separada, medios, métodos y comprobación. Las figuras de archivos se dibujaron con datos propios. Los libros son fuentes didácticas, no soluciones oficiales IHK.','IT-Berufe · Grundstufe, Lernfelder 3–5 (2020), §3.8.2, Druckseiten 365–368 (PDF 89–92). Reihenfolge: Verlustrisiko, getrennte Sicherung, Medien, Verfahren und Prüfung. Dateigrafiken wurden mit eigenen Daten neu gezeichnet. Lehrbücher sind didaktische Quellen, keine offiziellen IHK-Lösungen.')],
 [L('Relación con los exámenes','Prüfungsbezug'),L('Sommer 2022 · KAIT 4 ea, pregunta PDF 9 y solución oficial PDF 5: referencias de incremental y diferencial. Sommer 2023 · KAIT 4 a, pregunta PDF 10: volúmenes en gráfico y plan semanal. El PDF 2023 disponible tiene respuestas manuscritas no oficiales; no se usan como solución. Todas las tareas de este taller son propias, con puntuación de práctica.','Sommer 2022 · KAIT 4 ea, Aufgaben-PDF 9 und offizielles Lösungs-PDF 5: Bezugspunkte der Verfahren. Sommer 2023 · KAIT 4 a, Aufgaben-PDF 10: Volumendiagramm und Wochenplan. Das verfügbare 2023-PDF enthält nicht offizielle handschriftliche Antworten; sie wurden nicht als Lösung verwendet. Alle Workshopaufgaben und Übungspunkte sind eigene.')],
 [L('Cómo se enseña aquí','Didaktische Umsetzung'),L('Rosenshine (2012), pp. 12–19: pasos pequeños y práctica guiada. IES (2007), recomendaciones 2–5 y 7: ejemplos resueltos, texto con gráfico, concreto antes de abstracto, recuperación y justificación. Nation (2007), pp. 1–12: comprender, escribir y trabajar expresiones alemanas. Contrato didáctico local, §§5–8: español para construir significado y alemán después.','Rosenshine (2012), S. 12–19: kleine Schritte und angeleitete Übung. IES (2007), Empfehlungen 2–5 und 7: Lösungsbeispiele, Grafik mit Text, konkret vor abstrakt, Abruf und Begründung. Nation (2007), S. 1–12: Verstehen, Schreiben und deutsche Formulierungen. Lokaler didaktischer Vertrag, §§5–8: Bedeutung auf Spanisch aufbauen, danach Deutsch.')],
 [L('Texto y gráficos','Text und Abbildungen'),L('Mayer (1999), resumen público del artículo: texto próximo a lo representado y eliminación de adornos ajenos al mecanismo. Aquí las versiones aparecen junto a sus copias; cada gráfico sostiene una sola relación. Los pasos se controlan manualmente y no hay animación decorativa.','Mayer (1999), öffentliches Artikelabstract: Text nahe der zugehörigen Darstellung, keine sachfremde Dekoration. Versionen stehen bei ihren Sicherungen; jede Grafik erklärt einen Zusammenhang. Schritte werden manuell gesteuert; keine dekorative Animation.'),'https://www.benjamins.com/catalog/dd.1.1.02may'],
 [L('Corrección técnica de la errata','Technische Korrektur der Errata'),L('El libro p. 367 dice «completa o diferencial». Se corrige a completa Y diferencial correspondiente, en ese orden, para un destino vacío. Microsoft Learn muestra ese orden en SQL Server; se usa como comprobación técnica, sin convertir este taller en una lección de bases de datos.','Das Buch S. 367 nennt Vollbackup oder differenzielles Backup. Für ein leeres Ziel gilt: Vollbackup UND zugehöriges differenzielles Backup, in dieser Reihenfolge. Microsoft Learn zeigt diese Reihenfolge für SQL Server; technische Gegenprüfung, keine Datenbanklektion.'),'https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/restore-a-differential-database-backup-sql-server?view=sql-server-ver17'],
 [L('Contraste con documentación y formación','Abgleich mit Dokumentation und Ausbildung'),L('Bacula 15.0, Backup Strategies: cadena de completa e incrementales y necesidad de conservar soportes. LinkedIn Learning, Microsoft SQL Server 2022 Essential Training, fragmento público «Create a differential backup»: completa, cambio concreto y siguiente copia. Se reutiliza esa forma de explicar, con archivos en lugar de una base SQL.','Bacula 15.0, Backup Strategies: Vollbackup mit inkrementellen Folgesicherungen und Erhalt der Medien. LinkedIn Learning, Microsoft SQL Server 2022 Essential Training, öffentlicher Ausschnitt „Create a differential backup“: Vollbackup, konkrete Änderung, nächste Sicherung. Dieses Erklärmuster wird mit Dateien statt einer SQL-Datenbank verwendet.'),'https://www.bacula.org/15.0.x-manuals/en/main/Backup_Strategies.html']
 ];
 $('page').innerHTML=`<div class="page-head"><div class="kicker">${E(tx(UI.sources))}</div><h1>${E(tx(L('Método explicado, fuentes identificadas.','Verfahren erklärt, Quellen benannt.')))}</h1><p class="lead">${E(tx(L('Este HTML funciona sin Internet. Los enlaces solo se abren si tú los eliges.','Dieses HTML funktioniert ohne Internet. Links werden nur geöffnet, wenn Sie sie auswählen.')))}</p></div><div class="source-list">${items.map(([h,p,url])=>`<section class="source-item"><h2>${E(tx(h))}</h2><p>${E(tx(p))}</p>${url?`<a href="${E(url)}" target="_blank" rel="noopener noreferrer">${E(tx(L('Consultar fuente','Quelle öffnen')))}</a>`:''}</section>`).join('')}</div><p class="storage" style="margin-top:1rem">${E(tx(UI.storageLimits))}</p><a class="study-link" href="https://www.linkedin.com/learning/microsoft-sql-server-2022-essential-training/create-a-differential-backup" target="_blank" rel="noopener noreferrer">LinkedIn Learning · Create a differential backup</a>`;
}
function render(){chrome();if(state.page<LESSONS.length)renderLesson(state.page);else if(state.page<LESSONS.length+TASKS.length)renderTask(TASKS[state.page-LESSONS.length]);else if(state.page===TOTAL-2)renderClosing();else renderSources();document.querySelectorAll('#page details').forEach(el=>{el.querySelectorAll(':scope > :not(summary)').forEach(child=>child.hidden=!el.open);el.ontoggle=()=>el.querySelectorAll(':scope > :not(summary)').forEach(child=>child.hidden=!el.open);});}

function download(content,type,name){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(tx(UI.exportOK));}

function exportText(){
 let lines=['BACKUP · RESPUESTAS / ANTWORTEN','Exportación / Export: '+new Date().toISOString(),''];
 for(const q of TASKS){lines.push(`\n${q.id}. ${tx(q.title)} · ${q.company}`,statusText(q));q.fields.forEach((f,i)=>lines.push(tx(f.label)+': '+(answers(q)[i]||'')));if(q.fields[0].kind==='written')lines.push('Autoevaluación / Selbsteinschätzung: '+JSON.stringify(meta(q).rubric));}
 lines.push('\nCierre en alemán / Abschluss auf Deutsch:\n'+state.closing,'Autoevaluación / Selbsteinschätzung: '+JSON.stringify(state.closingRubric));
 for(const [page,note]of Object.entries(state.notes))lines.push(`\nNotas / Notizen · Seite ${Number(page)+1}:\n${note}`);
 return lines.join('\n');
}

$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('Too large');const candidate=cleanState(JSON.parse(await file.text()));state=candidate;frames={};persist();$('save-dialog').close();render();$('main').scrollTop=0;toast(tx(UI.importOK));}catch(err){toast(tx(UI.importBad));}finally{e.target.value='';}};
render();
