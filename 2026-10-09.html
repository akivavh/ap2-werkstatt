<script id="content" type="application/json">{"lessons": [{"title": {"es": "Una regla se convierte en un programa", "de": "Aus einer Regel wird ein Programm"}, "body": {"es": "Una empresa registra la carga de sus servidores. Una persona podría mirar cada valor y avisar si supera un límite. Automatizar significa dar al ordenador instrucciones precisas para que haga ese trabajo con los datos disponibles. El ordenador no entiende «carga demasiado alta»: necesita saber qué valor compara, con qué límite y qué hace si se cumple la condición.\n\nUn algoritmo es una secuencia de pasos que resuelve una tarea. Primero describimos esos pasos con palabras; después podemos dibujarlos o escribirlos como código. El dibujo y el código deben representar la misma regla. En este taller aprenderás a seguir el recorrido, anotar cómo cambian los valores y completar lo que falta. No necesitas conocer programación de antemano.", "de": "Ein Unternehmen erfasst die Auslastung seiner Server. Eine Person könnte jeden Messwert ansehen und bei Überschreitung eines Grenzwerts warnen. Automatisieren bedeutet, dem Computer genaue Anweisungen für diese Arbeit mit den vorhandenen Daten zu geben. Der Computer versteht „Auslastung zu hoch“ nicht: Er muss wissen, welchen Wert er mit welchem Grenzwert vergleicht und was bei erfüllter Bedingung geschieht.\n\nEin Algorithmus ist eine Folge von Schritten zur Lösung einer Aufgabe. Zunächst beschreiben wir die Schritte in Worten; danach können wir sie zeichnen oder als Code schreiben. Zeichnung und Code müssen dieselbe Regel darstellen. In diesem Workshop lernst du, den Ablauf zu verfolgen, veränderte Werte aufzuschreiben und Lücken zu ergänzen. Programmierkenntnisse werden nicht vorausgesetzt."}, "visual": "pipeline", "question": {"es": "¿Qué le falta a «avisa si la carga es alta»?", "de": "Was fehlt bei „Warne bei hoher Auslastung“?"}, "answer": {"es": "Un límite concreto, el dato que se compara y la acción que se ejecuta. Por ejemplo: carga mayor que 85 %, emitir un aviso.", "de": "Ein konkreter Grenzwert, der zu vergleichende Wert und die auszuführende Aktion. Zum Beispiel: Auslastung größer als 85 %, Warnung ausgeben."}}, {"title": {"es": "Una variable recuerda un valor", "de": "Eine Variable speichert einen Wert"}, "body": {"es": "Para contar horas necesitamos recordar cuántas hemos contado. Una variable es un lugar de almacenamiento con un nombre: por ejemplo, anzahl. Inicializarla es darle su primer valor. Si aún no hemos contado ninguna hora, comienza en 0.\n\nEn el pseudocódigo de este taller usamos la notación de estilo C: = significa asignar, no comparar. En anzahl = anzahl + 1, primero se lee el valor antiguo a la derecha, se suma 1 y después se guarda el resultado a la izquierda. Si anzahl era 2, pasa a 3. No es una ecuación matemática. El signo + suma y el signo - resta. int declara un número entero; una instrucción termina con punto y coma. Las líneas se ejecutan de arriba abajo.", "de": "Um Stunden zu zählen, müssen wir die bisher gezählte Anzahl speichern. Eine Variable ist ein benannter Speicherplatz, zum Beispiel anzahl. Initialisieren bedeutet, ihr einen Anfangswert zu geben. Solange keine Stunde gezählt wurde, beginnt sie bei 0.\n\nIn diesem Workshop verwenden wir Pseudocode im C-Stil: = bedeutet Zuweisung, keinen Vergleich. Bei anzahl = anzahl + 1 wird zuerst rechts der alte Wert gelesen, 1 addiert und anschließend das Ergebnis links gespeichert. War anzahl vorher 2, ist der neue Wert 3. Das ist keine mathematische Gleichung. + addiert und - subtrahiert. int deklariert eine ganze Zahl; eine Anweisung endet mit einem Semikolon. Die Zeilen werden von oben nach unten ausgeführt."}, "visual": "assignment", "question": {"es": "Si anzahl vale 4 y ejecutas anzahl = anzahl + 1 dos veces, ¿cuánto vale?", "de": "anzahl ist 4. Welchen Wert hat anzahl nach zweimal anzahl = anzahl + 1?"}, "answer": {"es": "Primera instrucción: 4 + 1 = 5. Segunda: utiliza el nuevo 5, así que 5 + 1 = 6.", "de": "Erste Anweisung: 4 + 1 = 5. Zweite Anweisung: Sie verwendet den neuen Wert 5, also 5 + 1 = 6."}}, {"title": {"es": "Una condición hace una pregunta", "de": "Eine Bedingung stellt eine Frage"}, "body": {"es": "Una condición es una pregunta con resultado verdadero (true) o falso (false). La variable last guarda la carga en porcentaje. last > 85 pregunta si la carga es mayor que 85. Con 86 es verdadero; con 85 es falso. «Más de» excluye el límite. «Al menos» lo incluye: last >= 85 también acepta 85.\n\nLos signos de comparación son > mayor que, < menor que, >= mayor o igual, <= menor o igual, == igual y != distinto. Para exigir dos condiciones usamos &&, «y»: ambas deben ser verdaderas. Para aceptar una u otra usamos ||, «o»: basta con que una sea verdadera. Los paréntesis agrupan una expresión. Por ejemplo, last >= 50 && last < 70 incluye 50 y excluye 70. Antes de programar, comprueba el límite exacto y los valores a cada lado.", "de": "Eine Bedingung ist eine Frage mit dem Ergebnis wahr (true) oder falsch (false). last > 85 fragt, ob die Auslastung größer als 85 ist. Bei 86 ist das wahr; bei 85 ist es falsch. „Mehr als“ schließt den Grenzwert aus. „Mindestens“ schließt ihn ein: last >= 85 akzeptiert auch 85.\n\nVergleichszeichen: > größer, < kleiner, >= größer oder gleich, <= kleiner oder gleich, == gleich und != ungleich. Zwei Bedingungen verbinden wir mit &&, „und“: Beide müssen wahr sein. Bei ||, „oder“, genügt eine wahre Bedingung. Klammern gruppieren einen Ausdruck. Beispielsweise schließt last >= 50 && last < 70 den Wert 50 ein und 70 aus. Prüfe vor dem Programmieren den Grenzwert selbst und Werte auf beiden Seiten."}, "visual": "boundaries", "question": {"es": "¿«Más de 80» acepta 80? ¿«Al menos 80»?", "de": "Gilt „mehr als 80“ bei 80? Und „mindestens 80“?"}, "answer": {"es": "Más de 80: no. Al menos 80: sí. Los operadores son > 80 y >= 80.", "de": "Mehr als 80: nein. Mindestens 80: ja. Die Operatoren lauten > 80 und >= 80."}}, {"title": {"es": "if elige qué se ejecuta", "de": "if entscheidet, was ausgeführt wird"}, "body": {"es": "if significa «si». El ordenador comprueba lo que hay entre paréntesis. Si es verdadero, ejecuta las instrucciones del bloque entre llaves { }. Si es falso, las salta. else significa «si no»: su bloque se ejecuta cuando la condición del if es falsa. En una alternativa if/else se ejecuta exactamente uno de los dos bloques.\n\nDespués continúa con la instrucción que sigue a los dos bloques. Esto explica por qué una línea fuera de las llaves se ejecuta siempre. Los comentarios empiezan con //: explican el código y no se ejecutan. En el ejemplo la carga vale 70 y la regla exige más de 85: se ejecuta el bloque else y después se registra que la comprobación terminó. La posición de las llaves importa tanto como la condición.\n\nEn este pseudocódigo, un nombre seguido de () llama a una acción: warnen() avisa; normal() indica estado normal; protokollieren() registra la comprobación. Los nombres se mantienen iguales al cambiar de idioma.", "de": "if bedeutet „wenn“. Der Computer prüft den Ausdruck in den runden Klammern. Ist er wahr, führt er die Anweisungen im Block zwischen den geschweiften Klammern { } aus. Ist er falsch, überspringt er den Block. else bedeutet „sonst“: Dieser Block wird ausgeführt, wenn die if-Bedingung falsch ist. Bei if/else wird genau einer der beiden Blöcke ausgeführt.\n\nDanach folgt die Anweisung nach beiden Blöcken. Deshalb wird eine Zeile außerhalb der Blöcke immer ausgeführt. Kommentare beginnen mit //: Sie erläutern den Code und werden nicht ausgeführt. Im Beispiel beträgt die Last 70, die Regel verlangt mehr als 85: Der else-Block wird ausgeführt, anschließend wird das Ende der Prüfung protokolliert. Die Position der Klammern ist ebenso wichtig wie die Bedingung.\n\nIn diesem Pseudocode ruft ein Name mit () eine Aktion auf: warnen() gibt eine Warnung aus; normal() meldet den Normalzustand; protokollieren() protokolliert die Prüfung. Die Namen bleiben beim Sprachwechsel gleich."}, "visual": "if", "question": {"es": "¿Se ejecuta protokollieren() solo cuando la carga supera 85?", "de": "Wird protokollieren() nur bei einer Last über 85 ausgeführt?"}, "answer": {"es": "No. Está fuera de ambos bloques y se ejecuta después de cualquiera de las dos ramas.", "de": "Nein. Die Anweisung steht außerhalb beider Blöcke und wird nach jedem der beiden Zweige ausgeführt."}}, {"title": {"es": "Un array guarda varios valores", "de": "Ein Array speichert mehrere Werte"}, "body": {"es": "Un array es una colección de valores ordenados, cada uno en una posición numerada. Usaremos cpu = {70, 90, 85, 92}. Tiene cuatro elementos. El índice es el número de la posición y empieza en 0: cpu[0] vale 70; cpu[3] vale 92. Los corchetes [ ] permiten leer o cambiar el elemento en una posición.\n\ncpu.Length indica la cantidad de elementos, aquí 4. No es el último índice: ese es 3. Si una colección tiene n elementos, sus índices válidos van de 0 a n - 1. Por eso leer cpu[4] estaría fuera del array. i es un nombre habitual para guardar el índice actual. En cpu[i], si i vale 2, se lee el tercer elemento, 85. Esta separación entre índice y valor es la base para recorrer datos.\n\nint[] cpu declara un array de números enteros. Las llaves en {70, 90, 85, 92} delimitan sus valores iniciales.", "de": "Ein Array ist eine geordnete Sammlung von Werten an nummerierten Positionen. Wir verwenden cpu = {70, 90, 85, 92}. Es enthält vier Elemente. Der Index ist die Positionsnummer und beginnt bei 0: cpu[0] ist 70; cpu[3] ist 92. Eckige Klammern [ ] ermöglichen den Zugriff auf ein Element.\n\ncpu.Length bezeichnet die Anzahl der Elemente, hier 4. Das ist nicht der letzte Index: Dieser ist 3. Bei n Elementen sind die Indizes von 0 bis n - 1 gültig. cpu[4] läge deshalb außerhalb des Arrays. i ist ein üblicher Variablenname für den aktuellen Index. In cpu[i] wird bei i = 2 das dritte Element gelesen, also 85. Die Unterscheidung zwischen Index und Wert ist die Grundlage für das Durchlaufen von Daten.\n\nint[] cpu deklariert ein Array ganzer Zahlen. Die Klammern in {70, 90, 85, 92} begrenzen seine Anfangswerte."}, "visual": "array", "question": {"es": "Un array tiene seis elementos. ¿Cuáles son el primer y el último índice?", "de": "Ein Array enthält sechs Elemente. Wie lauten erster und letzter Index?"}, "answer": {"es": "0 y 5. Los seis índices son 0, 1, 2, 3, 4 y 5.", "de": "0 und 5. Die sechs Indizes sind 0, 1, 2, 3, 4 und 5."}}, {"title": {"es": "while vuelve a comprobar", "de": "while prüft erneut"}, "body": {"es": "Una repetición evita escribir la misma instrucción muchas veces. while significa «mientras»: comprueba una condición antes de cada vuelta. Si es verdadera, ejecuta el cuerpo y vuelve a comprobar. Si es falsa, continúa después del bucle. Puede ejecutar cero vueltas si la condición ya es falsa al principio.\n\nPara leer los cuatro valores del array, comenzamos con i = 0. Mientras i < 4, leemos cpu[i] y aumentamos i en 1. Las vueltas usan los índices 0, 1, 2 y 3. Al llegar a 4, la condición es falsa y no se intenta leer cpu[4]. Si olvidamos aumentar i, volveríamos siempre al mismo dato y el bucle no terminaría. La tabla de seguimiento anota el índice antes de cada lectura y permite comprobar el recorrido sin ejecutar el programa.", "de": "Eine Schleife vermeidet, dieselben Anweisungen mehrfach aufzuschreiben. while bedeutet „solange“: Vor jedem Durchlauf wird eine Bedingung geprüft. Ist sie wahr, wird der Schleifenkörper ausgeführt und erneut geprüft. Ist sie falsch, folgt die Anweisung nach der Schleife. Ist die Bedingung anfangs falsch, gibt es keinen Durchlauf.\n\nFür vier Arraywerte beginnen wir mit i = 0. Solange i < 4 gilt, lesen wir cpu[i] und erhöhen i um 1. Die Durchläufe verwenden 0, 1, 2 und 3. Bei 4 ist die Bedingung falsch; cpu[4] wird nicht gelesen. Ohne Erhöhung von i würden wir immer denselben Wert lesen, und die Schleife würde nicht enden. Eine Ablaufverfolgung hält den Index vor jedem Zugriff fest und prüft den Ablauf ohne Programmausführung."}, "visual": "while", "question": {"es": "¿Cuántas vueltas hace while(i < 4) si i empieza en 4?", "de": "Wie viele Durchläufe hat while(i < 4), wenn i anfangs 4 ist?"}, "answer": {"es": "Ninguna. Comprueba primero y 4 < 4 es falso.", "de": "Keinen. Die Bedingung wird zuerst geprüft, und 4 < 4 ist falsch."}}, {"title": {"es": "for reúne los tres pasos del recorrido", "de": "for bündelt die drei Schritte"}, "body": {"es": "Cuando recorremos posiciones consecutivas, for reúne el inicio, la condición y el cambio del índice. for (int i = 0; i < cpu.Length; i++) significa: iniciar i en 0 una vez; antes de cada vuelta comprobar si aún existe ese índice; después del cuerpo aumentar i en 1. i++ es la forma breve de i = i + 1.\n\nContar valores y sumar valores son tareas diferentes. Si cpu[i] supera el límite, anzahl = anzahl + 1 cuenta una hora. summe = summe + cpu[i] añadiría el porcentaje medido, no una hora. El contador se inicializa antes del bucle; si lo pones a cero dentro, perderás el resultado anterior en cada vuelta. La decisión final sobre el total va después de recorrer todos los datos.", "de": "Beim Durchlaufen aufeinanderfolgender Positionen bündelt for Anfang, Bedingung und Indexänderung. for (int i = 0; i < cpu.Length; i++) bedeutet: i einmal auf 0 setzen; vor jedem Durchlauf prüfen, ob der Index noch gültig ist; nach dem Körper i um 1 erhöhen. i++ ist die Kurzform von i = i + 1.\n\nWerte zählen und Werte summieren sind unterschiedliche Aufgaben. Überschreitet cpu[i] den Grenzwert, zählt anzahl = anzahl + 1 eine Stunde. summe = summe + cpu[i] würde den gemessenen Prozentwert addieren, keine Stunde zählen. Der Zähler wird vor der Schleife initialisiert; eine Initialisierung innerhalb der Schleife löscht das bisherige Ergebnis bei jedem Durchlauf. Die Entscheidung über die Gesamtzahl folgt nach dem Durchlaufen aller Daten."}, "visual": "count", "question": {"es": "Con {70, 90, 85, 92}, ¿cuántos valores son mayores que 85?", "de": "Wie viele Werte in {70, 90, 85, 92} sind größer als 85?"}, "answer": {"es": "Dos: 90 y 92. El 85 no cuenta porque la regla dice mayor, no mayor o igual.", "de": "Zwei: 90 und 92. 85 zählt nicht, weil die Regel größer und nicht größer oder gleich verlangt."}}, {"title": {"es": "UML dibuja el recorrido", "de": "UML zeichnet den Ablauf"}, "body": {"es": "UML significa Unified Modeling Language, un lenguaje para representar sistemas. Un diagrama de actividad muestra qué acciones se ejecutan y cómo continúa el recorrido. No es código: ayuda a planificarlo o explicarlo. Sigue las flechas, no la cercanía entre las cajas.\n\nUn círculo negro marca el inicio. Una caja con esquinas redondeadas representa una acción, por ejemplo «leer carga». Una flecha representa el flujo de control: al terminar una acción se permite continuar hacia la siguiente. El final de la actividad es un círculo con otro círculo negro dentro: termina la actividad completa. El marco identifica el proceso que estamos representando. En esta primera figura no hay decisiones: desde el inicio se lee el dato, se registra y se llega al final.", "de": "UML bedeutet Unified Modeling Language, eine Sprache zur Darstellung von Systemen. Ein Aktivitätsdiagramm zeigt, welche Aktionen ausgeführt werden und wie der Ablauf weitergeht. Es ist kein Programmcode: Es hilft beim Planen oder Erläutern. Folge den Pfeilen, nicht der räumlichen Nähe der Kästen.\n\nEin ausgefüllter Kreis kennzeichnet den Start. Ein Rechteck mit abgerundeten Ecken steht für eine Aktion, zum Beispiel „Last lesen“. Ein Pfeil zeigt den Kontrollfluss: Nach Abschluss einer Aktion kann die nächste beginnen. Das Aktivitätsende ist ein Kreis mit einem ausgefüllten Kreis darin: Es beendet die gesamte Aktivität. Der Rahmen benennt den dargestellten Prozess. Die erste Zeichnung enthält keine Entscheidung: Vom Start wird der Wert gelesen, protokolliert und das Ende erreicht."}, "visual": "sequence", "question": {"es": "¿Qué indica la flecha entre leer y registrar?", "de": "Was zeigt der Pfeil zwischen Lesen und Protokollieren?"}, "answer": {"es": "Que registrar continúa después de terminar la lectura. No muestra una relación de red ni un cable.", "de": "Dass Protokollieren nach Abschluss des Lesens folgt. Der Pfeil ist keine Netzwerkverbindung."}}, {"title": {"es": "La rama depende de su condición", "de": "Der Zweig hängt von seiner Bedingung ab"}, "body": {"es": "Una decisión UML se dibuja como un rombo con una entrada y varias salidas. Las condiciones, llamadas guards, van junto a las flechas de salida entre corchetes. [last > 85] autoriza esa salida cuando la condición es verdadera. [else] cubre los demás casos. En nuestras decisiones las condiciones se excluyen entre sí para que haya una sola salida aplicable.\n\nDespués de una alternativa, otro rombo puede reunir los caminos: es una reunión o merge. Tiene varias entradas y una salida. Deja continuar al camino que llega; no espera al que no se eligió. El mismo rombo sirve para decisión o reunión, y las flechas permiten distinguir su función. La figura corresponde al if/else anterior: una rama avisa, la otra no; después cualquiera continúa hacia registrar.", "de": "Eine UML-Entscheidung ist eine Raute mit einem Eingang und mehreren Ausgängen. Bedingungen, sogenannte Guards, stehen in eckigen Klammern an den ausgehenden Pfeilen. [last > 85] erlaubt diesen Ausgang bei wahrer Bedingung. [else] umfasst die übrigen Fälle. In unseren Entscheidungen schließen sich die Bedingungen gegenseitig aus, sodass genau ein Ausgang zutrifft.\n\nNach einer Alternative kann eine weitere Raute die Wege zusammenführen: ein Merge. Sie hat mehrere Eingänge und einen Ausgang. Der ankommende Weg darf weiterlaufen; auf den nicht gewählten Weg wird nicht gewartet. Dieselbe Form dient als Entscheidung oder Zusammenführung; die Pfeile unterscheiden ihre Funktion. Die Zeichnung entspricht dem vorherigen if/else: Ein Zweig warnt, der andere nicht; anschließend folgt auf beiden Wegen das Protokollieren."}, "visual": "decision", "question": {"es": "Si solo llega la rama else, ¿puede seguir a registrar?", "de": "Darf der Ablauf weiter zum Protokollieren, wenn nur der else-Zweig ankommt?"}, "answer": {"es": "Sí. El rombo de reunión acepta la rama elegida; no exige ambas.", "de": "Ja. Der Merge akzeptiert den gewählten Zweig; er verlangt nicht beide."}}, {"title": {"es": "Una flecha de regreso repite el trabajo", "de": "Ein Rückpfeil wiederholt die Arbeit"}, "body": {"es": "En UML también puedes dibujar el while. Después de inicializar i en 0, una reunión recibe el primer paso o la vuelta del bucle. La decisión pregunta si i < n, donde n es la cantidad de datos. La salida verdadera lleva a leer el dato y aumentar el índice. Una flecha regresa a la reunión para volver a comprobar la condición.\n\nLa otra salida, [i >= n], termina el recorrido. Son condiciones complementarias: para índices enteros siempre se cumple exactamente una. No confundas una flecha que regresa con una nueva ejecución desde el inicio: la inicialización queda fuera del ciclo, así que i conserva su nuevo valor. Si la colección está vacía, n vale 0; i < n es falso desde el principio y no se lee ningún dato.", "de": "Auch ein while-Ablauf lässt sich in UML zeichnen. Nach der Initialisierung i = 0 nimmt ein Merge den ersten Schritt oder den Rückweg auf. Die Entscheidung prüft i < n; n ist die Anzahl der Daten. Der wahre Ausgang führt zum Lesen des Werts und zur Erhöhung des Index. Ein Rückpfeil führt zum Merge und damit zur erneuten Prüfung.\n\nDer andere Ausgang [i >= n] beendet das Durchlaufen. Die Bedingungen ergänzen sich: Für ganze Indizes gilt immer genau eine. Der Rückpfeil startet das Programm nicht neu: Die Initialisierung liegt außerhalb des Kreises, daher bleibt der neue Wert von i erhalten. Bei einer leeren Sammlung ist n = 0; i < n ist schon anfangs falsch, und es wird kein Wert gelesen."}, "visual": "loop", "question": {"es": "¿Se vuelve a ejecutar i = 0 en cada vuelta?", "de": "Wird i = 0 bei jedem Durchlauf erneut ausgeführt?"}, "answer": {"es": "No. La flecha vuelve a la reunión situada después de la inicialización.", "de": "Nein. Der Rückpfeil führt zum Merge nach der Initialisierung."}}, {"title": {"es": "Alternativas y paralelismo son diferentes", "de": "Alternativen und Parallelität unterscheiden sich"}, "body": {"es": "Una decisión selecciona una rama. Una barra de bifurcación o fork permite iniciar varias ramas: por ejemplo, comprobar el servicio y comprobar el espacio disponible. Estas acciones pueden avanzar de forma independiente. No promete que usen dos procesadores ni que empiecen en el mismo nanosegundo; expresa que no hay un orden obligatorio entre ellas.\n\nLa barra de sincronización o join reúne ramas paralelas. En el caso normal que usamos, espera a que todas sus entradas hayan llegado antes de continuar. Una reunión merge no espera a todas. Colocar un join detrás de dos alternativas exclusivas bloquearía el recorrido: faltaría siempre una de las entradas. Las particiones o carriles indican quién ejecuta cada acción, como monitor y almacenamiento. Un carril no crea paralelismo por sí solo: lo establecen el fork y las conexiones.", "de": "Eine Entscheidung wählt einen Zweig. Ein Aufspaltungsbalken, Fork, ermöglicht mehrere Zweige, zum Beispiel Dienstprüfung und Speicherprüfung. Diese Aktionen können unabhängig voneinander fortschreiten. Das verspricht weder zwei Prozessoren noch einen Start im selben Nanosekundenmoment; es drückt aus, dass keine feste Reihenfolge zwischen den Aktionen verlangt wird.\n\nEin Synchronisationsbalken, Join, führt parallele Zweige zusammen. Im hier verwendeten Normalfall wartet er auf alle Eingänge, bevor der Ablauf weitergeht. Ein Merge wartet nicht auf alle. Ein Join nach zwei ausschließlichen Alternativen würde den Ablauf blockieren: Ein Eingang fehlte immer. Partitionen oder Bahnen zeigen, wer eine Aktion ausführt, etwa Monitor und Speicherverwaltung. Eine Bahn erzeugt selbst keine Parallelität: Das bestimmen Fork und Verbindungen."}, "visual": "parallel", "question": {"es": "Una comprobación terminó y la otra sigue. ¿Puede continuar el join normal?", "de": "Eine Prüfung ist fertig, die andere läuft noch. Darf der normale Join fortfahren?"}, "answer": {"es": "No. Espera a la segunda. Una decisión con merge sería otro mecanismo.", "de": "Nein. Er wartet auf die zweite Prüfung. Eine Entscheidung mit Merge ist ein anderer Mechanismus."}}, {"title": {"es": "Intercambiar conserva ambos valores", "de": "Beim Tauschen bleiben beide Werte erhalten"}, "body": {"es": "Para ordenar datos de menor a mayor, Bubblesort compara vecinos. Si el de la izquierda es mayor, los intercambia. Pero escribir primero a = b borraría el valor antiguo de a. Por eso guardamos a en temp, copiamos b a a y finalmente copiamos temp a b. Con a = 9 y b = 4, los tres pasos conservan el 9 y producen a = 4, b = 9.\n\nBubblesort recorre parejas: posiciones 0 y 1, después 1 y 2, y así sucesivamente. Tras una pasada completa, el mayor valor queda a la derecha. Otra pasada ordena los que faltan. p cuenta las pasadas desde 0; i cuenta las parejas en cada pasada. Con len elementos, el último i de la primera pasada es len - 2: su vecino i + 1 sigue dentro del array. En la pasada p basta i < len - 1 - p porque los p valores finales ya están colocados.", "de": "Bubblesort vergleicht benachbarte Werte, um Daten aufsteigend zu sortieren. Ist der linke Wert größer, werden beide getauscht. Aber a = b würde zuerst den alten Wert von a löschen. Daher speichern wir a in temp, kopieren b nach a und anschließend temp nach b. Bei a = 9 und b = 4 erhalten diese Schritte die 9 und ergeben a = 4, b = 9.\n\nBubblesort durchläuft Paare: Position 0 und 1, danach 1 und 2 und so weiter. Nach einem vollständigen Durchgang steht der größte Wert rechts. Weitere Durchgänge ordnen den Rest. p zählt die Durchgänge ab 0; i zählt die Paare. Bei len Elementen ist das letzte i im ersten Durchgang len - 2: Der Nachbar i + 1 liegt noch im Array. Im Durchgang p genügt i < len - 1 - p, weil die letzten p Werte bereits richtig stehen."}, "visual": "bubble", "question": {"es": "Con cuatro elementos, ¿por qué el último índice izquierdo es 2?", "de": "Warum ist bei vier Elementen der letzte linke Index 2?"}, "answer": {"es": "La última pareja es 2 y 3. Una pareja que comenzara en 3 intentaría acceder a 4, que no existe.", "de": "Das letzte Paar ist 2 und 3. Ein Paar ab 3 würde auf den nicht vorhandenen Index 4 zugreifen."}}, {"title": {"es": "Completar código empieza por la regla", "de": "Code ergänzen beginnt mit der Regel"}, "body": {"es": "Ejemplo resuelto: un monitor lee cuatro horas {70, 90, 85, 92}. Debe avisar si más de una hora supera el 85 %. Primero subrayamos dos límites: «supera 85» y «más de una hora». Luego escribimos el plan: contador a cero; leer todas las posiciones; aumentar el contador solo en las que superan 85; comprobar el total al terminar.\n\nLa tabla muestra 0, 1, 1 y 2 horas contadas tras cada lectura. Al final 2 > 1 es verdadero y se emite el aviso. Un dato de 85 no cuenta. El código de la derecha traduce ese plan sin añadir otras reglas. Para completar una tarea, lee los comentarios y el material, identifica qué debe cambiar en cada vuelta y verifica los límites con una tabla. Después compara tu razonamiento con los criterios, no solo con el aspecto de una línea.", "de": "Durchgearbeitetes Beispiel: Ein Monitor liest vier Stunden {70, 90, 85, 92}. Er soll warnen, wenn mehr als eine Stunde über 85 % liegt. Zuerst markieren wir zwei Grenzen: „über 85“ und „mehr als eine Stunde“. Danach planen wir: Zähler auf null; alle Positionen lesen; nur bei Überschreitung von 85 erhöhen; nach der Schleife die Gesamtzahl prüfen.\n\nDie Tabelle zeigt nach jedem Zugriff 0, 1, 1 und 2 gezählte Stunden. Am Ende ist 2 > 1 wahr, die Warnung erfolgt. Ein Wert von 85 zählt nicht. Der Code rechts setzt diesen Plan ohne zusätzliche Regeln um. Lies zum Ergänzen einer Aufgabe Kommentare und Material, bestimme die Änderung pro Durchlauf und prüfe die Grenzen anhand einer Tabelle. Vergleiche anschließend die Begründung mit den Kriterien, nicht nur das Aussehen einer Zeile."}, "visual": "worked", "question": {"es": "¿Dónde se comprueba el número total de horas?", "de": "Wo wird die Gesamtzahl der Stunden geprüft?"}, "answer": {"es": "Después del bucle. Dentro todavía faltarían datos por leer.", "de": "Nach der Schleife. Innerhalb wären noch nicht alle Werte gelesen."}}], "tasks": [{"id": 1, "title": {"es": "Seguir las asignaciones", "de": "Zuweisungen verfolgen"}, "context": {"es": "Un servicio de soporte cuenta las incidencias procesadas.", "de": "Ein IT-Service zählt bearbeitete Störungen."}, "prompt": {"es": "Completa los valores después de cada línea; el código dado no cambia.", "de": "Ergänzen Sie die Werte nach jeder Zeile; der gegebene Code bleibt unverändert."}, "material": {"type": "trace", "code": ["int anzahl = 0;", "anzahl = anzahl + 1;", "anzahl = anzahl + 1;"], "rows": [["1", "anzahl", "@0"], ["2", "anzahl", "@1"], ["3", "anzahl", "@2"]]}, "fields": [{"label": {"es": "Tras línea 1", "de": "Nach Zeile 1"}, "model": "0", "points": 1, "criterion": {"es": "Inicializa en cero.", "de": "Initialisierung mit null."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Tras línea 2", "de": "Nach Zeile 2"}, "model": "1", "points": 1, "criterion": {"es": "Usa el valor anterior y suma uno.", "de": "Vorherigen Wert um eins erhöhen."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Tras línea 3", "de": "Nach Zeile 3"}, "model": "2", "points": 1, "criterion": {"es": "Conserva la cuenta anterior.", "de": "Bisherige Anzahl fortführen."}, "suite": null, "kind": "num", "options": null}], "hint": {"es": "Lee cada línea de arriba abajo. La segunda usa el resultado de la primera.", "de": "Lesen Sie von oben nach unten. Die zweite Zeile verwendet das Ergebnis der ersten."}, "reason": {"es": "El contador comienza en 0, después pasa a 1 y a 2. No se reinicia entre las líneas.", "de": "Der Zähler beginnt bei 0 und steigt auf 1 und 2. Zwischen den Zeilen wird er nicht zurückgesetzt."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": true}, {"id": 2, "title": {"es": "Más de un límite", "de": "Grenzwert überschreiten"}, "context": {"es": "Un proveedor supervisa un servidor de aplicaciones y exige un aviso por encima del 82 % de CPU.", "de": "Ein Dienstleister überwacht einen Anwendungsserver. Über 82 % CPU-Last soll eine Warnung erfolgen."}, "prompt": {"es": "Rellena solo la condición dentro de if. last es un porcentaje entero entre 0 y 100.", "de": "Ergänzen Sie nur die Bedingung in if. last ist ein ganzzahliger Prozentwert von 0 bis 100."}, "material": {"type": "code", "code": ["int last = 82;", "if (@0) {", "    warnen();", "}"]}, "fields": [{"label": {"es": "Condición de aviso", "de": "Warnbedingung"}, "model": "last > 82", "points": 3, "criterion": {"es": "Solo valores estrictamente superiores a 82.", "de": "Nur Werte strikt über 82."}, "suite": "last82", "kind": "expr", "options": null}], "hint": {"es": "Comprueba 81, 82 y 83 antes de elegir el signo.", "de": "Prüfen Sie 81, 82 und 83 vor der Wahl des Operators."}, "reason": {"es": "82 queda excluido; el primer porcentaje entero que avisa es 83.", "de": "82 ist ausgeschlossen; der erste warnende ganzzahlige Prozentwert ist 83."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": true}, {"id": 3, "title": {"es": "Un intervalo completo", "de": "Ein vollständiger Bereich"}, "context": {"es": "Un centro de datos clasifica una ocupación desde 55 % inclusive hasta menos de 75 % como media.", "de": "Ein Rechenzentrum stuft eine Belegung ab einschließlich 55 % bis unter 75 % als mittel ein."}, "prompt": {"es": "Completa la condición. u es la ocupación entera, de 0 a 100.", "de": "Ergänzen Sie die Bedingung. u ist die ganzzahlige Belegung von 0 bis 100."}, "material": {"type": "code", "code": ["if (@0) {", "    mittel();", "}"]}, "fields": [{"label": {"es": "Intervalo medio", "de": "Mittlerer Bereich"}, "model": "u >= 55 && u < 75", "points": 4, "criterion": {"es": "Incluye 55, excluye 75 y exige ambos límites.", "de": "55 einschließen, 75 ausschließen und beide Grenzen verlangen."}, "suite": "range55", "kind": "expr", "options": null}], "hint": {"es": "No basta con un solo límite. Prueba 54, 55, 74 y 75.", "de": "Eine Grenze genügt nicht. Prüfen Sie 54, 55, 74 und 75."}, "reason": {"es": "&& exige ambas comparaciones; || aceptaría también valores fuera del intervalo.", "de": "&& verlangt beide Vergleiche; || würde auch Werte außerhalb des Bereichs akzeptieren."}, "anchor": "Sommer 2022 · KAIT · 2a", "group": "code", "core": true}, {"id": 4, "title": {"es": "Dos requisitos para un archivo", "de": "Zwei Bedingungen für eine Datei"}, "context": {"es": "Un estudio de diseño archiva archivos sin acceso desde hace al menos 14 días, pero solo si superan 200 MiB.", "de": "Ein Designbetrieb archiviert Dateien ohne Zugriff seit mindestens 14 Tagen, jedoch nur bei mehr als 200 MiB."}, "prompt": {"es": "Completa el filtro. alter es la antigüedad en días; groesse, el tamaño entero en MiB.", "de": "Ergänzen Sie den Filter. alter ist die Zeit in Tagen; groesse die ganzzahlige Größe in MiB."}, "material": {"type": "code", "code": ["if (@0) {", "    archivieren();", "}"]}, "fields": [{"label": {"es": "Filtro de archivo", "de": "Dateifilter"}, "model": "alter >= 14 && groesse > 200", "points": 4, "criterion": {"es": "Al menos 14 días y estrictamente más de 200 MiB.", "de": "Mindestens 14 Tage und strikt mehr als 200 MiB."}, "suite": "file14", "kind": "expr", "options": null}], "hint": {"es": "Una condición satisfecha no basta. Revisa los casos 14 días/200 MiB y 14 días/201 MiB.", "de": "Eine erfüllte Bedingung reicht nicht. Prüfen Sie 14 Tage/200 MiB und 14 Tage/201 MiB."}, "reason": {"es": "14/200 no se archiva; 14/201 sí. La antigüedad incluye el límite y el tamaño lo excluye.", "de": "14/200 wird nicht archiviert; 14/201 schon. Die Altersgrenze ist eingeschlossen, die Größengrenze ausgeschlossen."}, "anchor": "Sommer 2022 · KAIT · 2a", "group": "code", "core": true}, {"id": 5, "title": {"es": "Índice y dato", "de": "Index und Wert"}, "context": {"es": "Una oficina mide la temperatura de cuatro equipos.", "de": "Ein Büro misst die Temperatur von vier Geräten."}, "prompt": {"es": "Completa la tabla con los datos del array.", "de": "Ergänzen Sie die Tabelle anhand des Arrays."}, "material": {"type": "trace", "code": ["int[] temp = {41, 53, 48, 60};"], "rows": [["temp.Length", "Cantidad / Anzahl", "@0"], ["Último / Letzter Index", "Posición / Position", "@1"], ["temp[2]", "Valor / Wert", "@2"]]}, "fields": [{"label": {"es": "Cantidad", "de": "Anzahl"}, "model": "4", "points": 1, "criterion": {"es": "Cuatro elementos.", "de": "Vier Elemente."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Último índice", "de": "Letzter Index"}, "model": "3", "points": 1, "criterion": {"es": "El índice empieza en cero.", "de": "Index beginnt bei null."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Valor en índice 2", "de": "Wert am Index 2"}, "model": "48", "points": 2, "criterion": {"es": "Lee el tercer elemento.", "de": "Das dritte Element lesen."}, "suite": null, "kind": "num", "options": null}], "hint": {"es": "Escribe debajo de los cuatro valores sus índices: 0, 1, 2, 3.", "de": "Schreiben Sie unter die vier Werte die Indizes 0, 1, 2, 3."}, "reason": {"es": "Length cuenta los elementos; no es un índice. temp[2] es 48, no 53.", "de": "Length zählt die Elemente und ist kein Index. temp[2] ist 48, nicht 53."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": true}, {"id": 6, "title": {"es": "Leer una repetición", "de": "Eine Schleife verfolgen"}, "context": {"es": "Un monitor comprueba tres enlaces numerados desde cero.", "de": "Ein Monitor prüft drei Verbindungen mit Indizes ab null."}, "prompt": {"es": "Indica i antes de cada llamada y su valor después del bucle.", "de": "Geben Sie i vor jedem Aufruf und seinen Wert nach der Schleife an."}, "material": {"type": "trace", "code": ["int i = 0;", "while (i < 3) {", "    pruefen(i);", "    i = i + 1;", "}"], "rows": [["1", "i", "@0"], ["2", "i", "@1"], ["3", "i", "@2"], ["Final / Ende", "i", "@3"]]}, "fields": [{"label": {"es": "Primera lectura", "de": "Erster Zugriff"}, "model": "0", "points": 1, "criterion": {"es": "Empieza en cero.", "de": "Start bei null."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Segunda lectura", "de": "Zweiter Zugriff"}, "model": "1", "points": 1, "criterion": {"es": "Aumenta una vez.", "de": "Einmal erhöhen."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Tercera lectura", "de": "Dritter Zugriff"}, "model": "2", "points": 1, "criterion": {"es": "Aumenta de nuevo.", "de": "Erneut erhöhen."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Al terminar", "de": "Am Ende"}, "model": "3", "points": 1, "criterion": {"es": "3 < 3 es falso.", "de": "3 < 3 ist falsch."}, "suite": null, "kind": "num", "options": null}], "hint": {"es": "El aumento ocurre después de cada llamada, antes de la siguiente comprobación.", "de": "Die Erhöhung folgt nach dem Aufruf und vor der nächsten Prüfung."}, "reason": {"es": "Los accesos usan 0, 1 y 2; el bucle termina con i = 3 sin ejecutar pruefen(3).", "de": "Die Zugriffe verwenden 0, 1 und 2. Bei i = 3 endet die Schleife ohne pruefen(3)."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": true}, {"id": 7, "title": {"es": "Recorrer todos los elementos", "de": "Alle Elemente durchlaufen"}, "context": {"es": "Un almacén revisa todas las mediciones de su array werte, que también puede estar vacío.", "de": "Ein Lager prüft alle Messwerte im Array werte, das auch leer sein kann."}, "prompt": {"es": "Completa la condición de for para evitar accesos fuera del array.", "de": "Ergänzen Sie die for-Bedingung ohne Zugriff außerhalb des Arrays."}, "material": {"type": "code", "code": ["int n = werte.Length;", "for (int i = 0; @0; i++) {", "    pruefen(werte[i]);", "}"]}, "fields": [{"label": {"es": "Condición de repetición", "de": "Schleifenbedingung"}, "model": "i < n", "points": 4, "criterion": {"es": "Lee índices 0 a n - 1; con n = 0 no lee ninguno.", "de": "Indizes 0 bis n - 1 lesen; bei n = 0 keinen."}, "suite": "loop", "kind": "expr", "options": null}], "hint": {"es": "El primer índice no válido es n. Ensaya n = 0 y n = 4.", "de": "Der erste ungültige Index ist n. Testen Sie n = 0 und n = 4."}, "reason": {"es": "i < n incluye la última posición n - 1 y detiene el recorrido antes de n.", "de": "i < n schließt die letzte Position n - 1 ein und beendet den Ablauf vor n."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": false}, {"id": 8, "title": {"es": "Contar, no sumar porcentajes", "de": "Zählen statt Prozentwerte summieren"}, "context": {"es": "Un proveedor cuenta mediciones que exceden 78 % de carga.", "de": "Ein Anbieter zählt Messwerte über 78 % Auslastung."}, "prompt": {"es": "Completa únicamente el valor nuevo del contador.", "de": "Ergänzen Sie nur den neuen Zählerwert."}, "material": {"type": "code", "code": ["int anzahl = 0;", "for (int i = 0; i < cpu.Length; i++) {", "    if (cpu[i] > 78) {", "        anzahl = @0;", "    }", "}"]}, "fields": [{"label": {"es": "Nuevo contador", "de": "Neuer Zählerwert"}, "model": "anzahl + 1", "points": 3, "criterion": {"es": "Cada coincidencia aumenta la cantidad en uno.", "de": "Jeder Treffer erhöht die Anzahl um eins."}, "suite": "increment", "kind": "expr", "options": null}], "hint": {"es": "Una lectura que cumple la condición representa una medición, sea 79 o 99 %.", "de": "Ein Treffer steht für einen Messwert, unabhängig davon, ob er 79 oder 99 % beträgt."}, "reason": {"es": "Se añade 1, no cpu[i]. El porcentaje se usa para decidir, no para aumentar una cuenta de horas.", "de": "Es wird 1 addiert, nicht cpu[i]. Der Prozentwert dient der Entscheidung, nicht der Erhöhung einer Stundenanzahl."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": false}, {"id": 9, "title": {"es": "Ampliación de un monitor", "de": "Einen Monitor erweitern"}, "context": {"es": "Un host de virtualización guarda 24 valores horarios. Avisa si más de 16 horas superan 85 %.", "de": "Ein Virtualisierungshost speichert 24 Stundenwerte. Er warnt, wenn mehr als 16 Stunden über 85 % liegen."}, "prompt": {"es": "Completa el programa en las casillas. cpu.Length vale 24; los porcentajes son enteros de 0 a 100.", "de": "Vervollständigen Sie das Programm in den Feldern. cpu.Length ist 24; Prozentwerte sind ganze Zahlen von 0 bis 100."}, "material": {"type": "code", "code": ["int[] cpu = {86,90,91,85,87,88,89,90,91,92,93,94,95,96,97,98,99,100,84,83,82,81,80,79};", "int anzahl = @0;", "for (int i = 0; @1; i++) {", "    if (@2) {", "        anzahl = anzahl + 1;", "    }", "}", "if (@3) { warnen(); }"]}, "fields": [{"label": {"es": "Inicialización", "de": "Initialisierung"}, "model": "0", "points": 3, "criterion": {"es": "Contador a cero antes del bucle.", "de": "Zähler vor der Schleife auf null."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Recorrido", "de": "Durchlauf"}, "model": "i < cpu.Length", "points": 4, "criterion": {"es": "Todos los índices de 0 a 23, ningún índice 24.", "de": "Alle Indizes von 0 bis 23, kein Index 24."}, "suite": "cpu_loop", "kind": "expr", "options": null}, {"label": {"es": "Carga elevada", "de": "Hohe Last"}, "model": "cpu[i] > 85", "points": 4, "criterion": {"es": "85 se excluye; se consulta el dato actual.", "de": "85 ausschließen; den aktuellen Wert prüfen."}, "suite": "cpu85", "kind": "expr", "options": null}, {"label": {"es": "Aviso final", "de": "Abschließende Warnung"}, "model": "anzahl > 16", "points": 4, "criterion": {"es": "El total 16 no basta; 17 sí.", "de": "16 reicht nicht; 17 schon."}, "suite": "count16", "kind": "expr", "options": null}], "hint": {"es": "Hay dos umbrales distintos: uno compara un porcentaje y otro una cantidad de horas.", "de": "Es gibt zwei verschiedene Grenzen: eine für Prozentwerte und eine für die Stundenanzahl."}, "reason": {"es": "17 valores superan 85: se emite el aviso. El 85 no cuenta. El bucle y la decisión final quedan separados.", "de": "17 Werte überschreiten 85: Die Warnung erfolgt. 85 zählt nicht. Schleife und abschließende Entscheidung bleiben getrennt."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": true}, {"id": 10, "title": {"es": "Acumular un total", "de": "Eine Summe bilden"}, "context": {"es": "Un servicio de copias suma los archivos transferidos por cada lote.", "de": "Ein Sicherungsdienst summiert die pro Stapel übertragenen Dateien."}, "prompt": {"es": "Completa la suma y su resultado con los datos dados.", "de": "Ergänzen Sie die Summierung und ihr Ergebnis mit den gegebenen Daten."}, "material": {"type": "code", "code": ["int[] dateien = {3, 0, 5, 2};", "int summe = 0;", "for (int i = 0; i < dateien.Length; i++) {", "    summe = @0;", "}", "// summe am Ende / total final: @1"]}, "fields": [{"label": {"es": "Nueva suma", "de": "Neue Summe"}, "model": "summe + dateien[i]", "points": 3, "criterion": {"es": "Añade el dato actual al total conservado.", "de": "Aktuellen Wert zur bisherigen Summe addieren."}, "suite": "sum", "kind": "expr", "options": null}, {"label": {"es": "Total final", "de": "Endsumme"}, "model": "10", "points": 2, "criterion": {"es": "3 + 0 + 5 + 2.", "de": "3 + 0 + 5 + 2."}, "suite": null, "kind": "num", "options": null}], "hint": {"es": "Aquí sí quieres sumar cantidades, no contar lotes.", "de": "Hier sollen Mengen addiert und keine Stapel gezählt werden."}, "reason": {"es": "La suma avanza 3, 3, 8, 10. summe + 1 contaría cuatro lotes y daría otro resultado.", "de": "Die Summe wächst auf 3, 3, 8, 10. summe + 1 würde vier Stapel zählen und ein anderes Ergebnis liefern."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": false}, {"id": 11, "title": {"es": "Evitar quedarse en el mismo dato", "de": "Zum nächsten Wert gelangen"}, "context": {"es": "Un taller informático recorre una lista con i = 0, pero falta actualizar el índice.", "de": "Ein IT-Betrieb durchläuft eine Liste ab i = 0; die Indexänderung fehlt."}, "prompt": {"es": "Completa la actualización para que el bucle termine tras procesar todos los datos.", "de": "Ergänzen Sie die Änderung, damit die Schleife nach allen Werten endet."}, "material": {"type": "code", "code": ["int i = 0;", "while (i < n) {", "    pruefen(werte[i]);", "    i = @0;", "}"]}, "fields": [{"label": {"es": "Siguiente índice", "de": "Nächster Index"}, "model": "i + 1", "points": 3, "criterion": {"es": "Avanza una posición sin volver al inicio.", "de": "Eine Position weitergehen, ohne neu zu beginnen."}, "suite": "index_next", "kind": "expr", "options": null}], "hint": {"es": "La próxima vuelta debe leer el siguiente elemento.", "de": "Der nächste Durchlauf muss das nächste Element lesen."}, "reason": {"es": "El incremento transforma 0 en 1 y luego en 2. i sin aumento dejaría el bucle sin terminar si n > 0.", "de": "Die Erhöhung macht aus 0 eine 1, danach eine 2. Ohne Änderung von i endet die Schleife bei n > 0 nicht."}, "anchor": "Sommer 2023 · KAIT · 3a", "group": "code", "core": false}, {"id": 12, "title": {"es": "Una condición en el dibujo", "de": "Eine Bedingung im Diagramm"}, "context": {"es": "Un NAS emite una alerta si su ocupación supera 75 %.", "de": "Ein NAS meldet eine Warnung, wenn seine Belegung 75 % überschreitet."}, "prompt": {"es": "Completa el guard de la rama de aviso. u es un porcentaje entero de 0 a 100.", "de": "Ergänzen Sie den Guard des Warnzweigs. u ist ein ganzzahliger Prozentwert von 0 bis 100."}, "material": {"type": "diagram", "diagram": "guard"}, "fields": [{"label": {"es": "Guard de aviso", "de": "Guard des Warnzweigs"}, "model": "u > 75", "points": 4, "criterion": {"es": "Avisar solo por encima de 75.", "de": "Nur über 75 warnen."}, "suite": "u75", "kind": "expr", "options": null}], "hint": {"es": "Los corchetes ya están dibujados. Escribe dentro la comparación.", "de": "Die eckigen Klammern sind vorgegeben. Tragen Sie den Vergleich ein."}, "reason": {"es": "El guard es u > 75. La rama [else] cubre 75 y cualquier porcentaje inferior.", "de": "Der Guard ist u > 75. [else] umfasst 75 und alle niedrigeren Prozentwerte."}, "anchor": "Sommer 2022 · KAIT · 2a", "group": "uml", "core": false}, {"id": 13, "title": {"es": "Completar un bucle UML", "de": "Eine UML-Schleife ergänzen"}, "context": {"es": "Un operador comprueba cada dispositivo del array geraete. n es su cantidad; i empieza en 0.", "de": "Ein Betreiber prüft jedes Gerät im Array geraete. n ist die Anzahl; i beginnt bei 0."}, "prompt": {"es": "Completa ambos guards y el nuevo índice dentro del mismo dibujo.", "de": "Ergänzen Sie beide Guards und den neuen Index direkt im Diagramm."}, "material": {"type": "diagram", "diagram": "loopfields"}, "fields": [{"label": {"es": "Seguir leyendo", "de": "Weiter lesen"}, "model": "i < n", "points": 3, "criterion": {"es": "Continuar solo con índices válidos.", "de": "Nur mit gültigen Indizes fortfahren."}, "suite": "loop", "kind": "expr", "options": null}, {"label": {"es": "Salir del bucle", "de": "Schleife verlassen"}, "model": "i >= n", "points": 3, "criterion": {"es": "Salida complementaria al recorrido.", "de": "Ergänzender Ausgang zur Schleifenbedingung."}, "suite": "loop_exit", "kind": "expr", "options": null}, {"label": {"es": "Actualizar i", "de": "i ändern"}, "model": "i + 1", "points": 2, "criterion": {"es": "Avanzar al siguiente dispositivo.", "de": "Zum nächsten Gerät weitergehen."}, "suite": "index_next", "kind": "expr", "options": null}], "hint": {"es": "El retorno llega después de i = 0. Para n = 0 debe tomarse la salida.", "de": "Der Rückweg endet nach i = 0. Bei n = 0 muss der Ausgang genommen werden."}, "reason": {"es": "Las condiciones son complementarias. El incremento permite llegar a i = n y salir; la inicialización no se repite.", "de": "Die Bedingungen ergänzen sich. Durch die Erhöhung wird i = n erreicht und die Schleife verlassen; die Initialisierung wird nicht wiederholt."}, "anchor": "Sommer 2022 · KAIT · 2a", "group": "uml", "core": true}, {"id": 14, "title": {"es": "Reunir alternativas", "de": "Alternativen zusammenführen"}, "context": {"es": "Un sistema de tickets acepta o rechaza una solicitud y después registra el resultado.", "de": "Ein Ticketsystem nimmt eine Anfrage an oder lehnt sie ab und protokolliert danach das Ergebnis."}, "prompt": {"es": "Elige el símbolo que falta en la casilla. Solo se ejecuta una rama.", "de": "Wählen Sie das fehlende Symbol im Feld. Es wird nur ein Zweig ausgeführt."}, "material": {"type": "diagram", "diagram": "mergefield"}, "fields": [{"label": {"es": "Nodo de reunión", "de": "Zusammenführungsknoten"}, "model": "merge", "points": 4, "criterion": {"es": "Usa merge; no espera ambas alternativas.", "de": "Merge verwenden; nicht auf beide Alternativen warten."}, "suite": null, "kind": "select", "options": [["merge", {"es": "Rombo · Merge", "de": "Raute · Merge"}], ["join", {"es": "Barra · Join", "de": "Balken · Join"}]]}], "hint": {"es": "Piensa qué ocurriría si el símbolo exigiera que acabaran ambas ramas.", "de": "Überlegen Sie, was beim Warten auf beide Zweige passieren würde."}, "reason": {"es": "Un merge recibe la rama elegida. Un join normal esperaría también la rama que nunca se ejecutará.", "de": "Ein Merge empfängt den gewählten Zweig. Ein normaler Join würde auch auf den nie ausgeführten Zweig warten."}, "anchor": "Sommer 2022 · KAIT · 2a", "group": "uml", "core": false}, {"id": 15, "title": {"es": "Leer la sincronización", "de": "Synchronisation lesen"}, "context": {"es": "Un centro logístico comprueba servicio y almacenamiento en ramas paralelas antes de enviar un informe.", "de": "Ein Logistikzentrum prüft Dienst und Speicher in parallelen Zweigen vor dem Versand eines Berichts."}, "prompt": {"es": "Según el diagrama, elige cuándo puede enviarse el informe.", "de": "Wählen Sie anhand des Diagramms, wann der Bericht versendet werden darf."}, "material": {"type": "diagram", "diagram": "parallelfield"}, "fields": [{"label": {"es": "Continuación permitida", "de": "Erlaubte Fortsetzung"}, "model": "both", "points": 4, "criterion": {"es": "El join normal espera a ambas comprobaciones.", "de": "Der normale Join wartet auf beide Prüfungen."}, "suite": null, "kind": "select", "options": [["one", {"es": "Cuando termine cualquiera", "de": "Sobald eine fertig ist"}], ["both", {"es": "Cuando terminen ambas", "de": "Sobald beide fertig sind"}], ["service", {"es": "Solo depende del servicio", "de": "Nur vom Dienst abhängig"}]]}], "hint": {"es": "El símbolo que precede al informe es una barra, no un rombo.", "de": "Vor dem Bericht steht ein Balken, keine Raute."}, "reason": {"es": "El fork habilita ambas ramas. El join normal exige ambas entradas, independientemente de cuál termine primero.", "de": "Der Fork ermöglicht beide Zweige. Der normale Join verlangt beide Eingänge, unabhängig von der Reihenfolge des Abschlusses."}, "anchor": "Sommer 2022 · KAIT · 2a", "group": "uml", "core": false}, {"id": 16, "title": {"es": "Conservar datos al intercambiar", "de": "Werte beim Tauschen erhalten"}, "context": {"es": "Un proveedor ordena dos tiempos de respuesta: a = 12 y b = 5.", "de": "Ein Anbieter ordnet zwei Antwortzeiten: a = 12 und b = 5."}, "prompt": {"es": "Completa las expresiones del intercambio usando temp.", "de": "Ergänzen Sie die Ausdrücke des Tauschs mit temp."}, "material": {"type": "code", "code": ["int temp;", "temp = @0;", "a = @1;", "b = @2;"]}, "fields": [{"label": {"es": "Guardar a", "de": "a speichern"}, "model": "a", "points": 2, "criterion": {"es": "Preserva el valor antiguo de a.", "de": "Alten Wert von a erhalten."}, "suite": "swap_a", "kind": "expr", "options": null}, {"label": {"es": "Copiar b a a", "de": "b nach a kopieren"}, "model": "b", "points": 2, "criterion": {"es": "a recibe el antiguo b.", "de": "a erhält den alten Wert von b."}, "suite": "swap_b", "kind": "expr", "options": null}, {"label": {"es": "Recuperar a en b", "de": "a in b wiederherstellen"}, "model": "temp", "points": 2, "criterion": {"es": "b recibe el valor guardado.", "de": "b erhält den gesicherten Wert."}, "suite": "swap_temp", "kind": "expr", "options": null}], "hint": {"es": "Después de a = b, el valor antiguo de a solo sigue disponible en temp.", "de": "Nach a = b steht der alte Wert von a nur noch in temp."}, "reason": {"es": "temp guarda 12; a recibe 5; b recibe 12. Los dos valores siguen presentes.", "de": "temp speichert 12; a erhält 5; b erhält 12. Beide Werte bleiben erhalten."}, "anchor": "Sommer 2022 · KAIT · 2b", "group": "code", "core": false}, {"id": 17, "title": {"es": "La primera pasada de Bubblesort", "de": "Der erste Bubblesort-Durchgang"}, "context": {"es": "Un servicio de red ordena cuatro latencias: {7, 2, 5, 1}.", "de": "Ein Netzwerkdienst sortiert vier Latenzen: {7, 2, 5, 1}."}, "prompt": {"es": "Haz una pasada de izquierda a derecha, intercambiando vecinos si el izquierdo es mayor. Completa el array resultante.", "de": "Führen Sie einen Durchgang von links nach rechts aus. Tauschen Sie Nachbarn, wenn der linke Wert größer ist. Ergänzen Sie das Ergebnisarray."}, "material": {"type": "trace", "code": ["int[] werte = {7, 2, 5, 1};", "// Paare / parejas: (0,1), (1,2), (2,3)"], "rows": [["0", "werte[0]", "@0"], ["1", "werte[1]", "@1"], ["2", "werte[2]", "@2"], ["3", "werte[3]", "@3"]]}, "fields": [{"label": {"es": "Índice 0", "de": "Index 0"}, "model": "2", "points": 1, "criterion": {"es": "Primera pareja coloca 2 a la izquierda.", "de": "Erstes Paar setzt 2 nach links."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Índice 1", "de": "Index 1"}, "model": "5", "points": 1, "criterion": {"es": "La segunda pareja coloca 5.", "de": "Zweites Paar setzt 5."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Índice 2", "de": "Index 2"}, "model": "1", "points": 1, "criterion": {"es": "La última pareja coloca 1.", "de": "Letztes Paar setzt 1."}, "suite": null, "kind": "num", "options": null}, {"label": {"es": "Índice 3", "de": "Index 3"}, "model": "7", "points": 1, "criterion": {"es": "El mayor llega al final.", "de": "Größter Wert steht am Ende."}, "suite": null, "kind": "num", "options": null}], "hint": {"es": "Usa el array actualizado tras cada intercambio, no el original.", "de": "Verwenden Sie nach jedem Tausch das geänderte Array, nicht das ursprüngliche."}, "reason": {"es": "{7,2,5,1} → {2,7,5,1} → {2,5,7,1} → {2,5,1,7}. Una pasada aún no ordena todo.", "de": "{7,2,5,1} → {2,7,5,1} → {2,5,7,1} → {2,5,1,7}. Ein Durchgang sortiert noch nicht alles."}, "anchor": "Sommer 2022 · KAIT · 2b", "group": "code", "core": false}, {"id": 18, "title": {"es": "Completar las parejas del algoritmo", "de": "Die Paarvergleiche ergänzen"}, "context": {"es": "Un equipo de operaciones ordena un array de medidas mediante Bubblesort. p empieza en 0 y cuenta pasadas; len es la longitud.", "de": "Ein Betriebsteam sortiert Messwerte mit Bubblesort. p zählt Durchgänge ab 0; len ist die Länge."}, "prompt": {"es": "Completa el límite exclusivo de i y la comparación de vecinos. El intercambio ya está dado.", "de": "Ergänzen Sie die ausschließliche Grenze für i und den Nachbarvergleich. Der Tausch ist gegeben."}, "material": {"type": "code", "code": ["for (int p = 0; p < len - 1; p++) {", "    for (int i = 0; i < @0; i++) {", "        if (@1) {", "            temp = werte[i];", "            werte[i] = werte[i + 1];", "            werte[i + 1] = temp;", "        }", "    }", "}"]}, "fields": [{"label": {"es": "Límite exclusivo", "de": "Ausschließliche Grenze"}, "model": "len - 1 - p", "points": 4, "criterion": {"es": "Deja espacio para i + 1 y omite el final ya ordenado.", "de": "Platz für i + 1 lassen; sortiertes Ende auslassen."}, "suite": "bubble_bound", "kind": "expr", "options": null}, {"label": {"es": "Comparación", "de": "Vergleich"}, "model": "werte[i] > werte[i + 1]", "points": 3, "criterion": {"es": "Intercambia cuando el izquierdo es mayor.", "de": "Tauschen, wenn der linke Wert größer ist."}, "suite": "bubble_compare", "kind": "expr", "options": null}], "hint": {"es": "Con len = 4 y p = 0, i debe valer 0, 1 y 2. Con p = 1, solo 0 y 1.", "de": "Bei len = 4, p = 0 sind i = 0, 1, 2 erlaubt. Bei p = 1 nur 0 und 1."}, "reason": {"es": "i < len - 1 - p equivale a i <= len - 2 - p. La condición estricta > ordena de menor a mayor.", "de": "i < len - 1 - p entspricht i <= len - 2 - p. Der strikte Vergleich > sortiert aufsteigend."}, "anchor": "Sommer 2022 · KAIT · 2b", "group": "code", "core": false}, {"id": 19, "title": {"es": "Reglas de almacenamiento en UML", "de": "Speicherregeln in UML"}, "context": {"es": "Un sistema de archivos selecciona una política según su ocupación u, un porcentaje entero entre 0 y 100.", "de": "Ein Dateisystem wählt eine Regel nach seiner Belegung u, einem ganzzahligen Prozentwert von 0 bis 100."}, "prompt": {"es": "Completa los guards de tres ramas: desde 50 hasta menos de 70 → archivos sin acceso ≥ 90 días; desde 70 hasta 85 inclusive → ≥ 30 días; por encima de 85 → ≥ 7 días y más de 128 MiB. Por debajo de 50 no mueve nada.", "de": "Ergänzen Sie die Guards dreier Zweige: ab 50 bis unter 70 → kein Zugriff seit ≥ 90 Tagen; ab 70 bis einschließlich 85 → ≥ 30 Tage; über 85 → ≥ 7 Tage und mehr als 128 MiB. Unter 50 wird nichts verschoben."}, "material": {"type": "diagram", "diagram": "storage"}, "fields": [{"label": {"es": "Rama de 90 días", "de": "Zweig 90 Tage"}, "model": "u >= 50 && u < 70", "points": 4, "criterion": {"es": "Cubre 50 a 69 sin solaparse.", "de": "50 bis 69 ohne Überschneidung abdecken."}, "suite": "storage1", "kind": "expr", "options": null}, {"label": {"es": "Rama de 30 días", "de": "Zweig 30 Tage"}, "model": "u >= 70 && u <= 85", "points": 4, "criterion": {"es": "Incluye 70 y 85.", "de": "70 und 85 einschließen."}, "suite": "storage2", "kind": "expr", "options": null}, {"label": {"es": "Rama de 7 días", "de": "Zweig 7 Tage"}, "model": "u > 85", "points": 3, "criterion": {"es": "Excluye 85.", "de": "85 ausschließen."}, "suite": "storage3", "kind": "expr", "options": null}, {"label": {"es": "Filtro de la tercera acción", "de": "Filter der dritten Aktion"}, "model": "alter >= 7 && groesse > 128", "points": 3, "criterion": {"es": "Exige antigüedad y tamaño a la vez.", "de": "Alter und Größe zugleich verlangen."}, "suite": "file7", "kind": "expr", "options": null}], "hint": {"es": "Cada porcentaje debe elegir una sola política. Prueba 49, 50, 69, 70, 85 y 86.", "de": "Jeder Prozentwert muss genau eine Regel wählen. Prüfen Sie 49, 50, 69, 70, 85 und 86."}, "reason": {"es": "Las tres ramas cubren 50–69, 70–85 y 86–100. [u < 50] no mueve datos. La tercera acción exige también las dos condiciones del archivo.", "de": "Die drei Zweige umfassen 50–69, 70–85 und 86–100. [u < 50] verschiebt nichts. Die dritte Aktion verlangt zusätzlich beide Dateibedingungen."}, "anchor": "Sommer 2022 · KAIT · 2a", "group": "uml", "core": true}, {"id": 20, "title": {"es": "Práctica escrita final", "de": "Abschließende schriftliche Aufgabe"}, "context": {"es": "Un proveedor de hosting evalúa 24 horas de CPU. El borrador del monitor y su recorrido UML se entregan como material.", "de": "Ein Hostinganbieter wertet 24 Stunden CPU-Last aus. Programmentwurf und UML-Ablauf sind als Material gegeben."}, "prompt": {"es": "Completa las tres líneas en alemán o código. Debe avisar si más de 17 horas superan 88 %. Después explica en alemán por qué un 88 no cuenta y por qué el aviso va después del bucle. La traducción del enunciado sigue disponible; las respuestas finales son en alemán.", "de": "Ergänzen Sie die drei Zeilen. Es soll gewarnt werden, wenn mehr als 17 Stunden über 88 % liegen. Erläutern Sie anschließend auf Deutsch, warum 88 nicht zählt und warum die Warnung nach der Schleife steht."}, "material function stepper(which){const k=state.steps[which]||0;let rows,caption,code,max;if(which==='while'){rows=[[0,70,1],[1,90,2],[2,85,3],[3,92,4]];max=4;caption=[b('Inicio: i = 0. Aún no se ha leído ningún dato.','Start: i = 0. Noch kein Wert wurde gelesen.'),b('0 < 4: leer cpu[0] = 70. Después i = 1.','0 < 4: cpu[0] = 70 lesen. Danach i = 1.'),b('1 < 4: leer cpu[1] = 90. Después i = 2.','1 < 4: cpu[1] = 90 lesen. Danach i = 2.'),b('2 < 4: leer cpu[2] = 85. Después i = 3.','2 < 4: cpu[2] = 85 lesen. Danach i = 3.'),b('3 < 4: leer 92 y aumentar i a 4. La siguiente prueba 4 < 4 es falsa: termina.','3 < 4: 92 lesen, i auf 4 erhöhen. Die nächste Prüfung 4 < 4 ist falsch: Ende.')];code='int i = 0;\nwhile (i < 4) {\n    lesen(cpu[i]);\n    i = i + 1;\n}';}

// A small expression parser, not eval or keyword matching. It accepts only the

function parseExpression(s){if(s.length>240)throw Error('length');const pattern=/\s*(>=|<=|==|!=|&&|\|\||[+\-*/%<>!()[\].]|[A-Za-z_]\w*|\d+(?:\.\d+)?)/gy;let tokens=[],pos=0,m;while(pos<s.length){pattern.lastIndex=pos;m=pattern.exec(s);if(!m){if(s.slice(pos).trim()==='')break;throw Error('token');}tokens.push(m[1]);pos=pattern.lastIndex;}if(!tokens.length)throw Error('empty');let at=0;const take=()=>tokens[at++],peek=()=>tokens[at],expect=x=>{if(take()!==x)throw Error('syntax');};const prec={'||':1,'&&':2,'==':3,'!=':3,'<':4,'>':4,'<=':4,'>=':4,'+':5,'-':5,'*':6,'/':6,'%':6};function primary(){const t=take();let a;if(t==='('){a=expr(0);expect(')');}else if(t==='-'||t==='!'||t==='+')a={type:'unary',op:t,a:primary()};else if(/^\d/.test(t||''))a={type:'num',value:Number(t)};else if(/^[A-Za-z_]\w*$/.test(t||''))a=t==='true'||t==='false'?{type:'bool',value:t==='true'}:{type:'var',name:t};else throw Error('primary');while(peek()==='['||peek()==='.'){if(take()==='['){const index=expr(0);expect(']');a={type:'index',a,index};}else{if(take()!=='Length')throw Error('property');a={type:'length',a};}}return a;}function expr(min){let a=primary();while(prec[peek()]!==undefined&&prec[peek()]>=min){const op=take(),right=expr(prec[op]+1);a={type:'binary',op,a,b:right};}return a;}const tree=expr(0);if(at!==tokens.length)throw Error('trailing');return tree;}
function evaluate(a,e){if(a.type==='num'||a.type==='bool')return a.value;if(a.type==='var'){if(!Object.hasOwn(e,a.name))throw Error('variable');return e[a.name];}if(a.type==='length'){const v=evaluate(a.a,e);if(!Array.isArray(v))throw Error('array');return v.length;}if(a.type==='index'){const v=evaluate(a.a,e),i=evaluate(a.index,e);if(!Array.isArray(v)||!Number.isInteger(i)||i<0||i>=v.length)throw Error('index');return v[i];}if(a.type==='unary'){const v=evaluate(a.a,e);return a.op==='!'?!v:a.op==='-'?-v:+v;}if(a.type==='binary'){const x=evaluate(a.a,e);if(a.op==='&&'&&!x)return false;if(a.op==='||'&&x)return true;const y=evaluate(a.b,e);switch(a.op){case '+':return x+y;case '-':return x-y;case '*':return x*y;case '/':if(y===0)throw Error('zero');return x/y;case '%':if(y===0)throw Error('zero');return x%y;case '>':return x>y;case '<':return x<y;case '>=':return x>=y;case '<=':return x<=y;case '==':return x===y;case '!=':return x!==y;case '&&':return Boolean(x&&y);case '||':return Boolean(x||y);}}throw Error('expression');}
function checkField(f,value){if(!String(value??'').trim())return {ok:false,empty:true};if(f.kind==='free')return {ok:false,manual:true};if(f.kind==='select')return {ok:value===f.model};if(f.kind==='num'){const s=String(value).trim();return {ok:/^[+-]?\d+(?:\.0+)?$/.test(s)&&Number(s)===Number(f.model)};}try{const tree=parseExpression(String(value));return {ok:DATA.oracle[f.suite].every(c=>evaluate(tree,c.env)===c.expected)};}catch(e){return {ok:false,syntax:true};}}
function check(){const t=currentTask(),p=progress(t.id);const results=t.fields.map((f,k)=>checkField(f,p.answers[k]??''));const manual=t.fields.some(f=>f.kind==='free'),total=t.fields.reduce((s,f)=>s+f.points,0),score=results.reduce((s,r,k)=>s+(r.ok?t.fields[k].points:0),0);p.feedback={fields:results,empty:results.some(r=>r.empty),score:manual?null:score,total};p.attempts.push({at:new Date().toISOString(),answers:{...p.answers},score:manual?null:score,total,help:p.solutionSeen?'solution':p.hintUsed?'hint':'none',manual});save();renderTask();}
