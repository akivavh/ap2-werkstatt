<script id="content-data" type="application/json">{"lessons":[{"title":{"de":"Vier Fragen an ein System","es":"Cuatro preguntas al sistema"},"lead":{"de":"Daten speichern, einen Defekt überstehen, einen alten Zustand zurückholen und bei Stromausfall reagieren sind vier verschiedene Anforderungen.","es":"Guardar datos, soportar una avería, recuperar un estado anterior y reaccionar a un corte eléctrico son cuatro requisitos distintos."},"body":{"de":"Eine Datei ist eine gespeicherte Information, etwa eine Rechnung. Ein Laufwerk hält diese Daten. Ein Dienst macht sie nutzbar: Ein Dateiserver stellt Dateien im Netz bereit. Fällt der Dienst aus, können die Daten noch vorhanden sein, obwohl niemand darauf zugreifen kann.\n\nBeginnen Sie deshalb beim Betrieb: Welche Datenmenge muss Platz finden? Welcher Defekt darf den Dienst nicht stoppen? Von welchem Zeitpunkt müssen Daten zurückkommen? Wie lange darf die Arbeit unterbrochen sein? Erst danach wählen Sie Speicher, RAID, Backup und Stromversorgung.\n\nEin RAID kann bei einem Plattendefekt weiterarbeiten. Wird eine Rechnung versehentlich überschrieben, übernimmt das RAID die Änderung ebenfalls. Für die frühere Rechnung brauchen Sie eine noch vorhandene Sicherung dieses Zustands. Eine USV liefert vorübergehend Strom; sie stellt die Rechnung nicht wieder her.","es":"Un archivo contiene información guardada, por ejemplo una factura. Un disco conserva esos datos. Un servicio permite utilizarlos: un servidor de archivos los comparte por la red. Si el servicio falla, los datos pueden seguir intactos aunque nadie pueda acceder a ellos.\n\nEmpieza por el trabajo de la empresa: ¿Cuántos datos deben caber? ¿Qué avería no debe detener el servicio? ¿De qué momento se deben recuperar los datos? ¿Cuánto puede interrumpirse el trabajo? Después eliges almacenamiento, RAID, backup y alimentación.\n\nUn RAID puede seguir funcionando si falla un disco. Si se sobrescribe una factura por error, el RAID también guarda ese cambio. Para recuperar la factura anterior necesitas una copia que aún conserve ese estado. Una USV suministra electricidad temporalmente; no recupera la factura."},"visual":"four","check":{"de":"Welches Mittel kann eine überschriebene Rechnung von gestern zurückbringen?","es":"¿Qué medida puede recuperar la factura de ayer sobrescrita hoy?"},"options":[{"de":"RAID allein","es":"Solo RAID"},{"de":"Ein geprüftes Backup von gestern","es":"Un backup comprobado de ayer"},{"de":"USV allein","es":"Solo USV"}],"answer":1,"explain":{"de":"Nur die noch vorhandene Sicherung enthält den früheren Zustand. Prüfen Sie danach auch, ob der Dienst wieder funktioniert.","es":"Solo una copia aún disponible contiene el estado anterior. Después comprueba también que el servicio vuelva a funcionar."}},{"title":{"de":"RAID: Kapazität und Defekt","es":"RAID: espacio y averías"},"lead":{"de":"Mehrere physische Laufwerke werden als ein logischer Speicher genutzt. Redundanz kostet Platz, damit Daten trotz eines Defekts verfügbar bleiben.","es":"Varios discos físicos se utilizan como un almacenamiento lógico. La redundancia ocupa espacio para conservar los datos si un disco falla."},"body":{"de":"RAID bedeutet Redundant Array of Independent Disks: mehrere Laufwerke erscheinen als gemeinsamer Speicher. Ein NAS (Network Attached Storage) stellt Dateien im Netz bereit; ein SAN (Storage Area Network) stellt Servern blockbasierten Speicher bereit. Bei beiden kann RAID gegen Plattendefekte helfen. Bruttokapazität addiert die Laufwerke; Nutzkapazität zieht die Redundanz ab.\n\nEin Block ist ein Teil der gespeicherten Daten. Beim Striping liegen aufeinanderfolgende Blöcke auf verschiedenen Laufwerken. RAID 0 verteilt nur: Es gibt keine Ersatzinformation. RAID 1 spiegelt dieselben Daten auf zwei Laufwerke. RAID 10 verteilt Daten über mehrere solche Spiegelpaare; mindestens ein Mitglied jedes Paares muss intakt bleiben.\n\nParität ist zusätzliche Recheninformation, mit der fehlende Blöcke rekonstruiert werden können. RAID 5 verteilt Daten und eine Paritätsinformation pro Streifen; RAID 6 hat zwei unabhängige Paritätsinformationen. Diese liegen verteilt, nicht dauerhaft auf einer bestimmten Platte. Bei sechs gleich großen Laufwerken zu 3 TiB im RAID 6 entsprechen zwei Laufwerkskapazitäten der Redundanz. Vier bleiben für Nutzdaten: 4 × 3 TiB = 12 TiB.\n\nRAID 0 toleriert keinen Plattendefekt. RAID 1 mit zwei Laufwerken und RAID 5 tolerieren einen Plattendefekt. RAID 6 toleriert zwei beliebige Plattendefekte. Bei RAID 10 darf ein Mitglied je Paar ausfallen; beide Mitglieder desselben Paares zu verlieren bedeutet Datenverlust. Das gilt für aktive Platten, nicht für Löschungen, Controllerdefekte oder Gehäuseverlust.\n\nMit n aktiven Laufwerken und Größe s gilt idealisiert: RAID 0: n × s; RAID 1 mit zwei Laufwerken: s; RAID 5: (n − 1) × s; RAID 6: (n − 2) × s; RAID 10: (n / 2) × s, n gerade. Mindestzahlen: 2, 2, 3, 4, 4. Ein Hot Spare ist eine angeschlossene Reserve und zählt nicht zu n. Beim Rebuild wird der fehlende Inhalt auf Ersatz rekonstruiert. Ein weiterer Defekt kann die verbleibende Toleranz überschreiten; Dauer und Leistung sind ohne Messwerte unbekannt. Hier sind Dateisystem- und Metadatenkosten vernachlässigt.","es":"RAID significa Redundant Array of Independent Disks: varios discos se presentan como un almacenamiento conjunto. Un NAS (Network Attached Storage) comparte archivos por la red; un SAN (Storage Area Network) ofrece almacenamiento por bloques a servidores. En ambos casos un RAID puede proteger frente a fallos de discos. La capacidad bruta suma todos los discos; la útil descuenta el espacio dedicado a redundancia.\n\nUn bloque es una parte de los datos guardados. El striping reparte bloques consecutivos entre discos. RAID 0 solo reparte: no conserva información de repuesto. RAID 1 guarda los mismos datos en dos discos, como un espejo. RAID 10 reparte los datos entre varios pares de espejos; debe quedar al menos un disco sano en cada par.\n\nLa paridad es información adicional de cálculo que permite reconstruir bloques perdidos. RAID 5 distribuye una información de paridad por franja; RAID 6 utiliza dos independientes. Están repartidas entre discos, no siempre en un disco fijo. Si hay seis discos iguales de 3 TiB en RAID 6, el equivalente a dos discos se dedica a redundancia. Quedan cuatro para datos: 4 × 3 TiB = 12 TiB.\n\nRAID 0 no tolera que falle un disco. RAID 1 de dos discos y RAID 5 toleran un disco averiado. RAID 6 tolera cualesquiera dos discos averiados. En RAID 10 puede fallar uno de cada par, pero perder ambos discos del mismo par hace perder datos. Estas tolerancias describen discos activos, no borrados, averías del controlador ni pérdidas del chasis.\n\nCon n discos activos de tamaño s, el modelo ideal es: RAID 0: n × s; RAID 1 de dos discos: s; RAID 5: (n − 1) × s; RAID 6: (n − 2) × s; RAID 10: (n / 2) × s, con n par. Mínimos: 2, 2, 3, 4 y 4 discos. Un Hot Spare es una reserva conectada y no cuenta en n. El rebuild reconstruye el contenido perdido en el repuesto. Otra avería puede superar la tolerancia restante; sin mediciones no conocemos la duración ni el rendimiento. Aquí se omite el espacio del sistema de archivos y los metadatos."},"visual":"raid","check":{"de":"Fünf aktive Laufwerke zu 2 TiB im RAID 5 plus ein Hot Spare: Wie viel Nutzkapazität?","es":"Cinco discos activos de 2 TiB en RAID 5 más un Hot Spare: ¿cuánto espacio útil?"},"options":[{"de":"8 TiB","es":"8 TiB"},{"de":"10 TiB","es":"10 TiB"},{"de":"12 TiB","es":"12 TiB"}],"answer":0,"explain":{"de":"Nur fünf Laufwerke sind aktiv; die Parität benötigt eine Kapazität: (5 − 1) × 2 = 8 TiB. Zwei Defekte sind hier nicht garantiert tolerierbar.","es":"Solo cinco discos están activos; la paridad ocupa el equivalente a uno: (5 − 1) × 2 = 8 TiB. No se garantiza tolerar dos averías."}},{"title":{"de":"Platz für morgen","es":"Espacio para mañana"},"lead":{"de":"Vergleichen Sie Datenbedarf und zulässige Belegung in derselben Einheit und zum selben Zeitpunkt.","es":"Compara la cantidad de datos y la ocupación permitida en la misma unidad y en el mismo momento."},"body":{"de":"Ein Byte (B) umfasst acht Bit. Binäre Einheiten: 1 KiB = 1024 B, 1 MiB = 1024 KiB, 1 GiB = 1024 MiB, 1 TiB = 1024 GiB. In die größere Einheit teilen Sie je Stufe durch 1024; in die kleinere multiplizieren Sie. 512 GiB sind die Hälfte von 1024 GiB, also 0,5 TiB. Ein kommerzielles TB bedeutet 10¹² Byte; ein TiB bedeutet 2⁴⁰ Byte. 1 TiB = 1024 GiB. Ein Laufwerk mit 3 TB hat 3 × 10¹² / 2⁴⁰ ≈ 2,73 TiB. Dabei verschwinden keine Bytes: Nur die Einheit wechselt. Rundung erfolgt erst am Ende.\n\nBei 8 TiB Anfangsdaten und einem festen Zuwachs von 0,5 TiB pro Jahr kommen nach jedem vollständigen Jahr 0,5 TiB hinzu: nach drei Jahren 9,5 TiB. Mit Anfangsmenge D₀, jährlichem absoluten Zuwachs g und Anzahl Jahren y: D(y) = D₀ + y × g. Steigen Daten dagegen jedes Jahr um 10 %, wird jedes Mal die dann vorhandene Menge vergrößert: 8 → 8,8 → 9,68 TiB. Mit jährlicher Rate r als Dezimalzahl gilt D(y) = D₀ × (1 + r)ʸ.\n\n20 % frei bedeutet höchstens 80 % belegt. Bei 12 TiB Nutzkapazität entsprechen 100 % den 12 TiB; 1 % sind 0,12 TiB; 80 % sind 9,6 TiB. Der Bedarf 9,5 TiB passt, mit 0,1 TiB Abstand zur Grenze. Allgemein ist die erlaubte Belegung Nutzkapazität × erlaubter Anteil. Deduplizierung entfernt identische Kopien; Kompression codiert Inhalte platzsparender. Reduktionen benötigen Messwerte: Werden zuerst 25 % der Ursprungsmenge entfernt und anschließend 20 % der Restmenge, bleiben 0,75 × 0,80 = 0,60, also 60 %. Ohne Basis und Reihenfolge ist keine belastbare Einsparung berechenbar.\n\nFür eine Migration dürfen getrennte Bestände nach Einheitenumrechnung addiert werden: 4 TiB + 512 GiB = 4,5 TiB. Überlappende Dateien dürfen nicht doppelt gezählt werden. Rückwärts planen: Brauchen Daten 75 % der Nutzkapazität, sind 6 / 0,75 = 8 TiB netto nötig. Es können nur ganze Laufwerke eingebaut werden. ceil(x) bedeutet aufrunden: die kleinste ganze Zahl, die größer oder gleich x ist (Spanisch: redondear hacia arriba). Teilen Sie zuerst die benötigte Nutzkapazität durch die Kapazität je Laufwerk; addieren Sie danach die Paritätskapazitäten. Bei RAID 6 mit 2 TiB je Laufwerk: ceil(8/2)+2 = 6 aktive Laufwerke. Für 9 TiB netto: 9 / 2 = 4,5 Datenkapazitäten; ceil(4,5) = 5; 5 + 2 = 7 aktive Laufwerke. Kontrolle: (7 − 2) × 2 = 10 TiB ≥ 9 TiB. Der kleinere Kandidat mit sechs Laufwerken liefert nur (6 − 2) × 2 = 8 TiB < 9 TiB: nicht ausreichend. Nicht zur nächstgelegenen ganzen Zahl runden. RAID 10 benötigt Spiegelpaare: zuerst ceil(9 / 2) = 5 Datenkapazitäten, dann 2 × 5 = 10 Laufwerke mit 10 TiB Nutzkapazität; acht liefern nur 8 TiB. Beachten Sie außerdem die zuvor erklärten Mindestzahlen: RAID 5 mindestens drei, RAID 6 mindestens vier und RAID 10 mindestens vier Laufwerke und stets Paare. Der nächste Schritt vergleicht alle drei RAID-Level in Aufgabe 15.","es":"Un byte (B) agrupa ocho bits. En las unidades binarias: 1 KiB = 1024 B, 1 MiB = 1024 KiB, 1 GiB = 1024 MiB y 1 TiB = 1024 GiB. Para pasar a una unidad mayor divides por 1024 por cada escalón; para una menor multiplicas. Por eso 512 GiB son media unidad de 1024 GiB, es decir 0,5 TiB. Un TB comercial son 10¹² bytes; un TiB son 2⁴⁰ bytes. 1 TiB = 1024 GiB. Un disco de 3 TB equivale a 3 × 10¹² / 2⁴⁰ ≈ 2,73 TiB. No desaparecen bytes: cambia la unidad. Redondea solo al terminar.\n\nCon 8 TiB iniciales y un aumento fijo de 0,5 TiB por año, se añade la misma cantidad cada año completo: después de tres años hay 9,5 TiB. Si D₀ es la cantidad inicial, g el aumento anual absoluto e y los años, D(y) = D₀ + y × g. Si los datos crecen un 10 % anual, cada vez aumenta la cantidad que ya existe: 8 → 8,8 → 9,68 TiB. Con la tasa r en decimal: D(y) = D₀ × (1 + r)ʸ.\n\nDejar 20 % libre significa ocupar como máximo 80 %. Si 12 TiB representan el 100 %, el 1 % son 0,12 TiB y el 80 % son 9,6 TiB. Los 9,5 TiB caben: quedan 0,1 TiB hasta ese límite. En general, la ocupación permitida es la capacidad útil multiplicada por el porcentaje permitido. La deduplicación elimina copias idénticas; la compresión representa el contenido con menos espacio. Necesitas mediciones: si primero quitas 25 % de la cantidad original y después 20 % del resto, queda 0,75 × 0,80 = 0,60, es decir, 60 %. Sin base y orden no puedes calcular un ahorro fiable.\n\nPara migrar puedes sumar conjuntos distintos tras convertir unidades: 4 TiB + 512 GiB = 4,5 TiB. No cuentes archivos solapados dos veces. Planifica hacia atrás: si los datos deben usar el 75 % útil, 6 / 0,75 = 8 TiB útiles necesarios. Solo puedes instalar discos completos. ceil(x) significa redondear hacia arriba: el menor entero mayor o igual que x (alemán: aufrunden). Primero divide la capacidad útil necesaria entre la capacidad por disco; después añade las capacidades de paridad. En RAID 6 de 2 TiB por disco: ceil(8/2)+2 = 6 activos. Si necesitas 9 TiB útiles: 9 / 2 = 4,5 capacidades de datos; ceil(4,5) = 5; 5 + 2 = 7 discos activos. Verificación: (7 − 2) × 2 = 10 TiB ≥ 9 TiB. El candidato inferior, seis discos, solo da (6 − 2) × 2 = 8 TiB < 9 TiB: no basta. No redondees al entero más cercano. En RAID 10 necesitas pares espejo: primero ceil(9 / 2) = 5 capacidades de datos y luego 2 × 5 = 10 discos, que dan 10 TiB útiles; ocho solo dan 8 TiB. Respeta además los mínimos del nivel enseñados antes: RAID 5 al menos tres, RAID 6 al menos cuatro y RAID 10 al menos cuatro discos y siempre pares. La tarea 15 compara después los tres niveles."},"visual":"growth","check":{"de":"Was bedeutet „höchstens zu 75 % belegt“ bei 16 TiB Nutzkapazität?","es":"¿Qué significa «ocupado como máximo al 75 %» con 16 TiB útiles?"},"options":[{"de":"12 TiB Daten sind erlaubt","es":"Se permiten 12 TiB de datos"},{"de":"16 TiB Daten sind erlaubt","es":"Se permiten 16 TiB de datos"},{"de":"75 TiB Daten sind erlaubt","es":"Se permiten 75 TiB de datos"}],"answer":0,"explain":{"de":"16 / 100 × 75 = 12 TiB. Freier Platz und Redundanz sind verschieden: Die 16 TiB sind bereits die Kapazität nach RAID.","es":"16 / 100 × 75 = 12 TiB. El margen libre y la redundancia son distintos: los 16 TiB ya son el espacio después del RAID."}},{"title":{"de":"Den richtigen Zustand zurückholen","es":"Recuperar el estado pedido"},"lead":{"de":"Eine Sicherung ist nur dann nützlich, wenn sie zum Zielzustand gehört, vollständig vorhanden ist und erfolgreich restauriert werden kann.","es":"Una copia sirve si corresponde al estado buscado, está disponible completa y se puede restaurar correctamente."},"body":{"de":"Eine Vollsicherung enthält alle Dateien des Sicherungszeitpunkts. Eine inkrementelle Sicherung enthält Änderungen seit der letzten Sicherung, vollständig oder inkrementell. Eine differenzielle Sicherung enthält Änderungen seit der letzten Vollsicherung.\n\nBeispiel ohne Löschungen: Sonntag enthält F die Dateien A1 und B1. Montag wird A zu A2, Dienstag B zu B2, Mittwoch A zu A3. Die inkrementellen Kopien sind I-Mo: A2, I-Di: B2, I-Mi: A3. Für Dienstag auf einem leeren Ziel stellen Sie erst F, dann I-Mo, dann I-Di wieder her. F + I-Di allein ergibt A1 und B2: Der Montag fehlt. Mittwoch darf nicht benutzt werden, wenn Dienstag verlangt ist.\n\nBei differenzieller Sicherung enthält D-Di bereits A2 und B2. F + D-Di reicht für Dienstag. Die ältere differenzielle Kopie wird nicht zusätzlich benötigt. Die letzte differenzielle Kopie allein enthält unveränderte Dateien nicht sicher. Hier wird immer auf ein leeres Ziel restauriert; Kopien ersetzen enthaltene Dateien, sind fehlerfrei und gehören zur selben Vollsicherung. Löschungen und Software-Sonderverfahren sind nicht Bestandteil dieses Modells. Prüfen Sie im Betrieb den gewünschten Dateistand und die nutzbare Anwendung, nicht nur die Meldung „Backup erfolgreich“. Die Aufbewahrung entscheidet, ob die benötigte alte Kopie noch existiert.","es":"Una copia completa contiene todos los archivos del momento de la copia. Una incremental contiene los cambios desde la copia anterior, completa o incremental. Una diferencial contiene los cambios desde la última completa.\n\nEjemplo sin borrados: el domingo F contiene A1 y B1. El lunes A pasa a A2, el martes B a B2 y el miércoles A a A3. Las incrementales contienen I-Lu: A2, I-Ma: B2 e I-Mi: A3. Para recuperar el martes en un destino vacío, restaura F, luego I-Lu y luego I-Ma. F + I-Ma deja A1 y B2: falta el lunes. No uses la copia del miércoles si se pide el martes.\n\nLa diferencial D-Ma ya contiene A2 y B2. F + D-Ma basta para el martes; no hace falta otra diferencial anterior. Usar solo la última diferencial no garantiza recuperar los archivos que no cambiaron. Aquí siempre se restaura en un destino vacío; las copias reemplazan los archivos que contienen, están sanas y pertenecen a la misma completa. Los borrados y métodos especiales de software quedan fuera del modelo. En una empresa comprueba el estado de los archivos y que la aplicación funcione, no solo el mensaje «backup correcto». La retención determina si aún existe la copia antigua necesaria."},"visual":"backup","check":{"de":"Welche Kopien liefern im Beispiel den Dienstag bei inkrementeller Sicherung?","es":"¿Qué copias recuperan el martes en el ejemplo incremental?"},"options":[{"de":"F + I-Di","es":"F + I-Ma"},{"de":"F + I-Mo + I-Di","es":"F + I-Lu + I-Ma"},{"de":"F + I-Mi","es":"F + I-Mi"}],"answer":1,"explain":{"de":"Der Montag liefert A2, der Dienstag B2. Jede benötigte Zwischenkopie gehört zur Wiederherstellungskette.","es":"El lunes aporta A2 y el martes B2. Cada copia intermedia necesaria forma parte de la cadena de recuperación."}},{"title":{"de":"Verfügbarkeit im vereinbarten Zeitraum","es":"Disponibilidad en el periodo acordado"},"lead":{"de":"Verfügbarkeit beschreibt den Anteil der vereinbarten Servicezeit, in dem ein Dienst nutzbar ist. Sie ist keine Aussage über den Zustand alter Dateien.","es":"La disponibilidad indica qué parte del tiempo de servicio acordado estuvo utilizable el servicio. No informa del estado de archivos anteriores."},"body":{"de":"Legen Sie zuerst den Zeitraum und die Servicefenster fest. Beispiel: 20 vereinbarte Arbeitstage zu je 8 Stunden ergeben 160 Stunden Servicezeit. Wartung innerhalb dieser Fenster zählt im Beispiel als Ausfall; Zeiten außerhalb werden nicht bewertet. Bei 2 Stunden Ausfall bleiben 158 Stunden Betrieb. Von 160 Stunden sind 158 verfügbar: 158 / 160 × 100 = 98,75 %.\n\nMit gesamter Servicezeit T und Ausfallzeit d ist die Verfügbarkeit A = (T − d) / T. A ist zunächst ein Anteil; mal 100 ergibt Prozent. Bei mindestens 99 % Verfügbarkeit sind höchstens 1 % Ausfall erlaubt. 160 / 100 × 1 = 1,6 Stunden. Allgemein: erlaubter Ausfall = T × (1 − A). Ein Jahreswert darf nicht ohne Grundlage auf eine andere Servicezeit übertragen werden.\n\nDoppelte Netzteile helfen bei einem Netzteildefekt, wenn das verbleibende Netzteil die Last trägt. Zwei an derselben Steckdosenleiste haben jedoch eine gemeinsame Fehlerquelle. Ebenso schützt ein zweiter Server nicht vor dem Ausfall eines gemeinsam benötigten Switches. Für jede Maßnahme müssen Sie sagen: Welchen Defekt überbrückt sie, welche Voraussetzung braucht sie und welcher Ausfall bleibt möglich?","es":"Fija primero el periodo y las ventanas de servicio. Por ejemplo, 20 días de trabajo acordados de 8 horas son 160 horas de servicio. En este ejemplo el mantenimiento dentro de esas horas cuenta como caída; fuera de ellas no se evalúa. Con 2 horas de caída quedan 158 de funcionamiento. De 160 horas, 158 estuvieron disponibles: 158 / 160 × 100 = 98,75 %.\n\nSi T es el tiempo total de servicio y d la caída, la disponibilidad A = (T − d) / T. A es una proporción; multiplicarla por 100 la convierte en porcentaje. Para al menos 99 % disponible se permite como máximo 1 % de caída: 160 / 100 × 1 = 1,6 horas. En general, caída permitida = T × (1 − A). No traslades un porcentaje anual a otro periodo sin una base acordada.\n\nDos fuentes de alimentación ayudan cuando una falla si la otra puede sostener la carga. Pero si ambas están en la misma regleta, comparten un punto de fallo. Tampoco un segundo servidor evita la caída de un switch que los dos necesitan. Para cada medida explica qué avería cubre, qué condición necesita y qué fallo sigue siendo posible."},"visual":"availability","check":{"de":"400 h Servicezeit, mindestens 99,5 %: Wie viel Ausfall ist erlaubt?","es":"400 h de servicio, mínimo 99,5 %: ¿cuánta caída se permite?"},"options":[{"de":"2 h","es":"2 h"},{"de":"20 h","es":"20 h"},{"de":"0,5 h","es":"0,5 h"}],"answer":0,"explain":{"de":"0,5 % von 400 h = 2 h. Auch geplante Wartung zählt, wenn der Vertrag sie in der Servicezeit nicht ausschließt.","es":"El 0,5 % de 400 h son 2 h. El mantenimiento también cuenta si el acuerdo no lo excluye de las horas de servicio."}},{"title":{"de":"USV: Leistung und Laufzeit","es":"USV: potencia y autonomía"},"lead":{"de":"Die USV überbrückt einen kurzen Netzausfall oder ermöglicht geordnetes Herunterfahren. Die gesamte benötigte Dienstkette muss berücksichtigt werden.","es":"La USV mantiene la alimentación durante un corte breve o permite apagar ordenadamente. Hay que considerar toda la cadena que necesita el servicio."},"body":{"de":"Eine USV (Unterbrechungsfreie Stromversorgung) nutzt eine Batterie, um Geräte bei einem kurzen Netzausfall weiterzuversorgen oder ein geordnetes Herunterfahren zu ermöglichen. Alle für den Dienstzugriff benötigten Geräte müssen versorgt bleiben.\n\nWirkleistung P in Watt (W) beschreibt die tatsächlich benötigte Leistung. Scheinleistung S in Voltampere (VA) belastet die elektrische Versorgung. Der Wirkfaktor f = P / S verbindet beide. Bei bekanntem f gilt S = P / f. Prüfen Sie die W- und VA-Grenze der USV getrennt. 300 W mit f = 0,75 entsprechen 400 VA. Eine USV mit 360 W / 600 VA passt zur Last, sofern keine zusätzliche Reserve verlangt wird.\n\nLeistung ist noch keine Energie. 100 Wh nutzbare Batterieenergie können im idealen Modell bei 100 W eine Stunde liefern. Bei 300 W und 90 % Umwandlungswirkungsgrad kommen 100 × 0,90 = 90 Wh an der Last an. 90 Wh / 300 W = 0,30 h = 18 min. Nutzbare Energie ist hier vor dem Wechselrichter definiert; der Wirkungsgrad wird nur einmal angewendet. Für reale Batterien benötigen Sie Herstellerkurven oder Messwerte bei der tatsächlichen Last; Alter, Temperatur und Abschaltgrenzen können die Laufzeit verändern. VA allein verrät keine Minuten.\n\nZum Verständnis der Stromwege: AC (Alternating Current) bedeutet Wechselstrom (Spanisch: corriente alterna); seine Spannung wechselt periodisch die Polarität. DC (Direct Current) bedeutet Gleichstrom (corriente continua) mit fester Polarität. Die Spannung in Volt beschreibt die Potentialdifferenz; die Frequenz in Hertz die Anzahl der Wechselspannungsperioden pro Sekunde. Ein Gleichrichter wandelt AC in DC um. Ein Wechselrichter wandelt DC in AC für die Last, also die versorgten Geräte, um. Der DC-Zwischenkreis verbindet Gleichrichter und Wechselrichter; die Batterie ist an der Gleichspannungsseite angeschlossen und speichert Energie. Im Normalbetrieb muss nicht die gesamte Energie durch die Batterie fließen.\n\nOffline: VFD = Voltage and Frequency Dependent, spannungs- und frequenzabhängig (dependiente de tensión y frecuencia). Normalbetrieb: Netz AC → Filter/Umschalter → Last; die Ausgangsspannung und -frequenz hängen vom Eingang ab. Parallel lädt der Gleichrichter die Batterie. Netzausfall: Batterie DC → Wechselrichter → Umschalter → Last AC. Beim Wechsel des Stromwegs entsteht eine kurze Unterbrechung; deren Dauer hängt vom Gerät ab. Dies entspricht Schaltskizze B in Aufgabe 16.\n\nLine-Interactive: VI = Voltage Independent, spannungsunabhängig (independiente de tensión). Normalbetrieb: Netz AC → Spannungsregelung → Last; innerhalb des Regelbereichs wird die Spannung stabilisiert, die Ausgangsfrequenz hängt jedoch weiter von der Eingangsfrequenz ab. Parallel wird die Batterie geladen. Netzausfall: Batterie DC → Wechselrichter → Last AC durch Umschaltung. Im Batteriebetrieb erzeugt der Wechselrichter Spannung und Frequenz; VI bedeutet nicht Frequenzunabhängigkeit im Netzbetrieb.\n\nOnline: VFI = Voltage and Frequency Independent, spannungs- und frequenzunabhängig (independiente de tensión y frecuencia). Normaler Doppelwandlerbetrieb: Netz AC → Gleichrichter → DC-Zwischenkreis → Wechselrichter → Last AC. Der Wechselrichter erzeugt Ausgangsspannung und -frequenz innerhalb der Gerätespezifikation. Netzausfall: Batterie → derselbe DC-Zwischenkreis → derselbe Wechselrichter → Last. Die Last muss nicht vom direkten Netzpfad auf den Wechselrichter umgeschaltet werden; deshalb vermeidet dieser Stromweg die typische Umschaltpause. Dies entspricht Schaltskizze A in Aufgabe 16; die Batterieenergie bleibt begrenzt.\n\nEin Bypass (Umgehungsweg; ruta alternativa) führt Netz AC → Last an der Doppelwandlung vorbei, etwa für Wartung oder bei einer USV-Störung. Im Bypass hängt die Last wieder von diesem Netz ab: VFI garantiert dort weder Unabhängigkeit noch Unterbrechungsfreiheit. In den Schaltskizzen A/B ist kein Bypass gezeichnet. Für Betrieb ohne Pause prüfen Sie anhand der Herstellerdokumentation und durch Tests die Verfügbarkeit des Bypass-Netzes, Umschaltbedingungen und -zeiten sowie das Verhalten bei gleichzeitigem Ausfall dieses Netzes. Eine USV ersetzt weder Backup noch eine dauerhafte Stromversorgung.","es":"Una USV (Unterbrechungsfreie Stromversorgung), también llamada SAI, usa una batería para mantener equipos durante un corte breve o dar tiempo a apagarlos ordenadamente. Deben recibir alimentación todos los equipos necesarios para acceder al servicio.\n\nLa potencia activa P, en vatios (W), describe la potencia que necesita realmente la carga. La potencia aparente S, en voltamperios (VA), describe la carga eléctrica para la alimentación. El factor de potencia f = P / S relaciona ambas. Si conoces f, S = P / f. Comprueba por separado los límites W y VA de la USV. 300 W con f = 0,75 corresponden a 400 VA. Una USV de 360 W / 600 VA soporta esa carga si no se exige margen adicional.\n\nPotencia no es energía. En un modelo ideal, 100 Wh útiles de batería alimentan 100 W durante una hora. Para 300 W y 90 % de eficiencia de conversión llegan 100 × 0,90 = 90 Wh a la carga. 90 Wh / 300 W = 0,30 h = 18 min. La energía útil se define aquí antes del inversor; aplicas la eficiencia una sola vez. Para baterías reales necesitas curvas del fabricante o mediciones a la carga real; edad, temperatura y umbrales de apagado cambian la autonomía. VA por sí solo no indica minutos.\n\nPara entender las rutas: AC (Alternating Current) es corriente alterna (alemán: Wechselstrom); su tensión cambia de polaridad periódicamente. DC (Direct Current) es corriente continua (Gleichstrom), con polaridad fija. La tensión, en voltios, describe la diferencia de potencial; la frecuencia, en hercios, indica cuántos ciclos por segundo tiene la alterna. Un rectificador (Gleichrichter) convierte AC en DC. Un inversor (Wechselrichter) convierte DC en AC para la carga, es decir, los equipos alimentados. El circuito intermedio de continua (DC-Zwischenkreis) conecta rectificador e inversor; la batería está conectada al lado continuo y almacena energía. No es necesario que toda la energía atraviese la batería en funcionamiento normal.\n\nOffline: VFD = Voltage and Frequency Dependent, dependiente de tensión y frecuencia (spannungs- und frequenzabhängig). Normalmente: red AC → filtro/conmutador → carga; la salida depende de la tensión y frecuencia de entrada. En paralelo, el rectificador carga la batería. Al fallar la red: batería DC → inversor → conmutador → carga AC. Hay una breve pausa al cambiar de ruta; su duración depende del equipo. Esta es la ruta del esquema B de la tarea 16.\n\nLine-Interactive: VI = Voltage Independent, independiente de tensión (spannungsunabhängig). Normalmente: red AC → regulación de tensión → carga; dentro del rango de regulación estabiliza la tensión, pero la frecuencia de salida sigue dependiendo de la frecuencia de entrada. La batería se carga en paralelo. Al fallar la red: batería DC → inversor → carga AC mediante conmutación. En modo batería el inversor genera tensión y frecuencia; VI no significa independencia de frecuencia en modo red.\n\nOnline: VFI = Voltage and Frequency Independent, independiente de tensión y frecuencia (spannungs- und frequenzunabhängig). En doble conversión normal: red AC → rectificador → circuito intermedio DC → inversor → carga AC. El inversor genera la tensión y frecuencia de salida dentro de las especificaciones del equipo. Al fallar la red: batería → mismo circuito DC → mismo inversor → carga. No hace falta conmutar la carga de red directa al inversor: por eso esta ruta evita esa pausa típica. Es la ruta del esquema A de la tarea 16; la energía de batería sigue siendo limitada.\n\nUn bypass (Umgehungsweg) es una ruta alternativa red AC → carga que evita la doble conversión, por ejemplo para mantenimiento o ante una avería de la USV. Si se usa, la carga vuelve a depender de esa red: VFI no garantiza independencia ni continuidad en bypass. En los esquemas A/B no se dibuja el bypass. Para exigir servicio sin pausa, comprueba con documentación del fabricante y pruebas la disponibilidad de la red de bypass, las condiciones y tiempos de conmutación y qué ocurre si también falla esa red. Una USV no reemplaza un backup ni suministra electricidad indefinidamente."},"visual":"ups","check":{"de":"Nur „1000 VA“ bekannt: Kann man damit 15 Minuten Laufzeit zusichern?","es":"Solo sabemos «1000 VA»: ¿podemos garantizar 15 minutos?"},"options":[{"de":"Ja, VA entspricht Minuten","es":"Sí, VA equivale a minutos"},{"de":"Nein, Last und Laufzeitdaten fehlen","es":"No, faltan la carga y los datos de autonomía"}],"answer":1,"explain":{"de":"Es fehlen mindestens die Last und geeignete Laufzeitdaten. Die VA-Grenze prüft Belastbarkeit, nicht die gespeicherte Energie.","es":"Faltan al menos la carga y datos adecuados de autonomía. El límite VA comprueba la capacidad de alimentación, no la energía almacenada."}},{"title":{"de":"Plattform nach Anforderungen wählen","es":"Elegir plataforma según requisitos"},"lead":{"de":"Vergleichen Sie konkrete Angebote mit der Arbeitsweise und den Ausfallfolgen. Ein Produktname ist keine technische Begründung.","es":"Compara ofertas concretas con el modo de trabajo y las consecuencias de una caída. Un nombre de producto no es una justificación técnica."},"body":{"de":"Ein lokaler Dienst läuft im eigenen Netz. Ein ausgelagerter Dienst wird über die vereinbarte Verbindung beim Anbieter genutzt. Entscheidend sind nicht pauschale Versprechen, sondern benötigte Funktionen, Betrieb und Wiederherstellung. Muss die Werkstatt bei Internetausfall ihre Aufträge weiter öffnen, scheidet ein ausschließlich online nutzbares Angebot ohne lokale Arbeitsmöglichkeit aus. Ein lokaler Dienst braucht trotzdem Wartung, Backup und einen Plan für einen lokalen Defekt.\n\nEine Vergleichstabelle enthält deshalb Muss-Anforderungen, die zugesicherte Leistung jedes Angebots und verbleibende Risiken. Fehlen Zusagen zu Restore-Zeit oder Offline-Nutzung, markieren Sie diese als unbekannt. Ein Verfügbarkeitsversprechen des Anbieters stellt keine alte Datei wieder her und beweist keine Ende-zu-Ende-Verfügbarkeit über den eigenen Internetanschluss.\n\nFür eine kurze deutsche Begründung verbinden Sie drei Dinge: Anforderung → Eigenschaft → betriebliche Folge. Beispiel: „Ich wähle den lokalen Dienst, weil die Auftragsbearbeitung auch bei Ausfall der Internetverbindung möglich sein muss. Der Zugriff bleibt im LAN möglich; gegen den Ausfall des lokalen Servers sind jedoch weitere Maßnahmen nötig.“ Eine alternative Entscheidung ist gültig, wenn sie alle Muss-Anforderungen erfüllt oder ausdrücklich eine begründete Änderung der Anforderung voraussetzt. Eine nicht erfüllte Muss-Anforderung darf nicht verschwiegen werden.\n\nDie folgenden Aufgaben prüfen statt einer Cloud-Typwahl konkrete Dienstabhängigkeiten. RAID hält Daten bei bestimmten Plattendefekten verfügbar, aber nicht bei einem defekten Server. Ein unabhängiger zweiter Server benötigt aktuelle replizierte Daten und geprüftes Failover, damit er den Dienst übernehmen kann. Eine USV muss auch den Switch versorgen, sonst bleibt der gespeicherte Inhalt für Clients unerreichbar. Zwei Netzteile an derselben Stromleiste beseitigen keinen gemeinsamen Stromausfall. Aufgabe 13 verlangt drei erläuterte Maßnahmen; Aufgabe 19 verbindet sie mit Speicher und Backup, Aufgabe 20 verlangt die vollständige Entscheidung.","es":"Un servicio local funciona dentro de la red de la empresa. Un servicio externo se utiliza a través de la conexión acordada con el proveedor. Importan las funciones necesarias, la operación y la recuperación, no promesas generales. Si un taller debe abrir órdenes de trabajo cuando falla Internet, una oferta que solo funciona en línea y no permite trabajo local incumple ese requisito. Aun así, el servicio local necesita mantenimiento, backup y un plan para averías locales.\n\nLa tabla de comparación debe incluir requisitos obligatorios, prestaciones garantizadas de cada oferta y riesgos pendientes. Si no se garantiza el tiempo de restauración o el trabajo sin conexión, esos puntos son desconocidos. La disponibilidad del proveedor no recupera un archivo antiguo ni demuestra disponibilidad de extremo a extremo a través del acceso a Internet de la empresa.\n\nPara justificar en alemán une tres elementos: requisito → propiedad → consecuencia para el trabajo. Por ejemplo, se elige el servicio local porque hay que procesar órdenes aunque Internet falle; el acceso por LAN sigue posible, pero hacen falta medidas contra la avería del servidor local. Una alternativa es válida si cumple todos los requisitos obligatorios o declara expresamente que depende de un cambio justificado en un requisito. No puedes ocultar un requisito obligatorio que incumples.\n\nLas tareas siguientes examinan dependencias concretas del servicio, no elegir un tipo de cloud. RAID mantiene datos ante determinados discos averiados, no ante servidor averiado. Un segundo servidor independiente necesita datos actuales replicados y failover probado para asumir el servicio. La USV debe alimentar también el switch: sin red, los clientes no acceden a los datos. Dos fuentes en la misma regleta no eliminan el corte común. La tarea 13 pide tres medidas explicadas; la 19 las une a espacio y backup; la 20 pide una decisión completa."},"visual":"platform","check":{"de":"Der Anbieter garantiert 99,9 %; Ihr einziger Internetanschluss fällt aus. Ist der Zugriff damit garantiert?","es":"El proveedor garantiza 99,9 %; falla tu único acceso a Internet. ¿Está garantizado el acceso?"},"options":[{"de":"Ja","es":"Sí"},{"de":"Nein, der Zugangsweg bleibt eine Abhängigkeit","es":"No, la conexión sigue siendo una dependencia"}],"answer":1,"explain":{"de":"Der Anbieter kann erreichbar sein, obwohl Ihr Betrieb keine Verbindung hat. Anbieterleistung und eigene Zugriffskette getrennt prüfen.","es":"El proveedor puede funcionar aunque tu empresa no pueda conectarse. Comprueba por separado el proveedor y la cadena de acceso propia."}},{"title":{"de":"Eine Entscheidung vollständig herleiten","es":"Razonar una decisión completa"},"lead":{"de":"Ein durchgerechnetes Beispiel verbindet die vier Prüfungen. Jede Schlussfolgerung gilt nur unter den angegebenen Bedingungen.","es":"Este ejemplo resuelto une las cuatro comprobaciones. Cada conclusión depende de las condiciones indicadas."},"body":{"de":"Ein Planungsbüro benötigt nach drei vollständigen Jahren Platz für anfangs 8 TiB, jährlich kommen 512 GiB hinzu. Sechs aktive Laufwerke zu 3 TiB bilden RAID 6; ein siebtes ist Hot Spare. Mindestens 20 % der Nutzkapazität sollen frei bleiben. Die Aufträge müssen im LAN auch ohne Internet bearbeitbar sein.\n\n1. Platz: 512 / 1024 = 0,5 TiB pro Jahr. Bedarf: 8 + 3 × 0,5 = 9,5 TiB. RAID 6: (6 − 2) × 3 = 12 TiB. Erlaubt: 12 × 0,8 = 9,6 TiB. Es reicht knapp: 0,1 TiB Abstand zur Grenze. Die Reserveplatte bringt keinen zusätzlichen Platz. Zwei Plattendefekte sind tolerierbar, ein Serverausfall ist damit nicht abgedeckt.\n\n2. Wiederherstellung: Sonntag F, Montag I1 und Dienstag I2 sind geprüft vorhanden. Verlangt ist Dienstagabend, das Ziel ist leer. F → I1 → I2 liefert den Zustand. Ein Restore-Test muss diesen Zustand und die nutzbare Anwendung bestätigen.\n\n3. Dienst: Im vereinbarten Monat sind genau 400 h Servicezeit, Wartung darin zählt mit. 99,5 % erlaubt 400 × 0,005 = 2 h Ausfall. 1,25 h ungeplanter Ausfall plus 0,5 h Wartung = 1,75 h; der Zeitraum hält die Vorgabe ein.\n\n4. Strom: Server 240 W + NAS 140 W + Switch 20 W = 400 W. Gesamtwirkfaktor 0,8 ergibt 500 VA. Die angebotene USV mit 750 W / 1000 VA reicht bei geforderten 20 % freien Leistungsreserven: Grenzen 600 W und 800 VA. Im idealen Modell mit 160 Wh nutzbarer Batterieenergie vor dem Wechselrichter und 90 % Wirkungsgrad: 144 Wh / 400 W × 60 = 21,6 min. 12 min Überbrückung plus 6 min Herunterfahren passen im Modell. Vor Beschaffung sind reale Laufzeitdaten nötig.\n\nEntscheidung: lokaler Dienst wegen LAN-Arbeit ohne Internet, RAID 6 wegen zweier tolerierter Plattendefekte, getrennt aufbewahrtes geprüftes Backup für frühere Zustände, USV für Übergang und Herunterfahren. Keine dieser Maßnahmen ersetzt die anderen. Für eine unabhängige Probe öffnen Sie später Aufgabe 20, ohne dieses Beispiel daneben zu lassen.","es":"Una oficina de planificación tiene inicialmente 8 TiB y añade 512 GiB por año. Necesita espacio tras tres años completos. Seis discos activos de 3 TiB forman RAID 6 y un séptimo es Hot Spare. Debe quedar al menos 20 % del espacio útil libre. Es obligatorio trabajar por LAN aunque falle Internet.\n\n1. Espacio: 512 / 1024 = 0,5 TiB por año. Necesidad: 8 + 3 × 0,5 = 9,5 TiB. RAID 6: (6 − 2) × 3 = 12 TiB. Ocupación permitida: 12 × 0,8 = 9,6 TiB. Cabe por poco: 0,1 TiB hasta el límite. La reserva no añade espacio útil. Se toleran dos discos averiados, pero eso no cubre una avería del servidor.\n\n2. Recuperación: existen y se han comprobado F del domingo, I1 del lunes e I2 del martes. Se pide el martes por la noche en un destino vacío. F → I1 → I2 recupera ese estado. La prueba de restauración debe confirmar tanto ese estado como que la aplicación funcione.\n\n3. Servicio: el mes acordado contiene exactamente 400 h de servicio y el mantenimiento dentro de ellas cuenta. 99,5 % permite 400 × 0,005 = 2 h de caída. 1,25 h imprevistas más 0,5 h de mantenimiento son 1,75 h: se cumple en ese periodo.\n\n4. Electricidad: servidor 240 W + NAS 140 W + switch 20 W = 400 W. Con factor de potencia global 0,8 son 500 VA. La USV ofrecida de 750 W / 1000 VA sirve incluso dejando 20 % libre en cada límite: 600 W y 800 VA disponibles. Modelo ideal con 160 Wh útiles de batería antes del inversor y 90 % de eficiencia: 144 Wh / 400 W × 60 = 21,6 min. Caben 12 min de continuidad más 6 min de apagado. Antes de comprar se necesitan datos reales de autonomía.\n\nDecisión: servicio local para trabajar sin Internet, RAID 6 para tolerar dos discos averiados, backup comprobado guardado por separado para recuperar estados anteriores y USV para mantener temporalmente y apagar. Cada medida tiene una función distinta. Para una prueba independiente abre luego la tarea 20 sin este ejemplo visible."},"visual":"worked","check":{"de":"Welche Schlussfolgerung ist trotz aller Rechnungen noch nicht belegt?","es":"¿Qué conclusión sigue sin demostrarse a pesar de los cálculos?"},"options":[{"de":"Die reale USV-Laufzeit","es":"La autonomía real de la USV"},{"de":"Die modellierte Nutzkapazität","es":"El espacio útil del modelo"}],"answer":0,"explain":{"de":"21,6 min ist ein idealer Modellwert. Eine Herstellerkurve oder ein geeigneter Lasttest muss die reale Laufzeit bestätigen.","es":"21,6 min es un resultado ideal del modelo. Una curva del fabricante o una prueba adecuada con carga debe confirmar la autonomía real."}}],"tasks":[{"id":1,"title":{"de":"Druckerei: NAS","es":"Imprenta: NAS"},"context":{"de":"Eine Druckerei erneuert ihr NAS. Auch beim Defekt einer Platte soll weitergearbeitet werden.","es":"Una imprenta renueva su NAS. Debe seguir trabajando si un disco falla."},"rows":[[{"de":"Aktiver Verbund","es":"Conjunto activo"},{"de":"6 × 2 TiB, RAID 5","es":"6 × 2 TiB, RAID 5"}],[{"de":"Reserve","es":"Reserva"},{"de":"1 × 2 TiB Hot Spare","es":"1 × 2 TiB Hot Spare"}],[{"de":"Bedarf / Grenze","es":"Necesidad / límite"},{"de":"8 TiB / höchstens 80 % belegt","es":"8 TiB / ocupación máxima 80 %"}]],"prompt":{"de":"Berechnen Sie Nutzkapazität und Belegungsgrenze; begründen Sie die Eignung und eine verbleibende Grenze.","es":"Calcula espacio útil y ocupación máxima; justifica si sirve y una limitación pendiente."},"fields":[{"label":{"de":"Nutzkapazität","es":"Espacio útil"},"kind":"num","answer":10,"unit":"TiB","why":{"de":"Zählen Sie nur aktive Platten und ziehen Sie eine Kapazität für Parität ab.","es":"Cuenta solo discos activos y descuenta el equivalente a uno para paridad."},"pts":0,"tol":0.005,"manualPts":2,"part":"a","sampleWork":"(6 − 1) × 2 = 10 TiB; 10 × 0,8 = 8 TiB. Der Bedarf liegt genau an der Grenze. RAID 5 toleriert einen Plattendefekt, aber speichert auch versehentliche Änderungen. Ein geprüftes Backup ist für frühere Zustände erforderlich."},{"label":{"de":"Maximale Belegung","es":"Ocupación máxima"},"kind":"num","answer":8,"unit":"TiB","why":{"de":"80 % beziehen sich auf die Nutzkapazität nach RAID.","es":"El 80 % se aplica al espacio útil después del RAID."},"pts":0,"tol":0.005,"manualPts":2,"part":"a","sampleWork":"(6 − 1) × 2 = 10 TiB; 10 × 0,8 = 8 TiB. Der Bedarf liegt genau an der Grenze. RAID 5 toleriert einen Plattendefekt, aber speichert auch versehentliche Änderungen. Ein geprüftes Backup ist für frühere Zustände erforderlich."}],"essay":{"de":"Schreiben Sie auf Deutsch: Reicht es, welcher Defekt ist abgedeckt und warum fehlt trotzdem ein Backup?","es":"Escribe en alemán: ¿cabe?, ¿qué avería cubre?, ¿por qué aún necesita backup?"},"criteria":[{"text":{"de":"a) Nutzkapazität: 10 TiB lpunkt. Jede verbleibende Quelle muss die Last tragen. RAID 6 ersetzt weder diese Dienstkette noch ein Backup für frühere Dateistände.","es":"Una USV adecuada alimenta servidor y switch en cortes breves; comprobar carga y autonomía. Un segundo servidor en cluster asume el servicio ante avería; necesita replicación y failover probado. Fuentes redundantes necesitan rutas adecuadas independientes; la regleta común sigue siendo fallo común. Cada fuente restante debe soportar la carga. RAID 6 no sustituye esta cadena ni el backup de estados anteriores."},"hint":{"de":"Verfolgen Sie vom Arbeitsplatz zum Dienst jede Abhängigkeit und ihre Versorgung.","es":"Sigue desde el puesto hasta el servicio cada dependencia y su alimentación."},"ref":"KAIT Sommer 2024 · 4c","sections":[{"id":"a","title":{"de":"Erläutern Sie drei technische Maßnahmen in getrennten Absätzen.","es":"Explica tres medidas técnicas en párrafos separados."},"points":6}],"warmup":false,"kind":"table","essayPart":"a","points":6,"prompt":{"de":"Bearbeiten Sie die folgenden Teilaufgaben.","es":"Resuelve los apartados siguientes."},"pointsNote":{"de":"Eigene Übungsskala; keine offiziellen Punkte für diese Variante.","es":"Escala propia de práctica; estos puntos no son oficiales de la variante."}},{"id":14,"title":{"de":"Verlag: zwei Sicherungsmethoden","es":"Editorial: dos métodos de copia"},"context":{"de":"Ein Verlag vergleicht inkrementelle und differenzielle Tagessicherungen. Am Sonntag wurde eine Vollsicherung erstellt. Montag und Dienstag wurden unterschiedliche Dateien geändert; keine Dateien wurden gelöscht. Beide Verfahren werden alternativ auf denselben Daten getestet.","es":"Una editorial compara copias incrementales y diferenciales diarias. El domingo hizo una completa. Lunes y martes cambió archivos distintos; no hubo borrados. Prueba ambos métodos alternativamente sobre los mismos datos."},"rows":[[{"de":"Restore-Messzeiten","es":"Tiempos medidos de restauración"},{"de":"F: 30 min; I-Mo: 8 min; I-Di fer (2 P für Vergleich und Konsequenz, Berechnung separat).","es":"Necesidad 12 TiB ≤ techo 12 TiB: B cumple justo la reserva; sin margen de crecimiento adicional (2 p por comparación y consecuencia, cálculo separado)."},"pts":2,"part":"d"},{"text":{"de":"B toleriert zwei beliebige Plattendefekte. A verletzt dies; C verletzt Server-Failover (2 P).","es":"B tolera dos fallos cualesquiera; A incumple eso y C incumple el failover de servidor (2 p)."},"pts":2,"part":"d"},{"text":{"de":"F → I-Mo → I-Di, Test; 58 ≤ 60 min, gesondertes Backup bleibt notwendig (2 P).","es":"F → I-Lu → I-Ma, prueba; 58 ≤ 60 min; sigue necesitando backup separado (2 p)."},"pts":2,"part":"d"},{"text":{"de":"105 min zählen; ≤120 min, Monatsziel erfüllt, keine Jahreszusage (1 P).","es":"Cuenta 105 min; ≤120, cumple mes, no promete año (1 p)."},"pts":1,"part":"d"},{"text":{"de":"600 W ≤ 720 W und 800 VA ≤ 960 VA; beide Leistungsgrenzen erfüllt. 21 ≥ 20 min erfüllt den Ablauf nur im Modell (2 P für Vergleich und Einordnung, Grenzwertberechnungen separat).","es":"600 W ≤ 720 W y 800 VA ≤ 960 VA: cumple ambos límites. 21 ≥ 20 min cumple la secuencia solo en modelo (2 p por comparación y alcance, cálculos de límites separados)."},"pts":2,"part":"d"},{"text":{"de":"Reale Laufzeit vor Zusicherung prüfen; RAID/Backup/USV decken unterschiedliche Risiken ab (1 P).","es":"Comprobar autonomía real antes de garantizar; RAID/backup/USV cubren riesgos distintos (1 p)."},"pts":1,"part":"d"},{"text":{"de":"d) Maximale Belegung von Angebot B: 15 × (1 − 0,20) = 12 TiB. 1 P für nachvollziehbaren Rechenweg, 1 P für Ergebnis und Einheit.","es":"d) Ocupación máxima de la oferta B: 15 × (1 − 0,20) = 12 TiB. 1 p por procedimiento comprensible, 1 p por resultado y unidad."},"pts":2,"part":"d"},{"text":{"de":"d) Zulässige USV-Last mit Reserve: 900 × (1 − 0,20) = 720 W. 1 P für nachvollziehbaren Rechenweg, 1 P für Ergebnis und Einheit.","es":"d) Carga W admisible USV con reserva: 900 × (1 − 0,20) = 720 W. 1 p por procedimiento comprensible, 1 p por resultado y unidad."},"pts":2,"part":"d"},{"text":{"de":"d) Zulässige USV-Scheinleistung mit Reserve: 1200 × (1 − 0,20) = 960 VA. 1 P für nachvollziehbaren Rechenweg, 1 P für Ergebnis und Einheit.","es":"d) Potencia VA admisible USV con reserva: 1200 × (1 − 0,20) = 960 VA. 1 p por procedimiento comprensible, 1 p por resultado y unidad."},"pts":2,"part":"d"}],"model":{"de":"Ich empfehle B. Für die Migration sind 9 + 3072 / 1024 = 12 TiB nötig. A liefert 18 TiB netto, B 15 TiB; mit 20 % frei erlaubt B genau 12 TiB. B toleriert zwei beliebige aktive Plattendefekte. A erfüllt diese Muss-Anforderung nicht, C besitzt keinen Failover-Server; RAID schützt nicht vor einem Serverdefekt. Für Dienstag stelle ich F, I-Mo und I-Di nacheinander wieder her und teste die Anwendung: 28 + 8 + 12 + 10 = 58 min, also innerhalb 60 min. Ein getrennt aufbewahrtes geprüftes Backup bleibt für frühere Zustände und Gehäuseverlust nötig. Im 500-h-Monat sind 500 × 0,004 × 60 = 120 min Ausfall erlaubt; 105 min halten das Ziel ein. Die Last beträgt 600 W und 600 / 0,75 = 800 VA. Die USV erlaubt bei 20 % freier Reserve 720 W und 960 VA. Ideal liefert sie 250 × 0,84 / 600 × 60 = 21 min; 15 + 5 = 20 min passen. Vor einer realen Zusicherung brauche ich passende Herstellerdaten oder einen Lasttest. Speicherreserve, Fehlertoleranz, Restore und Stromversorgung sind getrennt nachgewiesen. Grenzwerte: 15 × 0,8 = 12 TiB; 900 × 0,8 = 720 W; 1200 × 0,8 = 960 VA. B erfüllt den Server-Failover durch den unabhängigen zweiten Server, aktuelle Replikation und die geprüfte Übernahme. C hat nur einen Server; zusätzliche Plattentoleranz beseitigt diesen Ausfallpunkt nicht.","es":"Recomiendo B. Para migración: 9 + 3072 / 1024 = 12 TiB. A da 18 TiB útiles, B 15; dejando 20 % libre, B permite justo 12. B tolera dos discos activos averiados cualesquiera. A incumple eso y C carece de segundo servidor de failover; RAID no cubre una avería de servidor. Para el martes restauro F, I-Lu e I-Ma y pruebo aplicación: 28 + 8 + 12 + 10 = 58 min, dentro de 60. Sigue siendo necesario backup comprobado separado para estados anteriores y pérdida del chasis. En el mes de 500 h se permite 500 × 0,004 × 60 = 120 min; las 105 min cumplen. La carga es 600 W y 800 VA. Con 20 % libre la USV permite 720 W y 960 VA. Autonomía ideal: 250 × 0,84 / 600 × 60 = 21 min; caben 15 + 5 = 20. Antes de garantizarlo en realidad necesito datos de fabricante o prueba con carga. Margen, tolerancia, restore y alimentación se verifican por separado. Límites: 15 × 0,8 = 12 TiB; 900 × 0,8 = 720 W; 1200 × 0,8 = 960 VA. B cumple failover mediante segundo servidor independiente, replicación actual y toma de servicio probada. C solo tiene un servidor; tolerar más discos no elimina ese punto de fallo."},"hint":{"de":"Prüfen Sie jede Muss-Anforderung einzeln und verknüpfen Sie danach die Ergebnisse.","es":"Comprueba cada requisito obligatorio por separado y después une los resultados."},"ref":"KAIT Sommer 2024 · 4da–db / KAIT Sommer 2022 · 4ea / KAIT Sommer 2024 · 4c / KAIT Sommer 2023 · 2aa–ac (bearbeitete Antworten nicht offiziell)","kind":"dossier","points":33,"sections":[{"id":"a","title":{"de":"Berechnen Sie Bedarf und Nutzkapazität der lokalen Angebote. Wählen Sie ein Angebot. Der Rechenweg ist je Rechnung anzugeben.","es":"Calcula necesidad y capacidad útil de las ofertas locales; elige una. Muestra cada cálculo."},"points":7},{"id":"b","title":{"de":"Berechnen Sie Wiederanlaufzeit inklusive Test und die erlaubte monatliche Ausfallzeit. Der Rechenweg ist anzugeben.","es":"Calcula tiempo de recuperación incluida la prueba y caída mensual permitida. Muestra cada procedimiento."},"points":4},{"id":"c","title":{"de":"Berechnen Sie W, VA und ideale Autonomie. Der Rechenweg ist jeweils anzugeben.","es":"Calcula W, VA y autonomía ideal. Muestra cada cálculo."},"points":6},{"id":"d","title":{"de":"Berechnen Sie die maximale Belegung von Angebot B sowie die zulässige USV-Last in W und VA nach jeweils 20 % function normalizeAnswer(raw){return String(raw).normalize('NFKC').trim().toLowerCase().replace(/(?:→|->|\+)/g,' ').replace(/[\s-]+/g,'').replace(/\.$/,'');}
function evaluate(q,s){return q.fields.map((f,i)=>{const raw=String(s.answers[i]??'').trim();if(!raw)return 'blank';if(f.kind==='prose')return 'pending';if(f.kind==='text')return f.aliases.some(x=>normalizeAnswer(x)===normalizeAnswer(raw))?'right':'wrong';let value=raw;if(unit(f)&&!['Laufwerke','discos','Jahre','años'].includes(unit(f))){const suffix=new RegExp('\\s*'+unit(f).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*$','i');value=value.replace(suffix,'');}const n=parseNumber(value);if(q.id===5)return /^[+-]?\d+[.,]\d{2}$/.test(value.trim())&&Number.isFinite(n)&&n===f.answer?'right':'wrong';return Number.isFinite(n)&&(!f.integer||Number.isInteger(n))&&Math.abs(n-f.answer)<=f.tol+1e-9?'right':'wrong';});}
function checkTask(q){const s=ts(q),result=evaluate(q,s),essayBlank=!s.essay.trim(),missingWork=q.fields.map((f,i)=>f.kind==='num'&&!String(s.work[i]||'').trim()?i:null).filter(i=>i!==null);s.feedback={result,essayBlank,missingWork};s.attempts.push({at:stamp(),answers:{...s.answers},work:{...s.work},essay:s.essay,result:[...result],missingWork,helpUsed:s.help.length>0,help:[...s.help],self:{...s.self}});ev('check',{task:q.id});save();paintFeedback(q,s.feedback);status(q);}

function showInfo(type){if(state.page>=N)help(type==='plan'?'study-route':'sources');$('info-close').textContent=tx('Schließen','Cerrar');$('info-title').textContent=type==='plan'?tx('Lernweg · eine Stunde','Ruta de estudio · una hora'):tx('Quellen & Aufgabenbezug','Fuentes y relación con tareas');$('info-content').innerHTML=type==='plan'?`<p>${tx('Vorschlag für 60 Minuten, ohne Zeitdruck:','Propuesta para 60 minutos, sin cronómetro:')}</p><ol><li>${tx('12 min: Erklärungen 1–8 reaktivieren, Kurzfragen beantworten. Bei unbekannten Grundlagen länger lesen und Aufgaben verschieben.','12 min: reactivar explicaciones 1–8 y responder comprobaciones. Si los fundamentos son nuevos, dedica más tiempo y aplaza tareas.')}</li><li>${tx('10 min: Aufgaben 1–4, Rechnung und kurze deutsche Begründung.','10 min: tareas 1–4, cálculo y breve justificación alemana.')}</li><li>${tx('12 min: Aufgaben 5–8, Einheiten und Backup-Zustände.','12 min: tareas 5–8, unidades y estados de backup.')}</li><li>${tx('8 min: Aufgaben 9–10, Servicezeit und gemeinsame Fehler.','8 min: tareas 9–10, tiempo de servicio y fallos comunes.')}</li><li>${tx('13 min: direkt zu Aufgabe 20, ohne geöffnetes Beispiel. Jede Hilfe protokollieren.','13 min: ir directamente a tarea 20, sin ejemplo abierto. Registrar cada ayuda.')}</li><li>${tx('5 min: Kriterien vergleichen, offene Beziehungen notieren, exportieren.','5 min: comparar criterios, anotar dudas y exportar.')}</li></ol><p>${tx('Aufgaben 11–19 sind zusätzliche Praxis. Wiederholen Sie nach einigen Tagen eine Variante zunächst ohne Hinweise. Die Zeitaufteilung ist ein Vorschlag, kein gemessener Lernaufwand. Technische Tests belegen kein Lernen.','Tareas 11–19 son práctica extra. Tras varios días repite una variante primero sin pistas. Los tiempos son una propuesta, no una medición. Las pruebas técnicas no demuestran aprendizaje.')}</p>`:`<p>${tx('Alle Aufgaben sind neu erstellt, keine offiziellen IHK-Aufgaben. Die Punktverteilung dient der Übung.','Todas las tareas son propias, no oficiales de IHK. Los puntos sirven para practicar.')}</p><ul><li>03b Grundstufe LF3–5 (2020): ${tx('S.','pp.')} 362–368 (PDF 86–92), 371–375 (PDF 95–99), 378 (PDF 102); 377, 379–382 (PDF 101, 103–106; AC/DC, VFD/VI/VFI, Bypass). RAID, Backup, Verfügbarkeit, Stromgrößen. ${tx('Errata: differenzieller Restore benötigt F UND D; 99,9 % bei 365 Tagen/24 h erlaubt 8,76 h, nicht vier Tage.','Erratas: restore diferencial requiere F Y D; 99,9 % con 365 días/24 h permite 8,76 h, no cuatro días.')}</li><li>Kersken IT-Handbuch (2023), ${tx('S.','pp.')} 130–131, 209–210: ${tx('Einheiten und RAID-Prinzipien als Gegenvergleich. Keine pauschalen Leistungsversprechen übernommen.','unidades y principios RAID como contraste. No se trasladan promesas generales de rendimiento.')}</li><li>KAIT Sommer 2022 · 4ea: ${tx('Aufgabe PDF 9, offizielle Lösung PDF 5; beide Backup-Methoden erläutern. Sommer 2024 · 4c: Aufgabe PDF 10, offizielle Lösung PDF 4; drei technische Maßnahmen erläutern. 4da–db: Aufgabe PDF 10–11, offizielle Lösung PDF 5; RAID 10/5/6 berechnen und das Minimum nennen.','Pregunta PDF 9, solución oficial PDF 5; explicar ambos métodos de backup. Sommer 2024 · 4c: pregunta PDF 10, solución oficial PDF 4; explicar tres medidas técnicas. 4da–db: pregunta PDF 10–11, solución oficial PDF 5; calcular RAID 10/5/6 e identificar el mínimo.')}</li><li>${tx('Geprüfte gleichwertige Kerne: T13, T14a, T15a–b, T16a–b und T19c. Andere Teile sind Vorübungen, Erweiterungen oder eigene Anwendungen. SLA-Prozentwerte und W/VA/Wh-Rechnungen sind keine gleichwertigen Originalaufgaben. Nicht alle 20 Aufgaben sind offizielle Entsprechungen.','Núcleos equivalentes comprobados: T13, T14a, T15a–b, T16a–b y T19c. Los demás apartados son preparación, ampliación o aplicaciones propias. Los porcentajes SLA y cálculos W/VA/Wh no equivalen a los originales. No hay 20 equivalencias oficiales.')}</li><li>KAIT Sommer 2023 · 2aa–ab: ${tx('annotierte Aufgabe PDF 4; Anmerkungen und Antworten nicht offiziell. Mit dem Original der offiziellen Lösung PDF 3 aus dem exakt geprüften ZIP-Mitglied gepaart. Zwei Schaltbilder benennen und die Typentabelle ausfüllen; T16c ist eine eigene Erweiterung, nicht 2ac.','Pregunta anotada PDF 4; anotaciones y respuestas no oficiales. Pareada con el original de la solución oficial PDF 3 del miembro ZIP exacto verificado. Nombrar dos esquemas y completar la tabla de tipos; T16c es ampliación propia, no 2ac.')}</li><li>Rosenshine (2012), Principles of Instruction: ${tx('Reaktivierung, Modell, gestufte Praxis.','reactivación, modelo, práctica gradual.')} IES (2007), Organizing Instruction and Study, ${tx('Empfehlungen','recomendaciones')} 2–4, 6–7. Nation (2007), Four Strands: ${tx('Bedeutung verstehen, Deutsch produzieren, Fachsprache verbinden.','comprender significado, producir alemán y conectar vocabulario.')}</li><li>${tx('Didaktische Recherche: Mayer / Fiorella (Cambridge, 2021), Principles for Reducing Extraneous Processing. Benachbarte Beschriftungen, relevante Abbildungen, keine dekorativen Animationen. Microsoft Learn: Implement disaster recovery in Windows Server on-premises and hybrid environments, als Vergleich des Ausbildungsaufbaus. Keine Cloud-Lektion übernommen.','Investigación didáctica: Mayer / Fiorella (Cambridge, 2021), Principles for Reducing Extraneous Processing. Etiquetas cercanas, figuras pertinentes, sin animación decorativa. Microsoft Learn: Implement disaster recovery in Windows Server on-premises and hybrid environments, para comparar la organización de formación; no se añade lección de nube.')}</li></ul><p>${tx('Genaue Quellen und aktuelle Zuordnung: REPORTE-taller.md neben dieser Datei. Historische Prüfungen sind getrennt ausgewiesen; vollständige Sichtprüfung und integrale Abnahme stehen aus.','Fuentes exactas y matriz actual: REPORTE-taller.md junto a este archivo. Las comprobaciones históricas se distinguen; revisión visual completa y aceptación integral pendientes.')}</p>`;$('info-dialog').showModal();}
function exportData(){ev('export');save();const payload={artifact:'FISI AP2 · 2026-10-17',exportedAt:stamp(),writtenAssessment:'self-or-partner; never keyword scored',storagePersistent:persistent,...state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fisi-2026-10-17-respuestas-notas.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

$('prev').onclick=()=>{if(state.page>0)navigate(state.page-1);};$('next').onclick=()=>{if(state.page<TOTAL-1)navigate(state.page+1);};$('es-btn').onclick=()=>setLang('es');$('de-btn').onclick=()=>setLang('de');$('notes-btn').onclick=openNotes;$('notes-text').oninput=()=>{state.notes[state.page]=$('notes-text').value;save();};$('notes-close').onclick=()=>$('notes-dialog').close();$('info-close').onclick=()=>$('info-dialog').close();$('sources-btn').onclick=()=>showInfo('sources');$('plan-btn').onclick=()=>showInfo('plan');$('export-btn').onclick=exportData;render();
