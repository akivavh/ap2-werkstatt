 if(pageIndex===0){body.className='entry';body.innerHTML=`<div class="entry-cards"><div class="entry-card"><span class="meta">Im Betrieb</span><h3>Wiederkehrende Prüfungen</h3><p>Ein FISI prüft Serverwerte automatisch. Bedingungen wählen Aktionen; Schleifen wiederholen sie.</p></div><div class="entry-card"><span class="meta">In der IHK</span><h3>Werte schrittweise verfolgen</h3><p>Sommer 2024 KAIT, 3aa: Tabelle für <code>max</code> und <code>max2</code> vervollständigen.</p></div><div class="entry-card"><span class="meta">Dein Ziel</span><h3>Ausführen und begründen</h3><p>Danach kannst du Grenzen prüfen, Durchläufe zählen und einen Zuweisungsfehler schriftlich erklären.</p></div></div><figure class="figure-stage">${svgStart('Messdaten bestimmen den gewählten Ablauf, der die Variablenzustände in der Tabelle erzeugt',960,216)+edge('M224 112H368','steuern',296,48)+edge('M592 112H736','dokumentiert',664,48)+rectNode(16,72,208,80,'Messdaten')+rectNode(368,72,224,80,'Bedingung + Schleife',true)+rectNode(736,72,208,80,'Tabelle der Zustände')+'</svg>'}<figcaption>Fig. 1 · Die Tabelle dokumentiert den ausgeführten Ablauf.</figcaption><div class="entry-footer"><span>60 Minuten · 20 Aufgaben · 16–17 zusätzlich</span><span>Modell ohne echte Systemeingriffe</span></div></figure>`;return}
 body.className='teach';

 if(pageIndex===2){const run=model(LESSONS.loop),phases=[0,...run.rows.flatMap(()=>[1,2,3]),4],values=[LESSONS.loop.start,...run.rows.flatMap(r=>[r[1],r[1],r[2]]),run.fields[1].value];const caps=['Start: i = 0; noch kein Versuch.','0 < 3 ist wahr: der Rumpf darf starten.','Versuch 1 wird ausgeführt.','i wird von 0 auf 1 erhöht.','1 < 3 ist wahr: nächste Runde.','Versuch 2 wird ausgeführt.','i wird von 1 auf 2 erhöht.','2 < 3 ist wahr: letzte Runde.','Versuch 3 wird ausgeführt.','i wird von 2 auf 3 erhöht.','3 < 3 ist falsch: Ende ohne weiteren Versuch.'];fig=loopFigure(phases[step]);controls=`<p>Die Struktur bleibt sichtbar; der aktive Knoten zeigt den aktuellen Vorgang.</p><pre class="code">i = 0;\nwhile (i < 3) {\n  versuchen();\n  i = i + 1;\n}</pre><div class="step-caption">${caps[step]}</div>${tableProvided(['Variable','Aktueller Wert'],[['i',values[step]],['Versuche',Math.floor((step+1)/3)]])}${stepButtons(10)}`}
 if(pageIndex===3){const calculated=model(LESSONS.for),rows=[['Start',0,0],...calculated.rows.map(r=>['Runde '+r[0],r[0]+1,r[2]])];fig=forFigure(step,rows);controls=`<p>Start getrennt; Werte jeweils <strong>nach der Runde</strong>.</p><pre class="code">summe = 0;\nfor (i = 0; i < 3; i++) {\n  summe = summe + i;\n}</pre><table><thead><tr><th>Stand</th><th>i danach</th><th>summe</th></tr></thead><tbody>${rows.map((r,k)=>`<tr class="${k===Math.min(step,3)?'current-row':''}">${r.map(x=>`<td>${k<=step?x:'—'}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="step-caption">${['Start einmal: i = 0, summe = 0.','Prüfe 0 < 3; addiere 0; erhöhe i.','Prüfe 1 < 3; addiere 1; erhöhe i.','Prüfe 2 < 3; addiere 2; erhöhe i.','Prüfe 3 < 3: falsch. Keine weitere Zeile.'][step]}</div>${stepButtons(4)}`}
 if(pageIndex===4){const vals=LESSONS.count.values,counts=[0,...model(LESSONS.count).rows.map(r=>r[2])],index=Math.max(0,step-1);fig=svgStart('Drei CPU-Werte durchlaufen die Bedingung größer 80 und verändern den Trefferzähler',560,344)+edge('M176 80H264','liest',220,56)+edge('M352 112V216','zählt bei wahr',424,168)+edge('M264 80H224V280H264','behält bei falsch',142,196)+rectNode(16,48,160,64,step===0?'Start: treffer = 0':`Wert [${index}]: ${vals[index]}`,true)+rectNode(264,48,176,64,'wert > 80?',step>0)+rectNode(264,216,176,64,`treffer: ${counts[step]}`,step===2)+`<text x="72" y="320">Grenze 80 zählt hier nicht.</text></svg>`;controls=`${strip(vals,'CPU-Werte')}<pre class="code">treffer = 0;\nfor (i = 0; i < 3; i++) {\n  if (werte[i] > 80) treffer++;\n}</pre><table><thead><tr><th>i</th><th>Wert</th><th>treffer danach</th></tr></thead><tbody>${vals.map((v,i)=>`<tr class="${step===i+1?'current-row':''}"><td>${i}</td><td>${v}</td><td>${step>i?counts[i+1]:'—'}</td></tr>`).join('')}</tbody></table><div class="step-caption">${['Initialisierung: treffer = 0.','20 > 80 ist falsch: treffer bleibt 0.','90 > 80 ist wahr: treffer wird 1.','80 > 80 ist falsch: treffer bleibt 1.'][step]}</div>${stepButtons(3)}`}
 body.innerHTML=`<figure class="figure-stage" id="teaching-figure">${fig}<figcaption>Fig. ${pageIndex+1} · ${['','Nur der passende Zweig wird ausgeführt.','Nach der Änderung wird erneut geprüft.','Die Tabelle hält den Zustand nach der Runde fest.','Nichttreffer verändern den Zähler nicht.'][pageIndex]}</figcaption></figure><div class="teach-controls">${controls}</div>`;
 if(pageIndex>1){const cap=body.querySelector('.step-caption');const prose=body.querySelector('.teach-controls > p');if(prose){body.querySelector('figcaption').append(document.createElement('br'),prose);prose.className='caption-rule'}body.querySelector('figure').append(cap)}
 if(pageIndex===1)$('#live').oninput=e=>{live=+e.target.value;$('#live-value').textContent=live+' %';$('#live-caption').textContent=`${live} >= 80 ist ${truth(live>=80)}. Ausgabe: ${live>=80?'Warnung':'OK'}.`;$('#teaching-figure').innerHTML=branchFigure(live,80,'>=')+'<figcaption>Fig. 2 · Nur der passende Zweig wird ausgeführt.</figcaption>'};
 if(pageIndex>1){$('[data-step=next]').onclick=()=>{step++;renderIntro()};$('#step-prev').onclick=()=>{step--;renderIntro()};$('#step-reset').onclick=()=>{step=0;renderIntro()}}
}
function stepButtons(max){return `<div class="step-buttons"><button id="step-prev" ${step===0?'disabled':''}>Schritt zurück</button><button data-step="next" ${step===max?'disabled':''}>Nächster Schritt</button><button id="step-reset" aria-label="Mechanismus zurücksetzen">Reset</button></div>`}
function arrayFigure(d){const high=Math.max(...d.values),max=high*1.25,w=560,bin=480/d.values.length;let paths='';if(d.action==='count'){const y=80-d.limit/max*48;paths=`<path d="${d.values.map((v,i)=>{const x=40+i*bin;return `M${x+bin-24} ${y}H${x+bin}`}).join(" ")}" stroke="#9b4d12" stroke-width="2" stroke-dasharray="6 5" fill="none"/>`}return svgStart(`Geordnete Eingangswerte ${d.values.join(', ')}; Index beginnt bei 0`,560,120)+paths+d.values.map((v,i)=>{const x=40+i*bin,ht=v/max*48,y=80-ht;return `<g class="array-column" data-index="${i}"><rect x="${x}" y="${y}" width="${bin-24}" height="${ht}" rx="4" fill="#2458a6"/><text x="${x+(bin-24)/2}" y="${y-16}" text-anchor="middle">${v}</text><text x="${x+(bin-24)/2}" y="112" text-anchor="middle">Index ${i}</text></g>`}).join('')+'</svg>'}
function materialHTML(d,m){
 let out=`<pre class="code">${escapeHTML(m.code)}</pre>`;
 if(d.kind==='branch')out+=`<figure class="figure-stage">${compactBranch(d)}<figcaption>Fig. ${d.n+5} · Folge der Bedingung, wähle danach den Zweig.</figcaption></figure>`;
 else if(d.kind==='and')out+=tableProvided(['Datei','Alter / Tage','Größe / MiB'],d.cases.map((r,i)=>[i+1,...r]));
 else if(d.kind==='logic')out+=tableProvided(['Fall','Alarm','Wartung'],d.cases.map((r,i)=>[i+1,...r.map(truth)]));
 else if(d.kind==='scan'||d.kind==='boundary')out+=`<figure class="figure-stage">${arrayFigure(d)}<figcaption>Fig. ${d.n+5} · ${d.kind==='boundary'?'Jede Position trägt genau einen Wert.':d.action==='count'?`Die Linie markiert die Grenze ${d.limit}; beachte den Operator ${escapeHTML(d.cmp)}.`:d.action==='max'?'Vergleiche jede Höhe mit dem bisherigen Maximum.':'Lies die Beiträge in der Reihenfolge ihrer Indizes.'}</figcaption></figure>`;
 else if(d.kind==='maxbug')out+=strip(d.values,'CPULoad')+`<div class="plan">Vorgabe: nach i = 0 gilt max = 12, max2 = 0.</div>`;
 else if(d.kind==='nested')out+=`<figure><div class="grid-tests" role="img" aria-label="Zwei Stationen mit je drei Profilen">${m.rows.map(([i,j])=>`<div class="test-cell">i = ${i}, j = ${j}</div>`).join('')}</div><figcaption>Fig. ${d.n+5} · Jede Station erhält dieselben drei Profile.</figcaption></figure>`;
 else if(d.kind==='loop')out+=`<figure class="figure-stage">${exerciseLoop(d)}<figcaption>Fig. ${d.n+5} · ${d.mode==='do'?'Der Rumpf steht vor der ersten Prüfung.':d.n===9?'Die erste Prüfung kann den Rumpf überspringen.':d.n===11?'Die Änderung führt den Zähler abwärts.':d.mode==='for'?'Die Änderung gehört zum Wiederholungsweg.':'Die falsche Prüfung beendet den Wiederholungsweg.'}</figcaption></figure>`;
 else if(d.kind==='severity')out+=tableProvided(['Reihenfolge','Bedingung','Meldung'],[['1',`temperatur >= ${d.high}`,'Kritisch'],['2',`temperatur >= ${d.low}`,'Warnung'],['3','sonst','OK']]);
 else if(d.kind==='free')out+=`<figure class="figure-stage">${svgStart(d.n===16?'Zähler bleibt 0, Bedingung bleibt wahr':'Die Zielvariable der Zuweisung entscheidet, welcher Speicher verändert wird',560,160)+edge('M168 80H344',d.n===16?'prüft erneut':'beschreibt',256,48)+rectNode(16,48,152,64,d.n===16?'i bleibt 0':'CPULoad[i]')+rectNode(344,48,184,64,d.n===16?'i < 3 bleibt wahr':d.n===19?'Ziel: max':'Ziel: ?',true)+'</svg>'}<figcaption>Fig. ${d.n+5} · ${d.n===16?'Prüfe, ob die Bedingung jemals falsch werden kann.':'Quelle und Ziel der Zuweisung getrennt betrachten.'}</figcaption></figure>`;
 return out;
}
function inputHTML(d,m){const ans=getAnswers(d.n);
 if(d.kind==='free')return `<label for="written">Deine schriftliche Antwort auf Deutsch</label><textarea class="free-answer" id="written" spellcheck="true">${escapeHTML(ans[0]||'')}</textarea><p class="plan">Keine automatische Bewertung. Vergleiche deine Begründung mit den Kriterien und dem Modell.</p>`;
 const inp=i=>`<span class="cell-answer"><input type="text" data-field="${i}" aria-label="${escapeHTML(m.fields[i].label)}" aria-describedby="mark-${i}" value="${escapeHTML(ans[i]||'')}" autocomplete="off"><span id="mark-${i}" class="fieldmark"></span></span>`;
 if(d.kind==='scan'){const name=d.action==='sum'?'summe':d.action==='count'?'treffer':'max';return `<table><thead><tr><th scope="col">i</th><th scope="col">werte[i]</th><th scope="col">${name} danach</th></tr></thead><tbody>${d.values.map((x,i)=>`<tr><th scope="row">${i}</th><td>${x}</td><td>${inp(i)}</td></tr>`).join('')}</tbody></table>`}
 if(d.kind==='maxbug')return `<table><thead><tr><th scope="col">i</th><th scope="col">CPU</th><th scope="col">max danach</th><th scope="col">max2 danach</th></tr></thead><tbody>${m.rows.map((r,i)=>`<tr><th scope="row">${i}</th><td>${r[1]}</td><td>${i?inp((i-1)*2):r[2]}</td><td>${i?inp((i-1)*2+1):r[3]}</td></tr>`).join('')}</tbody></table>`;
 if(['and','logic'].includes(d.kind))return `<table><thead><tr><th scope="col">${d.kind==='and'?'Datei':'Fall'}</th><th scope="col">Ergebnis</th></tr></thead><tbody>${m.fields.map((f,i)=>`<tr><th scope="row">${i+1}</th><td>${inp(i)}</td></tr>`).join('')}</tbody></table>`;
 return `<div class="fields">${m.fields.map((f,i)=>`<label class="field">${escapeHTML(f.label)}<span class="field-line">${inp(i)}</span></label>`).join('')}</div>`;
}
function renderTask(){const d=TASKS[pageIndex-5],m=model(d),c=['Entscheiden'].includes(d.type)?'branch':d.type==='Berechnen'?'loop':['Begründen','Diagnostizieren'].includes(d.type)?'free':'trace';
 $('#page').innerHTML=`<header class="page-head"><div class="big">${d.n}</div><div class="head-copy"><div class="head-tags"><span class="chip ${c}">${d.type}</span><span class="meta">${d.op} · ${d.points} Punkte${d.official?'':' (Orientierung)'}</span>${d.extra?'<span class="extra">Zusatzpraxis</span>':''}</div><h2 id="page-title">${d.title}</h2><p class="question-line">${d.n<=3?'Anwenden · Wie folgt der Zustand aus dem Code?':d.n<18?'Üben · Kann ich den Ablauf ohne vorgeführte Lösung verfolgen?':'Prüfungsaufgabe · Kann ich den Fehler belegen und korrigieren?'}</p></div></header><div class="workspace"><section class="material" aria-label="Aufgabe und Material"><div class="trace-heading"><h3>${d.company}</h3><span class="meta">${d.official?'IHK Sommer 2024 · KAIT': 'eigene Aufgabe, nicht offiziell IHK'}</span></div><p class="prompt">${d.prompt}</p><div class="provided">${materialHTML(d,m)}</div></section><section class="answers" aria-label="Antworten"><div class="trace-heading"><h3>Deine Antworten</h3><span class="chip" id="task-status">${statusText(d.n)}</span></div>${inputHTML(d,m)}<p class="feedback" id="feedback" role="status">${state.checked[d.n]?(d.kind==='free'?'Schriftlich mit Kriterien verglichen.':'Bereits vollständig richtig beantwortet.'):'Noch nicht geprüft.'}</p><div class="actionbar"><button class="primary" id="check">${d.kind==='free'?'Mit Kriterien vergleichen':'Antworten prüfen'}</button><button id="hint">Hinweis</button><button id="solution">Lösung</button>${d.kind==='free'?'':'<button id="explain">Fehler erklären</button>'}</div></section></div>`;
 for(const el of document.querySelectorAll('[data-field]'))el.oninput=()=>{let a=getAnswers(d.n).slice();a[+el.dataset.field]=el.value;state.answers[d.n]=a;state.checked[d.n]=false;el.removeAttribute('aria-invalid');el.removeAttribute('data-correct');save();updateChrome()};
 if(d.kind==='free')$('#written').oninput=e=>{state.answers[d.n]=[e.target.value];state.checked[d.n]=false;save();updateChrome()};
 $('#check').onclick=()=>d.kind==='free'?compareWritten(d):checkTask(d,m);$('#hint').onclick=()=>{setStatus(d.n,'hinweis');$('#task-status').textContent=statusText(d.n);guidedHint(d,m)};$('#solution').onclick=()=>showSolution(d,m);if($('#explain'))$('#explain').onclick=()=>explainTask(d,m);
}
function statusText(n){let s=state.status[n]||'offen';return s==='loesung'?'Lösung gesehen':s==='hinweis'?'Mit Hinweis':state.checked[n]?'Ohne Hilfe':'Offen'}
function normalize(s){return String(s).trim().toLocaleLowerCase('de').replace(/\s+/g,' ').replace(/[.;]$/,'')}
function isCorrect(value,expected){return normalize(value)===normalize(expected)}
function checkTask(d,m){let all=true,empty=false;const a=getAnswers(d.n);m.fields.forEach((f,i)=>{const el=$(`[data-field="${i}"]`),blank=!String(a[i]||'').trim(),ok=isCorrect(a[i]||'',f.value);all=all&&ok;empty=empty||blank;el.setAttribute('aria-invalid',ok?'false':'true');el.dataset.correct=String(ok);$(`#mark-${i}`).textContent=ok?'✓':blank?'○':'×';$(`#mark-${i}`).setAttribute('aria-label',ok?'richtig':blank?'leer':'prüfen');$(`#mark-${i}`).className='fieldmark '+(ok?'good':'bad')});
 if(!empty){state.attempts[d.n]=(state.attempts[d.n]||0)+1;if(state.attempts[d.n]===1)state.first[d.n]=all&&(!state.status[d.n]||state.status[d.n]==='offen')}
 state.checked[d.n]=all;if(all&&(!state.status[d.n]||state.status[d.n]==='offen'))state.status[d.n]='ohne';$('#feedback').textContent=all?'Alle Felder stimmen. Der Ablauf ist nachvollzogen.':empty?'Fülle die offenen Felder aus; jedes Feld wird einzeln geprüft.':'Prüfe die markierten Felder. „Fehler erklären“ zeigt die Ursache.';$('#feedback').className='feedback '+(all?'good':'bad');$('#task-status').textContent=statusText(d.n);save();updateChrome();$('#feedback').animate([{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:300});
}
function guidedHint(d,m){if(d.n>3){showDialog('Hinweis · Aufgabe '+d.n,`<p>${d.hint}</p>`);return}let k=0,max=d.n===1?1:m.rows.length;showDialog('Hinweis und Ablauf · Aufgabe '+d.n,`<p>${d.hint}</p><div id="guided-scene"></div><div class="step-buttons"><button data-step="next" id="guided-next">Nächster Schritt</button><button id="guided-reset">Reset</button></div>`);function draw(){if(d.n===1)$('#guided-scene').innerHTML=compactBranch(d)+(k?`<p>Bedingung: ${m.fields[0].value}; Ausgabe: ${m.fields[1].value}.</p>`:'<p>Wähle den Zweig zuerst selbst.</p>');else $('#guided-scene').innerHTML=tableProvided(d.n===2?['Runde','i vorher','i danach']:['i','werte[i]','summe danach'],m.rows.map((r,i)=>i<k?r:[r[0],'—','—']));$('#guided-scene').animate([{opacity:.3,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:300});$('#guided-next').disabled=k===max}$('#guided-next').onclick=()=>{k++;setStatus(d.n,'loesung');$('#task-status').textContent=statusText(d.n);draw()};$('#guided-reset').onclick=()=>{k=0;draw()};draw()}
function showDialog(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#help-dialog').showModal()}
function explainTask(d,m){setStatus(d.n,'hinweis');$('#task-status').textContent=statusText(d.n);const a=getAnswers(d.n),failed=m.fields.filter((f,i)=>!isCorrect(a[i]||'',f.value));showDialog('Rückmeldung · Aufgabe '+d.n,failed.length?`<label for="error-field">Wähle das markierte Feld</label><select id="error-field">${failed.map((f,i)=>`<option value="${i}">${escapeHTML(f.label)}</option>`).join('')}</select><p id="error-reason">${escapeHTML(failed[0].why)}</p>`:'<p>Alle eingegebenen Felder stimmen.</p>');if(failed.length)$('#error-field').onchange=e=>$('#error-reason').textContent=failed[+e.target.value].why}
function showSolution(d,m){setStatus(d.n,'loesung');$('#task-status').textContent=statusText(d.n);let html=d.kind==='free'?`<p>${escapeHTML(d.solution)}</p>`:tableProvided(['Feld','Modellantwort'],m.fields.map(f=>[f.label,f.value]));if(d.official)html+=`<p class="plan">Vergleich mit offizieller Lösung: Sommer 2024 KAIT, Lösung PDF Seite 4. ${d.n===18?'Spalten max / max2: 12/0, 10/0, 40/10, 73/40, 73/40, 60/40.':d.n===19?'Offizieller Kern: max wird fälschlich mit dem zweithöchsten Wert überschrieben.':'Offizielle Korrektur: Zeile 17, max2 = CPULoad[i];'}</p>`;html+='<p class="plan">Deine Antwort wird nicht überschrieben.</p>';showDialog('Lösung · Aufgabe '+d.n,html)}
function compareWritten(d){if(!String(getAnswers(d.n)[0]||'').trim()){$('#feedback').textContent='Schreibe zuerst deine Antwort; ein leeres Feld ist kein Vergleich.';$('#feedback').className='feedback bad';return}setStatus(d.n,'loesung');showDialog('Kriterien und Modell · Aufgabe '+d.n,`<p>${escapeHTML(d.solution)}</p><div class="criteria">${d.criteria.map((c,i)=>`<label><input type="checkbox" data-criterion="${i}" ${(state.criteria[d.n]||[])[i]?'checked':''}><span>${escapeHTML(c)}</span></label>`).join('')}</div><p class="plan">${d.official?'Modell mit offizieller Lösung, PDF Seite 4, abgeglichen. Die Teilpunktaufteilung bei b ist eine eigene Orientierung.':'Eigene Kriterien, keine offizielle IHK-Bewertung.'} Selbstvergleich; keine automatische Punktevergabe.</p><button class="primary" id="record-written">Vergleich dokumentieren</button>`);$('#record-written').onclick=()=>{state.criteria[d.n]=[...document.querySelectorAll('[data-criterion]')].map(e=>e.checked);state.checked[d.n]=true;save();$('#help-dialog').close();renderTask();updateChrome()}}

$('#close-dialog').onclick=()=>$('#help-dialog').close();document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||$('#help-dialog').open)return;if(e.key==='ArrowRight'){e.preventDefault();go(pageIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(pageIndex-1)}});
$('#notes').onclick=()=>{const id=pageIndex<5?'seite-'+pageIndex:TASKS[pageIndex-5].n;showDialog('Notizen zu dieser Seite',`<label for="note-text">Eigene Notizen / dudas en español</label><textarea id="note-text">${escapeHTML(state.notes[id]||'')}</textarea><button id="save-note" class="primary">Notiz speichern</button>`);$('#save-note').onclick=()=>{state.notes[id]=$('#note-text').value;save();$('#help-dialog').close()}};
$('#es').onclick=()=>{const d=pageIndex>=5?TASKS[pageIndex-5]:null;showDialog('Español · ayuda separada',`<p lang="es">${d?d.kind==='free'?'Escribe tu respuesta en alemán antes de abrir los criterios. Compara el mecanismo, la variable afectada y la corrección; las casillas documentan tu propia revisión. No hay puntuación automática.':d.kind==='scan'||d.kind==='maxbug'?'Cada fila recoge el estado al terminar esa iteración. Conserva los valores que no cambian. Sigue exactamente el código, incluso si contiene un error.':'Primero decide si la condición es verdadera. Cuenta solo las ejecuciones del cuerpo y distingue el último valor usado del valor al salir.':'Una condición decide qué rama se ejecuta. Un bucle repite el cuerpo mientras la condición permite continuar. Avanza cada paso tú mismo y observa qué variable cambia.'}</p><p lang="es">Navegación libre. ○ pendiente, ✓ sin ayuda, ◇ con pista, ▣ solución vista. Exporta para conservar respuestas y notas fuera del navegador.</p>`)};
$('#sources').onclick=()=>showDialog('Quellen und Studienablauf','<p>60 Minuten: 10 Einstieg / Mechanismus, 8 Anwenden, 22 Üben, 16 Prüfung, 4 Rückblick. Aufgaben 16–17 sind zusätzliche Praxis.</p><p>Didaktische Quelle: sources/01_Kersken_IT-Handbuch_11A_2023.pdf, PDF / Druckseiten 539, 542–544. Hinweis: Die do-while-Ausgabe auf Seite 543 enthält eine Errata; das gezeigte Programm liefert 0–9.</p><p>Offizielle Prüfung: Sommer 2024 KAIT, 3aa/ab/ac; Aufgabe PDF 6 und 8, Lösung PDF 4. Aufgaben 18–20. Eigene Übungen greifen Formate aus Sommer 2022 und 2023 auf.</p><p>Eigene Zeichnungen nach PAP- und Struktogrammkonventionen von inf-schule.de. Vollständige Quellen und Prüfergebnisse: REPORTE-taller.md.</p>');
$('#export').onclick=()=>{const record={workshop:'Spurenlabor · 2026-10-06',exported:new Date().toISOString(),notes:state.notes,exercises:TASKS.map(d=>({number:d.n,title:d.title,answers:getAnswers(d.n),help:state.status[d.n]||'offen',completed:!!state.checked[d.n],firstAttemptCorrect:!!state.first[d.n],attempts:state.attempts[d.n]||0,selfComparison:state.criteria[d.n]||[]}))};let url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='spurenlabor-2026-10-06-antworten.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
