<script>
'use strict';
const LESSONS=[{"id": "L01", "title": {"es": "Automatizar: decidir y repetir", "de": "Automatisieren: entscheiden und wiederholen"}, "paras": [{"es": "Cada mañana, un servicio de TI revisa las mediciones de sus servidores. Una persona podría leer cada dato, decidir si supera un límite y anotar cuántas alertas hay. Automatizar significa escribir esas instrucciones para que un programa haga el mismo trabajo con nuevos datos.", "de": "Jeden Morgen prüft ein IT-Service die Messwerte seiner Server. Ein Mensch könnte jeden Wert lesen, entscheiden, ob er einen Grenzwert überschreitet, und die Warnungen zählen. Automatisieren bedeutet, diese Anweisungen aufzuschreiben, damit ein Programm dieselbe Arbeit mit neuen Daten erledigt."}, {"es": "Un algoritmo es una secuencia de pasos para resolver una tarea. El programa expresa esos pasos en un lenguaje que el ordenador puede ejecutar. Hoy aprenderás dos mecanismos: una condición permite decidir qué hacer; un bucle permite repetir pasos. Una tabla de trazado hace visible cómo cambian los valores durante la ejecución.", "de": "Ein Algorithmus ist eine Folge von Schritten zur Lösung einer Aufgabe. Das Programm beschreibt diese Schritte in einer ausführbaren Sprache. Heute lernst du zwei Mechanismen: Eine Bedingung entscheidet, was geschieht; eine Schleife wiederholt Schritte. Eine Ablauftabelle macht sichtbar, wie sich Werte während der Ausführung ändern."}, {"es": "No necesitas saber programar. Empezaremos con un valor y una instrucción; después añadiremos decisiones y repeticiones. La barra lateral permite volver a cualquier explicación. Puedes cambiar de idioma en cualquier momento.", "de": "Du brauchst keine Programmierkenntnisse. Wir beginnen mit einem Wert und einer Anweisung; danach kommen Entscheidungen und Wiederholungen hinzu. Über die Seitenleiste kannst du zu jeder Erklärung zurückkehren. Die Sprache lässt sich jederzeit wechseln."}], "viz": {"kind": "pipeline"}, "check": {"es": "Si cambian las mediciones mañana, ¿hay que escribir todas las instrucciones de nuevo?", "de": "Müssen morgen alle Anweisungen neu geschrieben werden, wenn sich die Messwerte ändern?"}, "answer": {"es": "No. El mismo algoritmo procesa los nuevos datos. Las condiciones deciden qué pasos se ejecutan para esos datos.", "de": "Nein. Derselbe Algorithmus verarbeitet die neuen Daten. Bedingungen entscheiden, welche Schritte für diese Daten ausgeführt werden."}}, {"id": "L02", "title": {"es": "La variable guarda el valor actual", "de": "Eine Variable speichert den aktuellen Wert"}, "paras": [{"es": "Para contar tickets, el programa necesita recordar cuántos lleva. Una variable es un lugar con nombre donde guarda un valor actual. Imagina una casilla con la etiqueta tickets. Si guarda 2 y luego guarda 3, su valor actual es 3: no conserva una lista de valores anteriores.", "de": "Zum Zählen von Tickets muss sich das Programm den aktuellen Stand merken. Eine Variable ist ein benannter Speicherplatz für einen aktuellen Wert. Stell dir ein Fach mit der Beschriftung tickets vor. Speichert es zuerst 2 und danach 3, ist sein aktueller Wert 3: Es enthält keine Liste der früheren Werte."}, {"es": "En el código, = significa «guardar», no «comparar». Primero se calcula el lado derecho; después se guarda el resultado en la variable de la izquierda. Así, tickets = tickets + 1 lee el 2 actual, suma 1 y reemplaza el valor por 3. El signo + suma números.", "de": "Im Code bedeutet = „speichern“, nicht „vergleichen“. Zuerst wird die rechte Seite berechnet; danach wird das Ergebnis in der Variablen links gespeichert. tickets = tickets + 1 liest also die aktuelle 2, addiert 1 und ersetzt den Wert durch 3. Das Zeichen + addiert Zahlen."}, {"es": "Usaremos fragmentos con la notación de tipo C# que aparece en estas pruebas IHK. int declara una variable para números enteros; el punto y coma termina la instrucción. Las líneas se ejecutan en orden. // introduce un comentario explicativo que no se ejecuta. Las llaves { } agrupan las instrucciones de un bloque.", "de": "Wir verwenden Ausschnitte in der C#-artigen Schreibweise dieser IHK-Aufgaben. int vereinbart eine Variable für ganze Zahlen; ein Semikolon beendet die Anweisung. Die Zeilen werden der Reihe nach ausgeführt. // beginnt einen erklärenden Kommentar, der nicht ausgeführt wird. Geschweifte Klammern { } fassen Anweisungen zu einem Block zusammen."}], "viz": {"kind": "assign", "code": "int tickets = 2;\ntickets = tickets + 1;", "before": 2, "after": 3}, "check": {"es": "Si ahora se ejecuta tickets = 7;, ¿cuál es el valor actual?", "de": "Welcher aktuelle Wert entsteht durch tickets = 7;?"}, "answer": {"es": "7. La asignación reemplaza el valor anterior; no suma 7 a los 3.", "de": "7. Die Zuweisung ersetzt den bisherigen Wert; sie addiert nicht 7 zu den 3."}}, {"id": "L03", "title": {"es": "Una condición es una pregunta comprobable", "de": "Eine Bedingung ist eine prüfbare Frage"}, "paras": [{"es": "El sistema solo debe avisar cuando la carga supera el 80 %. La carga es un número; la condición pregunta si ese número cumple la regla. Una comparación devuelve uno de dos valores lógicos: true significa verdadero; false significa falso. No modifica la carga.", "de": "Das System soll nur warnen, wenn die Auslastung 80 % überschreitet. Die Auslastung ist eine Zahl; die Bedingung fragt, ob diese Zahl die Regel erfüllt. Ein Vergleich liefert einen von zwei Wahrheitswerten: true bedeutet wahr; false bedeutet falsch. Er verändert die Auslastung nicht."}, {"es": "> significa «mayor que» y excluye el límite; >= significa «mayor o igual» y lo incluye. Por eso 80 > 80 es falso, pero 80 >= 80 es verdadero. < y <= funcionan del mismo modo hacia abajo. == pregunta si dos valores son iguales; != pregunta si son distintos. Ninguno guarda un valor.", "de": "Das Zeichen > bedeutet „größer als“ und schließt den Grenzwert aus; >= bedeutet „größer oder gleich“ und schließt ihn ein. Deshalb ist 80 > 80 falsch, aber 80 >= 80 wahr. < und <= funktionieren entsprechend nach unten. == prüft Gleichheit; != prüft Ungleichheit. Keiner dieser Vergleiche speichert einen Wert."}, {"es": "Traduce primero la regla: «über 80» es más de 80; «mindestens 80» es al menos 80. Prueba un valor por debajo, uno exactamente en el límite y otro por encima. Esto detecta errores que un ejemplo lejano al límite puede ocultar.", "de": "Übersetze zunächst die Regel: „über 80“ schließt 80 aus; „mindestens 80“ schließt 80 ein. Prüfe einen Wert unterhalb, genau am Grenzwert und oberhalb. So findest du Fehler, die ein weit vom Grenzwert entferntes Beispiel verdecken kann."}], "viz": {"kind": "comparisons"}, "check": {"es": "La regla dice «menos de 5 intentos». ¿Admite exactamente 5?", "de": "Die Regel lautet „weniger als 5 Versuche“. Ist genau 5 erlaubt?"}, "answer": {"es": "No: 5 < 5 es falso. «Como máximo 5» usaría <= y sí lo admitiría.", "de": "Nein: 5 < 5 ist falsch. „Höchstens 5“ verwendet <= und würde 5 zulassen."}}, {"id": "L04", "title": {"es": "if / else: ejecutar una alternativa", "de": "if / else: einen Zweig ausführen"}, "paras": [{"es": "Una comparación solo responde sí o no. if utiliza esa respuesta para ejecutar un bloque cuando la condición es verdadera. else contiene la alternativa cuando es falsa. En una decisión if / else se ejecuta exactamente uno de los dos bloques, no ambos.", "de": "Ein Vergleich beantwortet nur eine Ja-Nein-Frage. if nutzt die Antwort und führt einen Block aus, wenn die Bedingung wahr ist. else enthält die Alternative für den falschen Fall. Bei einer if-else-Entscheidung wird genau einer der beiden Blöcke ausgeführt, nicht beide."}, {"es": "Con una carga de 91 %, la pregunta «carga > 80» es verdadera y se guarda el texto WARN. Las comillas indican un texto literal; string declara una variable de texto. Con 80 %, la pregunta sería falsa y se guardaría OK. La carga no cambia por comprobarla.", "de": "Bei 91 % Auslastung ist die Frage „last > 80“ wahr; der Text WARN wird gespeichert. Anführungszeichen kennzeichnen einen festen Text; string vereinbart eine Textvariable. Bei 80 % wäre die Frage falsch und es würde OK gespeichert. Die Auslastung verändert sich durch die Prüfung nicht."}, {"es": "Después de cerrar la decisión, el programa continúa. Console.WriteLine(status) muestra el valor actual en una línea de la consola. Es salida, no una nueva asignación. Si no hay else y la condición es falsa, el bloque se omite y cualquier valor guardado antes permanece.", "de": "Nach der Entscheidung läuft das Programm weiter. Console.WriteLine(status) zeigt den aktuellen Wert als Konsolenzeile an. Das ist eine Ausgabe, keine neue Zuweisung. Fehlt else und ist die Bedingung falsch, wird der Block übersprungen; ein vorher gespeicherter Wert bleibt bestehen."}], "viz": {"kind": "branch", "code": "int last = 91;\nstring status;\nif (last > 80) {\n  status = \"WARN\";\n} else {\n  status = \"OK\";\n}\nConsole.WriteLine(status);"}, "check": {"es": "¿Qué se muestra si last vale 80?", "de": "Was wird bei last = 80 ausgegeben?"}, "answer": {"es": "OK. No se cumple 80 > 80, se ejecuta else y luego se muestra el texto guardado.", "de": "OK. 80 > 80 ist nicht erfüllt, deshalb läuft else; anschließend wird der gespeicherte Text ausgegeben."}}, {"id": "L05", "title": {"es": "Combinar reglas: Y, O, NO", "de": "Regeln verbinden: UND, ODER, NICHT"}, "paras": [{"es": "Una empresa solo mueve archivos si la ocupación es mayor que 40 % y menor que 60 %. Son dos preguntas sobre el mismo valor. Primero comprueba cada una; después combina sus resultados. Con 50 %, ambas son verdaderas. Con 70 %, la primera es verdadera y la segunda falsa: la regla completa no se cumple.", "de": "Ein Unternehmen verschiebt Dateien nur bei einer Belegung über 40 % und unter 60 %. Das sind zwei Fragen zu demselben Wert. Prüfe zuerst jede einzelne und verbinde dann die Ergebnisse. Bei 50 % sind beide wahr. Bei 70 % ist die erste wahr und die zweite falsch: Die gesamte Regel ist nicht erfüllt."}, {"es": "En esta notación, && significa Y: ambas condiciones deben ser verdaderas. || significa O: basta con que al menos una sea verdadera, incluso pueden serlo ambas. ! significa NO: invierte un valor lógico. Los paréntesis permiten ver qué preguntas se agrupan. Por ejemplo, !(last > 80) es verdadero cuando la carga no supera 80.", "de": "In dieser Schreibweise bedeutet && UND: Beide Bedingungen müssen wahr sein. || bedeutet ODER: Mindestens eine Bedingung muss wahr sein; auch beide dürfen wahr sein. ! bedeutet NICHT und kehrt einen Wahrheitswert um. Klammern zeigen die Gruppierung. Beispielsweise ist !(last > 80) wahr, wenn die Last 80 nicht überschreitet."}, {"es": "No sustituyas Y por O para un intervalo: «mayor que 40 O menor que 60» admitiría también 70. Relaciona siempre el operador con la regla de negocio, no con lo que parezca funcionar para un solo dato.", "de": "Ersetze UND bei einem Intervall nicht durch ODER: „größer als 40 ODER kleiner als 60“ würde auch 70 zulassen. Beziehe den Operator immer auf die fachliche Regel und nicht auf ein einzelnes scheinbar passendes Testergebnis."}], "viz": {"kind": "logic"}, "check": {"es": "Para avisar si falla el disco O el servicio, ¿hay que exigir dos fallos a la vez?", "de": "Müssen für eine Warnung bei einem Festplattenfehler ODER einem Dienstausfall beide Fehler gleichzeitig auftreten?"}, "answer": {"es": "No. || permite un fallo, el otro, o ambos. && exigiría ambos.", "de": "Nein. || erlaubt den einen Fehler, den anderen oder beide. && würde beide verlangen."}}, {"id": "L06", "title": {"es": "Varias decisiones y el orden", "de": "Mehrere Entscheidungen und ihre Reihenfolge"}, "paras": [{"es": "Si hay tres categorías, una cadena if / else if / else prueba las condiciones en orden. else if significa «si la anterior no se cumplió, prueba esta». Al encontrar la primera verdadera, ejecuta ese bloque y no prueba las siguientes alternativas de la cadena.", "de": "Bei drei Kategorien prüft eine if-else-if-else-Kette die Bedingungen der Reihe nach. else if bedeutet: „Falls die vorige Bedingung nicht erfüllt war, prüfe diese.“ Sobald eine Bedingung wahr ist, läuft dieser Block; die weiteren Alternativen dieser Kette werden nicht mehr geprüft."}, {"es": "Para clasificar cargas, prueba primero «mayor que 90», después «mayor que 60», y usa else para el resto. Así 95 queda en CRIT. Si probaras primero «mayor que 60», también se cumpliría para 95 y la cadena nunca llegaría a CRIT.", "de": "Bei der Auslastung prüfst du zuerst „größer als 90“, danach „größer als 60“ und verwendest else für den Rest. So wird 95 als CRIT eingeordnet. Würdest du zuerst „größer als 60“ prüfen, wäre diese Bedingung bei 95 erfüllt und die Kette würde CRIT nie erreichen."}, {"es": "Dos if separados son distintos: ambos se comprueban. Si el primero cambia una variable, el segundo ve el valor ya cambiado. Al trazar, respeta el orden exacto y las llaves; no supongas que cada if empieza otra vez con los valores iniciales.", "de": "Zwei getrennte if-Anweisungen sind anders: Beide werden geprüft. Verändert die erste eine Variable, sieht die zweite schon den geänderten Wert. Beachte beim Nachvollziehen die genaue Reihenfolge und die Klammern; ein if beginnt nicht erneut mit den Anfangswerten."}], "viz": {"kind": "cases", "code": "if (last > 90) { status = \"CRIT\"; }\nelse if (last > 60) { status = \"WARN\"; }\nelse { status = \"OK\"; }", "table": [["last", "status"], [60, "OK"], [70, "WARN"], [95, "CRIT"]]}, "check": {"es": "¿Por qué una carga de 95 no recibe también WARN?", "de": "Warum erhält eine Last von 95 nicht zusätzlich WARN?"}, "answer": {"es": "La primera condición ya es verdadera. Las otras alternativas de la misma cadena se omiten.", "de": "Die erste Bedingung ist bereits wahr. Die weiteren Alternativen derselben Kette werden übersprungen."}}, {"id": "L07", "title": {"es": "while: volver a comprobar", "de": "while: erneut prüfen"}, "paras": [{"es": "Para procesar tres tickets podríamos escribir tres veces «añadir un ticket». Pero queremos repetir el mismo bloque y poder cambiar la cantidad. Un bucle es una estructura que vuelve a ejecutar un bloque. while significa «mientras»: antes de cada vuelta comprueba una condición.", "de": "Für drei Tickets könnten wir dreimal „ein Ticket hinzufügen“ schreiben. Wir möchten aber denselben Block wiederholen und die Anzahl ändern können. Eine Schleife führt einen Block erneut aus. while bedeutet „solange“: Vor jedem Durchlauf wird eine Bedingung geprüft."}, {"es": "La variable i cuenta las vueltas terminadas. Empieza en 0. Mientras i sea menor que 3, el programa añade un ticket y aumenta i en 1. Al llegar a 3, vuelve a comprobar: 3 < 3 es falso. Entonces sale del bucle y continúa con la instrucción posterior.", "de": "Die Variable i zählt die abgeschlossenen Durchläufe. Sie beginnt bei 0. Solange i kleiner als 3 ist, fügt das Programm ein Ticket hinzu und erhöht i um 1. Bei 3 prüft es erneut: 3 < 3 ist falsch. Es verlässt die Schleife und setzt mit der folgenden Anweisung fort."}, {"es": "Llamamos cuerpo del bucle al bloque entre llaves. Lo que va antes se ejecuta una vez; el cuerpo puede ejecutarse varias veces; lo que va después se ejecuta cuando el bucle termina. Aumentar i dentro del cuerpo permite avanzar hacia el final. No se reinicia i en cada vuelta.", "de": "Der Block zwischen den Klammern heißt Schleifenkörper. Was davor steht, läuft einmal; der Körper kann mehrmals laufen; was danach steht, läuft nach dem Schleifenende. Die Erhöhung von i im Körper bringt den Ablauf dem Ende näher. i wird nicht bei jedem Durchlauf zurückgesetzt."}], "viz": {"kind": "while", "code": "int i = 0;\nint tickets = 0;\nwhile (i < 3) {\n  tickets = tickets + 1;\n  i = i + 1;\n}\nConsole.WriteLine(tickets);"}, "check": {"es": "¿Cuántas veces se comprueba i < 3 para completar tres vueltas?", "de": "Wie oft wird i < 3 für drei vollständige Durchläufe geprüft?"}, "answer": {"es": "Cuatro: con i igual a 0, 1, 2 y finalmente 3. La comprobación falsa termina el bucle.", "de": "Viermal: bei i = 0, 1, 2 und zuletzt 3. Die falsche Prüfung beendet die Schleife."}}, {"id": "L08", "title": {"es": "Tabla de trazado: observar el momento exacto", "de": "Ablauftabelle: den genauen Zeitpunkt beobachten"}, "paras": [{"es": "Una tabla de trazado registra valores en momentos definidos. No calcula «lo que debería hacer» el programa: anota lo que hace el código dado, aunque contenga un error. La tabla conserva la historia que las variables por sí solas no guardan.", "de": "Eine Ablauftabelle hält Werte zu festgelegten Zeitpunkten fest. Sie berechnet nicht, was das Programm tun sollte: Sie dokumentiert den vorliegenden Code, auch wenn dieser fehlerhaft ist. Die Tabelle bewahrt den Verlauf, den die Variablen selbst nicht speichern."}, {"es": "En este ejemplo, cada fila se escribe al final del cuerpo del bucle, después de aumentar i. Empezamos con i = 0 y summe = 0. La primera vuelta añade 2: summe pasa a 2; luego i pasa a 1. Por eso la primera fila contiene i = 1 y summe = 2. En la siguiente vuelta usamos estos valores, no los iniciales.", "de": "In diesem Beispiel entsteht jede Zeile am Ende des Schleifenkörpers, nach der Erhöhung von i. Anfangs sind i = 0 und summe = 0. Der erste Durchlauf addiert 2: summe wird 2; danach wird i zu 1. Daher enthält die erste Tabellenzeile i = 1 und summe = 2. Der nächste Durchlauf nutzt diese Werte, nicht die Anfangswerte."}, {"es": "Usa «Paso» para ver primero la instrucción y el estado, y después la fila que corresponde. El color marca el paso actual, pero el texto también lo explica. Una condición falsa no crea otra vuelta. Si una columna dice «durante la vuelta», puede pedir un valor anterior al incremento: lee siempre su encabezado.", "de": "Mit „Schritt“ siehst du zunächst die Anweisung und den Zustand, dann die passende Tabellenzeile. Die Farbe markiert den aktuellen Schritt; der Text erklärt ihn zusätzlich. Eine falsche Bedingung erzeugt keinen weiteren Durchlauf. „Während des Durchlaufs“ kann einen Wert vor der Erhöhung meinen: Lies immer den Spaltenkopf."}], "viz": {"kind": "stepper", "code": "int i = 0;\nint summe = 0;\nwhile (i < 2) {\n  summe = summe + 2;\n  i = i + 1;\n}"}, "check": {"es": "Si se registra i antes de aumentarlo, ¿la primera fila sigue siendo 1?", "de": "Bleibt der erste Eintrag 1, wenn i vor seiner Erhöhung notiert wird?"}, "answer": {"es": "No, sería 0. El momento de observación forma parte de la tarea.", "de": "Nein, dann wäre es 0. Der Beobachtungszeitpunkt gehört zur Aufgabenstellung."}}, {"id": "L09", "title": {"es": "for: inicio, condición y avance", "de": "for: Start, Bedingung und Fortschritt"}, "paras": [{"es": "Cuando recorres una cantidad conocida de posiciones, una estructura for reúne el control del bucle en una línea. Contiene tres partes separadas por punto y coma: valor inicial; condición para continuar; cambio después de cada vuelta. El cuerpo sigue estando entre llaves.", "de": "Beim Durchlaufen einer bekannten Anzahl von Positionen bündelt for die Schleifensteuerung in einer Zeile. Es enthält drei durch Semikolons getrennte Teile: Anfangswert; Bedingung zum Fortsetzen; Änderung nach jedem Durchlauf. Der Körper steht weiterhin zwischen Klammern."}, {"es": "for (int i = 0; i < 3; i++) empieza una sola vez con 0. Si 0 < 3 es verdadero, ejecuta el cuerpo; luego i++ aumenta i en 1, como i = i + 1. Vuelve a comprobar con 1, luego con 2. Tras la tercera vuelta i pasa a 3 y la condición es falsa. El cuerpo vio 0, 1 y 2.", "de": "for (int i = 0; i < 3; i++) beginnt einmal mit 0. Ist 0 < 3 wahr, läuft der Körper; danach erhöht i++ den Wert um 1, wie i = i + 1. Die nächste Prüfung nutzt 1, dann 2. Nach dem dritten Durchlauf wird i zu 3 und die Bedingung ist falsch. Der Körper hat 0, 1 und 2 gesehen."}, {"es": "i += 2 abrevia i = i + 2: avanza de dos en dos. <= incluye el límite, < lo excluye. No memorices «for siempre repite tres veces»: sus tres partes determinan las vueltas. La declaración de i dentro de for limita dónde se puede usar; en las tareas que preguntan por i después, se declara antes.", "de": "i += 2 ist kurz für i = i + 2: Es erhöht um zwei. <= schließt den Grenzwert ein, < schließt ihn aus. Merke dir nicht „for wiederholt immer dreimal“: Seine drei Teile bestimmen die Durchläufe. Eine im for deklarierte Variable i ist nur dort verfügbar; bei Aufgaben zum Wert danach wird i vorher vereinbart."}], "viz": {"kind": "for"}, "check": {"es": "¿Qué valores ve el cuerpo con i = 1; i <= 3; i++?", "de": "Welche Werte sieht der Körper bei i = 1; i <= 3; i++?"}, "answer": {"es": "1, 2 y 3. El inicio cambió a 1 y el límite 3 está incluido.", "de": "1, 2 und 3. Der Startwert ist 1 und der Grenzwert 3 ist eingeschlossen."}}, {"id": "L10", "title": {"es": "Cero vueltas, una vuelta y no terminar", "de": "Null Durchläufe, ein Durchlauf und kein Ende"}, "paras": [{"es": "while comprueba antes: si la condición ya es falsa, ejecuta cero vueltas. Esto se llama bucle controlado al inicio, kopfgesteuerte Schleife. do / while ejecuta primero el cuerpo y comprueba después: da al menos una vuelta. Se llama bucle controlado al final, fußgesteuerte Schleife.", "de": "while prüft zuerst: Ist die Bedingung schon falsch, gibt es null Durchläufe. Das heißt kopfgesteuerte Schleife. do / while führt zuerst den Körper aus und prüft danach: Es gibt mindestens einen Durchlauf. Das heißt fußgesteuerte Schleife."}, {"es": "Con n = 5 y la condición n < 3, while no modifica n. Un do que aumenta n en 1 sí lo cambia a 6 antes de descubrir que 6 < 3 es falso. En ambos casos, true significa continuar. No confundas do / while con una notación «repetir hasta que», cuya condición puede tener el sentido inverso.", "de": "Bei n = 5 und der Bedingung n < 3 verändert while den Wert nicht. Ein do, das n um 1 erhöht, verändert ihn zu 6, bevor 6 < 3 als falsch erkannt wird. Bei beiden bedeutet true: fortsetzen. Verwechsle do-while nicht mit „wiederhole bis“, dessen Bedingung den umgekehrten Sinn haben kann."}, {"es": "Si i empieza en 0, la condición i < 3 es verdadera y el cuerpo nunca cambia i ni otro dato relevante, la condición seguirá siendo verdadera. El bucle no termina. Para corregirlo, hace falta un avance dentro del cuerpo o algún otro cambio que pueda volver falsa la condición. En una tabla, unas primeras filas iguales solo demuestran esto si también has revisado todo el cuerpo.", "de": "Beginnt i bei 0, ist i < 3 wahr und verändert der Körper weder i noch eine andere relevante Größe, bleibt die Bedingung wahr. Die Schleife endet nicht. Zur Korrektur braucht sie einen Fortschritt im Körper oder eine andere Änderung, die die Bedingung falsch werden lassen kann. Gleiche erste Tabellenzeilen belegen das erst nach Prüfung des gesamten Körpers."}], "viz": {"kind": "zero"}, "check": {"es": "Si el incremento se coloca después del while, ¿ayuda a terminarlo?", "de": "Hilft eine Erhöhung nach dem while dabei, die Schleife zu beenden?"}, "answer": {"es": "No. El programa tendría que salir antes para llegar a ese incremento. Debe ocurrir dentro del cuerpo.", "de": "Nein. Das Programm müsste die Schleife zuerst verlassen, um die Erhöhung zu erreichen. Sie muss im Körper stattfinden."}}, {"id": "L11", "title": {"es": "Un array: posición y dato son distintos", "de": "Ein Array: Position und Wert unterscheiden"}, "paras": [{"es": "Para analizar varias mediciones, se guardan en una colección ordenada de casillas: un array. Cada casilla tiene una posición llamada índice. En los ejemplos IHK de este taller, el primer índice es 0. Si hay cuatro casillas, los índices válidos son 0, 1, 2 y 3.", "de": "Mehrere Messwerte werden in einer geordneten Sammlung von Feldern gespeichert: einem Array. Jedes Feld hat eine Position, den Index. In den IHK-Beispielen dieses Workshops beginnt der Index bei 0. Bei vier Feldern sind die gültigen Indizes 0, 1, 2 und 3."}, {"es": "last[i] significa «lee el dato de last en la posición i». Si i vale 1 y la casilla 1 contiene 87, last[i] vale 87. i no vale 87: sigue siendo la posición 1. last.Length es la cantidad de casillas, aquí 4. int[] identifica un array de números enteros.", "de": "last[i] bedeutet: „Lies den Wert von last an Position i.“ Ist i gleich 1 und enthält Feld 1 die Zahl 87, dann ist last[i] gleich 87. i wird nicht 87: Es bleibt die Position 1. last.Length ist die Anzahl der Felder, hier 4. int[] kennzeichnet ein Array ganzer Zahlen."}, {"es": "Por eso el recorrido usa i < last.Length. Al llegar a i = 4 ya no existe una casilla con ese índice. La condición impide el acceso. Usar <= permitiría intentar leer una casilla inexistente. Aquí solo necesitas consultar los datos; no estudiaremos otras operaciones sobre arrays.", "de": "Deshalb verwendet der Durchlauf i < last.Length. Bei i = 4 gibt es kein Feld mit diesem Index mehr. Die Bedingung verhindert den Zugriff. <= würde das Lesen eines nicht vorhandenen Felds zulassen. Hier brauchst du nur den lesenden Zugriff; weitere Array-Operationen werden nicht behandelt."}], "viz": {"kind": "array", "values": [42, 87, 80, 91]}, "check": {"es": "Si el array tiene 6 elementos, ¿cuál es el último índice?", "de": "Welcher Index ist bei einem Array mit 6 Elementen der letzte?"}, "answer": {"es": "5: hay seis posiciones, empezando en 0. La longitud es 6, el último índice es 5.", "de": "5: Es gibt sechs Positionen, beginnend bei 0. Die Länge ist 6, der letzte Index ist 5."}}, {"id": "L12", "title": {"es": "Acumular y contar no son lo mismo", "de": "Summieren und Zählen sind verschieden"}, "paras": [{"es": "Con las cargas 42, 87 y 91 %, podemos hacer dos tareas diferentes. Sumar valores añade cada medición a una variable summe que comienza en 0: 0 + 42, luego 42 + 87, después 129 + 91. El resultado es 220 puntos porcentuales acumulados, no una carga instantánea de 220 %.", "de": "Mit den Lastwerten 42, 87 und 91 % können wir zwei verschiedene Aufgaben lösen. Beim Summieren wird jeder Messwert zu summe addiert, die bei 0 beginnt: 0 + 42, dann 42 + 87, danach 129 + 91. Das sind 220 addierte Prozentpunkte, keine momentane Auslastung von 220 %."}, {"es": "Contar mediciones por encima de 80 % añade solo 1 cuando la condición se cumple. 42 no cuenta; 87 cuenta una vez; 91 cuenta otra vez. anzahl termina en 2 mediciones. La unidad del resultado es distinta: número de mediciones, no porcentaje.", "de": "Beim Zählen der Messwerte über 80 % wird nur dann 1 addiert, wenn die Bedingung erfüllt ist. 42 zählt nicht; 87 zählt einmal; 91 ein weiteres Mal. anzahl endet bei 2 Messwerten. Die Einheit des Ergebnisses ist anders: Anzahl der Messwerte, nicht Prozent."}, {"es": "Inicializa la suma o el contador antes del bucle. Dentro, decide si actualizas. Si no se cumple un if sin else, conserva el valor anterior. Si reinicias el contador dentro de cada vuelta, pierdes lo que contaste. Comprueba por separado el dato actual, la condición y el valor acumulado.", "de": "Initialisiere Summe oder Zähler vor der Schleife. Im Körper entscheidest du über die Aktualisierung. Ist ein if ohne else nicht erfüllt, bleibt der bisherige Wert erhalten. Setzt du den Zähler bei jedem Durchlauf zurück, verlierst du das bisher Gezählte. Prüfe aktuellen Messwert, Bedingung und angesammelten Wert getrennt."}], "viz": {"kind": "count"}, "check": {"es": "Con el dato 87, ¿el contador aumenta en 87 o en 1?", "de": "Erhöht sich der Zähler beim Messwert 87 um 87 oder um 1?"}, "answer": {"es": "En 1. Añadir 87 sería sumar el dato, no contar una medición.", "de": "Um 1. 87 zu addieren würde den Wert summieren, nicht einen Messwert zählen."}}, {"id": "L13", "title": {"es": "Guardar el mayor valor visto", "de": "Den bisher größten Wert merken"}, "paras": [{"es": "El máximo no cuenta ni suma: recuerda el mayor dato encontrado hasta ahora. Para cargas de CPU no negativas, max puede empezar en 0. Para cada dato, pregunta si es mayor que max. Solo si lo es, reemplaza max por ese dato.", "de": "Das Maximum zählt und summiert nicht: Es merkt sich den bisher größten Wert. Bei nicht negativen CPU-Lastwerten kann max mit 0 beginnen. Für jeden Wert wird geprüft, ob er größer als max ist. Nur dann ersetzt dieser Wert das bisherige max."}, {"es": "Con 18, 46 y 33, el primer valor sustituye 0 por 18. El segundo supera 18 y lo sustituye por 46. El tercero no supera 46, por lo que max sigue en 46. Una condición falsa no borra un resultado anterior. Esta propiedad permite revisar la tabla: max nunca debería bajar en este algoritmo.", "de": "Bei 18, 46 und 33 ersetzt der erste Wert 0 durch 18. Der zweite übersteigt 18 und ersetzt ihn durch 46. Der dritte übersteigt 46 nicht; max bleibt 46. Eine falsche Bedingung löscht kein bisheriges Ergebnis. Damit lässt sich die Tabelle prüfen: max sollte in diesem Algorithmus nie kleiner werden."}, {"es": "La inicialización depende de los datos. Si todos pudieran ser negativos, empezar en 0 daría un máximo que ni aparece. En ese caso se puede empezar con el primer dato y recorrer los restantes. Nuestras tareas declaran las cargas no negativas para que la inicialización en 0 sea válida.", "de": "Die Initialisierung hängt von den Daten ab. Könnten alle Werte negativ sein, würde der Start bei 0 ein Maximum liefern, das gar nicht vorkommt. Dann kann man mit dem ersten Wert beginnen und die übrigen durchlaufen. Unsere Aufgaben geben nicht negative Lastwerte an, damit der Start bei 0 gültig ist."}], "viz": {"kind": "max", "code": "int max = 0;\nfor (int i = 0; i < last.Length; i++) {\n  if (last[i] > max) {\n    max = last[i];\n  }\n}", "table": [["last[i]", "max"], [18, 18], [46, 46], [33, 46]]}, "check": {"es": "¿Qué debería pasar al leer otro dato de 46?", "de": "Was sollte beim Lesen eines weiteren Wertes von 46 passieren?"}, "answer": {"es": "max sigue en 46. 46 > 46 es falso, pero el máximo ya es correcto.", "de": "max bleibt 46. 46 > 46 ist falsch, aber das Maximum ist bereits korrekt."}}, {"id": "L14", "title": {"es": "Dos máximos: conservar antes de reemplazar", "de": "Zwei Höchstwerte: vor dem Ersetzen sichern"}, "paras": [{"es": "El monitor también necesita el segundo mayor valor. max guarda el mayor y max2 el segundo. Usamos datos positivos distintos y empezamos ambos en 0, un valor auxiliar inferior a todos. Tras leer solo un dato, max2 sigue en 0 porque todavía no hay segundo dato.", "de": "Das Monitoring benötigt auch den zweithöchsten Wert. max speichert den höchsten, max2 den zweithöchsten. Wir verwenden verschiedene positive Werte und starten beide bei 0, einem Hilfswert unter allen Messwerten. Nach nur einem Wert bleibt max2 bei 0, weil noch kein zweiter Wert vorliegt."}, {"es": "Si el nuevo dato supera max, el mayor anterior pasa a ser el segundo: primero guarda max en max2, después reemplaza max por el nuevo dato. El orden importa. Con max = 46 y el dato 71, primero max2 recibe 46 y luego max recibe 71.", "de": "Übersteigt der neue Wert max, wird das bisherige Maximum zum zweiten: Speichere zuerst max in max2 und ersetze danach max durch den neuen Wert. Die Reihenfolge zählt. Bei max = 46 und dem neuen Wert 71 bekommt zuerst max2 die 46 und danach max die 71."}, {"es": "Si el nuevo dato no supera max, aún puede superar max2. La alternativa else if comprueba eso y cambia solo max2. Con max = 71, max2 = 46 y el dato 58, termina max = 71 y max2 = 58. No tratamos empates: todas las tareas de dos máximos usan valores distintos.", "de": "Übersteigt der neue Wert max nicht, kann er dennoch max2 übersteigen. else if prüft diesen Fall und verändert nur max2. Bei max = 71, max2 = 46 und dem Wert 58 ergeben sich max = 71 und max2 = 58. Gleichstände behandeln wir hier nicht: Alle Aufgaben mit zwei Höchstwerten verwenden verschiedene Werte."}], "viz": {"kind": "max2", "code": "if (last[i] > max) {\n  max2 = max;\n  max = last[i];\n} else if (last[i] > max2) {\n  max2 = last[i];\n}", "table": [["last[i]", "max", "max2"], [18, 18, 0], [46, 46, 18], [33, 46, 33], [71, 71, 46], [58, 71, 58]]}, "check": {"es": "¿Qué se pierde si guardas primero 71 en max y después haces max2 = max?", "de": "Was geht verloren, wenn zuerst 71 in max steht und danach max2 = max ausgeführt wird?"}, "answer": {"es": "El mayor anterior, 46. Ambas variables contendrían 71 y se perdería el segundo mayor.", "de": "Das vorige Maximum 46. Beide Variablen enthielten 71 und der zweithöchste Wert wäre verloren."}}, {"id": "L15", "title": {"es": "Del código a la hoja de examen", "de": "Vom Code zum Prüfungsblatt"}, "paras": [{"es": "En una tabla IHK, lee primero la situación y luego el código. Marca los valores iniciales y el momento que pide cada columna: «durante la vuelta i» puede referirse al índice antes del incremento; «al final» pide el estado después de ejecutar el cuerpo. Copia el resultado aunque parezca incorrecto: si el código tiene un error, la tabla debe mostrarlo.", "de": "Lies bei einer IHK-Tabelle zuerst die Situation und dann den Code. Markiere Anfangswerte und den Zeitpunkt jeder Spalte: „Während Schritt i“ kann den Index vor der Erhöhung meinen; „bei Ende“ verlangt den Zustand nach Ausführung des Körpers. Trage das Ergebnis auch dann ein, wenn es falsch wirkt: Ein Fehler im Code muss in der Tabelle sichtbar werden."}, {"es": "Para localizar un error, separa tres cosas: qué línea se ejecuta, qué variable cambia y por qué ese cambio contradice el objetivo. Una explicación útil sería: «En la alternativa se sobrescribe el máximo con un dato menor; debería actualizarse el segundo máximo». Después escribe la instrucción corregida en la casilla de la misma línea.", "de": "Trenne beim Lokalisieren eines Fehlers drei Dinge: Welche Zeile wird ausgeführt, welche Variable ändert sich und warum widerspricht das dem Ziel? Eine hilfreiche Erklärung wäre: „Im Alternativzweig wird das Maximum mit einem kleineren Wert überschrieben; stattdessen muss das zweite Maximum aktualisiert werden.“ Trage anschließend die korrigierte Anweisung in das Feld derselben Zeile ein."}, {"es": "Para una sesión de una hora: dedica aproximadamente 30 minutos a estas explicaciones y sus comprobaciones; 25 minutos a las tareas 01, 02, 07, 13, 15, 18 y 20; y 5 a escribir tu explicación alemana en la tarea 22. Es una propuesta de reparto, no una medición. Las demás tareas quedan como práctica extra. Si un concepto no está claro, vuelve a su explicación.", "de": "Für eine einstündige Sitzung: Plane ungefähr 30 Minuten für Erklärungen und Denkfragen, 25 Minuten für Aufgaben 01, 02, 07, 13, 15, 18 und 20 sowie 5 Minuten für deine deutsche Erklärung in Aufgabe 22. Das ist ein vorgeschlagener Zeitplan, keine Messung. Die übrigen Aufgaben sind Zusatzpraxis. Ist ein Begriff unklar, kehre zur passenden Erklärung zurück."}], "viz": {"kind": "method"}, "check": {"es": "¿Debes arreglar mentalmente el código antes de rellenar una tabla del código dado?", "de": "Sollst du den Code gedanklich korrigieren, bevor du die Tabelle zum vorliegenden Code ausfüllst?"}, "answer": {"es": "No. Primero traza el código dado. Después explica y corrige el error cuando el apartado lo pida.", "de": "Nein. Zuerst verfolgst du den vorliegenden Code. Erkläre und korrigiere den Fehler danach im entsprechenden Teilauftrag."}}];
const TASKS=[{"id": "E01", "title": {"es": "El límite de temperatura", "de": "Temperaturgrenze"}, "group": "decisions", "anchor": "Sommer 2022 · KAIT 2a", "scenario": {"es": "Un proveedor de hosting revisa el sensor de un rack. A partir de 30 °C se activa COOL; por debajo se conserva OK.", "de": "Ein Hosting-Anbieter prüft einen Racksensor. Ab 30 °C gilt COOL; darunter bleibt OK."}, "prompt": {"es": "Complete la tabla con el valor lógico de la condición y el texto guardado al final. Se muestra una fila como ejemplo.", "de": "Vervollständigen Sie die Tabelle mit dem Wahrheitswert der Bedingung und dem am Ende gespeicherten Text. Eine Zeile ist vorgegeben."}, "code": "string status = \"OK\";\nif (temperatur >= 30) { status = \"COOL\"; }", "hint": {"es": "«A partir de» incluye exactamente 30. El if sin else deja OK si la condición es falsa.", "de": "„Ab“ schließt genau 30 ein. Beim if ohne else bleibt OK, wenn die Bedingung falsch ist."}, "model": {"es": "29 no alcanza el límite: false, OK. 30 sí lo alcanza: true, COOL. Cada fila empieza con status = \"OK\".", "de": "29 erreicht den Grenzwert nicht: false, OK. 30 erreicht ihn: true, COOL. Jede Zeile beginnt mit status = \"OK\"."}, "table": {"headers": [{"es": "Temperatura / °C", "de": "Temperatur / °C"}, {"es": "Condición", "de": "Bedingung"}, {"es": "Estado final", "de": "Endzustand"}], "rows": [[31, "true", "COOL"], [29, {"field": "f1"}, {"field": "f2"}], [30, {"field": "f3"}, {"field": "f4"}]]}, "fields": [{"expected": "false", "type": "token", "points": 1, "key": "f1"}, {"expected": "OK", "type": "token", "points": 1, "key": "f2"}, {"expected": "true", "type": "token", "points": 1, "key": "f3"}, {"expected": "COOL", "type": "token", "points": 1, "key": "f4"}], "rubric": [], "points": 4}, {"id": "E02", "title": {"es": "Exactamente 80 %", "de": "Genau 80 %"}, "group": "decisions", "anchor": "Sommer 2023 · KAIT 3a", "scenario": {"es": "Un operador de centros de datos quiere contar solo mediciones que superen el 80 % de CPU.", "de": "Ein Rechenzentrumsbetreiber möchte nur CPU-Messwerte zählen, die 80 % überschreiten."}, "prompt": {"es": "Compare las dos condiciones. Anote true o false en las casillas.", "de": "Vergleichen Sie die beiden Bedingungen. Tragen Sie true oder false in die Felder ein."}, "code": "// last: CPU-Auslastung in Prozent\n// Prüfen, ohne last zu verändern", "hint": {"es": "Prueba el dato exactamente en el límite; > y >= se distinguen allí.", "de": "Prüfen Sie genau den Grenzwert; dort unterscheiden sich > und >=."}, "model": {"es": "79 no cumple ninguna; 80 solo cumple >=; 81 cumple ambas. Para «supera 80» corresponde >.", "de": "79 erfüllt keine Bedingung; 80 erfüllt nur >=; 81 erfüllt beide. Für „überschreitet 80“ passt >."}, "table": {"headers": [{"es": "Carga / %", "de": "Last / %"}, "last > 80", "last >= 80"], "rows": [[79, {"field": "f1"}, {"field": "f2"}], [80, {"field": "f3"}, {"field": "f4"}], [81, {"field": "f5"}, {"field": "f6"}]]}, "fields": [{"expected": "false", "type": "token", "points": 1, "key": "f1"}, {"expected": "false", "type": "token", "points": 1, "key": "f2"}, {"expected": "false", "type": "token", "points": 1, "key": "f3"}, {"expected": "true", "type": "token", "points": 1, "key": "f4"}, {"expected": "true", "type": "token", "points": 1, "key": "f5"}, {"expected": "true", "type": "token", "points": 1, "key": "f6"}], "rubric": [], "points": 6}, {"id": "E03", "title": {"es": "Ventana de ocupación NAS", "de": "Belegungsfenster des NAS"}, "group": "decisions", "anchor": "Sommer 2022 · KAIT 2a", "scenario": {"es": "Un estudio de medios mueve archivos cuando la ocupación del NAS es mayor que 40 % y menor que 60 %. Los extremos quedan excluidos.", "de": "Ein Medienbetrieb verschiebt Dateien, wenn die NAS-Belegung über 40 % und unter 60 % liegt. Die Grenzwerte sind ausgeschlossen."}, "prompt": {"es": "Complete la tabla de la regla de traslado. Cada fila representa una medición distinta.", "de": "Vervollständigen Sie die Tabelle zur Verschieberegel. Jede Zeile stellt einen eigenen Messwert dar."}, "code": "if (belegung > 40 && belegung < 60) {\n  // Dateien verschieben\n}", "hint": {"es": "Comprueba cada comparación por separado y después aplica Y.", "de": "Prüfen Sie beide Vergleiche getrennt und verbinden Sie sie dann mit UND."}, "model": {"es": "Solo 50 cumple ambas preguntas. 40 y 60 son extremos excluidos; 70 no cumple la segunda.", "de": "Nur 50 erfüllt beide Bedingungen. 40 und 60 sind ausgeschlossene Grenzen; 70 erfüllt den zweiten Vergleich nicht."}, "table": {"headers": [{"es": "Ocupación / %", "de": "Belegung / %"}, {"es": "Regla completa", "de": "Gesamtbedingung"}], "rows": [[40, {"field": "f1"}], [50, {"field": "f2"}], [60, {"field": "f3"}], [70, {"field": "f4"}]]}, "fields": [{"expected": "false", "type": "token", "points": 1, "key": "f1"}, {"expected": "true", "type": "token", "points": 1, "key": "f2"}, {"expected": "false", "type": "token", "points": 1, "key": "f3"}, {"expected": "false", "type": "token", "points": 1, "key": "f4"}], "rubric": [], "points": 4}, {"id": "E04", "title": {"es": "Aviso por uno de dos fallos", "de": "Warnung bei einem von zwei Fehlern"}, "group": "decisions", "anchor": "Sommer 2022 · KAIT 2a", "scenario": {"es": "Un servicio de soporte emite una alarma si hay un fallo de disco o el servicio no está activo. diskError y serviceOK son valores lógicos.", "de": "Ein Supportdienst warnt bei einem Festplattenfehler oder wenn der Dienst nicht aktiv ist. diskError und serviceOK sind Wahrheitswerte."}, "prompt": {"es": "Determine el resultado de la condición para cada estado.", "de": "Bestimmen Sie das Ergebnis der Bedingung für jeden Zustand."}, "code": "if (diskError || !serviceOK) {\n  // Alarm ausgeben\n}", "hint": {"es": "Primero invierte serviceOK. O admite también que ambas causas estén presentes.", "de": "Kehren Sie zuerst serviceOK um. ODER erlaubt auch beide Fehlerursachen gleichzeitig."}, "model": {"es": "false/true: no hay fallo, false. false/false: servicio parado, true. true/true: fallo de disco, true. true/false: ambos fallos, true.", "de": "false/true: kein Fehler, false. false/false: Dienst gestoppt, true. true/true: Festplattenfehler, true. true/false: beide Fehler, true."}, "table": {"headers": ["diskError", "serviceOK", {"es": "Alarma", "de": "Alarm"}], "rows": [["false", "true", {"field": "f1"}], ["false", "false", {"field": "f2"}], ["true", "true", {"field": "f3"}], ["true", "false", {"field": "f4"}]]}, "fields": [{"expected": "false", "type": "token", "points": 1, "key": "f1"}, {"expected": "true", "type": "token", "points": 1, "key": "f2"}, {"expected": "true", "type": "token", "points": 1, "key": "f3"}, {"expected": "true", "type": "token", "points": 1, "key": "f4"}], "rubric": [], "points": 4}, {"id": "E05", "title": {"es": "Dos bloques alternativos", "de": "Zwei alternative Blöcke"}, "group": "decisions", "anchor": "Sommer 2022 · KAIT 2a", "scenario": {"es": "Un comercio clasifica la cola de impresión. En cada prueba se asigna primero queue = 10.", "de": "Ein Handelsbetrieb bewertet seine Druckwarteschlange. Bei jedem Test wird zunächst queue = 10 gesetzt."}, "prompt": {"es": "Anote el valor de queue después de ejecutar todo el fragmento para cada valor de jobs.", "de": "Tragen Sie den Wert von queue nach Ausführung des gesamten Ausschnitts für jeden Wert von jobs ein."}, "code": "int queue = 10;\nif (jobs > 3) {\n  queue = queue + 2;\n} else {\n  queue = queue + 1;\n}\nqueue = queue + 3;", "hint": {"es": "Solo uno de los bloques cambia queue. La última suma ocurre siempre.", "de": "Nur einer der Zweige verändert queue. Die letzte Addition erfolgt immer."}, "model": {"es": "Con jobs = 2: 10 + 1 + 3 = 14. Con jobs = 5: 10 + 2 + 3 = 15.", "de": "Bei jobs = 2: 10 + 1 + 3 = 14. Bei jobs = 5: 10 + 2 + 3 = 15."}, "table": {"headers": ["jobs", {"es": "queue al final", "de": "queue am Ende"}], "rows": [[2, {"field": "f1"}], [5, {"field": "f2"}]]}, "fields": [{"expected": "14", "type": "number", "points": 1, "key": "f1"}, {"expected": "15", "type": "number", "points": 1, "key": "f2"}], "rubric": [], "points": 2}, {"id": "E06", "title": {"es": "if separados frente a una cadena", "de": "Getrennte if gegenüber einer Kette"}, "group": "decisions", "anchor": "Sommer 2022 · KAIT 2a", "scenario": {"es": "Una clínica técnica compara dos versiones de clasificación de carga. Cada versión inicia score con 0.", "de": "Ein technischer Betrieb vergleicht zwei Versionen zur Lastbewertung. Jede Version startet mit score = 0."}, "prompt": {"es": "Complete los resultados de A y B para ambas cargas. Cada casilla vale un punto.", "de": "Vervollständigen Sie die Ergebnisse von A und B für beide Lastwerte. Jedes Feld zählt einen Punkt."}, "code": "// A: getrennte Entscheidungen\nint score = 0;\nif (last > 60) { score = score + 1; }\nif (last > 80) { score = score + 2; }\n\n// B: eine Entscheidungskette\nint score = 0;\nif (last > 60) { score = score + 1; }\nelse if (last > 80) { score = score + 2; }", "hint": {"es": "En A se comprueban los dos if. En B, la primera condición verdadera termina la selección.", "de": "A prüft beide if. Bei B beendet die erste wahre Bedingung die Auswahl."}, "model": {"es": "70: A = 1, B = 1. 90: A = 3, B = 1. En B, 90 ya cumple > 60; el else if no se evalúa.", "de": "70: A = 1, B = 1. 90: A = 3, B = 1. Bei B erfüllt 90 bereits > 60; else if wird nicht geprüft."}, "table": {"headers": [{"es": "Carga / %", "de": "Last / %"}, "A: score", "B: score"], "rows": [[70, {"field": "f1"}, {"field": "f2"}], [90, {"field": "f3"}, {"field": "f4"}]]}, "fields": [{"expected": "1", "type": "number", "points": 1, "key": "f1"}, {"expected": "1", "type": "number", "points": 1, "key": "f2"}, {"expected": "3", "type": "number", "points": 1, "key": "f3"}, {"expected": "1", "type": "number", "points": 1, "key": "f4"}], "rubric": [], "points": 4}, {"id": "E07", "title": {"es": "Tres trabajos en cola", "de": "Drei Aufträge in der Warteschlange"}, "group": "loops", "anchor": "Sommer 2024 · KAIT function translateCode(c){const translations={'A: getrennte Entscheidungen':'A: decisiones separadas','B: eine Entscheidungskette':'B: una cadena de decisiones','Alarm ausgeben':'Mostrar alarma','Dateien verschieben':'Mover archivos','Position i prüfen':'Revisar posición i','Prüfen, ohne last zu verändern':'Comprobar sin cambiar last','Vergleichsmaterial':'Material de comparación','Zeile 8':'Línea 8','fehlende Fortschrittsanweisung':'Falta la instrucción de avance','last: CPU-Auslastung in Prozent':'last: carga de CPU en porcentaje','n bleibt 5':'n conserva 5','n wird 6':'n pasa a 6'};return lang==='de'?c:c.split('\n').map(line=>{const p=line.indexOf('//');if(p<0)return line;const comment=line.slice(p+2).trim();return translations[comment]?line.slice(0,p)+'// '+translations[comment]:line;}).join('\n');}
function code(c,active=-1){return `<pre class="code" aria-label="${tr('Código del ejemplo','Beispielcode')}">${translateCode(c).split('\n').map((line,i)=>`<span class="line${i===active?' active':''}">${esc(line)||' '}</span>`).join('')}</pre>`;}
function staticTable(rows){return `<table><thead><tr>${rows[0].map(x=>`<th scope="col">${esc(t(x))}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(row=>`<tr>${row.map(x=>`<td>${esc(t(x))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function miniAnswer(x){return `<div class="check-box"><p><b>${tr('Piensa un momento','Denk kurz nach')}</b></p><p>${esc(t(x.check))}</p><button data-reveal="${x.id}" aria-haspopup="dialog">${tr('Comparar mi razonamiento','Meinen Gedankengang vergleichen')}</button></div>`;}
const frames=[
 {line:1,i:0,sum:0,rows:[],text:{es:'Inicializamos una vez: i y summe empiezan en 0.',de:'Einmalige Initialisierung: i und summe beginnen bei 0.'}},
 {line:2,i:0,sum:0,rows:[],text:{es:'0 < 2 es verdadero. Entramos en la primera vuelta.',de:'0 < 2 ist wahr. Der erste Durchlauf beginnt.'}},
 {line:3,i:0,sum:2,rows:[],text:{es:'Leemos la suma actual 0, añadimos 2 y guardamos 2.',de:'Die bisherige Summe 0 plus 2 wird als 2 gespeichert.'}},
 {line:4,i:1,sum:2,rows:[[1,2]],text:{es:'Aumentamos i a 1. Al final del cuerpo registramos la primera fila.',de:'i wird auf 1 erhöht. Am Körperende wird die erste Zeile notiert.'}},
 {line:2,i:1,sum:2,rows:[[1,2]],text:{es:'1 < 2 es verdadero. Empezamos la segunda vuelta con los valores actuales.',de:'1 < 2 ist wahr. Der zweite Durchlauf nutzt die aktuellen Werte.'}},
 {line:3,i:1,sum:4,rows:[[1,2]],text:{es:'Ahora la suma anterior es 2. Añadimos 2 y guardamos 4.',de:'Die bisherige Summe ist jetzt 2. Plus 2 ergibt den neuen Wert 4.'}},
 {line:4,i:2,sum:4,rows:[[1,2],[2,4]],text:{es:'Aumentamos i a 2. Registramos la segunda fila al final del cuerpo.',de:'i wird auf 2 erhöht. Am Körperende wird die zweite Zeile notiert.'}},
 {line:2,i:2,sum:4,rows:[[1,2],[2,4]],text:{es:'2 < 2 es falso. Terminamos sin ejecutar otra vuelta. Resultado: summe = 4.',de:'2 < 2 ist falsch. Keine weitere Körperausführung. Ergebnis: summe = 4.'}}
];
function visual(x){const v=x.viz;let h='';const heading={pipeline:tr('De la medición al aviso','Vom Messwert zur Warnung'),assign:tr('El valor se reemplaza','Der Wert wird ersetzt'),comparisons:tr('Probar el límite','Den Grenzwert prüfen'),branch:tr('Una decisión, dos caminos','Eine Entscheidung, zwei Wege'),logic:tr('Combinar dos respuestas','Zwei Antworten verbinden'),cases:tr('Primera alternativa verdadera','Erster wahrer Zweig'),while:tr('Comprobar → actuar → volver','Prüfen → ausführen → zurück'),stepper:tr('Código y estado, paso a paso','Code und Zustand, Schritt für Schritt'),for:tr('Tres partes del control','Drei Teile der Steuerung'),zero:tr('El momento de la comprobación','Zeitpunkt der Prüfung'),array:tr('El índice selecciona la casilla','Der Index wählt das Feld'),count:tr('Un dato, dos operaciones','Ein Wert, zwei Operationen'),max:tr('Conservar el mayor','Das Maximum behalten'),max2:tr('Conservar el mayor anterior','Das vorige Maximum sichern'),method:tr('Tu procedimiento de examen','Dein Vorgehen in der Prüfung')};
switch(v.kind){

case 'assign':h=code(v.code)+`<div class="assign-flow"><div class="metric"><span>tickets · ${tr('antes','vorher')}</span><strong>2</strong></div><span class="arrow" aria-hidden="true">→</span><div class="metric"><span>tickets · ${tr('después','nachher')}</span><strong>3</strong></div></div><p>${tr('Leer 2 → calcular 2 + 1 → guardar 3. La casilla conserva solo 3.','2 lesen → 2 + 1 berechnen → 3 speichern. Das Fach enthält jetzt nur 3.')}</p>`;break;
case 'comparisons':h=staticTable([[tr('Carga / %','Last / %'),'last > 80','last >= 80'],[79,'false','false'],[80,'false','true'],[81,'true','true']])+[['<',tr('menor que','kleiner als')],['<=',tr('menor o igual','kleiner oder gleich')],['==',tr('igual','gleich')],['!=',tr('distinto','ungleich')]].map(([a,b])=>`<div class="operator-row"><code>${esc(a)}</code><span>${b}</span></div>`).join('')+`<p>${tr('= guarda; == compara. La comparación devuelve true o false.','= speichert; == vergleicht. Der Vergleich liefert true oder false.')}</p>`;break;
case 'branch':h=code(v.code)+`<div class="two"><div class="stage"><b>true → if</b><span>status = "WARN"</span></div><div class="stage"><b>false → else</b><span>status = "OK"</span></div></div><p>${tr('Después de cualquiera de las dos alternativas: mostrar status.','Nach jedem der beiden Zweige: status ausgeben.')}</p>`;break;
case 'logic':h=code('(belegung > 40) && (belegung < 60)')+staticTable([[tr('Dato / %','Wert / %'),'> 40','< 60','&&'],[50,'true','true','true'],[70,'true','false','false']])+[['&&',tr('Y: ambas verdaderas','UND: beide wahr')],['||',tr('O: al menos una verdadera','ODER: mindestens eine wahr')],['!',tr('NO: invierte la respuesta','NICHT: kehrt die Antwort um')]].map(([a,b])=>`<div class="operator-row"><code>${a}</code><span>${b}</span></div>`).join('');break;
case 'cases':case 'max':case 'max2':h=code(v.code)+staticTable(v.table);break;
case 'while':h=code(v.code)+`<div class="stage"><b>${tr('Antes: i = 0','Vorher: i = 0')}</b></div><div class="stage"><b>i &lt; 3?</b><span>${tr('true: ejecutar cuerpo y volver a preguntar','true: Körper ausführen und erneut prüfen')}</span></div><div class="stage"><b>${tr('false: continuar después del bucle','false: nach der Schleife fortsetzen')}</b></div>`;break;
case 'stepper':{const n=state.steps[x.id]||0,f=frames[n];h=code(v.code,f.line)+`<div class="step-state" aria-live="polite"><p>${esc(t(f.text))}</p><strong>i = ${f.i} · summe = ${f.sum}</strong></div><div class="step-actions"><button data-step-reset>${tr('Reiniciar','Zurücksetzen')}</button><span>${tr('Paso','Schritt')} ${n+1} / ${frames.length}</span><button class="primary" data-step="next" ${n===frames.length-1?'disabled':''}>${tr('Paso →','Schritt →')}</button></div>`+staticTable([[tr('i al final del cuerpo','i am Körperende'),tr('summe al final','summe am Ende')],...f.rows]);break;}
case 'for':h=code('for (int i = 0; i < 3; i++) {\n  Console.WriteLine(i);\n}')+`<div class="stage"><b>1 · int i = 0</b><span>${tr('Inicio: solo una vez','Start: nur einmal')}</span></div><div class="stage"><b>2 · i &lt; 3</b><span>${tr('Antes de cada cuerpo','Vor jedem Körper')}</span></div><div class="stage"><b>3 · i++</b><span>${tr('Después de cada cuerpo: sumar 1 y volver a 2','Nach jedem Körper: 1 addieren, zurück zu 2')}</span></div><p>${tr('Salida: 0, 1, 2. Con i = 3, la prueba ya es falsa.','Ausgabe: 0, 1, 2. Bei i = 3 ist die Prüfung falsch.')}</p>`;break;
case 'zero':h=code('int n = 5;\nwhile (n < 3) { n++; }\n// n bleibt 5\n\nint n = 5;\ndo { n++; } while (n < 3);\n// n wird 6')+staticTable([[tr('Forma','Art'),tr('Primero','Zuerst'),tr('Mínimo de vueltas','Min. Durchläufe')],['while',tr('comprobar','prüfen'),0],['do / while',tr('ejecutar','ausführen'),1]]);break;
case 'array':h=code('int[] last = {42, 87, 80, 91};\nint i = 1;')+`<div class="array">${v.values.map((n,i)=>`<div><small>${tr('Índice','Index')} ${i}</small><b>${n}</b><small>%</small></div>`).join('')}</div><p><b>i = 1 · last[i] = 87 · last.Length = 4</b></p><p>${tr('Hay 4 casillas; el último índice es 3. Con i = 4, no existe una casilla que leer.','Es gibt 4 Felder; der letzte Index ist 3. Bei i = 4 gibt es kein lesbares Feld.')}</p>`;break;
case 'count':h=staticTable([['last / %',tr('Suma acumulada','Laufende Summe'),tr('Cantidad > 80','Anzahl > 80')],[42,42,0],[87,129,1],[91,220,2]])+code('summe = summe + last[i];\n\nif (last[i] > 80) {\n  anzahl = anzahl + 1;\n}')+`<p>${tr('Summe añade el valor. Anzahl añade una medición solo si cumple la regla.','summe addiert den Wert. anzahl addiert nur bei erfüllter Regel einen Messwert.')}</p>`;break;
case 'method':h=`<ol class="method-list">${[tr('Identificar entradas y valores iniciales.','Eingaben und Anfangswerte bestimmen.'),tr('Leer el momento de cada columna.','Zeitpunkt jeder Spalte lesen.'),tr('Ejecutar las instrucciones en orden.','Anweisungen in Reihenfolge ausführen.'),tr('Conservar valores sin asignación nueva.','Werte ohne neue Zuweisung behalten.'),tr('Registrar el código dado, incluso con fallo.','Vorliegenden Code auch mit Fehler notieren.'),tr('Explicar la causa y corregir la línea pedida.','Ursache erläutern und gefragte Zeile korrigieren.')].map(x=>`<li>${x}</li>`).join('')}</ol><p>${tr('Vervollständigen: completar. Erläutern: explicar la relación causal. Entwickeln: proponer una solución.','Vervollständigen: fehlende Einträge ergänzen. Erläutern: einen ursächlichen Zusammenhang erklären. Entwickeln: eine Lösung erarbeiten.')}</p>`;break;
}
return `<div class="figure"><h2>${heading[v.kind]}</h2>${h}${v.kind==='stepper'?'':miniAnswer(x)}</div>`;}
function renderLesson(x){return `<article><p class="eyebrow">${tr('Comprender','Verstehen')} · ${x.id.slice(1)}</p><h1 class="page-title">${esc(t(x.title))}</h1><div class="lesson-grid"><div class="prose">${x.paras.map(p=>`<p>${esc(t(p))}</p>`).join('')}${x.viz.kind==='stepper'?miniAnswer(x):''}</div>${visual(x)}</div></article>`;}
function fieldLabel(x,row,col){return `${t(x.title)} · ${t(x.table.headers[col])} · ${tr('fila','Zeile')} ${row+1}`;}
function materialCode(x,r){if(x.id==='E21')return `<div class="exam-paper"><h2>${tr('Borrador: complete dentro del código','Entwurf: direkt im Code ergänzen')}</h2><pre class="code draft">${translateCode(x.code).split('\n').map(line=>`<span class="line">${esc(line).replace(/\[([1-4])\]/g,(_,n)=>`<input class="inline-code" data-answer="f${n}" value="${esc(r.answers['f'+n]||'')}" aria-label="${tr('Hueco','Lücke')} ${n} · ${x.fields[Number(n)-1].points} ${tr('puntos','Punkte')}" spellcheck="false" autocomplete="off">`)}</span>`).join('')}</pre><p class="small-note">${tr('Huecos','Lücken')}: [1] 3 · [2] 2 · [3] 2 · [4] 2 ${tr('puntos; los dos resultados valen 1 cada uno.','Punkte; die beiden Ergebnisse zählen je 1 Punkt.')}</p></div>`;let h=code(x.code);if(x.id==='E13')h+=`<div class="material-array"><p>${tr('Material: tiempos de respuesta por posición','Material: Antwortzeiten je Position')}</p><div class="array">${[12,28,15,31].map((v,i)=>`<div><small>${tr('Índice','Index')} ${i}</small><b>${v}</b><small>ms</small></div>`).join('')}</div></div>`;return h;}
function renderTask(x){const r=record(x);return `<article class="task" data-exercise="${x.id}"><div class="task-meta"><span class="label">eigene Aufgabe, nicht offiziell IHK</span><span class="points">${x.points} ${tr('puntos','Punkte')}</span></div><h1 class="page-title">${x.id.slice(1)} · ${esc(t(x.title))}</h1><p class="scenario">${esc(t(x.scenario))}</p><p class="prompt">${esc(t(x.prompt))}</p><div class="task-grid"><div>${materialCode(x,r)}<p class="anchor">${tr('Formato adaptado de','Format angelehnt an')}: ${esc(x.anchor)}. ${tr('Datos, tarea y criterios propios.','Eigene Daten, Aufgabe und Kriterien.')}</p></div><div class="exam-paper"><h2>${tr('Material y campos de respuesta','Material und Antwortfelder')}</h2><div class="table-wrap"><table><thead><tr>${x.table.headers.map(a=>`<th scope="col">${esc(t(a))}</th>`).join('')}</tr></thead><tbody>${(x.id==='E21'?x.table.rows.slice(4):x.table.rows).map((row,i)=>`<tr>${row.map((c,j)=>{if(c&&c.field){const f=x.fields.find(z=>z.key===c.field);return `<td><input data-answer="${f.key}" class="${f.type==='code'?'code-input':''}" type="text" ${f.type==='number'?'inputmode="numeric"':''} aria-label="${esc(fieldLabel(x,i,j))}" value="${esc(r.answers[f.key]||'')}" autocomplete="off" spellcheck="false"></td>`;}return `<td>${esc(t(c))}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>${x.rubric.length?`<label for="written" class="answer-label">${tr('Explicación escrita en alemán','Schriftliche Erläuterung auf Deutsch')}</label><textarea class="written" id="written" data-written spellcheck="true" lang="de">${esc(r.written)}</textarea><p class="small-note">${tr('El texto se compara manualmente con criterios por punto y modelo. No recibe una puntuación automática.','Der Text wird manuell mit Einzelkriterien und Modell verglichen. Er wird nicht automatisch bewertet.')}</p>`:''}<p class="small-note">${tr('Puntos de práctica: cada casilla vale 1, salvo los huecos de código indicados al comprobar.','Übungspunkte: Jedes Feld zählt 1, außer den bei der Prüfung ausgewiesenen Codelücken.')}</p></div></div><div class="task-actions"><button class="primary" data-check>${tr('Comprobar','Prüfen')}</button><button data-hint>${tr('Pista','Hinweis')}</button><button data-solution>${tr('Solución y criterios','Lösung und Kriterien')}</button></div><p class="task-status" data-status>${statusText(x)}</p></article>`;}

function renderSummary(){return `<article><p class="eyebrow">${tr('Guardar y volver a practicar','Sichern und erneut üben')}</p><h1 class="page-title">${tr('Tu registro y las fuentes','Dein Lernprotokoll und die Quellen')}</h1><div class="summary-grid"><div class="figure"><h2>${tr('Un registro de intentos','Ein Protokoll deiner Versuche')}</h2><p>${tr('La exportación guarda las respuestas, las notas de cada página, los intentos y si usaste pista o viste una solución. La revisión del texto se identifica como autoevaluación, separada de las casillas comprobadas.','Der Export speichert Antworten, Seitennotizen, Versuche sowie Hinweise und angesehene Lösungen. Die Textprüfung wird als Selbsteinschätzung getrennt von den geprüften Feldern ausgewiesen.')}</p><p>${tr('Resolver una tarea hoy no demuestra retención ni dominio. Para comprobar qué recuerdas, repite otro día una tarea extra sin abrir la pista ni el modelo y escribe por qué se ejecuta cada paso.','Eine heute gelöste Aufgabe belegt weder langfristiges Behalten noch Beherrschung. Bearbeite an einem anderen Tag eine Zusatzaufgabe ohne Hinweis oder Modell und erkläre die ausgeführten Schritte.')}</p><button data-export-copy class="primary">${tr('Exportar respuestas y notas','Antworten und Notizen exportieren')}</button><p>${tr('Los archivos HTML no transmiten datos. Las notas son locales; exporta el JSON antes de cambiar de navegador o borrar sus datos.','Die HTML-Datei überträgt keine Daten. Notizen bleiben lokal; exportiere JSON vor einem Browserwechsel oder dem Löschen seiner Daten.')}</p></div><div><h2>${tr('Fuentes de contenido y método','Quellen für Inhalt und Methode')}</h2><ul class="sources-list"><li>Kersken · IT-Handbuch, 11. Auflage (2023), §7.1.2, S. 438–485; ${tr('variables, comparaciones y control del flujo','Variablen, Vergleiche und Ablaufsteuerung')}.</li><li>IT-Berufe · Grundstufe (2020), LF5, S. 518–523, 537–540, 544–560; ${tr('secuencia, decisiones, bucles y ejemplos progresivos','Sequenz, Auswahl, Schleifen und fortlaufende Beispiele')}.</li><li>IT-Berufe · Fachstufe (2021), LF8, S. 221–225; ${tr('notación de bloques y tipos de bucle','Blocknotation und Schleifenarten')}.</li><li>IHK · Sommer 2022 KAIT 2a/2b; Sommer 2023 KAIT 3a; Sommer 2024 KAIT 3aa/3ab/3ac. ${tr('Solo se usan formatos y mecanismos para tareas con datos propios.','Formate und Mechanismen werden für Aufgaben mit eigenen Daten verwendet.')}</li><li>Rosenshine (2012), S. 12–19; IES (2007), ${tr('recomendaciones','Empfehlungen')} 2–4, 5b, 7; Nation (2007), The Four Strands.</li><li>Mayer (2017), Using multimedia for e-learning, DOI 10.1111/jcal.12197: ${tr('señalización, proximidad de explicación y estado, avance por pasos','Signalisierung, räumliche Nähe von Erklärung und Zustand, schrittweises Vorgehen')}.</li><li>Teach Computing: Sequence → Selection → Iteration (${tr('tablas de trazado antes de for','Ablauftabellen vor for')}); Python Tutor: ${tr('seguir código y valores juntos','Code und Werte zusammen verfolgen')}.</li></ul><p class="small-note">${tr('Las referencias completas, páginas PDF y comprobaciones están en REPORTE-taller.md.','Vollständige Referenzen, PDF-Seiten und Prüfungen stehen in REPORTE-taller.md.')}</p></div></div></article>`;}
function renderNav(){const lessonLabels=[['Automatizar','Automatisieren'],['Variables y asignación','Variablen und Zuweisung'],['Condiciones y comparación','Bedingungen und Vergleich'],['if / else: alternativas','if / else: Alternativen'],['Y, O, NO','UND, ODER, NICHT'],['Orden de decisiones','Reihenfolge der Auswahl'],['while: repetir','while: wiederholen'],['Tabla de trazado','Ablauftabelle'],['for: inicio y avance','for: Start und Fortschritt'],['Cero vueltas / sin fin','Null Durchläufe / endlos'],['Array: índice y valor','Array: Index und Wert'],['Acumular y contar','Summieren und Zählen'],['El máximo','Der Höchstwert'],['Dos máximos','Zwei Höchstwerte'],['Método de examen','Prüfungsmethode']];const indexed=pages.map((p,i)=>({p,i}));const groups=[{name:tr('Explicaciones · desde cero','Erklärungen · von Grund auf'),kind:'lessons',items:indexed.filter(z=>z.p.type==='lesson')},{name:tr('Tareas 01–06 · Condiciones','Aufgaben 01–06 · Bedingungen'),kind:'tasks',items:indexed.filter(z=>z.p.type==='task'&&z.p.data.group==='decisions')},{name:tr('Tareas 07–12 · Bucles','Aufgaben 07–12 · Schleifen'),kind:'tasks',items:indexed.filter(z=>z.p.type==='task'&&z.p.data.group==='loops')},{name:tr('Tareas 13–17 · Arrays y trazado','Aufgaben 13–17 · Arrays und Verlauf'),kind:'tasks',items:indexed.filter(z=>z.p.type==='task'&&z.p.data.group==='arrays')},{name:tr('Tareas 18–22 · Nivel examen','Aufgaben 18–22 · Prüfungsniveau'),kind:'tasks',items:indexed.filter(z=>z.p.type==='task'&&z.p.data.group==='exam')}];$('#nav').innerHTML=groups.map((g,n)=>`<section class="nav-group${g.items.some(z=>z.i===current)?' current':''}" aria-labelledby="nav-heading-${n}"><h2 id="nav-heading-${n}">${g.name}</h2><div class="${g.kind==='lessons'?'nav-lessons':'nav-grid'}">${g.items.map(({p,i})=>{const number=p.data.id.slice(1),full=number+' · '+t(p.data.title);return `<button class="nav-item${g.kind==='tasks'?' nav-task':''}" data-goto="${i}" aria-label="${esc(full)}" title="${esc(full)}" ${i===current?'aria-current="page"':''}>${g.kind==='lessons'?`<span class="nav-num">${number}</span><span class="nav-caption">${esc(tr(...lessonLabels[i]))}</span>`:number}</button>`;}).join('')}</div></section>`).join('')+`<button class="nav-item nav-summary" data-goto="${pages.length-1}" ${current===pages.length-1?'aria-current="page"':''}>${tr('Registro y fuentes','Protokoll und Quellen')}</button>`;}

function go(i){current=Math.max(0,Math.min(pages.length-1,i));render();$('#content').scrollTop=0;$('#content').focus({preventScroll:true});}
function openModal(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;$('#modal').showModal();}
function normalize(s){return String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/;+$/,'');}
function grade(f,raw){const s=String(raw||'').trim();if(!s)return 'empty';if(f.type==='number')return /^[+-]?\d+$/.test(s)&&Number(s)===Number(f.expected)?'correct':'incorrect';let n=normalize(s);if(f.expected==='true'||f.expected==='false'){if(['true','wahr','verdadero'].includes(n))n='true';if(['false','falsch','falso'].includes(n))n='false';}return [f.expected,...(f.variants||[])].map(normalize).includes(n)?'correct':'incorrect';}
function check(x){const r=record(x),results=x.fields.map(f=>({key:f.key,result:grade(f,r.answers[f.key]),points:f.points}));const score=results.filter(f=>f.result==='correct').reduce((a,f)=>a+f.points,0),maximum=x.fields.reduce((a,f)=>a+f.points,0);r.attempts.push({at:new Date().toISOString(),answers:{...r.answers},written:r.written,support:support(r),fieldScore:score,fieldMaximum:maximum,results,freeTextReview:x.rubric.length?'pending':null});save();$('[data-status]').textContent=statusText(x);openModal(tr('Comprobación de campos','Feldprüfung'),`<p class="state-banner" data-score="${score}" data-max="${maximum}">${tr('Casillas comprobadas','Geprüfte Felder')}: ${score} / ${maximum} · ${supportLabel(support(r))}</p><ul class="feedback-list">${results.map(f=>{let label='';x.table.rows.forEach((row,i)=>row.forEach((c,j)=>{if(c&&c.field===f.key)label=`${t(x.table.headers[j])} · ${tr('fila','Zeile')} ${i+1}`;}));return `<li class="${f.result==='correct'?'good':'bad'}" data-result="${f.result}">${esc(label)}: ${f.result==='correct'?tr('correcto','richtig'):f.result==='empty'?tr('vacío: añade tu respuesta','leer: Antwort ergänzen'):tr('no coincide: revisa la instrucción y el valor anterior','stimmt nicht: Anweisung und vorherigen Wert prüfen')} (${f.points} ${tr('puntos posibles','mögliche Punkte')})</li>`;}).join('')}</ul>${x.rubric.length?`<p data-free-review>${r.written.trim()?tr('Texto recibido. Compáralo por criterio con el modelo; no se ha puntuado automáticamente.','Text vorhanden. Vergleiche ihn anhand der Kriterien mit dem Modell; keine automatische Bewertung.'):tr('Explicación vacía. No hay evidencia escrita para revisar.','Erläuterung leer. Kein schriftlicher Beleg zur Prüfung.')}</p><button data-solution>${tr('Abrir modelo y criterios','Modell und Kriterien öffnen')}</button>`:''}<p>${tr('La pista orienta sin rellenar; la solución muestra valores y razonamiento. Estos puntos son práctica propia y no certifican dominio.','Der Hinweis unterstützt ohne Einträge; die Lösung zeigt Werte und Gedankengang. Diese eigenen Übungspunkte belegen keine Beherrschung.')}</p>`);}
function solution(x){const r=record(x);r.solution=true;save();$('[data-status]').textContent=statusText(x);if($('#modal').open)$('#modal').close();const solved=[x.table.headers,...x.table.rows.map(row=>row.map(c=>c&&c.field?x.fields.find(f=>f.key===c.field).expected:c))];openModal(tr('Solución y criterios propios','Lösung und eigene Kriterien'),`<p class="state-banner">${supportLabel(support(r))} · ${tr('Cada criterio escrito vale un punto. Marca solo lo que tu propia respuesta explica.','Jedes Textkriterium zählt einen Punkt. Markiere nur, was deine eigene Antwort erläutert.')}</p><p>${esc(t(x.model))}</p>${staticTable(solved)}${x.rubric.length?`<p><b>${tr('Tu respuesta alemana','Deine deutsche Antwort')}</b></p><p data-own-written style="white-space:pre-wrap">${esc(r.written)||tr('Sin respuesta escrita.','Keine schriftliche Antwort.')}</p><div>${x.rubric.map((c,i)=>`<label class="rubric-item"><input type="checkbox" data-rubric="${i}" ${r.rubric[i]?'checked':''} ${r.written.trim()?'':'disabled'}><span>${esc(t(c))}</span></label>`).join('')}</div><p data-rubric-score>${tr('Autoevaluación del texto','Selbsteinschätzung des Textes')}: ${r.rubric.filter(Boolean).length} / ${x.rubric.length}</p><button data-save-review>${tr('Guardar esta revisión manual','Diese manuelle Prüfung speichern')}</button>`:''}<p class="small-note">${tr('Otras explicaciones equivalentes pueden cumplir los criterios. No se compara el texto por palabras clave ni por coincidencia literal.','Andere inhaltlich gleichwertige Erläuterungen können die Kriterien erfüllen. Kein Schlüsselworttest und kein wörtlicher Textvergleich.')}</p>`);}
function hint(x){const r=record(x);r.hint=true;save();$('[data-status]').textContent=statusText(x);openModal(tr('Pista','Hinweis'),`<p>${esc(t(x.hint))}</p><p class="small-note">${tr('Queda registrado el uso de pista. Cerrar esta caja no borra ese registro.','Die Hinweisnutzung wird gespeichert. Das Schließen entfernt diesen Eintrag nicht.')}</p>`);}
function notes(){const id=pages[current].data.id;openModal(tr('Notas de esta página','Notizen zu dieser Seite'),`<label class="answer-label" for="note-text">${esc(t(pages[current].data.title))}</label><textarea class="written" id="note-text" data-note="${id}" placeholder="${tr('Tu explicación, dudas o un ejemplo…','Deine Erklärung, Fragen oder ein Beispiel…')}">${esc(state.notes[id]||'')}</textarea><p class="small-note">${tr('Se guarda al escribir. Las notas de todas las páginas se incluyen en la exportación.','Wird beim Schreiben gespeichert. Alle Seitennotizen werden exportiert.')}</p>`);}
function exportData(){save();const data={workshop:'FISI AP2 · Automatización II · 2026-10-06',version:1,exportedAt:new Date().toISOString(),...state,labels:pages.map(p=>({id:p.data.id,title:p.data.title})),scoringPolicy:{fields:'deterministic exact numeric/token/code checks',written:'manual per-point rubric; no automatic keyword scoring',masteryClaim:false}};const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));a.href=url;a.download='respuestas-2026-10-06.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
$('#prev').addEventListener('click',()=>go(current-1));$('#next').addEventListener('click',()=>go(current+1));$('#notes').addEventListener('click',notes);$('#export').addEventListener('click',exportData);$('#modal-close').addEventListener('click',()=>$('#modal').close());$('#language').addEventListener('change',e=>{lang=e.target.value;render();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=pages[current],x=p.data;if(b.hasAttribute('data-goto'))go(Number(b.dataset.goto));if(b.hasAttribute('data-reveal')){openModal(tr('Compara tu razonamiento','Vergleiche deinen Gedankengang'),`<p>${esc(t(x.check))}</p><p class="answer-reveal">${esc(t(x.answer))}</p>`);}if(b.hasAttribute('data-step')){state.steps[x.id]=Math.min(frames.length-1,(state.steps[x.id]||0)+1);render();}if(b.hasAttribute('data-step-reset')){state.steps[x.id]=0;render();}if(b.hasAttribute('data-check'))check(x);if(b.hasAttribute('data-hint'))hint(x);if(b.hasAttribute('data-solution'))solution(x);if(b.hasAttribute('data-export-copy'))exportData();if(b.hasAttribute('data-save-review')){const r=record(x);r.reviews=r.reviews||[];r.reviews.push({at:new Date().toISOString(),written:r.written,criteria:[...r.rubric],score:r.rubric.filter(Boolean).length,maximum:x.rubric.length,source:'self-assessment',support:support(r)});save();b.textContent=tr('Revisión guardada','Prüfung gespeichert');b.disabled=true;}});
document.addEventListener('input',e=>{const x=pages[current].data;if(e.target.hasAttribute('data-answer')){record(x).answers[e.target.dataset.answer]=e.target.value;save();}if(e.target.hasAttribute('data-written')){record(x).written=e.target.value;record(x).rubric=[];save();}if(e.target.hasAttribute('data-note')){state.notes[e.target.dataset.note]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-rubric')){const r=record(pages[current].data);r.rubric[Number(e.target.dataset.rubric)]=e.target.checked;save();$('[data-rubric-score]').textContent=tr('Autoevaluación del texto','Selbsteinschätzung des Textes')+`: ${r.rubric.filter(Boolean).length} / ${pages[current].data.rubric.length}`;}});
render();
</script></body></html>
