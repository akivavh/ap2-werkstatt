<style>
:root{color-scheme:light;--bg:#f2f6fa;--surface:#fff;--text:#162c40;--dim:#4d6074;--line:#75889a;--soft:#d6e0ea;--accent:#145f99;--tint:#e7f0f8;--mono:"Cascadia Mono","Consolas",monospace}
*{box-sizing:border-box}html{font-size:17px}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI Variable","Segoe UI",sans-serif;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 16px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--accent);background:var(--tint)}button:disabled{cursor:default;color:#596c7d;background:#e8edf2;border-color:#b6c3ce}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.primary:hover{background:#104f80}a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}.shell{height:100vh;display:grid;grid-template-rows:72px 6px minmax(0,1fr) 76px;padding:0 32px;max-width:1600px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--soft)}.brand{font-family:Bahnschrift,"Segoe UI",sans-serif;font-size:1.25rem}.brand small{font-family:"Segoe UI",sans-serif;font-size:.875rem;margin-left:24px;color:var(--dim)}.toolbar{display:flex;gap:8px;align-items:center}.toolbar button{font-size:.875rem}#saveStatus{font-size:.875rem;color:var(--dim);max-width:290px}.progress{height:6px;background:var(--soft)}.progress span{height:100%;display:block;background:var(--accent);width:0}
main{min-height:0;padding:24px 0 16px}.page{height:100%;display:flex;flex-direction:column;gap:16px}.heading{display:flex;justify-content:space-between;align-items:baseline;gap:24px}h1,h2,h3{font-family:Bahnschrift,"Segoe UI",sans-serif;font-weight:600;margin:0}h1{font-size:2.25rem;line-height:1.15;letter-spacing:-.025em}h2{font-size:1.625rem}h3{font-size:1.25rem}.chapter{color:var(--dim);white-space:nowrap}p{margin:0;max-width:78ch}.lead{font-size:1.125rem;color:var(--dim)}.caption,figcaption{font-size:1rem;color:var(--dim)}figure{margin:0;min-width:0}.stage{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--soft);border-radius:10px;padding:24px;gap:16px}.stage svg{width:100%;height:100%;min-height:0;flex:1}svg text{font-size:16px;font-family:"Segoe UI",sans-serif;fill:var(--text)}svg .edge{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#arrow)}svg .edge-label{font-size:14px;fill:var(--dim);paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}svg .node{fill:white;stroke:var(--line);stroke-width:1.5}svg .key{fill:var(--tint);stroke:var(--accent);stroke-width:2.5}svg .active-label{fill:var(--accent);font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:32px;flex:1;min-height:0}.layout>*{min-width:0}.prompt{display:flex;flex-direction:column;gap:16px}.work{border-left:1px solid var(--soft);padding-left:32px;display:flex;flex-direction:column;gap:12px;min-width:0}.code{font-family:var(--mono);font-size:.875rem;white-space:pre;line-height:1.55;background:white;padding:16px 24px;border:1px solid var(--soft);border-radius:4px;margin:0}.origin{font-size:.875rem;color:var(--dim)}.data-strip{display:flex;gap:8px;flex-wrap:wrap}.datum{min-width:72px;padding:8px 16px;background:white;border:1px solid var(--line);text-align:center;font-family:var(--mono)}.datum.current{background:var(--tint);border:2px solid var(--accent);padding:7px 15px}.datum small{display:block;font-family:"Segoe UI",sans-serif;font-size:.75rem;color:var(--dim)}
table{width:100%;border-collapse:collapse;background:white;table-layout:fixed}th,td{text-align:left;border-bottom:1px solid var(--soft);padding:10px 12px}th{color:var(--dim);font-weight:600}td{height:46px}tr.current{background:var(--tint);outline:2px solid var(--accent);outline-offset:-2px}td input{width:74px;padding:5px 8px;background:white;border:1px solid var(--line);border-radius:4px}td .mark{display:inline-block;margin-left:8px;min-width:18px;color:var(--text);font-weight:600}input[aria-invalid=true]{border-style:dashed;border-width:2px}input[aria-invalid=false]{border:2px solid var(--accent)}.field{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;align-items:center;background:white;border-bottom:1px solid var(--soft);padding:16px}.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px}.field label{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap}.feedback{min-height:56px;color:var(--text);background:var(--tint);padding:12px 16px;border-radius:4px;font-size:1rem}.status{font-size:.875rem;color:var(--dim)}.stepper{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.stepper .actions{flex-wrap:nowrap}.state-line{display:flex;align-items:center;gap:24px;padding:16px 24px;background:var(--surface);border:2px solid var(--accent)}.state-line strong{font-size:2.25rem;font-family:Bahnschrift,sans-serif;color:var(--accent)}.state-line .text{flex:1}.trace{display:flex;flex-direction:column;gap:16px;min-height:0}.trace table{flex:1}.trace td{height:52px}.trace th{padding:12px}.trace-layout{grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr)}.trace-header{display:flex;justify-content:space-between;gap:16px}.writing{width:100%;height:180px;resize:none;padding:16px;border:1px solid var(--line);border-radius:4px;background:white;line-height:1.5}.writing.large{height:210px}.criteria{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.criterion{padding:24px 0;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:16px}.criterion input{width:20px;height:20px}.criterion label{display:flex;gap:12px;align-items:start}.criterion .n{font:2.25rem Bahnschrift,sans-serif;color:var(--accent)}.ledger{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;flex:1}.ledger-items{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}.ledger-item{border-bottom:1px solid var(--soft);padding:16px 0}.ledger-item span{display:block;font-size:.875rem;color:var(--dim);margin-top:8px}.note{flex:1;min-height:180px;width:100%;resize:none;padding:16px;border:1px solid var(--line);border-radius:4px}.sources{font-size:.875rem;line-height:1.5}.sources p{margin-bottom:8px}.footer{border-top:1px solid var(--soft);display:flex;justify-content:space-between;align-items:center;gap:24px}.position{text-align:center}.position small{display:block;font-size:.875rem;color:var(--dim)}.footer button{min-width:128px}
dialog{width:min(920px,calc(100vw - 96px));max-height:calc(100vh - 80px);padding:24px 32px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:white;overflow:auto}dialog::backdrop{background:rgb(22 44 64 / .35)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:24px}#dialogBody{display:flex;flex-direction:column;gap:16px}#dialogBody p{max-width:none}.model-table td{height:40px;padding:6px 16px}.model-table th{padding:8px 16px}.es-text{font-size:1.125rem;line-height:1.6}.compare{font-size:1rem}.compare li{margin-bottom:12px}noscript{display:block;padding:32px}
.work>table{flex:1}.work>.field{flex:1}.work>.writing{flex:1;min-height:180px}.field input{height:48px}#official td{padding:6px 12px}#official .work{gap:8px}.source-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;flex:1}.source-grid article{border-top:2px solid var(--line);border-bottom:1px solid var(--soft);background:white;padding:32px;display:flex;flex-direction:column;gap:24px}.source-grid article h2{color:var(--accent)}
@media(max-height:800px){main{padding-top:16px}.page{gap:12px}.stage{padding:16px 24px}.trace td{height:46px}.field{padding:12px 16px}.code{line-height:1.48}.writing.large{height:180px}}
@media print{.shell{height:auto;display:block}.top,.footer,.progress,.actions,.stepper{display:none!important}.page[hidden]{display:flex!important}.page{height:auto;min-height:800px;break-after:page}.layout{min-height:450px}.stage{min-height:440px}body{background:white}dialog{display:none}main{padding:0}.heading{margin:24px 0}}
</style></head>
<body>
<noscript>Dieses Offline-Labor benötigt JavaScript. Aktivieren Sie JavaScript und öffnen Sie die Datei erneut.</noscript>
<div class="shell">
<header class="top"><div class="brand">Spurenlabor <small>FISI AP2 · 06.10.2026</small></div><div class="toolbar"><span id="saveStatus" role="status">Speicher wird geprüft</span><button id="spanish" lang="es">Español</button><button id="export">Antworten exportieren</button></div></header>
<div class="progress" role="progressbar" aria-label="Seitenfortschritt" aria-valuemin="1" aria-valuemax="12" aria-valuenow="1"><span></span></div>
<main id="pages"></main>
<nav class="footer" aria-label="Seitennavigation"><button data-nav="prev">Zurück</button><div class="position"><span data-page-indicator></span><small>Pfeiltasten wechseln Seiten · Eingaben bleiben erhalten</small></div><button class="primary" data-nav="next">Weiter</button></nav>
</div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog">Schließen</button></div><div id="dialogBody"></div></dialog>
<script>
'use strict';
// Ein Modell liefert Daten, Code, Traces, Lösungen und Korrekturwerte.
const MODEL={
 demo:{values:[40,60,80],limit:60,op:'>=',initial:0},
 guided:{values:[30,70,60],limit:60,op:'>=',initial:0},
 variant:{values:[60,20,90,80],limit:60,op:'>',initial:0},
 written:{values:[50,60,90],limit:60,op:'>=',initial:0},
 official:{values:[12,10,40,73,33,60],initial:[0,0],faulty:true}
};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function countTrace(m){let count=m.initial;return m.values.map((v,i)=>{const before=count,yes=m.op==='>='?v>=m.limit:v>m.limit;if(yes)count++;return {i,value:v,before,yes,count};});}
function maxTrace(m){let [max,max2]=m.initial;return m.values.map((v,i)=>{const before=[max,max2];let branch='Keine Zuweisung';if(v>max){max2=max;max=v;branch='if';}else if(v>max2){if(m.faulty)max=v;else max2=v;branch='else if';}return {i,value:v,before,max,max2,branch};});}
const TRACES={};for(const [k,m] of Object.entries(MODEL))TRACES[k]=k==='official'?maxTrace(m):countTrace(m);
function code(m){return `int[] last = { ${m.values.join(', ')} };\nint anzahl = ${m.initial};\nfor (int i = 0; i < last.Length; i++)\n{\n    if (last[i] ${m.op} ${m.limit})\n        anzahl = anzahl + 1;\n}`;}
function officialCode(){const m=MODEL.official;return `int[] CPULoad = { ${m.values.join(', ')} };\nint max = ${m.initial[0]}, max2 = ${m.initial[1]};\nfor (int i = 0; i < CPULoad.Length; i++)\n{\n    if (CPULoad[i] > max)\n    {\n        max2 = max;\n        max = CPULoad[i];\n    }\n    else if (CPULoad[i] > max2)\n        max = CPULoad[i]; // Zeile 17\n}`;}
const defs=`<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#75889a"/></marker></defs>`;
const svg=(label,content)=>`<svg viewBox="0 0 1168 400" role="img" aria-label="${label}">${defs}${content}</svg>`;
const rect=(x,y,w,h,text,key=false)=>`<rect class="node ${key?'key':''}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/><text x="${x+w/2}" y="${y+h/2+6}" text-anchor="middle">${escapeHtml(text)}</text>`;
const branchFig=svg('Bedingung last[i] größer oder gleich 60: wahr erhöht anzahl, falsch erhält anzahl.',`
<path class="edge" d="M584 68V96"/><path class="edge" d="M472 160H336V280"/><path class="edge" d="M696 160H832V280"/><path class="edge" d="M336 344V376H488"/><path class="edge" d="M832 344V376H680"/>
<text class="edge-label" x="728" y="88">prüft</text><text class="edge-label" x="160" y="228">führt bei wahr aus</text><text class="edge-label" x="848" y="228">überspringt bei falsch</text><text class="edge-label" x="376" y="360">übernimmt</text><text class="edge-label" x="712" y="360">übernimmt</text>
${rect(464,12,240,56,'aktueller Messwert')}
<polygon class="node key" points="584,96 696,160 584,224 472,160"/><text x="584" y="166" text-anchor="middle">last[i] ≥ ${MODEL.demo.limit}?</text>
${rect(208,280,256,64,'anzahl = anzahl + 1')}${rect(704,280,256,64,'anzahl bleibt gleich')}
${rect(488,352,192,48,'Zustand')}`);
const loopFig=svg('for: initialisieren, Bedingung prüfen, Rumpf ausführen, i erhöhen und erneut prüfen; bei falsch beenden.',`
<path class="edge" d="M240 180H344"/><path class="edge" d="M568 180H688"/><path class="edge" d="M880 180H944"/><path class="edge" d="M1032 148V48H456V116"/><path class="edge" d="M456 244V328H688"/>
<text class="edge-label" x="264" y="160">prüft</text><text class="edge-label" x="592" y="160">führt aus</text><text class="edge-label" x="880" y="244">erhöht</text><text class="edge-label" x="648" y="28">prüft erneut</text><text class="edge-label" x="480" y="300">beendet bei falsch</text>
${rect(48,148,192,64,'i = 0')}
<polygon class="node key" points="456,116 568,180 456,244 344,180"/><text x="456" y="186" text-anchor="middle">i &lt; ${MODEL.demo.values.length}?</text>
${rect(688,148,192,64,'Rumpf ausführen')}${rect(944,148,176,64,'i = i + 1')}${rect(688,296,192,64,'Ende')}
<text x="48" y="280">Startwert einmal setzen</text><text x="688" y="112">Bei wahr: eine Iteration</text>`);
const strip=(m,active=-1)=>`<div class="data-strip" aria-label="Messwerte">${m.values.map((v,i)=>`<div class="datum ${i===active?'current':''}"><small>Index ${i}</small>${v}</div>`).join('')}</div>`;
const heading=(title,ch)=>`<div class="heading"><h1>${title}</h1><span class="chapter">${ch}</span></div>`;
const page=(id,html)=>`<section class="page" id="${id}" hidden aria-label="${id}">${html}</section>`;
const actions=id=>`<div class="actions"><button class="primary" data-check="${id}">Felder prüfen</button><button data-hint="${id}">Hinweis</button><button data-solution="${id}">Lösung ansehen</button></div><div class="feedback" id="feedback-${id}" role="status">Tragen Sie Ihre Antwort ein. Jedes Feld wird einzeln geprüft.</div><div class="status" id="status-${id}"></div>`;
let expected={};
function input(id,value,label){expected[id]=value;return `<input id="${id}" data-answer inputmode="numeric" autocomplete="off" aria-label="${escapeHtml(label)}"><span class="mark" id="mark-${id}" aria-hidden="true"></span>`;}
function traceTask(id,key,given=0,official=false){const trace=TRACES[key];return `<table><caption class="caption">Werte am Ende von Schritt i</caption><thead><tr><th scope="col">i</th><th scope="col">${official?'CPULoad[i]':'last[i]'}</th>${official?'<th scope="col">max</th><th scope="col">max2</th>':'<th scope="col">anzahl</th>'}</tr></thead><tbody>${trace.map((r,i)=>`<tr><td>${i}</td><td>${r.value}</td>${official?`<td>${i<given?r.max:input(`${id}-${i}-max`,r.max,`Schritt ${i}: max`)}</td><td>${i<given?r.max2:input(`${id}-${i}-max2`,r.max2,`Schritt ${i}: max2`)}</td>`:`<td>${i<given?r.count:input(`${id}-${i}-count`,r.count,`Schritt ${i}: anzahl`)}</td>`}</tr>`).join('')}</tbody></table>`;}
const w=MODEL.written;
document.querySelector('#pages').innerHTML=[
page('condition',heading('Eine Bedingung wählt den nächsten Schritt','Verstehen')+`<p class="lead">Ein Monitoring zählt Messwerte ab ${MODEL.demo.limit} %. Die Bedingung wird mit dem aktuellen Wert geprüft. Ohne Zuweisung bleibt der gespeicherte Zustand erhalten.</p><figure class="stage">${branchFig}<figcaption>Fig. 1 · Wahr führt zur Zuweisung; falsch lässt den Zähler unverändert.</figcaption></figure>`),
page('loop',heading('Die Schleife prüft vor jeder Iteration','Verstehen')+`<p class="lead">Drei Werte liegen an den Indizes 0, 1 und 2. Nach dem Rumpf steigt i. Bei i = 3 ist i &lt; 3 falsch: kein vierter Durchlauf.</p><figure class="stage">${loopFig}<figcaption>Fig. 2 · Die Rückkante führt zur Bedingung. Ein for-Kopf bündelt Start, Prüfung und Änderung.</figcaption></figure>`),
page('trace',heading('Jede Tabellenzeile hält einen Zustand fest','Verstehen')+`<p class="lead">Erst prüfen, dann gegebenenfalls zuweisen, dann den Zustand notieren. Der nächste Durchlauf übernimmt diesen Zustand.</p><div class="layout trace-layout"><div class="prompt"><pre class="code">${escapeHtml(code(MODEL.demo))}</pre><p class="caption">≥ schließt den Grenzwert ein. i++ bedeutet i = i + 1.</p><div class="state-line"><div class="text"><div id="step-title"></div><div class="caption" id="step-change"></div></div><strong id="step-count"></strong></div></div><figure class="trace"><div id="demo-strip"></div><table><caption class="caption">Tracetabelle · Ende jeder Iteration</caption><thead><tr><th>i</th><th>last[i]</th><th>≥ ${MODEL.demo.limit}?</th><th>anzahl</th></tr></thead><tbody id="demo-table"></tbody></table><div class="stepper"><span id="step-label" class="caption"></span><div class="actions"><button data-step="prev">Schritt zurück</button><button data-step="next" class="primary">Nächster Schritt</button></div></div><figcaption>Fig. 3 · Falsch erhält den Zähler. Die Schleife läuft weiter.</figcaption></figure></div>`),
page('decision',heading('Grenzwert und Zuweisung rekonstruieren','Anwenden')+`<div class="layout"><div class="prompt"><p class="origin">Eigene Aufgabe, nicht offiziell IHK</p><h2>Vor diesem Schritt: anzahl = 1</h2><pre class="code">if (last[i] ${MODEL.demo.op} ${MODEL.demo.limit})\n    anzahl = anzahl + 1;</pre><p>Ergänzen Sie den Zähler nach genau einem Schritt. Jeder Fall startet neu mit anzahl = 1.</p><div class="data-strip"><div class="datum">59 %<small>unter Grenze</small></div><div class="datum">60 %<small>an Grenze</small></div><div class="datum">61 %<small>über Grenze</small></div></div></div><div class="work"><div class="field"><label for="decision-59">Messwert 59 %: anzahl danach</label><div>${input('decision-59',countTrace({...MODEL.demo,values:[59],initial:1})[0].count,'59 Prozent: anzahl danach')}</div></div><div class="field"><label for="decision-60">Messwert 60 %: anzahl danach</label><div>${input('decision-60',countTrace({...MODEL.demo,values:[60],initial:1})[0].count,'60 Prozent: anzahl danach')}</div></div><div class="field"><label for="decision-61">Messwert 61 %: anzahl danach</label><div>${input('decision-61',countTrace({...MODEL.demo,values:[61],initial:1})[0].count,'61 Prozent: anzahl danach')}</div></div>${actions('decision')}</div></div>`),
page('guided',heading('Den Zustand in die nächste Zeile übernehmen','Anwenden')+`<div class="layout"><div class="prompt"><p class="origin">Eigene Aufgabe, nicht offiziell IHK · erste Zeile gegeben</p><pre class="code">${escapeHtml(code(MODEL.guided))}</pre>${strip(MODEL.guided)}<p>Vervollständigen Sie die Tabelle. Die gegebene erste Zeile zeigt: falsch setzt anzahl nicht zurück.</p></div><div class="work">${traceTask('guided','guided',1)}${actions('guided')}</div></div>`),
page('variant',heading('Neue Daten, eine strengere Bedingung','Üben')+`<div class="layout"><div class="prompt"><p class="origin">Eigene Aufgabe, nicht offiziell IHK · ohne vorgegebene Zeile</p><pre class="code">${escapeHtml(code(MODEL.variant))}</pre>${strip(MODEL.variant)}<p>Vervollständigen Sie die Tabelle für den vorliegenden Code. Prüfen Sie besonders den Vergleichsoperator.</p></div><div class="work">${traceTask('variant','variant')}${actions('variant')}</div></div>`),
page('written-a',heading('a) Durchläufe und Endzustand berechnen','Prüfungsaufgabe')+`<div class="layout"><div class="prompt"><p class="origin">Eigene Aufgabe, nicht offiziell IHK · 2 Punkte, orientierend</p><h2>Ausgangssituation</h2><p>Die Nord IT GmbH prüft drei CPU-Messwerte. Das Skript zählt Werte ab ${w.limit} %.</p><pre class="code">${escapeHtml(code(w))}</pre><p>Berechnen Sie die Anzahl der Rumpfausführungen und den Endwert von anzahl. Je Ergebnis: 1 Punkt.</p></div><div class="work"><div class="field"><label for="written-a-loops">Anzahl der Rumpfausführungen</label><div>${input('written-a-loops',w.values.length,'Anzahl der Rumpfausführungen')}</div></div><div class="field"><label for="written-a-count">Endwert von anzahl</label><div>${input('written-a-count',TRACES.written.at(-1).count,'Endwert von anzahl')}</div></div>${strip(w)}${actions('written-a')}</div></div>`),

 'written-b':['Die Bedingung 60 ≥ 60 ist wahr (1 Punkt).','anzahl wird um 1 erhöht (1 Punkt).','Ein zugehöriger else-Zweig läuft nur bei falsch; hier wird er übersprungen (1 Punkt).'],

 'written-b':`Bei ${w.limit} % ist last[i] ${w.op} ${w.limit} wahr. Die Zuweisung erhöht anzahl um 1. In einer if/else-Auswahl wird der zugehörige else-Zweig nur bei einer falschen Bedingung ausgeführt und daher in diesem Schritt übersprungen.`,

let state={answers:{},notes:'',page:0,step:0,history:{},help:{},self:{}};
let storage=true;const STORAGE_KEY='fisi-spurenlabor-2026-10-06-v1';
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(stored&&stored.answers&&stored.history&&stored.help)state={...state,...stored};localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){storage=false;}
function save(){try{if(!storage)throw Error('blocked');localStorage.setItem(STORAGE_KEY,JSON.stringify(state));document.querySelector('#saveStatus').textContent='Lokal in diesem Browser gespeichert';}catch(e){storage=false;document.querySelector('#saveStatus').textContent='Lokales Speichern nicht möglich. Bitte exportieren.';}}
function level(id){return state.help[id]==='solution'?'Lösung gesehen':state.help[id]==='hint'?'Mit Hinweis':'Ohne Hilfe';}
function log(id,action,detail={}){(state.history[id]??=[]).push({time:new Date().toISOString(),action,help:level(id),...detail});save();renderStatus();}
function help(id,kind){if(state.help[id]!=='solution')state.help[id]=kind;log(id,kind);}
function renderStatus(){for(const id of EXERCISES){const el=document.getElementById('status-'+id);if(el)el.textContent=level(id)+' · '+(state.history[id]?.filter(h=>h.action==='check'||h.action==='review').length||0)+' Prüfversuche';}document.querySelector('#ledger-items').innerHTML=EXERCISES.map(id=>`<div class="ledger-item">${titles[id]}<span>${state.history[id]?.length?'Bearbeitet':'Noch ohne Eintrag'} · ${level(id)}</span></div>`).join('');}
function showPage(n){state.page=Math.min(11,Math.max(0,n));document.querySelectorAll('.page').forEach((el,i)=>el.hidden=i!==state.page);document.querySelector('[data-page-indicator]').textContent=`Seite ${state.page+1} / 12`;document.querySelector('[data-nav="prev"]').disabled=state.page===0;document.querySelector('[data-nav="next"]').disabled=state.page===11;document.querySelector('.progress span').style.width=((state.page+1)/12*100)+'%';document.querySelector('.progress').setAttribute('aria-valuenow',state.page+1);save();renderStatus();}
// Einzelne Prüf- und Zuweisungsschritte; keine automatische Wiedergabe.
function stepFrames(){const frames=[{title:'Startzustand setzen',change:'Noch kein Messwert wurde geprüft.',count:MODEL.demo.initial,row:-1,phase:'start'}];for(const r of TRACES.demo){frames.push({title:`i = ${r.i}: ${r.value} ${MODEL.demo.op} ${MODEL.demo.limit} ist ${r.yes?'wahr':'falsch'}`,change:r.yes?'Die Zuweisung wird als Nächstes ausgeführt.':'Keine Zuweisung: der Zähler bleibt erhalten.',count:r.before,row:r.i,phase:'check'});frames.push({title:`Ende von Schritt ${r.i}`,change:r.yes?`Zuweisung: ${r.before} + 1 = ${r.count}. Diesen Zustand notieren.`:`Zähler unverändert: ${r.count}. Auch diesen Zustand notieren.`,count:r.count,row:r.i,phase:'commit'});}frames.push({title:`i = ${MODEL.demo.values.length}: Schleife beendet`,change:`Die Bedingung ${MODEL.demo.values.length} < ${MODEL.demo.values.length} ist falsch. Alle Zeilen sind vollständig.`,count:TRACES.demo.at(-1).count,row:MODEL.demo.values.length,phase:'end'});return frames;}
const FRAMES=stepFrames();
function renderStep(){state.step=Math.min(FRAMES.length-1,Math.max(0,state.step));const f=FRAMES[state.step];document.querySelector('#demo-strip').innerHTML=strip(MODEL.demo,f.row);document.querySelector('#step-title').textContent=f.title;document.querySelector('#step-change').textContent=f.change;document.querySelector('#step-count').textContent=f.count;document.querySelector('#step-count').setAttribute('aria-label','anzahl: '+f.count);document.querySelector('#step-label').textContent=`Schritt ${state.step+1} / ${FRAMES.length}`;document.querySelector('[data-step="prev"]').disabled=state.step===0;document.querySelector('[data-step="next"]').disabled=state.step===FRAMES.length-1;document.querySelector('#demo-table').innerHTML=TRACES.demo.map(r=>{const done=r.i<f.row||(r.i===f.row&&f.phase==='commit');return `<tr class="${r.i===f.row?'current':''}"><td>${r.i}</td><td>${r.value}</td><td>${done?(r.yes?'wahr':'falsch'):'—'}</td><td>${done?r.count:'—'}</td></tr>`;}).join('');save();}
const dialog=document.getElementById('dialog');
function openDialog(title,body){document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogBody').innerHTML=body;dialog.showModal();document.querySelector('#closeDialog').focus();}
function check(id){const fields=[...document.getElementById(id).querySelectorAll('input[data-answer]')];let good=0,empty=0;const results=[];for(const el of fields){const raw=el.value.trim();const valid=/^-?\d+$/.test(raw)&&Number(raw)===expected[el.id];if(valid)good++;if(!raw)empty++;el.setAttribute('aria-invalid',String(!valid));document.getElementById('mark-'+el.id).textContent=valid?'✓':raw?'×':'?';el.title=valid?'Richtig':raw?'Noch nicht richtig: Zustand und Reihenfolge prüfen':'Bitte ausfüllen';results.push({field:el.id,answer:el.value,correct:valid,empty:!raw});}
let message=good===fields.length?`Alle ${fields.length} Felder stimmen. Vergleichen Sie den Rechenweg mit dem Code.`:empty===fields.length?'Alle Felder sind leer. Tragen Sie zuerst einen Zustand ein.':`${good} von ${fields.length} Feldern stimmen${empty?`; ${empty} leer`:''}. ${id==='official'?'Folgen Sie der tatsächlichen Zuweisung in Zeile 17.':id==='variant'?'Bei 60 ist > 60 falsch. Übernehmen Sie unveränderte Werte.':'Falsch setzt den Zähler nicht zurück. Übernehmen Sie den vorherigen Zustand.'}`;
document.getElementById('feedback-'+id).textContent=message;log(id,'check',{results});}
function modelTable(key,official=false){return `<table class="model-table"><thead><tr><th>i</th><th>${official?'CPULoad[i]':'last[i]'}</th>${official?'<th>max</th><th>max2</th>':'<th>Bedingung</th><th>anzahl</th>'}</tr></thead><tbody>${TRACES[key].map(r=>`<tr><td>${r.i}</td><td>${r.value}</td>${official?`<td>${r.max}</td><td>${r.max2}</td>`:`<td>${r.yes?'wahr':'falsch'}</td><td>${r.count}</td>`}</tr>`).join('')}</tbody></table>`;}
function solution(id){help(id,'solution');let body;if(criteria[id])body=`<p>${writtenModels[id]}</p><ol class="compare">${criteria[id].map(c=>'<li>'+c+'</li>').join('')}</ol><p class="caption">Eigene Kriterien, nicht offiziell IHK. Keine automatische Bewertung.</p>`;else if(id==='decision')body=`<p>59 %: ${expected['decision-59']}. 60 %: ${expected['decision-60']}. 61 %: ${expected['decision-61']}.</p><p>≥ schließt 60 ein. Bei 59 bleibt anzahl = 1; bei 60 und 61 wird jeweils von 1 auf 2 erhöht.</p>`;else if(id==='written-a')body=`<p>Der Rumpf wird ${w.values.length}-mal ausgeführt. Der Endwert von anzahl ist ${TRACES.written.at(-1).count}.</p>${modelTable('written')}<p>Die Grenze zählt mit. Ein falsches if beendet die for-Schleife nicht.</p>`;else if(id==='official')body=`<p>Vergleich mit der offiziellen Lösung · Sommer 2024 KAIT 3aa · PDF 4.</p>${modelTable('official',true)}<p>Bei i = 1 überschreibt else if max mit 10. Bei i = 4 bleiben beide Werte erhalten. Bei i = 5 überschreibt Zeile 17 max mit 60; max2 bleibt 40.</p><p class="caption">Offiziell: 1 Punkt je freiem Feld; Folgefehler sind zu berücksichtigen. Das Labor prüft nur den direkten Tabellenvergleich.</p>`;else body=modelTable(id)+`<p>${id==='variant'?'60 > 60 ist falsch. Erst 90 und 80 erhöhen den Zähler.':'70 und 60 erhöhen den Zähler. 30 lässt den Startwert 0 erhalten.'} Jede Zeile enthält den Zustand nach dem Rumpf.</p>`;openDialog('Lösung · '+titles[id],body);}
function review(id){const text=document.getElementById(id+'-text').value.trim();if(!text){document.getElementById('feedback-'+id).textContent='Die Antwort ist leer. Formulieren Sie zuerst Ihren Ablauf auf Deutsch.';log(id,'review',{empty:true});return;}log(id,'review',{answer:text});help(id,'hint');openDialog('Kriterienvergleich · '+titles[id],`<p>Prüfen Sie Ihre Aussage für jedes Kriterium. Die Häkchen sind Ihre Selbsteinschätzung, keine Bewertung des Labors.</p><div class="criteria">${criteria[id].map((c,i)=>`<div class="criterion"><span class="n">${i+1}</span><label><input type="checkbox" data-self="${id}-${i}" ${state.self[id+'-'+i]?'checked':''}>${c}</label></div>`).join('')}</div><p class="caption">Modellantwort separat über „Modellantwort“. Ihre Formulierung bleibt erhalten.</p>`);document.getElementById('feedback-'+id).textContent='Kriterienvergleich geöffnet. Selbsteinschätzung im Export; keine automatische Punktevergabe.';}
