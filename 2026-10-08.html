 {id:'arp',chapter:1,kind:'arp',c:'base',title:pair('Ziel-IP und nächste MAC haben verschiedene Aufgaben.','La IP destino y la siguiente MAC tienen funciones distintas.'),q:pair('Beispiel: Client {cidr} sendet an {remote}/27. Ohne NAT bleibt die Ziel-IP erhalten. ARP liefert die MAC des lokalen nächsten Hops; es beweist keine vollständige Verbindung.','Ejemplo: cliente {cidr} envía a {remote}/27. Sin NAT se conserva la IP destino. ARP entrega la MAC del siguiente salto local; no prueba conectividad completa.')},
 {id:'t12',task:12,chapter:1,kind:'route',c:'base',title:pair('Lokal direkt, entfernt über den Router.','Local directamente, remoto por el router.'),q:pair('Client {cidr}, Gateway {gateway}/27. Ziele: {local}/27 und {remote}/27. Wählen Sie Weg und MAC-Empfänger des ersten Ethernet-Frames.','Cliente {cidr}, gateway {gateway}/27. Destinos: {local}/27 y {remote}/27. Elige ruta y receptor MAC de la primera trama Ethernet.'),fields:[choice('localPath',pair('Weg zu .150','Ruta a .150')[0],pair('Weg zu .150','Ruta a .150')[1],[['direct',pair('Direkt im LAN','Directo en el LAN')],['router',pair('Über Gateway','Por gateway')]],'direct'),choice('localMac','MAC für .150','MAC para .150',[['target',pair('MAC des Ziels .150','MAC del destino .150')],['gateway',pair('MAC des Gateways .129','MAC del gateway .129')]],'target'),choice('remotePath','Weg zu .170','Ruta a .170',[['direct',pair('Direkt im LAN','Directo en el LAN')],['router',pair('Über Gateway','Por gateway')]],'router'),choice('remoteMac','MAC für .170','MAC para .170',[['target',pair('MAC des Ziels .170','MAC del destino .170')],['gateway',pair('MAC des Gateways .129','MAC del gateway .129')]],'gateway')],hint:pair('Berechnen Sie für beide Ziele die Netzadresse mit der Clientmaske. Im entfernten Fall bleibt die Ziel-IP .170; nur der erste MAC-Empfänger ist lokal.','Calcula la red de ambos destinos con la máscara del cliente. Para el remoto, la IP destino sigue siendo .170; el primer receptor MAC es local.')},
 {id:'dhcp',chapter:2,kind:'dhcp',c:'base',title:pair('DHCP beginnt mit einer Suche per Broadcast.','DHCP comienza buscando mediante broadcast.'),q:pair('Illustrativer Erstbezug im LAN: ein Client, ein Server. DISCOVER braucht vorher kein ARP zum DHCP-Server. OFFER und ACK können je nach Clientzustand als Broadcast oder Unicast ankommen.','Primera asignación ilustrativa en el LAN: un cliente y un servidor. DISCOVER no necesita ARP previo al servidor. OFFER y ACK pueden llegar por broadcast o unicast según el estado del cliente.')},
 {id:'t13',task:13,chapter:2,kind:'pool',c:'base',title:pair('Ein gültiger Pool schließt Reserven aus.','Un pool válido excluye las reservas.'),q:pair('Planen Sie im Netz {network}/{p} einen zusammenhängenden DHCP-Pool. {gateway} (Gateway) und {printer} (Drucker) sind reserviert. Alle übrigen Hosts sind frei. Geben Sie die inklusive Größe an.','Planea un pool DHCP continuo en {network}/{p}. {gateway} (gateway) y {printer} (impresora) están reservados. Los demás hosts están libres. Indica el tamaño inclusivo.'),fields:[F('start','Pool-Anfang','Inicio del pool','poolStart'),F('end','Pool-Ende','Final del pool','poolEnd'),F('count','Anzahl inklusiv','Cantidad inclusiva','poolCount')],hint:pair('Beide Grenzen müssen nutzbare, freie Hosts sein; keine Reserve darf dazwischen liegen. Größe = Endwert − Anfangswert + 1. Ein kleinerer gültiger Pool ist erlaubt.','Ambos extremos deben ser hosts libres y utilizables, sin reservas entre ellos. Tamaño = final − inicio + 1. Se acepta un pool válido más pequeño.')},
 {id:'t14',task:14,chapter:2,kind:'diagnostic',diag:'dhcp',c:'base',title:pair('169.254 ist ein Hinweis, kein Beweis für Serverausfall.','169.254 es una pista, no prueba de servidor caído.'),q:pair('Ein DHCP-Client zeigt 169.254.93.253/16 und kein Gateway. Wählen Sie eine plausible Hypothese und eine unterscheidende Prüfung. Ergebnisse sind simuliert und erscheinen erst auf Anforderung.','Un cliente DHCP muestra 169.254.93.253/16 sin gateway. Elige una hipótesis plausible y una prueba que discrimine. Los resultados son simulados y se muestran a petición.'),fields:[choice('hyp','Hypothese','Hipótesis',[['noReply',pair('Keine DHCP-Antwort erreicht den Client','No llega respuesta DHCP al cliente')],['dead',pair('Server ist sicher ausgefallen','Servidor necesariamente caído')],['dns',pair('DNS vergibt keine IP','DNS no entrega IP')]],'noReply'),choice('test','Nächste Prüfung','Prueba siguiente',[['capture',pair('Link/VLAN prüfen, DHCP-Ablauf erfassen','Revisar enlace/VLAN y capturar DHCP')],['ping',pair('Nur DNS-Server anpingen','Solo hacer ping al DNS')],['arpFirst',pair('Zuerst Server-MAC für DISCOVER suchen','Buscar MAC del servidor antes de DISCOVER')]],'capture')],hint:pair('Mögliche Ursachen: falsches VLAN/Link, Relay/Filter, erschöpfter Pool oder Dienststörung. Beobachten Sie, ob DISCOVER ankommt und OFFER zurückkommt.','Posibles causas: enlace/VLAN, relay/filtro, pool agotado o servicio. Observa si llega DISCOVER y vuelve OFFER.')},
 {id:'t15',task:15,chapter:2,kind:'diagnostic',diag:'dns',c:'base',title:pair('Per IP erreichbar, per Name nicht: gezielt trennen.','Accesible por IP, por nombre no: discrimina.'),q:pair('ping {server} antwortet; Zugriff per Name {name} scheitert. Wählen Sie Hypothese und Test. Ein Ping prüft ICMP, nicht den Dateidienst.','ping {server} responde; falla el acceso por nombre {name}. Elige hipótesis y prueba. Ping verifica ICMP, no el servicio de archivos.'),fields:[choice('hyp','Hypothese','Hipótesis',[['dns',pair('Namensauflösung könnte fehlschlagen','Podría fallar la resolución de nombres')],['only',pair('DNS ist sicher die einzige Ursache','DNS es necesariamente la única causa')],['works',pair('Ping beweist den Dateidienst','Ping demuestra el servicio de archivos')]],'dns'),choice('test','Gezielte Prüfung','Prueba específica',[['lookup',pair('FQDN am eingetragenen DNS abfragen','Consultar FQDN al DNS configurado')],['ping',pair('IP-Ping wiederholen','Repetir ping por IP')],['restart',pair('Ohne Befund Router neu starten','Reiniciar router sin evidencia')]],'lookup')],hint:pair('nslookup mit FQDN und ausdrücklich gewähltem DNS-Server. Vergleichen Sie den Befund; bei korrekter Antwort Cache/hosts, Schreibweise und Dienst untersuchen.','nslookup con FQDN y servidor DNS explícito. Compara el resultado; si responde correctamente, revisa caché/hosts, escritura y servicio.')},
 {id:'t16',task:16,chapter:3,kind:'written',c:'written',title:pair('Neue Variante: auf Deutsch dokumentieren.','Variante nueva: documenta en alemán.'),q:pair('Eigene Aufgabe, nicht offiziell IHK. Nordlicht IT richtet einen Client {cidr} ein. a) Berechnen Sie Netz, Broadcast und Hostbereich (4 P.). b) Begründen Sie Gateway {writtenGateway}/{p} bei einem einzigen lokalen Router (2 P.). c) Beschreiben Sie einen nächsten Test bei „per IP erreichbar, per Name nicht“ (2 P.). Punkte orientativ.','Ejercicio propio, no oficial IHK. Nordlicht IT configura {cidr}. a) Calcula red, broadcast y rango host (4 p.). b) Justifica gateway {writtenGateway}/{p}, único router local (2 p.). c) Describe una prueba siguiente para «por IP sí, por nombre no» (2 p.). Puntos orientativos.'),open:pair('Antwort a/b/c auf Deutsch','Respuesta a/b/c en alemán'),hint:pair('a) Suchen Sie den ausgerichteten 64er-Block. b) Prüfen Sie die Gateway-Schnittstelle. c) Nennen Sie eine DNS-Abfrage und die Konsequenz ihres Ergebnisses.','a) Busca el bloque alineado de 64. b) Comprueba la interfaz gateway. c) Indica consulta DNS y consecuencia del resultado.')},
 {id:'official',chapter:3,kind:'official',title:pair('Offizielle Aufgabe: eine Ursache und ein Lösungsweg.','Tarea oficial: una causa y una solución.'),q:pair('IHK/ZPA Sommer 2024, AEN, 2 aa (4 Punkte) und 2 ac (3 Punkte). Beim Kunden IHK-Multimedia-Agentur zeigt ein Client automatisch 169.254.93.253, Maske 255.255.0.0, ohne Gateway. aa) Erläutern Sie einen möglichen Grund. ac) Beschreiben Sie einen Lösungsweg zu einer funktionierenden Konfiguration. Auszug; IPv6-Teil ausgelassen.','IHK/ZPA Sommer 2024, AEN, 2 aa (4 puntos) y 2 ac (3 puntos). Cliente de IHK-Multimedia-Agentur: configuración automática 169.254.93.253, máscara 255.255.0.0, sin gateway. aa) Explica una posible causa. ac) Describe una vía para obtener configuración funcional. Extracto; se omite IPv6.'),open:pair('Antwort aa/ac auf Deutsch','Respuesta aa/ac en alemán'),hint:pair('Trennen Sie Symptom und Ursache. Beschreiben Sie konkrete Netzwerkparameter oder einen DHCP-Neubezug unter passender Voraussetzung.','Separa síntoma y causa. Describe parámetros de red concretos o nueva solicitud DHCP bajo una condición adecuada.')},

 {id:'p2p',chapter:3,kind:'p2p',c:'p2p',title:pair('Optional: /31 auf einem Punkt-zu-Punkt-Link.','Opcional: /31 en un enlace punto a punto.'),q:pair('RFC 3021: genau zwei Endpunkte, beide unterstützen /31. 10.0.0.10/31 und 10.0.0.11/31 sind beide nutzbar. Hier gilt nicht „immer zwei abziehen“. Kein gewöhnliches Mehrgeräte-LAN.','RFC 3021: exactamente dos extremos, ambos soportan /31. 10.0.0.10/31 y 10.0.0.11/31 son utilizables. Aquí no se resta dos. No es un LAN convencional con varios equipos.')},

function current(){return PAGES[pageIndex]}
function cm(p=current()){return model(CASES[p.c||'base'])}
function expected(f,m){return ({h:32-m.p,lo3:+m.network.split('.')[2],hi3:+m.broadcast.split('.')[2],...m})[f.ref]}
function expand(text,p){const m=cm(p);return T(text).replace(/\{(\w+)\}/g,(_,k)=>k==='cidr'?`${m.ip}/${m.p}`:m[k]!==undefined?m[k]:NET[k]!==undefined?NET[k]:'')}
function help(p){return state.help[p.id]||(state.help[p.id]={hint:false,solution:false,result:false,visual:!['reserve','written','official'].includes(p.kind)})}
function markSeen(c){if(!state.seen.includes(c))state.seen.push(c);save()}
function assistance(p){const h=help(p);let parts=[];if(state.seen.includes(p.c))parts.push(L('Modell/gleichwertiges Beispiel gesehen','Modelo/ejemplo equivalente visto'));if(h.visual)parts.push(L('Darstellung genutzt','Representación utilizada'));if(h.hint)parts.push(L('Hinweis genutzt','Pista utilizada'));if(h.solution)parts.push(L('Lösung gesehen','Solución vista'));if(h.result)parts.push(L('Simulation gesehen','Simulación vista'));if(state.coach[p.id])parts.push(L('Tutorhilfe angegeben','Ayuda del tutor indicada'));return parts.length?parts.join(' · '):L('Bisher ohne protokollierte Hilfe; Tutorhilfe bitte angeben.','Sin ayuda registrada hasta ahora; indica la ayuda del tutor.')}
const text=(x,y,s,cls='',anchor='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const rect=(x,y,w,h,cls='shape')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="${cls}"/>`;
const line=(x1,y1,x2,y2,cls='edge',arrow=false)=>`<path d="M${x1} ${y1}H${x2}V${y2}" class="${cls}"${arrow?' marker-end="url(#ah)"':''}/>`;
function svg(inner,label){return `<svg viewBox="0 0 800 420" role="img" aria-label="${esc(label)}"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536575"/></marker></defs>${inner}</svg>`}
function bitRows(m,showMask=false,hideCut=false,hideDecimals=false){let out='';for(let o=0;o<4;o++){let y=74+o*54;out+=text(24,y+26,`${L('Oktett','Octeto')} ${o+1}`,'tiny dim');out+=text(142,y+26,hideDecimals?'?':(showMask?m.mask:m.ip).split('.')[o],'value');for(let b=0;b<8;b++){let i=o*8+b,x=254+b*52,isHost=i>=m.p;out+=`<rect x="${x}" y="${y}" width="44" height="38" fill="${!hideCut&&isHost?'#e6f0f9':'white'}" stroke="${!hideCut&&isHost?'#075ead':'#536575'}" stroke-width="1.5" ${!hideCut&&isHost?'stroke-dasharray="4 3"':''}/>`;out+=text(x+22,y+25,showMask?m.maskbits[i]:m.bits[i],'bit','middle')}if(!hideCut&&m.p>o*8&&m.p<(o+1)*8){let x=250+(m.p-o*8)*52;out+=line(x,y-12,x,y+48,'hot')}}return out}
function bitsFigure(m,mask=false,task=false){let inner=text(24,34,`${m.ip} /${m.p}`,'big')+text(24,62,mask?L('Maske: 1 = Netz, 0 = Host','Máscara: 1 = red, 0 = host'):L('IP-Bits: links fest, rechts variabel','Bits IP: izquierda fija, derecha variable'),'dim')+bitRows(m,mask,task&&current().id==='t1',mask&&task);inner+=text(24,326,task?L('Schnitt und Werte selbst bestimmen.','Determina el corte y los valores.'):L(`${m.p} Netzbits | ${32-m.p} Hostbits`,`${m.p} bits red | ${32-m.p} bits host`),'value');inner+=text(24,374,!task?`${L('Maske','Máscara')}: ${m.mask}`:task&&current().id==='t1'?L('Alle Bits neutral: bestimmen Sie den Schnitt.','Bits neutrales: determina el corte.'):L('Durchgezogen = fest · gestrichelt = variabel','Continuo = fijo · discontinuo = variable'),'dim');return svg(inner,L('Vier Oktette mit je acht Bits','Cuatro octetos con ocho bits cada uno'))}
function blockFigure(m,reveal=false){let inner=text(24,34,`${m.ip}/${m.p}`,'big');let cut=m.p%8,oct=Math.floor(m.p/8),bits=m.bits.slice(oct*8,oct*8+8);inner+=text(24,74,`${L('Schnitt-Oktett','Octeto del corte')}: ${oct+1}`,'dim');for(let b=0;b<8;b++){let x=230+b*58;inner+=`<rect x="${x}" y="48" width="48" height="44" fill="${b>=cut?'#e6f0f9':'white'}" stroke="${b>=cut?'#075ead':'#536575'}" stroke-width="1.5" ${b>=cut?'stroke-dasharray="4 3"':''}/>`+text(x+24,77,bits[b],'value','middle')}inner+=text(24,134,L('IP gegeben','IP dada'),'dim')+text(230,122,L('Netzbits bleiben | Hostbits variieren','Red permanece | host varía'),'dim');let size=m.octetSize,low=+m.network.split('.')[oct],v=+m.ip.split('.')[oct],base=Math.max(0,Math.min(256-size*4,low-size));let w=176;for(let i=0;i<4;i++){let lo=base+i*size,hi=lo+size-1,x=24+i*188,active=v>=lo&&v<=hi;inner+=rect(x,188,w,84,active?'key':'shape');inner+=text(x+w/2,222,reveal?`${lo}–${hi}`:L('Block','Bloque'),'value','middle')+text(x+w/2,251,active?L('enthält die IP','contiene la IP'):L('Nachbarblock','bloque vecino'),'tiny','middle');if(active){let pos=x+16+(v-lo)/(size-1)*(w-32);inner+=line(pos,168,pos,184,'hot')+text(pos,155,v,'value','middle')}}inner+=text(24,326,reveal?`${L('Menge','Cantidad')}: ${m.size} ${L('Adressen','direcciones')}`:L('Anfang = ausgerichtetes Vielfaches der Blockgröße','Inicio = múltiplo alineado del tamaño del bloque'),'value');inner+=text(24,373,reveal?`${L('Netz','Red')}: ${m.network}     ${L('Broadcast','Broadcast')}: ${m.broadcast}`:L('Letzter Wert = Anfang + Menge − 1','Último valor = inicio + cantidad − 1'),'dim');return svg(inner,L('Ausgerichtete Blöcke, die gegebene IP ist markiert','Bloques alineados, se marca la IP dada'))}
function crossFigure(m,reveal=false){let lo=+m.network.split('.')[2],hi=+m.broadcast.split('.')[2],v=+m.ip.split('.')[2],span=hi-lo+1,inner=text(24,32,`${m.ip}/${m.p}`,'big')+text(24,70,L('Drittes Oktett','Tercer octeto'),'dim')+text(250,70,L('Viertes Oktett: jede Zeile 0 bis 255','Cuarto octeto: cada fila de 0 a 255'),'dim');let rows=span<=2?[lo,hi]:[lo,lo+1,'...',v,hi],y=98;for(let n of rows){if(n==='...'){inner+=text(120,y+20,'…','big');y+=40;continue}inner+=rect(220,y,520,40,n===v?'key':'shape');inner+=text(80,y+27,reveal?n:'?','value')+text(240,y+27,'0','tiny')+text(720,y+27,'255','tiny','end');if(n===v){let x=248+(+m.ip.split('.')[3])/255*460;inner+=line(x,y+5,x,y+35,'hot');inner+=text(x,y-14,m.ip.split('.')[3],'value','middle')}y+=span<=2?96:48}inner+=text(24,354,reveal?`${span} × 256 = ${m.size} ${L('Adressen','direcciones')}`:L('Die Grenzen gelten für den gesamten Block.','Los límites corresponden al bloque completo.'),'value');inner+=text(24,394,reveal?`${m.network} ${L('bis','hasta')} ${m.broadcast}`:L('Alle Hostbits 0 = Netz · alle Hostbits 1 = Broadcast','Todos los bits host 0 = red · todos 1 = broadcast'),'dim');return svg(inner,L('Zeilen des dritten Oktetts mit vollständigem viertem Oktett','Filas del tercer octeto con todo el cuarto octeto'))}

const SIMS={dhcp:[{label:pair('A · Pfadfehler','A · Fallo del camino'),result:pair('Client: DISCOVER gesendet. Mitschnitt im vorgesehenen Server-LAN: kein DISCOVER. Switch-Port ist im falschen VLAN.','Cliente: DISCOVER enviado. Captura en LAN previsto del servidor: no llega DISCOVER. Puerto switch en VLAN incorrecta.'),conclusion:pair('Der Pfad ist gestört; das beweist keinen Serverausfall. VLAN-Zuordnung korrigieren lassen und DHCP neu prüfen.','El camino falla; no demuestra servidor caído. Corregir asignación VLAN y volver a comprobar DHCP.')},{label:pair('B · Pool erschöpft','B · Pool agotado'),result:pair('Server empfängt DISCOVER. Dienst läuft; Protokoll meldet „keine freie Adresse“. Kein OFFER.','Servidor recibe DISCOVER. Servicio activo; registro indica «sin dirección libre». No hay OFFER.'),conclusion:pair('Pool-Belegung/Ausschlüsse prüfen. Ein laufender Server kann ohne freie Adressen keinen neuen Lease anbieten.','Revisar ocupación/exclusiones. Un servidor activo sin direcciones libres no puede ofrecer un nuevo lease.')},{label:pair('C · Dienst gestoppt','C · Servicio detenido'),result:pair('DISCOVER erreicht den Server. DHCP-Dienst ist gestoppt; kein OFFER wird gesendet.','DISCOVER llega al servidor. Servicio DHCP detenido; no se envía OFFER.'),conclusion:pair('Hier stützt der zusätzliche Dienstbefund die Ausfallhypothese. Zuständigen Dienst prüfen lassen, danach Neubezug testen.','Aquí el estado adicional del servicio respalda la hipótesis de caída. Revisar el servicio y luego probar nueva asignación.')},{label:pair('D · Rückweg/Filter','D · Retorno/filtro'),result:pair('Server empfängt DISCOVER und sendet OFFER. Client-Mitschnitt zeigt kein OFFER; UDP-Rückweg wird gefiltert.','Servidor recibe DISCOVER y envía OFFER. Captura del cliente sin OFFER; retorno UDP filtrado.'),conclusion:pair('Rückweg, Relay und Filter prüfen. Ein Server antwortet bereits; ein pauschaler Neustart erklärt den Befund nicht.','Revisar retorno, relay y filtros. El servidor ya responde; un reinicio general no explica el resultado.')}],dns:[{label:pair('A · Falscher DNS','A · DNS equivocado'),result:pair('nslookup datei.example.test. 192.168.10.1: NXDOMAIN. Anfrage am vorgesehenen DNS 192.168.10.132: 192.168.10.150.','nslookup datei.example.test. 192.168.10.1: NXDOMAIN. Consulta al DNS previsto 192.168.10.132: 192.168.10.150.'),conclusion:pair('DNS-Einstellung passt nicht zur internen Zone. Vorgesehenen Resolver verwenden und den tatsächlichen Dienstzugriff testen.','La configuración DNS no corresponde a la zona interna. Usar el resolver previsto y probar el servicio real.')},{label:pair('B · Keine DNS-Antwort','B · Sin respuesta DNS'),result:pair('nslookup datei.example.test. 192.168.10.132: Zeitüberschreitung. ICMP zur Server-IP antwortet.','nslookup datei.example.test. 192.168.10.132: tiempo agotado. ICMP a la IP del servidor responde.'),conclusion:pair('DNS-Dienst oder DNS-Pfad/Filter prüfen. Eine Ping-Antwort bestätigt nicht UDP/TCP 53 oder den DNS-Dienst.','Revisar servicio DNS o camino/filtro DNS. Ping no confirma UDP/TCP 53 ni el servicio DNS.')},{label:pair('C · DNS korrekt, Dienst nicht','C · DNS correcto, servicio falla'),result:pair('DNS antwortet mit 192.168.10.150. Test-NetConnection 192.168.10.150 -Port 445: TcpTestSucceeded=False.','DNS responde 192.168.10.150. Test-NetConnection 192.168.10.150 -Port 445: TcpTestSucceeded=False.'),conclusion:pair('Für diese Abfrage ist DNS korrekt. Cache/hosts im verwendeten Programm und den SMB-Dienst/Pfad prüfen; Ping reicht nicht.','DNS es correcto para esta consulta. Revisar caché/hosts del programa y servicio/camino SMB; ping no basta.')} ]};

function resultFigure(p){const m=cm(p);if(p.kind==='written'||p.kind==='official')return rubric(p);if(['diagnostic','evidence'].includes(p.kind)){const s=SIMS[p.diag][simIndex];return `<div class="rubric"><h2>${L('Hypothese, kein Vorurteil','Hipótesis, sin conclusión prematura')}</h2><p>${expand(p.hint,p)}</p><div class="simulation"><strong>${L('Simuliertes Ergebnis','Resultado simulado')}</strong><p>${T(s.result)}</p><p>${T(s.conclusion)}</p></div></div>`}let fields=p.fields||[],rows=fields.map(f=>{let val=f.type==='choice'?T(f.items.find(a=>a[0]===f.valid)[1]):f.type==='client'?L('Alle freien Hosts .131–.158','Todos los hosts libres .131–.158'):f.type==='gateway'?NET.gateway:f.type.startsWith('pool')?({poolStart:'192.168.10.131',poolEnd:'192.168.10.158',poolCount:'28'})[f.type]:expected(f,m);return [T(f.label),val]});let inner=text(24,32,L('Vergleichen, dann begründen','Compara y después justifica'),'big');rows.forEach(([lab,val],i)=>{let cols=rows.length>4?2:1,x=24+(i%cols)*392,y=68+Math.floor(i/cols)*(rows.length>4?88:72);inner+=rect(x,y,cols===2?368:752,60,'shape')+text(x+16,y+24,lab,'tiny dim')+text(x+16,y+49,val,'value')});inner+=text(24,390,p.kind==='pool'?L('Beispielpool; kleinere gültige Bereiche werden akzeptiert.','Pool de ejemplo; se aceptan rangos válidos más pequeños.'):p.kind==='client'?L('Netz/Broadcast und belegte Adressen bleiben ausgeschlossen.','Se excluyen red, broadcast y direcciones ocupadas.'):L('Grenzen gehören zum Block; Hosts liegen dazwischen.','Los límites pertenecen al bloque; los hosts quedan entre ellos.'),'tiny dim');return svg(inner,L('Angeforderte Musterlösung','Solución modelo solicitada'))}

function figureContent(p){let m=cm(p);if(mode==='notes')return notesContent(p);if(mode==='solution')return resultFigure(p);if(p.kind==='start')return blockFigure(cm({c:'base'}),true);if(p.kind==='lesson')return p.visual==='mask'?(visualView==='bits'?bitsFigure(model(CASES[visualCase]),false):model(CASES[visualCase]).p<24?crossFigure(model(CASES[visualCase]),true):blockFigure(model(CASES[visualCase]),true)):p.visual==='cross'?crossFigure(m,true):blockFigure(m,true);if(p.kind==='bits'||p.kind==='maskTask')return bitsFigure(m,p.kind==='maskTask',true);if(p.kind==='calc')return m.p<24?crossFigure(m,false):blockFigure(m,false);if(p.kind==='member')return memberFigure();if(['client','gateway','topologyLesson'].includes(p.kind))return topology(p);if(p.kind==='route')return routeFigure(p);if(p.kind==='pool')return poolFigure();if(p.kind==='arp')return arpFigure();if(p.kind==='dhcp')return dhcpFigure();if(['diagnostic','evidence'].includes(p.kind))return diagnosticFigure(p);if(p.kind==='reserve'||p.kind==='written')return svg(text(24,40,`${m.ip}/${m.p}`,'big')+node(40,100,280,88,L('Gegebene Hostadresse','Dirección host dada'),m.ip)+node(480,100,280,88,L('Blockgrenzen','Límites del bloque'),'?')+line(320,144,480,144,'edge',true)+text(356,119,L('bestimmt','determina'),'edge-label')+text(40,278,L('Netz · Broadcast · nutzbarer Bereich','Red · broadcast · rango utilizable'),'value')+text(40,338,L('Erst selbst dokumentieren, dann vergleichen.','Documenta primero; compara después.'),'dim'),L('Neue Variante ohne sichtbare Lösung','Variante nueva sin solución visible'));if(p.kind==='official')return diagnosticFigure({diag:'dhcp'});if(p.kind==='p2p')return svg(line(264,202,536,202,'hot',true)+text(328,177,L('verbindet zwei Endpunkte','conecta dos extremos'),'edge-label')+node(24,158,240,88,L('Endpunkt A','Extremo A'),'10.0.0.10/31',true)+node(536,158,240,88,L('Endpunkt B','Extremo B'),'10.0.0.11/31',true)+text(24,66,L('Zwei Kombinationen, zwei nutzbare Endpunkte','Dos combinaciones, dos extremos utilizables'),'big')+text(24,338,L('Spezialfall RFC 3021 · keine Mehrgeräte-LAN-Regel','Caso especial RFC 3021 · no una regla de LAN compartido'),'dim'),L('Expliziter /31-Punkt-zu-Punkt-Link','Enlace explícito /31 punto a punto'));if(p.kind==='closing')return closingContent();if(p.kind==='storageInfo')return svg(line(296,212,504,212,'hot',true)+text(334,186,L('exportiert','exporta'),'edge-label')+node(24,168,272,88,L('Browser-Speicher','Memoria del navegador'),L('Kann verloren gehen','Puede perderse'))+node(504,168,272,88,L('JSON-Datei','Archivo JSON'),L('Antworten + Hilfe + Notizen','Respuestas + ayuda + notas'),true)+text(24,54,L('Im Browser arbeiten, als Datei sichern','Trabajar en navegador, respaldar archivo'),'big')+text(24,338,L('Blockierter Speicher: Export aus dem Arbeitsspeicher möglich.','Guardado bloqueado: exportación desde memoria disponible.'),'dim'),L('Export aus lokalem Browser-Speicher in eine Datei','Exportación de memoria local a un archivo'));if(p.kind==='sources')return sourcesContent();return ''}
function notesContent(p){return `<div class="rubric"><h2>${L('Notizen und Tutorhilfe','Notas y ayuda del tutor')}</h2><label class="field" for="notes"><span>${L('Notiz zu dieser Seite','Nota de esta página')}</span><textarea id="notes" rows="4">${esc(state.notes[p.id]||'')}</textarea></label><label><input type="checkbox" id="coach" ${state.coach[p.id]?'checked':''} style="width:auto"> ${L('Tutorhilfe erhalten','Recibí ayuda del tutor')}</label>${['written','official','evidence'].includes(p.kind)?`<label class="field" for="review"><span>${L('Tutor-Vergleich','Revisión del tutor')}</span><select id="review"><option value="">${L('Noch nicht verglichen','Sin revisar')}</option>${[['meets',pair('Kriterien erfüllt','Cumple criterios')],['revise',pair('Überarbeiten','Revisar respuesta')],['uncertain',pair('Unklar / offen','Incierto / pendiente')]].map(([v,t])=>`<option value="${v}" ${state.review[p.id]===v?'selected':''}>${T(t)}</option>`).join('')}</select></label>`:''}<p class="small">${L('Notizen ersetzen keine Antwort. Hilfe bleibt nach Ausblenden der Lösung protokolliert.','Las notas no sustituyen respuestas. La ayuda permanece registrada al ocultar la solución.')}</p></div>`}

function sourcesContent(){return `<div class="rubric source-report"><h2>${L('Lehrbuch und Primärquellen','Libro y fuentes primarias')}</h2><div class="source">Zisler: <code>02_Zisler_Computer-Netzwerke_7A_2022.pdf</code><br>§ 3.3.1 ARP: PDF 136–137; § 3.5.2–3 IPv4: PDF 147–155;<br>§ 3.5.5 APIPA: PDF 157–159; § 4.2.3 DHCP: PDF 206–210;<br>§ 4.3.2 DNS: PDF 218; § 4.4.2: PDF 237–238; § 4.7: PDF 273.</div><div class="source"><a href="https://www.rfc-editor.org/rfc/rfc826" target="_blank" rel="noopener">RFC 826 · ARP</a> | <a href="https://www.rfc-editor.org/rfc/rfc2131" target="_blank" rel="noopener">RFC 2131 · DHCP § 3.1</a> | <a href="https://www.rfc-editor.org/rfc/rfc3927" target="_blank" rel="noopener">RFC 3927 · Link-local</a> | <a href="https://www.rfc-editor.org/rfc/rfc3021" target="_blank" rel="noopener">RFC 3021 · /31</a></div><div class="source"><a href="https://www.cisco.com/c/de_de/support/docs/ip/routing-information-protocol-rip/13788-3.html" target="_blank" rel="noopener">Cisco · IPv4/Subnetze</a><br><a href="https://learn.microsoft.com/de-de/windows-server/networking/dns/troubleshoot/troubleshoot-dns-client" target="_blank" rel="noopener">Microsoft · DNS-Diagnose</a></div><p class="small">${L('Optionale Links benötigen Internet. Keine Druckseiten im E-Book identifiziert. Details: REPORTE-taller.md.','Enlaces opcionales requieren Internet. Sin páginas impresas identificadas. Detalles: REPORTE-taller.md.')}</p></div>`}
function fieldsHtml(p){const a=state.answers[p.id]||{};return `<div class="fields ${p.fields.length>=4?'two':''}">${p.fields.map(f=>`<label class="field" for="f-${f.id}"><span>${T(f.label)}</span>${f.type==='choice'?`<select id="f-${f.id}" data-field="${f.id}"><option value="">${L('Bitte wählen','Selecciona')}</option>${f.items.map(([v,label])=>`<option value="${v}" ${a[f.id]===v?'selected':''}>${T(label)}</option>`).join('')}</select>`:`<input id="f-${f.id}" data-field="${f.id}" value="${esc(a[f.id]||'')}" autocomplete="off" spellcheck="false" aria-describedby="r-${f.id}">`}<span class="result" id="r-${f.id}" role="status"></span></label>`).join('')}</div>`}
function asideHtml(p){let x='';if(p.kind==='start'){return `<div class="schedule"><h2>${L('90 Minuten als Orientierung','90 minutos como orientación')}</h2>${[[5,pair('Ziel & Netz/Host','Objetivo y red/host')],[15,pair('/27 mit Modell','/27 con modelo')],[20,pair('/23 und /20','/23 y /20')],[20,pair('Client & nächster Hop','Cliente y siguiente salto')],[15,pair('DHCP/DNS prüfen','Diagnóstico DHCP/DNS')],[10,pair('Deutsch schreiben','Escribir en alemán')],[5,pair('Hilfe & offene Frage','Ayuda y duda pendiente')]].map(([n,t])=>`<div class="row"><strong>${n} min</strong><div>${T(t)}<div class="bar"><span style="width:${n*5}%"></span></div></div></div>`).join('')}<p class="small">${L('Wenn eine Beziehung mehr Zeit braucht: dort bleiben und Reserven weglassen.','Si una relación exige más tiempo: profundiza y deja las reservas.')}</p></div>`}if(p.fields)x+=fieldsHtml(p);if(p.open)x+=`<label class="field" for="free"><span>${T(p.open)}</span><textarea id="free" data-field="free" class="${['written','official'].includes(p.kind)?'free':''}" rows="${['written','official'].includes(p.kind)?6:2}">${esc((state.answers[p.id]||{}).free||'')}</textarea></label>`;if(p.fields||p.open)x+=`<div class="actions">${p.fields?`<button class="primary" id="check">${L('Felder prüfen','Comprobar campos')}</button>`:`<button class="primary" id="compare">${L('Kriterien vergleichen','Comparar criterios')}</button>`}<button id="hint" aria-pressed="${mode==='hint'}">${L('Hinweis','Pista')}</button><button id="solution">${mode==='solution'?L('Lösung ausblenden','Ocultar solución'):L('Lösung ansehen','Ver solución')}</button>${mode!=='normal'?`<button id="backfig">${L('Zur Darstellung','Volver al dibujo')}</button>`:''}</div><p class="feedback" id="feedback" role="status"></p>`;if(p.kind==='evidence'){x+=`<div class="note"><label class="field"><span>${L('Simulationsfall auswählen','Seleccionar caso simulado')}</span><select id="simcase">${SIMS[p.diag].map((s,i)=>`<option value="${i}" ${i===simIndex?'selected':''}>${T(s.label)}</option>`).join('')}</select></label><button id="simulate">${L('Prüfergebnis simulieren','Simular resultado de prueba')}</button></div>`}if(!p.fields&&!p.open){if(p.kind==='closing'){const done=Object.keys(state.attempts).length;x+=`<h2>${L('Hilfe bleibt sichtbar','La ayuda queda registrada')}</h2><p>${L(`${done} Aufgabenfelder-Sätze geprüft. Keine Aussage über Beherrschung.`,`${done} conjuntos de campos comprobados. Sin evaluación de dominio.`)}</p><p>${L('Modelle, Hinweise, Lösungen und Tutorhilfe stehen im Export. Eine neue Variante ohne diese Hilfe bietet eine bessere Vergleichsbasis.','Modelos, pistas, soluciones y ayuda del tutor se incluyen en el export. Una variante nueva sin esa ayuda permite comparar mejor.')}</p><button id="export2">${L('Antworten und Notizen exportieren','Exportar respuestas y notas')}</button>`}else if(p.kind==='storageInfo')x+=`<h2>${L('Lokales Speichern','Guardado local')}</h2><p class="small">${L('Browser und Dateipfad bestimmen den Speicher. Privatmodus, Löschen oder Umbenennen können ihn verlieren lassen. Falls blockiert: nur Arbeitsspeicher. JSON-Export vor dem Schließen sichern. Keine Uploads.','El navegador y la ruta determinan el almacenamiento. Modo privado, borrado o cambio de nombre pueden perderlo. Si está bloqueado: solo memoria. Guarda el export JSON antes de cerrar. Sin uploads.')}</p>`;else if(p.kind==='sources')x+=`<h2>${L('Offizielle Aufgabe','Tarea oficial')}</h2><p>Sommer 2024 · AEN · 2 aa/ac</p><p class="small">${L('Frage: PDF 5; Lösung: PDF 2–3. Der Vergleich paraphrasiert die Lösungshinweise; weitere fachgerechte Antworten sind möglich.','Pregunta: PDF 5; solución: PDF 2–3. La comparación parafrasea la solución oficial; admite otras respuestas válidas.')}</p>`;else x+=`<h2>${L('Gemeinsam erklären','Explica con el tutor')}</h2><p>${p.kind==='p2p'?L('Wann darf man zwei Adressen nicht abziehen? Begrenzen Sie die Aussage auf den ausdrücklich gezeigten Link.','¿Cuándo no se restan dos direcciones? Limita la afirmación al enlace mostrado.'):p.kind==='arp'?L('Welche IP steht im Paket? Welche MAC steht im ersten Frame? Welcher Test würde den Dienst prüfen?','¿Qué IP aparece en el paquete? ¿Qué MAC en la primera trama? ¿Qué prueba verifica el servicio?'):p.kind==='dhcp'?L('Wo würde ein fehlendes OFFER sichtbar? Unterscheiden Sie Server, Hinweg und Rückweg.','¿Dónde verías que falta OFFER? Distingue servidor, ida y retorno.'):L('Zeigen Sie in der Figur die unveränderten Bits und die veränderlichen Positionen. Beschreiben Sie daraus Anfang und Ende.','Señala los bits fijos y posiciones variables. A partir de ellos explica inicio y final.')}</p>`}if(p.task||['reserve','written','official'].includes(p.kind))x+=`<p class="helpstate">${esc(assistance(p))}</p>`;return x}
function render(){const p=current(),m=cm(p);$('.app').style.setProperty('--head',['written','official'].includes(p.kind)?'128px':'78px');if(p.kind==='lesson'||p.kind==='start')markSeen(p.c||'base');if(p.kind==='arp')markSeen('route');if(p.kind==='topologyLesson')markSeen('configuration');if(p.kind==='dhcp')markSeen('dhcp');$('#title').textContent=T(p.title);$('#question').textContent=expand(mode==='hint'?p.hint:p.q,p);$('#chapters').innerHTML=[pair('Verstehen','Comprender'),pair('Anwenden','Aplicar'),pair('Üben','Practicar'),pair('Prüfungsaufgabe','Tarea de examen')].map((t,i)=>`<span class="${i===p.chapter?'active':''}" ${i===p.chapter?'aria-current="step"':''}>${T(t)}</span>`).join('');let controls=p.kind==='lesson'&&p.visual==='mask'?`<div class="visualcontrols"><label>${L('IP-Adresse','Dirección IP')}<input id="visualip" value="${CASES[visualCase].ip}" aria-label="${L('IP im Visualisierer','IP del visualizador')}"></label><label>${L('Präfix','Prefijo')}<select id="visualprefix">${[20,23,27].map(n=>`<option ${n===CASES[visualCase].p?'selected':''}>${n}</option>`).join('')}</select></label><button id="visualupdate">${L('Darstellen','Dibujar')}</button><button id="visualview">${visualView==='bits'?L('Block','Bloque'):L('Bits','Bits')}</button></div><p id="visualerror" class="small" role="status"></p>`:'';const isStep=(p.kind==='arp'||p.kind==='dhcp')&&mode==='normal';$('#work').innerHTML=`<figure class="figure"><div class="stage">${controls}<div class="svgwrap" id="diagram">${figureContent(p)}</div>${isStep?`<div class="captiondetail">${T((p.kind==='arp'?ARPSTEPS:DHCPSTEPS)[step])}</div><div class="stepcontrols"><button data-step="prev" id="stepprev" ${step===0?'disabled':''}>${L('Schritt zurück','Paso anterior')}</button><span>${L('Schritt','Paso')} ${step+1} / 4</span><button data-step="next" id="stepnext" ${step===3?'disabled':''}>${L('Nächster Schritt','Paso siguiente')}</button></div>`:''}</div><figcaption>${p.task?L(`Aufgabe ${p.task} · eigene Aufgabe, nicht offiziell IHK`,`Tarea ${p.task} · ejercicio propio, no oficial IHK`):p.kind==='official'?L('Offizieller Auszug · keine automatische Bewertung','Extracto oficial · sin puntuación automática'):['reserve','written'].includes(p.kind)?L('Eigene Aufgabe, nicht offiziell IHK','Ejercicio propio, no oficial IHK'):L('Lernmodell · keine Messung an einem realen Netzwerk','Modelo didáctico · no es una medición de red real')}</figcaption></figure><aside class="aside">${asideHtml(p)}</aside>`;document.documentElement.lang=lang;$('#notestoggle').textContent=mode==='notes'?L('Zur Figur','Volver al dibujo'):L('Notizen','Notas');$('#lang').textContent=lang==='de'?'Español':'Deutsch';$('#lang').lang=lang==='de'?'es':'de';$('#export').textContent=L('Exportieren','Exportar');$('#prev').textContent=L('Zurück','Atrás');$('#next').textContent=L('Weiter','Siguiente');$('#prev').disabled=pageIndex===0;$('#next').disabled=pageIndex===PAGES.length-1;$('[data-page-indicator]').textContent=`Seite ${pageIndex+1} / ${PAGES.length}`;$('#progress').style.width=(pageIndex+1)/PAGES.length*100+'%';$('.progress').setAttribute('aria-valuenow',pageIndex+1);$('.progress').setAttribute('aria-valuemax',PAGES.length);$('.progress').setAttribute('aria-valuetext',`Seite ${pageIndex+1} / ${PAGES.length}`);bind();storageText()}
function recordInputs(){const p=current();state.answers[p.id]||={};document.querySelectorAll('[data-field]').forEach(el=>state.answers[p.id][el.dataset.field]=el.value);save()}
function validField(f,v,a,m){if(!String(v||'').trim())return {ok:false,empty:true};if(f.type==='choice')return {ok:v===f.valid};if(f.type==='client'){let n=toInt(v);return {ok:n!==null&&n>m.net&&n<m.end&&![NET.gateway,NET.printer].map(toInt).includes(n)}}if(f.type==='gateway')return {ok:toInt(v)===toInt(NET.gateway)};if(f.type.startsWith('pool')){let s=toInt(a.start),e=toInt(a.end),range=s!==null&&e!==null&&s<=e&&s>m.net&&e<m.end&&![NET.gateway,NET.printer].map(toInt).some(n=>n>=s&&n<=e);return {ok:f.type==='poolCount'?range&&/^\d+$/.test(v.trim())&&+v===e-s+1:range}}if(f.type==='num')return {ok:/^\d+$/.test(v.trim())&&+v===expected(f,m)};return {ok:toInt(v)===toInt(expected(f,m))&&toInt(v)!==null}}
function errorCause(f,p){if(f.type.startsWith('pool'))return L('Grenzen, Reserven und inklusive Größe prüfen.','Revisa extremos, reservas y tamaño inclusivo.');if(f.type==='client')return L('Nur freie Hosts innerhalb des /27.','Solo hosts libres dentro del /27.');if(f.type==='gateway')return L('Die vorhandene Router-IP verwenden.','Usa la IP real del router.');if(f.type==='choice')return p.kind==='diagnostic'?L('Symptom ist kein Beweis; gezielte Prüfung wählen.','El síntoma no prueba la causa; elige prueba específica.'):L('Netzteil und lokalen MAC-Empfänger prüfen.','Revisa red y receptor MAC local.');if(f.type==='num')return L('Menge bzw. Bitposition, kein letzter Adresswert.','Cantidad o posición de bits, no valor final de dirección.');return f.ref==='mask'?L('Führende Einsen der Maske zählen.','Cuenta los unos iniciales de la máscara.'):L('Netzbits erhalten; Hostbits/Grenze prüfen.','Conserva bits red; revisa host y límite.')}
function check(){recordInputs();const p=current(),m=cm(p),a=state.answers[p.id],results=p.fields.map(f=>({id:f.id,...validField(f,a[f.id],a,m)}));state.attempts[p.id]||=[];state.attempts[p.id].push({time:new Date().toISOString(),answers:{...a},results,help:JSON.parse(JSON.stringify(help(p))),seen:[...state.seen],coach:!!state.coach[p.id]});results.forEach((r,i)=>{let el=$('#r-'+r.id);el.textContent=r.empty?L('Leer: bitte antworten.','Vacío: responde.'):r.ok?L('✓ Fachlich passend','✓ Técnicamente válido'):L('Prüfen: ','Revisar: ')+errorCause(p.fields[i],p);el.className='result '+(r.ok?'ok':'bad')});$('#feedback').textContent=results.every(r=>r.ok)?p.open?L('Felder stimmen. Begründung prüft der Tutor.','Campos correctos. El tutor revisa la justificación.'):L('Felder stimmen. Erklären Sie den Rechenweg.','Campos correctos. Explica el cálculo.'):L('Markierte Felder überarbeiten; Hinweis ist separat.','Revisa los campos marcados; la pista está aparte.');save()}
function reveal(which){const p=current();recordInputs();if(which==='solution'){help(p).solution=true;mode=mode==='solution'?'normal':'solution';if(p.c)markSeen(p.c)}else{help(p).hint=true;mode='hint'}save();render()}
function bind(){document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{recordInputs();if(current().kind==='pool')$('#diagram').innerHTML=figureContent(current())}));$('#notes')?.addEventListener('input',e=>{state.notes[current().id]=e.target.value;save()});$('#coach')?.addEventListener('change',e=>{state.coach[current().id]=e.target.checked;save();if($('.helpstate'))$('.helpstate').textContent=assistance(current())});$('#review')?.addEventListener('change',e=>{state.review[current().id]=e.target.value;save()});$('#check')?.addEventListener('click',check);$('#compare')?.addEventListener('click',()=>reveal('solution'));$('#hint')?.addEventListener('click',()=>reveal('hint'));$('#solution')?.addEventListener('click',()=>reveal('solution'));$('#backfig')?.addEventListener('click',()=>{mode='normal';render()});$('#stepnext')?.addEventListener('click',()=>{step++;render()});$('#stepprev')?.addEventListener('click',()=>{step--;render()});$('#visualview')?.addEventListener('click',()=>{visualView=visualView==='bits'?'block':'bits';render()});$('#visualupdate')?.addEventListener('click',()=>{let v=$('#visualip').value.trim(),p=+$('#visualprefix').value;if(toInt(v)===null){$('#visualerror').textContent=L('Vier Oktette von 0 bis 255 eingeben.','Introduce cuatro octetos de 0 a 255.');return}CASES.live={ip:ip(toInt(v)),p};visualCase='live';let match=Object.keys(CASES).find(k=>k!=='live'&&CASES[k].ip===CASES.live.ip&&CASES[k].p===p);if(match)markSeen(match);render()});$('#simcase')?.addEventListener('change',e=>{simIndex=+e.target.value;mode='normal';render()});$('#simulate')?.addEventListener('click',()=>{recordInputs();help(current()).result=true;state.answers[current().id].simulation=simIndex;mode='simulation';$('#diagram').innerHTML=`<div class="rubric"><h2>${L('Simulierter Prüfbefund','Resultado simulado')}</h2><div class="simulation"><strong>${T(SIMS[current().diag][simIndex].label)}</strong><p>${T(SIMS[current().diag][simIndex].result)}</p></div><p>${L('Leiten Sie daraus eine begrenzte Folgerung ab; der Tutor prüft sie. Weitere Fälle helfen beim Unterscheiden.','Deduce una conclusión limitada; el tutor la revisa. Otros casos ayudan a discriminar.')}</p></div>`;if($('.helpstate'))$('.helpstate').textContent=assistance(current());save()});document.querySelectorAll('[data-closing]').forEach(el=>el.addEventListener('input',e=>{state.closing[el.dataset.closing]=e.target.value;save()}));$('#export2')?.addEventListener('click',exportData)}
function navigate(delta){if(pageIndex+delta<0||pageIndex+delta>=PAGES.length)return;pageIndex+=delta;mode='normal';step=0;simIndex=0;render()}
function exportData(){save();const data={workshop:'IPv4 Blocklabor · Nachhilfe 08.10.2026',exportedAt:new Date().toISOString(),storage:storageAvailable?'browser-local-unreliable':'memory-only',scope:'Lernfälle und Antworten; kein Nachweis der Beherrschung, keine IHK-Note',records:PAGES.map(p=>({id:p.id,task:p.task||null,prompt:expand(p.q,p),answers:state.answers[p.id]||{},note:state.notes[p.id]||'',help:state.help[p.id]||{},equivalentSeen:state.seen.includes(p.c),coachHelp:!!state.coach[p.id],review:state.review[p.id]||'',attempts:state.attempts[p.id]||[]})),closing:state.closing};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='IPv4-Nachhilfe-2026-10-08-Antworten.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('#storage').textContent=L('Export ausgelöst · Download im Browser prüfen','Exportación iniciada · comprueba la descarga')}
$('#notestoggle').addEventListener('click',()=>{mode=mode==='notes'?'normal':'notes';render()});$('#prev').addEventListener('click',()=>navigate(-1));$('#next').addEventListener('click',()=>navigate(1));$('#lang').addEventListener('click',()=>{lang=lang==='de'?'es':'de';render()});$('#export').addEventListener('click',exportData);document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();navigate(1)}if(e.key==='ArrowLeft'){e.preventDefault();navigate(-1)}});
render();
