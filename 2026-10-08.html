{id:1,ch:'Üben',group:'Zuordnen',title:tx('Wo endet der Netzteil?','¿Dónde termina la parte de red?'),ip:'192.168.4.37',p:24,view:'bits',focus:'given',prompt:tx('Büro Eichenweg dokumentiert den Client 192.168.4.37/24. Nennen Sie die Anzahl fester Netzbits und variabler Hostbits.','La oficina Eichenweg documenta el cliente 192.168.4.37/24. Indica cuántos bits de red son fijos y cuántos bits host son variables.'),operator:'Nennen',pts:2,fields:[field('p',tx('Netzbits','Bits de red'),'num'),field('hostbits',tx('Hostbits','Bits host'),'num')],hint:tx('Das Präfix zählt die festen Bits von links. Insgesamt hat IPv4 32 Bit.','El prefijo cuenta los bits fijos desde la izquierda. IPv4 tiene 32 bits.'),why:tx('24 Bit bleiben im Block gleich. Die übrigen 8 Bit unterscheiden die Positionen.','24 bits permanecen iguales dentro del bloque. Los otros 8 distinguen las posiciones.')},
{id:2,ch:'Üben',group:'Berechnen',title:tx('Drei Präfixe, drei Schnitte','Tres prefijos, tres cortes'),ip:'192.168.10.141',p:27,view:'mask',prompt:tx('Netzservice Rhein prüft drei Vorlagen. Vervollständigen Sie für /27, /23 und /20 die Maske und das Oktett mit dem Schnitt (1–4).','Netzservice Rhein revisa tres plantillas. Completa la máscara y el octeto donde cae el corte (1–4) para /27, /23 y /20.'),operator:'Vervollständigen',pts:6,table:true,fields:[27,23,20].flatMap(p=>[field('mask'+p,tx('/'+p+' · Maske','/'+p+' · máscara'),'maskp',{prefix:p}),field('cut'+p,tx('/'+p+' · Schnitt-Oktett','/'+p+' · octeto del corte'),'cutp',{prefix:p})]),hint:tx('Volle Oktette enthalten acht Einsen. Das nächste Oktett enthält die restlichen Netzbits; danach folgen Nullen.','Los octetos completos tienen ocho unos. El siguiente contiene los bits de red restantes; después vienen ceros.'),why:tx('27=24+3; 23=16+7; 20=16+4. Nur das teilweise feste Oktett hat einen Wert zwischen 0 und 255.','27=24+3; 23=16+7; 20=16+4. Solo el octeto parcialmente fijo tiene un valor entre 0 y 255.')},
{id:3,ch:'Üben',group:'Berechnen',title:tx('Die IP ist noch keine Netzadresse','La IP todavía no es la dirección de red'),ip:'192.168.10.141',p:27,view:'bits',focus:'net',prompt:tx('Die Werkstatt Lenz erfasst 192.168.10.141/27. Berechnen Sie die Netzadresse. Begründen Sie mündlich, welche Bits Sie verändern.','El taller Lenz registra 192.168.10.141/27. Calcula la dirección de red. Explica oralmente qué bits cambias.'),operator:'Berechnen',pts:2,fields:[F.net()],hint:tx('Im letzten Oktett bleiben drei Bits fest. Setze nur die fünf Hostbits auf 0.','En el último octeto hay tres bits fijos. Pon solo los cinco bits host a 0.'),why:tx('141 ist die Position der gegebenen IP. Für den Blockanfang werden die Hostbits null; die Netzbits bleiben erhalten.','141 es la posición de la IP dada. Para el comienzo del bloque, los bits host pasan a cero; los de red permanecen.')},
{id:4,ch:'Üben',group:'Berechnen',title:tx('Bis wohin reicht der Block?','¿Hasta dónde llega el bloque?'),ip:'192.168.10.141',p:27,view:'bits',focus:'broadcast',prompt:tx('Lenz ergänzt die Dokumentation derselben Schnittstelle. Berechnen Sie den Broadcast für 192.168.10.141/27. Beschreiben Sie die Änderung am Hostteil.','Lenz completa la documentación de esa interfaz. Calcula el broadcast de 192.168.10.141/27. Describe el cambio en la parte host.'),operator:'Berechnen',pts:2,fields:[F.broadcast()],hint:tx('Lasse den festen Netzteil unverändert und setze alle Hostbits auf 1.','Conserva la parte fija y pon todos los bits host a 1.'),why:tx('Der größte Wert innerhalb desselben Präfixes entsteht mit lauter Einsen im Hostteil. Nicht jedes .255 ist Broadcast.','El mayor valor con el mismo prefijo tiene todos los bits host a uno. No todo .255 es broadcast.')},
{id:5,ch:'Üben',group:'Berechnen',title:tx('Anzahl ist nicht Endwert','Cantidad no es valor final'),ip:'192.168.10.141',p:27,view:'range',prompt:tx('Das Inventar Lenz braucht den nutzbaren Bereich von 192.168.10.141/27. Ergänzen Sie Anfang, Ende, Gesamtzahl und konventionelle Hostzahl.','El inventario Lenz necesita el rango útil de 192.168.10.141/27. Completa inicio, final, cantidad total y hosts convencionales.'),operator:'Vervollständigen',pts:4,table:true,fields:[F.first(),F.last(),F.size(),F.hosts()],hint:tx('Fünf Hostbits ergeben 2⁵ Positionen. Netz und Broadcast sind im konventionellen LAN nicht als Hosts nutzbar.','Cinco bits host dan 2⁵ posiciones. En una LAN convencional, red y broadcast no se asignan a hosts.'),why:tx('Es gibt 32 Positionen, aber der letzte Dezimalwert ist 159. Für Hosts bleiben die beiden Endpunkte ausgeschlossen.','Hay 32 posiciones, pero el valor decimal final es 159. Para hosts se excluyen ambos extremos.')},
{id:6,ch:'Üben',group:'Berechnen',title:tx('Der Anfang liegt im Nachbaroktett','El comienzo cae en el octeto vecino'),ip:'192.168.11.73',p:23,view:'cross',focus:'start',prompt:tx('Hotel Lindenhof nutzt 192.168.11.73/23. Berechnen Sie Netzadresse und erste nutzbare Adresse. Beachten Sie den Schnitt im dritten Oktett.','El hotel Lindenhof usa 192.168.11.73/23. Calcula la red y la primera dirección útil. El corte cae en el tercer octeto.'),operator:'Berechnen',pts:2,fields:[F.net(),F.first()],hint:tx('Das letzte Bit des dritten Oktetts gehört zum Hostteil. Auch das gesamte vierte Oktett ist variabel.','El último bit del tercer octeto pertenece al host. Todo el cuarto octeto también es variable.'),why:tx('Der feste Teil endet vor dem letzten Bit des dritten Oktetts. Nullsetzen aller neun Hostbits führt zu 192.168.10.0.','La parte fija termina antes del último bit del tercer octeto. Poner los nueve bits host a cero da 192.168.10.0.')},
{id:7,ch:'Üben',group:'Berechnen',title:tx('Das Ende liegt hinter .255','El final está después de .255'),ip:'192.168.11.73',p:23,view:'cross',focus:'end',prompt:tx('Lindenhof ergänzt Broadcast und letzten Host für 192.168.11.73/23. Zeigen Sie Ihrem Tutor, wie der Block zwei Werte des dritten Oktetts umfasst.','Lindenhof completa broadcast y último host para 192.168.11.73/23. Muestra al tutor cómo el bloque abarca dos valores del tercer octeto.'),operator:'Berechnen',pts:2,fields:[F.broadcast(),F.last()],hint:tx('Setze neun Hostbits auf 1. Das betrifft ein Bit im dritten und alle acht im vierten Oktett.','Pon nueve bits host a 1: uno del tercer octeto y los ocho del cuarto.'),why:tx('192.168.10.255 ist eine innere Position. Erst 192.168.11.255 setzt alle neun Hostbits auf 1.','192.168.10.255 es una posición interior. Solo 192.168.11.255 pone los nueve bits host a 1.')},
{id:8,ch:'Üben',group:'Berechnen',title:tx('16 Werte mal 256 Positionen','16 valores por 256 posiciones'),ip:'10.23.77.69',p:20,view:'grid20',prompt:tx('Logistik West konfiguriert 10.23.77.69/20. Dokumentieren Sie Netz, Broadcast, Hostbereich und Gesamtzahl. Begründen Sie 16 × 256 mündlich.','Logistik West configura 10.23.77.69/20. Documenta red, broadcast, rango host y total. Explica oralmente 16 × 256.'),operator:'Vervollständigen',pts:5,table:true,fields:[F.net(),F.broadcast(),F.first(),F.last(),F.size()],hint:tx('Im dritten Oktett ist der Block 16 Werte breit. Suche das Vielfache von 16 unterhalb von 77; das vierte Oktett läuft vollständig durch.','El bloque ocupa 16 valores del tercer octeto. Busca el múltiplo de 16 inferior a 77; el cuarto octeto recorre todos sus valores.'),why:tx('Der dritte Oktettbereich ist 64–79. Zu jedem dieser 16 Werte gehören 256 Werte des vierten Oktetts: 4096 Adressen.','El tercer octeto abarca 64–79. Cada uno de sus 16 valores tiene 256 valores del cuarto: 4096 direcciones.')},
{id:9,ch:'Üben',group:'Zuordnen',title:tx('.0 und .255 können Hosts sein','.0 y .255 pueden ser hosts'),ip:'192.168.10.0',p:23,view:'roles',candidates:['192.168.11.0','192.168.10.255'],prompt:tx('Medienhaus Nord verwendet 192.168.10.0/23. Ordnen Sie 192.168.11.0 und 192.168.10.255 ein. Entscheidend ist der gesamte Hostteil.','Medienhaus Nord usa 192.168.10.0/23. Clasifica 192.168.11.0 y 192.168.10.255. Decide a partir de toda la parte host.'),operator:'Zuordnen',pts:2,fields:['192.168.11.0','192.168.10.255'].map((v,i)=>field('role'+i,tx(v,v),'role',{candidate:v,options:options([['net','Netzadresse','Red'],['broadcast','Broadcast','Broadcast'],['host','Nutzbare Hostadresse','Host útil'],['outside','Außerhalb des Blocks','Fuera del bloque']])})),hint:tx('Prüfe alle neun Hostbits, nicht nur die letzten acht. Sind wirklich alle 0 oder alle 1?','Revisa los nueve bits host, no solo los últimos ocho. ¿Son todos 0 o todos 1?'),why:tx('Beide Adressen liegen im Block und sind weder dessen erster noch letzter Wert. Beide sind konventionelle Hostadressen.','Ambas están dentro del bloque y ninguna es el primer o último valor. Ambas son hosts convencionales.')},
{id:10,ch:'Üben',group:'Konfigurieren',title:tx('Eine freie Client-IP wählen','Elegir una IP de cliente libre'),ip:'192.168.10.141',p:27,view:'network',gateway:'192.168.10.129',printer:'192.168.10.130',wan:'203.0.113.2/30',dmz:'172.18.40.1/24',prompt:tx('Druckerei Weber: LAN 192.168.10.128/27. Gateway .129 und Drucker .130 sind belegt; alle anderen Hostadressen sind frei. Wählen Sie eine Client-IP und erläutern Sie die Wahl mündlich.','Imprenta Weber: LAN 192.168.10.128/27. Gateway .129 e impresora .130 están ocupados; todos los demás hosts están libres. Elige una IP cliente y justifica oralmente.'),operator:'Begründen',pts:3,fields:[field('client',tx('Freie Client-IP','IP de cliente libre'),'client')],hint:tx('Wähle einen nutzbaren Host im selben Block. Schließe die beiden Endpunkte und belegte Adressen aus.','Elige un host útil del mismo bloque. Excluye los extremos y las direcciones ocupadas.'),why:tx('Jede IP von 192.168.10.131 bis 192.168.10.158 ist gültig. Die Begründung prüft der Tutor: gleicher Block, kein Endpunkt, nicht belegt.','Cualquier IP de 192.168.10.131 a 192.168.10.158 vale. El tutor revisa la justificación: mismo bloque, no es extremo ni está ocupada.')},
{id:11,ch:'Üben',group:'Konfigurieren',title:tx('Ein Gateway außerhalb des Blocks','Un gateway fuera del bloque'),ip:'192.168.10.141',p:27,view:'network',gateway:'192.168.10.129',printer:'192.168.10.130',badGateway:'192.168.10.1',wan:'198.51.100.6/30',dmz:'172.20.8.1/24',prompt:tx('Praxis Kern hat genau einen lokalen Router: LAN-IP 192.168.10.129/27. Client .141/27 trägt irrtümlich Gateway 192.168.10.1 ein. Keine Zusatzrouten. Korrigieren Sie den Eintrag und erläutern Sie den Fehler.','La consulta Kern tiene un único router local: LAN 192.168.10.129/27. El cliente .141/27 tiene por error gateway 192.168.10.1. No hay rutas adicionales. Corrige el campo y explica el error.'),operator:'Erläutern',pts:3,fields:[field('gateway',tx('Korrigiertes Gateway','Gateway corregido'),'gateway')],hint:tx('Das Gateway muss in diesem Modell direkt im Client-LAN erreichbar sein. Benutze die tatsächlich vorhandene Router-Schnittstelle.','En este modelo, el gateway debe estar directamente en la LAN del cliente. Usa la interfaz real del router.'),why:tx('192.168.10.1 liegt außerhalb 192.168.10.128/27. Die lokale Router-Schnittstelle ist .129. Eine beliebige freie IP ist kein vorhandener Router.','192.168.10.1 está fuera de 192.168.10.128/27. La interfaz local es .129. Una IP libre cualquiera no representa un router existente.')},
{id:12,ch:'Üben',group:'Zuordnen',title:tx('IP-Ziel bleibt, MAC-Ziel wechselt','La IP destino permanece, la MAC cambia'),ip:'192.168.10.141',p:27,view:'network',gateway:'192.168.10.129',printer:'192.168.10.150',remote:'192.168.10.170/27',wan:'203.0.113.10/30',dmz:'192.168.10.161/27',prompt:tx('Archiv Blau: Client .141/27, Router .129/27, lokales Ziel .150/27 und entferntes Ziel .170/27. Alle Adressen beginnen mit 192.168.10. Keine Zusatzrouten oder Proxy-ARP. Bestimmen Sie Weg und per ARP gesuchte MAC.','Archivo Blau: cliente .141/27, router .129/27, destino local .150/27 y remoto .170/27. Todas las IP comienzan con 192.168.10. Sin rutas extra ni proxy ARP. Indica camino y MAC buscada por ARP.'),operator:'Zuordnen',pts:4,fields:[field('route0',tx('.150 · Weg','.150 · camino'),'route',{candidate:'192.168.10.150',options:options([['local','Direkt im LAN','Directo en LAN'],['gateway','Über Gateway','Por gateway']])}),field('mac0',tx('.150 · ARP fragt nach MAC von','.150 · ARP busca MAC de'),'mac',{candidate:'192.168.10.150',options:options([['target','Ziel .150','Destino .150'],['router','Router .129','Router .129']])}),field('route1',tx('.170 · Weg','.170 · camino'),'route',{candidate:'192.168.10.170',options:options([['local','Direkt im LAN','Directo en LAN'],['gateway','Über Gateway','Por gateway']])}),field('mac1',tx('.170 · ARP fragt nach MAC von','.170 · ARP busca MAC de'),'mac',{candidate:'192.168.10.170',options:options([['target','Ziel .170','Destino .170'],['router','Router .129','Router .129']])})],hint:tx('Vergleiche die Netzanteile mit der Clientmaske. Bei einem fremden Block geht der Frame an den lokalen Router.','Compara las partes de red con la máscara del cliente. Si el bloque es distinto, la trama va al router local.'),why:tx('.150 liegt im Clientblock; ARP sucht dessen MAC. .170 liegt im nächsten /27; ARP sucht .129. Die IP-Zieladresse bleibt .170. ARP allein bestätigt keinen vollständigen Dienstzugriff.','.150 está en el bloque del cliente; ARP busca su MAC. .170 cae en el siguiente /27; ARP busca .129. La IP destino sigue siendo .170. ARP no confirma el acceso completo al servicio.')},
{id:13,ch:'Üben',group:'Konfigurieren',title:tx('Ein Pool ohne Kollisionen','Un pool sin colisiones'),ip:'192.168.10.141',p:27,view:'network',gateway:'192.168.10.129',printer:'192.168.10.130',wan:'198.51.100.10/30',dmz:'172.21.9.1/24',prompt:tx('Schulungszentrum Süd: LAN 192.168.10.128/27. .129 ist Gateway, .130 Drucker; sonst keine Belegung. Planen Sie einen zusammenhängenden DHCP-Pool beliebiger positiver Größe und berechnen Sie die inklusive Anzahl.','Centro Süd: LAN 192.168.10.128/27. .129 es gateway y .130 impresora; no hay otras ocupaciones. Planifica un pool DHCP continuo de cualquier tamaño positivo y calcula la cantidad inclusiva.'),operator:'Berechnen',pts:3,fields:[field('poolstart',tx('Pool-Anfang','Inicio del pool'),'poolstart'),field('poolend',tx('Pool-Ende','Final del pool'),'poolend'),field('poolcount',tx('Anzahl einschließlich Endpunkten','Cantidad con extremos incluidos'),'poolcount')],hint:tx('Beide Enden müssen nutzbar und frei sein. Auch alle Adressen dazwischen müssen frei sein. Anzahl = Ende − Anfang + 1.','Ambos extremos y todas las direcciones intermedias deben ser hosts libres. Cantidad = final − inicio + 1.'),why:tx('Jeder Bereich mit 192.168.10.131 ≤ Anfang ≤ Ende ≤ 192.168.10.158 ist gültig. Auch ein Pool mit einer Adresse ist möglich.','Cualquier rango con 192.168.10.131 ≤ inicio ≤ final ≤ 192.168.10.158 vale. Puede contener una sola dirección.')},
{id:14,ch:'Üben',group:'Diagnostizieren',title:tx('APIPA ist ein Symptom','APIPA es un síntoma'),ip:'169.254.44.28',p:16,view:'diagnostic',diag:'dhcp',prompt:tx('Lager Stern: DHCP aktiviert, ipconfig zeigt 169.254.44.28/16, kein Gateway. Wählen Sie eine plausible Hypothese und eine diskriminierende nächste Prüfung. Sehen Sie anschließend deren simuliertes Ergebnis an.','Almacén Stern: DHCP activo, ipconfig muestra 169.254.44.28/16, sin gateway. Elige una hipótesis plausible y una prueba que permita discriminar. Luego consulta su resultado simulado.'),operator:'Erläutern',pts:4,fields:[field('hyp',tx('Plausible Hypothese','Hipótesis plausible'),'plausible',{options:options([['path','DHCP-Pfad / Port gestört','Camino DHCP / puerto interrumpido'],['pool','Pool hat keine freie Lease','El pool no tiene leases libres'],['server','DHCP-Dienst antwortet nicht','El servicio DHCP no responde'],['certain','Server ist sicher ausgefallen','El servidor está caído con certeza']])}),field('test',tx('Nächste Prüfung','Prueba siguiente'),'test',{options:options([['path','Link / Portzuordnung prüfen','Revisar enlace / puerto'],['capture','DHCP-Mitschnitt vergleichen','Comparar captura DHCP'],['pool','Pool und Dienststatus lesen','Leer estado del pool y servicio'],['arp','Zuerst Server-MAC per ARP suchen','Primero buscar MAC del servidor con ARP']])})],hint:tx('Keine gültige Lease kann mehrere Ursachen haben. Prüfe Client, Übertragungsweg oder Server/Pool; das initiale DISCOVER ist ein Broadcast.','La ausencia de lease tiene varias causas. Revisa cliente, camino o servidor/pool; el DISCOVER inicial es broadcast.'),why:tx('APIPA beweist keinen Serverausfall. Simuliert: Link aktiv, Clientport im falschen VLAN, kein DISCOVER am Server; Dienst läuft und Pool ist frei. Der Pfad ist hier die gestützte Ursache.','APIPA no demuestra caída del servidor. Simulación: enlace activo, puerto cliente en VLAN errónea, DISCOVER no llega al servidor; servicio activo y pool libre. Aquí la evidencia apoya un problema del camino.')},
{id:15,ch:'Üben',group:'Diagnostizieren',title:tx('Per IP geht es, per Name nicht','Funciona por IP, por nombre no'),ip:'172.24.6.41',p:24,view:'diagnostic',diag:'dns',prompt:tx('Agentur Mosaik: Ping auf 172.24.6.20 gelingt; files.mosaik.example wird nicht aufgelöst. Konfigurierter DNS: 172.24.6.53, interner Referenz-DNS: .54. Wählen Sie Hypothese und Prüfung; betrachten Sie das simulierte Ergebnis.','Agencia Mosaik: ping a 172.24.6.20 responde; files.mosaik.example no se resuelve. DNS configurado: 172.24.6.53; DNS interno de referencia: .54. Elige hipótesis y prueba; observa el resultado simulado.'),operator:'Erläutern',pts:4,fields:[field('hyp',tx('Plausible Hypothese','Hipótesis plausible'),'plausible',{options:options([['resolver','DNS .53 kennt den Namen nicht','DNS .53 no conoce el nombre'],['typo','Name wurde falsch geschrieben','Nombre mal escrito'],['cache','Lokaler Resolvercache ist veraltet','Caché local obsoleta'],['certain','Ping beweist: DNS ist die einzige Ursache','Ping demuestra que DNS es la única causa']])}),field('test',tx('Nächste Prüfung','Prueba siguiente'),'test',{options:options([['configured','nslookup gegen DNS .53','nslookup contra DNS .53'],['reference','nslookup gegen DNS .54','nslookup contra DNS .54'],['ping','Nur noch einmal per IP pingen','Solo repetir ping por IP']])})],hint:tx('Trenne Namensauflösung von Erreichbarkeit und Dienst. Eine gezielte DNS-Abfrage benennt auch den befragten Server.','Separa resolución de nombre, conectividad y servicio. Una consulta DNS precisa identifica el servidor consultado.'),why:tx('Simuliert: .53 liefert NXDOMAIN, .54 liefert 172.24.6.20 für denselben FQDN. Das stützt eine Resolver-/Zonenkonfiguration bei .53. Danach den gewünschten Dienst testen; Ping beweist nur die ICMP-Antwort.','Simulación: .53 da NXDOMAIN y .54 da 172.24.6.20 para el mismo FQDN. Apoya un problema de resolver/zona en .53. Después prueba el servicio requerido; ping solo demuestra respuesta ICMP.')},
{id:16,ch:'Prüfungsaufgabe',group:'Schreiben',title:tx('Neue Variante: einen Client begründen','Nueva variante: justificar un cliente'),ip:'172.22.35.81',p:23,view:'network',gateway:'172.22.34.1',printer:'172.22.34.250',wan:'203.0.113.18/30',dmz:'172.22.36.1/24',written:true,prompt:tx('Ausgangssituation Falk: Client 172.22.35.81/23, Router 172.22.34.1. a) Dokumentieren Sie Netz, Broadcast und Hostbereich (4 P). b) Begründen Sie das Gateway (2 P). c) Erläutern Sie den Weg zu 172.22.34.250/23 (2 P).','Situación Falk: cliente 172.22.35.81/23, router 172.22.34.1. a) Documenta red, broadcast y rango host (4 p). b) Justifica el gateway (2 p). c) Explica el camino a 172.22.34.250/23 (2 p).'),operator:'Begründen',pts:8,fields:[],hint:tx('Formuliere ganze Sätze auf Deutsch. Begründung: Netzvergleich, direkte Erreichbarkeit und Ziel-IP/MAC-Ziel getrennt.','Redacta frases completas en alemán. Justifica con comparación de red, acceso directo y separación IP/MAC destino.'),why:tx('Kriterien statt Schlüsselwortwertung: vier Adresswerte, Gateway im eigenen Block und vorhanden, Ziel im selben Block und ARP zum Ziel.','Criterios, no palabras clave: cuatro valores de dirección, gateway existente en el bloque, destino local y ARP hacia él.')},
{id:17,ch:'Üben',group:'Zusatz · Berechnen',extra:true,title:tx('/28 in einer neuen Filiale','/28 en una nueva sucursal'),ip:'192.168.20.94',p:28,view:'range',prompt:tx('Filiale Berg verwendet 192.168.20.94/28. Berechnen Sie Netz, Broadcast, Hostbereich und konventionelle Hostzahl. Diese Variante ist Zusatzpraxis.','La sucursal Berg usa 192.168.20.94/28. Calcula red, broadcast, rango host y cantidad de hosts convencionales. Es práctica extra.'),operator:'Berechnen',pts:5,table:true,fields:[F.net(),F.broadcast(),F.first(),F.last(),F.hosts()],hint:tx('Vier Hostbits bedeuten 16 Adressen im Block, davon 14 konventionelle Hosts. Der gegebene Host kann der letzte nutzbare sein.','Cuatro bits host dan 16 direcciones, de las cuales 14 son hosts convencionales. La IP dada puede ser el último host útil.'),why:tx('94 liegt im 16er-Block 80–95. Hostbereich 81–94; die konventionelle Hostzahl ist 14, nicht 30.','94 cae en el bloque de 16 valores 80–95. Hosts 81–94; son 14, no 30.')},
{id:18,ch:'Üben',group:'Zusatz · Berechnen',extra:true,title:tx('/29 für eine kleine Werkstatt','/29 para un taller pequeño'),ip:'192.168.30.14',p:29,view:'cells',prompt:tx('Werkstatt Holm dokumentiert 192.168.30.14/29. Berechnen Sie Netz, Broadcast, ersten/letzten Host und Gesamtzahl. Begründen Sie die Menge anhand der variablen Bits.','El taller Holm documenta 192.168.30.14/29. Calcula red, broadcast, primer/último host y total. Justifica la cantidad con los bits variables.'),operator:'Berechnen',pts:5,table:true,fields:[F.net(),F.broadcast(),F.first(),F.last(),F.size()],hint:tx('Drei variable Bits liefern acht Positionen. Die Blockanfänge liegen auf Vielfachen von acht.','Tres bits variables dan ocho posiciones. Los bloques comienzan en múltiplos de ocho.'),why:tx('14 liegt im Block 8–15. Acht Adressen, sechs konventionelle Hosts; die Endwerte sind nicht die Anzahl.','14 cae en el bloque 8–15. Ocho direcciones y seis hosts convencionales; los valores finales no son la cantidad.')},

const blankState=()=>({version:1,answers:{},notes:{},work:{},learn:{},seen:[],closing:{},local:false});
let state=blankState(),storageOK=true;
const key='fisi-ipv4-nachhilfe-2026-10-08-v1';
try{const raw=localStorage.getItem(key);if(raw){const s=JSON.parse(raw);if(s.version===1&&s.local&&s.answers&&s.work&&s.learn&&Array.isArray(s.seen)){state={...blankState(),...s}}}}catch(e){storageOK=false}
function work(id){return state.work[id]??=( {attempts:0,correct:false,first:false,hint:false,solution:false,equivalent:false,reviewed:false,hints:0,results:{},sim:[]} )}
function fingerprint(ip,p){const m=model(ip,p);return `${m.net}/${p}`}
function exposure(ip,p,origin){const f=fingerprint(ip,p);if(!state.seen.some(x=>x.f===f))state.seen.push({f,origin});for(const t of tasks)if(fingerprint(t.ip,t.p)===f){const w=work(t.id);w.equivalent=true;w.first=false}save()}
function save(){if(!state.local)return;try{localStorage.setItem(key,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;document.querySelector('#storage').textContent=L(UI.notsaved);toast(tx('Browserkopie fehlgeschlagen. Antworten bleiben nur in dieser Sitzung: jetzt exportieren.','Falló la copia local. Las respuestas quedan solo en esta sesión: exporta ahora.'))}}
function toast(msg){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.textContent=L(msg);el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,6000)}
function statusText(t){const w=work(t.id);if(w.solution)return tx('◇ Lösung gesehen','◇ Solución vista');if(w.reviewed)return tx('✓ Mit Tutor besprochen','✓ Revisado con tutor');if(w.hint)return tx('△ Hinweis genutzt','△ Con pista');if(w.correct&&w.equivalent)return tx('✓ Nach Beispiel / Hilfe','✓ Tras ejemplo / ayuda');if(w.correct)return tx('✓ Felder ohne Hilfe richtig','✓ Campos correctos sin ayuda');if(w.equivalent)return tx('Beispiel bereits gesehen','Ejemplo ya visto');return UI.pending}
function stats(){const done=tasks.filter(t=>work(t.id).correct||work(t.id).reviewed).length,first=tasks.filter(t=>work(t.id).correct&&work(t.id).first&&!work(t.id).hint&&!work(t.id).solution&&!work(t.id).equivalent).length;document.querySelector('#stats').innerHTML=[[UI.counts,done,tx('Von 22 Aufgaben · keine Note','De 22 ejercicios · sin nota')],[UI.first,first,tx('Ohne Hilfe · Text separat prüfen','Sin ayuda · revisar texto aparte')],[UI.open,22-done,tx('Freie Wahl · Zusatz optional','Elección libre · extra opcional')]].map(([label,v,sub])=>`<div class="stat"><span class="big">${v}</span><div class="words"><span>${L(label)}</span><small>${L(sub)}</small><div class="stat-track" aria-hidden="true"><i style="width:${v/22*100}%"></i></div></div></div>`).join('')}
function navigation(){const groupOf=p=>p.task?tasks[p.task-1].group.replace('Zusatz · ',''):'Orientierung';document.querySelector('#nav').innerHTML=chapters.map(ch=>{const indices=pages.map((p,i)=>({p,i})).filter(x=>x.p.ch===ch);const groups=[...new Set(indices.map(({p})=>groupOf(p)))];return `<div class="chapter"><div class="chapter-title">${lang?chapterES[ch]:ch}<span>${indices.length}</span></div>${groups.map(group=>`${group==='Orientierung'?'':`<div class="group-label">${groupLabel(group)}</div>`}<div class="nav-grid ${group==='Berechnen'?'dense':''}">${indices.filter(({p})=>groupOf(p)===group).map(({p,i})=>{const t=p.task?tasks[p.task-1]:null,w=t?work(t.id):null,s=w?(w.solution?'solution':w.hint?'hint':w.reviewed?'reviewed':w.correct?'correct':'open'):'open';const mark=w?(w.solution?'◇':w.hint?'△':w.reviewed?'✓':w.correct?'✓':''):'';return `<button data-page="${i}" aria-label="${esc((t?L(tx('Aufgabe','Ejercicio'))+' '+t.id:L(p.title))+' · '+(t?L(statusText(t)):''))}" ${i===current?'aria-current="page"':''} data-state="${s}">${t?t.id:p.nav}${mark?`<em>${mark}</em>`:''}</button>`}).join('')}</div>`).join('')}</div>`}).join('');document.querySelector('#side-foot').innerHTML=`<p>${L(tx('✓ erledigt · △ Hilfe<br>◇ Lösung · leer: offen','✓ trabajado · △ pista<br>◇ solución · vacío: pendiente'))}</p><p>${L(tx('Kern 1–16 · Extra 17–22<br>Beispiel = Hilfe','Núcleo 1–16 · extra 17–22<br>Ejemplo = ayuda'))}</p>`}
function groupLabel(g){const map={'Zuordnen':'Clasificar','Berechnen':'Calcular','Konfigurieren':'Configurar','Diagnostizieren':'Diagnosticar','Schreiben':'Redactar','Zusatz · Berechnen':'Extra · calcular','Zusatz · Konfigurieren':'Extra · configurar','Zusatz · Zuordnen':'Extra · clasificar','Zusatz · Schreiben':'Extra · redactar','Offizielle Aufgabe':'Tarea oficial'};return lang?(map[g]||g):g}
function header(p){const t=p.task?tasks[p.task-1]:null;let question={Einstieg:tx('Wofür brauchst du diese Grenzen im Beruf?','¿Para qué necesitas estos límites en el trabajo?'),Verstehen:tx('Wie legt IP + Präfix den ganzen Block fest?','¿Cómo fijan IP + prefijo todo el bloque?'),Anwenden:tx('Welche Entscheidung folgt aus dem Block?','¿Qué decisión se deriva del bloque?'),Üben:tx('Kannst du den Mechanismus auf diese Daten anwenden?','¿Puedes aplicar el mecanismo a estos datos?'),Prüfungsaufgabe:tx('Kannst du den Rechenweg auf Deutsch begründen?','¿Puedes justificar el cálculo en alemán?')}[p.ch];return `<div class="page-head"><div class="big">${t?t.id:p.nav}</div><div class="head-text"><div class="chips"><span class="chip ${t?'type-'+t.group.replace('Zusatz · ','').split(' ')[0].toLowerCase():''}">${t?groupLabel(t.group):(lang?chapterES[p.ch]:p.ch)}</span>${t?`<span class="operator">${t.operator} · ${t.pts} ${L(tx(t.official?'Punkte':'Punkte (orientierend)',t.official?'puntos':'puntos orientativos'))}</span>`:''}</div><h1 id="page-title" tabindex="-1">${L(p.title)}</h1><div class="page-question">${L(question)}</div></div></div>`}
const svg=(content,label,w=560,h=300)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(L(label))}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4d6574"/></marker></defs>${content}</svg>`;

function bitsDiagram(m,focus='given',reveal=false,wide=false){const w=wide?1000:560,start=wide?56:24,cell=wide?25:14,gap=wide?16:8,rowY=112;let content=text(start,28,tx(`Gegebene IP: ${m.ip}/${m.p}`,`IP dada: ${m.ip}/${m.p}`),'mono');content+=text(start,54,tx('■ Netzbits: fest','■ Bits de red: fijos'),'signal')+text(wide?640:304,54,tx('□ Hostbits: variabel','□ Bits host: variables'),'variable');for(let i=0;i<32;i++){const x=start+i*cell+Math.floor(i/8)*gap+(i>=m.p?24:0);const shown=reveal?(i<m.p?m.bits[i]:(focus==='broadcast'?'1':'0')):m.bits[i];content+=`<rect x="${x}" y="${rowY}" width="${cell-2}" height="38" rx="2" fill="${i<m.p?'#cfe7e7':'#ffebca'}" stroke="none"/>`+text(x+(cell-2)/2,rowY+25,shown,i<m.p?'signal':(reveal?'variable result-pop':'variable'),'middle');if(i%8===0)content+=text(x,rowY-20,tx(`Oktett ${i/8+1}`,`Octeto ${i/8+1}`),'sub');}const boundary=start+m.p*cell+Math.floor((m.p-1)/8)*gap+11;content+=`<path d="M${boundary} 106V158" stroke="#945810" stroke-width="3" fill="none"/>`;content+=text(start,186,tx(`/${m.p}: ${m.p} feste Bits + ${m.hostbits} variable Bits`,`/${m.p}: ${m.p} bits fijos + ${m.hostbits} variables`));if(reveal){const v=focus==='broadcast'?m.b:m.n,b=intToIp(v);content+=text(start,224,tx(focus==='broadcast'?'Host = nur 1 → Broadcast':'Host = nur 0 → Netz',focus==='broadcast'?'Host = todo 1 → broadcast':'Host = todo 0 → red'),'variable')+text(start,260,b,'mono');}else{const reason=focus==='net'?tx('Netz: Hostbits auf 0 setzen','Red: poner bits host a 0'):focus==='broadcast'?tx('Broadcast: Hostbits auf 1 setzen','Broadcast: poner bits host a 1'):tx('Die Maske bestimmt den Schnitt.','La máscara determina el corte.');content+=text(start,224,reason)+text(start,260,tx('Die gegebene IP bleibt dein Ausgangspunkt.','La IP dada sigue siendo tu punto de partida.'),'sub');}return svg(content,tx('Binärdarstellung mit festen und variablen Bits','Representación binaria con bits fijos y variables'),w,290)}
function blockDiagram(m,reveal=false,kind='range',wide=false){const w=wide?1000:560, left=wide?72:32,total=w-2*left;let c=text(left,32,tx(`${m.ip}/${m.p} · ausgerichteter Block`,`${m.ip}/${m.p} · bloque alineado`),'mono');if(kind==='cells'){for(let i=0;i<m.size;i++){const x=left+i*(total/m.size);c+=`<rect x="${x}" y="82" width="${total/m.size-6}" height="120" fill="${i===m.v-m.n?'#cde9e7':'#e6eef3'}" stroke="none"/>`+text(x+(total/m.size-6)/2,143,reveal?String(Number(m.net.split('.')[3])+i):String(i),i===m.v-m.n?'signal':'','middle');}c+=text(left,232,tx('Positionen im Block: ab 0 gezählt','Posiciones del bloque: contadas desde 0'),'sub');}else{c+=`<rect x="${left}" y="90" width="${total}" height="64" fill="#dcebed" stroke="none"/><rect x="${left}" y="90" width="${Math.max(8,total/m.size)}" height="64" fill="#f5c6cf" stroke="none"/><rect x="${left+total-Math.max(8,total/m.size)}" y="90" width="${Math.max(8,total/m.size)}" height="64" fill="#f5c6cf" stroke="none"/>`;const pin=left+((m.v-m.n+.5)/m.size)*total;c+=`<path d="M${pin} 90V160" fill="none" stroke="#096b70" stroke-width="3"/>`+text(pin,68,m.ip.split('.').slice(m.p<24?2:3).join('.'),'signal','middle');c+=text(left,190,reveal?m.net:tx('Netz: Hostteil = 0','Red: host = 0'),'mono')+text(left+total,222,reveal?m.broadcast:tx('Broadcast: Hostteil = 1','Broadcast: host = 1'),'mono','end');c+=text(left,260,reveal?tx(`${m.size} Adressen · ${m.hosts} konventionelle Hosts`,`${m.size} direcciones · ${m.hosts} hosts convencionales`):tx('Menge ≠ letzter Dezimalwert','Cantidad ≠ último valor decimal'),'sub');}return svg(c,tx('Adressintervall mit IP-Marker und getrennten Endpunkten','Intervalo de direcciones con marcador IP y extremos separados'),w,290)}
function crossDiagram(m,reveal=false,focus='start',wide=false){const w=wide?1000:560,left=wide?72:24,part=(w-2*left-24)/2,n3=Number(m.net.split('.')[2]);let c=text(left,32,tx(`${m.ip}/${m.p}: ein zusammenhängender Block`,`${m.ip}/${m.p}: un bloque continuo`),'mono');c+=`<path d="M${left} 192H${w-left}" class="edge"/>`+text(w/2,226,tx('läuft nach .255 im nächsten Oktett weiter','continúa después de .255 en el octeto siguiente'),'label','middle');for(let i=0;i<2;i++){const x=left+i*(part+24);c+=`<rect x="${x}" y="64" width="${part}" height="112" fill="${i===m.octets[2]-n3?'#d6ecea':'#e7eff4'}" stroke="none"/>`;c+=text(x+part/2,100,reveal?String(n3+i):tx(i?'zweiter Wert':'erster Wert',i?'segundo valor':'primer valor'),'','middle')+text(x+part/2,134,tx('4. Oktett: 0 bis 255','4.º octeto: 0 a 255'),'sub','middle');}if(reveal)c+=text(left,270,focus==='end'?tx(`Broadcast ${m.broadcast} · letzter Host ${m.last}`,`Broadcast ${m.broadcast} · último host ${m.last}`):tx(`Netz ${m.net} · erster Host ${m.first}`,`Red ${m.net} · primer host ${m.first}`),'mono result-pop');else c+=text(left,270,tx('7 Netzbits + 1 Hostbit im dritten Oktett','7 bits de red + 1 bit host en el tercer octeto'),'sub');return svg(c,tx('Zwei vollständige vierte Oktette in einem /23','Dos cuartos octetos completos en un /23'),w,300)}
function gridDiagram(m,reveal=false,wide=false){const w=wide?1000:560,left=wide?64:24,width=w-2*left,cell=width/8;let c=text(left,32,tx(`${m.ip}/${m.p}: 16 Werte im dritten Oktett`,`${m.ip}/${m.p}: 16 valores del tercer octeto`),'mono');const first=Number(m.net.split('.')[2]);for(let i=0;i<16;i++){const x=left+(i%8)*cell,y=64+Math.floor(i/8)*88;const hot=first+i===m.octets[2];c+=`<rect x="${x}" y="${y}" width="${cell-8}" height="72" fill="${hot?'#cfe9e7':'#e1ebf1'}" stroke="none"/>`+text(x+(cell-8)/2,y+30,reveal?String(first+i):String(i),(hot?'signal ':'')+(reveal?'result-pop':''),'middle')+text(x+(cell-8)/2,y+56,'×256','sub','middle');}c+=text(left,272,reveal?tx(`Netz ${m.net} · Broadcast ${m.broadcast}`,`Red ${m.net} · broadcast ${m.broadcast}`):tx('Zu jedem Wert gehören alle 256 Werte des 4. Oktetts.','Cada valor incluye los 256 valores del 4.º octeto.'),'sub');return svg(c,tx('16 Teilstreifen mit je 256 Positionen','16 franjas con 256 posiciones cada una'),w,300)}

function maskDiagram(){return svg(text(24,36,tx('Präfix = zusammenhängende Einsen','Prefijo = unos continuos'))+[27,23,20].map((p,r)=>{let c=text(24,82+r*72,'/'+p,'mono');for(let i=0;i<32;i++)c+=`<rect x="${88+i*13.5}" y="${56+r*72}" width="11" height="32" fill="${i<p?'#096b70':'#f0c993'}" stroke="none"/>`;return c+text(88,104+r*72,tx(`Schnitt nach Bit ${p}`,`Corte después del bit ${p}`),'sub')}).join(''),tx('Maskenstreifen für /27, /23 und /20','Franjas de máscara /27, /23 y /20'),560,292)}

function expected(t,f,m){if(f.kind==='maskp')return model(t.ip,f.prefix).mask;if(f.kind==='cutp')return Math.ceil(f.prefix/8);if(f.kind==='role'){const v=ipToInt(f.candidate);return v===m.n?'net':v===m.b?'broadcast':v>m.n&&v<m.b?'host':'outside'}if(f.kind==='route'||f.kind==='mac'){const v=ipToInt(f.candidate),local=v>=m.n&&v<=m.b;return f.kind==='route'?(local?'local':'gateway'):(local?'target':'router')}if(f.kind==='gateway')return t.gateway;return m[f.key]}
function numberValue(v){const s=String(v).trim().replace(/\s/g,'');if(!/^\d+(?:[.,]\d{3})*$/.test(s))return null;return Number(s.replace(/[.,]/g,''))}
function isFree(t,m,v){return v!==null&&v>m.n&&v<m.b&&![t.gateway,t.printer].map(ipToInt).includes(v)}
function poolValid(t,m,values){const a=ipToInt(values.poolstart||''),b=ipToInt(values.poolend||'');return isFree(t,m,a)&&isFree(t,m,b)&&a<=b&&![t.gateway,t.printer].map(ipToInt).some(v=>v>=a&&v<=b)}
function validate(t,f,value,values){const m=model(t.ip,t.p);if(!String(value??'').trim())return{ok:false,empty:true,msg:UI.empty};let ok=false,msg=UI.wrong;const ex=expected(t,f,m);if(['ip','maskp','gateway'].includes(f.kind)){ok=ipToInt(String(value))===ipToInt(String(ex));msg=f.kind==='gateway'?tx('Lokale Router-IP verwenden.','Usa la IP local del router.'):tx('Hostbits prüfen.','Revisa bits host.')}else if(['num','cutp'].includes(f.kind)){ok=numberValue(value)===Number(ex);msg=f.kind==='cutp'?tx('Oktett prüfen.','Revisa octeto.'):tx('Anzahl prüfen.','Revisa la cantidad.')}else if(f.kind==='client'){ok=isFree(t,m,ipToInt(String(value)));msg=tx('Freien Host im Block wählen.','Elige un host libre del bloque.')}else if(f.kind.startsWith('pool')){const a=ipToInt(values.poolstart||''),b=ipToInt(values.poolend||'');ok=f.kind==='poolcount'?poolValid(t,m,values)&&numberValue(value)===b-a+1:poolValid(t,m,values);msg=tx('Belegung und Anzahl prüfen.','Revisa ocupación y cantidad.')}else if(f.kind==='plausible'){ok=value!=='certain'&&f.options.some(o=>o.id===value);msg=tx('Symptom ist keine Gewissheit.','Un síntoma no da certeza.')}else if(f.kind==='test'){ok=t.diag==='dhcp'?['path','capture','pool'].includes(value):['configured','reference'].includes(value);msg=tx('Eine gezielte Probe wählen.','Elige una prueba precisa.')}else{ok=value===String(ex);msg=tx('Hostteil / Netz prüfen.','Revisa host / red.')}return{ok,msg:ok?UI.ok:msg}}

function simResult(t,s){let cmd,msg;if(t.diag==='dhcp'){if(s==='path'){cmd='Link / Switch-Port';msg=tx('Link aktiv. Clientport: VLAN 20; DHCP-Pool: VLAN 10.','Enlace activo. Puerto cliente: VLAN 20; pool DHCP: VLAN 10.')}if(s==='capture'){cmd='DHCP · Client / Server';msg=tx('Client sendet DISCOVER. Am Server kein DISCOVER sichtbar. Ursache noch am Pfad eingrenzen.','Cliente envía DISCOVER. El servidor no lo ve. Acota la causa en el camino.')}if(s==='pool'){cmd='DHCP-Dienst / Scope';msg=tx('Dienst läuft. Bereich aktiv. 12 freie Leases. Kein DISCOVER des Clients angekommen.','Servicio activo. Ámbito activo. 12 leases libres. No llegó DISCOVER del cliente.')}}else{if(s==='configured'){cmd='nslookup files.mosaik.example 172.24.6.53';msg=tx('Antwort: NXDOMAIN. Dieser Resolver liefert den Namen nicht.','Respuesta: NXDOMAIN. Este resolver no entrega ese nombre.')}if(s==='reference'){cmd='nslookup files.mosaik.example 172.24.6.54';msg=tx('Antwort: 172.24.6.20. Derselbe FQDN wird beim internen DNS aufgelöst.','Respuesta: 172.24.6.20. El mismo FQDN se resuelve en DNS interno.')}if(s==='service'){cmd='Dateidienst · nach korrekter Auflösung';msg=tx('Simuliert: Anmeldung und Testdatei erfolgreich. Erst diese Probe prüft den benötigten Dienst.','Simulado: autenticación y archivo de prueba correctos. Esta prueba verifica el servicio requerido.')}}return `<span>${L(UI.sim)}</span><code>${esc(cmd)}</code><span>${L(msg)}</span>`}
function entryHTML(){return `<div class="workspace learn"><div class="left"><div class="entry-grid"><div class="entry-main"><h2>${L(tx('Ein Block, zwei Grenzen.','Un bloque, dos límites.'))}</h2><p>${L(tx('Ein Präfix begrenzt den gemeinsamen Adressbereich.','Un prefijo limita el rango común de direcciones.'))}</p><figure><div class="stage">${svg(`<rect x="32" y="72" width="488" height="88" fill="#d5e9e8" stroke="none"/><path d="M272 40V176" stroke="#096b70" stroke-width="3"/>${text(272,28,tx('gegebene IP','IP dada'),'signal','middle')}${text(32,206,tx('Blockanfang','Inicio bloque'))}${text(520,206,tx('Blockende','Final bloque'),'','end')}`,tx('Eine IP liegt zwischen Anfang und Ende ihres Blocks','Una IP está entre el inicio y el final de su bloque'),560,232)}</div><figcaption>${L(tx('Die IP ist eine Position; das Netz ist der ganze Bereich.','La IP es una posición; la red es el rango completo.'))}</figcaption></figure><div class="route-card"><div><b>${L(tx('Kern: 60 Minuten','Núcleo: 60 minutos'))}</b><span>${L(tx('Verstehen, rechnen, anwenden.','Comprender, calcular, aplicar.'))}</span></div><div><b>${L(tx('Nachhilfe: bis 90 Minuten','Tutoría: hasta 90 minutos'))}</b><span>${L(tx('Vertiefung und Zusatzpraxis.','Profundización y práctica extra.'))}</span></div></div></div><div class="entry-side"><div><p class="label-de">${L(tx('Im Beruf','En el trabajo'))}</p><h3>${L(tx('Ein neuer Büro-PC','Un nuevo PC de oficina'))}</h3><p>${L(tx('Du wählst eine freie IP und das erreichbare Gateway.','Eliges una IP libre y un gateway alcanzable.'))}</p></div><div><p class="label-de">IHK · SOMMER 2022 · AEN 1aa</p><h3>${L(tx('Fünf Angaben aus IP + /27','Cinco datos de IP + /27'))}</h3><p>${L(tx('Netz-ID, Hosts, Broadcast, Maske.','Red, hosts, broadcast, máscara.'))}</p></div><div><p class="label-de">${L(tx('Danach kannst du','Al terminar puedes'))}</p><p>${L(tx('Blockgrenzen erklären, Client und Pool planen, eine Diagnose begrenzen.','Explicar límites, planificar cliente y pool, acotar un diagnóstico.'))}</p></div><p class="small">${L(tx('08.10.2026 · 10:30–12:00<br>Mit Tutor · ohne Zeitdruck','08.10.2026 · 10:30–12:00<br>Con tutor · sin presión'))}</p></div></div></div></div>`}
const learnCopies={relation:[tx('Der feste Netzteil bezeichnet den Block. Die variablen Bits bezeichnen Positionen darin.','La parte fija identifica el bloque. Los bits variables identifican posiciones.'),tx('Die Maske enthält für feste Bits eine 1, für variable Bits eine 0.','La máscara tiene un 1 para cada bit fijo y un 0 para cada variable.'),tx('IP UND Maske ergibt den Blockanfang. Behalte Netzbits und lösche Hostbits.','IP AND máscara da el inicio. Conserva los bits de red y borra los host.')],bits27:[tx('141 ist die gegebene IP: 100|01101. Drei feste, fünf variable Bits im vierten Oktett.','141 es la IP dada: 100|01101. Tres bits fijos y cinco variables en el cuarto octeto.'),tx('Netz: 100|00000 = 128. Nur die Hostbits ändern sich.','Red: 100|00000 = 128. Solo cambian los bits host.'),tx('Broadcast: 100|11111 = 159. Der feste Teil bleibt 100.','Broadcast: 100|11111 = 159. La parte fija sigue siendo 100.'),tx('32 Positionen von 128 bis 159, davon 30 konventionelle Hosts von 129 bis 158.','32 posiciones de 128 a 159; 30 hosts convencionales de 129 a 158.')],cross23:[tx('192.168.11.73/23: sieben Bits im dritten Oktett sind fest, das letzte und das vierte Oktett variabel.','192.168.11.73/23: siete bits del tercer octeto son fijos; el último bit y el cuarto octeto son variables.'),tx('Hostbits = 0: drittes Oktett 10, viertes 0. Die gegebene 11 ist nicht der Blockanfang.','Host = 0: tercer octeto 10, cuarto 0. El 11 dado no es el inicio del bloque.'),tx('Der Block enthält 10.0–10.255 und 11.0–11.255. Der Punkt unterbricht den Hostteil nicht.','El bloque contiene 10.0–10.255 y 11.0–11.255. El punto no interrumpe la parte host.'),tx('Broadcast .11.255, letzter Host .11.254: insgesamt 512 Adressen, 510 konventionelle Hosts.','Broadcast .11.255, último host .11.254: 512 direcciones y 510 hosts convencionales.')],grid20:[tx('77 liegt zwischen zwei Vielfachen von 16. Im dritten Oktett sind vier Bits variabel.','77 está entre dos múltiplos de 16. Cuatro bits del tercer octeto son variables.'),tx('77 = 0100|1101. Netzbeginn im dritten Oktett: 0100|0000 = 64.','77 = 0100|1101. Inicio de red en el tercer octeto: 0100|0000 = 64.'),tx('Die festen Bits bleiben 0100: drittes Oktett 64–79. Zu jedem Wert gehören 256 Werte des vierten Oktetts.','Los bits fijos siguen siendo 0100: tercer octeto 64–79. Cada valor incluye 256 cuartos octetos.'),tx('16 × 256 = 4096 Adressen. Netz 10.23.64.0; Broadcast 10.23.79.255.','16 × 256 = 4096 direcciones. Red 10.23.64.0; broadcast 10.23.79.255.')],forward:[tx('Der Client vergleicht das Ziel mit seiner eigenen Maske. Dasselbe Netz: direkt zum Ziel.','El cliente compara el destino con su propia máscara. Misma red: directo al destino.'),tx('Anderes Netz: zum lokalen Gateway. Die IP-Zieladresse bleibt die entfernte IP.','Otra red: al gateway local. La IP destino sigue siendo la IP remota.')],dhcp:[tx('DISCOVER: Client 0.0.0.0 sendet an 255.255.255.255 und ff:ff:ff:ff:ff:ff. Kein vorheriges Server-ARP nötig.','DISCOVER: cliente 0.0.0.0 envía a 255.255.255.255 y ff:ff:ff:ff:ff:ff. No requiere ARP previo al servidor.'),tx('OFFER: Ein erreichbarer Server bietet eine Lease mit Konfigurationsdaten an.','OFFER: un servidor alcanzable ofrece un lease con datos de configuración.'),tx('REQUEST: Der Client fordert das ausgewählte Angebot an.','REQUEST: el cliente solicita la oferta elegida.'),tx('ACK: Der Server bestätigt die Lease. Fehlt eine Antwort, ist der Fehler noch nicht eindeutig lokalisiert.','ACK: el servidor confirma el lease. Si falta respuesta, todavía no se ha localizado la causa.') ]};
function relationDiagram(m,step){let c=`<path d="M216 48H344M520 48H760M432 80V136H292V176M432 136H848V164" class="edge"/>`;c+=text(280,22,tx('teilt','divide'),'label','middle')+text(640,22,tx('lässt variieren','permite variar'),'label','middle')+text(292,118,tx('setzt Host = 0','pone host = 0'),'label','middle')+text(656,118,tx('setzt Host = 1','pone host = 1'),'label','middle');c+=`<g class="result-pop">`+box(32,16,184,64,`/${m.p}`,tx('Präfix','Prefijo'),true)+box(344,16,176,64,tx('Netzteil','Parte red'),`${m.p} Bit`)+box(760,16,176,64,tx('Hostteil','Parte host'),`${m.hostbits} Bit`)+`</g><g class="${step===2?'result-pop':''}">`+box(200,176,184,64,tx('Netzadresse','Dirección red'),step===2?m.net:tx('Host = 0','Host = 0'),step===2)+`</g>`+box(760,176,176,64,tx('Broadcast','Broadcast'),tx('Host = 1','Host = 1'));if(step===1)c+=text(32,278,tx(`Maske: ${m.mask}`,`Máscara: ${m.mask}`),'mono result-pop');if(step===2)c+=text(32,278,tx(`${m.ip} UND ${m.mask} = ${m.net}`,`${m.ip} AND ${m.mask} = ${m.net}`),'mono result-pop');return svg(c,tx('Präfix bestimmt Netzteil und Hostteil; Hostwerte legen die Grenzen fest','Prefijo determina red y host; valores host fijan límites'),1000,300)}

function dhcpDiagram(step){let c=box(64,24,176,64,tx('Client','Cliente'))+box(760,24,176,64,tx('DHCP-Server','Servidor DHCP'));const labels=[tx('sucht: DISCOVER · Broadcast','busca: DISCOVER · broadcast'),tx('bietet: OFFER','ofrece: OFFER'),tx('fordert: REQUEST','solicita: REQUEST'),tx('bestätigt: ACK','confirma: ACK')];for(let i=0;i<4;i++){const y=128+i*56,rev=i%2;const opacity=i<=step?1:.22;c+=`<g class="${i===step?'step-active':''}" style="opacity:${opacity}"><path pathLength="1" d="${rev?'M760 '+y+'H240':'M240 '+y+'H760'}" class="edge"/>${i<=step?text(500,y-18,labels[i],'label','middle'):''}</g>`;}return svg(c,tx('DHCP-Nachrichten: DISCOVER, OFFER, REQUEST, ACK, selbst schrittweise','Mensajes DHCP DISCOVER, OFFER, REQUEST, ACK paso a paso'),1000,336)}
function learnHTML(p){const saved=state.learn[p.mode]??={step:0,p:p.p},s=saved.step,m=model(p.ip,p.mode==='relation'?saved.p:p.p),copies=learnCopies[p.mode];let drawing;
if(p.mode==='relation')drawing=relationDiagram(m,s);
if(p.mode==='bits27')drawing=s<3?bitsDiagram(m,s===2?'broadcast':'net',s>0,true):blockDiagram(m,true,'range',true);
if(p.mode==='cross23')drawing=s===0?bitsDiagram(m,'given',false,true):crossDiagram(m,true,s===3?'end':'start',true);
if(p.mode==='grid20')drawing=s<2?bitsDiagram(m,'net',s>0,true):gridDiagram(m,true,true);
if(p.mode==='forward')drawing=networkDiagram({gateway:'192.168.10.129',printer:'192.168.10.150'},m,true,s?'remote':'local');

return `<div class="workspace learn"><div class="left">${p.mode==='relation'?`<div class="control-row"><label for="live-prefix">${L(tx('Präfix verändern · IP bleibt gleich','Cambiar prefijo · misma IP'))}</label><select id="live-prefix">${[24,27,23,20].map(x=>`<option ${saved.p===x?'selected':''}>${x}</option>`).join('')}</select><span class="small">${L(tx('Die Beziehungen passen sich an.','Las relaciones se actualizan.'))}</span></div>`:''}<figure><div class="stage">${drawing}</div><figcaption>${L(tx('Ein Schritt, eine Änderung. Du bestimmst das Tempo.','Un paso, un cambio. Tú decides el ritmo.'))}</figcaption></figure><p class="step-copy" role="status">${L(copies[s])}</p><div class="step-controls"><span class="step-label">${L(tx('Schritt','Paso'))} ${s+1} / ${copies.length}</span><button id="step-prev" ${s===0?'disabled':''}>${L(UI.stepprev)}</button><button id="step-next" data-step="next" ${s===copies.length-1?'disabled':''} class="primary">${L(UI.stepnext)}</button></div></div></div>`}

;save();document.querySelector('#sim-result').innerHTML=simResult(t,s)}}}

function check(t){const w=work(t.id);if(t.written){if(!state.answers[t.id]?.written?.trim()){toast(tx('Schreibe zuerst deine Antwort. Freier Text wird nicht automatisch bewertet.','Escribe primero tu respuesta. El texto libre no se puntúa automáticamente.'));return}showSolution(t);return}const vals=state.answers[t.id]||{};w.results={};let all=true;for(const f of t.fields){const r=validate(t,f,vals[f.key]??'',vals);w.results[f.key]=r;if(!r.ok)all=false}w.attempts++;if(w.attempts===1)w.initialAttemptCorrect=all;w.correct=all;w.first=all&&w.initialAttemptCorrect&&!w.hint&&!w.solution&&!w.equivalent;w.feedback=all?tx('✓ Felder richtig. Begründung mit Tutor prüfen.','✓ Campos correctos. Revisa la justificación.'):tx('Markierte Felder noch prüfen.','Revisa los campos marcados.');save();render();document.querySelector('.answers').classList.add('shake');document.querySelector('#check').focus({preventScroll:true})}
function modal(title,html){document.querySelector('#dialog').classList.remove('source-dialog');document.querySelector('#dialog-title').textContent=L(title);document.querySelector('#dialog-body').innerHTML=html;document.querySelector('#dialog-close').textContent=L(UI.close);document.querySelector('#dialog').showModal();document.querySelector('#dialog-close').focus()}
function solutionValue(t,f){const m=model(t.ip,t.p),v=state.answers[t.id]||{};if(f.kind==='client')return `${intToIp(Math.max(m.n+1,ipToInt(t.printer)+1))} – ${m.last}`;if(f.kind.startsWith('pool')){if(f.kind==='poolstart')return tx('Beispiel: 192.168.10.140','Ejemplo: 192.168.10.140');if(f.kind==='poolend')return tx('Beispiel: 192.168.10.149','Ejemplo: 192.168.10.149');return tx('Beispiel: 10 (149 − 140 + 1)','Ejemplo: 10 (149 − 140 + 1)')}if(f.kind==='plausible')return t.diag==='dhcp'?tx('Pfad, Pool oder Dienst (Hypothesen)','Camino, pool o servicio (hipótesis)'):tx('Resolver, Schreibweise oder Cache','Resolver, escritura o caché');if(f.kind==='test')return t.diag==='dhcp'?tx('Link, Mitschnitt oder Poolstatus','Enlace, captura o estado pool'):tx('Gezielte nslookup-Abfrage','Consulta nslookup precisa');const e=expected(t,f,m);return f.options?f.options.find(o=>o.id===e)?.label:e}
function rubric(t){const m=model(t.ip,t.p);if(t.id===16)return[{points:4,label:tx(`a) Je 1 P: Netz ${m.net}; Broadcast ${m.broadcast}; erster Host ${m.first}; letzter Host ${m.last}.`,`a) 1 p por valor: red ${m.net}; broadcast ${m.broadcast}; primer host ${m.first}; último ${m.last}.`),model:tx(`Der Client liegt im Netz ${m.net}/23. Der Broadcast ist ${m.broadcast}; nutzbar sind ${m.first} bis ${m.last}.`,`El cliente está en ${m.net}/23. Broadcast ${m.broadcast}; hosts ${m.first} a ${m.last}.`)},{points:2,label:tx('b) 1 P: gleicher Block; 1 P: vorhandene, direkt erreichbare Router-Schnittstelle.','b) 1 p: mismo bloque; 1 p: interfaz router existente y directamente alcanzable.'),model:tx('172.22.34.1 liegt im gleichen /23 und ist die lokale Router-IP. Deshalb kann sie als Gateway genutzt werden.','172.22.34.1 está en el mismo /23 y es la IP local del router; puede ser gateway.')},{points:2,label:tx('c) 1 P: Ziel im gleichen Block; 1 P: direkte Übertragung, ARP sucht die Ziel-MAC.','c) 1 p: destino en mismo bloque; 1 p: envío directo, ARP busca MAC destino.'),model:tx('172.22.34.250 liegt im gleichen Netz. Der Client sendet direkt und ermittelt bei Bedarf dessen MAC per ARP.','172.22.34.250 está en la misma red. El cliente envía directamente y obtiene su MAC con ARP si hace falta.')}];return[{points:2,label:tx(`a) Je 1 P: Netz ${m.net}, Broadcast ${m.broadcast}.`,`a) 1 p por valor: red ${m.net}, broadcast ${m.broadcast}.`),model:tx(`Das Netz ist ${m.net}/20; der Broadcast ist ${m.broadcast}.`,`La red es ${m.net}/20; broadcast ${m.broadcast}.`)},{points:2,label:tx('b) Je 1 P: gleicher Block und vorhandener lokaler Router.','b) 1 p por criterio: mismo bloque y router local existente.'),model:tx('10.42.64.1 ist im Clientblock und als lokale Router-Schnittstelle angegeben.','10.42.64.1 pertenece al bloque cliente y está indicada como interfaz local.')},{points:2,label:tx('c) Je 1 P: konkrete DNS-Abfrage mit Resolver; begrenzte Interpretation und Diensttest.','c) 1 p por criterio: consulta DNS con resolver; interpretación acotada y prueba de servicio.'),model:tx('Ich frage den FQDN mit nslookup beim konfigurierten DNS ab und vergleiche mit einem internen Referenzresolver. Ping bestätigt nur ICMP; den Dateidienst prüfe ich gesondert.','Consulto el FQDN con nslookup al DNS configurado y comparo con uno interno. Ping solo confirma ICMP; pruebo el servicio de archivos aparte.')} ]}
function showSolution(t){const w=work(t.id);w.solution=true;w.first=false;exposure(t.ip,t.p,'solution:'+t.id);save();navigation();stats();if(t.written){const r=rubric(t);modal(UI.compare,`<p class="small">${L(UI.manual)} ${L(tx('Punkte werden mit dem Tutor je Kriterium vergeben, hier nicht automatisch summiert.','Los puntos se asignan con el tutor por criterio; aquí no se suman automáticamente.'))}</p><div class="rubric">${r.map((x,i)=>`<label><input type="checkbox" data-rubric="${i}" ${w.rubric?.[i]?'checked':''}><span>${L(x.label)}<br><span class="small">${L(x.model)}</span></span></label>`).join('')}</div><button id="mark-reviewed" class="primary">${L(tx('Mit Tutor besprochen markieren','Marcar revisado con el tutor'))}</button>`);document.querySelectorAll('[data-rubric]').forEach(el=>el.onchange=()=>{w.rubric??={};w.rubric[el.dataset.rubric]=el.checked;save()});document.querySelector('#mark-reviewed').onclick=()=>{if(!state.answers[t.id]?.written?.trim()){toast(tx('Ohne eigene Antwort bleibt die Aufgabe offen.','Sin respuesta propia, queda pendiente.'));return}w.reviewed=true;save();document.querySelector('#dialog').close();render();toast(tx('Als besprochen markiert. Das ist keine automatische Bewertung.','Marcado como revisado. No es una nota automática.'))}}else modal(t.official?tx('Vergleich mit der offiziellen Lösung','Comparación con solución oficial'):UI.solution,`<div class="solution-list">${t.fields.map(f=>`<div class="solution-line"><span>${L(f.label)}</span><strong>${L(solutionValue(t,f))}</strong></div>`).join('')}</div><p>${L(t.why)}</p>${t.official?`<p class="small">Sommer 2022 · AEN · 1aa · ${L(tx('Lösung PDF 2, 1 Punkt je Angabe. Keine offizielle Note.','Solución PDF 2, 1 punto por dato. Sin nota oficial.'))}</p>`:''}`)}
function sourceDialog(tech=false){modal(UI.source,`<button id="source-switch">${L(tech?tx('Buch und IHK','Libro e IHK'):tx('Technische Dokumentation','Documentación técnica'))}</button>${sourcesHTML(tech)}`);document.querySelector('#dialog').classList.add('source-dialog');document.querySelector('#source-switch').onclick=()=>{document.querySelector('#dialog').close();sourceDialog(!tech)}}
function storageDialog(){modal(UI.local,`<p>${L(tx('Standard: Antworten bleiben in dieser Sitzung. Export sichert Antworten, Notizen und Hilfe als JSON-Datei.','Por defecto, las respuestas viven en esta sesión. Exportar guarda respuestas, notas y ayuda en JSON.'))}</p><label class="storage-row"><input id="local-enable" type="checkbox" ${state.local?'checked':''}><span>${L(tx('Zusätzlich in diesem Browser speichern','Guardar también en este navegador'))}</span></label><p class="small">${L(tx('Nur dieser Browser und dieser Dateipfad. Kein Upload. Privater Modus, gelöschte Browserdaten oder Speicherlimits können die Kopie verlieren. Ausschalten löscht nur diese Workshop-Kopie. Export ist die sichere Übergabe.','Solo este navegador y ruta del archivo. Sin uploads. Modo privado, borrado de datos o límites pueden perder la copia. Desactivar elimina solo esta copia del taller. Exportar permite conservarla.'))}</p><p id="storage-result" role="status">${L(storageOK?tx('Speicherzugriff bisher ohne Fehler.','Acceso al almacenamiento sin error hasta ahora.'):tx('Kein sicherer Speicherzugriff: Export verwenden.','No hay acceso fiable al almacenamiento: exporta.'))}</p>`);document.querySelector('#local-enable').onchange=e=>{state.local=e.target.checked;if(state.local)save();else try{localStorage.removeItem(key)}catch(x){storageOK=false}document.querySelector('#storage-result').textContent=L(state.local&&storageOK?tx('Browserkopie gespeichert. Export zusätzlich empfohlen.','Copia local guardada. Exporta también.'):UI.notsaved);document.querySelector('#storage').textContent=L(state.local&&storageOK?UI.saved:UI.local)}}
function exportData(){const data={format:'fisi-ipv4-nachhilfe',version:1,session:'2026-10-08 10:30–12:00',exportedAt:new Date().toISOString(),language:lang?'es':'de',storage:{local:state.local,working:storageOK},warning:L(tx('Keine IHK-Note. Freitext wird manuell geprüft. Hilfen sind keine Unabhängigkeit.','Sin nota IHK. Texto libre revisado manualmente. La ayuda no implica independencia.')),tasks:tasks.map(t=>({id:t.id,title:L(t.title),official:!!t.official,extra:!!t.extra,data:{ip:t.ip,prefix:t.p},answers:state.answers[t.id]||{},note:state.notes[t.id]||'',...work(t.id)})),examples:state.learn,exposures:state.seen,closing:state.closing};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='IPv4-Nachhilfe-2026-10-08.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(tx('Export angefordert. Speichere die JSON-Datei im Download-Dialog.','Exportación solicitada. Guarda el JSON en la descarga.'))}
document.querySelector('#prev').onclick=()=>goto(current-1);document.querySelector('#next').onclick=()=>goto(current+1);document.querySelector('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)goto(Number(b.dataset.page))};document.querySelector('#de').onclick=()=>{lang=0;if(document.querySelector('#dialog').open)document.querySelector('#dialog').close();render()};document.querySelector('#es').onclick=()=>{lang=1;if(document.querySelector('#dialog').open)document.querySelector('#dialog').close();render()};document.querySelector('#export').onclick=exportData;document.querySelector('#sources-open').onclick=()=>sourceDialog(false);document.querySelector('#storage').onclick=storageDialog;document.querySelector('#dialog-close').onclick=()=>{document.querySelector('#dialog').close();render()};document.querySelector('#dialog').addEventListener('cancel',()=>setTimeout(()=>render(),0));document.addEventListener('keydown',e=>{if(document.querySelector('#dialog').open||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();goto(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();goto(current-1)}});
window.workshop={tasks,pages,model,validate,expected,getState:()=>state,goto,setLanguage:v=>{lang=v;render()}};
render();
