<script id="lesson-data" type="application/json">[
  {
    "short": {
      "es": "IPv4",
      "de": "IPv4"
    },
    "title": {
      "es": "Una dirección identifica una interfaz",
      "de": "Eine Adresse kennzeichnet eine Schnittstelle"
    },
    "body": {
      "es": "Un cliente necesita una dirección para enviar y recibir paquetes: la IPv4 identifica su conexión a la red, llamada interfaz. Por ejemplo, un PC y una impresora tienen direcciones distintas. Si dos equipos usan la misma dirección en la misma red, aparece un conflicto.\nIPv4 significa «Internet Protocol, versión 4». Una dirección contiene 32 bits, escritos como cuatro números separados por puntos. Cada grupo de ocho bits es un octeto y admite valores de 0 a 255. Los puntos ayudan a leer; no indican por sí solos dónde termina la parte de red.\nLa dirección 192.168.10.141 por sí sola no dice qué vecinos considera locales el PC. Necesitamos además la máscara o el prefijo. Esa frontera es la clave del taller: determina el bloque al que pertenece el cliente. Las direcciones privadas de nuestros ejemplos son datos de laboratorio ficticios; no modificamos una red real.\nPara activar lo estudiado: explica qué diferencia hay entre la dirección del PC y el nombre de toda su red. Si aún no puedes, las páginas siguientes reconstruyen esa relación.",
      "de": "Ein Client benötigt eine Adresse, um Pakete zu senden und zu empfangen. Die IPv4-Adresse kennzeichnet seinen Netzwerkanschluss, die Schnittstelle. Ein PC und ein Drucker verwenden beispielsweise unterschiedliche Adressen. Zwei Geräte mit derselben Adresse im selben Netz verursachen einen Adresskonflikt.\nIPv4 steht für „Internet Protocol, Version 4“. Eine Adresse enthält 32 Bits. Zur besseren Lesbarkeit schreiben wir vier Zahlen mit Punkten dazwischen. Jede Gruppe aus acht Bits heißt Oktett und hat Werte von 0 bis 255. Die Punkte zeigen nicht automatisch die Grenze zwischen Netz und Host.\nDie Adresse 192.168.10.141 allein sagt noch nicht, welche Nachbarn der PC als lokal betrachtet. Dafür benötigen wir die Maske oder das Präfix. Diese Grenze bestimmt seinen Adressblock. Alle privaten Adressen hier sind fiktive Labordaten; wir ändern kein echtes Netzwerk.\nAktiviere dein Vorwissen: Was unterscheidet die Adresse eines PCs von der Bezeichnung seines gesamten Netzes? Wenn das noch unklar ist, bauen die nächsten Seiten diese Beziehung auf."
    },
    "fig": "intro",
    "check": {
      "es": "¿Los puntos definen la frontera de red? Explica qué dato falta.",
      "de": "Bestimmen die Punkte die Netzgrenze? Erkläre, welche Angabe fehlt."
    },
    "ip": "192.168.10.141/27"
  },
  {
    "short": {
      "es": "Bits y octetos",
      "de": "Bits / Oktette"
    },
    "title": {
      "es": "Los bits permiten contar todas las posiciones",
      "de": "Bits machen alle Positionen zählbar"
    },
    "body": {
      "es": "Un bit solo puede valer 0 o 1. Dos bits permiten cuatro combinaciones: 00, 01, 10 y 11. Al añadir otro bit, cada combinación puede terminar en 0 o en 1: la cantidad se duplica. Cinco bits permiten 32 combinaciones.\nPara convertir un octeto a decimal, cada posición tiene un peso: de izquierda a derecha, 128, 64, 32, 16, 8, 4, 2 y 1. Sumamos solo los pesos cuyas casillas tienen un 1. Así, 10001101 equivale a 128 + 8 + 4 + 1 = 141. No necesitas convertir los cuatro octetos a mano cada vez; primero entenderemos el octeto donde cambia la máscara.\nHay una diferencia crucial entre cantidad y último valor. Cinco bits recorren los valores 0 a 31: son 32 posiciones porque también contamos el cero. Si esas posiciones empiezan en 128, terminan en 159. La cantidad sigue siendo 32; ni 31 ni 159 son la cantidad.",
      "de": "Ein Bit kann nur 0 oder 1 sein. Zwei Bits erlauben vier Kombinationen: 00, 01, 10 und 11. Ein weiteres Bit kann jede Kombination um 0 oder 1 ergänzen: Die Anzahl verdoppelt sich. Fünf Bits ergeben 32 Kombinationen.\nFür die Umrechnung eines Oktetts hat jede Stelle einen Wert: von links nach rechts 128, 64, 32, 16, 8, 4, 2 und 1. Wir addieren nur die Werte der Stellen mit einer 1. Deshalb ist 10001101 gleich 128 + 8 + 4 + 1 = 141. Du musst später nicht immer alle vier Oktette umrechnen. Entscheidend ist zunächst das Oktett, in dem die Maske wechselt.\nUnterscheide Anzahl und letzten Wert: Fünf Bits durchlaufen 0 bis 31. Das sind 32 Positionen, weil die Null mitzählt. Beginnen diese Positionen bei 128, enden sie bei 159. Die Anzahl bleibt 32; weder 31 noch 159 ist die Anzahl."
    },
    "fig": "weights",
    "check": {
      "es": "Cuenta 0, 1, 2 y 3: ¿por qué son cuatro valores y no tres?",
      "de": "Zähle 0, 1, 2 und 3: Warum sind es vier Werte und nicht drei?"
    },
    "ip": "192.168.10.141/27"
  },
  {
    "short": {
      "es": "Máscara",
      "de": "Netzmaske"
    },
    "title": {
      "es": "El prefijo fija la frontera entre red y host",
      "de": "Das Präfix setzt die Grenze zwischen Netz und Host"
    },
    "body": {
      "es": "Subnetting significa dividir un espacio de direcciones en subredes más pequeñas, por ejemplo para separar departamentos y reducir el alcance de los broadcasts. Cada subred tiene su propio bloque; un router conecta subredes distintas. La máscara fija el tamaño de esos bloques.\nLa máscara tiene también 32 bits. Un 1 indica una posición de red: debe conservarse dentro del mismo bloque. Un 0 indica una posición de host: puede variar entre las direcciones del bloque. Los unos son consecutivos desde la izquierda.\nEl prefijo es otra escritura de la misma máscara. /24 significa 24 posiciones de red: tres octetos completos. Quedan ocho posiciones de host. Su máscara es 255.255.255.0, porque ocho unos valen 255 y ocho ceros valen 0.\nEn /27, los primeros 24 bits siguen siendo de red y se añaden tres bits del cuarto octeto. Ese octeto de máscara es 11100000: 128 + 64 + 32 = 224. La máscara completa es 255.255.255.224. No restamos «bits» a una IP: contamos qué posiciones conserva la máscara.\nEn /23, el corte cae en el tercer octeto: 16 bits completos y siete más; 11111110 vale 254. En /20 son 16 completos y cuatro más; 11110000 vale 240. El cuarto octeto es de host en ambos casos.",
      "de": "Subnetting teilt einen Adressraum in kleinere Subnetze, etwa für Abteilungen und kleinere Broadcast-Bereiche. Jedes Subnetz hat einen eigenen Block; ein Router verbindet verschiedene Subnetze. Die Maske bestimmt die Blockgröße.\nDie Maske enthält ebenfalls 32 Bits. Eine 1 kennzeichnet eine Netzstelle: Ihr Wert bleibt innerhalb desselben Blocks erhalten. Eine 0 kennzeichnet eine Hoststelle: Ihr Wert darf innerhalb des Blocks wechseln. Die Einsen stehen lückenlos von links nach rechts.\nDas Präfix beschreibt dieselbe Maske anders. /24 bedeutet 24 Netzstellen, also drei vollständige Oktette. Acht Hoststellen bleiben übrig. Die Maske lautet 255.255.255.0: Acht Einsen ergeben 255, acht Nullen ergeben 0.\nBei /27 bleiben die ersten 24 Bits Netzbits. Drei weitere Stellen im vierten Oktett kommen hinzu. Das Maskenoktett 11100000 ergibt 128 + 64 + 32 = 224. Die vollständige Maske ist 255.255.255.224. Wir ziehen keine „Bits“ von einer IP-Adresse ab; wir bestimmen die Stellen, die die Maske erhält.\nBei /23 liegt die Grenze im dritten Oktett: 16 vollständige Netzbits und sieben weitere; 11111110 ergibt 254. Bei /20 sind es 16 vollständige und vier weitere; 11110000 ergibt 240. Das vierte Oktett gehört in beiden Fällen ganz zum Hostanteil."
    },
    "fig": "mask",
    "check": {
      "es": "¿Cuántas posiciones pueden variar en /27? Señala el corte.",
      "de": "Wie viele Stellen können bei /27 wechseln? Zeige die Grenze."
    },
    "ip": "192.168.10.141/27"
  },
  {
    "short": {
      "es": "Bloque /27",
      "de": "Block /27"
    },
    "title": {
      "es": "La IP cae dentro de un bloque alineado",
      "de": "Die IP liegt in einem ausgerichteten Block"
    },
    "body": {
      "es": "Para 192.168.10.141/27, las tres primeras cifras no cambian. En el cuarto octeto, 141 es 10001101. Los primeros tres bits, 100, son de red y valen 128. Los cinco restantes, 01101, son de host y valen 13. El PC está trece posiciones después del comienzo: 128 + 13 = 141.\nManteniendo 100 fijo, los cinco bits de host recorren desde 00000 hasta 11111. Son 32 posiciones. Por eso este bloque va de .128 a .159. Los bloques de /27 empiezan en múltiplos de 32: 0, 32, 64, 96, 128, 160, 192 y 224. .141 está entre 128 y 159; no puede ser el comienzo.\nEl comienzo está alineado porque allí los cinco bits variables están en cero. No elegimos cualquier grupo de 32 números alrededor del PC. Después de entenderlo, el atajo es buscar el múltiplo de 32 inmediatamente inferior o igual a 141.\nUsa el visualizador: cambia el cuarto octeto a 159 y después a 160. El prefijo no cambia, pero 160 ya tiene otros bits de red y pertenece al bloque siguiente.",
      "de": "Bei 192.168.10.141/27 bleiben die ersten drei Zahlen unverändert. Im vierten Oktett ist 141 binär 10001101. Die ersten drei Bits, 100, gehören zum Netz und ergeben 128. Die fünf übrigen Bits, 01101, gehören zum Host und ergeben 13. Der PC liegt dreizehn Positionen nach dem Anfang: 128 + 13 = 141.\nBei festem Netzanteil 100 reichen die Hostbits von 00000 bis 11111. Das sind 32 Positionen. Der Block reicht deshalb von .128 bis .159. /27-Blöcke beginnen bei Vielfachen von 32: 0, 32, 64, 96, 128, 160, 192 und 224. .141 liegt zwischen 128 und 159 und ist nicht der Anfang.\nDer Anfang ist ausgerichtet, weil dort alle fünf variablen Bits null sind. Wir wählen keinen beliebigen Abschnitt aus 32 Zahlen um den PC. Erst nach dieser Erklärung hilft der Kurzweg: Suche das größte Vielfache von 32, das nicht größer als 141 ist.\nÄndere im Visualisierer das vierte Oktett auf 159 und danach auf 160. Das Präfix bleibt gleich, aber 160 besitzt einen anderen Netzanteil und gehört zum nächsten Block."

    "body": {
      "es": "La dirección de red nombra todo el bloque. La obtenemos conservando los bits de red y poniendo todos los bits de host en cero. Para nuestro /27: 100|00000 da .128. La IP dada era .141; la dirección de red es 192.168.10.128.\nEl broadcast dirigido al subnet usa los mismos bits de red y todos los bits de host en uno. 100|11111 da .159. Su dirección completa es 192.168.10.159. En una LAN convencional no asignamos estos dos extremos a PCs: uno identifica la red y el otro se usa para enviar a todos sus participantes. Un router normalmente no reenvía estos broadcasts entre redes.\nPuedes comprobar la red con AND, la operación lógica «Y»: una posición da 1 solamente si tanto la IP como la máscara tienen 1. Con máscara 1 se conserva el bit de la IP; con máscara 0 el resultado es 0. Por eso AND es otra manera de poner a cero los bits de host.\nNo busques siempre .0 y .255. Aquí la red acaba en .128 y el broadcast en .159. Lo decisivo es el conjunto de bits de host, no el último número por sí solo.",
      "de": "Die Netzadresse bezeichnet den gesamten Block. Wir erhalten die Netzbits und setzen alle Hostbits auf null. Bei unserem /27 ergibt 100|00000 die .128. Die vorgegebene IP war .141; die Netzadresse ist 192.168.10.128.\nDer gerichtete Subnetz-Broadcast verwendet dieselben Netzbits und lauter Einsen im Hostanteil. 100|11111 ergibt .159, also 192.168.10.159. In einer gewöhnlichen LAN-Konfiguration vergeben wir diese beiden Grenzen nicht an PCs. Eine Adresse bezeichnet das Netz, die andere dient einer Sendung an alle Teilnehmer. Ein Router leitet solche Broadcasts normalerweise nicht zwischen Netzen weiter.\nDie Netzadresse lässt sich auch mit AND, dem logischen „UND“, ermitteln: Ein Ergebnisbit ist nur dann 1, wenn IP und Maske dort beide 1 haben. Bei einem Maskenbit 1 bleibt das IP-Bit erhalten; bei einem Maskenbit 0 entsteht 0. AND setzt somit die Hostbits auf null.\nSuche nicht pauschal nach .0 und .255. Hier endet die Netzadresse auf .128 und der Broadcast auf .159. Entscheidend sind alle Hostbits, nicht die letzte Dezimalzahl allein."

    "body": {
      "es": "Nuestro bloque incluye .128, .129 y todas las siguientes hasta .159. Al contar extremos incluidos: 159 − 128 + 1 = 32 direcciones. El +1 cuenta la primera posición. El último valor es 159; la cantidad es 32.\nEn esta LAN reservamos la primera para la red y la última para broadcast. Las direcciones de host utilizables van de 192.168.10.129 a 192.168.10.158: 30 direcciones. «Utilizable» no significa «libre»: el gateway y una impresora pueden ocupar algunas de ellas.\nAhora definimos el atajo general. Llamamos h a la cantidad de bits de host. Cada bit duplica las combinaciones; la potencia 2^h expresa esas duplicaciones. Para /27, h = 32 − 27 = 5, así que 2^5 = 32 direcciones. En una LAN convencional, hosts = 32 − 2 = 30. Para /28 quedan cuatro bits: 16 direcciones y 14 hosts, no 30.\nLa resta de dos no es universal. En un enlace punto a punto explícito con /31 y soporte RFC 3021, las dos direcciones sirven a sus dos extremos. Aquí todos los ejercicios de LAN usan /20 a /29; la excepción no cambia sus cálculos.",
      "de": "Unser Block umfasst .128, .129 und alle folgenden Werte bis .159. Mit beiden Grenzen gezählt ergibt das 159 − 128 + 1 = 32 Adressen. Das +1 zählt die erste Position mit. Der letzte Wert ist 159; die Anzahl ist 32.\nIn dieser LAN-Konfiguration reservieren wir die erste Adresse für das Netz und die letzte für Broadcast. Nutzbare Hostadressen reichen von 192.168.10.129 bis 192.168.10.158: 30 Adressen. „Nutzbar“ bedeutet nicht „frei“; Gateway und Drucker können bereits Adressen belegen.\nJetzt folgt der allgemeine Kurzweg. h bezeichnet die Anzahl der Hostbits. Jedes Bit verdoppelt die Kombinationen; die Potenz 2^h beschreibt diese Verdopplungen. Bei /27 ist h = 32 − 27 = 5; deshalb gibt es 2^5 = 32 Adressen. Im gewöhnlichen LAN bleiben 32 − 2 = 30 Hosts. /28 hat vier Hostbits: 16 Adressen und 14 Hosts, nicht 30.\n„Minus zwei“ gilt nicht immer. Auf einer ausdrücklich als Punkt-zu-Punkt-Verbindung eingerichteten /31-Strecke mit RFC-3021-Unterstützung dienen beide Adressen den Endpunkten. Unsere LAN-Aufgaben verwenden /20 bis /29; dort gelten die üblichen Grenzen."

    "body": {
      "es": "En 192.168.11.73/23, los primeros 16 bits son los dos primeros octetos. Después hay siete bits de red en el tercero: quedan un bit de host allí y los ocho del cuarto. En total son nueve bits de host, no ocho.\nEl tercer octeto 11 es 00001011. Sus siete bits de red son 0000101; su último bit puede ser 0 o 1. Eso da 10 u 11. Para cada uno, el cuarto octeto puede ir de 0 a 255. Visualiza dos filas completas: 192.168.10.0–192.168.10.255 y 192.168.11.0–192.168.11.255. Juntas forman un único /23.\nLa red pone todos los nueve bits de host en cero: 192.168.10.0. El broadcast los pone en uno: 192.168.11.255. Los hosts convencionales van de 192.168.10.1 a 192.168.11.254. Hay 2 × 256 = 512 direcciones y 510 hosts.\n192.168.10.255 y 192.168.11.0 están en medio del bloque y son hosts utilizables. Al subir una posición desde .10.255, el cuarto octeto vuelve a 0 y el tercero sube a 11. No cambió la red: solo llevamos la cuenta al octeto siguiente.",
      "de": "Bei 192.168.11.73/23 bilden die ersten beiden Oktette 16 Netzbits. Im dritten Oktett folgen sieben Netzbits. Dort bleibt ein Hostbit, im vierten Oktett bleiben acht. Insgesamt sind es neun Hostbits, nicht acht.\nDas dritte Oktett 11 ist binär 00001011. Seine sieben Netzbits lauten 0000101; das letzte Bit darf 0 oder 1 sein. Dadurch entstehen die Werte 10 und 11. Für jeden davon reicht das vierte Oktett von 0 bis 255. Stelle dir zwei vollständige Zeilen vor: 192.168.10.0–192.168.10.255 und 192.168.11.0–192.168.11.255. Zusammen bilden sie ein /23-Netz.\nAlle neun Hostbits auf null ergeben die Netzadresse 192.168.10.0. Alle auf eins ergeben den Broadcast 192.168.11.255. Der gewöhnliche Hostbereich reicht von 192.168.10.1 bis 192.168.11.254. Es gibt 2 × 256 = 512 Adressen und 510 Hosts.\n192.168.10.255 und 192.168.11.0 liegen mitten im Block und sind nutzbare Hostadressen. Nach .10.255 beginnt die nächste Position mit .11.0. Der Netzanteil bleibt gleich; nur der Zähler läuft im nächsten Oktett weiter."

    "body": {
      "es": "En 10.23.77.69/20, los primeros 16 bits son fijos y los primeros cuatro del tercer octeto también. 77 es 01001101: el prefijo conserva 0100 y permite variar 1101. Esos cuatro bits variables dan 16 valores del tercer octeto.\nEl tercer octeto de red es 01000000, que vale 64. El mayor es 01001111, que vale 79. El cuarto octeto puede recorrer 0–255 para cada uno de esos 16 valores. Por eso el bloque empieza en 10.23.64.0 y termina en 10.23.79.255. La IP 10.23.77.69 es una posición dentro de ese rectángulo de direcciones, no un extremo.\nCada fila tiene 256 posiciones. Dieciséis filas tienen 16 × 256 = 4096 direcciones. También quedan doce bits de host: cuatro en el tercero y ocho en el cuarto. 2^12 da la misma cantidad. Los hosts convencionales son 4094 y van de 10.23.64.1 a 10.23.79.254.\nDespués de esta derivación, el atajo de la máscara funciona: 256 − 240 = 16 valores en el octeto del corte. Busca el múltiplo de 16 inferior o igual a 77: 64. Ese 16 cuenta filas, no todas las IPs; falta multiplicar por 256.",
      "de": "Bei 10.23.77.69/20 bleiben 16 Bits und die ersten vier Bits des dritten Oktetts fest. 77 lautet binär 01001101: Das Präfix erhält 0100, während 1101 variabel ist. Vier variable Bits erlauben 16 Werte des dritten Oktetts.\nDas kleinste dritte Oktett ist 01000000 = 64, das größte 01001111 = 79. Für jeden dieser 16 Werte darf das vierte Oktett von 0 bis 255 laufen. Der Block beginnt deshalb bei 10.23.64.0 und endet bei 10.23.79.255. 10.23.77.69 liegt innerhalb dieses Adressrechtecks und ist keine Grenze.\nJede Zeile enthält 256 Positionen. Sechzehn Zeilen ergeben 16 × 256 = 4096 Adressen. Auch die Hostbits führen dorthin: vier im dritten und acht im vierten Oktett, zusammen zwölf. 2^12 ergibt dieselbe Anzahl. Es bleiben 4094 gewöhnliche Hostadressen von 10.23.64.1 bis 10.23.79.254.\nErst jetzt verwenden wir den Masken-Kurzweg: 256 − 240 = 16 Werte im Grenzoktett. Das größte Vielfache von 16, das nicht größer als 77 ist, lautet 64. Die 16 zählt Zeilen, nicht alle IP-Adressen; der Faktor 256 kommt noch hinzu."

    "body": {
      "es": "Ya sabemos qué direcciones pertenecen al bloque. Ahora configuramos un PC de la LAN 192.168.10.128/27. La interfaz del único router local usa .129 y la impresora usa .130. Todos tienen máscara 255.255.255.224. Una IP nueva de cliente debe estar entre .131 y .158 y seguir libre; cualquiera de esas opciones sirve en este modelo.\nEl gateway es la dirección de la interfaz del router que el PC puede alcanzar localmente. El router tiene otra interfaz hacia otra red. No hay una regla que obligue al gateway a terminar en .1. Aquí la dirección correcta es .129 porque es la interfaz real del router, no porque sea siempre el primer host.\nUn cliente .141/27 con gateway .1 está mal configurado en nuestro modelo de un router y sin rutas adicionales: .1 cae fuera de su bloque .128–.159. Corregimos el gateway a .129. No basta con inventar cualquier IP libre dentro del rango: debe corresponder al router.\nLa configuración también incluye DNS, el servidor que consultamos para resolver nombres. Su función es distinta del gateway; pueden compartir dispositivo, pero una dirección no implica automáticamente la otra.",
      "de": "Jetzt wenden wir die Blockgrenzen auf einen PC im LAN 192.168.10.128/27 an. Die Schnittstelle des einzigen lokalen Routers verwendet .129, der Drucker .130. Alle haben die Maske 255.255.255.224. Ein neuer Client benötigt eine noch freie Adresse von .131 bis .158. Jede davon ist in diesem Modell möglich.\nDas Gateway ist die Adresse der Router-Schnittstelle, die der PC lokal erreichen kann. Der Router besitzt eine weitere Schnittstelle zu einem anderen Netz. Ein Gateway muss nicht auf .1 enden. Hier ist .129 richtig, weil dort der tatsächliche Router angeschlossen ist; nicht, weil stets die erste Hostadresse vorgeschrieben wäre.\nBei Client .141/27 ist Gateway .1 im Modell mit einem Router und ohne Zusatzrouten falsch: .1 liegt außerhalb des Blocks .128–.159. Wir korrigieren auf .129. Eine beliebige freie Adresse im Bereich genügt nicht; sie muss zur echten Router-Schnittstelle gehören.\nZur Konfiguration gehört außerdem DNS, der Server für die Namensauflösung. DNS und Gateway erfüllen unterschiedliche Aufgaben. Beide Dienste können auf einem Gerät laufen, aber die eine Adresse legt die andere nicht automatisch fest."
    },

    "short": {
      "es": "Local / ARP",
      "de": "Lokal / ARP"

    "title": {
      "es": "La IP destino se conserva; la MAC depende del salto",
      "de": "Die Ziel-IP bleibt; die Ziel-MAC gehört zum nächsten Schritt"
    },
    "body": {
      "es": "El cliente .141/27 compara la red calculada del destino con su propia red usando su máscara. Para destino .150/27, ambos bloques son .128–.159: la entrega es local. Para .170/27, el bloque destino es .160–.191: el cliente envía al gateway .129. Suponemos una sola ruta por defecto y ningún caso especial de proxy ARP.\nEn Ethernet, el frame necesita una dirección MAC: la dirección de la interfaz que recibirá el siguiente paso local. ARP (Address Resolution Protocol) averigua qué MAC corresponde a una IPv4 local. Si falta en la caché, pregunta mediante broadcast Ethernet; el propietario responde con su MAC.\nPara llegar a .150, el cliente pregunta por la MAC de .150. Para llegar a .170, pregunta por la MAC de .129, el router. El paquete IP sigue teniendo destino .170: enviar un frame al router no convierte al router en el destino final. Sin NAT en este ejemplo, al reenviar cambia el frame del siguiente tramo, no esa IP destino.\nObtener una respuesta ARP solo demuestra una asociación IP/MAC local en ese momento. No demuestra que el router llegue al destino, que haya ruta de retorno, ni que el servicio responda. Un ping positivo prueba respuesta ICMP, no todos los servicios.",
      "de": "Client .141/27 berechnet mit seiner Maske die Netzadresse des Ziels und vergleicht sie mit der eigenen. Ziel .150/27 liegt ebenfalls im Block .128–.159: Die Zustellung ist lokal. Ziel .170/27 liegt im Block .160–.191: Der Client sendet zum Gateway .129. Wir nehmen nur eine Standardroute und kein Proxy-ARP-Sonderverhalten an.\nEin Ethernet-Frame benötigt die MAC-Adresse der Schnittstelle, die den nächsten lokalen Schritt empfängt. ARP (Address Resolution Protocol) ermittelt die MAC zu einer lokalen IPv4-Adresse. Fehlt der Eintrag im Cache, fragt der Client per Ethernet-Broadcast. Der Besitzer antwortet mit seiner MAC.\nFür .150 fragt der Client nach der MAC von .150. Für .170 fragt er nach der MAC von .129, dem Router. Das IP-Paket behält .170 als Ziel: Der Empfänger des lokalen Frames ist nicht automatisch das endgültige IP-Ziel. Ohne NAT bleibt diese Ziel-IP beim Weiterleiten erhalten; auf dem nächsten Abschnitt entsteht ein neuer Frame.\nEine ARP-Antwort belegt nur eine lokale IP/MAC-Zuordnung zu diesem Zeitpunkt. Sie belegt weder den Weg zum entfernten Ziel noch eine Rückroute oder einen funktionierenden Dienst. Ein erfolgreicher Ping prüft ICMP-Antworten, nicht alle Dienste."
    },

      "es": "DHCP / pool",
      "de": "DHCP / Pool"
    },
    "title": {
      "es": "DHCP reparte configuración, no cualquier dirección",
      "de": "DHCP verteilt passende Konfiguration aus einem Pool"
    },
    "body": {
      "es": "DHCP significa Dynamic Host Configuration Protocol. Entrega automáticamente IP, máscara, gateway y DNS. La concesión se llama lease y dura un tiempo limitado. Así evitamos configurar cada cliente a mano.\nEn una primera adquisición típica, el cliente envía DHCPDISCOVER para buscar servidores; uno responde DHCPOFFER con una propuesta; el cliente solicita la oferta mediante DHCPREQUEST; el servidor confirma con DHCPACK. Se suele recordar como DORA. El DISCOVER inicial puede salir de 0.0.0.0 hacia 255.255.255.255, con broadcast Ethernet. No necesita resolver antes por ARP la dirección del servidor DHCP.\nEl pool es el rango que el servidor puede ofrecer. En nuestra LAN /27, .129 pertenece al gateway y .130 a la impresora; quedan .131–.158 para un pool máximo. También sirven rangos menores, por ejemplo .140–.149 si bastan para la necesidad. Un pool continuo no puede cruzar una dirección reservada sin una exclusión explícita.\nSu tamaño incluye ambos extremos: para .140–.149, 149 − 140 + 1 = 10 direcciones. No confundas el tamaño del pool con todos los hosts del subnet. Los broadcasts DHCP no atraviesan routers normalmente; si el servidor está en otra red, un relay puede llevarle las solicitudes.",
      "de": "DHCP steht für Dynamic Host Configuration Protocol. Es liefert automatisch IP-Adresse, Maske, Gateway und DNS. Die zeitlich begrenzte Zuweisung heißt Lease. Dadurch entfällt die manuelle Einrichtung jedes Clients.\nBei einer typischen ersten Zuweisung sucht der Client mit DHCPDISCOVER nach Servern. Ein Server schlägt mit DHCPOFFER eine Konfiguration vor. Der Client fordert sie mit DHCPREQUEST an; DHCPACK bestätigt sie. Die Reihenfolge wird als DORA bezeichnet. Der erste DISCOVER kann von 0.0.0.0 an 255.255.255.255 als Ethernet-Broadcast gesendet werden. Dafür muss der Client die DHCP-Server-Adresse nicht vorher per ARP auflösen.\nDer Pool ist der Bereich, aus dem der Server Adressen anbieten darf. Im /27-LAN sind .129 für das Gateway und .130 für den Drucker belegt. Der größtmögliche Pool ist .131–.158. Kleinere Bereiche sind ebenfalls gültig, etwa .140–.149 bei ausreichendem Bedarf. Ein zusammenhängender Pool darf ohne ausdrückliche Ausschlüsse keine reservierte Adresse enthalten.\nDie Größe zählt beide Grenzen: Für .140–.149 sind es 149 − 140 + 1 = 10 Adressen. Das ist nicht die Zahl aller Subnetz-Hosts. DHCP-Broadcasts überschreiten Router normalerweise nicht. Ein Relay kann Anfragen zu einem Server in einem anderen Netz weiterreichen."
    },

    },

  {
    "short": {
      "es": "Síntoma DHCP",
      "de": "DHCP-Symptom"
    },
    "title": {
      "es": "169.254 es una pista, no una causa demostrada",
      "de": "169.254 ist ein Hinweis, kein Beweis für eine Ursache"
    },
    "body": {
      "es": "Una dirección 169.254.x.x con máscara /16 pertenece al ámbito link-local IPv4. En un cliente Windows configurado para DHCP, verla sugiere que no obtuvo una concesión utilizable y se autoconfiguró (APIPA). Sirve solo en el enlace local; no es una configuración corporativa completa. Por sí sola no demuestra que el servidor esté apagado.\nLas causas posibles incluyen enlace o VLAN incorrectos, servidor o camino no disponibles, pool agotado y conflictos. Primero verifica la configuración y el enlace; después observa una renovación DHCP. Una captura con DISCOVER sin OFFER significa que no llegó una oferta, pero todavía puede fallar el camino de ida, el de vuelta o el servidor.\nLos resultados siguientes son simulados. Caso A: enlace activo, puerto en VLAN 30, cliente esperado en VLAN 20 y servidor sano para VLAN 20. La pertenencia de VLAN incorrecta explica que no llegue la oferta. Caso B: el DISCOVER llega al servidor, su registro dice «no free leases» y no sale oferta. Eso apoya pool agotado. Caso C: el servidor registra y envía una oferta, pero el cliente no la recibe. Investiga el camino de retorno o filtros.\nElige la prueba para separar hipótesis y documenta lo que esa prueba permite concluir. No reinicies el servidor por reflejo ni conviertas ausencia de respuesta en diagnóstico definitivo.",
      "de": "169.254.x.x mit /16 gehört zum IPv4-Link-Local-Bereich. Bei einem für DHCP eingerichteten Windows-Client spricht dies dafür, dass keine nutzbare Lease zustande kam und der Client sich selbst konfigurierte (APIPA). Die Adresse gilt nur auf dem lokalen Link und ersetzt keine vollständige Firmenkonfiguration. Sie beweist nicht, dass der Server ausgeschaltet ist.\nMögliche Ursachen sind ein falscher Link oder ein falsches VLAN, ein nicht verfügbarer Server oder Übertragungsweg, ein erschöpfter Pool und Adresskonflikte. Prüfe zuerst Konfiguration und Link, dann einen DHCP-Erneuerungsversuch. DISCOVER ohne OFFER im Client-Mitschnitt bedeutet nur: Es kam kein Angebot an. Hinweg, Rückweg oder Server können betroffen sein.\nDie folgenden Ergebnisse sind simuliert. Fall A: Link aktiv, Port in VLAN 30, Client soll in VLAN 20 sein, Server für VLAN 20 gesund. Das falsche VLAN erklärt das fehlende Angebot. Fall B: DISCOVER erreicht den Server; dessen Protokoll meldet „no free leases“. Das stützt die Hypothese Pool erschöpft. Fall C: Der Server sendet ein Angebot, das beim Client nicht ankommt. Prüfe Rückweg oder Filter.\nWähle eine Prüfung, die Hypothesen unterscheidet, und dokumentiere die begrenzte Aussage ihres Ergebnisses. Starte den Server nicht reflexartig neu und setze fehlende Antworten nicht mit einer bewiesenen Ursache gleich."
    },
    "fig": "dhcpcases",
    "check": {
      "es": "DISCOVER sin OFFER: nombra dos causas posibles y una prueba que las separe.",
      "de": "DISCOVER ohne OFFER: Nenne zwei mögliche Ursachen und eine unterscheidende Prüfung."
    },
    "ip": "192.168.10.141/27"
  },
  {
    "short": {
      "es": "DNS / pruebas",
      "de": "DNS / Prüfungen"
    },
    "title": {
      "es": "Separa resolución de nombres, camino y servicio",
      "de": "Trenne Namensauflösung, Übertragungsweg und Dienst"
    },
    "body": {
      "es": "DNS significa Domain Name System. Un cliente pregunta al servidor DNS por un nombre; un registro A contiene una IPv4. El nombre completo, por ejemplo files.office.example, se llama FQDN. Un nombre corto puede necesitar un sufijo para completarlo. DHCP puede entregar la dirección del DNS, pero no realiza por sí mismo la resolución.\n«Accesible por IP, no por nombre» orienta a resolución de nombres: DNS incorrecto, registro ausente o viejo, sufijo, caché o archivo hosts. También puede haber diferencias de aplicación: un servicio web puede tratar el nombre y la IP de manera distinta. El síntoma por sí solo no elige una causa única.\nUna prueba explícita es nslookup files.office.example 192.168.10.132. El segundo argumento selecciona el servidor DNS; este programa consulta DNS y no valida por sí solo toda la resolución que usa cada aplicación. Compara la respuesta del DNS configurado con la de un DNS interno conocido. Si el primero responde NXDOMAIN (ese nombre no existe allí) y el interno da la IP esperada, la selección del DNS es una hipótesis fuerte.\nDespués comprueba el servicio con su protocolo. Un ping a la IP solo comprueba respuesta ICMP. Documenta nombre exacto, servidor consultado, resultado y siguiente acción; así la explicación alemana también tiene evidencia.",
      "de": "DNS steht für Domain Name System. Ein Client fragt den DNS-Server nach einem Namen; ein A-Record enthält eine IPv4-Adresse. Der vollständige Name, etwa files.office.example, heißt FQDN. Ein Kurzname benötigt gegebenenfalls ein DNS-Suffix. DHCP kann die DNS-Server-Adresse liefern, führt aber nicht selbst die Namensauflösung aus.\n„Per IP erreichbar, per Name nicht“ lenkt den Verdacht auf die Namensauflösung: falscher DNS-Server, fehlender oder veralteter Record, Suffix, Cache oder hosts-Datei. Auch die Anwendung kann Name und IP unterschiedlich behandeln, etwa bei einer Website. Das Symptom allein beweist keine einzelne Ursache.\nEine ausdrückliche Prüfung lautet nslookup files.office.example 192.168.10.132. Das zweite Argument wählt den DNS-Server. Das Programm fragt DNS ab; es prüft nicht automatisch die gesamte Namensauflösung jeder Anwendung. Vergleiche den konfigurierten Server mit einem bekannten internen DNS. Liefert der erste NXDOMAIN (Name dort nicht vorhanden), der interne aber die erwartete IP, spricht das stark für eine falsche DNS-Auswahl.\nPrüfe anschließend den Dienst mit seinem Protokoll. Ein Ping an die IP bestätigt nur eine ICMP-Antwort. Dokumentiere genauen Namen, abgefragten Server, Ergebnis und nächste Handlung. So enthält auch deine deutsche Begründung nachvollziehbare Belege."
    },
    "fig": "dnspath",
    "check": {
      "es": "Si nslookup responde bien, ¿qué queda por comprobar antes de decir que funciona el servicio?",
      "de": "Wenn nslookup korrekt antwortet: Was musst du noch prüfen, bevor du den Dienst als funktionsfähig bezeichnest?"
    },

let displayed={hint:false,solution:false,checked:false,sim:false};
function task(q){const a=state.answers[q.id]||(state.answers[q.id]={});const deterministic=q.fields.filter(f=>f.rule!=='manual'),manual=q.fields.filter(f=>f.rule==='manual'),points=q.fields.reduce((s,f)=>s+f.points,0);$('#content').innerHTML=head(t(q.title),tr('PRACTICAR · tarea ','ÜBEN · Aufgabe ')+q.id,points+' '+tr('puntos propios','eigene Punkte'))+`<div class="exercise-meta"><span>eigene Aufgabe, nicht offiziell IHK</span><span>${q.id>16?tr('Práctica extra','Zusatzübung'):tr('Práctica progresiva','Aufbauende Übung')}</span><span>${tr('Formato inspirado en','Form angelehnt an')}: ${E(state.lang==='de'?q.anchor.replace('variante / preparación','Variante / Vorbereitung').replace('pool dado; planificación propia','vorgegebener Pool; eigene Planung').replace('aplicación propia','eigene Anwendung'):q.anchor)}</span></div><section class="paper" aria-label="${tr('Hoja de ejercicio','Aufgabenblatt')}"><div class="scenario"><h2>${tr('Situación de la empresa','Betriebliche Situation')}</h2><p>${E(t(q.context))}</p><p><strong>${E(t(q.prompt))}</strong></p></div><div class="exam-layout"><div>${given(q)}${q.simulation?`<button id="simBtn">${tr('Ver resultado de la prueba elegida (simulado)','Ergebnis der gewählten Prüfung abrufen (simuliert)')}</button><div id="simResult" class="sim-result" ${displayed.sim?'':'hidden'}></div>`:''}</div><div>${deterministic.length?`<table class="answers"><thead><tr><th>${tr('Dato a completar','Einzutragende Angabe')}</th><th>${tr('Tu respuesta','Ihre Antwort')}</th><th>${tr('Pts.','Pkt.')}</th></tr></thead><tbody>${deterministic.map(f=>`<tr><td><label for="f-${f.key}">${E(t(f.label))}</label></td><td>${f.rule==='choice'?`<select id="f-${f.key}" data-field="${f.key}"><option value="">${tr('Selecciona…','Auswählen…')}</option>${f.options.map(o=>`<option value="${o.value}" ${a[f.key]===o.value?'selected':''}>${E(t(o.label))}</option>`).join('')}</select><div id="choice-${f.key}" class="small dim">${E(t(f.options.find(o=>o.value===a[f.key])?.label||{es:"",de:""}))}</div>`:`<input id="f-${f.key}" data-field="${f.key}" value="${E(a[f.key]||'')}" autocomplete="off" spellcheck="false">`}<div id="fb-${f.key}" class="field-feedback"></div></td><td>${f.points}</td></tr>`).join('')}</tbody></table>`:''}</div></div>${manual.map(f=>`<div class="manual"><label for="f-${f.key}">${E(t(f.label))} · ${f.points} ${tr('puntos de revisión manual','Punkte zur manuellen Prüfung')}</label><textarea id="f-${f.key}" data-field="${f.key}" spellcheck="false">${E(a[f.key]||'')}</textarea><div id="fb-${f.key}" class="field-feedback"></div></div>`).join('')}<p class="small dim">${tr('IPv4 con puntos (también se aceptan espacios junto a los puntos); números enteros; justificaciones revisadas por criterio.','IPv4 mit Punkten (Leerzeichen um Punkte erlaubt); ganze Zahlen; Begründungen nach Kriterien prüfen.')}</p><div class="actionbar"><button id="checkBtn" class="primary">${tr('Comprobar respuesta','Antwort prüfen')}</button><button id="hintBtn" aria-expanded="${displayed.hint}">${tr('Pista específica','Gezielter Hinweis')}</button><button id="solutionBtn" aria-expanded="${displayed.solution}">${tr(displayed.solution?'Ocultar solución':'Ver solución',displayed.solution?'Lösung ausblenden':'Lösung anzeigen')}</button><button id="tutorBtn" aria-pressed="${aid(q).tutor}">${tr('Ayuda del tutor: ','Tutorhilfe: ')+tr(aid(q).tutor?'sí':'no',aid(q).tutor?'ja':'nein')}</button></div><div id="helpState" class="small dim">${E(atext(q))}</div><div id="hint" class="callout" ${displayed.hint?'':'hidden'}><h3>${tr('Pista','Hinweis')}</h3><p>${E(t(q.hint))}</p></div><div id="feedback" class="feedback" role="status" ${displayed.checked?'':'hidden'}></div><div id="solution" class="solution" ${displayed.solution?'':'hidden'}></div></section>`;$('#content').querySelectorAll('[data-field]').forEach(el=>{el.oninput=()=>{a[el.dataset.field]=el.value;const f=q.fields.find(f=>f.key===el.dataset.field);if(f.rule==='choice')$('#choice-'+f.key).textContent=t(f.options.find(o=>o.value===el.value)?.label||{es:'',de:''});if(el.dataset.field==='test'&&q.simulation){displayed.sim=false;$('#simResult').hidden=true;}save();};el.onchange=el.oninput;});$('#checkBtn').onclick=()=>check(q);$('#hintBtn').onclick=()=>{displayed.hint=!displayed.hint;if(displayed.hint)aid(q).hint=true;save();task(q);$('#hintBtn').focus({preventScroll:true});};$('#solutionBtn').onclick=()=>{displayed.solution=!displayed.solution;if(displayed.solution){aid(q).solution=true;markSeen(q.ip);}save();task(q);$('#solutionBtn').focus({preventScroll:true});};$('#tutorBtn').disabled=aid(q).tutor;$('#tutorBtn').onclick=()=>{aid(q).tutor=true;save();task(q);$('#tutorBtn').focus({preventScroll:true});};if(q.simulation){$('#simBtn').onclick=()=>{if(!(a.test||'')){$('#simResult').hidden=false;$('#simResult').textContent=tr('Selecciona antes una prueba.','Wähle zuerst eine Prüfung.');return;}displayed.sim=true;aid(q).sim=true;save();showSim(q);};if(displayed.sim)showSim(q);}if(displayed.solution)solution(q);if(displayed.checked)feedback(q,false);}
function showSim(q){const a=state.answers[q.id]||{};let out;if(q.simulation==='dhcp'){out={link:tr('Enlace UP. Puerto VLAN 30. Según plan, el cliente debe estar en VLAN 20.','Link UP. Port-VLAN 30. Laut Plan soll der Client in VLAN 20 sein.'),capture:tr('Cliente: DISCOVER enviado, ningún OFFER recibido. Servidor VLAN 20: no llega ese DISCOVER. Revisa el camino de ida/VLAN; no demuestra servidor caído.','Client: DISCOVER gesendet, kein OFFER empfangen. Server VLAN 20: Dieser DISCOVER kommt nicht an. Hinweg/VLAN prüfen; kein Beweis für Serverausfall.'),scope:tr('Servicio DHCP activo. Pool VLAN 20: 20 concesiones libres. Otros clientes VLAN 20 reciben concesiones. Investiga camino y puerto del cliente afectado.','DHCP-Dienst aktiv. Pool VLAN 20: 20 freie Leases. Andere VLAN-20-Clients erhalten Leases. Übertragungsweg und Port des betroffenen Clients untersuchen.'),dns:tr('Cambiar DNS no explica que falte una concesión DHCP. Esta prueba no discrimina el problema.','DNS-Änderung erklärt die fehlende DHCP-Lease nicht. Diese Prüfung unterscheidet die Ursachen nicht.')}[a.test];}else{out=a.test==='compare'?tr('nslookup files.office.example 203.0.113.53 → NXDOMAIN\nnslookup files.office.example 192.168.10.132 → A 192.168.10.150\nEl servicio de archivos todavía no se ha probado.','nslookup files.office.example 203.0.113.53 → NXDOMAIN\nnslookup files.office.example 192.168.10.132 → A 192.168.10.150\nDer Dateidienst wurde noch nicht geprüft.'):tr('ping 192.168.10.150 → respuesta ICMP. No hay evidencia nueva sobre DNS.','ping 192.168.10.150 → ICMP-Antwort. Kein neuer DNS-Beleg.');}$('#simResult').hidden=false;$('#simResult').innerHTML=`<div class="console-head">${tr('Resultado simulado de la prueba','Simuliertes Prüfergebnis')}</div><pre class="console">${E(out||tr('Elige una prueba.','Wähle eine Prüfung.'))}</pre>`;$('#helpState').textContent=atext(q);}
function feedback(q,record){const a=state.answers[q.id]||{},res=q.fields.map(f=>({f,result:judge(q,f,a)}));let got=0,max=0,empty=0,open=0;for(const {f,result} of res){if(f.rule!=='manual'){max+=f.points;if(result==='ok')got+=f.points;}else open+=f.points;if(result==='empty')empty++;const el=$('#fb-'+f.key);el.className='field-feedback '+(result==='ok'?'ok':result==='bad'?'bad':'');el.textContent=result==='empty'?tr('Vacío: falta una respuesta.','Leer: Antwort fehlt.'):result==='manual'?tr('Pendiente de revisión por criterios; no puntuado automáticamente.','Kriterienprüfung offen; nicht automatisch bewertet.'):result==='ok'?tr('Correcto para este criterio.','Für dieses Kriterium richtig.'):tr(f.rule.startsWith('pool')?'Revisa límites, reservas, orden y tamaño inclusivo.':'Revisa este dato usando la máscara y el material.',f.rule.startsWith('pool')?'Grenzen, Reservierungen, Reihenfolge und inklusive Größe prüfen.':'Angabe anhand der Maske und Unterlagen prüfen.');}
$('#feedback').hidden=false;$('#feedback').innerHTML=`<p><strong>${tr('Puntos automáticos','Automatische Punkte')}: ${got} / ${max}</strong>${open?' · '+open+' '+tr('puntos abiertos de revisión manual','offene Punkte zur manuellen Prüfung'):''}</p><p>${empty?tr('Hay respuestas vacías.','Es gibt leere Antworten.'):tr('Respuestas registradas.','Antworten erfasst.')} ${E(t(q.reason))}</p><p class="small">${tr('Las justificaciones se contrastan al abrir la solución. No son una nota IHK ni una prueba de dominio.','Begründungen werden beim Öffnen der Lösung verglichen. Keine IHK-Note und kein Nachweis der Beherrschung.')}</p>`;
if(record){const list=state.attempts[q.id]||(state.attempts[q.id]=[]);list.push({time:new Date().toISOString(),answers:{...a},auto:got,max,manualPending:open,empty,help:atext(q)});save();}}
function check(q){displayed.checked=true;feedback(q,true);}
function solution(q){let s=`<h2>${tr('Solución y criterios','Lösung und Kriterien')}</h2><p>${tr('Ejemplo y comparación manual; cualquier respuesta equivalente que cumpla los criterios es válida.','Beispiel und manuelle Prüfung; jede gleichwertige Antwort, die die Kriterien erfüllt, ist gültig.')}</p><table class="given"><tbody>${q.fields.filter(f=>f.rule!=='manual').map(f=>`<tr><th>${E(t(f.label))} · ${f.points} ${tr('pto.','Pkt.')}</th><td>${E(sample(q,f))}</td></tr>`).join('')}</tbody></table>`;for(const f of q.fields.filter(f=>f.rule==='manual')){s+=`<h3>${E(t(f.label))}</h3><div class="model"><p>${E(t(f.model))}</p></div><p class="small">${tr('Con el tutor, compara el sentido de tu respuesta y asigna los puntos de cada criterio. El texto no se analiza por palabras clave.','Mit dem Tutor den Inhalt vergleichen und je Kriterium Punkte vergeben. Keine Bewertung über Schlüsselwörter.')}</p><div class="criteria">${f.criteria.map((c,j)=>{const key=f.key+'-'+j,v=(state.grades[q.id]||{})[key];return `<div class="criterion"><label for="grade-${key}">${E(t(c.text))} (${c.points})</label><select id="grade-${key}" data-grade="${key}" aria-label="${E(tr('Puntos: ','Punkte: ')+t(c.text))}"><option value="">${tr('Sin revisar','Offen')}</option>${Array.from({length:c.points+1},(_,z)=>`<option value="${z}" ${String(v)===String(z)?'selected':''}>${z} / ${c.points}</option>`).join('')}</select></div>`;}).join('')}</div>`;}s+=`<p style="margin-top:1rem">${E(t(q.reason))}</p>`;$('#solution').innerHTML=s;$('#solution').querySelectorAll('[data-grade]').forEach(el=>el.onchange=()=>{const g=state.grades[q.id]||(state.grades[q.id]={});g[el.dataset.grade]=el.value;save();});}
function closing(){const rows=[['idea',tr('Explica desde la IP hasta los límites, sin mirar el modelo.','Erkläre den Weg von der IP zu den Grenzen ohne Modell.')],['german',tr('Escribe una frase alemana con Netzadresse y Hostbereich.','Schreibe einen deutschen Satz mit Netzadresse und Hostbereich.')],['doubt',tr('Duda pendiente / siguiente práctica','Offene Frage / nächste Übung')]];$('#content').innerHTML=head(tr('Lo que puedes explicar ahora','Was du jetzt erklären kannst'),tr('CIERRE','ABSCHLUSS'))+`<div class="paper close-fields">${rows.map(([k,label])=>`<label for="close-${k}">${E(label)}<textarea id="close-${k}" data-closing="${k}">${E(state.closing[k]||'')}</textarea></label>`).join('')}<p>${tr('Haber completado o visto soluciones no demuestra dominio. Selecciona una variante nueva para otra sesión; la retención aún no se ha observado.','Abschluss oder gesehene Lösungen beweisen keine Beherrschung. Wähle für eine weitere Sitzung eine neue Variante; Behalten wurde noch nicht beobachtet.')}</p><h2>${tr('Registro de ayuda','Hilfenachweis')}</h2><table class="given"><tbody>${tasks.map(q=>`<tr><th>${q.id} · ${E(t(q.title))}</th><td style="font-family:var(--sans)">${E(atext(q))}</td></tr>`).join('')}</tbody></table><p class="storage">${storageMessage()}</p><button id="exportFinal" class="primary">${tr('Exportar respuestas, notas y ayuda','Antworten, Notizen und Hilfe exportieren')}</button></div>`;$('#content').querySelectorAll('[data-closing]').forEach(el=>el.oninput=()=>{state.closing[el.dataset.closing]=el.value;save();});$('#exportFinal').onclick=exportData;}
function sources(){const g=[['dirección de red','Netzadresse'],['dirección de broadcast','Broadcast-Adresse'],['máscara de subred','Subnetzmaske'],['rango de hosts','Hostbereich'],['concesión DHCP','DHCP-Lease'],['resolución de nombres','Namensauflösung']];$('#content').innerHTML=head(tr('Fuentes y vocabulario','Quellen und Wortschatz'),tr('CONSULTA','NACHSCHLAGEN'))+`<div class="paper"><h2>${tr('Español ↔ alemán','Spanisch ↔ Deutsch')}</h2><table class="glossary"><thead><tr><th>Español</th><th>Deutsch</th></tr></thead><tbody>${g.map(r=>`<tr><td lang="es">${r[0]}</td><td lang="de">${r[1]}</td></tr>`).join('')}</tbody></table><h2 style="margin-top:2rem">${tr('Fuentes utilizadas','Verwendete Quellen')}</h2><ul class="source-list"><li>Zisler, Computer-Netzwerke, 7. Auflage, 2022: §3.5 ${tr('completo','vollständig')}, PDF 145–162; §3.3.1, PDF 136–138; §4.2.3–4.2.4, PDF 206–215; §4.3–4.4, PDF 216–243; §4.7.2–4.7.3, PDF 278–279. ${tr('Páginas físicas del PDF local, sin atribuir números impresos inexistentes.','Physische Seiten des lokalen PDFs; keine erfundenen Druckseiten.')}</li><li>Grundstufe LF3–5, 2020, §3.4.7: PDF 51–54, ${tr('páginas impresas','Druckseiten')} 327–330. ${tr('Comparación de la explicación y la analogía de teléfono; no se adopta el error de resta de la p.329.','Erklärungsvergleich und Telefonanalogie; der Subtraktionsfehler auf S.329 wird nicht übernommen.')}</li><li>Rosenshine (2012), Principles of Instruction: ${tr('modelos, pasos pequeños y práctica guiada','Modelle, kleine Schritte und angeleitete Übung')}. IES (2007), Organizing Instruction and Study: ${tr('ejemplos, representación concreta y recuperación','Beispiele, konkrete Darstellung und Abruf')}. Nation (2007), The Four Strands: ${tr('comprensión, producción y vocabulario','Verstehen, Produktion und Wortschatz')}.</li><li>Mayer &amp; Fiorella (2014), The Cambridge Handbook of Multimedia Learning, cap.12: ${tr('señalización y proximidad entre explicación y gráfico','Signalisierung und räumliche Nähe von Erklärung und Grafik')}. ${tr('El alumno decide el avance; la eficacia del aprendizaje requiere uso real.','Lerner steuert den Fortschritt; Lernwirksamkeit benötigt echte Nutzung.')}</li><li>Cisco, Configure IP Addresses and Unique Subnets for New Users, 07.07.2023: ${tr('direcciones → máscara → subnetting; ejemplos binarios','Adressen → Maske → Subnetting; binäre Beispiele')}. RFC 2131 §3.1; RFC 3927 §2.1; RFC 3021 §2.1. Microsoft Learn: Troubleshooting DNS clients, nslookup.</li><li>${tr('Formatos de examen consultados','Gelesene Prüfungsformate')}: AEN Sommer 2024 1ab, 1bc–1bd, 2aa/2ac, 2ba/2bb (${tr('enunciado y solución oficial','Aufgabe und offizielle Lösung')}); AEN Winter 2021 1a (${tr('formato de tabla, sin añadir VLSM','Tabellenformat, ohne VLSM zu ergänzen')}); AEN Sommer 2023 1ba (${tr('enunciado en copia con respuestas no oficiales; contenido validado con RFC 2131','Aufgabenstellung in Kopie mit nicht offiziellen Antworten; Inhalt mit RFC 2131 geprüft')}); AEN Sommer 2022 1aa (${tr('tabla IPv4, enunciado y solución oficial','IPv4-Tabelle, Aufgabe und offizielle Lösung')}), 1cc (${tr('solo aclaración /31','nur /31-Klarstellung')}).</li></ul><p>${tr('Todas las tareas y sus puntos son propios. No se reproduce una pregunta oficial ni una nota IHK. El reporte adjunto da las referencias y las pruebas.','Alle Aufgaben und Punkte sind eigene. Keine offizielle Aufgabe und keine IHK-Note wird reproduziert. Der beigefügte Bericht enthält Referenzen und Prüfungen.')}</p></div>`;}
function storageMessage(){return storageOK?tr('Guardado local disponible, sin garantía permanente. Otra ruta/navegador puede tener otro estado. Exporta una copia; si el guardado falla se conserva en memoria hasta cerrar.','Lokale Speicherung verfügbar, ohne dauerhafte Garantie. Anderer Dateipfad/Browser kann einen anderen Stand haben. Exportiere eine Kopie; bei Fehler bleibt der Stand bis zum Schließen im Speicher.'):tr('Guardado local no disponible: el estado vive solo en esta sesión. Exporta antes de cerrar.','Lokale Speicherung nicht verfügbar: Stand bleibt nur in dieser Sitzung. Vor dem Schließen exportieren.');}
function render(){chrome();if(state.page<lessons.length)lesson(state.page);else if(state.page<lessons.length+tasks.length)task(tasks[state.page-lessons.length]);else if(state.page===totalPages-2)closing();else sources();save();}
function go(i){state.page=Math.max(0,Math.min(totalPages-1,i));displayed={hint:false,solution:false,checked:false,sim:false};render();window.scrollTo(0,0);}
function exportData(){const payload={...state,exportedAt:new Date().toISOString(),title:'IPv4 Nachhilfe 2026-10-08',status:'Resultados de práctica; no prueba de dominio / Übungsergebnisse; kein Beherrschungsnachweis',helpSummary:tasks.map(q=>({id:q.id,help:atext(q)}))};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ipv4-nachhilfe-respuestas.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#es').onclick=()=>{state.lang='es';render();};$('#de').onclick=()=>{state.lang='de';render();};$('[data-nav="prev"]').onclick=()=>go(state.page-1);$('[data-nav="next"]').onclick=()=>go(state.page+1);$('#closePage').onclick=()=>go(totalPages-2);$('#sourcesPage').onclick=()=>go(totalPages-1);$('#exportBtn').onclick=exportData;$('#notesBtn').onclick=()=>{$('#notesTitle').textContent=tr('Notas de esta página','Notizen zu dieser Seite');$('#closeNotes').textContent=tr('Cerrar','Schließen');$('#notesLabel').textContent=tr('Escribe una idea o duda; se exporta con tus respuestas.','Notiere einen Gedanken oder eine Frage; wird mit den Antworten exportiert.');$('#notesText').value=state.notes[state.page]||'';$('#storageText').textContent=storageMessage();$('#notesDialog').showModal();$('#notesText').focus();};$('#notesText').oninput=()=>{state.notes[state.page]=$('#notesText').value;save();};$('#closeNotes').onclick=()=>$('#notesDialog').close();render();
</script></body></html>
