  {
    "title": {
      "es": "IPv4: una dirección para entregar datos",
      "de": "IPv4: eine Adresse zur Zustellung von Daten"
    },
    "body": {
      "es": "Cuando un ordenador envía un documento a una impresora de red, los datos necesitan un destino. La dirección IP identifica la interfaz de red a la que deben llegar. Una interfaz es la conexión de un equipo con una red: por ejemplo, su conexión Ethernet o Wi-Fi. Un equipo puede tener varias interfaces y varias direcciones.\nIP significa Internet Protocol: un conjunto de reglas para direccionar y transportar paquetes entre redes. Un paquete es una porción de datos con información de control, incluida la dirección de origen y la de destino. IPv4 es la versión 4 de ese protocolo. También se usa en una red local sin conexión a Internet.\nEn nuestro ejemplo, el PC tiene 192.168.40.10 y la impresora 192.168.40.20. El paquete lleva como origen la dirección del PC y como destino la de la impresora. La impresora puede devolver una respuesta usando las direcciones al revés. IPv4 permite dirigir los datos; por sí solo no garantiza que lleguen ni cifra su contenido.\nUna dirección debe ser única dentro de la red en la que se utiliza. Dos equipos con la misma IP pueden provocar un conflicto. La dirección es una configuración lógica: se puede cambiar. No es el número físico de fabricación de la tarjeta.",
      "de": "Wenn ein Computer ein Dokument an einen Netzwerkdrucker sendet, brauchen die Daten ein Ziel. Die IP-Adresse kennzeichnet die Netzwerkschnittstelle, an die sie zugestellt werden sollen. Eine Schnittstelle ist die Verbindung eines Geräts mit einem Netz, etwa Ethernet oder WLAN. Ein Gerät kann mehrere Schnittstellen und mehrere Adressen besitzen.\nIP steht für Internet Protocol: Regeln zur Adressierung und zum Transport von Paketen zwischen Netzen. Ein Paket ist ein Teil der Daten mit Steuerinformationen, darunter Quell- und Zieladresse. IPv4 ist Version 4 dieses Protokolls. Es wird auch in lokalen Netzen ohne Internetanschluss verwendet.\nIm Beispiel besitzt der PC 192.168.40.10 und der Drucker 192.168.40.20. Das Paket enthält die PC-Adresse als Quelle und die Druckeradresse als Ziel. Für eine Antwort kann der Drucker die Adressen vertauschen. IPv4 ermöglicht die Zustellung; es garantiert allein weder die Ankunft noch verschlüsselt es die Nutzdaten.\nEine Adresse muss innerhalb ihres Netzes eindeutig sein. Zwei Geräte mit derselben IP können einen Adresskonflikt verursachen. Die IP-Adresse ist eine veränderbare logische Konfiguration, keine physische Herstellungsnummer der Netzwerkkarte."
    },

    "body": {
      "es": "La escritura 192.168.40.10 contiene cuatro números separados por puntos. Cada número representa ocho bits. Un bit es una posición que puede valer 0 o 1. Un grupo de ocho bits se llama octeto; también corresponde a un byte. Así, cuatro octetos contienen 4 × 8 = 32 bits.\nLos puntos nos permiten leer la dirección por partes. No son bits y no aumentan su longitud. Cada octeto se escribe en decimal, el sistema de números que usamos normalmente. Su valor puede ir de 0 a 255. Por eso 192.168.40.300 no es una dirección IPv4 válida: el último octeto supera 255.\n¿Por qué precisamente 255? Con ocho posiciones que tienen dos opciones cada una hay 256 combinaciones diferentes. La primera representa el valor 0 y la última el 255. Son 256 valores porque el cero también cuenta. En la página siguiente veremos cómo se convierte una combinación de bits en un número.\nLas cuatro partes no significan automáticamente «país, empresa, departamento y equipo». Tampoco los tres primeros números identifican siempre la red. Para saber dónde termina la parte de red necesitaremos otra información: la máscara. Por ahora basta con reconocer la estructura de una dirección.",
      "de": "Die Schreibweise 192.168.40.10 enthält vier durch Punkte getrennte Zahlen. Jede Zahl stellt acht Bit dar. Ein Bit ist eine Stelle mit dem Wert 0 oder 1. Acht Bit bilden ein Oktett und entsprechen einem Byte. Vier Oktette enthalten daher 4 × 8 = 32 Bit.\nDie Punkte erleichtern das Lesen. Sie sind keine Bit und verlängern die Adresse nicht. Jedes Oktett wird dezimal geschrieben, also im üblichen Zahlensystem. Sein Wert liegt zwischen 0 und 255. Deshalb ist 192.168.40.300 keine gültige IPv4-Adresse: Das letzte Oktett ist zu groß.\nWarum gerade 255? Acht Stellen mit jeweils zwei Möglichkeiten ergeben 256 verschiedene Kombinationen. Die erste steht für 0, die letzte für 255. Es sind 256 Werte, weil die Null mitzählt. Auf der nächsten Seite betrachten wir, wie eine Bitkombination in eine Zahl umgewandelt wird.\nDie vier Teile bedeuten nicht automatisch „Land, Firma, Abteilung und Gerät“. Auch die ersten drei Zahlen kennzeichnen nicht immer das Netz. Um die Grenze zwischen Netz- und Hostanteil festzustellen, brauchen wir später die Subnetzmaske. Zunächst genügt es, den Aufbau einer Adresse zu erkennen."

    "title": {
      "es": "Leer los bits: cada posición tiene un valor",
      "de": "Bits lesen: jede Stelle hat einen Wert"
    },
    "body": {
      "es": "En decimal, la posición de una cifra cambia su valor: en 10, el 1 vale diez. En binario también hay valores por posición, pero se duplican hacia la izquierda. En un octeto, de izquierda a derecha, son 128, 64, 32, 16, 8, 4, 2 y 1.\nUn bit en 1 incluye el valor de su posición. Un bit en 0 no lo incluye. Para leer 11000000, sumamos 128 + 64 = 192. No sumamos 32 porque el tercer bit está en 0. Este paso explica por qué 11000000 representa 192 y no 160.\nSi todos los bits están en 1, la suma es 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255. Si todos están en 0, el resultado es 0. Para convertir 10 a binario elegimos 8 y 2: 00001010. Para 173 elegimos 128, 32, 8, 4 y 1: 10101101.\nNo necesitas convertir una dirección entera en cada tarea. Aprendemos este mecanismo porque la máscara separa la dirección por posiciones de bits, incluso dentro de un octeto. Comprender esa separación evita depender de una tabla memorizada.",
      "de": "Im Dezimalsystem verändert die Position einer Ziffer ihren Wert: Bei 10 steht die 1 für zehn. Auch im Binärsystem gibt es Stellenwerte, die sich nach links jeweils verdoppeln. In einem Oktett lauten sie von links nach rechts: 128, 64, 32, 16, 8, 4, 2 und 1.\nEin Bit mit dem Wert 1 nimmt den Stellenwert in die Summe auf. Ein Bit mit dem Wert 0 lässt ihn weg. Für 11000000 addieren wir 128 + 64 = 192. Die 32 wird nicht addiert, weil das dritte Bit 0 ist. Daher bedeutet 11000000 den Wert 192 und nicht 160.\nSind alle Bit gesetzt, ergibt sich 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255. Sind alle Bit 0, ist das Ergebnis 0. Für die Umwandlung von 10 wählen wir 8 und 2: 00001010. Für 173 wählen wir 128, 32, 8, 4 und 1: 10101101.\nNicht jede Aufgabe erfordert die Umwandlung einer ganzen Adresse. Dieses Prinzip ist nötig, weil die Maske eine Adresse an einer Bitposition trennt, auch mitten in einem Oktett. Wer diese Trennung versteht, ist nicht ausschließlich auf eine auswendig gelernte Tabelle angewiesen."
    },

    "title": {
      "es": "Una parte identifica la red; otra, la interfaz",
      "de": "Ein Teil kennzeichnet das Netz, der andere die Schnittstelle"
    },
    "body": {
      "es": "Piensa en una dirección postal: primero permite encontrar una calle y después una casa en esa calle. Una dirección IPv4 también tiene dos partes: la parte de red identifica la red; la parte de host distingue las interfaces dentro de ella. «Host» designa aquí un participante direccionado, no solo un PC. La interfaz del router también necesita una dirección.\nLa analogía explica el propósito, pero no sirve para calcular: los límites de IPv4 se fijan en bits. En una red con máscara 255.255.255.0, las direcciones 192.168.40.10 y 192.168.40.20 comparten la parte de red 192.168.40. El último octeto distingue al PC y la impresora. Con esa máscara, 192.168.41.20 pertenece a otra red.\nCuando el destino está en la misma red, el equipo puede entregarle datos por el enlace local. Si está en otra red, normalmente utiliza un router. Un router conecta redes y decide por dónde reenviar los paquetes. El gateway predeterminado es el router local utilizado para destinos sin una ruta más específica.\n¿Cómo sabe el PC qué parte comparar? Con su máscara de subred. La IP sola no permite identificar con certeza la red. Necesitamos siempre el par dirección y máscara, o dirección y prefijo.",
      "de": "Eine Postanschrift führt zunächst zu einer Straße und dann zu einem Haus. Auch eine IPv4-Adresse enthält zwei Teile: Der Netzanteil kennzeichnet das Netz, der Hostanteil unterscheidet die Schnittstellen darin. „Host“ bezeichnet hier einen adressierten Teilnehmer, nicht nur einen PC. Auch eine Router-Schnittstelle braucht eine Adresse.\nDer Vergleich erklärt den Zweck, ist aber keine Rechenregel: IPv4-Grenzen werden in Bit festgelegt. Mit der Maske 255.255.255.0 besitzen 192.168.40.10 und 192.168.40.20 denselben Netzanteil 192.168.40. Das letzte Oktett unterscheidet PC und Drucker. Mit dieser Maske gehört 192.168.41.20 zu einem anderen Netz.\nLiegt das Ziel im eigenen Netz, kann der Rechner die Daten über den lokalen Link zustellen. Für ein anderes Netz nutzt er normalerweise einen Router. Ein Router verbindet Netze und entscheidet, wohin Pakete weitergeleitet werden. Das Standardgateway ist der lokale Router für Ziele ohne spezifischere Route.\nWelche Stellen muss der PC vergleichen? Das legt seine Subnetzmaske fest. Die IP-Adresse allein bestimmt das Netz nicht eindeutig. Wir brauchen stets Adresse und Maske oder Adresse und Präfix."
    },

    "title": {
      "es": "La máscara marca la frontera",
      "de": "Die Maske markiert die Grenze"
    },
    "body": {
      "es": "La máscara de subred tiene 32 bits, igual que la dirección IPv4. Cada posición de la máscara describe la posición correspondiente de la dirección: un 1 indica parte de red; un 0 indica parte de host. No dice que el bit de la dirección tenga que valer 1 o 0. Solo indica a qué parte pertenece.\nEn las máscaras que usamos aquí, todos los 1 están juntos a la izquierda y todos los 0 a la derecha. 11111111.11111111.11111111.00000000 contiene tres octetos de red y uno de host. Al convertir los octetos a decimal obtenemos 255.255.255.0.\nLa notación /24 expresa la misma máscara de forma breve: hay 24 bits de red desde la izquierda. El número después de la barra se llama longitud de prefijo. 192.168.40.10/24 significa esa dirección con la máscara 255.255.255.0. No significa que el PC tenga 24 direcciones ni que haya 24 hosts.\nHay 32 posiciones en total. Si 24 pertenecen a la red, quedan ocho para el host. Ahora tiene sentido restar 32 − 24: estamos contando posiciones restantes, no restando valores de la dirección. Usaremos p para la longitud de prefijo y h para el número de bits de host. Por tanto, h = 32 − p.",
      "de": "Die Subnetzmaske ist wie eine IPv4-Adresse 32 Bit lang. Jede Maskenstelle beschreibt die entsprechende Stelle der Adresse: 1 bedeutet Netzanteil, 0 bedeutet Hostanteil. Das Adressbit selbst muss deshalb nicht 1 oder 0 sein. Die Maske legt nur seine Zugehörigkeit fest.\nBei den hier verwendeten Masken stehen alle Einsen zusammen links und alle Nullen rechts. 11111111.11111111.11111111.00000000 enthält drei Netzoktette und ein Hostoktett. Dezimal ergibt das 255.255.255.0.\nDie Kurzschreibweise /24 bezeichnet dieselbe Maske: Von links gehören 24 Bit zum Netz. Die Zahl nach dem Schrägstrich heißt Präfixlänge. 192.168.40.10/24 bedeutet diese Adresse mit der Maske 255.255.255.0. Es bedeutet weder 24 Adressen für den PC noch 24 Hosts.\nInsgesamt gibt es 32 Stellen. Wenn 24 zum Netz gehören, bleiben acht für den Host. Deshalb rechnen wir 32 − 24: Wir zählen übrige Stellen und subtrahieren keine Adresswerte. Im Folgenden bezeichnet p die Präfixlänge und h die Anzahl der Hostbits. Somit gilt h = 32 − p."
    },

  {
    "title": {
      "es": "Construir /26, sin adivinar la máscara",
      "de": "/26 bilden, ohne die Maske zu erraten"
    },
    "body": {
      "es": "La frontera no tiene que coincidir con un punto. Con /26, los primeros 24 bits llenan tres octetos. Faltan dos bits de red, que ocupan las dos primeras posiciones del cuarto octeto. Allí la máscara es 11000000.\nEn ese cuarto octeto, los 1 están en las posiciones 128 y 64. Por eso vale 128 + 64 = 192. La máscara completa es 255.255.255.192. Las seis posiciones restantes son bits de host: 32 − 26 = 6. Mira los pasos de la figura para unir el conteo y la suma.\nPuedes repetir el procedimiento con cualquier prefijo. Para /23, llenas dos octetos: 16 bits. Los siete bits siguientes pertenecen al tercer octeto. Allí tienes 11111110, que vale 128 + 64 + 32 + 16 + 8 + 4 + 2 = 254. El cuarto octeto de máscara tiene ocho ceros. Resultado: 255.255.254.0.\nCambiar el prefijo modifica la interpretación de la dirección, no su longitud: IPv4 sigue teniendo 32 bits. En /23 quedan nueve bits de host, uno en el tercer octeto y ocho en el cuarto. No confundas los siete bits de red de ese octeto con los nueve bits de host de toda la dirección.",
      "de": "Die Grenze muss nicht an einem Punkt liegen. Bei /26 füllen die ersten 24 Bit drei Oktette. Zwei weitere Netzbits besetzen die ersten beiden Stellen des vierten Oktetts. Dort lautet die Maske 11000000.\nDie Einsen stehen an den Stellenwerten 128 und 64. Deshalb ist der Wert 128 + 64 = 192. Die vollständige Maske lautet 255.255.255.192. Die sechs übrigen Stellen sind Hostbits: 32 − 26 = 6. Die Schritte der Abbildung verbinden das Zählen mit der Summe.\nDasselbe Verfahren gilt für andere Präfixe. Für /23 werden zwei Oktette mit 16 Bit gefüllt. Die nächsten sieben Netzbits liegen im dritten Oktett: 11111110. Das ergibt 128 + 64 + 32 + 16 + 8 + 4 + 2 = 254. Im vierten Maskenoktett stehen acht Nullen. Ergebnis: 255.255.254.0.\nEin anderes Präfix verändert die Interpretation der Adresse, nicht ihre Länge: IPv4 bleibt 32 Bit lang. Bei /23 bleiben neun Hostbits, eines im dritten und acht im vierten Oktett. Die sieben Netzbits dieses Oktetts sind nicht mit den neun Hostbits der gesamten Adresse zu verwechseln."

  {
    "title": {
      "es": "Dirección de red y broadcast: dos funciones distintas",
      "de": "Netzadresse und Broadcast: zwei verschiedene Funktionen"
    },
    "body": {
      "es": "Dentro de una subred IPv4 convencional hay dos direcciones especiales. La dirección de red identifica la subred completa. Se obtiene conservando la parte de red de una IP y poniendo todos los bits de host en 0. No se asigna a un PC como dirección de host.\nLa dirección de broadcast permite dirigirse a todos los participantes de esa subred. Conserva la misma parte de red, pero tiene todos los bits de host en 1. Tampoco se asigna como dirección individual. Un broadcast no significa «a todo Internet». Los routers normalmente no reenvían los broadcasts de una red a otra.\nEn 192.168.40.0/24, el último octeto es completamente de host. Todos sus bits en 0 dan 0, así que la dirección de red es 192.168.40.0. Todos en 1 dan 255, así que el broadcast es 192.168.40.255. Las direcciones de host utilizables van de 192.168.40.1 a 192.168.40.254.\nEste ejemplo no establece la regla «red siempre acaba en .0 y broadcast siempre en .255». Si la frontera está dentro de un octeto, los extremos cambian. La regla que siempre puedes aplicar a una subred convencional es conservar los bits de red y modificar solamente los de host. Los casos especiales /31 y /32 se explican más adelante.",
      "de": "Ein konventionelles IPv4-Subnetz besitzt zwei besondere Adressen. Die Netzadresse kennzeichnet das gesamte Subnetz. Man erhält sie, indem man den Netzanteil einer IP beibehält und alle Hostbits auf 0 setzt. Sie wird keinem PC als Hostadresse zugewiesen.\nDie Broadcast-Adresse richtet sich an alle Teilnehmer dieses Subnetzes. Sie besitzt denselben Netzanteil, aber alle Hostbits sind 1. Auch sie ist keine individuelle Hostadresse. Broadcast bedeutet nicht „an das gesamte Internet“. Router leiten Broadcasts normalerweise nicht von einem Netz in ein anderes weiter.\nBei 192.168.40.0/24 gehört das letzte Oktett vollständig zum Hostanteil. Alle Hostbits auf 0 ergeben 0: Die Netzadresse ist 192.168.40.0. Alle auf 1 ergeben 255: Der Broadcast ist 192.168.40.255. Nutzbare Hostadressen liegen zwischen 192.168.40.1 und 192.168.40.254.\nDaraus folgt nicht die Regel „Netzadresse endet immer auf .0 und Broadcast immer auf .255“. Liegt die Grenze innerhalb eines Oktetts, ändern sich die Endpunkte. Für konventionelle Subnetze gilt: Netzbits beibehalten und nur die Hostbits verändern. Die Sonderfälle /31 und /32 folgen später."
    },

  {
    "title": {
      "es": "Contar direcciones y hosts: por qué se restan dos",
      "de": "Adressen und Hosts zählen: warum zwei abgezogen werden"
    },
    "body": {
      "es": "Una posición de host permite dos combinaciones: 0 y 1. Dos posiciones permiten cuatro: 00, 01, 10 y 11. Tres permiten ocho: 000, 001, 010, 011, 100, 101, 110 y 111. Cada posición adicional duplica las combinaciones porque puede ser 0 o 1 para cada combinación anterior.\nLa escritura 2³ significa 2 × 2 × 2, no 2 × 3. El número elevado cuenta cuántas veces multiplicamos por 2. Con h bits de host hay 2ʰ direcciones totales. En una subred convencional quitamos la dirección de red y el broadcast: quedan 2ʰ − 2 direcciones de host utilizables.\nEjemplo /29: quedan 32 − 29 = 3 bits de host. Hay 2³ = 8 direcciones. Dos son especiales y seis pueden asignarse. Cinco ordenadores y una interfaz de router necesitan seis direcciones: caben exactamente. Para cinco interfaces en total, /29 también basta; /28 funcionaría, pero ocuparía un bloque mayor del necesario.\nEn /26 quedan seis bits: 2⁶ = 64 direcciones y 62 hosts utilizables. No dividimos 254 hosts entre cuatro para obtener los hosts de cuatro subredes: cada nueva subred necesita sus propios dos extremos especiales. Cuenta primero direcciones totales y después descuenta dos en cada subred.",
      "de": "Ein Hostbit ermöglicht zwei Kombinationen: 0 und 1. Zwei ermöglichen vier: 00, 01, 10 und 11. Drei ermöglichen acht: 000, 001, 010, 011, 100, 101, 110 und 111. Jedes zusätzliche Bit verdoppelt die Zahl der Kombinationen, weil es für jede vorherige Kombination 0 oder 1 sein kann.\n2³ bedeutet 2 × 2 × 2, nicht 2 × 3. Die hochgestellte Zahl zählt die Faktoren 2. Mit h Hostbits gibt es 2ʰ Adressen insgesamt. In einem konventionellen Subnetz werden Netzadresse und Broadcast abgezogen: Es bleiben 2ʰ − 2 nutzbare Hostadressen.\nBeispiel /29: Es bleiben 32 − 29 = 3 Hostbits. 2³ = 8 Adressen, davon zwei besondere und sechs nutzbare. Fünf Computer und eine Router-Schnittstelle benötigen sechs Adressen und passen genau hinein. Für insgesamt fünf Schnittstellen reicht /29 ebenfalls; /28 funktioniert, belegt aber einen unnötig großen Block.\nBei /26 bleiben sechs Bit: 2⁶ = 64 Adressen und 62 nutzbare Hosts. Für vier Subnetze wird nicht die ursprüngliche Hostzahl 254 durch vier geteilt: Jedes neue Subnetz braucht seine eigenen zwei besonderen Endpunkte. Erst Gesamtadressen zählen, dann in jedem Subnetz zwei abziehen."

    "title": {
      "es": "Encontrar la red con bits: un ejemplo completo",
      "de": "Das Netz mit Bit bestimmen: ein vollständiges Beispiel"
    },
    "body": {
      "es": "Un PC tiene 192.168.40.77/27. Queremos identificar su red, no elegir una nueva. /27 ocupa tres octetos completos y tres bits del cuarto. La máscara del cuarto octeto es 11100000 = 224; la máscara completa es 255.255.255.224. Quedan cinco bits de host.\n77 en binario es 01001101: 64 + 8 + 4 + 1. Separa los tres primeros bits de red: 010 | 01101. Para la dirección de red conservas 010 y sustituyes el host por cinco ceros: 010 | 00000. El resultado vale 64. Los tres primeros octetos no cambian: la red es 192.168.40.64.\nPara el broadcast conservas 010 y sustituyes los cinco bits de host por unos: 010 | 11111. Sumas 64 + 16 + 8 + 4 + 2 + 1 = 95. El broadcast es 192.168.40.95. Los hosts van de 192.168.40.65 a 192.168.40.94. Hay 2⁵ − 2 = 30 direcciones utilizables.\nLa operación bit a bit AND hace el paso de la red: el resultado es 1 solamente cuando ambos bits son 1. Con máscara 1, conserva el bit de la IP; con máscara 0, produce 0. No es una suma decimal. En la figura puedes recorrer cada transformación antes de continuar.",
      "de": "Ein PC besitzt 192.168.40.77/27. Gesucht ist sein bestehendes Netz, kein neues. /27 umfasst drei volle Oktette und drei Bit des vierten. Dort lautet die Maske 11100000 = 224; insgesamt 255.255.255.224. Es bleiben fünf Hostbits.\n77 lautet binär 01001101: 64 + 8 + 4 + 1. Die ersten drei Netzbits werden getrennt: 010 | 01101. Für die Netzadresse bleiben 010 erhalten; der Hostteil wird durch fünf Nullen ersetzt: 010 | 00000. Das ergibt 64. Die ersten drei Oktette ändern sich nicht: Netzadresse 192.168.40.64.\nFür den Broadcast bleiben 010 erhalten, während die fünf Hostbits auf 1 gesetzt werden: 010 | 11111. 64 + 16 + 8 + 4 + 2 + 1 = 95. Broadcast: 192.168.40.95. Der Hostbereich reicht von 192.168.40.65 bis 192.168.40.94. Nutzbar sind 2⁵ − 2 = 30 Adressen.\nDie bitweise AND-Verknüpfung führt den Schritt zur Netzadresse aus: Nur wenn beide Bit 1 sind, ist das Ergebnis 1. Ein Maskenbit 1 erhält das IP-Bit; ein Maskenbit 0 setzt das Ergebnis auf 0. Es ist keine Dezimaladdition. In der Abbildung lassen sich die Umwandlungen einzeln durchgehen."

  {
    "title": {
      "es": "El atajo por bloques tiene una razón",
      "de": "Die Abkürzung mit Blöcken hat einen Grund"

    "body": {
      "es": "En /27 hay cinco bits de host en el cuarto octeto. Sus valores van de 00000 a 11111: de 0 a 31. Para una misma parte de red forman 32 direcciones consecutivas. Cuando termina ese bloque, cambia la parte de red y empieza el siguiente. Por eso los bloques empiezan en 0, 32, 64, 96, 128, 160, 192 y 224.\n77 está entre 64 y 95. El inicio de su bloque es 64, la dirección de red. El siguiente bloque empieza en 96; una dirección antes está el broadcast: 95. El primer host es 65 y el último 94. Así obtenemos el mismo resultado que con los bits.\nEn el octeto donde está la frontera, el tamaño del paso se calcula como 256 menos el valor de la máscara. Aquí: 256 − 224 = 32. ¿Por qué 256? Un octeto contiene 256 valores incluyendo el cero. Los ceros finales de la máscara determinan cuántos valores caben en cada bloque. Si son cinco, el bloque contiene 2⁵ = 32 valores; los unos anteriores suman 256 − 32 = 224.\nEl broadcast de un bloque es inicio + tamaño − 1. Restamos uno porque el inicio ya cuenta como primera dirección. Por ejemplo, de 64 a 95 hay 95 − 64 + 1 = 32 direcciones. De 64 a 96 habría 33 y entraríamos en la red siguiente.",
      "de": "Bei /27 liegen fünf Hostbits im vierten Oktett. Ihre Werte reichen von 00000 bis 11111, also 0 bis 31. Bei gleichem Netzanteil ergeben sie 32 aufeinanderfolgende Adressen. Danach ändert sich der Netzanteil und der nächste Block beginnt. Die Blöcke starten deshalb bei 0, 32, 64, 96, 128, 160, 192 und 224.\n77 liegt zwischen 64 und 95. Der Blockanfang 64 ist die Netzadresse. Der nächste Block beginnt bei 96; eine Adresse davor liegt der Broadcast 95. Erster Host: 65, letzter Host: 94. Das Ergebnis entspricht der Bitberechnung.\nIm Oktett mit der Grenze ist die Schrittweite 256 minus Maskenwert. Hier: 256 − 224 = 32. Warum 256? Ein Oktett enthält einschließlich Null 256 Werte. Die abschließenden Maskennullen bestimmen die Zahl der Werte pro Block. Fünf Nullen ergeben 2⁵ = 32 Werte; die vorherigen Einsen summieren sich zu 256 − 32 = 224.\nDer Broadcast eines Blocks ist Anfang + Größe − 1. Eins wird abgezogen, weil der Anfang bereits als erste Adresse mitzählt. Von 64 bis 95 sind es 95 − 64 + 1 = 32 Adressen. Von 64 bis 96 wären es 33; die letzte gehörte schon zum nächsten Netz."

      "es": "Cuando la frontera cae en el tercer octeto",

    "body": {
      "es": "Ahora el PC tiene 10.44.173.92/19. /19 significa dos octetos completos de red (16 bits) y tres bits más en el tercer octeto. La máscara es 255.255.224.0. Hay cinco bits de host en el tercer octeto y ocho en el cuarto: trece en total.\nEl paso del tercer octeto es 256 − 224 = 32. Sus bloques empiezan en 0, 32, 64, 96, 128, 160, 192 y 224. El valor 173 está en 160–191. Para la dirección de red elegimos 160 y ponemos el cuarto octeto en 0, porque también es completamente de host: 10.44.160.0.\nPara el broadcast usamos el final del bloque, 191, y ponemos el cuarto octeto en 255: 10.44.191.255. El primer host es 10.44.160.1 y el último 10.44.191.254. No conservamos el 92 original: para encontrar los extremos debemos cambiar todos los bits de host.\nEn binario, 173 es 101 | 01101. La red conserva 101 y pone 00000: 160. El broadcast conserva 101 y pone 11111: 191. El bloque abarca 32 valores del tercer octeto y 256 del cuarto: 32 × 256 = 8192 direcciones. Es lo mismo que 2¹³. Quitando los dos extremos quedan 8190 hosts utilizables.",
      "de": "Jetzt besitzt der PC 10.44.173.92/19. /19 bedeutet zwei vollständige Netzoktette mit 16 Bit und drei weitere Netzbits im dritten Oktett. Maske: 255.255.224.0. Im dritten Oktett bleiben fünf Hostbits, im vierten acht: insgesamt dreizehn.\nDie Schrittweite im dritten Oktett ist 256 − 224 = 32. Die Blöcke beginnen bei 0, 32, 64, 96, 128, 160, 192 und 224. 173 liegt in 160–191. Für die Netzadresse wählen wir 160 und setzen das vierte Oktett auf 0, da es ebenfalls vollständig zum Hostanteil gehört: 10.44.160.0.\nFür den Broadcast verwenden wir das Blockende 191 und setzen das vierte Oktett auf 255: 10.44.191.255. Erster Host: 10.44.160.1; letzter Host: 10.44.191.254. Die ursprüngliche 92 bleibt nicht erhalten: Für die Endpunkte ändern wir alle Hostbits.\nBinär lautet 173: 101 | 01101. Das Netz behält 101 und setzt 00000: 160. Der Broadcast behält 101 und setzt 11111: 191. Der Block umfasst 32 Werte im dritten und 256 im vierten Oktett: 32 × 256 = 8192 Adressen, gleich 2¹³. Nach Abzug der beiden Endpunkte bleiben 8190 nutzbare Hosts."

    "title": {
      "es": "Subnetting: dividir para organizar una red",
      "de": "Subnetting: ein Netz zur Organisation aufteilen"
    },
    "body": {
      "es": "Una empresa quiere separar oficina, almacén, invitados y servidores. Subnetting significa dividir un bloque de direcciones en subredes menores. Cada subred tiene su propia dirección de red y su propio rango. Esto permite planificar direcciones por función y enrutar entre las redes.\nPara separar también el tráfico local se crean segmentos físicos o VLANs. Una VLAN es una agrupación lógica de puertos de un switch. Cada segmento puede usar su propia subred. Cambiar solamente la máscara no crea por sí solo una separación segura en un switch compartido. Las reglas de acceso entre segmentos deben configurarse en routers o firewalls.\nVamos a dividir 192.168.40.0/24 en cuatro subredes iguales. El bloque original tiene 256 direcciones. Dividimos 256 ÷ 4 = 64 direcciones por bloque. Empiezan en .0, .64, .128 y .192. Cada bloque termina justo antes del siguiente: .63, .127, .191 y .255.\nPara identificar cuatro bloques necesitamos dos bits: 00, 01, 10 y 11. Esos dos bits pasan de host a red. El prefijo crece de /24 a /26. Quedan seis bits de host; cada subred tiene 64 direcciones totales y 62 utilizables. Más subredes significa menos direcciones en cada una, dentro del mismo bloque original.",
      "de": "Ein Betrieb möchte Büro, Lager, Gäste und Server aufteilen. Subnetting teilt einen Adressblock in kleinere Subnetze. Jedes erhält eine eigene Netzadresse und einen eigenen Bereich. Dadurch lassen sich Adressen nach Funktionen planen und Pakete zwischen den Netzen routen.\nUm auch den lokalen Verkehr zu trennen, werden physische Segmente oder VLANs eingerichtet. Ein VLAN ist eine logische Gruppe von Switchports. Jedes Segment kann ein eigenes Subnetz verwenden. Eine geänderte Maske allein schafft auf einem gemeinsam genutzten Switch keine sichere Trennung. Zugriffsregeln zwischen Segmenten müssen in Routern oder Firewalls eingerichtet werden.\nWir teilen 192.168.40.0/24 in vier gleich große Subnetze. Der ursprüngliche Block besitzt 256 Adressen. 256 ÷ 4 = 64 Adressen pro Block. Sie beginnen bei .0, .64, .128 und .192 und enden unmittelbar vor dem nächsten Block: .63, .127, .191 und .255.\nFür vier Blöcke brauchen wir zwei Kennzeichnungsbits: 00, 01, 10 und 11. Diese wechseln vom Host- in den Netzanteil. Das Präfix wächst von /24 auf /26. Es bleiben sechs Hostbits mit 64 Gesamtadressen und 62 nutzbaren Adressen je Subnetz. Mehr Subnetze bedeuten im selben Ausgangsblock weniger Adressen pro Subnetz."

    "title": {
      "es": "Elegir el tamaño según las interfaces necesarias",
      "de": "Die Größe nach dem Schnittstellenbedarf wählen"
    },
    "body": {
      "es": "No todas las tareas te dan un prefijo. A veces debes elegir la subred más pequeña que admita los equipos pedidos. Cuenta todas las interfaces que necesitan IP: PCs, impresoras, servidores y la interfaz del router. Una reserva de crecimiento se añade solo si la tarea la pide.\nUn almacén necesita cinco PCs y un gateway: seis direcciones utilizables. Probamos tamaños desde el menor: con dos bits de host hay 2² − 2 = 2, insuficiente; con tres hay 2³ − 2 = 6, suficiente. Elegimos tres bits de host. Como la dirección tiene 32 bits, el prefijo es 32 − 3 = 29. La máscara es 255.255.255.248.\nOtra oficina necesita 29 PCs, una impresora y un gateway: 31 interfaces. /27 permite 30 y falla por una dirección. /26 permite 62 y es la subred más pequeña que cumple. No elegimos /27 por ver el número 32: ese es su total, no sus hosts utilizables.\nCuando se solicitan subredes iguales, comprueba también cuántas caben. En /24, cuatro subredes /26 caben exactamente. Pero cuatro departamentos con 70 interfaces cada uno exigirían cuatro /25 de 128 direcciones: 512 en total. No caben en el bloque de 256. Hay que declarar que el bloque disponible es insuficiente, no solapar las subredes.",
      "de": "Nicht jede Aufgabe gibt das Präfix vor. Manchmal ist das kleinste Subnetz zu wählen, das den Bedarf deckt. Zählen Sie alle Schnittstellen mit IP-Bedarf: PCs, Drucker, Server und Router-Schnittstelle. Eine Wachstumsreserve wird nur hinzugefügt, wenn sie verlangt ist.\nEin Lager benötigt fünf PCs und ein Gateway, also sechs nutzbare Adressen. Wir prüfen aufsteigende Größen: Zwei Hostbits liefern 2² − 2 = 2, zu wenig; drei liefern 2³ − 2 = 6, ausreichend. Drei Hostbits bleiben. Bei insgesamt 32 Bit ist das Präfix 32 − 3 = 29, die Maske 255.255.255.248.\nEin anderes Büro braucht 29 PCs, einen Drucker und ein Gateway: 31 Schnittstellen. /27 bietet 30 und ist um eine Adresse zu klein. /26 bietet 62 und ist das kleinste passende Subnetz. Die Zahl 32 bei /27 zählt die Gesamtadressen, nicht die nutzbaren Hosts.\nBei gleich großen Subnetzen ist zusätzlich ihre Anzahl zu prüfen. Vier /26 passen genau in ein /24. Vier Abteilungen mit jeweils 70 Schnittstellen bräuchten jedoch vier /25 mit je 128 Gesamtadressen: insgesamt 512. Sie passen nicht in den Block mit 256. Der Adressblock ist dann als unzureichend zu benennen; Subnetze dürfen sich nicht überlappen."

    "title": {
      "es": "Comprobar si el destino es local",
      "de": "Prüfen, ob das Ziel lokal ist"
    },
    "body": {
      "es": "El PC 192.168.40.77/27 quiere enviar datos a 192.168.40.90. Calcula ambas direcciones de red con su máscara. Ya sabemos que .77 está en la red .64/27; .90 también está en el bloque .64–.95. El destino se considera local y el PC puede entregar por el enlace local.\nAhora el destino es 192.168.40.100. Está en el bloque .96–.127, por tanto su red es 192.168.40.96/27. El PC necesita una ruta hacia esa red, normalmente a través de su gateway. Que coincidan los tres primeros octetos no basta para decir que son de la misma subred.\nSupón que el gateway del PC es 192.168.40.65. Está en la misma subred y es una dirección de host válida. El PC puede alcanzarlo localmente. El router debe tener, además, una ruta y las reglas que permitan llegar al destino. Una IP de gateway no puede elegirse al azar: debe ser la dirección real de una interfaz del router.\nEn Ethernet, ARP es el protocolo que averigua la dirección MAC local correspondiente a una IPv4. Para un destino remoto se busca la MAC del gateway, no la MAC remota. Sin NAT, el paquete IPv4 conserva la IP del destino final; la entrega local al router usa su MAC. Aquí basta con distinguir la decisión de red del siguiente salto.",
      "de": "Der PC 192.168.40.77/27 möchte an 192.168.40.90 senden. Er bestimmt beide Netzadressen mit seiner Maske. .77 liegt in .64/27; .90 ebenfalls im Block .64–.95. Das Ziel gilt als lokal und kann über den lokalen Link erreicht werden.\nDas nächste Ziel ist 192.168.40.100. Es liegt im Block .96–.127 und damit in 192.168.40.96/27. Der PC benötigt eine Route dorthin, normalerweise über sein Gateway. Drei gleiche Anfangsoktette reichen nicht als Nachweis für dasselbe Subnetz.\nDas Gateway des PCs sei 192.168.40.65. Es liegt im selben Subnetz und ist eine gültige Hostadresse. Der PC kann es lokal erreichen. Zusätzlich braucht der Router eine Route zum Ziel sowie passende Zugriffsregeln. Eine Gateway-IP darf nicht beliebig gewählt werden: Sie muss die tatsächliche Adresse einer Router-Schnittstelle sein.\nBei Ethernet ermittelt ARP die lokale MAC-Adresse zu einer IPv4-Adresse. Für ein entferntes Ziel wird die MAC des Gateways gesucht, nicht die entfernte MAC. Ohne NAT behält das IPv4-Paket die IP des endgültigen Ziels; die lokale Übergabe an den Router nutzt dessen MAC. Entscheidend ist hier die Unterscheidung zwischen Zielnetz und nächstem Hop."

  {
    "title": {
      "es": "La excepción /31 y la dirección individual /32",
      "de": "Die Ausnahme /31 und die einzelne Adresse /32"
    },
    "body": {
      "es": "Hasta aquí usamos subredes convencionales con red y broadcast reservados. En un enlace punto a punto hay exactamente dos extremos. RFC 3021 permite usar /31 en ese caso: queda un bit y sus dos valores identifican los dos extremos. No se reservan direcciones separadas de red y broadcast para ese enlace.\nEn 10.8.0.0/31 se pueden usar 10.8.0.0 y 10.8.0.1 como direcciones de los extremos. No calcules 2¹ − 2 = 0: esa fórmula no corresponde a este caso especial. Un LAN convencional con dos hosts usaría normalmente /30: cuatro direcciones totales, dos utilizables. Para /31, el enunciado debe especificar el contexto punto a punto y el soporte correspondiente.\nSi un bloque /24 se divide íntegramente en enlaces /31, sus 256 direcciones se agrupan de dos en dos: 256 ÷ 2 = 128 enlaces. Otra forma de contar: el prefijo aumenta siete posiciones, de 24 a 31; siete bits distinguen 2⁷ = 128 enlaces. Cada enlace utiliza dos direcciones.\n/32 tiene cero bits de host: identifica una sola dirección, no un LAN con varios participantes. Puede aparecer como ruta hacia un host o dirección de una interfaz virtual de loopback. Tampoco se aplica «menos dos». Estos dos casos explican por qué hay que leer el contexto antes de usar una fórmula.",
      "de": "Bisher wurden konventionelle Subnetze mit reservierter Netz- und Broadcast-Adresse betrachtet. Eine Punkt-zu-Punkt-Verbindung hat genau zwei Endpunkte. RFC 3021 erlaubt dort /31: Ein Bit bleibt, dessen zwei Werte die beiden Endpunkte kennzeichnen. Es werden keine separaten Netz- und Broadcast-Adressen reserviert.\nBei 10.8.0.0/31 sind 10.8.0.0 und 10.8.0.1 als Endpunktadressen nutzbar. 2¹ − 2 = 0 ist hier nicht anzuwenden. Ein konventionelles LAN mit zwei Hosts nutzt normalerweise /30: vier Gesamtadressen, zwei nutzbar. Für /31 muss die Aufgabe den Punkt-zu-Punkt-Kontext und die entsprechende Unterstützung festlegen.\nWird ein /24 vollständig in /31-Verbindungen aufgeteilt, werden seine 256 Adressen paarweise verwendet: 256 ÷ 2 = 128 Verbindungen. Alternativ wächst das Präfix um sieben Stellen von 24 auf 31; sieben Bit unterscheiden 2⁷ = 128 Verbindungen mit jeweils zwei Adressen.\n/32 hat keine Hostbits und bezeichnet genau eine Adresse, kein LAN mit mehreren Teilnehmern. Es kann als Hostroute oder als Adresse einer virtuellen Loopback-Schnittstelle auftreten. Auch hier ist „minus zwei“ unzulässig. Beide Sonderfälle zeigen, warum vor einer Formel der Kontext gelesen werden muss."

    "title": {
      "es": "VLSM: subredes de tamaños distintos",
      "de": "VLSM: unterschiedlich große Subnetze"
    },
    "body": {
      "es": "Si los departamentos tienen necesidades distintas, darles bloques iguales puede desperdiciar direcciones. VLSM significa Variable Length Subnet Mask: máscaras de distinta longitud para las subredes de un mismo bloque. Usamos lo aprendido para elegir el tamaño de cada una y situarlas sin solapamientos.\nEn 192.168.60.0/24 necesitamos 90, 45, 20 y 10 interfaces en total por área, incluidos los gateways. Los tamaños mínimos son /25 (126 hosts), /26 (62), /27 (30) y /28 (14). Sus bloques ocupan 128 + 64 + 32 + 16 = 240 direcciones, que caben en las 256 disponibles.\nPara dejar el espacio libre al final, colocamos de mayor a menor. El primer bloque es .0/25 y termina en .127. El segundo empieza en .128/26 y termina en .191. Sigue .192/27 hasta .223. El último es .224/28 hasta .239. Queda .240/28 libre.\nCada inicio debe respetar su tamaño: un /26 comienza en un múltiplo de 64 dentro del cuarto octeto; un /27, en un múltiplo de 32. No puedes poner .130/26 después de otro bloque: .130 pertenece realmente al bloque .128/26. Comprueba el rango completo, no solo la dirección inicial. En la tabla se muestran todos los extremos para comprobar que una red no invade otra.",
      "de": "Bei unterschiedlichem Bedarf können gleich große Blöcke Adressen verschwenden. VLSM bedeutet Variable Length Subnet Mask: Subnetze eines Ausgangsblocks erhalten unterschiedlich lange Masken. Mit den bekannten Verfahren wählen wir die Größen und ordnen sie ohne Überlappung an.\nAus 192.168.60.0/24 werden Bereiche mit insgesamt 90, 45, 20 und 10 Schnittstellen einschließlich Gateways benötigt. Die Mindestgrößen sind /25 mit 126 Hosts, /26 mit 62, /27 mit 30 und /28 mit 14. Sie belegen 128 + 64 + 32 + 16 = 240 der verfügbaren 256 Adressen.\nDamit der freie Bereich am Ende liegt, ordnen wir absteigend nach Größe. Der erste Block ist .0/25 bis .127. Danach folgt .128/26 bis .191, dann .192/27 bis .223 und schließlich .224/28 bis .239. .240/28 bleibt frei.\nJeder Anfang muss zur Blockgröße passen: /26 beginnt im vierten Oktett bei einem Vielfachen von 64, /27 bei einem Vielfachen von 32. .130/26 wäre kein neuer Block nach .128: Es gehört selbst zum Block .128/26. Prüfen Sie den vollständigen Bereich, nicht nur die Anfangsadresse. Die Tabelle enthält alle Endpunkte, damit Überschneidungen ausgeschlossen werden können."

  {
    "title": {
      "es": "Resolver la tarea y explicarla en alemán",
      "de": "Die Aufgabe lösen und auf Deutsch begründen"
    },
    "body": {
      "es": "En una tabla de examen, distingue lo que te dan y lo que debes hallar. Si te dan una IP y un prefijo, identificas su red existente. Si te dan un bloque y necesidades, diseñas subredes dentro de él. «Ermitteln» pide determinar un resultado; «Berechnen Sie nachvollziehbar» pide mostrar el cálculo; «Erläutern» pide explicar la relación y su motivo.\nPara IP y prefijo: escribe la máscara, identifica el octeto de la frontera, encuentra el bloque y anota red, broadcast, primer host y último host. Después verifica que la IP esté dentro del rango y que la cantidad de direcciones coincida con los bits de host. Para planificación: cuenta interfaces, prueba capacidades, elige el prefijo y verifica que los bloques caben sin solaparse.\nUn ejemplo de justificación: «Das Präfix /27 lässt fünf Hostbits übrig. Damit gibt es 2⁵ = 32 Adressen, davon 30 nutzbare Hostadressen.» Significa: /27 deja cinco bits de host; hay 32 direcciones y 30 utilizables. La frase comunica el cálculo y distingue las dos cantidades.\nSesión de una hora: dedica unos 35 minutos a las explicaciones 1–14 y sus comprobaciones breves; unos 20 a los ejercicios 1, 4, 7, 11, 14 y 19; y cinco a revisar y exportar tus notas. Es una distribución de estudio propuesta: si un paso no está claro, repítelo. /31, VLSM y las demás tareas quedan como práctica extra. Puedes saltar libremente desde la barra lateral.",
      "de": "Unterscheiden Sie in einer Prüfungstabelle Vorgaben und gesuchte Größen. Mit IP und Präfix wird ein vorhandenes Netz bestimmt. Mit Ausgangsblock und Bedarf werden Subnetze geplant. „Ermitteln“ fordert ein Ergebnis, „Berechnen Sie nachvollziehbar“ den Rechenweg und „Erläutern“ eine Erklärung des Zusammenhangs und seines Grundes.\nFür IP und Präfix: Maske notieren, Grenzoktett bestimmen, Block finden und Netz, Broadcast, ersten sowie letzten Host angeben. Prüfen Sie danach, ob die IP im Bereich liegt und ob die Adresszahl zu den Hostbits passt. Bei Planung: Schnittstellen zählen, Kapazitäten prüfen, Präfix wählen und die Blöcke auf ausreichenden Platz und Überlappungen kontrollieren.\nEine mögliche Begründung lautet: „Das Präfix /27 lässt fünf Hostbits übrig. Damit gibt es 2⁵ = 32 Adressen, davon 30 nutzbare Hostadressen.“ Der Satz nennt die Herleitung und unterscheidet Gesamtadressen von nutzbaren Hosts.\nVorschlag für eine Stunde: etwa 35 Minuten für Erklärungen 1–14 mit kurzen Verständnisfragen, etwa 20 Minuten für Aufgaben 1, 4, 7, 11, 14 und 19 sowie fünf Minuten für Rückblick und Notizenexport. Das ist eine vorgeschlagene Lernaufteilung: Wiederholen Sie unklare Schritte. /31, VLSM und die übrigen Aufgaben bleiben Zusatzpraxis. Alle Seiten sind über die Seitenleiste frei erreichbar."
    },

function norm(s,kind){s=String(s).trim();if(kind==='prefix')s=s.replace(/^\//,'');if(kind==='binary')s=s.replace(/\s/g,'');if(['int','prefix'].includes(kind)){return /^\d+$/.test(s)?String(Number(s)):s}if(kind==='ip'){let a=s.split('.');return a.length===4&&a.every(v=>/^\d{1,3}$/.test(v)&&Number(v)<=255)?a.map(Number).join('.'):s}return s}
function result(q,a){const empty=q.fields.filter((f,i)=>!String(a.values[i]??'').trim()).length;const correct=q.fields.filter((f,i)=>String(a.values[i]??'').trim()&&norm(a.values[i],f.kind)===f.answer).length;return {empty,correct,total:q.fields.length}}
function lessonPage(l,i){return `<div class="kicker">${T('EXPLICACIÓN','ERKLÄRUNG')} ${String(i+1).padStart(2,'0')}${l.extra?' · '+T('Práctica extra','Zusatzpraxis'):''}</div><h1>${E(L(l.title))}</h1><div class="lesson-grid"><div class="prose">${paras(L(l.body))}</div>${fig(l,i)}</div><div class="remember"><details id="quickCheck"><summary>${T('Comprueba que lo entiendes: ','Verständnis prüfen: ')}${E(L(l.check))}</summary><div class="answer">${E(L(l.answer))}</div></details><div class="related">${T('Si necesitas practicar este paso:','Zum Üben dieses Schritts:')}<button id="relatedTask">${T('Ejercicio','Aufgabe')} ${[1,1,2,21,3,3,6,4,9,9,11,16,14,21,22,23,24][i]}</button></div></div>${notesBox(i)}`}

function answerControl(q,a,i,showLabel=false){const f=q.fields[i],v=a.values[i]??'',good=norm(v,f.kind)===f.answer&&String(v).trim();return `<div class="field">${showLabel?`<label for="f${i}">${E(L(f.label))}</label>`:''}${f.kind==='choice'?`<select id="f${i}" data-field="${i}" aria-label="${E(L(f.label))}"><option value="">${T('Selecciona una respuesta','Antwort auswählen')}</option>${f.options.map(([v,t])=>`<option value="${v}" ${a.values[i]===v?'selected':''}>${E(L(t))}</option>`).join('')}</select>`:`<input id="f${i}" data-field="${i}" aria-label="${E(L(f.label))}" type="text" autocomplete="off" spellcheck="false" ${['prefix','int'].includes(f.kind)?'inputmode="numeric"':''} value="${E(v)}">`}${a.checked?`<p class="fieldresult ${good?'good':'bad'}">${good?T('Correcto · 1 punto de resultado','Richtig · 1 Ergebnispunkt'):String(v).trim()?T('Revisar · 0 puntos de resultado','Überprüfen · 0 Ergebnispunkte'):T('Vacío · falta respuesta','Leer · Antwort fehlt')}</p>`:''}</div>`}

und Rechenweg')}</summary><p>${E(L(q.steps))}</p><div class="modelvalues">${q.fields.map(f=>`<div><span>${E(L(f.label))}</span><code>${f.kind==='choice'?E(L(f.options.find(x=>x[0]===f.answer)[1])):E(f.answer)}</code></div>`).join('')}</div>${q.prose?`<p>${E(L(q.prose.model))}</p>`:''}</details></div>${q.prose&&a.checked&&a.prose.trim()?`<section class="rubric" aria-label="${T('Valoración escrita','Textbewertung')}"><h2>${T('Comparar la explicación','Erklärung vergleichen')}</h2><p>${E(L(q.prose.model))}</p><p>${T('Marca un criterio solo si tu respuesta expresa toda esa idea. Si solo aparece el término sin explicación, no marques el punto. Esto es autoevaluación, no corrección automática.','Ein Kriterium nur markieren, wenn Ihre Antwort den gesamten Inhalt ausdrückt. Ein Begriff ohne Erklärung genügt nicht. Dies ist Selbstbewertung, keine automatische Textkorrektur.')}</p>${q.prose.criteria.map((c,i)=>`<label><input type="checkbox" data-criterion="${i}" ${a.criteria[i]?'checked':''}><span>${E(L(c))}</span></label>`).join('')}<div class="selfscore" aria-live="polite">${T('Autoevaluación escrita','Selbstbewertung des Textes')}: ${a.criteria.filter(Boolean).length} / ${q.prose.criteria.length}</div></section>`:''}</section>${notesBox(LESSONS.length+q.id-1)}`}
function sourcesPage(){return `<div class="kicker">${T('CONSULTA','NACHSCHLAGEN')}</div><h1>${T('Glosario y fuentes','Glossar und Quellen')}</h1><div class="sources"><section><h2>${T('Términos para responder en alemán','Begriffe für deutsche Antworten')}</h2><table><thead><tr><th>Deutsch</th><th>Español</th></tr></thead><tbody>${[['Netzadresse / Netz-ID','Dirección de red'],['Subnetzmaske','Máscara de subred'],['Präfixlänge','Longitud de prefijo'],['Hostbits','Bits de host'],['nutzbare Hostadressen','Direcciones de host utilizables'],['Broadcast-Adresse','Dirección de broadcast'],['Schrittweite / Blockgröße','Paso / tamaño de bloque'],['gleich große Subnetze','Subredes del mismo tamaño'],['Punkt-zu-Punkt-Verbindung','Enlace punto a punto'],['nachvollziehbar berechnen','Calcular mostrando los pasos']].map(([a,b])=>`<tr><td lang="de">${a}</td><td lang="es">${b}</td></tr>`).join('')}</tbody></table></section><section><h2>${T('Libros utilizados','Verwendete Bücher')}</h2><p>Zisler, Computer-Netzwerke, 7. Auflage (2022), ${T('capítulos','Abschnitte')} 3.4–3.5, PDF 143–162: ${T('direcciones, máscara, cálculo, rangos','Adressen, Maske, Berechnung, Bereiche')}.</p><p>Kersken, IT-Handbuch, 11. Auflage (2023), ${T('páginas','Seiten')} 278–289: CIDR, AND, subnetting, VLSM.</p><p>IT-Berufe · Grundstufe (2020), LF3, 3.4.7, ${T('páginas','Seiten')} 327–330 (PDF 51–54): ${T('analogía del reparto entre red y host, notación y comprobaciones','Vergleich von Netz- und Hostanteil, Notation und Verständnisfragen')}.</p><p>IT-Berufe · Fachstufe (2021), LF9, ${T('páginas','Seiten')} 327–330 (PDF 179–182): ${T('bits de red, de subred y de host; planificación por segmentos','Netz-, Subnetz- und Hostbits; Segmentplanung')}.</p></section><section><h2>${T('Modelos de tareas','Aufgabenformate')}</h2><p>AEN Sommer 2022 · 1 aa): ${T('tabla de red, primer/último host, broadcast y máscara','Tabelle mit Netz, erstem/letztem Host, Broadcast und Maske')}; 1 cc): ${T('contar enlaces /31 según RFC 3021' function renderNav(){let groups=[[T('Comprender · dirección y máscara','Verstehen · Adresse und Maske'),Array.from({length:6},(_,i)=>i)],[T('Calcular · red y broadcast','Berechnen · Netz und Broadcast'),Array.from({length:5},(_,i)=>i+6)],[T('Planificar y responder','Planen und antworten'),Array.from({length:6},(_,i)=>i+11)],...Array.from({length:4},(_,g)=>[T(['Práctica · fundamentos','Práctica · rangos','Práctica · planificación','Práctica · nivel examen'][g],['Üben · Grundlagen','Üben · Bereiche','Üben · Planung','Üben · Prüfungsniveau'][g]),QUESTIONS.filter(q=>q.group===g).map(q=>LESSONS.length+q.id-1)])];$('#nav').innerHTML=groups.map(([name,idx])=>`<details name="navsections" ${idx.includes(state.page)?'open':''}><summary>${name}</summary>${idx.map(i=>{const isQ=i>=LESSONS.length, item=isQ?QUESTIONS[i-LESSONS.length]:LESSONS[i];return `<button data-page="${i}" ${i===state.page?'aria-current="page"':''}><span class="num">${isQ?'A':''}${String(isQ?item.id:i+1).padStart(2,'0')}</span><span>${E(L(item.title))}</span></button>`}).join('')}</details>`).join('')+`<button class="sourceNav" data-page="${TOTAL-1}" ${state.page===TOTAL-1?'aria-current="page"':''}>${T('Glosario y fuentes','Glossar und Quellen')}</button>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(Number(b.dataset.page)));}
function updateExplorer(){const p=Number(state.explorer),h=32-p,mask=[0,1,2,3].map(i=>{const n=Math.max(0,Math.min(8,p-8*i));return n===0?0:256-2**(8-n)}).join('.');if($('#explorerResult'))$('#explorerResult').textContent=T(`/${p} → ${mask} · ${h} bits de host · ${2**h} direcciones totales`, `/${p} → ${mask} · ${h} Hostbits · ${2**h} Gesamtadressen`)}
function render(){document.documentElement.lang=state.lang;$('#skip').textContent=T('Saltar al contenido','Zum Inhalt springen');$('aside').setAttribute('aria-label',T('Navegación del taller','Workshop-Navigation'));$('#nav').setAttribute('aria-label',T('Índice','Inhaltsverzeichnis'));$('.langs').setAttribute('aria-label',T('Idioma','Sprache'));$('#brandSub').textContent=T('Desde cero · FISI AP2','Von Grund auf · FISI AP2');$('#export').textContent=T('Exportar respuestas y notas','Antworten & Notizen exportieren');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang)));$('[data-page-indicator]').textContent=`Seite ${state.page+1} / ${TOTAL}`;$('#progress').style.width=`${100*(state.page+1)/TOTAL}%`;$('#prev').disabled=state.page===0;$('#next').disabled=state.page===TOTAL-1;$('#prev').textContent=T('Anterior','Zurück');$('#next').textContent=T('Siguiente','Weiter');$('#footerText').textContent=T('Navegación libre por el índice. Todo funciona sin conexión.','Freie Navigation über das Inhaltsverzeichnis. Vollständig offline.');
const i=state.page;$('#content').innerHTML=i<LESSONS.length?lessonPage(LESSONS[i],i):i<TOTAL-1?exercisePage(QUESTIONS[i-LESSONS.length]):sourcesPage();renderNav();
$('#notes').oninput=e=>{state.notes[i]=e.target.value;persist()};
if(i<LESSONS.length){const l=LESSONS[i];if(l.fig.stepper){$('[data-step=next]').onclick=()=>{state.steps[i]=(state.steps[i]??0)+1;render()};$('#restart').onclick=()=>{state.steps[i]=0;render()}}$('#relatedTask').onclick=()=>go(LESSONS.length+[1,1,2,21,3,3,6,4,9,9,11,16,14,21,22,23,24][i]-1);if($('#explorer')){$('#explorer').oninput=e=>{state.explorer=Number(e.target.value);updateExplorer();persist()};updateExplorer()}}
else if(i<TOTAL-1){let q=QUESTIONS[i-LESSONS.length],a=qa(q);const invalidate=()=>{a.checked=false;a.criteria=[];$('#feedback').hidden=true;document.querySelectorAll('.fieldresult,.rubric').forEach(x=>x.remove());persist()};document.querySelectorAll('[data-field]').forEach(x=>x.oninput=e=>{a.values[Number(e.target.dataset.field)]=e.target.value;invalidate()});if($('#written'))$('#written').oninput=e=>{a.prose=e.target.value;invalidate()};$('#check').onclick=()=>{a.checked=true;render();$('#feedback').scrollIntoView({block:'nearest'})};$('#clear').onclick=()=>{state.answers[q.id]={values:[],prose:'',criteria:[],checked:false,hint:false,solution:false};render()};$('#hint').ontoggle=e=>{a.hint=e.target.open;persist()};$('#solution').ontoggle=e=>{a.solution=e.target.open;persist()};document.querySelectorAll('[data-criterion]').forEach(x=>x.onchange=e=>{a.criteria[Number(e.target.dataset.criterion)]=e.target.checked;$('.selfscore').textContent=T('Autoevaluación escrita','Selbstbewertung des Textes')+`: ${a.criteria.filter(Boolean).length} / ${q.prose.criteria.length}`;persist()})}persist();}
function go(i){state.page=Math.max(0,Math.min(TOTAL-1,i));render();window.scrollTo({top:0});$('#content').focus({preventScroll:true})}
$('#prev').onclick=()=>go(state.page-1);$('#next').onclick=()=>go(state.page+1);document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;render()});
$('#export').onclick=()=>{const payload={format:'ipv4-taller-v1',workshop:'2026-10-07',exportedAt:new Date().toISOString(),language:state.lang,exercises:QUESTIONS.map(q=>{const a=qa(q);return {id:q.id,title:q.title,reference:q.ref,answers:q.fields.map((f,i)=>({label:f.label,value:a.values[i]??''})),written:a.prose,checked:a.checked,exactResults:a.checked?result(q,a):null,selfAssessment:q.prose?{criteria:q.prose.criteria,marked:a.criteria,points:a.criteria.filter(Boolean).length}:null}}),notes:Object.entries(state.notes).map(([i,text])=>({page:Number(i)+1,title:Number(i)<LESSONS.length?LESSONS[Number(i)].title:Number(i)<TOTAL-1?QUESTIONS[Number(i)-LESSONS.length].title:{es:'Glosario y fuentes',de:'Glossar und Quellen'},text}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ipv4-respuestas-notas.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
