'use strict';
// Ein Modell liefert Bitzeilen, Grenzen, Felder und Musterlösungen.
function model(ip,prefix){const octets=ip.split('.').map(Number);if(octets.length!==4||octets.some(x=>!Number.isInteger(x)||x<0||x>255)||!Number.isInteger(prefix)||prefix<1||prefix>30)throw Error('Ungültiges Modell');const value=octets.reduce((a,x)=>a*256+x,0),size=2**(32-prefix),net=Math.floor(value/size)*size,bcast=net+size-1;const address=n=>[24,16,8,0].map(s=>Math.floor(n/2**s)%256).join('.');const bits=n=>n.toString(2).padStart(32,'0');return{ip,prefix,net:address(net),broadcast:address(bcast),first:address(net+1),last:address(bcast-1),mask:address(2**32-size),hostbits:32-prefix,hosts:size-2,size,ipbits:bits(value),maskbits:'1'.repeat(prefix)+'0'.repeat(32-prefix),netbits:bits(net),bcastbits:bits(bcast)};}
const examples={alternate:model('192.168.10.77',24),base:model('192.168.10.77',26),guided:model('192.168.10.77',26),solo:model('192.168.10.173',28),wide:model('172.16.5.77',23),wan:model('203.0.113.65',30),lan:model('172.16.0.0',16),dmz:model('10.10.0.0',26)};
const specs=[
{chapter:'Einstieg',type:'Orientieren',title:'Die Maske setzt die Grenzen',kind:'entry',es:'La máscara separa los bits de red de los bits de host. Así sabes qué direcciones puedes asignar a equipos. Aquí aprenderás a calcular los extremos y a explicar el mecanismo por escrito.'},
{chapter:'Verstehen',type:'Trennen',title:'Eine 1 hält fest. Eine 0 lässt frei.',kind:'mask',es:'Cada 1 de la máscara fija un bit de la red. Cada 0 deja variar un bit de host. /26 son 26 unos seguidos y 6 ceros; la separación puede estar dentro de un octeto.'},
{chapter:'Verstehen',type:'Verknüpfen',title:'UND löscht nur den Hostanteil',kind:'and',es:'La operación AND entre IP y máscara conserva los bits de red y pone a cero los de host. No es una suma. La red puede terminar en .64, no necesariamente en .0.'},
{chapter:'Verstehen',type:'Abgrenzen',title:'Zwei Randadressen bleiben reserviert',kind:'bounds',es:'Host bits todos cero: dirección de red. Todos uno: broadcast. Las direcciones entre los extremos se asignan a hosts. Aquí usamos redes normales de /1 a /30; /31 y /32 quedan fuera.'},
{chapter:'Anwenden',type:'Nachvollziehen',title:'Vom Auftrag zum fertigen Adressbereich',kind:'step',es:'Avanza tú el cálculo: máscara, red, broadcast y rango utilizable. Solo cambia el resultado que se está calculando; nada avanza automáticamente.'},
{chapter:'Anwenden',type:'Vervollständigen',title:'Ergänze die Grenzen mit sichtbaren Bits',kind:'exercise',key:'guided',fields:['hostbits','net','broadcast'],hint:'Die sechs Stellen rechts der Grenze sind Hostbits. Setze sie für das Netz auf 0, für den Broadcast auf 1.',es:'Ejercicio guiado: usa los seis bits visibles a la derecha del corte para obtener red y broadcast.'},
{chapter:'Üben',type:'Berechnen',title:'Jetzt ohne die ausgefüllten Bitzeilen',kind:'exercise',key:'solo',fields:['net','broadcast','first','last','hosts'],hint:'/28 lässt vier Hostbits. Der Bereich hat 16 Adressen. Finde den 16er-Block, in dem .173 liegt.',es:'Ya no hay filas binarias resueltas. Encuentra el bloque de 16 que contiene .173, reserva sus extremos y completa los campos.'},
{chapter:'Üben',type:'Übertragen',title:'Die Grenze folgt der Maske, nicht dem Punkt',kind:'exercise',key:'wide',fields:['mask','net','broadcast','hosts'],hint:'/23 endet im dritten Oktett. Sein letztes Bit und alle acht Bits des vierten Oktetts gehören zum Hostanteil.',es:'La misma regla sirve cuando la frontera está en el tercer octeto. /23 deja nueve bits de host y el rango atraviesa dos valores del tercer octeto.'},
{chapter:'Prüfungsaufgabe',type:'Ermitteln',title:'a) Drei Netze, drei Broadcast-Adressen',kind:'official',fields:['wan','lan','dmz'],hint:'Behalte in jedem Netz die Netzbits. Setze alle übrigen Bits auf 1. Beim LAN /16 betrifft das zwei Oktette.',es:'Tarea oficial Sommer 2024, AEN 1ab, 3 puntos: determina los broadcasts de los tres segmentos. Los datos proceden del plano original; solo se reorganiza su presentación.'},
{chapter:'Prüfungsaufgabe',type:'Erläutern',title:'b) Erkläre die Wirkung der Maske',kind:'written',key:'b',points:3,prompt:'Erläutern Sie, wie die Subnetzmaske aus 192.168.10.77/26 die Netzadresse bestimmt.',criteria:['1 P: Führende Einsen kennzeichnen die Netzbits; Nullen die Hostbits.','1 P: Bitweises UND erhält die Netzbits und setzt Hostbits auf null.','1 P: Ergebnis 192.168.10.64 mit unverändertem Netzanteil.'],solution:'Die Maske /26 hat 26 führende Einsen und sechs Nullen. Die Einsen kennzeichnen den Netzanteil. Beim bitweisen UND von IP-Adresse und Maske bleiben diese Bits erhalten; die sechs Hostbits werden null. Damit ergibt sich die Netzadresse '+examples.base.net+'.',es:'Escribe en alemán por qué AND produce la red. Compara tu respuesta con cada criterio y el modelo; no hay puntuación automática por palabras.'},
{chapter:'Prüfungsaufgabe',type:'Begründen',title:'c) Begründe die nutzbaren Host-Adressen',kind:'written',key:'c',points:2,prompt:'Begründen Sie, warum von den 64 Adressen des /26-Netzes nur 62 an Hosts vergeben werden können.',criteria:['1 P: Sechs Hostbits ergeben 2⁶ = 64 Kombinationen.','1 P: Alle Hostbits 0 = Netz; alle 1 = Broadcast. Zwei Adressen bleiben reserviert.'],solution:'Sechs Hostbits ermöglichen 2⁶ = 64 Adressen. Die Kombination mit ausschließlich Nullen bezeichnet das Netz; die Kombination mit ausschließlich Einsen den Broadcast. Beide werden nicht an Hosts vergeben. Daher bleiben '+examples.base.hosts+' nutzbare Host-Adressen.',es:'Justifica en alemán las 62 direcciones utilizables. La explicación debe conectar los seis bits con 64 combinaciones y con los dos extremos reservados.'}
];

function bitRow(label,bits,y,prefix,highlight=false){let out=`<text x="24" y="${y+25}" class="small">${label}</text>`;for(let n=0;n<32;n++){const x=168+n*23+(Math.floor(n/8)*8);out+=`<rect x="${x}" y="${y}" width="21" height="40" class="${highlight&&n>=prefix?'key':'node'}"/><text x="${x+10.5}" y="${y+25}" text-anchor="middle" class="bit">${bits[n]}</text>`;}return out;}
function bitsFigure(kind,m=examples.base){const boundary=168+m.prefix*23+Math.floor(m.prefix/8)*8-1;let inner=`<text x="168" y="32" class="small">${m.prefix} Netzbits: bleiben gleich</text><text x="${Math.min(boundary+16,770)}" y="32" class="small">${m.hostbits} Hostbits</text>`;inner+=bitRow('IP-Adresse',m.ipbits,64,m.prefix);inner+=bitRow('Maske /'+m.prefix,m.maskbits,136,m.prefix);if(kind==='mask'){inner+=`<path class="edge" d="M${boundary} 240H${boundary-144}"/><text x="${boundary-132}" y="220" class="el">legt die Grenze fest</text><text x="168" y="296" class="small">${m.ip} / ${m.prefix}</text><text x="520" y="296" class="small">Maske ${m.mask}</text>`;}else{inner+=bitRow(kind==='and'?'Netz (UND)':'Broadcast',kind==='and'?m.netbits:m.bcastbits,224,m.prefix,true);inner+=`<text x="168" y="328" class="small">${kind==='and'?m.net:m.broadcast} — Netzbits bleiben erhalten.</text>`;}inner+=`<line x1="${boundary}" y1="48" x2="${boundary}" y2="276" class="divider"/>`;return fig(inner,kind==='mask'?'Die Maske ordnet jede Bitposition dem Netz oder dem Host zu.':'Nur die Hostbits ändern sich; der Netzanteil bleibt erhalten.');}
