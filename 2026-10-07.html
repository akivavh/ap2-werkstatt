<script>
'use strict';
const VERSION='ipv4-2026-10-07-v1', KEY=VERSION;
const dot=n=>[24,16,8,0].map(s=>Math.floor(n/2**s)%256).join('.');
function ipv4(ip,prefix){if(!Number.isInteger(prefix)||prefix<16||prefix>30)throw Error('Nur /16 bis /30');const a=ip.split('.').map(Number);if(a.length!==4||a.some(v=>!Number.isInteger(v)||v<0||v>255))throw Error('Ungültige IPv4');const n=a.reduce((n,v)=>n*256+v,0),size=2**(32-prefix),base=Math.floor(n/size)*size;return {ip,prefix,mask:dot(2**32-size),network:dot(base),broadcast:dot(base+size-1),first:dot(base+1),last:dot(base+size-2),hosts:size-2,size,hostbits:32-prefix,base,n,ipbits:n.toString(2).padStart(32,'0'),maskbits:'1'.repeat(prefix)+'0'.repeat(32-prefix),netbits:base.toString(2).padStart(32,'0'),bcbits:(base+size-1).toString(2).padStart(32,'0')};}
const model={demo:ipv4('192.168.10.173',26),fade:ipv4('192.168.10.109',27),fresh:ipv4('192.168.10.230',28),exam:ipv4('192.168.40.78',28),official:[ipv4('203.0.113.65',30),ipv4('172.16.0.254',16),ipv4('10.10.0.1',26)]};
const specs={guided:{m:'demo',keys:['network','broadcast'],labels:['Netzadresse','Broadcast-Adresse'],hint:'Die ersten 26 Bits bleiben fest. Im letzten Oktett bleiben die beiden linken Bits 10. Setze die sechs Host-Bits zuerst auf 0, dann auf 1.'},fade:{m:'fade',keys:['mask','network','broadcast','hosts'],labels:['Subnetzmaske','Netzadresse','Broadcast-Adresse','Nutzbare Hosts'],hint:'Bei /27 bleiben fünf Host-Bits. Im letzten Oktett bleiben die drei linken Bits fest. Ein Block hat 2⁵ Adressen; zwei sind reserviert.'},fresh:{m:'fresh',keys:['first','last','hosts'],labels:['Erste Host-Adresse','Letzte Host-Adresse','Nutzbare Hosts'],hint:'Bei /28 bleiben vier Host-Bits. Ermittle die beiden reservierten Endpunkte. Der erste Host folgt auf die Netzadresse, der letzte liegt vor dem Broadcast.'},exam:{m:'exam',keys:['network','broadcast','hosts'],labels:['Netzadresse','Broadcast-Adresse','Nutzbare Hosts'],hint:'Bei /28 bleiben vier Host-Bits. Betrachte im letzten Oktett nur den Block, der die 78 enthält.'},official:{keys:['WAN','LAN','DMZ'],labels:['WAN: Broadcast','LAN: Broadcast','DMZ: Broadcast'],hint:'Behalte für jedes Netz die Präfix-Bits. Setze alle übrigen Bits auf 1. Im LAN gehören zwei vollständige Oktette zum Host-Anteil.'}};
let state={page:0,notes:'',records:{}},canSave=true,step=0;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===VERSION&&saved.state)state={...state,...saved.state};localStorage.setItem(KEY,JSON.stringify({version:VERSION,state}));}catch(e){canSave=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:VERSION,state}));canSave=true;}catch(e){canSave=false;}document.querySelector('#saveinfo').textContent=canSave?'FISI AP2 · 7. Oktober 2026':'Speichern blockiert: bitte exportieren.';document.querySelector('#savewarning').textContent=canSave?'Lokal in diesem Browser gespeichert. Exportieren sichert eine Datei.':'Lokales Speichern ist nicht möglich. Bitte Antworten und Notizen exportieren.';}
const rec=id=>state.records[id]||(state.records[id]={values:{},help:'ohne Hilfe',attempts:[],rubric:[]});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(x,y,s,cls='',anchor='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const rect=(x,y,w,h,hot=false)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="${hot?'hot':'box'}"/>`;
function svg(inner,w=1120,h=360,label=''){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs>${inner}</svg>`;}
function bitrow(bits,y,name,value,hot=false){let s=text(24,y+34,name)+text(200,y+34,value,'mono');for(let i=0;i<8;i++){let x=584+i*56;s+=rect(x,y,48,48,hot&&i>=model.demo.prefix-24)+text(x+24,y+30,bits[i],'bit','middle');}return s;}
function maskFigure(m=model.demo){let s=text(24,32,'24 Bits: drei vollständige Oktette','dim')+text(696,32,'Letztes Oktett: 8 Bits','dim');s+=text(24,72,'/26 = 26 Einsen, dann 6 Nullen','mono');s+=bitrow(m.ipbits.slice(24),112,'IPv4',m.ip,false)+bitrow(m.maskbits.slice(24),200,'Maske',m.mask,false);s+=`<path d="M692 100V264" stroke="#175caa" stroke-width="3" fill="none"/>`;s+=text(584,310,'Netz: 2 Bits fest','dim')+text(736,310,'Host: 6 Bits veränderbar','dim');return svg(s,1120,360,'Die Maske /26 trennt die ersten 26 Netz-Bits von sechs Host-Bits.');}
function relation(){const m=model.demo;let s=`<path class="edge" d="M360 88H520V136H584"/><path class="edge" d="M360 240H464V176H584"/><path class="edge" d="M784 156H920"/>`;s+=text(408,72,'verknüpft','el')+text(384,272,'grenzt ab','el')+text(816,132,'ergibt','el');s+=rect(48,48,312,80)+rect(48,200,312,80)+rect(584,112,200,88,true)+rect(920,112,176,88);s+=text(64,80,'IPv4-Adresse')+text(64,108,m.ip,'mono')+text(64,232,'Subnetzmaske')+text(64,260,m.mask,'mono')+text(608,148,'Bitweises UND')+text(608,176,'1 UND 1 = 1')+text(936,148,'Netzadresse')+text(936,176,m.network,'mono');s+=text(48,328,'0 UND 0 = 0')+text(320,328,'0 UND 1 = 0')+text(584,328,'1 UND 0 = 0')+text(856,328,'1 UND 1 = 1');return svg(s,1120,360,'Adresse und Maske werden bitweise UND-verknüpft. Nur zwei Einsen ergeben eine Eins.');}
function stepFigure(){const m=model.demo;const b=step===0?m.ipbits.slice(24):step===1?m.netbits.slice(24):m.bcbits.slice(24);const value=step===0?m.ip:step===1?m.network:m.broadcast;let s=text(24,40,'Netz-Bits bleiben immer erhalten.','dim');s+=bitrow(m.ipbits.slice(24),80,'Ausgangs-IP',m.ip,false)+bitrow(b,200,step===0?'Noch unverändert':step===1?'Host-Bits: alle 0':'Host-Bits: alle 1',value,step>0);s+=`<path d="M692 64V272" stroke="#175caa" stroke-width="3" fill="none"/>`;s+=text(584,320,'10 bleibt fest','dim')+text(760,320,step===0?'101101 wird ersetzt':step===1?'000000 ergibt Netz':'111111 ergibt Broadcast','dim');return svg(s,1120,360,`Schritt ${step+1}: ${value}. ${step===1?'Alle Host-Bits null.':step===2?'Alle Host-Bits eins.':'Ausgangsadresse.'}`);}
function rangeFigure(m,hide=false){const short=x=>x.split('.').slice(-1)[0];let s=text(24,40,`${m.ip} /${m.prefix}`,'mono')+text(24,72,`32 − ${m.prefix} = ${m.hostbits} Host-Bits`,'dim');s+=`<path d="M80 216H536" stroke="#526477" stroke-width="2" fill="none"/>`;s+=rect(32,104,128,80)+rect(200,104,208,80,true)+rect(448,104,128,80);s+=text(48,132,'Netz')+text(48,160,hide?'Host: 0…0':'.'+short(m.network),'mono')+text(224,132,'Nutzbare Hosts')+text(224,160,hide?'Host-Adressen':'.'+short(m.first)+' bis .'+short(m.last),'mono')+text(464,132,'Broadcast')+text(464,160,hide?'Host: 1…1':'.'+short(m.broadcast),'mono');s+=text(32,256,'reserviert','dim')+text(208,256,hide?'Netz + 1 bis Broadcast − 1':`${m.size} − 2 = ${m.hosts} Hosts`,'dim')+text(448,256,'reserviert','dim');s+=text(24,312,hide?'Zwei Randadressen gehören nicht zum Host-Bereich.':`Gemeinsamer Netzanteil: ${m.network} /${m.prefix}`,'dim');return svg(s,608,344,'Ein Adressblock hat zwei reservierte Endpunkte: Netzadresse und Broadcast. Hosts liegen dazwischen.');}
function fullRangeFigure(){const m=model.demo;let s=text(48,40,`${m.ip} /${m.prefix}`,'mono')+text(688,40,`${m.hostbits} Host-Bits: ${m.size} Adressen`,'dim');s+=rect(48,104,240,88)+rect(416,104,288,88,true)+rect(832,104,240,88);s+=text(72,136,'Netzadresse')+text(72,168,m.network,'mono')+text(440,136,'Nutzbare Host-Adressen')+text(440,168,'.'+m.first.split('.').at(-1)+' bis .'+m.last.split('.').at(-1),'mono')+text(856,136,'Broadcast-Adresse')+text(856,168,m.broadcast,'mono');for(let i=0;i<m.size;i++){const x=48+i*16;s+=rect(x,232,8,40,i===1||i===m.size-2);}s+=text(48,312,'Erste Adresse: reserviert','dim')+text(432,312,`${m.size} − 2 = ${m.hosts} Hosts`,'dim')+text(832,312,'Letzte Adresse: reserviert','dim');return svg(s,1120,360,'Ein Feld steht für eine Adresse: zwei reservierte Randadressen, dazwischen 62 Hosts.');}
function exerciseFigure(m,guided=false){let s=text(24,40,`${m.ip} /${m.prefix}`,'mono')+text(24,76,guided?`Maske: ${m.mask}`:'Die Maske bestimmt die Grenze.','dim');const net=m.prefix-24;for(let i=0;i<8;i++){let x=24+i*72;s+=rect(x,112,64,64,guided&&i>=net)+text(x+32,150,m.ipbits.slice(24)[i],'bit','middle');s+=text(x+32,212,String(2**(7-i)),'dim','middle');}if(guided)s+=`<path d="M${24+net*72-4} 96V184" stroke="#175caa" stroke-width="3" fill="none"/>`;s+=text(24,260,guided?`Netz-Bits: ${m.ipbits.slice(24,24+net)} bleiben fest`:'Bitgewichte im letzten Oktett','dim')+text(24,304,guided?`Host-Bits: ${m.hostbits} Stellen werden ersetzt`:'Bestimme zuerst, welche Bits zum Host gehören.','dim');return svg(s,608,344,'Die acht Bits des letzten Oktetts mit den Bitgewichten 128 bis 1.');}
function officialFigure(){let s='';['WAN','LAN','DMZ'].forEach((name,i)=>{const m=model.official[i],y=24+i*104;s+=rect(24,y,152,80)+rect(216,y,368,80);s+=text(40,y+32,name)+text(40,y+60,`${m.hostbits} Host-Bits`,'dim')+text(232,y+32,`${m.ip} /${m.prefix}`,'mono')+text(232,y+60,m.mask,'mono');});return svg(s,608,344,'Drei Netze aus Anlage 1: WAN /30, LAN /16, DMZ /26.');}
function writtenFigure(kind){const m=model.exam;if(kind==='justify'){let s=text(24,40,`${m.ip} /${m.prefix}`,'mono');s+=rect(24,88,560,96,true)+text(48,124,`Vorgeschlagene Host-Adresse: ${m.broadcast}`,'mono')+text(48,156,`Letztes Oktett: ${m.bcbits.slice(24,28)} ${m.bcbits.slice(28)}`,'mono');s+=rect(24,224,240,72)+rect(312,224,272,72)+text(48,264,`Netz-Bits: ${m.bcbits.slice(24,m.prefix)}`)+text(336,264,`Host-Bits: ${m.bcbits.slice(m.prefix)}`);return svg(s,608,344,'Die vorgeschlagene Adresse 192.168.40.79 hat im /28-Netz ausschließlich Einsen im Host-Anteil.');}return rangeFigure(m,false);}
const pages=[
{chapter:'Verstehen',title:'Die Maske setzt die Grenze.',lead:'Eine IPv4-Adresse allein legt den Adressblock nicht fest. Die Einsen der Maske markieren den Netzanteil; die Nullen markieren den Hostanteil.',kind:'full',figure:maskFigure,caption:'Fig. 1 · /26 hält 26 Bits fest und lässt sechs Host-Bits frei.',es:'La máscara indica dónde se separa la dirección: los bits con máscara 1 pertenecen a la red; los bits con máscara 0 pertenecen al host. /26 significa 26 bits de red y 6 de host.'},
{chapter:'Verstehen',title:'UND entfernt den Hostanteil.',lead:'Bei Maske 1 bleibt das Adressbit erhalten. Bei Maske 0 wird das Ergebnis 0. So entsteht die Netzadresse.',kind:'full',figure:relation,caption:'Fig. 2 · Adresse UND Maske liefert den Anfang des Adressblocks.',es:'La operación AND conserva un bit de la IP cuando la máscara tiene 1. Si la máscara tiene 0, el resultado es 0. Así se obtiene la dirección de red.'},
{chapter:'Verstehen',title:'Nur die Host-Bits werden ersetzt.',lead:'Rechne das Beispiel selbst schrittweise durch: Alle Host-Bits 0 ergeben die Netzadresse. Alle Host-Bits 1 ergeben den Broadcast.',kind:'step',figure:stepFigure,caption:'Fig. 3 · Der Netzanteil bleibt bei beiden Grenzadressen gleich.',es:'El prefijo no cambia. Sustituye los seis bits de host por ceros para obtener la red; por unos para obtener el broadcast. Avanza cada paso manualmente.'},
{chapter:'Anwenden',title:'Die Hosts liegen zwischen den Grenzen.',lead:`${model.demo.hostbits} Host-Bits ergeben ${model.demo.size} Adressen. In diesem üblichen IPv4-Netz sind zwei Endpunkte reserviert. Es bleiben ${model.demo.hosts} Host-Adressen.`,kind:'full',figure:fullRangeFigure,caption:'Fig. 4 · Ein Feld = eine Adresse. Blau: erster und letzter Host; die beiden Randadressen bleiben reserviert.',es:'Los hosts utilizables están entre red y broadcast. Para este /26 hay 64 direcciones y 62 hosts. La regla de restar dos se usa aquí para redes normales; /31 y /32 no forman parte del taller.'},
{chapter:'Üben',title:'Fülle die beiden Grenzadressen aus.',lead:'Eigene Aufgabe, nicht offiziell IHK. Die Grenze und die Maske bleiben als Hilfe sichtbar.',kind:'exercise',id:'guided',figure:()=>exerciseFigure(model.demo,true),caption:'Fig. 5 · Behalte 10 und ersetze die sechs übrigen Bits.',es:'Usa la frontera marcada. Mantén los dos primeros bits del último octeto y sustituye el resto. Introduce red y broadcast como IPv4 decimal completa.'},
{chapter:'Üben',title:'Setze die Grenze jetzt selbst.',lead:`Eigene Aufgabe, nicht offiziell IHK. Berechne für ${model.fade.ip}/${model.fade.prefix} die Maske, beide Grenzen und die Anzahl nutzbarer Hosts.`,kind:'exercise',id:'fade',figure:()=>exerciseFigure(model.fade),caption:'Fig. 6 · Die Bitgewichte bleiben; die markierte Grenze entfällt.',es:'Ahora solo quedan los bits y sus pesos. /27 deja cinco bits de host. Calcula la máscara, red, broadcast y número de hosts sin una frontera dibujada.'},
{chapter:'Üben',title:'Bestimme einen neuen Host-Bereich.',lead:`Eigene Aufgabe, nicht offiziell IHK. Berechne für ${model.fresh.ip}/${model.fresh.prefix} die erste und letzte Host-Adresse sowie die Anzahl nutzbarer Hosts.`,kind:'exercise',id:'fresh',figure:()=>rangeFigure(model.fresh,true),caption:'Fig. 7 · Die Ergebnisse sind ausgeblendet; die Beziehung bleibt sichtbar.',es:'Obtén primero los extremos del bloque que contiene .230 con /28. La primera IP de host es red más uno; la última es broadcast menos uno.'},
{chapter:'Prüfungsaufgabe',title:'a) Berechnen Sie den Adressblock.',lead:`Ausgangssituation: Sie betreuen das Büro der Rheinblick GmbH. Ein PC erhält ${model.exam.ip}/${model.exam.prefix}. Berechnen Sie Netzadresse, Broadcast und nutzbare Hosts. Eigene Aufgabe, nicht offiziell IHK; 3 Punkte, orientierend.`,kind:'exercise',id:'exam',figure:()=>exerciseFigure(model.exam),caption:'Fig. 8 · Ein neues Netz, derselbe Rechenweg.',es:'Situación de examen propia: una oficina asigna .78/28 a un PC. Calcula red, broadcast y cantidad de hosts. Los puntos son orientativos, no oficiales.'},
{chapter:'Prüfungsaufgabe',title:'b) Beschreiben Sie die Rolle der Maske.',lead:`Rheinblick GmbH, PC ${model.exam.ip}/${model.exam.prefix}: Beschreiben Sie, wie die Maske die Netzadresse und den Broadcast festlegt. Eigene Aufgabe, nicht offiziell IHK; 3 Punkte, orientierend.`,kind:'written',id:'describe',figure:()=>writtenFigure('describe'),caption:'Fig. 9 · Formulieren Sie den Mechanismus, nicht nur die Zahlen.',es:'Explica en alemán qué bits fija la máscara y cómo obtienes red y broadcast. La respuesta libre se revisa con criterios por punto; no se evalúa automáticamente por palabras clave.'},
{chapter:'Prüfungsaufgabe',title:'c) Begründen Sie die Ablehnung von .79.',lead:`Rheinblick GmbH: Ein Kollege möchte ${model.exam.broadcast} einem weiteren PC im Netz des PCs ${model.exam.ip}/${model.exam.prefix} zuweisen. Begründen Sie, warum diese Adresse nicht als Host-Adresse verwendet wird. Eigene Aufgabe, nicht offiziell IHK; 2 Punkte, orientierend.`,kind:'written',id:'justify',figure:()=>writtenFigure('justify'),caption:'Fig. 10 · Die Host-Bits erklären, warum .79 reserviert ist.',es:'Justifica por qué .79 no sirve para otro PC en este /28: sus cuatro bits de host son 1; por ello es la dirección de broadcast del bloque.'},

{chapter:'Abschluss',title:'Sichern Sie Ihren Rechenweg.',lead:'Der Lernstand wird nicht als Beherrschung bewertet. Exportieren Sie Antworten, Versuche, Hilfen und Notizen für den nächsten Austausch.',kind:'summary',es:'Exporta las respuestas, los intentos y las notas. El registro indica sin ayuda, con pista o solución vista; no declara que hayas dominado el tema.'}
];
const rubrics={describe:['1 P: Maske: Einsen kennzeichnen Netz-Bits, Nullen Host-Bits.','1 P: Netzadresse: Netz-Bits bleiben; alle Host-Bits werden 0 (UND).','1 P: Broadcast: gleiche Netz-Bits; alle Host-Bits werden 1.'],justify:['1 P: /28 lässt vier Host-Bits; bei .79 sind sie alle 1.','1 P: .79 ist der reservierte Broadcast, keine Host-Adresse.']};
const writtenModels={describe:`Die Maske /${model.exam.prefix} setzt die ersten ${model.exam.prefix} Bits als Netzanteil fest. Die ${model.exam.hostbits} übrigen Bits sind der Hostanteil. Für die Netzadresse werden die Host-Bits auf 0 gesetzt (Adresse UND Maske): ${model.exam.network}. Für den Broadcast bleiben die Netz-Bits gleich und die Host-Bits werden auf 1 gesetzt: ${model.exam.broadcast}.`,justify:`Bei /${model.exam.prefix} gehören die letzten ${model.exam.hostbits} Bits zum Hostanteil. ${model.exam.broadcast.split('.').at(-1)} entspricht binär ${model.exam.bcbits.slice(24,28)} ${model.exam.bcbits.slice(28)}. Die Host-Bits sind somit alle 1. ${model.exam.broadcast} ist der Broadcast des Netzes ${model.exam.network}/${model.exam.prefix} und wird nicht einem PC als Host-Adresse zugewiesen.`};
function answer(id,key){return id==='official'?model.official[['WAN','LAN','DMZ'].indexOf(key)].broadcast:model[specs[id].m][key];}
function exercisePanel(id){const r=rec(id),s=specs[id];return `<section class="panel" aria-label="Antwortfelder"><h2>Ihre Ergebnisse</h2><div class="fields">${s.keys.map((k,i)=>`<div class="field"><label for="${id}-${k}">${s.labels[i]}</label><input id="${id}-${k}" data-answer="${k}" value="${esc(r.values[k]||'')}" autocomplete="off" spellcheck="false" aria-describedby="fb-${k}"><div class="feedback" id="fb-${k}" role="status">Noch nicht geprüft.</div></div>`).join('')}</div><div class="actions"><button class="primary" id="check">Felder prüfen</button><button id="hint">Hinweis</button><button id="solution">Lösung vergleichen</button></div><div id="aid" class="aid" hidden></div><p class="status" id="helpstatus">Bearbeitung: ${r.help}. Keine Aussage über Beherrschung.</p></section>`;}
function writtenPanel(id){const r=rec(id);return `<section class="panel written" aria-label="Schriftliche Antwort"><label for="written">Ihre Antwort auf Deutsch</label><textarea id="written" spellcheck="false">${esc(r.values.text||'')}</textarea><div class="actions"><button class="primary" id="review">Mit Kriterien vergleichen</button><button id="hint">Hinweis</button><button id="solution">Modellantwort</button></div><div id="rubric" class="rubric" hidden>${rubrics[id].map((x,i)=>`<label><input type="checkbox" data-rubric="${i}" ${r.rubric.includes(i)?'checked':''}><span>${x}</span></label>`).join('')}</div><div id="aid" class="aid" hidden></div><p class="status" id="helpstatus">Bearbeitung: ${r.help}. Selbstvergleich; keine automatische Bewertung.</p></section>`;}
function render(){state.page=Math.max(0,Math.min(pages.length-1,Number(state.page)||0));const p=pages[state.page];let body='';if(['full','step'].includes(p.kind)){body=`<div class="full"><figure class="diagram"><div class="stage" id="figure">${p.figure()}</div><figcaption>${p.caption}</figcaption>${p.kind==='step'?`<div class="stepbar"><button id="stepback" ${step===0?'disabled':''}>Schritt zurück</button><p id="stepcap" aria-live="polite">${stepCaption()}</p><button data-step="next" ${step===2?'disabled':''}>Nächster Rechenschritt</button></div>`:''}</figure></div>`;}else if(p.kind==='summary'){body=`<div class="sourcegrid"><article><h2>Quellen dieses Workshops</h2><p>Zisler · Computer-Netzwerke · 7. Auflage, 2022.</p><p>02_Zisler_Computer-Netzwerke_7A_2022.pdf<br>PDF 147–148, 153–155 · 3.5.2/3.5.3.</p><p>Offiziell: Sommer 2024, AEN, 1ab.<br>Aufgaben-PDF 2, Anlage PDF 3; Lösungshinweise PDF 2.</p><p>Bitzeilen: Zisler, Cisco, Elektronik-Kompendium.<br>Quellen-URLs und Details: Begleitreport.</p><p>Geltung: übliche IPv4-Netze /16 bis /30.<br>/31 und /32 sind ausgeschlossen.</p></article><article><h2>Antworten und Notizen</h2><div id="recordsummary"><p>Gespeicherte Rechenversuche: ${Object.keys(specs).reduce((n,id)=>n+rec(id).attempts.length,0)}.</p><p>Hilfestatus pro Aufgabe und schriftliche Selbstvergleiche sind in der Exportdatei enthalten.</p></div><label for="summarynotes">Eigene Notizen</label><textarea id="summarynotes">${esc(state.notes)}</textarea><div class="actions"><button class="primary" id="export2">Antworten und Notizen exportieren</button></div><p class="status">JSON-Datei · Antworten bleiben unverändert erhalten.</p></article></div>`;}else{body=`<div class="layout"><figure class="diagram"><div class="stage">${p.figure()}</div><figcaption>${p.caption}</figcaption></figure>${p.kind==='exercise'?exercisePanel(p.id):writtenPanel(p.id)}</div>`;}
document.querySelector('#main').innerHTML=`<div><p class="chapter">${p.chapter}</p><h1 id="title" tabindex="-1">${p.title}</h1></div><p class="intro">${p.lead}</p>${body}`;document.querySelector('[data-page-indicator]').textContent=`Seite ${state.page+1} / ${pages.length}`;document.querySelector('#progress').max=pages.length;document.querySelector('#progress').value=state.page+1;document.querySelector('[data-nav="prev"]').disabled=state.page===0;document.querySelector('[data-nav="next"]').disabled=state.page===pages.length-1;
if(p.kind==='step'){document.querySelector('[data-step="next"]').onclick=()=>{step++;render();};document.querySelector('#stepback').onclick=()=>{step--;render();};}
if(p.kind==='exercise')bindExercise(p.id);if(p.kind==='written')bindWritten(p.id);if(p.kind==='summary'){document.querySelector('#summarynotes').oninput=e=>{state.notes=e.target.value;save();};document.querySelector('#export2').onclick=exportData;}save();}
function stepCaption(){return ['Schritt 1 / 3 · Ausgangs-IP: Host-Bits noch unverändert.','Schritt 2 / 3 · Netzadresse: sechs Host-Bits werden 0.','Schritt 3 / 3 · Broadcast: sechs Host-Bits werden 1.'][step];}
function markHelp(id,level){const r=rec(id);if(level==='Lösung gesehen'||r.help!=='Lösung gesehen')r.help=level;document.querySelector('#helpstatus').textContent=`Bearbeitung: ${r.help}. ${pages[state.page].kind==='written'?'Selbstvergleich; keine automatische Bewertung.':'Keine Aussage über Beherrschung.'}`;save();}
function showAid(s){if(pages[state.page].kind==='written'&&s.split(/\s+/).length>40){document.querySelector('#modeltext').textContent=s;document.querySelector('#modeldialog').showModal();return;}const el=document.querySelector('#aid');el.textContent=s;el.hidden=false;}
function normal(v,isNum){v=v.trim();if(isNum)return /^\d+$/.test(v)?Number(v):null;const a=v.split('.');return a.length===4&&a.every(x=>/^\d{1,3}$/.test(x)&&+x<=255)?a.map(Number).join('.'):null;}
function errorAdvice(key,m){return {mask:`Zähle die führenden Einsen der Maske: /${m.prefix}.`,network:'Netzadresse: Alle Host-Bits müssen 0 sein. Die IP ist nicht automatisch die Netzadresse.',broadcast:'Broadcast: Setze alle Host-Bits auf 1; die Netz-Bits bleiben gleich.',first:'Die Netzadresse ist reserviert. Der erste Host ist Netzadresse + 1.',last:'Der Broadcast ist reserviert. Der letzte Host ist Broadcast − 1.',hosts:`${m.hostbits} Host-Bits ergeben 2^${m.hostbits} Adressen. Ziehe die beiden Randadressen ab.`}[key]||'Setze alle Host-Bits dieses Netzes auf 1. Behalte den Netzanteil.';}
function bindExercise(id){const r=rec(id),s=specs[id];document.querySelectorAll('[data-answer]').forEach(el=>el.oninput=()=>{r.values[el.dataset.answer]=el.value;const fb=document.querySelector('#fb-'+el.dataset.answer);fb.textContent='Geändert; erneut prüfen.';fb.className='feedback';el.removeAttribute('aria-invalid');save();});document.querySelector('#check').onclick=()=>{const results={};s.keys.forEach(k=>{const input=document.querySelector(`[data-answer="${k}"]`),raw=input.value,rval=normal(raw,k==='hosts'),ok=rval===answer(id,k),fb=document.querySelector('#fb-'+k);r.values[k]=raw;results[k]=ok;fb.className='feedback '+(ok?'good':'bad');fb.textContent=!raw.trim()?'Bitte zuerst ein Ergebnis eintragen.':ok?'Richtig.':rval===null?(k==='hosts'?'Bitte eine ganze Anzahl eintragen.':'Bitte vier Dezimalzahlen von 0 bis 255 mit Punkten eintragen.'):errorAdvice(k,id==='official'?model.official[s.keys.indexOf(k)]:model[s.m]);input.setAttribute('aria-invalid',String(!ok));});r.attempts.push({at:new Date().toISOString(),help:r.help,values:{...r.values},results});save();};document.querySelector('#hint').onclick=()=>{markHelp(id,'mit Hinweis');showAid(s.hint);};document.querySelector('#solution').onclick=()=>{markHelp(id,'Lösung gesehen');showAid((id==='official'?'Vergleich mit offiziellen Lösungshinweisen, PDF 2: ':'Eigene Lösung: ')+s.keys.map((k,i)=>`${s.labels[i]}: ${answer(id,k)}`).join(' · ')+(id==='official'?' Je korrekter Broadcast-Adresse 1 Punkt.':' Netz-Bits bleiben fest; die Randadressen sind reserviert.'));};}
function bindWritten(id){const r=rec(id);document.querySelector('#written').oninput=e=>{r.values.text=e.target.value;save();};document.querySelector('#review').onclick=()=>{if(!(r.values.text||'').trim()){showAid('Bitte zuerst eine Antwort auf Deutsch schreiben. Es erfolgt keine automatische Textbewertung.');return;}document.querySelector('#rubric').hidden=false;showAid('Prüfen Sie für jeden Punkt, ob Ihre Antwort den Sachverhalt richtig erklärt. Kreuzen Sie nur erfüllte Kriterien an; keine automatische Punktzahl.');r.attempts.push({at:new Date().toISOString(),help:r.help,text:r.values.text,rubric:[...r.rubric],type:'Selbstvergleich'});save();};document.querySelectorAll('[data-rubric]').forEach(el=>el.onchange=()=>{r.rubric=[...document.querySelectorAll('[data-rubric]:checked')].map(x=>+x.dataset.rubric);save();});document.querySelector('#hint').onclick=()=>{markHelp(id,'mit Hinweis');showAid(id==='describe'?'Beschreiben Sie zuerst, welche Bits die Maske festlegt. Erklären Sie danach getrennt die beiden möglichen Belegungen aller Host-Bits.':'Welche vier Bits gehören bei /28 zum Hostanteil? Welche Bedeutung hat der Zustand, wenn alle vier 1 sind?');};document.querySelector('#solution').onclick=()=>{markHelp(id,'Lösung gesehen');document.querySelector('#rubric').hidden=false;showAid(writtenModels[id]);};}
function exportData(){const payload={version:VERSION,topic:'IPv4: Maske, Netz, Broadcast, Hosts',exported:new Date().toISOString(),state,notice:'Hilfestatus ist keine Aussage über Beherrschung; schriftliche Kriterien sind eigene, nicht offizielle IHK-Bewertung.'};const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='IPv4-2026-10-07-Antworten.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function go(d){const target=state.page+d;if(target>=0&&target<pages.length){state.page=target;step=0;render();document.querySelector('#title').focus();}}
document.querySelector('[data-nav="prev"]').onclick=()=>go(-1);document.querySelector('[data-nav="next"]').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(1);}if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}});
document.querySelector('#spanish').onclick=()=>{document.querySelector('#estext').textContent=pages[state.page].es;document.querySelector('#esdialog').showModal();};document.querySelector('#closees').onclick=()=>document.querySelector('#esdialog').close();document.querySelector('#notes').onclick=()=>{document.querySelector('#notetext').value=state.notes;save();document.querySelector('#notedialog').showModal();};document.querySelector('#closenotes').onclick=()=>document.querySelector('#notedialog').close();document.querySelector('#notetext').oninput=e=>{state.notes=e.target.value;save();};document.querySelector('#export').onclick=exportData;
document.querySelector('#closemodel').onclick=()=>document.querySelector('#modeldialog').close();
render();
</script>
