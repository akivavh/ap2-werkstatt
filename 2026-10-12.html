<script>
const DATA={"lessons": [{"title": {"es": "Un disco puede fallar", "de": "Ein Laufwerk kann ausfallen"}, "body": {"es": "Un disco es un dispositivo que conserva datos incluso cuando apagamos el equipo. Puede ser un HDD, que usa superficies magnéticas y piezas móviles, o un SSD, que usa memoria electrónica. Ambos pueden fallar. Si una empresa guarda su única copia en un disco y este deja de responder, el servidor ya no puede leer esos datos.\n\nEl sistema no almacena una factura como una pieza indivisible. Guarda su contenido en pequeñas unidades. Aquí llamaremos bloque a una porción de datos de tamaño fijo. En los dibujos, A, B, C y D son bloques distintos de una misma secuencia. Un bloque de nuestro esquema puede representar un grupo de sectores; no es una escala física ni un tamaño real.\n\nRAID significa Redundant Array of Independent Disks: agrupa varios discos físicos para presentar al sistema una unidad lógica. Un controlador o el software decide dónde escribir y de dónde leer cada bloque. El nivel RAID indica la regla de reparto. Algunos niveles buscan rendimiento; otros añaden información para seguir trabajando ante fallos de discos. Antes de elegir, hay que entender esa regla.", "de": "Ein Laufwerk speichert Daten auch nach dem Ausschalten. Eine HDD verwendet magnetische Oberflächen und bewegliche Teile; eine SSD verwendet elektronischen Speicher. Beide können ausfallen. Liegt die einzige Kopie auf einem defekten Laufwerk, kann der Server diese Daten nicht mehr lesen.\n\nDas System speichert eine Rechnung in kleinen Einheiten. Ein Block bezeichnet hier einen Datenabschnitt fester Größe. A, B, C und D stehen in den Abbildungen für verschiedene Blöcke einer Folge. Ein gezeichneter Block kann mehrere Sektoren zusammenfassen. Die Zeichnung zeigt weder die physische Lage noch eine reale Blockgröße.\n\nRAID bedeutet Redundant Array of Independent Disks. Mehrere physische Laufwerke bilden für das System eine logische Einheit. Ein Controller oder eine Software bestimmt, wohin die Blöcke geschrieben und woher sie gelesen werden. Der RAID-Level legt die Verteilungsregel fest. Manche Level dienen der Leistung, andere ergänzen Informationen, damit Daten bei Laufwerksausfällen verfügbar bleiben. Zuerst muss diese Regel verstanden werden."}, "diagram": "single", "check": {"es": "Si el único disco con A–D falla, ¿de dónde se podrían leer esos bloques?", "de": "Woher könnten A–D gelesen werden, wenn ihr einziges Laufwerk ausfällt?"}, "answer": {"es": "No hay otra fuente dentro de este sistema. Haría falta otra copia o información redundante.", "de": "Innerhalb dieses Systems gibt es keine zweite Quelle. Eine weitere Kopie oder redundante Information wäre nötig."}}, {"title": {"es": "Qué añade la redundancia", "de": "Was Redundanz ergänzt"}, "body": {"es": "Repartir datos y proteger datos son decisiones diferentes. Si A está en un disco y B en otro, ambos trabajan, pero ninguno puede reemplazar al otro: contienen cosas distintas. Tener varios discos no basta para tolerar un fallo.\n\nRedundancia significa guardar información adicional que permita recuperar algo que falta. Podemos guardar otra copia de A, o información calculada a partir de varios bloques. Esa información consume espacio. Capacidad bruta es la suma del espacio de los discos activos; capacidad neta es el espacio para datos distintos después de reservar redundancia. Una copia repetida no cuenta como un nuevo dato útil.\n\nRendimiento indica cuánto trabajo se puede realizar por tiempo; disponibilidad, si los datos y el servicio se pueden usar. Trabajar en paralelo puede mejorar el rendimiento, pero no garantiza una velocidad exacta. Discos, controlador, tipo de acceso y carga influyen. La tolerancia a fallos que estudiaremos se refiere a discos: no promete que todo el servidor continúe si falla cualquier otra pieza.", "de": "Daten verteilen und Daten schützen sind verschiedene Entscheidungen. Liegt A auf einem Laufwerk und B auf einem anderen, können beide arbeiten. Keines ersetzt jedoch das andere: Sie enthalten unterschiedliche Daten. Mehrere Laufwerke allein bieten keine Fehlertoleranz.\n\nRedundanz ist zusätzliche Information, mit der Fehlendes wiederhergestellt werden kann. Dazu dient entweder eine weitere Kopie von A oder aus mehreren Blöcken berechnete Information. Das benötigt Speicherplatz. Bruttokapazität ist die Summe der aktiven Laufwerkskapazitäten. Nettokapazität ist der Platz für unterschiedliche Nutzdaten nach Abzug der Redundanz. Eine weitere Kopie zählt nicht als zusätzliche Nutzinformation.\n\nLeistung beschreibt die Arbeit pro Zeit; Verfügbarkeit beschreibt, ob Daten und Dienste nutzbar sind. Parallele Arbeit kann die Leistung erhöhen. Eine bestimmte Geschwindigkeit ist dadurch nicht garantiert: Laufwerke, Controller, Zugriffsmuster und Last wirken mit. Unsere Fehlertoleranz bezieht sich auf Laufwerksausfälle, nicht auf den Ausfall beliebiger anderer Serverkomponenten."}, "diagram": "compare", "check": {"es": "Dos discos de 4 TiB contienen la misma copia. ¿Son 8 TiB de datos distintos?", "de": "Zwei Laufwerke mit je 4 TiB enthalten dieselbe Kopie. Sind das 8 TiB unterschiedliche Nutzdaten?"}, "answer": {"es": "No: 8 TiB brutos, pero solo 4 TiB de datos distintos.", "de": "Nein: 8 TiB brutto, aber nur 4 TiB unterschiedliche Nutzdaten."}}, {"title": {"es": "RAID 0: repartir sin copia", "de": "RAID 0: verteilen ohne Kopie"}, "body": {"es": "Striping significa repartir por turnos porciones de datos entre discos. Una fila de porciones que ocupa todos los discos se llama stripe. En este dibujo de dos discos, A va al disco 1 y B al disco 2; después C al 1 y D al 2. Para leer la secuencia completa, el sistema vuelve a reunir A, B, C y D en su orden original.\n\nRAID 0 usa este reparto sin espejo ni paridad. Ambos discos pueden atender parte del trabajo en paralelo. Eso ayuda al rendimiento si el resto del sistema lo permite, pero no añade una copia. Si falla el disco 2, faltan B y D. Los bloques A y C siguen físicamente allí, pero el volumen completo ya no se puede utilizar normalmente.\n\nCon dos discos iguales de 4 TiB, cada uno guarda 4 TiB de datos distintos: suman 8 TiB netos. En el modelo habitual se necesitan al menos dos discos. RAID 0 tolera cero fallos de disco. Tiene sentido para datos temporales que se pueden regenerar, si se acepta perder el volumen. No sirve cuando se exige seguir trabajando después de un fallo.", "de": "Striping verteilt Datenabschnitte abwechselnd auf mehrere Laufwerke. Eine Reihe von Abschnitten über alle Laufwerke heißt Stripe. In unserer Zeichnung mit zwei Laufwerken liegt A auf Laufwerk 1 und B auf Laufwerk 2; anschließend C auf 1 und D auf 2. Beim Lesen setzt das System A, B, C und D wieder in der richtigen Reihenfolge zusammen.\n\nRAID 0 verwendet dieses Verfahren ohne Spiegelung und ohne Parität. Die Laufwerke können Teile der Arbeit parallel erledigen. Das kann die Leistung verbessern, erzeugt aber keine Kopie. Fällt Laufwerk 2 aus, fehlen B und D. A und C sind physisch noch vorhanden, das vollständige Volume ist jedoch normalerweise nicht mehr nutzbar.\n\nZwei gleiche Laufwerke mit je 4 TiB speichern jeweils 4 TiB unterschiedliche Daten: insgesamt 8 TiB netto. Im üblichen Modell sind mindestens zwei Laufwerke nötig. RAID 0 toleriert keinen Laufwerksausfall. Es eignet sich etwa für wiederherstellbare temporäre Daten, wenn ein Volumeverlust akzeptabel ist. Bei geforderter Verfügbarkeit nach einem Ausfall ist RAID 0 ungeeignet."}, "diagram": "r0", "check": {"es": "¿Hay algo que permita reconstruir B si falla el disco 2?", "de": "Gibt es Information zur Wiederherstellung von B bei Ausfall von Laufwerk 2?"}, "answer": {"es": "No. Repartir no es duplicar. Por eso la capacidad completa no viene con protección.", "de": "Nein. Verteilen ist kein Duplizieren. Die volle Kapazität bedeutet hier keinen Ausfallschutz."}}, {"title": {"es": "RAID 1: escribir dos copias", "de": "RAID 1: zwei Kopien schreiben"}, "body": {"es": "Un espejo guarda los mismos bloques en los discos que lo forman. En un RAID 1 de dos discos, cuando llega A, se escribe A en ambos; lo mismo ocurre con B, C y D. No se reparte la secuencia en dos mitades. Cada disco contiene la secuencia completa.\n\nSi falla uno, el otro todavía puede entregar todos los bloques. La escritura debe mantener ambas copias. No obtenemos el doble de velocidad de escritura: hay que completar el trabajo en las dos. Las lecturas pueden repartirse entre copias según la implementación y la carga. Eso puede mejorar la lectura, pero no hay un multiplicador universal.\n\nDos discos de 4 TiB ofrecen 4 TiB netos, porque la segunda copia ocupa los otros 4 TiB brutos. Este espejo tolera un fallo de disco. Con tres discos que contienen todos la misma copia, la capacidad sigue siendo 4 TiB y puede quedar operativa una única copia sana. No confundas ese espejo triple con un RAID 10: RAID 10 forma parejas y reparte datos entre ellas.", "de": "Eine Spiegelung speichert dieselben Blöcke auf ihren Mitgliedslaufwerken. Bei RAID 1 mit zwei Laufwerken wird A auf beide geschrieben, ebenso B, C und D. Die Datenfolge wird nicht halbiert. Jedes Laufwerk enthält die vollständige Folge.\n\nBei Ausfall eines Laufwerks liefert das andere weiterhin alle Blöcke. Schreibvorgänge müssen beide Kopien aktuell halten. Die Schreibgeschwindigkeit verdoppelt sich deshalb nicht: Beide Laufwerke müssen die Schreibarbeit erledigen. Lesezugriffe können je nach Implementierung und Last auf die Kopien verteilt werden. Das kann Lesen beschleunigen, liefert jedoch keinen allgemeingültigen Leistungsfaktor.\n\nZwei Laufwerke mit je 4 TiB ergeben 4 TiB netto. Die zweite Kopie belegt die anderen 4 TiB der Bruttokapazität. Dieser Spiegel toleriert einen Laufwerksausfall. Enthalten drei Laufwerke dieselbe Kopie, bleiben es 4 TiB netto; eine gesunde Kopie kann zum Weiterbetrieb genügen. Ein solcher Dreifachspiegel ist kein RAID 10. RAID 10 bildet Paare und verteilt Daten zwischen diesen Paaren."}, "diagram": "r1", "check": {"es": "Si A se cambia, ¿se conserva automáticamente el A antiguo en el espejo?", "de": "Bleibt nach Änderung von A automatisch die alte Version im Spiegel erhalten?"}, "answer": {"es": "No. Se actualizan ambas copias. El espejo mantiene el estado actual, no una historia.", "de": "Nein. Beide Kopien werden aktualisiert. Die Spiegelung hält den aktuellen Zustand, keine Versionsgeschichte."}}, {"title": {"es": "Paridad: recuperar un bloque", "de": "Parität: einen Block rekonstruieren"}, "body": {"es": "La paridad es información calculada a partir de datos. No es una copia completa de cada bloque. Para entenderla, empecemos con un bit: un dato que solo puede ser 0 o 1. La operación XOR produce 0 si los dos bits son iguales y 1 si son distintos. El símbolo ⊕ significa esa operación, no una suma corriente.\n\nEn el ejemplo, el bit A vale 1 y B vale 0. Guardamos también un bit de paridad P, definido como A ⊕ B; por tanto P vale 1. Si B desaparece, A y P permiten recuperarlo: 1 ⊕ 1 da 0. Si falta A, B ⊕ P da 1. Aplicada posición por posición, esta misma regla funciona para bloques enteros del mismo tamaño.\n\nSi faltan A y B a la vez, P no basta. P = 1 admite A = 1 y B = 0, pero también A = 0 y B = 1. No sabemos cuál era el original. Una relación de paridad puede recuperar una porción desconocida por fila, no dos. La recuperación supone que las demás porciones se puedan leer y sean coherentes.", "de": "Parität ist aus Daten berechnete Information, keine vollständige Kopie jedes Blocks. Zuerst betrachten wir ein Bit: Es hat den Wert 0 oder 1. XOR ergibt bei gleichen Bits 0 und bei unterschiedlichen Bits 1. Das Zeichen ⊕ steht für XOR und nicht für gewöhnliche Addition.\n\nIm Beispiel ist A gleich 1 und B gleich 0. Zusätzlich speichern wir das Paritätsbit P. Es wird als A ⊕ B berechnet und ist deshalb 1. Fehlt B, können A und P es wiederherstellen: 1 ⊕ 1 ergibt 0. Fehlt A, liefert B ⊕ P den Wert 1. Positionsweise auf gleich große Blöcke angewendet funktioniert dieselbe Regel für ganze Datenblöcke.\n\nFehlen A und B gleichzeitig, reicht P nicht aus. P = 1 passt sowohl zu A = 1, B = 0 als auch zu A = 0, B = 1. Der ursprüngliche Inhalt ist nicht eindeutig. Eine Paritätsbeziehung rekonstruiert einen unbekannten Abschnitt pro Reihe, nicht zwei. Dabei müssen die übrigen Abschnitte lesbar und konsistent sein."}, "diagram": "xor", "check": {"es": "A = 1 y B = 1: ¿cuánto vale P? Si luego falta A, ¿cómo lo recuperas?", "de": "A = 1 und B = 1: Welchen Wert hat P? Wie wird ein fehlendes A rekonstruiert?"}, "answer": {"es": "P = 0. A = B ⊕ P = 1 ⊕ 0 = 1. Revisa la regla si confundiste XOR con suma.", "de": "P = 0. A = B ⊕ P = 1 ⊕ 0 = 1. Bei Verwechslung mit Addition zuerst die XOR-Regel wiederholen."}}, {"title": {"es": "RAID 5: paridad repartida", "de": "RAID 5: verteilte Parität"}, "body": {"es": "RAID 5 combina striping con una porción de paridad por stripe. Con cuatro discos, una fila contiene tres porciones de datos y una de paridad. En la fila siguiente, la paridad se guarda en otro disco. Todos participan; no hay un disco dedicado solo a paridad.\n\nSi falla cualquier disco, falta una porción de cada fila. Cuando falta un dato, se calcula usando los otros datos y la paridad. Cuando falta la propia paridad, los datos siguen allí y permiten volver a calcularla. Por eso un RAID 5 sano tolera un fallo de disco. Dos discos fallidos dejan dos porciones desconocidas por fila y no se garantiza recuperar el volumen.\n\nCuatro discos iguales de 4 TiB dan 16 TiB brutos. De cada cuatro porciones, tres guardan datos distintos: el espacio útil equivale a tres discos, 12 TiB. El cuarto equivalente se consume en paridad distribuida. Se necesitan al menos tres discos. Leer puede aprovechar el reparto; al modificar datos también hay que actualizar paridad. En escrituras pequeñas esto añade trabajo y puede limitar el rendimiento.", "de": "RAID 5 kombiniert Striping mit einem Paritätsabschnitt pro Stripe. Bei vier Laufwerken enthält eine Reihe drei Datenabschnitte und einen Paritätsabschnitt. In der nächsten Reihe liegt die Parität auf einem anderen Laufwerk. Es gibt kein ausschließliches Paritätslaufwerk.\n\nFällt ein beliebiges Laufwerk aus, fehlt in jeder Reihe genau ein Abschnitt. Fehlende Nutzdaten werden aus den verbleibenden Daten und der Parität berechnet. Fehlt die Parität selbst, sind die Daten vorhanden und ermöglichen ihre Neuberechnung. Ein gesundes RAID 5 toleriert daher einen Laufwerksausfall. Bei zwei ausgefallenen Laufwerken fehlen zwei Abschnitte pro Reihe; die Wiederherstellung des Volumes ist nicht garantiert.\n\nVier gleiche Laufwerke mit je 4 TiB ergeben 16 TiB brutto. Drei von vier Abschnitten enthalten unterschiedliche Nutzdaten. Die Nettokapazität entspricht drei Laufwerken, also 12 TiB. Die verteilte Parität benötigt das Kapazitätsäquivalent eines Laufwerks. Mindestens drei Laufwerke sind nötig. Lesen kann Striping nutzen; bei Datenänderungen muss auch die Parität aktualisiert werden. Besonders kleine Schreibzugriffe verursachen dadurch zusätzliche Arbeit."}, "diagram": "r5", "check": {"es": "En seis discos iguales, ¿cuántos equivalentes quedan para datos? ¿Hay un disco solo de paridad?", "de": "Wie viele Laufwerksäquivalente bleiben bei sechs gleichen Laufwerken für Nutzdaten? Gibt es ein reines Paritätslaufwerk?"}, "answer": {"es": "Cinco equivalentes útiles. No: la paridad cambia de posición entre filas.", "de": "Fünf Nutzdatenäquivalente. Nein: Die Parität wechselt zwischen den Reihen ihre Position."}}, {"title": {"es": "RAID 6: dos relaciones", "de": "RAID 6: zwei Beziehungen"}, "body": {"es": "Para tolerar dos discos fallidos, RAID 6 añade dos informaciones de recuperación independientes por stripe. En el esquema se llaman P y Q. Q no es otra copia de P: si ambas fueran idénticas, no darían una segunda relación para resolver dos porciones desconocidas. Su cálculo usa otro procedimiento matemático; para elegir y dimensionar el RAID basta entender esta independencia.\n\nCon cuatro discos, cada fila contiene dos porciones de datos y dos de redundancia. Con seis, contiene cuatro de datos y dos de redundancia. La posición de P y Q se distribuye entre discos. Un RAID 6 sano tolera dos fallos cualesquiera de disco, siempre que los bloques restantes se puedan leer correctamente.\n\nSeis discos de 4 TiB suman 24 TiB brutos. Dos equivalentes se reservan para redundancia; quedan cuatro para datos: 16 TiB netos. El mínimo es cuatro discos. La protección adicional consume más capacidad que RAID 5 con el mismo número de discos, y actualizar dos paridades añade trabajo de escritura. No hay un porcentaje universal de velocidad ni una duración fija de reconstrucción.", "de": "RAID 6 ergänzt zwei unabhängige Wiederherstellungsinformationen pro Stripe, um zwei Laufwerksausfälle zu tolerieren. Sie heißen in der Zeichnung P und Q. Q ist keine zweite Kopie von P: Identische Informationen würden keine zweite Beziehung für zwei unbekannte Abschnitte liefern. Q verwendet ein anderes mathematisches Verfahren. Für Auswahl und Dimensionierung genügt hier das Verständnis der Unabhängigkeit.\n\nBei vier Laufwerken enthält jede Reihe zwei Datenabschnitte und zwei Redundanzabschnitte. Bei sechs Laufwerken sind es vier Datenabschnitte und zwei Redundanzabschnitte. P und Q werden auf die Laufwerke verteilt. Ein gesundes RAID 6 toleriert zwei beliebige Laufwerksausfälle, sofern die übrigen Blöcke korrekt lesbar sind.\n\nSechs Laufwerke mit je 4 TiB bieten 24 TiB brutto. Zwei Laufwerksäquivalente sind für Redundanz erforderlich. Vier bleiben für Nutzdaten: 16 TiB netto. Das Minimum sind vier Laufwerke. Bei gleicher Laufwerkszahl verbraucht RAID 6 mehr Redundanzkapazität als RAID 5. Die Aktualisierung zweier Paritäten verursacht zusätzliche Schreibarbeit. Es gibt weder einen allgemeingültigen Geschwindigkeitsfaktor noch eine feste Rebuild-Dauer."}, "diagram": "r6", "check": {"es": "¿Por qué dos copias idénticas de la paridad de RAID 5 no bastan para RAID 6?", "de": "Warum reichen zwei identische Kopien der RAID-5-Parität nicht für RAID 6?"}, "answer": {"es": "Porque no añaden una relación independiente para resolver el segundo dato desconocido.", "de": "Weil sie keine unabhängige Beziehung für den zweiten unbekannten Datenabschnitt hinzufügen."}}, {"title": {"es": "RAID 10: importa la pareja", "de": "RAID 10: das Paar entscheidet"}, "body": {"es": "RAID 10 combina espejos y striping. Primero formamos parejas: discos 1 y 2 contienen una misma secuencia; discos 3 y 4, otra. El reparto coloca A y C en la primera pareja, B y D en la segunda. Cada bloque tiene dos copias, pero no todos los discos contienen todos los datos.\n\nUn fallo cualquiera se tolera porque queda la otra copia de su pareja. Si fallan 1 y 3, quedan 2 y 4: ambos grupos de datos siguen disponibles. Si fallan 1 y 2, desaparecen las dos copias de A y C; el array puede perderse aunque 3 y 4 estén sanos. Decir solo «tolera dos fallos» sería incorrecto.\n\nEn el RAID 10 clásico de parejas, se requiere un número par de discos, al menos cuatro. Cuatro discos de 4 TiB forman dos parejas útiles de 4 TiB: 8 TiB netos. En seis discos hay tres parejas y podrían tolerarse tres fallos si cada uno está en una pareja distinta. La garantía sin conocer la ubicación es un fallo; el criterio real es conservar al menos un disco sano por pareja. La escritura evita calcular paridad y puede favorecer cargas con muchas escrituras pequeñas.", "de": "RAID 10 kombiniert Spiegelung und Striping. Zuerst bilden wir Paare: Laufwerke 1 und 2 enthalten dieselbe Folge, Laufwerke 3 und 4 eine andere. Striping verteilt A und C auf das erste Paar und B und D auf das zweite. Jeder Block hat zwei Kopien, aber nicht jedes Laufwerk enthält alle Daten.\n\nEin beliebiger Ausfall wird toleriert, weil die andere Kopie im Paar bleibt. Fallen 1 und 3 aus, bleiben 2 und 4: Beide Datengruppen sind verfügbar. Fallen 1 und 2 aus, fehlen beide Kopien von A und C. Das Array kann verloren gehen, obwohl 3 und 4 gesund sind. Die pauschale Aussage „toleriert zwei Ausfälle“ ist daher falsch.\n\nDas klassische RAID 10 aus Zweierspiegeln benötigt eine gerade Laufwerkszahl und mindestens vier Laufwerke. Vier Laufwerke mit je 4 TiB bilden zwei nutzbare Paare mit je 4 TiB: 8 TiB netto. Sechs Laufwerke bilden drei Paare. Drei Ausfälle können toleriert werden, wenn sie unterschiedliche Paare betreffen. Ohne Kenntnis der Verteilung ist nur ein beliebiger Ausfall garantiert. Entscheidend bleibt mindestens ein gesundes Laufwerk pro Paar. Ohne Paritätsberechnung kann RAID 10 viele kleine Schreibzugriffe begünstigen."}, "diagram": "r10", "check": {"es": "Parejas (1,2), (3,4), (5,6): ¿se toleran fallos de 2, 4 y 6? ¿Y de 1 y 2?", "de": "Paare (1,2), (3,4), (5,6): Werden Ausfälle von 2, 4 und 6 toleriert? Und von 1 und 2?"}, "answer": {"es": "2,4,6: sí, queda una copia por pareja. 1,2: no, se pierde una pareja entera.", "de": "2,4,6: ja, je Paar bleibt eine Kopie. 1,2: nein, ein vollständiges Paar geht verloren."}}, {"title": {"es": "De los bloques a la fórmula", "de": "Von Blöcken zur Formel"}, "body": {"es": "Las fórmulas resumen lo que ya vimos en las filas. Primero fijamos la notación: n es el número de discos activos, sin reservas; s es la capacidad de un disco; C es la capacidad neta. s y C usan la misma unidad, por ejemplo TiB. En estos ejercicios usamos cantidades binarias: 1 TiB = 2⁴⁰ bytes = 1024 GiB. La etiqueta comercial de un disco puede indicar TB decimales (1 TB = 10¹² bytes); esa etiqueta no equivale a la misma cantidad numérica en TiB. No mezclamos ambas bases. Aquí todos los discos son iguales y se ignoran metadatos y formato.\n\nRAID 0 utiliza todos los discos para datos distintos: C = n × s. Un único espejo RAID 1 guarda la misma copia en cada miembro: C = s. RAID 5 deja un equivalente para paridad y n − 1 para datos: C = (n − 1) × s. RAID 6 deja dos para redundancia: C = (n − 2) × s. RAID 10 cuenta parejas, n / 2, y cada pareja aporta s: C = (n / 2) × s.\n\nEjemplo nuevo: con ocho discos de 2 TiB, RAID 5 deja siete equivalentes, 14 TiB; RAID 6 deja seis, 12 TiB; RAID 10 forma cuatro parejas, 8 TiB. No uses «discos menos fallos tolerables» como regla universal: RAID 10 depende de parejas. Si hay tamaños distintos, un RAID convencional puede limitar cada miembro al menor; ciertas implementaciones tienen otras reglas, especialmente RAID 0 por zonas. Consulta la especificación. Un Hot Spare es un disco de reserva preparado para sustituir un miembro fallido; no entra en n. La paridad consume espacio dentro de los miembros activos; no es ese disco de reserva.", "de": "Die Formeln fassen die dargestellten Reihen zusammen. Zuerst die Zeichen: n ist die Zahl aktiver Laufwerke ohne Reservelaufwerke; s ist die Kapazität eines Laufwerks; C ist die Nettokapazität. s und C verwenden dieselbe Einheit, etwa TiB. In diesen Aufgaben verwenden wir binäre Datenmengen: 1 TiB = 2⁴⁰ Byte = 1024 GiB. Die Handelsangabe eines Laufwerks kann dezimale TB nennen (1 TB = 10¹² Byte); diese Angabe entspricht nicht derselben Zahl in TiB. Beide Grundlagen werden nicht vermischt. Hier sind alle Laufwerke gleich groß; Metadaten und Formatierung bleiben unberücksichtigt.\n\nRAID 0 nutzt alle Laufwerke für unterschiedliche Daten: C = n × s. Ein einzelner RAID-1-Spiegel enthält auf allen Mitgliedern dieselbe Kopie: C = s. RAID 5 reserviert ein Äquivalent für Parität und nutzt n − 1 für Daten: C = (n − 1) × s. RAID 6 reserviert zwei: C = (n − 2) × s. RAID 10 zählt n / 2 Paare mit je s Nutzkapazität: C = (n / 2) × s.\n\nNeues Beispiel: Acht Laufwerke mit je 2 TiB ergeben bei RAID 5 sieben Datenäquivalente und 14 TiB; bei RAID 6 sechs und 12 TiB; bei RAID 10 vier Paare und 8 TiB. „Laufwerkszahl minus tolerierte Ausfälle“ ist keine allgemeine Regel: RAID 10 hängt von den Paaren ab. Unterschiedliche Größen können beim klassischen RAID auf das kleinste Mitglied begrenzt sein. Manche Implementierungen, besonders RAID 0 mit Zonen, haben andere Regeln. Die Spezifikation entscheidet. Ein Hot Spare ist ein Reservelaufwerk, das als Ersatz für ein ausgefallenes Mitglied bereitsteht; es zählt nicht zu n. Das Paritätsäquivalent ist dagegen Speicherplatz innerhalb der aktiven Mitglieder, kein physisches Reservelaufwerk."}, "diagram": "capacity", "check": {"es": "Cinco discos de 3 TiB en RAID 5: explica primero qué se reserva y calcula después.", "de": "Fünf Laufwerke mit je 3 TiB als RAID 5: Zuerst das Paritätsäquivalent erklären, dann rechnen."}, "answer": {"es": "Un equivalente para paridad; quedan cuatro. 4 × 3 TiB = 12 TiB netos.", "de": "Ein Äquivalent für Parität, vier bleiben für Nutzdaten. 4 × 3 TiB = 12 TiB netto."}}, {"title": {"es": "Calcular cuántos discos", "de": "Die Laufwerkszahl berechnen"}, "body": {"es": "Ahora la pregunta cambia: la empresa pide cierta capacidad neta y tenemos que comprar discos. Primero buscamos cuántos discos equivalentes necesitamos solo para los datos. Si se requieren 11 TiB y cada disco tiene 4 TiB, dos equivalentes darían 8 TiB: no basta. Tres dan 12 TiB: sí. Dividir 11 entre 4 da 2,75; como no compramos una fracción de disco, redondeamos hacia arriba a tres.\n\nDespués añadimos lo que exige la protección. RAID 5 necesita esos tres equivalentes de datos más uno de paridad: cuatro discos. RAID 6 necesita tres más dos: cinco. RAID 10 necesita una segunda copia de cada equivalente de datos: tres parejas, seis discos. Comprobamos sustituyendo: RAID 5 (4 − 1) × 4 = 12 TiB; RAID 6 (5 − 2) × 4 = 12 TiB; RAID 10 (6 / 2) × 4 = 12 TiB.\n\nLlamemos T a la capacidad neta requerida, en la misma unidad que s. Llamemos d al número de equivalentes para datos: d = redondear hacia arriba T / s. RAID 5: n = máximo de 3 y d + 1. RAID 6: n = máximo de 4 y d + 2. RAID 10 clásico: n = máximo de 4 y 2 × d. El máximo respeta el mínimo del nivel. Un único espejo RAID 1 solo sirve si T cabe en s; añadir más copias no aumenta su capacidad.", "de": "Nun fragt das Unternehmen nach einer Nettokapazität, und wir bestimmen die Laufwerkszahl. Zuerst zählen wir die allein für Nutzdaten erforderlichen Laufwerksäquivalente. Für 11 TiB mit 4-TiB-Laufwerken reichen zwei Äquivalente mit 8 TiB nicht. Drei bieten 12 TiB und reichen. 11 geteilt durch 4 ergibt 2,75. Da nur ganze Laufwerke eingebaut werden, wird auf drei aufgerundet.\n\nDanach kommt die Redundanz hinzu. RAID 5 benötigt drei Nutzdatenäquivalente plus eines für Parität: vier Laufwerke. RAID 6 benötigt drei plus zwei: fünf. RAID 10 benötigt eine zweite Kopie jedes Nutzdatenäquivalents: drei Paare, sechs Laufwerke. Gegenprobe: RAID 5 (4 − 1) × 4 = 12 TiB; RAID 6 (5 − 2) × 4 = 12 TiB; RAID 10 (6 / 2) × 4 = 12 TiB.\n\nT bezeichnet die geforderte Nettokapazität in derselben Einheit wie s. d ist die Zahl der Nutzdatenäquivalente: d = T / s aufgerundet. RAID 5: n = Maximum aus 3 und d + 1. RAID 6: n = Maximum aus 4 und d + 2. Klassisches RAID 10: n = Maximum aus 4 und 2 × d. Das Maximum berücksichtigt die Mindestlaufwerkszahl. Ein einzelner RAID-1-Spiegel reicht nur, wenn T in s passt. Weitere Kopien vergrößern seine Nettokapazität nicht."}, "diagram": "count", "check": {"es": "Se necesitan 9 TiB con discos de 4 TiB. ¿Por qué no redondear hacia abajo?", "de": "9 TiB werden mit 4-TiB-Laufwerken benötigt. Warum darf nicht abgerundet werden?"}, "answer": {"es": "Dos equivalentes solo dan 8 TiB. Se requieren tres; después se añade la redundancia del nivel.", "de": "Zwei Äquivalente liefern nur 8 TiB. Es werden drei benötigt; anschließend wird die Redundanz ergänzt."}}, {"title": {"es": "Rebuild y Hot Spare", "de": "Rebuild und Hot Spare"}, "body": {"es": "Un RAID degradado tiene un miembro fallido y sigue funcionando con la información que queda. No significa que ya se haya reparado. Rebuild es reconstruir sobre un disco de reemplazo la información del miembro perdido: en un espejo se copia desde su compañero; en RAID de paridad se calcula usando los miembros restantes.\n\nHot Spare es un disco de reserva instalado y preparado para asumir el reemplazo automáticamente si la configuración y su compatibilidad lo permiten. Antes del fallo no aporta capacidad útil ni una copia histórica de datos. Tener seis discos instalados, uno de ellos Hot Spare, significa cinco activos, no seis. Hot Swap es otra cosa: poder cambiar físicamente un disco durante el funcionamiento cuando hardware y controlador lo soportan.\n\nDurante la reconstrucción se leen los discos sanos y se escribe el reemplazo. Eso consume recursos y puede empeorar el rendimiento. La protección se restablece cuando la reconstrucción termina correctamente, no al conectar un disco vacío. RAID 5 con un disco fallido no tiene margen para otro fallo completo; RAID 6 con uno fallido conserva margen para uno más. En RAID 10 importa qué pareja afecta. Errores de lectura adicionales también pueden impedir recuperar datos. No se puede deducir una duración fija solo del nivel RAID.", "de": "Ein degradiertes RAID hat ein ausgefallenes Mitglied und arbeitet mit den verbleibenden Informationen weiter. Es ist dadurch noch nicht repariert. Rebuild bedeutet, die Informationen des verlorenen Mitglieds auf einem Ersatzlaufwerk wiederherzustellen: beim Spiegel durch Kopieren vom Partner, beim Paritäts-RAID durch Berechnung aus den verbleibenden Mitgliedern.\n\nEin Hot Spare ist ein eingebautes Reservelaufwerk, das bei geeigneter Konfiguration und Kompatibilität automatisch als Ersatz verwendet werden kann. Vor dem Ausfall liefert es weder Nutzkapazität noch historische Datenkopien. Sechs eingebaute Laufwerke mit einem Hot Spare bedeuten fünf aktive Mitglieder. Hot Swap ist etwas anderes: ein Laufwerk während des Betriebs physisch austauschen, wenn Hardware und Controller dies unterstützen.\n\nBeim Rebuild werden gesunde Laufwerke gelesen und das Ersatzlaufwerk beschrieben. Das verbraucht Ressourcen und kann die Leistung verschlechtern. Erst ein erfolgreich abgeschlossener Rebuild stellt die Redundanz wieder her; ein leeres Ersatzlaufwerk genügt nicht. RAID 5 mit einem ausgefallenen Mitglied toleriert keinen weiteren vollständigen Laufwerksausfall. RAID 6 mit einem Ausfall hat noch Spielraum für einen weiteren. Bei RAID 10 entscheidet das betroffene Paar. Zusätzliche Lesefehler können ebenfalls Datenrekonstruktion verhindern. Eine feste Dauer lässt sich aus dem RAID-Level allein nicht ableiten."}, "diagram": "rebuild", "check": {"es": "RAID 5 acaba de empezar el rebuild en su reserva. ¿Ya puede perder otro disco sin riesgo?", "de": "RAID 5 beginnt den Rebuild auf dem Hot Spare. Ist ein weiterer Ausfall bereits sicher tolerierbar?"}, "answer": {"es": "No. La reserva aún no contiene todo lo reconstruido. La redundancia debe terminar de restaurarse.", "de": "Nein. Der Ersatz enthält noch nicht alle rekonstruierten Informationen. Die Redundanz muss erst vollständig wiederhergestellt werden."}}, {"title": {"es": "Elegir y justificar", "de": "Auswählen und begründen"}, "body": {"es": "Empieza por los requisitos: capacidad neta, fallos de disco que deben tolerarse, patrón de lectura y escritura, y número de bahías. Una bahía es un lugar físico para instalar un disco. Descarta niveles que no cumplen la protección. Calcula después la capacidad o el número de discos, y compara los que quedan. Si se exige tolerar dos fallos cualesquiera, RAID 6 cumple; RAID 10 no garantiza cualquier combinación de dos.\n\nEntre RAID 5, 6 y 10 con el mismo número de discos iguales, RAID 5 aprovecha más capacidad. Para muchas escrituras pequeñas con redundancia, RAID 10 es una elección típica porque evita actualizar paridad. Es una justificación del mecanismo, no una promesa de ser siempre más rápido. Si solo hay dos bahías y se requiere tolerar un fallo, RAID 1 es la opción de estos niveles. En alemán, une elección y motivo: „Ich wähle …, weil …“. Nennen pide nombrar; begründen pide dar la razón; berechnen exige un cálculo comprensible.\n\nRAID mantiene el estado actual. Si se borra una carpeta o un programa cifra los archivos, el cambio también llega al espejo o se escribe con paridad válida. Ninguno permite volver automáticamente a ayer. Un backup es una copia separada recuperable, normalmente con estados anteriores. RAID tampoco protege por sí solo contra incendio, robo del equipo o fallo común. Su protección frente a discos fallidos y un backup resuelven problemas diferentes.", "de": "Zuerst die Anforderungen: Nettokapazität, zu tolerierende Laufwerksausfälle, Lese- und Schreibmuster sowie Laufwerksschächte. Ein Schacht ist ein physischer Einbauplatz. Zuerst ungeeignete Schutzkonzepte ausschließen. Dann Kapazität oder Laufwerkszahl berechnen und verbleibende Optionen vergleichen. Für zwei beliebige gleichzeitige Ausfälle eignet sich RAID 6; RAID 10 garantiert nicht jede Kombination von zwei Ausfällen.\n\nBei gleicher Laufwerkszahl und Größe nutzt RAID 5 unter RAID 5, 6 und 10 die Kapazität am besten. Für viele kleine Schreibzugriffe mit Redundanz ist RAID 10 eine typische Wahl, weil keine Parität aktualisiert wird. Das begründet den Mechanismus, garantiert jedoch nicht immer die höchste Geschwindigkeit. Bei zwei Schächten und geforderter Toleranz eines Ausfalls ist RAID 1 unter diesen Levels geeignet. „Ich wähle …, weil …“ verbindet Auswahl und Begründung. Nennen verlangt eine Bezeichnung, begründen einen sachlichen Grund und berechnen einen nachvollziehbaren Rechenweg.\n\nRAID hält den aktuellen Zustand. Wird ein Ordner gelöscht oder werden Dateien durch Schadsoftware verschlüsselt, wird die Änderung auch gespiegelt oder mit gültiger Parität gespeichert. RAID stellt nicht automatisch den gestrigen Zustand wieder her. Ein Backup ist eine getrennte, wiederherstellbare Kopie, häufig mit früheren Zuständen. RAID allein schützt auch nicht gegen Brand, Diebstahl des Systems oder gemeinsame Ausfallursachen. Laufwerksfehlertoleranz und Backup erfüllen unterschiedliche Aufgaben."}, "diagram": "decision", "check": {"es": "Seis discos y requisito de dos fallos cualesquiera: ¿RAID 5, 6 o 10? Explica sin hablar de velocidad.", "de": "Sechs Laufwerke, zwei beliebige Ausfälle müssen toleriert werden: RAID 5, 6 oder 10? Ohne Leistungsargument begründen."}, "answer": {"es": "RAID 6: dos relaciones independientes por stripe. RAID 5 solo uno; RAID 10 puede perder las dos copias de una pareja.", "de": "RAID 6: zwei unabhängige Beziehungen pro Stripe. RAID 5 toleriert nur einen Ausfall; RAID 10 kann beide Kopien eines Paars verlieren."}}], "tasks": [{"id": 1, "title": {"es": "Dos bahías", "de": "Zwei Schächte"}, "case": {"es": "La tienda ficticia Linde necesita que su servidor de archivos siga leyendo tras fallar un disco. Completa la ficha.", "de": "Der fiktive Laden Linde benötigt einen Dateiserver, der nach einem Laufwerksausfall weiter lesen kann. Ergänzen Sie das Datenblatt."}, "material": {"es": "2 bahías · 2 discos de 4 TiB · datos distintos requeridos: 3 TiB", "de": "2 Schächte · 2 Laufwerke à 4 TiB · Nutzdatenbedarf: 3 TiB"}, "fields": [{"label": {"es": "Nivel", "de": "Level"}, "answer": "RAID 1", "points": 1, "choices": ["RAID 0", "RAID 1", "RAID 5", "RAID 6", "RAID 10"]}, {"label": {"es": "Capacidad neta (TiB)", "de": "Nettokapazität (TiB)"}, "answer": "4", "points": 1, "choices": null}], "hint": {"es": "¿Qué nivel guarda dos copias completas?", "de": "Welcher Level speichert zwei vollständige Kopien?"}, "model": {"es": "RAID 1, 4 TiB. El espejo conserva todos los datos en el disco restante.", "de": "RAID 1, 4 TiB. Das verbleibende Laufwerk enthält alle Daten."}, "criteria": [{"es": "1 p: vincula el espejo con la continuidad tras un fallo.", "de": "1 P: Spiegelung mit Weiterbetrieb nach einem Ausfall verknüpft."}], "ref": "KAIT Sommer 2022 · 1ab/1ac · Frage PDF S. 2 / offizielle Lösung S. 2", "diagram": null, "calc": {"level": 1, "n": 2, "s": 4, "capacity": 4}, "solutionDiagram": "r1", "provenance": {"es": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Preparación conceptual propia complementaria; el original no pregunta este caso. Variante completa en E09 (1ab) / E16 (1ac).", "de": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Eigene ergänzende Konzeptübung; dieser Fall wird im Original nicht gefragt. Vollständige Variante in E09 (1ab) / E16 (1ac)."}}, {"id": 2, "title": {"es": "Datos temporales", "de": "Temporäre Daten"}, "case": {"es": "El estudio ficticio Mosaik regenera sus archivos de renderizado. Acepta perder el volumen y quiere todo el espacio de sus discos.", "de": "Das fiktive Studio Mosaik kann Renderdateien erneut erzeugen. Volumeverlust ist akzeptabel; die gesamte Kapazität soll genutzt werden."}, "material": {"es": "3 discos iguales de 2 TiB · sin requisito de redundancia", "de": "3 gleiche Laufwerke à 2 TiB · keine Redundanz gefordert"}, "fields": [{"label": {"es": "Nivel", "de": "Level"}, "answer": "RAID 0", "points": 1, "choices": ["RAID 0", "RAID 1", "RAID 5", "RAID 6", "RAID 10"]}, {"label": {"es": "Neto (TiB)", "de": "Netto (TiB)"}, "answer": "6", "points": 1, "choices": null}, {"label": {"es": "Fallos tolerables", "de": "Tolerierte Ausfälle"}, "answer": "0", "points": 1, "choices": null}], "hint": {"es": "Busca el reparto sin información adicional.", "de": "Gesucht ist Verteilung ohne Zusatzinformation."}, "model": {"es": "RAID 0: 3 × 2 = 6 TiB; cero fallos tolerables.", "de": "RAID 0: 3 × 2 = 6 TiB; kein Ausfall tolerierbar."}, "criteria": [], "ref": "KAIT Sommer 2022 · 1ab/1ac · Frage PDF S. 2 / offizielle Lösung S. 2", "diagram": null, "calc": {"level": 0, "n": 3, "s": 2, "capacity": 6}, "provenance": {"es": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Preparación conceptual propia complementaria; el original no pregunta este caso. Variante completa en E09 (1ab) / E16 (1ac).", "de": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Eigene ergänzende Konzeptübung; dieser Fall wird im Original nicht gefragt. Vollständige Variante in E09 (1ab) / E16 (1ac)."}}, {"id": 3, "title": {"es": "Capacidad del archivo", "de": "Archivkapazität"}, "case": {"es": "La editorial ficticia Papier organiza un archivo con RAID 5. Completa su tabla de capacidad.", "de": "Der fiktive Verlag Papier richtet ein Archiv mit RAID 5 ein. Ergänzen Sie die Kapazitätstabelle."}, "material": {"es": "5 discos activos de 3 TiB · RAID 5", "de": "5 aktive Laufwerke à 3 TiB · RAID 5"}, "fields": [{"label": {"es": "Bruto (TiB)", "de": "Brutto (TiB)"}, "answer": "15", "points": 1, "choices": null}, {"label": {"es": "Neto (TiB)", "de": "Netto (TiB)"}, "answer": "12", "points": 1, "choices": null}, {"label": {"es": "Redundancia (TiB)", "de": "Redundanz (TiB)"}, "answer": "3", "points": 1, "choices": null}], "hint": {"es": "Cuenta los equivalentes de datos en cada fila.", "de": "Zählen Sie die Datenäquivalente jeder Reihe."}, "model": {"es": "15 TiB brutos; (5 − 1) × 3 = 12 TiB netos; 3 TiB de paridad repartida.", "de": "15 TiB brutto; (5 − 1) × 3 = 12 TiB netto; 3 TiB verteilte Parität."}, "criteria": [], "ref": "KAIT Sommer 2024 · 4da · Frage PDF S. 10 / offizielle Lösung S. 5", "diagram": null, "calc": {"level": 5, "n": 5, "s": 3, "capacity": 12}, "provenance": {"es": "Vorübung zu KAIT Sommer 2024 · 4da. Preparación conceptual propia complementaria; el original no pregunta este caso. Variante completa en E08.", "de": "Vorübung zu KAIT Sommer 2024 · 4da. Eigene ergänzende Konzeptübung; dieser Fall wird im Original nicht gefragt. Vollständige Variante in E08."}}, {"id": 4, "title": {"es": "Dos discos fallidos", "de": "Zwei Laufwerksausfälle"}, "case": {"es": "La fábrica ficticia Stahl exige tolerar dos fallos cualesquiera y alcanzar al menos 15 TiB netos. Completa la ficha del único nivel de las opciones que cumple simultáneamente ambos requisitos.", "de": "Die fiktive Fabrik Stahl fordert Toleranz zweier beliebiger Ausfälle und mindestens 15 TiB netto. Ergänzen Sie den einzigen angebotenen Level, der beide Anforderungen gleichzeitig erfüllt."}, "material": {"es": "6 discos activos de 4 TiB · opciones: 0, 1 de seis copias, 5, 6, 10 · al menos 15 TiB netos", "de": "6 aktive Laufwerke à 4 TiB · Optionen: 0, 1 mit sechs Kopien, 5, 6, 10 · mindestens 15 TiB netto"}, "fields": [{"label": {"es": "Nivel", "de": "Level"}, "answer": "RAID 6", "points": 1, "choices": ["RAID 0", "RAID 1", "RAID 5", "RAID 6", "RAID 10"]}, {"label": {"es": "Neto (TiB)", "de": "Netto (TiB)"}, "answer": "16", "points": 1, "choices": null}], "hint": {"es": "Comprueba protección y espacio juntos.", "de": "Schutz und Kapazität gemeinsam prüfen."}, "model": {"es": "RAID 6: (6 − 2) × 4 = 16 TiB. RAID 1 de seis copias solo da 4 TiB; RAID 10 no garantiza dos fallos cualesquiera.", "de": "RAID 6: (6 − 2) × 4 = 16 TiB. Der Sechsfachspiegel liefert nur 4 TiB; RAID 10 garantiert keine zwei beliebigen Ausfälle."}, "criteria": [{"es": "1 p: explica que dos paridades independientes permiten tolerar dos fallos.", "de": "1 P: Zwei unabhängige Paritäten als Grund für die Fehlertoleranz erklärt."}], "ref": "KAIT Sommer 2022 · 1ab/1ac · Frage PDF S. 2 / offizielle Lösung S. 2", "diagram": null, "calc": {"level": 6, "n": 6, "s": 4, "capacity": 16}, "provenance": {"es": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Preparación conceptual propia complementaria; el original no pregunta este caso. Variante completa en E09 (1ab) / E16 (1ac).", "de": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Eigene ergänzende Konzeptübung; dieser Fall wird im Original nicht gefragt. Vollständige Variante in E09 (1ab) / E16 (1ac)."}}, {"id": 5, "title": {"es": "Parejas que sobreviven", "de": "Überlebende Paare"}, "case": {"es": "La logística ficticia Paket usa RAID 10. Marca si conserva el volumen en cada incidente, antes de reconstruir. Los incidentes son independientes: cada fila parte del array sano; los fallos no se acumulan.", "de": "Die fiktive Logistik Paket nutzt RAID 10. Beurteilen Sie jeden Vorfall vor einem Rebuild. Die Vorfälle sind unabhängig: Jede Zeile beginnt mit einem gesunden Array; Ausfälle werden nicht aufsummiert."}, "material": {"es": "Parejas: (1,2), (3,4), (5,6) · discos restantes legibles", "de": "Paare: (1,2), (3,4), (5,6) · verbleibende Laufwerke lesbar"}, "fields": [{"label": {"es": "Fallan 1 y 3: ¿operativo?", "de": "1 und 3 fallen aus: betriebsfähig?"}, "answer": "0", "points": 1, "choices": [{"es": "Sí", "de": "Ja"}, {"es": "No", "de": "Nein"}]}, {"label": {"es": "Fallan 3 y 4: ¿operativo?", "de": "3 und 4 fallen aus: betriebsfähig?"}, "answer": "1", "points": 1, "choices": [{"es": "Sí", "de": "Ja"}, {"es": "No", "de": "Nein"}]}, {"label": {"es": "Fallan 2, 4 y 6: ¿operativo?", "de": "2, 4 und 6 fallen aus: betriebsfähig?"}, "answer": "0", "points": 1, "choices": [{"es": "Sí", "de": "Ja"}, {"es": "No", "de": "Nein"}]}], "hint": {"es": "Examina cada pareja, no solo el número de fallos.", "de": "Jedes Paar einzeln prüfen, nicht nur Ausfälle zählen."}, "model": {"es": "Sí / no / sí. Una copia por pareja basta; perder 3 y 4 elimina ambas copias de esa pareja.", "de": "Ja / nein / ja. Eine Kopie je Paar genügt; der Ausfall von 3 und 4 beseitigt beide Kopien des Paars."}, "criteria": [], "ref": "KAIT Sommer 2022 · 1ab/1ac · Frage PDF S. 2 / offizielle Lösung S. 2", "diagram": null, "calc": {"pairs": [[1, 2], [3, 4], [5, 6]], "failures": [[1, 3], [3, 4], [2, 4, 6]], "survives": [true, false, true]}, "provenance": {"es": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Preparación conceptual propia complementaria; el original no pregunta este caso. Variante completa en E09 (1ab) / E16 (1ac).", "de": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Eigene ergänzende Konzeptübung; dieser Fall wird im Original nicht gefragt. Vollständige Variante in E09 (1ab) / E16 (1ac)."}}, {"id": 6, "title": {"es": "Reserva en la carcasa", "de": "Reserve im Gehäuse"}, "case": {"es": "El museo ficticio Form cuenta seis discos instalados. Lee el inventario y completa el espacio disponible.", "de": "Das fiktive Museum Form besitzt sechs eingebaute Laufwerke. Ergänzen Sie anhand des Inventars die Kapazität."}, "material": {"es": "Inventario del RAID 5 y su disco de reserva:", "de": "Inventar des RAID 5 und seines Reservelaufwerks:"}, "fields": [{"label": {"es": "Discos activos n", "de": "Aktive Laufwerke n"}, "answer": "5", "points": 1, "choices": null}, {"label": {"es": "Neto (TiB)", "de": "Netto (TiB)"}, "answer": "16", "points": 1, "choices": null}, {"label": {"es": "Aporte útil de D6 (TiB)", "de": "Nutzkapazität von D6 (TiB)"}, "answer": "0", "points": 1, "choices": null}], "hint": {"es": "Una reserva no guarda nuevos datos útiles antes de entrar al array.", "de": "Die Reserve liefert vor ihrer Aufnahme keine zusätzliche Nutzkapazität."}, "model": {"es": "n = 5; (5 − 1) × 4 = 16 TiB; Hot Spare: 0 TiB útiles.", "de": "n = 5; (5 − 1) × 4 = 16 TiB; Hot Spare: 0 TiB Nutzkapazität."}, "criteria": [], "ref": "KAIT Sommer 2024 · 4da · Frage PDF S. 10 / offizielle Lösung S. 5", "diagram": null, "calc": {"level": 5, "n": 5, "s": 4, "spare": 1, "capacity": 16}, "inventory": [{"disk": "D1", "capacity": "4 TiB", "status": {"es": "Activo", "de": "Aktiv"}}, {"disk": "D2", "capacity": "4 TiB", "status": {"es": "Activo", "de": "Aktiv"}}, {"disk": "D3", "capacity": "4 TiB", "status": {"es": "Activo", "de": "Aktiv"}}, {"disk": "D4", "capacity": "4 TiB", "status": {"es": "Activo", "de": "Aktiv"}}, {"disk": "D5", "capacity": "4 TiB", "status": {"es": "Activo", "de": "Aktiv"}}, {"disk": "D6", "capacity": "4 TiB", "status": {"es": "Hot Spare / reserva", "de": "Hot Spare / Reserve"}}], "provenance": {"es": "Vorübung zu KAIT Sommer 2024 · 4da. Preparación conceptual propia complementaria; el original no pregunta este caso. Variante completa en E08.", "de": "Vorübung zu KAIT Sommer 2024 · 4da. Eigene ergänzende Konzeptübung; dieser Fall wird im Original nicht gefragt. Vollständige Variante in E08."}}, {"id": 7, "title": {"es": "Rebuild en curso", "de": "Rebuild läuft"}, "case": {"es": "La imprenta ficticia Druck recibe este estado. Explica la vulnerabilidad actual.", "de": "Die fiktive Druckerei Druck erhält folgende Statusanzeige. Erläutern Sie die aktuelle Gefährdung."}, "material": {"es": "Captura redibujada: RAID 5 / D2 FALLIDO / reserva: REBUILD 18 % / otros miembros legibles", "es": "No", "de": "Nein"}]}], "hint": {"es": "Comprueba la ubicación de los fallos y la función de la reserva.", "de": "Ausfallverteilung und Funktion der Reserve prüfen."}, "model": {"es": "Ambas son falsas. RAID 10 conserva datos si queda una copia en cada pareja; dos fallos en la misma pareja pueden perder el array. Un Hot Spare reemplaza un miembro fallido y recibe el estado actual durante el rebuild; no conserva versiones borradas.", "de": "Beide Aussagen sind falsch. RAID 10 benötigt je Paar eine verbleibende Kopie; zwei Ausfälle im selben Paar können das Array zerstören. Ein Hot Spare ersetzt ein ausgefallenes Mitglied und erhält den aktuellen Zustand beim Rebuild, keine gelöschten Versionen."}, "criteria": [{"es": "1 p: corrige A con la condición por parejas.", "de": "1 P: A mit der Bedingung je Spiegelpaar berichtigt."}, {"es": "1 p: corrige B distinguiendo reemplazo y backup.", "de": "1 P: B durch Unterscheidung von Ersatz und Backup berichtigt."}], "ref": "KAIT Sommer 2022 · 1ab/1ac · Frage PDF S. 2 / offizielle Lösung S. 2", "diagram": null, "calc": null, "provenance": {"es": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Preparación conceptual propia complementaria; el original no pregunta este caso. Variante completa en E09 (1ab) / E16 (1ac).", "de": "Vorübung zu KAIT Sommer 2022 · 1ab/1ac. Eigene ergänzende Konzeptübung; dieser Fall wird im Original nicht gefragt. Vollständige Variante in E09 (1ab) / E16 (1ac)."}}, {"id": 20, "title": {"es": "Caso completo de examen", "de": "Vollständiger Prüfungsfall"}, "case": {"es": "La ingeniería ficticia Brücke necesita 17 TiB netos, tolerar dos fallos cualesquiera y tiene ocho bahías. Primero calcula los mínimos de las tres alternativas SOLO para alcanzar la capacidad, sin limitar todavía las bahías ni descartar por tolerancia. Después compara todos los requisitos y recomienda una con justificación.", "de": "Das fiktive Ingenieurbüro Brücke benötigt 17 TiB netto, Toleranz zweier beliebiger Ausfälle und hat acht Schäch quiera.", "de": "1 P: RAID 6 mit zwei beliebigen Ausfällen verknüpft."}, {"es": "1 p: compara las alternativas con las bahías y la protección.", "de": "1 P: Alternativen anhand von Schächten und Schutz verglichen."}], "ref": "KAIT Sommer 2024 · 4da · Frage PDF S. 10 / offizielle Lösung S. 5", "diagram": null, "calc": {"target": 17, "s": 4, "counts": [6, 7, 10]}, "writing": [{"key": "r5", "field": 0, "label": {"es": "RAID 5: desarrollo propio", "de": "RAID 5: eigener Rechenweg"}, "model": {"es": "17 / 4 = 4,25 → 5. 5 + 1 = 6. (6 − 1) × 4 = 20 TiB ≥ 17 TiB.", "de": "17 / 4 = 4,25 → 5. 5 + 1 = 6. (6 − 1) × 4 = 20 TiB ≥ 17 TiB."}}, {"key": "r6", "field": 1, "label": {"es": "RAID 6: desarrollo propio", "de": "RAID 6: eigener Rechenweg"}, "model": {"es": "17 / 4 = 4,25 → 5. 5 + 2 = 7. (7 − 2) × 4 = 20 TiB ≥ 17 TiB.", "de": "17 / 4 = 4,25 → 5. 5 + 2 = 7. (7 − 2) × 4 = 20 TiB ≥ 17 TiB."}}, {"key": "r10", "field": 2, "label": {"es": "RAID 10: desarrollo propio", "de": "RAID 10: eigener Rechenweg"}, "model": {"es": "17 / 4 = 4,25 → 5. 5 × 2 = 10. (10 / 2) × 4 = 20 TiB ≥ 17 TiB.", "de": "17 / 4 = 4,25 → 5. 5 × 2 = 10. (10 / 2) × 4 = 20 TiB ≥ 17 TiB."}}], "provenance": {"es": "Variante de cálculo de 4da, ampliada con selección por protección y bahías. La selección final no reproduce 4db.", "de": "Rechenvariante zu 4da, um Schutz- und Schachtauswahl erweitert. Die abschließende Wahl bildet 4db nicht nach."}}]};
const L=DATA.lessons,T=DATA.tasks;const STORE='raid-studio-2026-10-12-v1';let state={page:0,lang:'es',answers:{},notes:{},help:{},grades:{}};let storageOK=true;

const bi=(es,de)=>({es,de});const $=id=>document.getElementById(id);const tr=o=>o[state.lang];const say=(es,de)=>state.lang==='es'?es:de;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function disk(name,blocks){return `<div class="disk"><div class="diskhead">${esc(name)}</div>${blocks.map(b=>`<div class="block ${b.startsWith('P')||b.startsWith('Q')?'parity':''}">${esc(b)}</div>`).join('')}</div>`;}
function disks(rows){return `<div class="disks" style="--cols:${rows.length}">${rows.map((r,i)=>disk('D'+(i+1),r)).join('')}</div>`;}
const CAPTIONS={single:['Un fallo interrumpe la lectura de la única copia.','Ein Ausfall unterbricht den Zugriff auf die einzige Kopie.'],compare:['Datos distintos y datos repetidos ocupan espacio, pero cumplen funciones diferentes.','Unterschiedliche und wiederholte Daten belegen Platz, erfüllen aber verschiedene Aufgaben.'],r0:['Cada disco contiene bloques distintos; no hay segunda copia.','Jedes Laufwerk enthält andere Blöcke; eine zweite Kopie fehlt.'],r1:['Ambos discos guardan la secuencia completa.','Beide Laufwerke enthalten die vollständige Folge.'],xor:['La información restante permite recuperar un único bit desconocido.','Die verbleibenden Informationen rekonstruieren ein unbekanntes Bit.'],r5:['Cada fila contiene datos y una paridad; la paridad cambia de disco.','Jede Reihe enthält Daten und eine Parität; die Parität wechselt das Laufwerk.'],r6:['P y Q aportan dos relaciones independientes por fila.','P und Q liefern zwei unabhängige Beziehungen je Reihe.'],r10:['El reparto ocurre entre parejas; dentro de cada pareja se copia.','Zwischen Paaren wird verteilt, innerhalb jedes Paars wird kopiert.'],capacity:['La capacidad neta cuenta datos distintos, no las copias ni la paridad.','Nettokapazität zählt unterschiedliche Nutzdaten, keine Kopien oder Parität.'],count:['Primero espacio para datos; después, protección.','Zuerst Platz für Nutzdaten, anschließend Schutz.'],rebuild:['La protección vuelve tras completar el rebuild, no al empezar.','Der Schutz kehrt nach dem vollständigen Rebuild zurück, nicht zu Beginn.'],decision:['Protección y capacidad deben cumplir al mismo tiempo.','Schutz und Kapazität müssen gleichzeitig ausreichen.']};

case 'count':s=`<div class="mechanism">${row('11 TiB / 4 TiB',say('2 discos útiles = 8 TiB: no basta.','2 Nutzäquivalente = 8 TiB: zu wenig.'))}${row(say('3 equivalentes = 12 TiB','3 Äquivalente = 12 TiB'),say('Se redondea hacia arriba para cubrir el requisito.','Aufrunden, um den Bedarf abzudecken.'))}${row('RAID 5: 3 + 1 = 4',say('Un equivalente adicional para paridad.','Ein zusätzliches Paritätsäquivalent.'))}${row('RAID 6: 3 + 2 = 5','P + Q')}${row('RAID 10: 3 × 2 = 6',say('Tres parejas de dos discos.','Drei Paare aus je zwei Laufwerken.'))}</div>`;break;
