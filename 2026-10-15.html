<script id="workshop-data" type="application/json">{"lessons": [{"letter": "A", "title": {"es": "Qué se recupera", "de": "Was wird wiederhergestellt?"}, "text": {"es": "Una copia de seguridad guarda datos para poder recuperarlos si se pierden o se dañan. Recuperar significa escribir los datos guardados en un destino. Un archivo puede tener varias versiones: el mismo nombre no garantiza el mismo contenido. Usaremos v1, v2… como identificadores de versiones completas. El estado de una carpeta es la lista de archivos y sus versiones en un instante. Si el ticket pide el estado del martes, una versión del miércoles puede ser incorrecta aunque abra sin error. Primero fijamos el estado pedido; después recuperamos y comprobamos. No realizamos ninguna operación en datos reales.", "de": "Eine Datensicherung bewahrt Daten auf, damit sie nach Verlust oder Beschädigung wiederhergestellt werden können. Wiederherstellen bedeutet, gesicherte Daten in ein Ziel zu schreiben. Eine Datei kann mehrere Versionen haben: Derselbe Name garantiert nicht denselben Inhalt. v1, v2… kennzeichnen vollständige Dateiversionen. Der Zustand eines Ordners besteht aus seinen Dateien und ihren Versionen zu einem Zeitpunkt. Verlangt das Ticket den Dienstagszustand, kann eine Mittwochsversion falsch sein, obwohl sie sich öffnen lässt. Zuerst bestimmen wir den Sollzustand, dann stellen wir wieder her und prüfen. Es werden keine echten Daten verändert."}, "check": {"question": {"es": "¿El nombre prueba la versión?", "de": "Belegt der Dateiname die Version?"}, "answer": {"es": "No: el mismo nombre puede tener otro contenido.", "de": "Nein: Derselbe Name kann anderen Inhalt enthalten."}, "options": [{"es": "Puede cambiar el contenido sin cambiar el nombre.", "de": "Der Inhalt kann sich bei gleichem Namen ändern."}, {"es": "El nombre prueba la versión por sí solo.", "de": "Der Name allein belegt die Version."}]}}, {"letter": "B", "title": {"es": "Reactivación breve", "de": "Kurze Wiederholung"}, "text": {"es": "Una completa guarda todos los archivos del alcance. Una incremental guarda archivos creados o modificados desde la copia anterior. Una diferencial guarda los creados o modificados desde su completa. En un destino vacío, la completa aporta también los archivos que después no cambiaron. Para un estado incremental completo se aplica la base y los incrementos hasta el objetivo, en orden; para el diferencial, la base y la diferencial del objetivo. Este es un modelo de archivos completos, sin borrados. Los paquetes muestran su base y dependencia. Las copias representan el final de la hora indicada; todas son legibles salvo indicación. Cada aplicación reemplaza solo los archivos incluidos. Productos reales pueden seleccionar automáticamente las dependencias. La frase del libro que permite completa O diferencial no vale sobre destino vacío.", "de": "Eine Vollsicherung enthält alle Dateien des Umfangs. Eine inkrementelle Sicherung enthält seit der vorherigen Sicherung erstellte oder geänderte Dateien. Eine differenzielle Sicherung enthält seit ihrer Vollsicherung erstellte oder geänderte Dateien. Auf einem leeren Ziel liefert die Vollsicherung auch die später unveränderten Dateien. Für einen vollständigen inkrementellen Zustand werden Basis und Inkremente bis zum Ziel in Reihenfolge eingespielt; beim differenziellen Verfahren Basis und Zieldifferenz. Das Modell verwendet vollständige Dateien ohne Löschungen. Basis und Abhängigkeiten stehen bei den Paketen. Sicherungen bilden das Ende des angegebenen Zeitpunkts ab; sie sind lesbar, sofern nicht anders angegeben. Jeder Schritt ersetzt nur enthaltene Dateien. Reale Produkte können Abhängigkeiten automatisch auswählen. Die Buchformulierung Vollsicherung ODER Differenz gilt auf einem leeren Ziel nicht."}, "check": {"question": {"es": "¿De dónde llega un archivo que nunca cambió?", "de": "Woher kommt eine seit der Basis unveränderte Datei?"}, "answer": {"es": "De la completa: los paquetes de cambios pueden no incluirlo.", "de": "Aus der Vollsicherung: Änderungspakete enthalten ihn möglicherweise nicht."}, "options": [{"es": "De la completa correspondiente.", "de": "Aus der zugehörigen Vollsicherung."}, {"es": "Siempre del último incremento.", "de": "Immer aus dem letzten Inkrement."}]}}, {"letter": "C", "title": {"es": "Fijar el objetivo", "de": "Den Sollzustand festlegen"}, "text": {"es": "Un ticket es un encargo, no una prueba de qué contienen las copias. Extrae tres datos: instante pedido, archivos incluidos y versiones esperadas. Un inventario de referencia muestra las versiones que había en ese instante. El plan de copias muestra qué paquetes existen. Compara ambos antes de elegir. Si el ticket solo dice «antes del fallo» y falta la hora del fallo, no podemos inventar el corte. Pedimos ese dato; hasta entonces la decisión es «no determinable». Una copia posterior puede contener cambios que el usuario no pidió.", "de": "Ein Ticket ist ein Auftrag, kein Nachweis des Sicherungsinhalts. Entnehmen Sie drei Angaben: Zielzeitpunkt, betroffene Dateien und erwartete Versionen. Ein Referenzinventar zeigt die Versionen zu diesem Zeitpunkt. Der Sicherungsplan zeigt die vorhandenen Pakete. Vergleichen Sie beides vor der Auswahl. Lautet das Ticket nur „vor dem Fehler“ und fehlt dessen Uhrzeit, dürfen wir den Stichtag nicht erfinden. Wir fragen nach; bis dahin ist die Entscheidung „nicht bestimmbar“. Eine spätere Sicherung kann unerwünschte Änderungen enthalten."}, "check": {"question": {"es": "¿Qué haces si falta la hora del error?", "de": "Was tun bei fehlender Fehleruhrzeit?"}, "answer": {"es": "Pedirla y confirmar el estado de referencia; no inventar el instante.", "de": "Uhrzeit erfragen und Referenzzustand bestätigen; Zeitpunkt nicht erfinden."}, "options": [{"es": "Pedir la hora y confirmar la referencia.", "de": "Uhrzeit erfragen und Referenz bestätigen."}, {"es": "Elegir la última copia porque es reciente.", "de": "Die neueste Sicherung wegen ihres Alters wählen."}]}}, {"letter": "D", "title": {"es": "Restaurar observando", "de": "Mit sichtbarem Ergebnis wiederherstellen"}, "text": {"es": "El destino de prueba comienza vacío. Al aplicar F aparecen plan v1 y lista v1. I1 reemplaza plan por v2 y crea nota v1. I2 reemplaza lista por v2. El resultado contiene plan v2, lista v2 y nota v1. No todos los archivos tienen el mismo número de versión porque no se modificaron a la vez. Elegir un paquete mueve sus versiones al destino; observa qué cambia y qué queda. Una secuencia incorrecta también se puede ensayar: I2 solo deja un destino incompleto, y F aplicado al final devuelve archivos a v1. Reiniciar vacía solo la simulación. Al comparar se muestran diferencias; no se presupone éxito por haber pulsado un botón.", "de": "Das Testziel beginnt leer. F liefert plan v1 und liste v1. I1 ersetzt plan durch v2 und erstellt notiz v1. I2 ersetzt liste durch v2. Das Ergebnis enthält plan v2, liste v2 und notiz v1. Die Versionsnummern sind verschieden, weil die Dateien zu unterschiedlichen Zeiten geändert wurden. Wählen Sie ein Paket und beobachten Sie, was sich ändert und was bleibt. Auch Fehler lassen sich erproben: I2 allein hinterlässt ein unvollständiges Ziel; F am Ende setzt Dateien auf v1 zurück. Zurücksetzen leert nur die Simulation. Der Vergleich zeigt Abweichungen und unterstellt keinen Erfolg durch einen Klick."}, "check": {"question": {"es": "¿Por qué quedan versiones con números distintos?", "de": "Warum bleiben verschiedene Versionsnummern?"}, "answer": {"es": "Cada archivo cambió en instantes distintos; solo se reemplaza el contenido del paquete.", "de": "Dateien änderten sich zu verschiedenen Zeiten; nur Paketinhalt wird ersetzt."}, "options": [{"es": "Los archivos cambiaron en momentos diferentes.", "de": "Dateien wurden zu verschiedenen Zeiten geändert."}, {"es": "Todas las versiones deben subir en cada paso.", "de": "Alle Versionen müssen bei jedem Schritt steigen."}]}}, {"letter": "E", "title": {"es": "Alcance y límite", "de": "Umfang und Grenze"}, "text": {"es": "Si un incremento ilegible contiene la única copia de una versión necesaria, esa versión falta. Un paquete posterior no demuestra que la contiene. El último estado completo comprobable puede ser anterior. Aun así, otro archivo posterior puede recuperarse si su versión completa está en un paquete legible. Separa «este archivo recuperado» de «todo el estado pedido recuperado». Con una diferencial ilegible se puede usar una diferencial anterior íntegra junto con su completa; se debe indicar qué cambios quedan fuera. Si faltan inventarios fiables, tampoco se puede afirmar cuál es el estado exacto.", "de": "Enthält ein unlesbares Inkrement die einzige Kopie einer benötigten Version, fehlt diese Version. Ein späteres Paket beweist nicht, dass sie enthalten ist. Der letzte vollständig nachweisbare Zustand kann früher liegen. Eine andere spätere Datei kann dennoch aus einem lesbaren Paket mit vollständiger Version gerettet werden. Unterscheiden Sie „diese Datei wiederhergestellt“ von „gesamter Sollzustand wiederhergestellt“. Bei einer unlesbaren Differenz kann eine frühere intakte Differenz mit ihrer Basis genutzt werden; ausgeschlossene Änderungen sind anzugeben. Ohne verlässliches Inventar lässt sich auch der genaue Zustand nicht behaupten."}, "check": {"question": {"es": "¿Una recuperación parcial permite aceptar el conjunto?", "de": "Erlaubt eine Teilrettung die Abnahme des Ganzen?"}, "answer": {"es": "No. Hay que declarar el éxito concreto y las obligaciones que siguen faltando.", "de": "Nein. Konkreten Erfolg und weiterhin fehlende Pflichten benennen."}, "options": [{"es": "No: faltan obligaciones del conjunto.", "de": "Nein: Pflichten des Gesamtumfangs fehlen."}, {"es": "Sí: recuperar uno basta para el conjunto.", "de": "Ja: Eine gerettete Datei reicht für das Ganze."}]}}, {"letter": "F", "title": {"es": "Aceptar con pruebas", "de": "Mit Nachweisen abnehmen"}, "text": {"es": "«erfolgreich» en un log describe la operación registrada. No prueba que recuperamos todos los archivos pedidos ni sus versiones. La aceptación tiene dos partes. Primero, comparar cada nombre y versión con el inventario esperado y registrar los faltantes o diferencias. Después, probar el uso pedido: por ejemplo, abrir los documentos obligatorios y comprobar que muestran el contenido conocido. Abrir uno no prueba los demás. En este taller las versiones son identificadores fiables proporcionados; en una operación real se necesita evidencia adecuada para reconocerlas. Solo se acepta cuando todas las condiciones del alcance se cumplen. Registra paquetes, destino, diferencias y pruebas; ante un fallo mantén el ticket abierto.", "de": "„erfolgreich“ im Log beschreibt den protokollierten Vorgang. Es belegt weder alle geforderten Dateien noch deren Versionen. Die Abnahme hat zwei Teile. Zuerst jeden Namen und jede Version mit dem Sollinventar vergleichen und Lücken dokumentieren. Danach die verlangte Nutzung prüfen, etwa die Pflichtdokumente öffnen und den bekannten Inhalt kontrollieren. Eine geöffnete Datei belegt die anderen nicht. Im Workshop sind die bereitgestellten Versionskennungen verlässlich; im realen Betrieb braucht man passende Nachweise zur Identifikation. Erst bei Erfüllung aller Bedingungen des Umfangs wird abgenommen. Pakete, Ziel, Abweichungen und Tests protokollieren; bei einem Fehler bleibt das Ticket offen."}, "check": {"question": {"es": "¿Basta con abrir uno de tres archivos pedidos?", "de": "Reicht das Öffnen einer von drei Pflichtdateien?"}, "answer": {"es": "No: nombres, versiones y pruebas de uso deben cubrir el alcance pedido.", "de": "Nein: Namen, Versionen und Nutzungstests müssen den geforderten Umfang abdecken."}, "options": [{"es": "No: comprobar todos los documentos del alcance.", "de": "Nein: Alle Dokumente des Umfangs prüfen."}, {"es": "Sí: uno representa automáticamente los tres.", "de": "Ja: Eine Datei belegt automatisch alle drei."}]}}, {"letter": "G", "title": {"es": "Escribir para el examen", "de": "Für die Prüfung schreiben"}, "text": {"es": "«Beschreiben» pide un procedimiento concreto y ordenado: qué haces, con qué paquetes y cómo verificas. «Erläutern» pide una relación explicada: por qué una dependencia causa una falta observable. «Begründen» pide elegir y dar razones vinculadas a las restricciones del ticket, con consecuencia y límite. Comprende primero el caso en español y escribe después en alemán. No hay una frase mágica: se comparan relaciones técnicas, datos y alcance con criterios por punto. Las tareas abiertas quedan pendientes de comparación manual aunque contengan palabras del modelo. Reescribir después de ver una pista se registra como práctica con ayuda.", "de": "„Beschreiben“ verlangt ein konkretes geordnetes Vorgehen: was Sie tun, mit welchen Paketen und wie Sie prüfen. „Erläutern“ verlangt einen erklärten Zusammenhang: warum eine Abhängigkeit eine beobachtbare Lücke verursacht. „Begründen“ verlangt eine Entscheidung mit Gründen aus den Ticketbedingungen sowie Folge und Grenze. Verstehen Sie zuerst den Fall und formulieren Sie dann auf Deutsch. Es gibt keinen Zaubersatz: Technische Zusammenhänge, Angaben und Umfang werden anhand von Kriterien pro Punkt verglichen. Freie Antworten bleiben zur manuellen Prüfung offen, auch wenn Modellwörter vorkommen. Eine Überarbeitung nach einer Hilfe wird als unterstützte Übung gespeichert."}, "check": {"question": {"es": "¿Qué añade erläutern a listar pasos?", "de": "Was ergänzt erläutern gegenüber einer Schrittliste?"}, "answer": {"es": "La relación causal: qué dependencia produce qué falta y por qué.", "de": "Den Zusammenhang: Welche Abhängigkeit verursacht welche Lücke und warum?"}, "options": [{"es": "Relacionar la dependencia con su efecto y causa.", "de": "Abhängigkeit mit Wirkung und Ursache verknüpfen."}, {"es": "Repetir solo los nombres de los pasos.", "de": "Nur die Namen der Schritte wiederholen."}]}}], "cases": [{"n": 1, "title": {"es": "Leer el encargo sin inventar datos", "de": "Den Auftrag ohne Annahmen const demoCase={packages:[{id:'F',t:'01',kind:'F',readable:true,files:{plan:'v1',lista:'v1'}},{id:'I1',t:'02',kind:'I',readable:true,files:{plan:'v2',nota:'v1'},base:'F',prev:'F'},{id:'I2',t:'03',kind:'I',readable:true,files:{lista:'v2'},base:'F',prev:'I1'}],expected:{plan:'v2',lista:'v2',nota:'v1'}};
function simState(key){return state.simulations[key]||(state.simulations[key]={dest:{},steps:[],log:'',compare:false,changed:[]});}
function simulator(key,c,guided=false){const s=simState(key),files=Object.keys({...c.expected,...s.dest});return `<figure class="stage" data-simulator="${esc(key)}"><div class="figure-title">${txt('Copias → destino de prueba','Sicherungen → Testziel')}</div><div class="timeline">${c.packages.map(p=>`<div class="packet ${s.steps.includes(p.id)?'used':''} ${!p.readable?'bad':''}"><strong>${esc(p.id)}</strong><small>${esc(date(p.t))}</small><small>${esc(fileList(p.files))}</small><small>${p.readable?txt('Legible','Lesbar'):txt('Ilegible','Unlesbar')}</small></div>`).join('')}</div><div class="sim-tools"><label for="packet-${key}" class="small">${txt('Elegir paquete','Paket wählen')}</label><select id="packet-${key}">${c.packages.map(p=>`<option value="${esc(p.id)}">${esc(p.id)}</option>`).join('')}</select><button data-apply="${key}">${txt('Aplicar elegido','Auswahl einspielen')}</button>${guided?`<button data-step="next" data-guided="${key}" ${s.steps.length>=3?'disabled':''}>${txt('Siguiente paso guiado','Nächster geführter Schritt')}</button>`:''}<button data-reset="${key}">${txt('Vaciar destino','Ziel leeren')}</button><button data-compare="${key}">${txt('Comparar destino','Ziel vergleichen')}</button></div><div class="destination"><table><caption>${txt('DESTINO DE PRUEBA','TESTZIEL')}</caption><thead><tr><th scope="col">${txt('Archivo','Datei')}</th><th scope="col">${txt('Obtenido','Istversion')}</th></tr></thead><tbody>${files.map(f=>`<tr class="${s.changed.includes(f)?'changed':''}"><td>${esc(f)}</td><td>${esc(s.dest[f]||txt('falta','fehlt'))}</td></tr>`).join('')}</tbody></table></div><p class="sim-log" role="status">${esc(s.log||txt('Destino vacío. Elige qué aplicar.','Leeres Ziel. Wählen Sie den nächsten Schritt.'))}</p>${s.compare?`<div class="sim-compare">${files.map(f=>`<p>${esc(f)}: ${esc(s.dest[f]||txt('falta','fehlt'))} / ${txt('esperado','Soll')} ${esc(c.expected[f]||txt('fuera de alcance','außerhalb Umfang'))} · ${s.dest[f]===c.expected[f]?'OK':txt('diferencia','Abweichung')}</p>`).join('')}<p class="small">${txt('Esta comparación de versiones no ejecuta una prueba funcional real.','Dieser Versionsvergleich führt keinen echten Funktionstest aus.')}</p></div>`:''}<figcaption>${txt('Cada aplicación escribe solo los archivos del paquete. El destino muestra también los errores de selección y orden.','Jeder Schritt schreibt nur die Dateien im Paket. Das Ziel zeigt auch Auswahl- und Reihenfolgefehler.')}</figcaption></figure>`;}
function bindSimulator(c,key,guided=false){
 const apply=id=>{const s=simState(key),p=c.packages.find(x=>x.id===id);if(!p.readable){s.log=txt(`No se aplicó ${id}: paquete ilegible.`,` ${id} nicht eingespielt: Paket unlesbar.`);s.changed=[];}else{const fs=c.selective?Object.fromEntries(Object.entries(p.files).filter(([f])=>f===c.selective)):p.files;s.changed=Object.keys(fs).filter(f=>s.dest[f]!==fs[f]);Object.assign(s.dest,fs);s.steps.push(id);s.log=txt(`Aplicado ${id}. Secuencia: ${s.steps.join(' → ')}.`,` ${id} eingespielt. Reihenfolge: ${s.steps.join(' → ')}.`);}s.compare=false;if(c.n)help(c.n,'simulation');save();render();};
 $(`[data-apply="${key}"]`).onclick=()=>apply($(`#packet-${key}`).value);
 $(`[data-reset="${key}"]`).onclick=()=>{state.simulations[key]={dest:{},steps:[],log:'',compare:false,changed:[]};if(c.n)help(c.n,'simulation');save();render();};
 $(`[data-compare="${key}"]`).onclick=()=>{simState(key).compare=true;if(c.n)help(c.n,'simulation');save();render();};
 if(guided)$(`[data-guided="${key}"]`).onclick=()=>apply(c.packages[simState(key).steps.length]?.id||'I2');
}
function renderLesson(i){const l=DATA.lessons[i];$('#kicker').textContent=txt('COMPRENDER · '+l.letter,'VERSTEHEN · '+l.letter);$('#title').textContent=T(l.title);const sentences=T(l.text).split(/(?<=\.) (?=[A-ZÁÉÍÓÚÜ])/),paras=[];for(let j=0;j<sentences.length;j+=3)paras.push(sentences.slice(j,j+3).join(' '));$('#content').innerHTML=`${i===0?`<p class="small" style="margin-bottom:16px">${txt('Nachhilfe · 15.10.2026 · El objetivo: devolver los archivos al estado pedido y demostrarlo.','Nachhilfe · 15.10.2026 · Ziel: Dateien in den geforderten Zustand bringen und dies nachweisen.')}</p>`:''}<div class="intro-grid"><div class="reading">${paras.map(p=>`<p>${esc(p)}</p>`).join('')}${checks(l)}${i===0?`<details><summary>${txt('Cómo usar la sesión','So nutzen Sie die Sitzung')}</summary><p>${txt('Núcleo de 60 minutos: entender el mecanismo y elegir casos de reconstrucción y verificación. Después, 30 minutos con apoyo para escribir en alemán y exportar. La práctica extra se abre desde la barra lateral; no hace falta terminar todas las tareas.','60 Minuten Kern: Zusammenhänge verstehen und Rekonstruktions-/Prüffälle auswählen. Danach 30 Minuten mit Unterstützung für deutsche Antworten und Export. Zusatzpraxis ist über die Seitenleiste erreichbar; nicht alle Aufgaben müssen beendet werden.')}</p></details>`:''}</div><div>${lessonGraphic(i)}</div></div>`;if(i===3)bindSimulator(demoCase,'lesson',true);const key='lesson-'+i;$('#lessonChoice').onchange=e=>{state.answers[key]={choice:e.target.value};delete state.feedback[key];save();};$('#checkLesson').onclick=()=>{const v=$('#lessonChoice').value;state.feedback[key]=v===''?B('Elige una respuesta antes de comprobar.','Vor dem Prüfen eine Antwort auswählen.'):v==='0'?B('La elección coincide. Ahora explica por qué con tus palabras.','Die Auswahl stimmt. Erklären Sie jetzt in eigenen Worten warum.'):B('Revisa esta relación antes de seguir: '+l.check.answer.es,'Vor dem Weitergehen diesen Zusammenhang prüfen: '+l.check.answer.de);save();const details=$('.learner-check');render();$('.learner-check').open=true;};}
function material(c){
 let rows=c.packages.map(p=>[p.id+' · '+p.kind,date(p.t),p.base||'—',p.prev||'—',c.unknownContent?txt('Contenido no verificado','Inhalt ungeprüft'):fileList(p.files),c.unknownContent?txt('Sin verificar','Ungeprüft'):p.readable?txt('Íntegro','Intakt'):txt('Ilegible','Unlesbar')]);
 let result=table([txt('Copia','Paket'),txt('Instante','Zeitpunkt'),txt('Base','Basis'),txt('Anterior I','Vorgänger I'),txt('Contenido','Inhalt'),txt('Estado','Status')],rows,txt('Plan e inventario de copias','Sicherungsplan und Paketinhalt')).replace('class="table-wrap"','class="table-wrap packages"');
 if(c.unknownContent)result+=table([txt('Documento','Nachweis'),txt('Momento','Zeitpunkt'),txt('Versión declarada','Genannte Version')],[['Inventario A','28.09 · 18:00','ruta v2'],['Inventario B','28.09 · 18:00','ruta v3']],txt('Evidencias contradictorias','Widersprüchliche Nachweise'));
 else if(c.showReference)result+=table([txt('Instante','Zeitpunkt'),...Object.keys(c.snapshots[Object.keys(c.snapshots).at(-1)])],Object.entries(c.snapshots).map(([t,s])=>[date(t),...Object.keys(c.snapshots[Object.keys(c.snapshots).at(-1)]).map(f=>s[f]||txt('aún no existe','noch nicht vorhanden'))]),txt('Inventario de referencia conocido','Bekanntes Referenzinventar'));
 else result+=`<p class="helper-note">${txt('Reconstruye el destino a partir del contenido de los paquetes. Las casillas de respuesta están vacías: el inventario final no está resuelto aquí.','Rekonstruieren Sie das Ziel aus dem Paketinhalt. Die Antwortfelder sind leer: Das Endinventar ist hier nicht ausgefüllt.')}</p>`;
 if(c.observed)result+=table([txt('Archivo','Datei'),txt('Esperado','Soll'),txt('Obtenido','Ist')],Object.entries(c.expected).map(([f,v])=>[f,v,c.observed[f]||txt('falta','fehlt')]),txt('Protocolo obtenido · ','Istprotokoll · ')+c.observedSequence.join(' → '));
 if(c.n===11)result+=`<div class="warning"><code>Job 611 · Restore erfolgreich · ${Object.keys(c.observed).length} Datei</code></div>`;
 if(c.n===22)result+=table([txt('Prueba','Test'),txt('Resultado','Ergebnis')],[['Ping','OK'],['programa '+txt('abre','öffnet'),'OK'],['aula',txt('sin comprobar','ungeprüft')]],txt('Protocolo propuesto','Vorgeschlagenes Protokoll'));
 return result;
}
function inputField(c,f){const val=state.answers[c.n]?.[f.key]||'',id=`answer-${c.n}-${f.key}`,label=esc(T(f.label));let input;
 if(f.type==='choice')input=`<select id="${id}" data-answer="${esc(f.key)}"><option value="">${txt('Elegir…','Auswählen…')}</option>${f.options.map(o=>`<option value="${esc(o.value)}" ${val===o.value?'selected':''}>${esc(T(o.label))}</option>`).join('')}</select>`;
 else if(f.type==='free')input=`<textarea id="${id}" data-answer="${esc(f.key)}" lang="de" spellcheck="false">${esc(val)}</textarea>`;
 else input=`<input id="${id}" data-answer="${esc(f.key)}" value="${esc(val)}" autocomplete="off" spellcheck="false">`;
 const result=state.feedback[c.n]?.fields?.[f.key];return `<tr><td><label for="${id}">${label}</label><span class="field-points">${f.points} ${txt('punto(s)','Punkt(e)')}${f.type==='free'?' · '+txt('comparación manual','manueller Vergleich'):''}</span></td><td>${input}${result?`<span class="field-result ${result.status==='ok'?'ok':''}">${esc(T(result.text))}</span>`:''}</td></tr>`;
}
function openRubric(f){return `<p class="rubric-caption">${txt('Criterios orientativos propios · comparación manual','Eigene Orientierungskriterien · manueller Vergleich')}</p><ul class="rubrics">${f.rubrics.map(r=>`<li>${r.points} P · ${esc(T(r.text))}</li>`).join('')}</ul><p class="language-model" lang="de">${esc(f.model.de)}</p>${state.lang==='es'?`<p style="margin-top:12px">${esc(f.model.es)}</p>`:''}`;}
function solution(c){return `<h3>${txt('Solución y razones','Lösung und Gründe')}</h3><p>${esc(T(c.reason))}</p><dl>${c.fields.filter(f=>f.type!=='free').map(f=>`<dt>${esc(T(f.label))}</dt><dd>${esc(f.type==='sequence'?validSequences(c,f.goal).map(s=>s.join(' → ')).join(' / '):f.correct)}</dd>`).join('')}</dl>${c.fields.filter(f=>f.type==='free').map(openRubric).join('')}`;}
function renderCase(c){
 $('#kicker').textContent=txt((c.reserve?'PRÁCTICA EXTRA':'PRÁCTICA')+' · '+c.n,(c.reserve?'ZUSATZPRAXIS':'ÜBUNG')+' · '+c.n);$('#title').textContent=T(c.title);
 const h=state.help[c.n]||{},r=state.revealed[c.n]||{},fb=state.feedback[c.n];
 $('#content').innerHTML=`<div class="task-meta"><span class="tag">eigene Aufgabe, nicht offiziell IHK</span><span class="points">${c.points} ${txt('puntos orientativos','eigene Orientierungspunkte')}</span></div>${!storageOK?`<div class="warning">${txt('El guardado local está bloqueado. Las respuestas siguen en esta sesión; expórtalas antes de cerrar.','Lokales Speichern ist blockiert. Antworten bleiben in dieser Sitzung; vor dem Schließen exportieren.')}</div>`:''}<div class="ticket"><span class="ticket-label">AUSGANGSSITUATION · ${esc(T(c.sector))}</span><p>${esc(T(c.ticket))}</p></div><div class="work-grid"><section aria-label="${txt('Material del caso','Fallmaterial')}"><h2 class="material-title">${txt('Material del encargo','Auftragsunterlagen')}</h2>${material(c)}<p class="small">${txt('Modelo: versiones completas, sin borrados; copias al final del instante. Destino vacío salvo indicación. F=completa, I=incremental, D=diferencial.','Modell: vollständige Versionen, keine Löschungen; Sicherung am Ende des Zeitpunkts. Ziel leer, sofern nicht anders angegeben. F=voll, I=inkrementell, D=differenziell.')}</p>${c.sim?`<button data-show-sim="${c.n}" style="margin-top:16px">${txt('Abrir simulación opcional · con ayuda','Optionale Simulation öffnen · mit Hilfe')}</button>`:''}${r.sim?`<div style="margin-top:16px">${simulator('case'+c.n,c)}</div>`:''}</section><section class="sheet" aria-labelledby="answersTitle"><h2 id="answersTitle">${txt('Tus respuestas','Deine Antworten')}</h2>${c.guided?`<p class="helper-note">${txt('Práctica guiada: el arranque F está dado. Tras I1 y resultado final son respuestas diferentes.','Geführte Übung: F ist vorgegeben. Nach I1 und Endzustand sind verschiedene Antworten.')}</p>`:''}${c.fields.some(f=>f.type==='sequence')?`<p class="helper-note">${txt('Paquetes en orden, por ejemplo: F → I1. También se aceptan coma, + o espacios.','Pakete in Reihenfolge, z. B.: F → I1. Komma, + oder Leerzeichen sind ebenfalls gültig.')}</p>`:''}<table class="answer-table"><tbody>${c.fields.map(f=>inputField(c,f)).join('')}</tbody></table><div class="actions"><button class="primary" id="check">${txt('Comprobar respuesta','Antwort prüfen')}</button><button id="hint" ${h.hints>=2?'disabled':''}>${txt('Pista','Hinweis')} ${Math.min(2,(h.hints||0)+1)}</button><button id="solution">${txt('Ver solución','Lösung ansehen')}</button></div>${fb?`<div class="feedback ${fb.allOK?'good':''}" role="status" id="feedback">${esc(T(fb.text))}</div>`:''}${r.hint?`<div class="help-box" id="hintBox"><strong>${txt('Pista contextual','Kontexthinweis')}</strong><p>${esc(T(c.hints[(h.hints||1)-1]))}</p></div>`:''}${r.solution?`<div class="solution-box" id="solutionBox">${solution(c)}</div>`:''}<p class="helper-note" id="helpStatus">${txt('Registro:','Status:')} ${c.guided?txt('guiada desde el inicio','von Beginn an geführt'):assistance(c.n)==='solution'?txt('solución vista','Lösung angesehen'):assistance(c.n)==='supported'?txt('con ayuda','mit Hilfe'):txt('sin ayuda consultada','ohne abgerufene Hilfe')}. ${txt('Las respuestas libres nunca reciben nota automática.','Freie Antworten erhalten nie eine automatische Note.')}</p></section></div>`;
 $('#content').querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('input',()=>{state.answers[c.n]||={};state.answers[c.n][el.dataset.answer]=el.value;delete state.feedback[c.n];save();}));

 if(c.sim)$('[data-show-sim]').onclick=()=>{help(c.n,'simulation');state.revealed[c.n]||={};state.revealed[c.n].sim=true;save();render();};

const norm=v=>String(v??'').trim().toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
function parseSeq(v){return String(v).trim().toUpperCase().split(/\s*(?:→|->|,|;|\+|\/|\s+)\s*/).filter(Boolean);}
function runSequence(c,ids){const dest={};for(const id of ids){const p=c.packages.find(x=>x.id===id);if(!p||!p.readable)return null;Object.assign(dest,p.files);}return dest;}
function same(a,b){const ks=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);return [...ks].every(k=>a?.[k]===b?.[k]);}
function sequenceValid(c,ids,goal){
 if(!ids.length||new Set(ids).size!==ids.length)return false;const ps=ids.map(id=>c.packages.find(x=>x.id===id));if(ps.some(p=>!p||!p.readable||p.t>goal))return false;if(ps[0].kind!=='F'||ps.slice(1).some(p=>p.kind==='F'))return false;
 const base=ps[0].id,seen=new Set([base]);let last=ps[0].t;if(c.noMix&&ps.some(p=>p.kind==='I')&&ps.some(p=>p.kind==='D'))return false;
 for(const p of ps.slice(1)){if(p.base!==base||p.t<last||p.t>goal)return false;if(p.kind==='I'&&!seen.has(p.prev))return false;seen.add(p.id);last=p.t;}
 return same(runSequence(c,ids),c.snapshots[goal]);
}
function validSequences(c,goal){const found=[];const visit=ids=>{if(sequenceValid(c,ids,goal))found.push(ids);if(ids.length>=c.packages.length)return;for(const p of c.packages)if(!ids.includes(p.id)&&p.readable&&p.t<=goal){if(ids.length&&p.kind==='F')continue;visit([...ids,p.id]);}};for(const p of c.packages)if(p.kind==='F'&&p.readable&&p.t<=goal)visit([p.id]);return found;}
function exactField(f,val){if(f.type==='version'||norm(f.correct).match(/^v\d+$/))return norm(val).replace(/^v\s*/, 'v')===norm(f.correct)||('v'+norm(val))===norm(f.correct);if(f.key==='scope')return parseSeq(val).map(norm).filter(x=>!['y','und','&'].includes(x)).sort().join('|')==='catalogo|portada';if(f.key==='order')return parseSeq(val).join(',')==='P,A,V,R';return norm(val).replace(/v\s+(\d+)/g,'v$1')===norm(f.correct);}
function evaluateCase(c,answers){const fields={},det=c.fields.filter(f=>f.type!=='free'),free=c.fields.filter(f=>f.type==='free');let earned=0,blank=0,wrong=0;
 for(const f of c.fields){const v=answers[f.key]||'';if(!v.trim()){blank++;fields[f.key]={status:'empty',text:B('Respuesta vacía: completa este campo.','Leere Antwort: dieses Feld ausfüllen.')};continue;}if(f.type==='free'){fields[f.key]={status:'manual',text:B('Pendiente de comparación manual con criterios por punto. Sin nota automática.','Manueller Vergleich anhand der Punktkriterien ausstehend. Keine automatische Note.')};continue;}const ok=f.type==='sequence'?sequenceValid(c,parseSeq(v),f.goal):exactField(f,v);if(ok)earned+=f.points;else wrong++;fields[f.key]={status:ok?'ok':'wrong',text:ok?B('Correcto para este campo.','Für dieses Feld korrekt.'):B('No coincide con la evidencia. Revisa el corte, las versiones o las dependencias; abre una pista si lo necesitas.','Passt nicht zum Nachweis. Stichtag, Versionen oder Abhängigkeiten prüfen; bei Bedarf Hinweis öffnen.')};}
 const total=det.reduce((a,f)=>a+f.points,0),allOK=blank===0&&wrong===0&&free.length===0;
 let text=blank?B(`Quedan ${blank} campos vacíos. No se acepta una respuesta incompleta.`,` ${blank} Felder sind leer. Eine unvollständige Antwort wird nicht akzeptiert.`):wrong?B(`${wrong} campos necesitan revisión. Deterministas: ${earned}/${total} puntos orientativos.`,` ${wrong} Felder prüfen. Eindeutige Felder: ${earned}/${total} eigene Orientierungspunkte.`):free.length?B(`Campos deterministas: ${earned}/${total}. La escritura queda pendiente de comparación manual; no es una aprobación automática.`,`Eindeutige Felder: ${earned}/${total}. Die freie Antwort bleibt zum manuellen Vergleich offen; keine automatische Freigabe.`):B(`Todos los campos deterministas coinciden: ${earned}/${total} puntos orientativos. La prueba funcional real no se ejecuta aquí.`,`Alle eindeutigen Felder stimmen überein: ${earned}/${total} eigene Orientierungspunkte. Ein echter Funktionstest wird hier nicht ausgeführt.`);
 if(!blank&&!wrong&&free.length&&!det.length)text=B('Respuesta registrada. Pendiente de comparación manual con los criterios por punto; sin nota automática.','Antwort erfasst. Manueller Vergleich anhand der Punktkriterien ausstehend; keine automatische Note.');
 return {fields,earned,total,blank,wrong,manual:free.length,allOK,text};
}

 const saved=state.answers.official?.write||'',r=state.revealed.official||{};

eas nuevas usan esa relación para decidir a partir de un incidente, reconstruir versiones y justificar la aceptación. Sus datos, protocolos y puntos son propios.','Die offizielle Frage vergleicht Abhängigkeiten. Die neuen Aufgaben nutzen diesen Zusammenhang zur Entscheidung bei einem Vorfall, zur Versionsrekonstruktion und zur begründeten Abnahme. Daten, Protokolle und Punkte sind eigene.')}</p>${r.solution?`<div class="solution-box" id="official-model"><h3>${txt('Comparación con la solución oficial · paráfrasis','Vergleich mit der offiziellen Lösung · Paraphrase')}</h3><p>${txt('La primera incremental se refiere a la completa precedente; las incrementales siguientes se refieren a la incremental anterior. Todas las diferenciales se refieren a la completa precedente. La solución asigna 4 puntos al apartado completo.','Die erste inkrementelle Sicherung bezieht sich auf die vorherige Vollsicherung; spätere Inkremente auf das vorherige Inkrement. Jede Differenz bezieht sich auf die vorherige Vollsicherung. Die Lösung weist der ganzen Teilaufgabe 4 Punkte zu.')}</p><h3>${txt('Para comparar tu respuesta','Zum Vergleich Ihrer Antwort')}</h3><p>${txt('¿Explica correctamente ambas referencias? ¿Distingue la primera incremental de las siguientes? Estas preguntas de apoyo son propias; no se atribuye un reparto por criterio a la IHK.','Sind beide Bezugspunkte erklärt? Wird das erste Inkrement von späteren unterschieden? Diese Prüffragen sind eigene Hilfen; keine IHK-Punktaufteilung wird behauptet.')}</p></div>`:`<p class="helper-note">${txt('La comparación oficial está oculta hasta que la pidas.','Der offizielle Vergleich bleibt bis zur Anforderung verborgen.')}</p>`}</div></div>`;
 $('#official-write').oninput=e=>{state.answers.official={write:e.target.value};save();};$('#official-check').onclick=()=>{state.feedback.official=($('#official-write').value.trim()?B('Respuesta registrada; comparación manual pendiente. No hay nota automática.','Antwort erfasst; manueller Vergleich ausstehend. Keine automatische Note.'):B('Respuesta vacía; escribe antes de comparar.','Leere Antwort; vor dem Vergleich schreiben.'));state.attempts.official||=[];state.attempts.official.push({answers:state.answers.official||{},at:new Date().toISOString(),assistance:state.help.official?.solution?'solution':'unassisted'});save();render();};$('#official-solution').onclick=()=>{help('official','solution');state.revealed.official={solution:true};save();render();};
}

function renderSources(){
 $('#kicker').textContent=txt('FUENTES Y ALCANCE','QUELLEN UND UMFANG');$('#title').textContent=txt('En qué se basa este taller','Worauf der Workshop beruht');
 const sources=[['Grundstufe LF3–5 (2020), §3.8.2',B('PDF 89–92; impresas 365–368. Necesidad de copia, prueba de recuperación y definiciones de tipos. Se verificó el capítulo completo y sus figuras. Se corrige la errata sobre diferencial en destino vacío.','PDF 89–92; Druckseiten 365–368. Sicherungsbedarf, Rücksicherungstest und Sicherungsarten. Abschnitt und Abbildungen geprüft. Der Differenz-Fehler auf leerem Ziel wird korrigiert.')],['IHK · Sommer 2022 · KAIT · 4ea',B('Pregunta PDF p. 9; solución oficial PDF p. 5, 4 puntos. Referencia repetida separada. Las 24 tareas nuevas son propias y sus criterios orientativos no son criterios oficiales.','Aufgaben-PDF S. 9; offizielles Lösungs-PDF S. 5, 4 Punkte. Wiederholte Referenz getrennt. Alle 24 neuen Aufgaben und Orientierungskriterien sind eigene.')],['Rosenshine (2012) · IES / Pashler et al. (2007) · Nation (2007)',B('Pasos pequeños, ejemplo guiado, ayudas decrecientes, relación concreto–abstracto, comprensión antes de producción alemana. No se afirma retención ni un balance de idiomas medido.','Kleine Schritte, geführtes Beispiel, abnehmende Hilfen, konkrete/abstrakte Verknüpfung und Verständnis vor deutscher Produktion. Keine gemessene Behaltensleistung oder Sprachbalance behauptet.')],['Mayer (1999) · Johnson & Mayer (2012)',B('Texto próximo a su representación, señalización del cambio y eliminación de gráficos ajenos al contenido.','Text nahe der Darstellung, Hervorheben der Änderung und Weglassen sachfremder Grafiken.')],['Bareos · The Restore Command',B('Contraste con un producto mantenido: selección temporal, archivos y destino. Bareos puede reunir dependencias mediante catálogo; este HTML enseña un modelo explícito, no emula ese producto.','Vergleich mit gepflegtem Produkt: Zeit-, Datei- und Zielauswahl. Bareos kann Abhängigkeiten über den Katalog zusammenstellen; dieses HTML lehrt ein explizites Modell und emuliert das Produkt nicht.')],['Open University · OpenLearn · Week 7, 3.6',B('Describir un procedimiento concreto y los riesgos pendientes. Adaptado a incidencias ficticias, sin datos personales.','Konkretes Vorgehen und verbleibende Risiken beschreiben. Auf fiktive Vorfälle ohne personenbezogene Daten übertragen.')]];
